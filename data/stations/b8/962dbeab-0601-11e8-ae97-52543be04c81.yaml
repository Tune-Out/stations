  operator: Associazione Blackout — a self-managed listener/volunteer collective running Radio Blackout in Turin
  affiliations: Explicitly anti-fascist, anti-capitalist, anarchist/autonomist and anti-authoritarian; part of Italy's "radio libere" tradition and associated with the Turin social-centre and squatters' movement; no party, religious or governmental ties
  audience: Activists, anarchist/autonomist movements, students, alternative-music fans and labour/migrant-rights communities in Turin (Torino) and Piedmont; programming primarily in Italian
  format: Mixed talk and music — labour and political news ("L'Informazione di Blackout"), discussion shows on workers' rights, anti-fascism, migration and policing, plus music shows spanning punk, hardcore, reggae/dub, electronic, experimental, jazz and funk
  notes: Radio Blackout 105.25 FM is a long-running self-managed free radio station founded in 1992 in Turin, broadcasting on 105.25 MHz FM (with extension via DAB+ and streaming); it positions itself as a militant, anti-authoritarian voice giving airtime to social movements, occupied spaces, labour struggles and counter-cultural music; notable programmes include "Maximum Rock'n'Roll Radio" (punk), "OverJoy" (dub/reggae), "Chimera" (experimental soundscapes) and "Frittura mista" (labour focus); the station is sustained by listener donations and volunteer work rather than advertising or public funding.
  sources: http://radioblackout.org/, https://it.wikipedia.org/wiki/Radio_Blackout
