research:
  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: Radio Wnet sp. z o.o. (Warsaw), founded and led by journalist Krzysztof Skowroński (former director of Polish Radio's Program 1)
  affiliations: right-wing / national-conservative editorial line; closely associated with the post-Solidarity intelligentsia and broadly sympathetic to PiS (Law and Justice) and the Polish Catholic-conservative milieu, though formally independent
  audience: Polish-speaking conservative, patriotic and Catholic listeners in Poland and the diaspora (especially UK, US)
  format: talk radio with news, current affairs, political commentary, interviews, history, culture and classical/traditional Polish music; notable shows include "Poranek Wnet" (morning show), interviews by Skowroński and contributions from publicists associated with Gazeta Polska, Sieci, Do Rzeczy etc.
  notes: Radio Wnet launched in 2009 as one of the first Polish internet-only talk radios after Skowroński was removed from Polish Radio in the wake of disputes over editorial direction; the name "Wnet" plays on the Polish word for "soon" and the term "internet"; in 2017 it acquired FM frequencies (Warsaw 95.2 / Kraków 95.2 / Białystok 99.6 / Wrocław 96.8 and others), giving it limited terrestrial reach; it operates a London affiliate (Radio Wnet UK) for Polish émigrés; editorial stance is openly patriotic and right-leaning, frequently critical of EU institutions, Russia and what it describes as "left-liberal" media in Poland; financed by advertising, listener donations and subscriptions.
  sources: internal knowledge only
