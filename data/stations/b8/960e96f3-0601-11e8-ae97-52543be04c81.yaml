  notes: TechnoBase.FM is a German internet radio station launched on 1 January 2005 by Stefan 'DJ G4bby' Ulber and Claus 'Clausel' Maas under the motto 'We aRe oNe' and operated by BE 24-7 GmbH. It is the flagship of a seven-station network that spun off HouseTime.FM, HardBase.FM and TranceBase.FM in 2008, later adding CoreTime.FM, ClubTime.FM, TeaTime.FM and Replay.FM. The main channel specialises in hands up and hard dance, with around 100 volunteer DJs hosting scheduled live shows and automated playlists in between; the network reported roughly 20,000 simultaneous listeners in 2014 and releases compilation CDs through ZYX Music. It is web-only, financed by advertising, premium subscriptions and merchandise, with no terrestrial licence. The catalog's primary lw2.mp3.tb-group.fm URL no longer responds; the listen.technobase.fm and aacl.stream.tb-group.fm streams listed in the YAML work.
