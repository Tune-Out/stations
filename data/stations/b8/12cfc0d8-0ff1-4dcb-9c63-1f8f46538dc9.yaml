  operator: a self-managed (autogestita) collective based in the San Lorenzo quarter of Rome
  affiliations: explicitly far-left / anarchist / extra-parliamentary, aligned with the Italian autonomist and antagonist movements, antifascist, no commercial advertising and no institutional/party ownership
  audience: Italian-speaking listeners in Rome and Lazio plus a national activist audience online; politically engaged left-wing, social-movement, student and squat-scene audience
  format: politically committed talk radio - news from social movements, in-depth political analysis, antifascist documentary programmes, plus alternative, punk, hip-hop and world music
  notes: Radio Onda Rossa broadcasts on 87.9 MHz from Via dei Volsci in Rome's San Lorenzo neighbourhood and is one of the historic "radio libere" of Italy, founded in 1977 from within the autonomist student movement; it is run collectively, refuses advertising, and is widely regarded as a key voice of the Italian extra-parliamentary left, antifascism and grassroots/movements coverage.
