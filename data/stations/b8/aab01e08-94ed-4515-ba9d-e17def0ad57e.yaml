  operator: Radio Mitre S.A., a subsidiary of Grupo Clarín (the rebroadcast is hosted by third-party streaming aggregator eduneu.eu)
  affiliations: Grupo Clarín, Argentina's largest media conglomerate; widely characterised as editorially right-of-centre and historically opposed to Kirchnerist governments
  audience: General Argentine adult audience, Spanish-speaking, with primary signal in Buenos Aires (AM 790) and national reach via affiliates and online
  format: News, talk, sports and interview programming with morning drive flagship "Lanata sin filtro" historically (Jorge Lanata) and Magdalena Ruiz Guiñazú in earlier eras; "Cada Mañana" with Marcelo Longobardi was long-running
  notes: Radio Mitre is one of Argentina's oldest stations, founded in 1925 as LR6 Radio Mitre; acquired by Grupo Clarín in 1989 and consistently among the top-rated AM stations in Buenos Aires alongside Radio Continental and Radio 10; "Radio 5" appears to be an external streaming-platform label rather than an official Mitre brand
