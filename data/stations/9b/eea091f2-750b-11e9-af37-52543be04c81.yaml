  operator: Shanghai Media Group (上海文化广播影视集团 / SMG), a state-owned media conglomerate of the Shanghai Municipal Government and supervised by the Communist Party of China's propaganda system
  affiliations: Chinese state/Party media; subject to oversight by the National Radio and Television Administration (NRTA) and the CCP's Publicity Department
  audience: Mandarin Chinese-speaking listeners in Shanghai and the Yangtze River Delta region; also streamed nationally via apps such as Qingting FM (蜻蜓FM)
  format: 24-hour news and talk station — breaking news, current affairs, traffic, business, live press conferences, and listener call-ins centred on Shanghai and national news
  notes: Shanghai News Radio (上海新闻广播) traces its lineage to Shanghai People's Radio (上海人民广播电台) founded in 1949 shortly after the city's takeover by the PLA, and is one of SMG's flagship FM frequencies (FM 93.4 / AM 990 in Shanghai); as a state-owned outlet it operates within the editorial framework of the CCP-controlled Chinese media system, with content priorities including coverage of Party and government activities, economic news, and metropolitan service journalism; SMG is one of the largest media groups in China alongside CCTV and SARFT-era broadcasters.
