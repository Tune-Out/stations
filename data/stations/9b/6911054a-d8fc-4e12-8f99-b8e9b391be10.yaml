  operator: Curtin FM 100.1 - Curtin Radio Pty Ltd, a community-broadcasting subsidiary of Curtin University
  affiliations: Curtin University (Perth, Western Australia); Community Broadcasting Association of Australia (CBAA); regulated by ACMA under a community broadcasting licence
  audience: Perth metropolitan area listeners aged 40+; English language
  format: Adult contemporary "lifetime of music" format (classic hits, soft AC, jazz/standards across decades) with talk, community segments, and local news
  notes: Curtin FM 100.1 was established in 1982 at the (then) Western Australian Institute of Technology (now Curtin University) and broadcasts from the Curtin Bentley campus on 100.1 MHz to greater Perth; operates under an Australian community broadcasting licence and is supported by a mix of sponsorship announcements (capped under community-broadcasting rules), listener subscriptions, and university support; positions itself with the long-standing tagline "A lifetime of music" targeting mature audiences with classic pop, easy-listening, and "music for grown-ups"; one of Perth's higher-rated community stations, frequently ranking in the GfK survey for its target demographic.
