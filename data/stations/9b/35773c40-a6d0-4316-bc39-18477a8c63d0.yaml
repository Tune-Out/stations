  operator: BBC (British Broadcasting Corporation) — BBC Radio 3 / BBC Sounds
  affiliations: UK public-service broadcaster, funded by the licence fee under Royal Charter; regulated by Ofcom; politically and religiously independent
  audience: UK and international listeners seeking calming/relaxation classical music; English-language streaming-only service
  format: Continuous calming classical and chill — slow movements, ambient classical, neoclassical and minimalist works selected for relaxation and wellbeing
  notes: BBC Radio 3 Unwind is a digital extension of BBC Radio 3 launched on BBC Sounds on 21 November 2024 alongside BBC Radio 2 Piano Room and other "decade/mood" streams. It is part of the BBC's Digital First strategy to grow Sounds usage with curated chill/lo-fi-style brand extensions of flagship networks. Streamed via DAB+ in some areas and globally on BBC Sounds, it offers an automated/playlisted format of mostly classical music chosen for its calming qualities (Pärt, Einaudi, Glass, Debussy nocturnes, slow Mozart/Bach movements, contemporary neoclassical, Ola Gjeilo, Max Richter "Sleep" style cues). No presenters during ordinary hours; occasional sleep / mindfulness specials are flagged from the main Radio 3 schedule. As part of the BBC it is publicly funded by the UK TV licence fee, governed by the BBC Charter and Editorial Guidelines (impartiality, accuracy, no commercial advertising). The BBC's Royal Charter requires it to inform, educate and entertain.
  sources: internal knowledge of BBC Sounds and BBC Radio 3 (2024 launch of "Unwind" stream)
