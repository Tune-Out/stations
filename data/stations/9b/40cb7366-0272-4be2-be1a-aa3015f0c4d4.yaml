  notes: WIBA is a 5,000-watt AM station on 1310 kHz serving Madison, Wisconsin, first licensed on 2 April 1925 to the Capital Times newspaper and now owned by iHeartMedia. It runs a news/talk format branded 'Madison's News/Talk Station', with the local Madison in the Morning show, midday host Vicki McKenna and syndicated Premiere Networks programming. The station is the flagship for Wisconsin Badgers athletics and also carries Green Bay Packers games; studios and transmitter are in Fitchburg. It is a separate AM service from WIBA-FM 101.5, which the catalog holds independently.
