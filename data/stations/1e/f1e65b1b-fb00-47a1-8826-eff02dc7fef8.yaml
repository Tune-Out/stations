  nature: public broadcaster
  operator: Südwestrundfunk (SWR) — public-service broadcaster for Baden-Württemberg and Rhineland-Palatinate, member of the ARD consortium
  affiliations: public-law institution (Anstalt des öffentlichen Rechts) funded by the German Rundfunkbeitrag household licence fee; politically independent by statute, overseen by a pluralistic broadcasting council
  audience: news-oriented German speakers in southwest Germany (BW, RP) and nationwide via DAB+/web; commuters, decision-makers, news junkies
  format: 24/7 rolling news and information radio — bulletins on the hour and quarter-hour, in-depth interviews, regional and national news, business, sports, weather
  notes: SWR Aktuell launched as SWR Info / DASDING-Info / "SWR Aktuell" in its current form in 2017, building on the older "SWR cont.ra" rolling-news service; produced jointly with the ARD-aktuell newsroom in Hamburg and SWR's own newsrooms in Stuttgart, Mainz, Baden-Baden and regional studios; carried on DAB+ in BW/RP, online and via the ARD Audiothek; SWR is the second-largest ARD member after WDR; the broadcaster's news output is held to the public-service principles of impartiality and accuracy enshrined in the SWR Staatsvertrag.
