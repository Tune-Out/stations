  notes: SR 3 Saarlandwelle is the regional service of Saarländischer Rundfunk, the smallest ARD member, launched on 7 January 1980 and one of the most-listened-to radio programmes in Saarland with about 176,000 daily listeners (2026). It pairs a music mix of international oldies, evergreens and soft pop with strong regional journalism, including the daily 'Region am Mittag' and 'Region am Nachmittag' magazines, three daily news round-ups, weekend sport and Saarland dialect features. Funded by the German household broadcasting fee, it is available on FM, DAB+, cable, satellite and online.
