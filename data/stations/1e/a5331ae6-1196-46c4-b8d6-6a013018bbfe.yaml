  notes: Cinemix is a long-running French-run internet radio station dedicated to film music, streaming original scores and soundtracks from classic Hollywood to contemporary composers around the clock with no presenters. It is licensed by the French rights societies SACEM and SPRE and stays online through listener donations (the site notes more than 1,000 fans have donated); donors become VIP members with access to HD audio, song requests, library browsing and the secondary 'Cinemix Extras' channel of themed playlists. It also offers Android and iOS apps. The TorontoCast stream carried here is the same main Cinemix broadcast as the higher-voted canonical entry, whose own listen.cinemix.fr stream is currently down, so this working stream should be kept on merge.
