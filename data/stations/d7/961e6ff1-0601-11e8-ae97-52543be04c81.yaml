  notes: 977 Oldies is the classic-oldies channel of the long-running .977 internet radio network, an ad-supported online-only service distributed through Triton Digital's StreamTheWorld. Its playlist covers 1950s-1970s rock 'n' roll, Motown, doo-wop and early pop, programmed as an automated rotation without presenters. The network's original address, 977music.com, no longer resolves and now redirects to hitsradio.com, which carries the same family of themed channels alongside .977 Hitz, The 80s, The Mix, Smooth Jazz, Country, Comedy and Jamz. The audio stream remains live at 128 kbps MP3.
