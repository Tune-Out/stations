  notes: radio3 is the culture channel of Rundfunk Berlin-Brandenburg (rbb), the ARD public broadcaster for Berlin and Brandenburg. It launched on 1 December 2003 as Kulturradio, was renamed rbbKultur on 6 May 2019 and rebranded as radio3 on 2 April 2024 with a programme reform that introduced a topical, classical-free morning show while keeping classical music, features, literature and arts coverage through the rest of the day. It is available on FM, DAB+, cable, satellite and online, and funded by the German household broadcasting fee.
