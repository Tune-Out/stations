  format: News/talk radio with breakfast, mornings, afternoons and drive talk programmes, live sport (AFL Perth Wildcats/West Coast Eagles/Fremantle Dockers coverage) and overnight national talk
  notes: 6PR Perth began broadcasting on 882 kHz AM in 1931 (originally owned by Nicholson's Pty Ltd) and is one of the oldest commercial stations in WA; it became part of Macquarie Media, then Nine Radio after Nine Entertainment's 2019 merger with Fairfax, and in 2025 was sold along with the talk-radio division to private investors who rebranded the group as Tapt Media; current flagship programmes include "6PR Breakfast", "Mornings with Simon Beaumont", "Perth Live" and afternoon talk with Millsy & Karl, plus simulcast overnight programming with 3AW.
