  operator: Tapt Media (the rebranded former Nine Radio division spun off from Nine Entertainment Co.), part of the Talk Network alongside 2GB Sydney, 3AW Melbourne and 4BC Brisbane
  affiliations: none formally declared; the network's high-profile talk hosts have historically leaned conservative/centre-right in editorial tone, but no party affiliation
