  notes: Fantástica Internacional broadcasts on 103.9 MHz FM from Leticia, capital of Colombia's Amazonas department, and reaches the cross-border community of Tabatinga in Brazil; it operates as a small private commercial FM station serving an isolated Amazonian region of roughly 40,000 residents reachable only by air or river; programming mixes local news/talk with tropical, cumbia, vallenato, and Latin pop typical of small-market Colombian FM.
