  notes: Nightwave Plaza (plaza.one) is one of the longest-running and most prominent vaporwave streaming radio stations on the internet, launched in the mid-2010s during the genre's online cultural peak; features a distinctive aesthetic-driven website with chiptune-inspired retro web design including a virtual storefront/plaza interface, Japanese kanji decoration, and 80s-90s shopping-mall imagery characteristic of the vaporwave genre; the country tag of "Japan" likely reflects the genre's aesthetic association with Japanese 80s consumer culture rather than the actual broadcast origin (the operator appears to be based outside Japan); offers OGG and MP3 streams; the station has been cited in academic discussions of the vaporwave genre as a cultural touchstone
