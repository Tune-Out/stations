  operator: Spółdzielnia Dziennikarska "Wyspa" / Radio Nowy Świat sp. z o.o. (journalist-owned cooperative)
  affiliations: founded by former journalists of public Polskie Radio Trójka after the 2020 "Your Pain Is Better Than Mine" censorship scandal; broadly liberal-democratic / pro-European editorial line but not party-affiliated
  audience: Polish-speaking adults aged 30-60 nationwide via internet stream; intelligentsia, fans of curated music journalism
  format: Eclectic adult/album-oriented music journalism with author-presented shows, news, culture and political commentary; no commercials, no chart playlist; broadcasts only online (no FM)
  notes: Radio Nowy Świat launched on 11 July 2020 in Warsaw after a mass exodus of Polskie Radio Trójka staff protesting censorship of Kazik Staszewski's anti-government song "Twój ból jest lepszy niż mój"; the station is financed by listener donations via Patronite (Patronite-supported, advertising-free) and run as a journalist cooperative ("Wyspa"); among its founders/presenters are Piotr Stelmach, Piotr Baron, Hanna Lis, Wojciech Mann and other prominent Polish broadcasters; widely seen as a symbol of media independence during the 2020-2023 PiS-government era; the "256k" stream denotes the higher-bitrate (256 kbps) MP3 feed
  sources: internal knowledge only
