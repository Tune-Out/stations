  operator: Radio Televisyen Malaysia (RTM), Department of Broadcasting under Malaysia's Ministry of Communications
  affiliations: Malaysian federal government broadcaster; predominantly Malay-Muslim oriented programming reflecting the official ethos of "agama, bangsa, negara" (religion, race, nation)
  audience: Kelantan-state Malay-speaking listeners — listeners in Kota Bharu and surrounding districts plus diaspora online
  format: Regional Malay-language general-service station — local news, talk, religious (Islamic) segments, traditional Kelantanese culture and music including slow rock, classic Malay hits and local artists
  notes: Kelantan FM is the RTM state-network station for Kelantan, broadcasting from Kota Bharu on FM (most prominently 100.0 MHz Gunung Reng / 96.5 MHz Jeli area) and via the RTM Klik streaming platform; like all RTM stations it operates under the Ministry of Communications and carries scheduled national news bulletins, Friday sermons and government public-service announcements alongside Kelantanese dialect content; tagline historically associated with "Suara Hati Rakyat Kelantan".
