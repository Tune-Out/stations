  notes: Retro Rádió launched in 2013 after winning a national commercial radio licence tender from Hungary's media authority NMHH, taking over the 100.8 MHz Budapest frequency previously held by Class FM/Neo FM; operates as a national network with multiple terrestrial frequencies across Hungary and 24/7 streaming; programming mixes nostalgic hit-rotation with talk segments featuring well-known Hungarian radio personalities including veterans like Bochkor Gábor (formerly of Class FM Morning Show) and B. Tóth László (legendary Magyar Rádió DJ); ownership has been linked through Hungarian commercial radio circles and the station is one of two major national commercial stations alongside Best FM in the Hungarian radio market.
