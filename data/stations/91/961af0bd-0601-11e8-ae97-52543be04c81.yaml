  notes: W Radio is Colombia's leading news and talk station, broadcasting from Bogotá on HJCZ 690 kHz AM and HJLN 99.9 MHz FM with a national affiliate network. It launched on 7 April 2003 when Caracol Radio, owned by the Spanish group PRISA, relaunched the former Caracol Estéreo (on air since 1973) around Julio Sánchez Cristo's morning programme 'La W'. The format mixes agenda-setting political interviews and breaking news with adult contemporary music and conversational features; presenters have included Sánchez Cristo, Alberto Casas Santamaría and Camila Zuluaga. On 13 January 2026 W Radio merged with Caracol Radio to form a combined news operation branded W Caracol, expanding national news coverage. The StreamTheWorld feed is live.
