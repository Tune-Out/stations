  operator: Australian Radio Network (ARN) — a major Australian commercial radio group; the KIIS Network's Melbourne flagship on 101.1 MHz, originally launched as 3MMM/3MP and rebranded as KIIS in 2014 when ARN took it over and aligned it with the U.S.-licensed KIIS brand
