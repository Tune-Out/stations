  audience: General Melbourne mainstream adult contemporary / top 40 audience, primarily 25–54
  format: Adult/contemporary hit radio ("adult top 40") with high-profile breakfast and drive personalities
  notes: Programme line-up listed includes "KIIS Breakfast", "Gordie", "The Smallzy Show" (networked from KIIS 106.5 Sydney), "Will & Woody" (national drive), "Lowie Live", "True Crime Tonight", "Chris Page & Amy Gerard", "Saucy Secrets" and "Ben & Liam in the Morning"; podcasts distributed via the iHeart app, reflecting ARN's partnership with iHeartMedia for digital audio; KIIS Network is one of the dominant FM brands in metropolitan Australian commercial radio alongside Southern Cross Austereo's Hit and Nova networks.
