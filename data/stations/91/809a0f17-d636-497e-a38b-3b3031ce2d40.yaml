  notes: WKDM signed on in 1927 and broadcasts at 5,000 watts daytime / 5,000 watts nighttime directional from a Carlstadt, NJ transmitter; one of the oldest and most prominent Chinese-language stations in the United States; in 2015 a Reuters investigation revealed that the station was airing content produced by China Radio International through an intermediary, raising concerns about undisclosed Chinese government influence; the station also airs commercial advertising for the New York Chinese-American business community
