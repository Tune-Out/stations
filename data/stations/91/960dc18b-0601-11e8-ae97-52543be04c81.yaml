  notes: RMF 90s is a themed internet channel on the RMF ON streaming platform, operated by Radio Muzyka Fakty Grupa RMF sp. z o.o. sp. k. of Kraków — the company behind RMF FM, Poland's largest commercial radio network, along with RMF MAXX, RMF Classic and RMF24. Note that RMF stands for Radio Muzyka Fakty, not "Radios Muzyki Filmu". The channel is an automated, unpresented rotation of 1990s hits and is one of dozens of genre and decade streams in the RMF ON portfolio, including a companion RMF 90s Dance and an RMF 90s + FAKTY variant carrying news bulletins. Listening is free with advertising or ad-free via a paid RMF ON subscription; the channel is online and DAB-platform only, not a separate FM service.
