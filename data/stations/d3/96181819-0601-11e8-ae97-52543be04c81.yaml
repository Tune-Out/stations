  nature: public broadcaster
  operator: RAI - Radiotelevisione Italiana S.p.A. (Italian national public broadcasting company, majority-owned by the Italian Ministry of Economy and Finance)
  affiliations: state-owned public service broadcaster; operates under a service contract (contratto di servizio) with the Italian government and is overseen by a Parliamentary Supervisory Commission
  audience: Italian-speaking adult listeners (broadly 25-54) nationwide, with a focus on entertainment-leaning music and talk
  format: pop music, contemporary hits, comedy and entertainment talk shows; lighter and younger-skewing than the institutional Radio 1 (news) but more mainstream than Radio 3 (culture/classical)
  notes: Rai Radio 2 began broadcasting on 6 October 1924 as one of Italy's three founding national radio networks (originally Programma Nazionale, then Secondo Programma); historically the entertainment channel of Italian public radio, it is the home of long-running satirical programs such as "Il Ruggito del Coniglio" and "Caterpillar" and music shows like "I Sociopatici"; funded by the Italian television licence fee (canone RAI) plus advertising, broadcast on FM nationwide, DAB+, and online streaming; RAI's editorial independence has been a recurring subject of political debate given the Parliamentary oversight model.
