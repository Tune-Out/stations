  notes: Rai Radio 2 is the second national radio network of RAI, Italy's public broadcaster, based in Rome. Its origins go back to 21 March 1938 when EIAR launched a second programme; it later became Secondo Programma and then Radio 2. It is the entertainment-oriented channel of Italian public radio, combining comedy and talk programmes such as Il ruggito del coniglio, Caterpillar and 610 with contemporary pop music and its own news service GR2; Fiorello's Viva Radio2 was a landmark show. It is among Italy's highest-rated stations and is broadcast nationwide on FM, DAB+, digital terrestrial TV, satellite and via RaiPlay Sound, funded by the canone licence fee plus advertising.
