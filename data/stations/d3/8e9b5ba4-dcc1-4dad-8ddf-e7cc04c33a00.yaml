  affiliations: Privately held Brazilian media group; editorially associated with right-wing / conservative commentary, particularly since 2018
  audience: Brazilian mass audience, with the São Paulo flagship at 100.9 FM (formerly 100.5 FM until rebanding) and a national affiliate network
  format: News, talk, sports, journalism, music — flagship news/talk with strong opinion-commentary programming
  notes: Jovem Pan was founded in 1944 as Rádio Panamericana by Paulo Machado de Carvalho, and was rebranded "Jovem Pan" ("Young Pan") in 1976; the FM operation, Jovem Pan FM, originated in 1976 and became known for an irreverent music format alongside the AM news/talk station; the network expanded into satellite distribution (Jovem Pan Sat) and television (Jovem Pan News, launched 2021); during the late 2010s and 2020s the network became closely identified with center-right and right-wing political commentary and was the subject of judicial complaints and regulatory scrutiny by the TSE and Brazilian electoral authorities during the 2022 Lula-Bolsonaro election cycle.
