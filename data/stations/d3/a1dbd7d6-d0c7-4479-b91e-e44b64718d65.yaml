  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten); funded by the German broadcasting licence fee (Rundfunkbeitrag); no party/religious affiliation but subject to a public broadcasting council with civic/religious representation per the Bavarian Broadcasting Act
  audience: Older Bavarian and Alpine listeners interested in traditional Volksmusik, Heimat culture and regional identity
  format: Traditional Bavarian and Alpine folk music (Volksmusik, Volkstümliche Musik, Blasmusik, Schlager-Heimat), folk-music magazines and regional cultural features in Bavarian dialect
  notes: BR Heimat was launched on 1 October 2015 as a digital-only (DAB+/online) channel of Bayerischer Rundfunk in response to demand for traditional folk programming after such content was reduced on Bayern 1; broadcasts 24/7 from Munich, focusing on Bayerisch-Alpenländische Volksmusik, Brauchtum and Heimat-themed features; positions itself as the home of Bavarian/Alpine folk heritage on German public radio
