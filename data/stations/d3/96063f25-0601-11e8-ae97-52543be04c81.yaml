  notes: Classic FM is the UK's national commercial classical music station, launched on 7 September 1992 and owned by Global Media & Entertainment. It broadcasts on FM 99.9-101.9, DAB+ (switched from 128k DAB to 64k DAB+ in January 2024), Freeview, satellite and Global Player, reaching about 4.7 million weekly listeners (RAJAR, May 2025). Programming is accessible classical music with film, television and video-game scores, presented by names such as Alexander Armstrong, Myleene Klass, Jonathan Ross, Alan Titchmarsh and John Humphrys, with the annual Easter Hall of Fame listener poll and the video-game series High Score. Automated spin-offs Classic FM Calm and Classic FM Movies launched in September 2024.
