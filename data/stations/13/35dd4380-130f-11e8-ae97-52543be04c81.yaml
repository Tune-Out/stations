  notes: KFYO is a news/talk station on 790 AM in Lubbock, Texas, owned by Townsquare Media and simulcast on FM translator K236CP at 95.1 MHz. It first signed on in 1927 at Breckenridge and moved to Lubbock in 1932, and it carried Texas Tech Red Raiders football and basketball for decades until 1993. The schedule mixes local hosts, including the locally produced Steve Evans Show syndicated to Abilene, Amarillo and Wichita Falls, with ABC News Radio and Premiere/Westwood One talk programming.
