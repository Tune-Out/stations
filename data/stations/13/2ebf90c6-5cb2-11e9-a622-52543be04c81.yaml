  notes: HCJB ("Heralding Christ Jesus' Blessings") is one of the world's oldest and most storied missionary radio stations, founded in Quito, Ecuador on Christmas Day 1931 by American evangelical missionary Clarence W. Jones, becoming the first Christian missionary shortwave station in the world; its "La Voz de los Andes" (Voice of the Andes) broadcasts on FM 89.3 in Quito and historically reached Latin America via shortwave; the parent organization Reach Beyond continues mission radio work globally though shortwave broadcasts from Ecuador were largely phased out in the 2000s.
