  operator: Association Radio Maria France (registered French non-profit), headquartered in La Garde (Var)
  affiliations: Roman Catholic; member of the World Family of Radio Maria, the global Catholic network founded in Erba, Italy in 1987
  audience: French-speaking Catholic faithful in France (also reaching francophone Africa); French language
  format: 24/7 Catholic religious programming including daily Mass, Rosary, Liturgy of the Hours, biblical teaching, catechesis and spiritual formation
  notes: Self-described as "Une radio catholique, mariale, d'evangelisation" ("A Catholic, Marian, evangelising radio"); operates from offices in La Garde (230 rue Marc Delage, 83130) and a Paris studio at 4 rue de la Michodiere; flagship shows include "Catechese du Pere Mathieu" and "Formation Humaine"; opens with the Saint Louis-Marie Grignion de Montfort quote "Le Rosaire est l'arme la plus puissante pour toucher le Coeur de Jesus"; funded through listener donations rather than advertising and distributed via FM (where licensed), DAB+, web stream, podcasts and mobile apps.
