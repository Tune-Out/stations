  operator: Hessischer Rundfunk (HR) — public broadcasting corporation of the state of Hesse, Germany; member of the ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland)
  affiliations: ARD network; funded by the German broadcasting licence fee (Rundfunkbeitrag); statutorily independent under Hessian state media law
  audience: Adults in the German state of Hesse (Hessen) and the Rhine-Main region, especially the 30–59 demographic; German-speaking
  format: Adult contemporary / hot AC pop music station with regular news, traffic, weather and service journalism; hosts comedy and morning-show entertainment ("hr3 Morningshow")
  notes: hr3 launched on 1 October 1972 as Hessischer Rundfunk's third radio service and is the network's most popular and commercially-styled pop channel, broadcasting on FM throughout Hesse and via DAB+ and streaming; its slogan in recent years has been "hr3 – Pop and More"; notable programmes include the hr3 Morningshow, "hr3 Tagestour" and the long-running comedy segment "Comedy auf hr3".
