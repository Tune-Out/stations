  affiliations: Sunni Islamic religious broadcasting; widely associated in Turkish media with the Erenköy Cemaati (Cenab-ı Hak tradition / Naqshbandi Sufi current); broadly aligned with the conservative-religious mainstream of Turkish broadcasting
  audience: Turkish-speaking Muslim listeners, primarily in Istanbul and across Türkiye, also via DAB+ and global stream
  format: Islamic religious programming - Qur'an recitation, hadith and tafsir lessons, call-in religious advice, nasheeds (ilahi) and tasavvuf music, with talk shows on faith, family and culture
  notes: Akra FM (Akra Radyo) is one of Türkiye's most prominent Islamic radio stations, broadcasting on 92.3 MHz in Istanbul and across other Turkish cities; its programming follows a Sunni Islamic, broadly Naqshbandi-Sufi orientation typical of the Erenköy religious community, with regular contributions from senior religious scholars and tasavvuf (Sufi) music; the station avoids overt party-political content but, like much conservative Turkish religious media, has historically been viewed as sympathetic to the AKP-era cultural conservatism; it is part of the Akra Medya group, which also operates Akra TV.
