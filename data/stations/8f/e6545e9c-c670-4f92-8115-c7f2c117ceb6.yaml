  operator: Privately owned commercial radio station based in Thessaloniki, Greece; ownership has historically been linked to the Antenna Group / Kyriakou family in some periods but primarily operates as an independent regional broadcaster.
  affiliations: No known political, religious, or governmental affiliation.
  audience: Adult listeners 30+ in Thessaloniki and northern Greece, Greek-speaking.
  format: Oldies, classic pop and rock — "the greatest hits of the 70s, 80s and 90s" with Greek and international tracks; broadcasts on 89.0 MHz in Thessaloniki.
  notes: Rainbow 89 is one of Thessaloniki's long-running FM stations, broadcasting on 89.0 MHz since the 1990s; targets the Greek nostalgia/AOR audience with a playlist heavy on classic international rock, soft rock, and Greek pop classics; programming includes themed shows and weekend specials; part of the Greek post-deregulation private radio landscape that emerged after the state's broadcasting monopoly was broken in the late 1980s.
