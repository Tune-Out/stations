  operator: Radio Maria Uganda, member of the Radio Maria World Family — a Catholic broadcasting network coordinated by the Italy-based World Family of Radio Maria (founded 1987 in Erba, Lombardy).
  affiliations: Roman Catholic Church; under Ugandan ecclesiastical guidance and the global Radio Maria movement; sustained by listener donations and Catholic volunteers.
  audience: Catholic faithful and broader Ugandan listeners interested in Christian/Catholic content; broadcasts in English and local Ugandan languages.
  format: Catholic religious talk — Mass, Rosary, catechesis, scripture reflections, prayer, family/health programmes, sacred music; no commercial advertising.
  notes: Part of the Radio Maria World Family which now operates in 80+ countries; the global network's mission is "evangelisation, human promotion and Christian formation." Uganda is one of multiple sub-Saharan African Radio Maria stations. Funded entirely by listener donations rather than ads.
  sources: http://www.radiomaria.ug/ (returned 403), internal knowledge of the Radio Maria World Family
