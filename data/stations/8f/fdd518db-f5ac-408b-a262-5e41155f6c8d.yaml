  notes: Radio Don Bosco is the Salesian Catholic broadcaster of Madagascar, run from Antananarivo by the Salesians of Don Bosco under the slogan 'Plus je l'écoute, plus je l'aime'. Its schedule spans news (Filazam-baovao), faith programming, education, culture and entertainment in Malagasy, with French and English site editions, and it relays Vatican News and Zenit material. The station also operates a WebTV strand alongside the audio stream. This catalog row is a lower-vote copy of an entry already held under uuid 94f00da6 using the same onair15.xdevel.com stream host.
