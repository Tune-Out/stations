  notes: CVC Radio is an independent Cuban online-only station streaming 24/7 from Villa Clara province, presenting itself as 'Tu voz online'. Its Linktree traces the project back to a children's radio game in 2002 and a nightly programme launched in 2008, and it now pairs the Zeno.fm audio stream with a news blog (cvcradio-online.blogspot.com), a YouTube channel and WhatsApp/Facebook groups. Programming mixes local news with alternative music. Note the YAML records the state as Cienfuegos while the station's own profile places it in Villa Clara.
