  notes: Greatest Hits Radio (GHR) launched as a national brand in January 2019 when Bauer rolled up Absolute Radio's "Bauer Heritage" station and rebranded acquisitions from Wireless Group, UKRD, Lincs FM Group, and Celador; this West Midlands service originated as BRMB (1974), later 96.4 BRMB / Free Radio Birmingham under Orion Media / Free Radio Group, before Bauer acquired the group in 2019 and converted it to Greatest Hits Radio with split local breakfast and a networked daytime line-up; the brand sits inside Bauer's "Hits Radio Network" alongside Hits Radio, Magic and Absolute and recently moved its digital home to "hellorayo.co.uk" / the Rayo app and Rayo Premium subscription tier (£3.99/month); networked talent includes Ken Bruce (poached from BBC Radio 2 in 2023), Simon Mayo, Jackie Brambles, Andy Crane, and Stephanie Hirst.
