  notes: The SLBC Tamil National Service ("Thesiya Sevai" / தேசிய சேவை) is the Tamil-language flagship channel of the Sri Lanka Broadcasting Corporation, the country's national public broadcaster; SLBC traces its origins to Radio Ceylon (founded 1923, one of the oldest radio stations in Asia) and was reorganised as SLBC in 1967. The Tamil National Service has been an important cultural and linguistic institution for the Tamil community in Sri Lanka, providing news, devotional programming, dramas, and classical Carnatic and Tamil film music; during the Sri Lankan civil war (1983-2009) it carried official state programming for Tamil-speaking audiences. The stream URL here (zeno.fm relayed via the Indian-diaspora portal radiosindia.com) is a third-party rebroadcast.
