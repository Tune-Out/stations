  notes: "\"The Greatest Asian Radio Station In The World\" (slogan). World's first 24-hour commercial Asian radio station; launched November 5, 1989 as pioneering station for Asian demographic in UK. Based in Hounslow, West London; Britain's longest-running Asian community radio. Originally broadcast on former BBC/GLR frequency 1458 kHz (1994). Went into administration January 13, 2014; purchased by Lyca (mobile operator). Currently broadcasts on AM 963/972, nationwide DAB, mobile, tablet, online, smart speakers."
