  operator: Nine Radio (a division of Nine Entertainment Co.), as of mid-2025 with broadcast operations being managed/transitioned to Tapt Media following the announced sale of Nine's talk-radio network
  affiliations: Talk-radio network with sister stations 2GB Sydney, 3AW Melbourne and 6PR Perth; broadly perceived as right-of-centre / conservative-leaning in its talkback orientation
  audience: English-speaking adults 40+ in Brisbane and South-East Queensland; commuters and talkback listeners
  format: News, talk, sport and current affairs — "Brisbane's premier news and talk radio station"
  notes: 4BC began broadcasting on 16 August 1930 as one of Brisbane's earliest commercial radio stations, named for the Brisbane Broadcasting Company, and broadcasts on 882 kHz AM. Long owned by various commercial groups including the Bond Corporation and DMG Radio, it became part of Macquarie Radio Network and then in 2019 part of Nine Entertainment Co.'s Nine Radio division after Nine's merger with Fairfax Media. In 2025 Nine confirmed the sale of its talk-radio assets (2GB/3AW/4BC/6PR) to Tapt Media, with site copyright now reflecting "Tapt Media 2026." Current weekday lineup includes 4BC Breakfast, 4BC Mornings, 4BC Afternoons, 4BC Drive, "Sports Today with Adam Hawse" and overnights syndicated with Mike Jeffreys; networked content is also taken from sister station 2GB Sydney. The station has been the subject of regulatory scrutiny by ACMA over talkback complaints in line with the broader Nine/Macquarie talk-radio network.
  sources: internal knowledge only, https://www.4bc.com.au/
