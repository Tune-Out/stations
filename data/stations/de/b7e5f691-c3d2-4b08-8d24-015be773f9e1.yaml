  nature: state media
  operator: Entreprise Publique de Radiodiffusion Sonore — Radio Algérienne (EPRS), the Algerian state broadcaster under the Ministry of Communication
  affiliations: Government of Algeria; part of the wider Algerian public broadcasting system alongside EPTV (state TV); ties to APS state news agency
  audience: Algerian diaspora and international audiences interested in Algeria; multilingual reach via Arabic, Tamazight, English, Spanish and French
  format: International news, current affairs, cultural and political analysis for overseas audiences (RAI = Radio Algérie Internationale)
  notes: Radio Algérie Internationale (Idha'a al-Jaza'iriya al-Duwaliya) is the international shortwave/satellite/online service of Algerian state radio, comparable in role to France Médias Monde or Voice of America; broadcasts in multiple languages including Arabic, Tamazight (Berber), French, English and Spanish, covering Algerian government positions on African affairs, the Western Sahara question, the Sahel and Maghreb politics; Radio Algérienne dates to the 1956 nationalist clandestine "Voice of Free and Fighting Algeria" and was institutionalized after independence in 1962; the network operates 48+ regional public radio stations across Algeria's wilayas.
