  notes: ERT Second Programme (ΕΡΤ Δεύτερο Πρόγραμμα) is one of ERT's three main radio networks, complementing the First Programme with more in-depth current affairs, cultural analysis and niche programming. ERT operates under governance by the Hellenic Parliament and is funded primarily through radio licence fees (collected via electricity bills) plus governmental subsidy. The Second Programme broadcasts at national scope in Greek language and serves audiences seeking deeper analysis and cultural content. Streams via ERT's CDN at 256 kbps MP3, indicating high-quality professional streaming. The network underwent significant restructuring following the 2015 Greek economic crisis and is subject to ongoing regulatory oversight.
