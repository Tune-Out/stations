  operator: Société Atlantic Radio (private Moroccan media company); licensed by Morocco's HACA broadcasting regulator
  affiliations: none known; operates within the post-2006 liberalised Moroccan private radio sector
  audience: Moroccan urban professionals and decision-makers; French and Arabic speakers
  format: Talk-driven news/information and business format with daily current-affairs analysis and an evening music slot featuring blues, soul and rock
  notes: Atlantic Radio was one of the first private commercial stations licensed in Morocco after the 2006 deregulation that ended the SNRT/2M state-broadcasting monopoly; broadcasts in French primarily with some Arabic, targeting an upscale business audience similar to France's BFM Business; transmits FM across 21+ Moroccan cities including Casablanca (92.5), Rabat (106.9), Marrakech (90.5), Tangier (103.3) and Agadir (99.7); flagship shows include "Les Décodeurs Atlantic", "Les Experts" and "Atlantic Soir"; positions itself around "commentary on current events, enlightened perspectives, and idea confrontation".
