  notes: First Programme is the oldest continuously broadcasting Greek radio service (its lineage traces to the 1938 launch of Greek state radio); after the 2013 closure of ERT by the Samaras government it briefly went off-air with the rest of ERT, was carried under the transitional NERIT, and was restored in 2015 when the Tsipras government reopened ERT; it is funded through a public-broadcasting fee collected via electricity bills and is overseen by an independent board with parliamentary scrutiny
