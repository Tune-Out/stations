  notes: Country Radio is a Czech national commercial station devoted to country and folk music, on air since 15 August 1991 and broadcasting 24 hours a day. It is operated by Radio United Broadcasting, the group that also runs Radio Beat, Radio 1, Radio Kiss, Radio Spin and Signál rádio. Its flagship Prague frequency is 89.5 MHz at 5 kW, with a wide FM network between 87.6 and 107.7 MHz plus DAB+ and AM relays. The playlist runs well beyond mainstream country to folk, 1960s popular song, spiritual and gospel, Czech tramp music, bluegrass, Scottish, Irish and Australian folk, classic rock and roll and Southern rock, with roughly 70 percent of airtime given to Czech artists. The AAC stream on play.cz is live and identifies as COUNTRY RADIO.
