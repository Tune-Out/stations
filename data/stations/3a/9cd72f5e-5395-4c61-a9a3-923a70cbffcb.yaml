  notes: FM104 launched in 1989 as one of Ireland's first independent commercial local radio stations, broadcasting on 104.4 MHz across Dublin city and county; long-running flagship show "The Strawberry Alarm Clock" breakfast programme has been a Dublin radio institution; presenters have included Adrian Kennedy, Jeremy Dixon, Ray Foley, Dave Moore, Doireann Garrihy and Sue Walsh; the station was owned by Communicorp (Denis O'Brien) from 2007 to 2021, then sold to Bauer Media Audio Ireland alongside sister stations 98FM, Today FM, Spin 1038 and Newstalk; one of the most-listened-to commercial stations in Dublin with regular JNLR audience figures of 130,000+ weekly listeners; homepage was unreachable via WebFetch.
