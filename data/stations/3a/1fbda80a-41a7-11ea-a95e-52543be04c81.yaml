  notes: Comedy Radio is a Russian national talk-and-humour station launched on 15 October 2012 by Gazprom-Media Holding, replacing Pervoe Populyarnoe Radio on 102.5 FM in Moscow; it also airs in St Petersburg (95.9), Kazan (104.0) and over 3,000 localities in Russia and Belarus. Part of GPM Radio alongside Avtoradio, Energy and Humor FM, it builds its schedule around live talk shows such as 'Guten Morgen Freeman', 'Happy People' and the 'Kazibota Show', with sketches from TNT's Comedy Club, Comedy Woman and Nasha Russia between CHR pop music. The catalog stream on ic6.101.ru no longer responds; a working feed is https://pub0101.101.ru/stream/air/aac/64/202 (resolves to gpm.hostingradio.ru/gpm-comedyradio495.aacp). The catalog name carries the junk suffix 'new link'.
