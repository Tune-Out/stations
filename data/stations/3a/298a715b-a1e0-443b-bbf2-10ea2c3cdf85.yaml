  operator: Radio Aymara (independent indigenous community radio project based in La Paz, Bolivia)
  affiliations: indigenous Aymara cultural movement; not aligned with a single political party but rooted in indigenous-rights advocacy
  audience: Aymara people of the Bolivian Altiplano and diaspora; bilingual Aymara/Spanish speakers
  format: Aymara-language news, cultural programming, folk and Andean music, religious and community announcements
  notes: Radio Aymara broadcasts from the Bolivian highlands serving the indigenous Aymara community, which numbers roughly two million in Bolivia plus communities in Peru and Chile; its programming emphasizes preservation of Aymara language, cosmovision, and Pachamama-centred ritual, alongside news of campesino unions and indigenous-rights issues.
