  notes: Mood FM 92 is a privately-owned English-language Hot Adult Contemporary radio station broadcasting on 92 MHz in Amman, Jordan. Launched in the 2000s, it built its niche by targeting the educated, English-speaking, expat-friendly demographic in the Jordanian capital and surrounding governorates with a Western pop/dance format - rare in a market historically dominated by Arabic-language broadcasters. The station has been one of the consistently popular FM brands in Amman for that demographic and is part of the broader expansion of private commercial radio in Jordan since the 2003 liberalisation of broadcasting that allowed non-state stations.
