  operator: Ukrainian licensee of the Radio Record brand, operating radiorecord.com.ua as a Ukrainian-localised affiliate/franchise of the original Saint Petersburg-based Radio Record dance-music network
  affiliations: Brand affiliation with the Russian-founded Radio Record (launched in St Petersburg in 1995); the Ukrainian operation positions itself as an independent Ukrainian outlet, particularly after Russia's 2014 and 2022 invasions; no party-political or religious affiliation
  audience: Young Ukrainian club and dance-music listeners, with output in Ukrainian and the language of imported tracks (English, etc.)
  format: 24/7 electronic dance music (EDM) across multiple themed streams (Eurodance, EDM Hits, Club, Deep, Dance Core, Summer Dance, etc.)
  notes: Radio Record Ukraine operates a network of online dance-music streams branded after the long-running Radio Record family originally founded in Saint Petersburg in 1995 by Andrey Galaktionov, Mikhail Kozlov and Andrey Domnin; the Ukrainian site emphasises a Ukrainian identity ("Radio Record Ukraine / Radio Rekord Ukrayina") and a broad sub-genre lineup including house, trance, techno, progressive and EDM hits, targeting club-going listeners across Ukraine; following the 2022 full-scale Russian invasion, Ukrainian Record-branded operations distanced themselves from the Russian parent for both regulatory and reputational reasons
