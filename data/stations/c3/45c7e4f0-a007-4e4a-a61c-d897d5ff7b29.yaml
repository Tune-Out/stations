  notes: RADIO BOB! is a major German commercial rock radio brand launched in 2006 by Hit Radio FFH (Hessen) and now operated by RADIO BOB! GmbH & Co. KG with Regiocast as a key shareholder. It broadcasts on DAB+ nationally in Germany plus terrestrial FM frequencies in Hessen, NRW and Schleswig-Holstein, and runs over 30 web sub-channels covering classic rock, metal, Deutschrock, alternative, Mittelalter rock, 80s/90s/2000s, festival-themed streams (Wacken Radio, Rock am Ring Radio) and artist channels (Metallica, AC/DC). Slogans "Wenn Rock, dann BOB!" and "Weck den Rock in Dir". The brand also operates the BOBfest concert series and partners with Wacken Open Air and Rock am Ring/Park.
