  notes: Schwany 4 Blasmusik is part of the Schwany Media network, a Bavarian internet radio provider operating 15+ themed music channels including blasmusik (brass band), volksmusik (folk), schlager, and seasonal programming. The network describes itself as "der bunteste Musikmix im Web" (the most varied music mix online). Schwany channels are accessible via web streaming, TuneIn, radio.de, Phonostar, and Alexa voice command. The flagship channel is Hoamatwelle (Home Wave), emphasizing traditional Alpine culture and regional appeal.
