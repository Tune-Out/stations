  notes: National Dutch commercial radio station that launched in 1995 as Radio 10 Gold, later rebranded. Acquired by Talpa Media (now Talpa Network) and currently part of its radio cluster alongside Radio 538, Sky Radio, Veronica, and others. Known for annual listener-voted countdowns ("Top 4000", "Top 1500") and partnership with the Alpe d'HuZes charity. Operates multiple themed sub-channels (60s/70s Hits, 80s Hits, 90s Hits, Disco Classics, Soul).
