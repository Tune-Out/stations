  notes: BritCom 3 is one of about a dozen themed channels on Pumpkin FM, a small UK-based online network that describes itself as "imagination theatre for the mind" and rebroadcasts classic radio comedy and drama from the Golden Age of Radio. The channel runs vintage British radio comedy from the BBC Light Programme and Home Service era alongside sister streams BritCom 1, 2 and 4, American Gold, Crime Incorporated, Strange Radio and 1940s Radio Home Service. It is a hobbyist archive relay rather than a licensed broadcaster and is not affiliated with the BBC despite the provenance of its material.
