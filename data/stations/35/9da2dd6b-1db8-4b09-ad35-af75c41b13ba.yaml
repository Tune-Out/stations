  notes: Derti 107.7 FM is a Heraklion-based local FM station; its self-description "Το Ραδιόφωνο Δεν θέλει Να Το Δεις. Θέλει Να Το Φανταστείς" ("Radio doesn't want you to see it, it wants you to imagine it") signals an old-school music-radio ethos; despite sharing a name with the larger national Derti 98.6 (Athens) brand, this 107.7 outlet is an independent Cretan local station with its own blogspot site rather than part of the Athens network.
