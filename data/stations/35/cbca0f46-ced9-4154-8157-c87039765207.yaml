  nature: public broadcaster
  operator: Radio France Internationale (RFI), part of France Médias Monde, a French state-owned public-service company
  affiliations: French Republic — France Médias Monde is funded by the French state and operates under a contract of objectives and means (COM) with the French government; editorially independent under French public-broadcasting law; non-religious, non-partisan public mission
  audience: Global Francophone audience, with particular focus on Africa, the Maghreb, Asia, and the Americas; complemented by RFI's services in 16 other languages
  format: 24/7 international news, current affairs, politics, economy, sport, culture, music and magazine programming in French; flagship shows include "Journal de la mi-journée," "Priorité Santé," "8 milliards de voisins," "C'est pas du vent," and "Couleurs tropicales"
  notes: RFI was created in 1975 and traces its lineage to Radio Paris-Mondial and the colonial-era international services; since 2008 it has been part of France Médias Monde alongside France 24 and Monte Carlo Doualiya, with headquarters at Maison de la Radio in Issy-les-Moulineaux; RFI Monde is the main French-language stream distributed via FM relays across Francophone Africa, satellite, web, and partner radio stations; its editorial line follows French public-broadcasting standards of pluralism and verification, and the network has been restricted or banned in several countries (e.g., Mali 2022, Burkina Faso 2023, Niger 2023) following diplomatic tensions; the listed homepage karibshebdo.info is a third-party Haitian relay portal, not the official RFI site (rfi.fr).
  sources: internal knowledge only
