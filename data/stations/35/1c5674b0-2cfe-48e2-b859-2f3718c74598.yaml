  nature: public broadcaster
  operator: SRG SSR (Schweizerische Radio- und Fernsehgesellschaft / Société suisse de radiodiffusion et télévision) — Switzerland's public-service broadcaster, funded primarily by the Serafe household licence fee.
  affiliations: Public broadcaster; member of European Broadcasting Union (EBU); statutory mandate from the Swiss Confederation.
  audience: Swiss classical-music listeners across all four language regions; this is the Italian-language portal feed, but the station is identical across languages with announcements only at top of hour.
  format: 24/7 classical music — symphonies, concertos, sonatas, opera, ballet excerpts; minimal speech, news on the hour; presenter-less rotation.
  notes: Radio Swiss Classic launched in 2007 as part of SRG SSR's three commercial-free digital music streams (alongside Radio Swiss Pop and Radio Swiss Jazz). The streams are available only online and via DAB+, not on FM, and feature short news bulletins in the listener's chosen language (DE/FR/IT/EN). The station is widely regarded as one of Europe's best free classical streams for its breadth of catalogue and lack of advertising.
  sources: https://www.radioswissclassic.ch/it, internal knowledge of SRG SSR
