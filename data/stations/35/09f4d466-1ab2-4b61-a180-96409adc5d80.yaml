  operator: Radio Popular S.A. — COPE (Cadena de Ondas Populares Españolas)
  affiliations: Roman Catholic Church — owned by the Conferencia Episcopal Española (Spanish Episcopal Conference, the dioceses of Spain) together with religious orders (historically Jesuits and Dominicans); editorial line generally conservative / centre-right
  audience: Spanish-speaking listeners in the city and province of Sevilla (Andalusia); local audience for COPE's regional split
  format: Local news, talk, sports and religious programming — Sevilla regional opt-out ("COPE Más Sevilla") of the COPE network with local news, magazine shows and Real Betis / Sevilla FC football coverage, combined with national COPE programming
  notes: COPE describes itself as "un medio católico, comercial y generalista" (a Catholic, commercial, and general-interest outlet) emerging from "Iglesias diocesanas y de dos órdenes religiosas en España". One of Spain's three big talk-radio networks alongside Cadena SER and Onda Cero. Sister brands include TV channel TRECE, music stations Cadena 100, RockFM, and MegaStar FM. The "COPE Más" stations are secondary local frequencies devoted to local programming.
