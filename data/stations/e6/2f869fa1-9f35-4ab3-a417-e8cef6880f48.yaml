  format: Soft adult-contemporary "easy listening" pop format with romantic ballads and mellow hits; tagline "Mindre prat och mer av de mjuka hitsen du älskar" (Less talk, more of the soft hits you love)
  notes: Launched in 2001 in Stockholm under the Modern Times Group (MTG), Lugna Favoriter ("Calm Favourites") is one of Sweden's most-listened-to commercial radio stations and a flagship of the Viaplay Radio portfolio (which also includes Rix FM, Bandit Rock, Power Hit Radio, and Vinyl FM); the parent company was rebranded from MTG Radio to NENT Group's commercial radio division and now operates under Viaplay Group following the 2023 restructuring; key Stockholm frequency is 104.7 MHz, with FM presence in Gothenburg, Malmö, and several other Swedish cities; signature format emphasises minimal DJ chatter and continuous mellow music aimed at workday and morning listeners.
