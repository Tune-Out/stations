  format: Adult contemporary — Russian and Western pop/rock hits of the 1980s–2000s with light talk; tagline "Радио для тех, кто думает" ("radio for those who think")
  notes: Founded 7 June 1999 by Steve Edwards and others, "Радио 7 на семи холмах" (Radio 7 on Seven Hills) was an early Western/Russian AC station broadcasting on 104.7 FM Moscow and many regional frequencies; ownership passed through Mediahold (Mostelekom), then Russian Media Group, and as of the early 2020s sits with the Vyberi Radio holding; the seven hills nod refers to Moscow's "Seven Hills" geography paralleling Rome; programming centred on western and Russian adult pop/rock plus the long-running "На семи холмах" morning show; the station has not engaged in opposition political coverage and operates within Russian media-control constraints.
