  notes: Radio 7 na semi kholmakh (Radio 7 on Seven Hills) launched on 7 June 1992 as the English-language 'Radio 7 Moscow' for expatriates, moving to 104.7 FM in 1993 and rebranding with all-Russian programming in 1995. Since 2006 it has belonged to European Media Group (EMG), which paid about EUR 43 million for it and sister stations. It broadcasts a soft AC format of Russian and Western pop from the 1960s onward under the slogan 'Music for all times', with morning and evening shows, travel features and a film-club segment, and relays in more than 60 Russian cities plus Moldova. The earlier note attributing ownership to Vyberi Radio was incorrect.
