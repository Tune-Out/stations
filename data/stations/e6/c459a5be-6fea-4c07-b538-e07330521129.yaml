  nature: public broadcaster
  operator: Norsk rikskringkasting (NRK) — Norway's state-owned public service broadcaster
  affiliations: Norwegian state (wholly owned by the Ministry of Culture and Equality); EBU member; editorially independent under the NRK-plakaten public service mandate
  audience: Adult listeners in Nordland county and the wider Nordic / Sámi northern Norwegian region (Bodø, Mo i Rana, Mosjøen, Narvik, Lofoten, Vesterålen), Norwegian-language with regional dialects
  format: Regional opt-out of NRK P1 — Norway's flagship public-service radio channel; news bulletins, weather, traffic, regional features, sport, culture, and music aimed at a broad mainstream audience; carries the national P1 schedule with daily local windows produced from NRK Nordland's district office in Bodø
  notes: NRK was founded in 1933 and modelled on the BBC; it is funded since 2020 from the state budget (previously by a household licence fee, "kringkastingsavgift"); NRK P1 is the most-listened-to radio channel in Norway and runs 14 regional district offices ("distriktskontor") that provide local news, including NRK Nordland which covers one of Norway's geographically largest and northernmost counties; FM was shut down for national NRK channels in 2017, so distribution is now via DAB+ and online; editorial mandate is governed by the NRK-plakaten which requires impartiality, broad coverage and support for the Norwegian, Sámi and minority languages.
  sources: internal knowledge only
