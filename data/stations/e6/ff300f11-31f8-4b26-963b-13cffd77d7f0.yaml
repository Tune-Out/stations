  format: Oshiwambo-language adult contemporary music (kwaito, Afropop, gospel, local Namibian artists) with news, traffic, talk and community programming
  notes: Omulunga Radio is a private commercial station based in Windhoek and part of Namibia's Future Media Group, which also operates Radiowave and Kosmos 94.1; Omulunga (named after the makalani palm common to northern Namibia) broadcasts primarily in Oshiwambo, Namibia's most widely spoken language, and is one of the country's leading non-public-broadcaster alternatives to the state-owned NBC; programming covers community news, music, sport and call-in shows aimed at the Owambo audience; streamed online via the iono.fm platform.
