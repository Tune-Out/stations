  nature: public broadcaster
  operator: Schweizer Radio und Fernsehen (SRF), part of SRG SSR (Swiss Broadcasting Corporation)
  affiliations: Swiss public-service broadcasting, funded by household licence fees (Serafe AG) and limited advertising
  audience: German-speaking Switzerland, pop and rock-oriented listeners (broadly 20-49 demographic)
  format: Pop and rock music with news, comedy, live sessions, and music discovery; tagline emphasises "News, aktuellen Themen und viel Liebe für Pop & Rock"
  notes: Launched 1 November 1983 as DRS 3 (Deutschschweizer Radio 3), renamed Radio SRF 3 in 2012 when SRG SSR consolidated radio and TV under unified SRF brand; one of three main German-language SRG radio channels alongside SRF 1 and SRF 2 Kultur; known for live music broadcasts, the "Best Talent" monthly emerging-artist feature, the "Sounds!" alternative music programme, and the long-running "Focus" interview podcast; bound by SRG SSR's public-service mandate of impartiality and Swiss cultural promotion under the Federal Act on Radio and Television (RTVG).
