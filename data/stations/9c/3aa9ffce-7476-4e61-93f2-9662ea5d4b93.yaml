  notes: RFI Vietnamese (RFI Tieng Viet) is the Vietnamese-language service of Radio France Internationale, France's international public radio broadcaster; broadcasts have been ongoing since the 1960s with the Vietnamese service notably covering events around the Vietnam War; provides news from a non-Vietnamese government perspective, making it one of several foreign Vietnamese-language services (alongside BBC Vietnamese, VOA Vietnamese) frequently consulted by Vietnamese audiences seeking news outside state-controlled media; the Vietnamese government has periodically blocked or restricted RFI's Vietnamese website; produced from Paris with reporters across Asia; stream hosted via Infomaniak (Swiss CDN); part of France Medias Monde's overall multilingual public service mission.
