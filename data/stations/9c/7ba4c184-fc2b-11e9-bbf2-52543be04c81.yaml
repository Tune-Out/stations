  notes: The NPR Program Stream is a 24-hour national feed from NPR (National Public Radio), the Washington, DC-based non-profit public radio producer founded in 1970. It airs recordings of NPR's most recent programs after they have aired live on NPR member stations, such as Morning Edition, All Things Considered, Fresh Air and weekend shows, and NPR may interrupt the schedule for live coverage of breaking news. NPR itself is funded by member-station fees, corporate underwriting, foundations and listener donations and distributes to more than 1,000 member stations. The stream is hosted on StreamGuys and is a convenient way to hear NPR programming outside a local station's schedule.
