  operator: Australian Broadcasting Corporation (ABC)
  affiliations: ABC, Australia's national public broadcaster, funded by federal government appropriations and operating under the Australian Broadcasting Corporation Act 1983 with statutory editorial independence
  audience: Nationwide Australian adults seeking continuous news; English-language; also a designated parliamentary broadcast service
  format: 24-hour rolling news radio — bulletins, news analysis, live coverage of Australian and international events, and live broadcasts of Federal Parliament sittings (House of Representatives and Senate)
  notes: ABC NewsRadio launched 1994 as the Parliamentary and News Network (PNN), initially to fulfil ABC's statutory obligation to broadcast Parliament; carries BBC World Service, NPR and other international news during overnight hours; broadcasts on AM and FM frequencies in capital cities and regional centres plus DAB+ and online streaming; the ABC has at times faced political pressure and budget cuts from successive Australian governments and recurring debates over editorial impartiality.
