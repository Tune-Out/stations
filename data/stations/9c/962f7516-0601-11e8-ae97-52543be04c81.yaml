  notes: Caracol Radio is Colombia's oldest national radio network, founded in Bogotá on 2 September 1948 as Cadena Radial Colombiana and owned since 2003 by Spain's Grupo PRISA (Prisa Media). Its flagship news station broadcasts from Chapinero, Bogotá on 810 AM (HJCY) and 100.9 FM (HJGL) with relays across the country, anchored by the morning programme 6AM Hoy por Hoy. On 13 January 2026 Prisa merged its two news networks, integrating W Radio into Caracol Radio under Julio Sánchez Cristo's direction to cut costs amid falling advertising revenue, creating a single national news service. The wider group also runs music brands such as Tropicana, Los 40 and Radioacktiva. The catalog name carries call-sign and codec junk.
