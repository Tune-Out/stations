  notes: "\"Third Programme\" of ERT, the Greek public broadcaster; founded in 1954 as a high-culture station modeled on the BBC Third Programme; controversially shut down in June 2013 alongside the entire ERT during Greek austerity, then relaunched in 2015 after the Syriza government restored ERT; broadcasts on 95.6 FM in Athens and via DAB+; known for live recordings of the ERT National Symphony Orchestra and ERT Contemporary Music Orchestra; the channel's ethos centers on safeguarding artistic music heritage and contemporary composition."
