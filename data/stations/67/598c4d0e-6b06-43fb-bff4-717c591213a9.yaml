  nature: public broadcaster
  operator: British Broadcasting Corporation (BBC); the English service falls under BBC News division
  affiliations: editorially independent UK public service broadcaster, established by Royal Charter; partially funded by UK government grant-in-aid (from FCDO since 2014) in addition to the licence fee
  audience: Global English-speaking audience — claims a weekly reach of over 320 million people worldwide across all language services
  format: 24/7 international news, current affairs, analysis, documentaries, and cultural programming including flagship shows like Newshour, The Newsroom, World Business Report, World Have Your Say, Outlook, HARDtalk, From Our Own Correspondent and The Documentary.
  notes: The BBC World Service was founded on 19 December 1932 as the BBC Empire Service, expanding into vernacular language broadcasting before WWII (the Arabic service launched 1938). It broadcasts in over 40 languages and was historically funded by a grant from the UK Foreign and Commonwealth Office; since April 2014 it has been funded principally from the UK domestic TV licence fee, supplemented by government grant funding for specific language services. It is operationally independent of the UK government under the BBC Royal Charter, and is widely cited as one of the most trusted international news sources, though it has also faced criticism (and broadcast bans/jamming) from authoritarian states.
  sources: internal knowledge only
