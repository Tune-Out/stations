  nature: commercial
  operator: Astro Radio Sdn Bhd (403472-D), part of Astro Malaysia Holdings Berhad.
  affiliations: No explicit religious, governmental or party-political affiliations stated; Astro Malaysia is a Malaysian satellite-television and radio conglomerate controlled by Usaha Tegas Sdn Bhd, ultimately associated with Malaysian billionaire Ananda Krishnan; broadcasting in Malaysia is regulated by the Malaysian Communications and Multimedia Commission (MCMC).
  audience: Malay-speaking adults across Malaysia (Klang Valley, with regional ERA Sabah and ERA Sarawak editions for East Malaysia); broadly mass-market Bahasa Malaysia music audience.
  format: Contemporary Malay-language hit music ("Muzik Hit Terkini") with morning, drive-time and evening shows, contests, entertainment news and traffic updates.
  notes: ERA FM launched in the late 1990s as part of the Airtime Management & Programming (AMP) cluster that was later absorbed into Astro Radio. It is one of the highest-rated Bahasa Malaysia commercial stations alongside sister stations Hitz, Lite, Mix, Sinar, MY, Zayan and Melody, and competes with Media Prima's Hot FM. Notable shows from station materials include "3 Pagi ERA" (the breakfast trio show, 6-10 a.m.), "Petang ERA" and "Malam Chill ERA". Distribution is via terrestrial FM nationwide, the SYOK / Astro GO apps and online streaming (this stream is delivered through the Revma / iHeartMedia HLS CDN). The homepage era.syok.my redirects to era.je, reflecting Astro's recent ".je" short-domain branding for its radio stations.
  sources: https://era.je/
