  notes: LBC (London Broadcasting Company) is a major UK commercial talk and news radio station broadcasting on FM 97.3 and DAB in London, founded in 1973. Operated by Global Radio, one of Britain's largest commercial radio groups (also owns Heart, Capital, Smooth Radio brands). LBC is known for opinionated talk radio, particularly phone-in shows where listeners debate current political and social issues. Notable historical presenters include Nick Ferrari, Iain Dale, and James O'Brien. The station has a centrist-to-conservative editorial line and strong listener engagement. Broadcasts nationally via internet (shown as "National stream") at 48 kbps MP3. Consistently high listener numbers and cultural prominence in UK broadcast media.
