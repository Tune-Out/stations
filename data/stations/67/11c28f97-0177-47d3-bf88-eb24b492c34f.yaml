  operator: American University (a private university in Washington, D.C.); WAMU is licensed to AU and is an NPR member station
  affiliations: NPR (National Public Radio) member and major program affiliate; PRX; American University; no religious or partisan affiliation
  audience: Washington, D.C. metropolitan area (DC, MD, VA suburbs); English-speaking adults interested in news/talk; broadcasts at 88.5 FM with translators across the region
  format: News/talk public radio — NPR national newsmagazines (Morning Edition, All Things Considered), local news, and talk programming including the station-produced "1A"
  notes: Founded 1961 and licensed to American University, WAMU is the leading NPR news/talk station in the U.S. capital and one of the largest public-radio stations in the country by audience; it produces "1A" (host Jenn White, successor to "The Diane Rehm Show" which originated at WAMU and ran from 1979 to 2016) and previously produced the bluegrass program "Bluegrass Country" and the long-running "The Kojo Nnamdi Show"; in 2018 it acquired the local news site DCist (shut down briefly in 2024 amid layoffs and budget cuts that drew national attention to public-media funding); funded by listener contributions, university support, foundation grants, and corporate underwriting.
