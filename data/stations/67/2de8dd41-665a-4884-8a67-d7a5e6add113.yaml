  affiliations: Operates under Syrian broadcasting regulation; no overt political-party or religious affiliation stated, though private Syrian broadcasters generally operate with awareness of state media restrictions
  audience: Arabic-speaking listeners in Syria (particularly Damascus and Aleppo regions) and Syrian diaspora; younger adult/family audience
  format: Arabic music, entertainment, talk and lifestyle programming with a "breezes" (نسائم) light/uplifting positioning
  notes: Nasaem (نسائم, "Breezes") is a Damascus-based commercial Syrian radio station offering Arabic pop, classic Arabic music and entertainment-oriented programming; the website (nasaem.fm) features a live schedule, on-air program ticker and — notably — Syrian currency exchange rates, reflecting practical service content important to local listeners during periods of economic instability; the FM transmitter network covers parts of Syria with online streaming via Zeno.fm extending reach to expatriates; founded in the late 2010s as part of the limited private-radio sector that emerged after Syria's 2002 liberalisation of broadcast licensing; programming avoids overtly political content typical of stations operating within Syrian regulatory constraints; homepage fetch returned only minimal placeholder content (the site is a WordPress build with limited textual self-description).
