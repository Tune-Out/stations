  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland); funded by the German Rundfunkbeitrag household licence fee; chartered under Bavarian state media law (Bayerisches Rundfunkgesetz)
  audience: German-speaking adults aged 50+ in the Oberbayern (Upper Bavaria) administrative region around Munich
  format: Adult-contemporary/oldies-based news-and-music format with regional reporting (Regionalnachrichten) and traffic specific to Oberbayern
  notes: Bayern 1 is BR's flagship popular-radio service and consistently ranks as the most-listened-to radio programme in Bavaria; it splits into five regional opt-outs (Oberbayern, Niederbayern/Oberpfalz, Schwaben, Franken, Mainfranken) for local news and service; the channel traces its roots to BR's main "Bayerisches Programm" first broadcast in 1949 and was relabelled Bayern 1 in 1971 after the launch of Bayern 2; like all ARD stations it has an editorial independence guarantee enshrined in its founding law but its broadcasting council (Rundfunkrat) includes representatives from churches, unions and political groups, a structure occasionally criticised as "Staatsferne" (distance from the state) being insufficient.
