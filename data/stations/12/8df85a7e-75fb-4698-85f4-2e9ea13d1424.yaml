  format: 24/7 boleros and classic Latin romantic music - Cuban, Mexican, and Peruvian bolero artists from the 1940s-1960s golden age such as Trio Los Panchos, Lucho Gatica, Olga Guillot, Toña la Negra, Pedro Vargas, Daniel Santos, and the bolero ranchero tradition
  notes: FMLima.com is a Lima-based online radio aggregator/network that publishes multiple genre-specific Spanish-language streams (boleros, salsa, criollas, oldies, cumbias). The "Boleros Inolvidables" stream is dedicated to the bolero, the romantic ballad genre that originated in late-19th-century Cuba and spread across Latin America via Mexico's golden age of cinema and music. The network uses Zeno.fm cloud hosting which is free for stations and offers monetisation via inserted ads.
