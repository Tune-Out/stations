  notes: 'This entry is mislabelled. The catalogued feed is not an Entertainment Network India (Radio Mirchi) stream: the live Shoutcast headers on eu8.fastcast4u.com identify the mount as ''SUNO FM'' with icy-url suno1024.com, an unrelated South Asian broadcaster, and the entry carries no homepage at all. Radio Mirchi itself is a genuine and large network — ENIL launched Mirchi 98.3 FM in 2001 as India''s first private FM brand, it now runs dozens of stations for The Times Group and hosts the Mirchi Music Awards — but its official streams live on mirchi.in and Gaana, not on a third-party fastcast4u proxy. As catalogued, the station name and the audio being served do not match, so the record should be renamed to the station actually streaming or retired in favour of an official Mirchi feed.'
