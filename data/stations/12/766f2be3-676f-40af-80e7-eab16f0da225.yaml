  notes: 'French non-commercial web radio station dedicated entirely to 1980s music. Mission: "A rigorous selection of the best 80s music. Listen to 80s radio without ads." Ad-free format positioned as "La radio officielle des années 80" (The official 80s radio). Notable features: listener-driven programming with daily song selection (14h-18h weekdays), interviews with 80s artists, themed chronicles, and international audience from Switzerland, Quebec, Australia, and across France. Available via TuneIn, Deezer, Radioline, Radio.fr. Community engagement through SMS, web messages, and voice recordings.'
