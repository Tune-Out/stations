  notes: 'Ретро FM (Retro FM) is one of Russia''s largest commercial radio networks, headquartered in Moscow (88.3 FM) and St Petersburg (88.0 FM) and owned by European Media Group (EMG). It started as Radio Retro on 14 February 1996 and took its current name on 29 May 2003 after absorbing Radio Nostalgie. The format is "gold retro": Soviet, Russian and international hits from the 1960s to the 2000s in a roughly 65/35 foreign-to-Russian mix, aimed at listeners aged 35-65. Around 280 transmitters reach more than 1,800 Russian towns plus 40 transmitters in ten other countries, giving nearly 9 million daily listeners. This 128 kbps entry duplicates the higher-voted Ретро FM entry served from the same server.'
