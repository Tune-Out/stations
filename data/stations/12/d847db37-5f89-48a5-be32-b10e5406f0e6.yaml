  notes: 'Mixadance FM is an internet-only electronic music network running since 14 October 2004 and registered in Russia. Its flagship channel plays EDM and house, and it operates five sibling streams: Radio Samui (tropical chillout and deep house, tied to a Thailand-focused lifestyle portal), Fitness Radio, rAIdio-AI (royalty-free AI-generated music), Mixadance Relax (ambient and downtempo) and Mixadance Jazz (jazz and bossa nova). There is no terrestrial transmitter; the service is distributed via web player, a progressive web app and a DJ-mix archive. Programming is largely automated playlists rather than presenter-led curation.'
