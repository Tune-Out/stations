  notes: DWPM Radyo 630 (branded "DWPM Radyo SAIS TRENTA" — Filipino for "six thirty," its 630 kHz dial position) is a Manila-based AM news and talk station that launched in mid-2022, operated by Philippine Collective Media Corporation under MediaQuest Holdings (the media-investment arm linked to the PLDT/Smart group via the Beneficial Trust Fund); it took over the frequency formerly used by Radyo Inquirer and earlier by historic stations, and built its on-air roster from veteran Filipino broadcasters including former DZMM and DZRH presenters after the ABS-CBN franchise shutdown reshaped Philippine AM radio; programming covers news bulletins, talk, public service and call-in shows.
