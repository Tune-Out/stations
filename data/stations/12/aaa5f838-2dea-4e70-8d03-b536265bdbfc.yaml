  notes: Dakar Musique is an internet radio station operated by Sene Multimedia, a Dakar-based digital media outfit that streams several thematic Senegalese stations (Dakar Musique, Dakar Mbalax, etc.); the service is web-only (no FM broadcast license), commercial, and targets the Senegalese diaspora in France, North America, and elsewhere with continuous music programming featuring local artists like Youssou N'Dour, Baaba Maal, and contemporary mbalax and hip-hop performers; revenue model relies on streaming advertising and sponsorships.
