  format: 24/7 commercial-free streaming of dub techno — a sub-genre blending dub reggae's deep bass and echo effects with minimal techno rhythms; one of several themed channels (others include Psychedelic Trance, Chillout/Ambient, Progressive Psy)
  notes: Radio Schizoid was founded around 2009 by Sushant Shrivastav and is one of the longest-running Indian-origin internet radio brands focused on underground electronic music; the Dub Techno channel is part of a multi-station network that runs without traditional advertising, supported by listener donations and occasional Patreon-style backing; the network has consistently ranked among the most popular ambient/psy-trance internet stations globally.
