  notes: 'Radio Schizoid was a Mumbai-based independent internet radio project with four channels (Psychedelic Trance, Progressive Psytrance, Chillout/Ambient and Dub Techno) running non-stop, commercial-free electronic music. The station announced on its Facebook page that it would shut down, and directory sites now list it as no longer broadcasting; the stream server (94.130.113.214:8000) and the schizoid.in homepage both no longer respond. The Dub Techno channel is therefore dead with no known successor. Editorial note: appears to be defunct as of 2026-09-02.'
