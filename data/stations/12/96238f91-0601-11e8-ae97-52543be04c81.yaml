  nature: public broadcaster
  operator: Australian Broadcasting Corporation (ABC) — Australia's national public broadcaster, established by the Australian Broadcasting Corporation Act 1983.
  affiliations: Government-funded statutory authority but editorially independent; member of the European Broadcasting Union and Asia-Pacific Broadcasting Union; no religious or political party affiliation, mandated by charter to be impartial.
  audience: Australian classical music listeners, broadly older skewing but with growing younger digital audience; English-speaking, nationwide and global online.
  format: 24-hour classical music network — symphonic, chamber, opera, choral, contemporary classical and jazz; features live concerts, music news, and presenter-led programming.
  notes: ABC Classic (renamed from ABC Classic FM in 2019) launched in 1976 as Australia's national classical music network and broadcasts on FM frequencies across all Australian capital cities and regional centres plus DAB+, web stream, and the ABC listen app; notable programs include "Mornings with Russell Torrance," "Classic Drive," "Classic Breakfast," "New Waves" (contemporary classical) and the annual "Classic 100" countdown which polls listeners on themed top-100 lists; funded primarily by the Australian federal government via triennial appropriations; the ABC operates under a charter requiring independence from government and political influence, though funding levels are periodically a point of political contention.
  sources: internal knowledge only
