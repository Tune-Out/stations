  notes: RTÉ Radio 1 is the flagship station of RTÉ, Ireland's national public broadcaster established in 1926. Radio 1 is RTÉ's principal news and talk network, broadcasting 24/7 with news bulletins every hour, current affairs programs, live sports coverage (GAA, rugby, football) and magazine shows. The station reaches millions of Irish listeners daily and serves as the primary source for national news and current affairs. RTÉ is governed by a board appointed by the Irish Government and Minister for Media and is subject to the Broadcasting Act. RTÉ is funded primarily through the television licence fee (paid by Irish households) plus some government subvention. Streams via HLS at 128 kbps AAC. GPS coordinates center on Dublin, RTÉ headquarters location.
