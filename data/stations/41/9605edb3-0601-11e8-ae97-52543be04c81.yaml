  notes: WDR 5 is the ad-free spoken-word channel of Westdeutscher Rundfunk, the ARD public broadcaster for North Rhine-Westphalia, launched on 7 October 1991 as 'Nordrhein-Westfalen-Welle' on the former WDR 1 frequencies. It broadcasts news, culture, science and current affairs with flagship programmes such as Morgenecho, ZeitZeichen, Neugier genügt, Quarks and Scala, plus children's content (MausLive) and weekend features like Tischgespräch. Overnights carry the ARD-Infonacht from NDR. It reached about 737,000 listeners per hour-average in the MA II/2026 audience survey.
