  notes: Newstalk ZB is New Zealand's most-listened-to commercial radio station and the dominant talk-radio brand in the country, descended from Auckland's 1ZB (launched in 1936 as part of the public Commercial Broadcasting Service) and rebranded as a 24-hour talkback network in 1987; broadcasts nationally on AM and FM frequencies and via digital; flagship shows have included Mike Hosking Breakfast, Kerre Woodham Mornings, Heather du Plessis-Allan Drive and Marcus Lush Nights, plus Sports Talkback Weekend with hosts such as Jason Pine; long-running presenters Leighton Smith and Paul Holmes shaped its strongly opinionated centre-right talkback tradition; NZME (formed from APN News & Media's NZ operations in 2014) owns the station alongside The New Zealand Herald and a suite of music brands.
