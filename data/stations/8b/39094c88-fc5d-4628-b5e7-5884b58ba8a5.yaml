  operator: АО "ТРК ВС РФ" (Joint-Stock Television and Radio Broadcasting Company of the Armed Forces of the Russian Federation) — Zvezda Media Group
  affiliations: Russian Ministry of Defence; official broadcaster of the Russian Armed Forces
  audience: Russian-speaking general public with focus on military and defense-oriented listeners; broadcast nationally across the Russian Federation
  format: News, talk and analysis with strong military, patriotic and defense focus; notable programs include "Военная экспертиза" (Military Expertise), "Офицеры" (Officers), and "Фронты победы" (Fronts of Victory)
  notes: Radio Zvezda ("Star") launched in 2005 as the radio arm of the TV channel Zvezda, which was created in 2005 by the Russian Ministry of Defence; the broadcaster has been widely characterised as a state propaganda outlet promoting the Russian military's perspective and has been sanctioned by the EU and other Western jurisdictions in connection with the war in Ukraine; broadcasts on FM in Moscow (95.6) and many regions; distributed via TV, radio, app, Telegram, VK, Rutube, Yandex Music; sister services include "Звезда плюс" and "Звезда Live"; headquartered in Moscow.
