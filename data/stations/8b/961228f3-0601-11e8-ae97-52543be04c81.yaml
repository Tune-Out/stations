  operator: Bosnjacki Islamski Radio (BIR) d.o.o., affiliated with the Islamska Zajednica u Bosni i Hercegovini (Islamic Community in Bosnia and Herzegovina)
  affiliations: Islamic Community in Bosnia and Herzegovina (Sunni Hanafi tradition); Bosniak Muslim cultural and educational organisations
  audience: Bosniak Muslim listeners across Bosnia and Herzegovina; families, youth, and Islamic-studies audiences
  format: Islamic religious, educational, cultural and news programming - Quran recitations, lectures (vaz), children's and youth shows, ilahije & qaside (Islamic devotional music), national news
  notes: "Radio BIR was founded in 1995 in Sarajevo during the post-war period and is one of the most-listened-to Islamic media outlets in Bosnia and Herzegovina. It broadcasts terrestrially on FM in major cities including Sarajevo (96.5 MHz), Tuzla, Zenica, Mostar, Bihac and Banja Luka, with simulcast online. Programming is organised around six categories: religious (vjerski), educational (obrazovni), news/political, children/youth, music, and open programs. The station promotes Sunni Hanafi Islam in line with the official Islamic Community of BiH led by the Reisu-l-ulema in Sarajevo."
