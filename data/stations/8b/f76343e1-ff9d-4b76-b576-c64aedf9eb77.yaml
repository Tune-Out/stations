  notes: "\"Sawt al-Sha'ab\" (\"Voice of the People\") is the radio organ of the Lebanese Communist Party, founded in 1987 during the Lebanese civil war as a counter-broadcaster on the FM dial in Beirut; programming emphasizes civic participation and socioeconomic issues, with shows including حوار فاتن (Dialogue with Faten), المواطن والقانون (Citizen & Law), شباك المواطن (Citizen's Window) and اشكاليات (Problematic Issues); the station has covered Lebanon's political crises, civil-society protests and labour struggles from a left-wing, secular perspective."
