  notes: Latina Salsa is one of the themed web radios (alongside Bachata, Reggaeton, Kizomba, Fiesta and Love) of Latina, a French commercial Latin-music station founded in Paris in 1982 as Radio Latina and owned since 2006 by the Orléans-based Groupe 1981. Latina broadcasts on 99.0 FM in Paris and on FM in Marseille, Nice and other cities, plus DAB+, under the slogan 'Le Son Latino', and has ranked as the leading independent station in Île-de-France with around 400,000 daily listeners. The Salsa stream is an automated jukebox of salsa tracks without presenters.
