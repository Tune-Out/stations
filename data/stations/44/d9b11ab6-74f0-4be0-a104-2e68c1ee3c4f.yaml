  operator: Government of Nepal — Radio Nepal (सार्वजनिक सेवा प्रसारण नेपाल / Public Service Broadcasting Nepal), under the Ministry of Communication and Information Technology.
  affiliations: Government of Nepal; described by itself as supporting "democratic consolidation" and citizen-centred broadcasting.
  audience: National Nepali-speaking audience across all seven provinces (Koshi, Madhesh, Bagmati, Gandaki, Lumbini, Karnali, Sudurpashchim); also Nepali diaspora.
  format: National news, public service announcements, agricultural and development programming, cultural and music shows, parliamentary coverage in Nepali plus minority-language services.
  notes: Founded 2 April 1951 (just after Nepal's 1951 democratic revolution); among the oldest broadcasters in South Asia. Operates AM, shortwave and a network of FM relay stations nationwide, plus iOS/Android OTT apps. Plays a key role in disaster communication and government messaging. Long-running shows include "Nepali Bhasa ka Samachar" (Nepali news bulletin) and agricultural programme "Krishi Karyakram".
  sources: https://radionepal.gov.np/
