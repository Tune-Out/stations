  format: 24/7 instrumental film soundtracks and cinematic orchestral music (movie scores from Hollywood, European and animated films)
  notes: Webradio sub-channel of Klassik Radio, Germany's nationwide private classical-music broadcaster founded in 1990 and listed on the Frankfurt Stock Exchange since 2018; the "Movie" stream is one of dozens of themed Klassik Radio sub-channels and focuses exclusively on film scores by composers such as Hans Zimmer, John Williams, Ennio Morricone and Howard Shore; Klassik Radio AG also operates Klassik Radio Plus (ad-free paid streaming, ~3.75 euro/month) and "Klassik Radio Live in Concert" touring shows; the parent station positions itself as "Musik zum Wohlfuhlen und Entspannen" (music for well-being and relaxation) and broadcasts via DAB+ nationally in Germany and previously on UKW/FM in select cities.
