  nature: public broadcaster
  operator: Österreichischer Rundfunk (ORF), Austria's national public broadcasting corporation
  affiliations: Austrian public service media (financed via the ORF-Beitrag household contribution); editorially independent of party politics by statute; known for progressive cultural stance including LGBTQ+ inclusion ("Pride Mode")
  audience: Younger, culturally engaged Austrian listeners (typically 14-29) interested in indie, alternative, electronic and contemporary pop; broadcasts nationwide in Austria with bilingual (English/German) presentation
  format: '"Alternative mainstream" — indie & alternative pop/rock, electronic, hip-hop and world music, with talk segments, news and cultural commentary; flagship strands include the FM4 Soundpark for emerging Austrian acts and shows like "FM4 Auf Laut"'
  notes: FM4 launched on 16 January 1995 as ORF's youth-culture and alternative music station, taking over the frequencies of the former English-language Blue Danube Radio; broadcasts mostly in English during daytime and German in evenings; lauded internationally for breaking alternative acts and for its journalistic coverage of subculture, technology and politics; part of ORF's family of radio services (Ö1, Ö3, FM4 and regional Landesstudios).
  sources: https://fm4.orf.at/, https://en.wikipedia.org/wiki/FM4
