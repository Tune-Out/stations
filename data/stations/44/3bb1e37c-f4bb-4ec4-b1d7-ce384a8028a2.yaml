  operator: Independent volunteer-run community project based in Rangpur, northern Bangladesh
  affiliations: none; cultural-preservation focus on northern Bengali folk traditions
  audience: Bangla speakers in Uttorbango (northern Bangladesh) and the Bengali diaspora
  format: Bangla folk music - Bhawaiya, Baul and Lalon - plus pop, with artist tribute shows
  notes: Uttorbango Betar is a small volunteer online radio project broadcasting Bangla folk and pop from Rangpur in northern Bangladesh. Its stated ethos, "উত্তরের সংস্কৃতি, উত্তরের গান" (northern culture, northern songs), centres on preserving regional Bhawaiya folk traditions alongside Baul and Lalon repertoire. Programming includes tribute shows for figures such as Shah Abdul Karim, Azam Khan, Fakir Alamgir and Rathindranath Roy, plus a Friday Special. It streams through Zeno.fm and keeps its only web presence on a Google Sites page, which reflects its grassroots scale.
