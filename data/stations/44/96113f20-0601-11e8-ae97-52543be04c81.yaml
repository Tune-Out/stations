  notes: 'RadioParty.pl is an independent Polish internet radio station that has been streaming electronic dance music since 2004 and now runs six parallel channels: a main channel, House, Trance, Vocal Trance, DJ Mixes and Energy 2000. The DJ Mixes Party stream is the mix-format channel, playing full DJ sets scheduled by the station''s AutoPilot system, with named presenters and a published programme grid. The site is actively maintained — the schedule and listener shout-out board were current in September 2026 — and streams are offered at 128 kbps MP3 and 64 kbps AAC+. It is a web-only operation with no FM licence, funded independently rather than as part of a broadcast group.'
