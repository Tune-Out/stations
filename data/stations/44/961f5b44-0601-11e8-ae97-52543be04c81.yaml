  notes: Vikerraadio (literally "Rainbow Radio") is ERR's most popular radio channel, broadcasting from Tallinn (F. R. Kreutzwaldi 14) since 1967; the name was adopted in 1968; serves as Estonia's primary public-radio news and culture station, alongside ERR's Klassikaraadio (classical), Raadio 2 (youth/pop), Raadio 4 (Russian-language) and Raadio Tallinn (relay/news); flagship shows include "Päevatee", "Reporteritund", "Vikerhommik" and the Sunday cultural programme "Müstiline Venemaa"; consistently leads Estonian radio audience ratings; explicit mission to serve the public interest through informative, educational and cultural programming.
