  nature: public broadcaster
  operator: BBC (British Broadcasting Corporation), the UK's licence-fee-funded public service broadcaster
  affiliations: UK public service broadcaster operating under the BBC Royal Charter and Ofcom regulation; editorially independent of government and party politics
  audience: UK-wide adult listeners (skewing male, 35-64) seeking 24-hour news, current affairs and live sport commentary in English
  format: Rolling news, talk, phone-ins and live sports commentary (especially Premier League football, cricket, rugby, F1, Olympics)
  notes: BBC Radio 5 Live launched on 28 March 1994, replacing the short-lived BBC Radio 5; broadcasts on MW (909/693 kHz - the only remaining BBC national MW analogue service), DAB, digital television and via BBC Sounds and HLS streams; flagship programmes include "Wake Up to Money," "5 Live Breakfast," "Drive," "Stephen Nolan," "Up All Night" and live football commentaries on "5 Live Sport"; sister station BBC Radio 5 Sports Extra handles overflow sport coverage; the BBC's editorial guidelines require impartiality on all controversial matters and especially political and industrial issues.
