  nature: public broadcaster
  operator: NPO (Nederlandse Publieke Omroep / Dutch Public Broadcasting), with programming supplied by member broadcasters (KRO-NCRV, EO, AVROTROS, MAX, etc.)
  affiliations: Dutch public broadcasting system; member broadcasters include faith-based (EO – evangelical Protestant; KRO-NCRV – Catholic/Protestant heritage) and non-confessional organisations; funded primarily by Dutch government media budget
  audience: Dutch-speaking adult listeners (typically 50+) who favour evergreens and classic hits; national reach in the Netherlands
  format: Evergreens and oldies (1960s–80s pop and Dutch-language classics) plus human-interest, lifestyle and consumer-affairs talk programming; tagline "De beste Evergreens"
  notes: National public radio service originally launched in 1983 as Radio 5, repositioned in 2014 as Radio 5 Nostalgia and later returned to NPO Radio 5 branding. Distributed FM/DAB+/online. Hosts annual events such as the Evergreen Top 1000. Independent from political parties; subject to NPO editorial guidelines.
