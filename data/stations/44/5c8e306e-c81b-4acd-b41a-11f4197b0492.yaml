  nature: state media
  operator: Établissement Public de Radiodiffusion Sonore (EPRS / Radio Algérienne) — Algerian national public radio
  affiliations: Algerian state media; ultimately answerable to the Ministry of Communication of Algeria
  audience: Algerian nostalgia audience and Algerian/Maghrebi diaspora; broadcast in Arabic (and some French) under the "zaman" (= "the past / old times") banner
  format: '"Zaman" theme — golden-age Arab, Algerian (chaabi, kabyle, raï, andalous) and international classics from earlier decades, interspersed with cultural and heritage features'
  notes: "Zaman FM is a thematic digital/web channel of Radio Algérienne (Algeria's national public radio service), launched in 2017–2018 as part of a wave of streaming-only \"themed\" stations alongside Radio Coran, Jil FM, Radio Culture and others. As a unit of EPRS it is fully state-owned and state-funded (general state budget plus modest advertising); editorial line is supportive of the Algerian state and avoids opposition politics, consistent with Algeria's tightly regulated broadcasting sector where private domestic radio is not licensed. Programming focuses on the heritage of Algerian and Arab music: chaabi (Dahmane El Harrachi, El Hadj M'hamed El Anka), andalous, kabyle classics, raï golden era, plus Egyptian/Levantine standards (Oum Kalthoum, Fairouz, Abdel Halim). Carried via the radioalgerie.dz portal and apps; the name \"Zaman\" literally means \"olden times\"."
  sources: https://my.radioalgerie.dz/fr/zamanfm, internal knowledge of Algerian state broadcasting (EPRS)
