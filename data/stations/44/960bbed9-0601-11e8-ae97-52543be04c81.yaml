  nature: public broadcaster
  operator: Schweizer Radio und Fernsehen (SRF), the German-language division of SRG SSR (Schweizerische Radio- und Fernsehgesellschaft / Société suisse de radiodiffusion et télévision), Switzerland's national public service broadcaster
  affiliations: SRG SSR; member of the European Broadcasting Union (EBU); funded by the Serafe radio/TV licence fee plus advertising
  audience: Culturally engaged German-speaking Swiss listeners (deutschschweizer Bildungsbürgertum); served the German-language region (Deutschschweiz)
  format: Culture and knowledge channel ("Der Wissens- und Kultursender") — classical music, jazz, world music, literature, drama (Hörspiel), philosophy, religion, science and arts coverage; described as "hintergründig, überraschend, mutig und berührend" (substantive, surprising, bold and moving)
  notes: SRF 2 Kultur is the cultural radio channel of Switzerland's public broadcaster SRG SSR, broadcast over DAB+ and online (FM was switched off in Switzerland in 2024); the channel descends from the original Studio Bern second programme of the Schweizerischer Landessender and was renamed DRS 2 in 1985 then SRF 2 Kultur in 2012 when Schweizer Radio DRS and Schweizer Fernsehen merged into SRF; notable programming includes "Kultur kompakt" (current affairs in arts), "Hörspiel" (radio drama), "100 Sekunden Wissen," "Kulturplatz Talk," and coverage of competitions like Eurovision Young Musicians; SRG SSR is constitutionally mandated to serve all four Swiss language regions (German, French, Italian, Romansh) and funded primarily by the Serafe household licence fee (CHF 335/year), a system narrowly upheld in the 2018 "No Billag" referendum and again contested in subsequent referendums.
  sources: https://www.srf.ch/radio-srf-2-kultur
