  notes: Radio SRF 2 Kultur is the culture and knowledge channel of Schweizer Radio und Fernsehen, the German-language unit of Swiss public broadcaster SRG SSR. It descends from the second programme of the Schweizerischer Landessender, was named DRS 2 in 1985 and SRF 2 Kultur in 2012, and is distributed on DAB+ and online after Switzerland's FM switch-off. Programming spans classical music, jazz and world music, radio drama (Hörspiel), literature, philosophy, science and arts journalism, with signature strands such as Kultur kompakt and 100 Sekunden Wissen; SRG SSR is funded mainly by the Serafe household licence fee.
