  notes: Jazz Radio Classic Jazz is one of roughly 40 themed web streams operated by Jazz Radio, the Lyon-based French jazz network created in January 1996 (as Fréquence Jazz) by Christophe Mahé and owned by Espace Group. The parent station broadcasts on around 45 FM/DAB+ frequencies across France and Monaco and was the first French station devoted to jazz around the clock. The Classic Jazz channel is an automated, presenter-free selection of canonical jazz recordings streamed at 128 kbps MP3 via Infomaniak. It is a commercial, ad-supported operation with a specialist format and clear editorial identity.
