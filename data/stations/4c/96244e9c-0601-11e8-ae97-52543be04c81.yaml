  operator: Hardcore Radio, "Powered by Rige & Art of Dance" — independent Dutch hardcore-music brand based in Zuid-Holland
  affiliations: Linked to the Art of Dance event-promotion stable and the Masters of Hardcore (MOH) community
  audience: International hardcore-techno, hardstyle, frenchcore and gabber fans, with a Dutch core
  format: 24/7 hardcore electronic music — gabber, hardcore techno, hardstyle, frenchcore, terrorcore and uptempo — with themed DJ shows and live event broadcasts
  notes: Hardcore Radio is one of the longest-running internet stations dedicated to the Dutch-rooted hardcore-techno (gabber) scene; produced by event promoter Art of Dance together with Rige (web/tech partner), it streams DJ-hosted shows, label specials ("Bounce Back Records Special"), country features ("Irish Tempo", "Spanish Invasion") and chart shows including a "Hardtunes Top 10" and links to the Masters of Hardcore Top 100; the station also runs a merchandise shop and is widely cited within the international gabber community.
