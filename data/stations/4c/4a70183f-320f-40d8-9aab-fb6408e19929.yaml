  notes: "WNXP 91.1 FM is Nashville's music experience operated by Nashville Public Radio. Sister stations include WPLN News, Nashville Classical Radio (91 Classical), and WPLN International (AM). Programming features emerging and established artists, live session recordings, artist spotlights (e.g., Nashville Artist of the Month), music trivia nights. Notable features: WNXP Summer Line Series (free outdoor concerts), Music Citizens podcast, The Weekly Record newsletter. Partner with NPR Music. As a public broadcaster, relies on listener support following recent federal funding reductions."
