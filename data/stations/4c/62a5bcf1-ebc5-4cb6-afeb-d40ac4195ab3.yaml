  notes: Hits of Kishore Kumar is one channel on Hits Of Bollywood, an independent online portal that runs a set of Hindi film-music streams — HOB, NHOB, Maayboli, Madhur Sangeet — alongside single-artist tribute channels for Mohammed Rafi, Kishore Kumar, Asha Bhosle and Lata Mangeshkar. This channel plays the catalogue of Kishore Kumar, the singer, actor and composer who was one of the defining playback voices of Hindi cinema from the 1950s to the 1980s. The portal supplements its streams with articles, reviews and artist features on Indian film-music heritage and offers mobile apps for all its stations; its copyright notice runs to 2025 and the site describes itself as existing for the entertainment and promotion of Hindi music globally. The catalogue name misspells the singer's name, which is transliterated Kishore.
