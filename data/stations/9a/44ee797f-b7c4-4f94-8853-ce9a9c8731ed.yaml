  nature: public broadcaster
  operator: Westdeutscher Rundfunk (WDR), the public broadcaster of North Rhine-Westphalia; member of the ARD consortium
  affiliations: German public-service broadcasting (ARD); funded by the Rundfunkbeitrag household licence fee; no commercial advertising on radio; politically independent by statute, supervised by a Rundfunkrat (broadcasting council) representing societal groups
  audience: German-speaking listeners in North Rhine-Westphalia and nationwide, primarily 50+ demographic
  format: Oldies and Schlager music station - German-language hits ("Schlager"), oldies from the 1960s-1980s, easy-listening evergreens, light news bulletins
  notes: WDR 4 launched 1 January 1984 as WDR's fourth radio channel; the Schlager/oldies repositioning catered to an older audience after WDR 2 went pop and WDR 5 became info-talk; broadcasts on FM, DAB+, cable, satellite and online; one of Germany's most-listened-to Schlager/oldies stations; headquartered in Cologne
