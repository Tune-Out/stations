  notes: Top Gold Radio is the gold and oldies sister channel of Top Albania Radio in Tirana. The parent station began broadcasting on 14 February 1998 and is owned by Top Media Group, controlled by the Hoxha family with a minority stake held by Zhuljeta Lamaj, the same group behind Top Channel television. Top Gold carries Albanian and international catalogue hits rather than the parent's current-hits and talk mix. It is a separate channel of the broadcaster, not a variant of the Top Albania Radio stream already in the catalog.
