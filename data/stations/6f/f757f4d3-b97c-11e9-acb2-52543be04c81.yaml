  audience: East Frisian (Ostfriesland) coast and inland Lower Saxony, German-speaking adults 30+
  format: Adult contemporary pop with strong regional news, weather (especially tides and ferry info), traffic, and local content for the East Frisian/North Sea coast region
  notes: Radio Nordseewelle launched on 1 September 2009 as a private regional station for the East Frisian region of Lower Saxony, broadcasting on FM (96.0/98.6/100.8 etc.) from studios in Norden and Aurich; programming emphasises locally relevant content such as North Sea weather, tide tables, and ferry connections to the East Frisian islands alongside mainstream pop oldies and current hits; it operates under a private commercial licence from the Niedersächsische Landesmedienanstalt (NLM) and is funded by advertising.
