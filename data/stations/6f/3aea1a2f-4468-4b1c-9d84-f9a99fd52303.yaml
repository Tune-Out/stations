  audience: Spanish electronic-music fans; specifically clubbers/EDM listeners interested in deep techno and underground electronic styles; Spanish-language presentation but content is mostly instrumental and accessible worldwide.
  format: Non-stop "Deep Techno" — a sub-channel of Loca FM playing deep, hypnotic, melodic and underground techno from European and global producers.
  notes: Loca FM is one of Spain's best-known electronic/dance radio brands, founded in 1992 by DJ Jesús Lara and historically broadcast over FM in Madrid (98.5 MHz) and other Spanish cities, alongside an extensive web-radio network. The Deep Techno channel is one of dozens of themed streams (Dance, House, Tech House, Trance, Techno, Big Room, Deep House, Melodic Techno, Hard Techno, Industrial, Drum&Bass, Loca 80's, Loca 90's, etc.). The brand's tagline "Disfruta del sonido Loca" emphasizes a curated EDM listening experience; Loca FM is also active as a record label, event organizer, and clubbing brand.
