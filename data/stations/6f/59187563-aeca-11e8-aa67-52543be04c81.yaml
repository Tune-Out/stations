  audience: German-speaking adults in Lower Saxony, Hamburg, Schleswig-Holstein and Mecklenburg-Vorpommern interested in classical music, arts, literature and cultural commentary
  format: Cultural radio — classical music, jazz, opera, audio drama (Hörspiel), literature, philosophy, arts journalism, and cultural news
  notes: NDR Kultur is the dedicated culture and classical music channel of Norddeutscher Rundfunk, the ARD member serving four northern German states; broadcast on FM and DAB+ across northern Germany and the DAB+ national multiplex, plus DVB and online; flagship programmes include "Klassisch in den Tag," "Am Morgen vorgelesen," "Neue CDs," and arts magazine "Journal" along with extensive Hörspiel (radio drama) tradition that is a hallmark of German public radio; NDR is governed by an independent Rundfunkrat (Broadcasting Council) representing civil society and is bound by the public-service Staatsvertrag requiring political balance and independence from government.
