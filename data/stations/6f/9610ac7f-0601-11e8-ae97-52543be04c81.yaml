  notes: Laut.FM 1000 Oldies is a hobby/community internet station ("Hobby-Webradio") branded "1000 Oldies — Der Soundtrack unseres Lebens" (the soundtrack of our lives). It is operated by an independent user on laut.fm, the major German user-generated streaming platform run by LAUT AG (founded 2000). The station plays oldies from the 50s, 60s, 70s, 80s, and 90s — heavy rotation includes ABBA, The Beatles, Bee Gees, Elvis Presley, Fleetwood Mac, Madonna, and Cliff Richard. The site solicits listener donations and is part of a broader 1000webradios.teamff.de network of sister oldies channels.
