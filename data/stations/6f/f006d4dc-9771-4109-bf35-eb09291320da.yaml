  notes: LR6 Radio Mitre, broadcasting on 790 kHz AM since September 5, 1925, is one of Argentina's oldest and most historic radio stations; owned by Grupo Clarin (Argentina's largest media conglomerate) and operated through subsidiary Radio Mitre S.A. as part of the Cienradios digital platform; flagship programs have included "Lanata sin Filtro" (Jorge Lanata) and "Cada Mañana" with Marcelo Longobardi; consistently among the highest-rated AM stations in Argentina; widely regarded as editorially aligned with Clarin's political stance, often critical of Kirchnerist/Peronist governments; broadcasts a relay network across multiple Argentine provinces.
