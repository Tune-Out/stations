  operator: sunshine live media GmbH, based in Mannheim, Baden-Württemberg
  affiliations: none known; private commercial broadcaster licensed by the Landesanstalt für Kommunikation Baden-Württemberg (LFK); no political, governmental or religious ties
  audience: German-speaking electronic-dance-music fans aged roughly 14–49 across Germany, Austria and Switzerland; broadcast on FM/DAB+ in Baden-Württemberg (including Mannheim/Heidelberg, Stuttgart, Karlsruhe), nationwide on DAB+ since 2011, plus online and via mobile apps
  format: 24/7 electronic dance music — trance, techno, house, hands-up, EDM, drum & bass and related sub-genres, with DJ mix shows, festival broadcasts and club-culture news ("HOME OF THE DJs")
  notes: Founded in 1989 as Radio Sunshine in Sinsheim and relaunched as sunshine live in 1998 with an all-electronic format, it was Germany's first nationally distributed DAB+ commercial music station after the relaunch of digital radio in 2011 and is widely regarded as Germany's leading EDM broadcaster; the station has deep ties to the German club/festival scene with annual broadcasts and stages at events such as Mayday, Nature One, Time Warp, Parookaville, Airbeat-One and Zürich's Street Parade, and runs the popular "Sunshine Live Top 25" chart and DJ residencies; revenue is from advertising, sponsorships, events and licensing
  sources: https://www.sunshine-live.de/, internal knowledge
