  operator: Independent volunteer project run by Mike Brown (Ontario, Canada); not affiliated with any broadcaster, label or institution
  affiliations: none political/religious; supported by individual patrons via GoFundMe, PayPal and Bitcoin donations
  audience: Worldwide niche audience of early-music enthusiasts, historical re-enactors, students of musicology and listeners drawn to medieval, Renaissance and early Baroque repertoire
  format: 24/7 commercial-free streaming of "Music of the Mediaeval and Renaissance Eras" - Gregorian chant, troubadour and trouvere songs, Cantigas de Santa Maria, Machaut, Dufay, Josquin, Palestrina, Tallis, lute and viol music, early Baroque vocal/instrumental works.
  notes: Ancient FM is a long-running independent internet radio station based in Ontario, Canada, dedicated exclusively to medieval and Renaissance music; it has been on the air since around 2007 and is curated by volunteer enthusiasts, with the site explicitly stating "Ancient FM is a volunteer project funded by individual patrons"; the station emphasises commercial-free operation and asks listeners to "keep us on the air and commercial free" via donations or simply by spreading the word; available on its own site plus aggregators TuneIn, Radio.net, Streema, OnlineRadioBox and direct device URLs; widely cited in early-music communities (SCA, historical reenactment, conservatoire student circles) as one of the very few 24/7 streaming services in its repertoire niche.
