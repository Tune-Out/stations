  notes: Радио SANA broadcasts on 103,3 FM in Rudny, Kostanay region, Kazakhstan, and went on air on 16 April 2001. Its operator's site describes it as the most popular commercial station in Rudny, running an Adult Contemporary format in which programming and advertising take up no more than 20% of airtime and the rest is music. It is owned by SANA Corp, which also publishes the weekly information and advertising paper 'Хорошее дело' whose site hosts the station's online player; the stream's ICY metadata confirms the name 'Radio SANA' and links to sanacorp.kz.
