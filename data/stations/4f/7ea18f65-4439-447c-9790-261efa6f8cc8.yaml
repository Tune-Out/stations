  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland); funded via the German Rundfunkbeitrag household licence fee
  audience: German-speaking listeners in Saxony-Anhalt (Halle, Magdeburg, Dessau, Stendal and surrounding region)
  format: Regional public-service full-format radio with local news, regional culture and an oldies/pop mix spanning the 1970s, 80s and 2010s
  notes: MDR is one of the nine regional public-service broadcasting corporations within Germany's ARD network, founded on 31 May 1991 after German reunification to serve the three new eastern states; MDR Sachsen-Anhalt is its dedicated regional radio for Saxony-Anhalt, with studios in Magdeburg and regional bureaus in Halle, Dessau and Stendal; brand slogan "Das Radio wie wir" ("The radio like us") positions it as a local-identity station, mixing regional reporting (politics, weather, traffic) with an adult-oriented music mix; as a public broadcaster it is independent of commercial advertising for its main income, governed by an interstate treaty (MDR-Staatsvertrag) and supervised by a Rundfunkrat representing societal groups.
