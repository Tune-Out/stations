  notes: Radio ROKS Ballads is a web-only side channel of Radio ROKS, Ukraine's national rock radio network based in Kyiv (103.6 FM). Radio ROKS began on 24 March 1992, was bought by the TAVR Media group in 2008 and relaunched as the country's first rock network on 16 April 2009; it reaches 83 cities through 27 transmitters and mixes anglophone rock and metal with about one-third Ukrainian-language music. The main service is known for the morning show Kamtugezu and the charity initiative "Rock for Our Own"; the Ballads stream is an automated playlist of slow rock songs. The 320 kbps HD stream here is a quality variant of the same channel.
