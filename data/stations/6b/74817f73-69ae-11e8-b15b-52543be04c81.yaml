  notes: Sikhnet Radio is part of Sikhnet, a US-based non-profit (registered 501(c)(3)) founded in 1999 by Sikh volunteers to provide community broadcasting, education and cultural preservation for Sikh communities globally. The organization operates multiple platforms including radio, podcasts, video archives and a directory of Sikh gurdwaras (temples). Sikhnet Radio focuses on Gurbani (the hymnal texts from the Guru Granth Sahib scripture) and Kirtan (devotional chanting), serving both congregational and individual spiritual practice needs. The station streams via Sikhnet's own infrastructure at minimal bitrate (24 kbps MP3), prioritizing accessibility over fidelity. Sikhnet is mission-driven toward supporting the Sikh diaspora's religious practice and cultural continuity, particularly among younger generations. The organization is politically independent and ecumenical within the Sikh faith tradition.
