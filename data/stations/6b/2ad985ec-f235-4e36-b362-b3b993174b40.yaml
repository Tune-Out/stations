  notes: UbuntuFM is an online community project registered in Johannesburg, South Africa, that runs several internet radio channels (World, Africa, Reggae, Hip-Hop) to spread the Ubuntu message of humanity towards others. The main channel mixes afropop, afrosoul, reggae, kwaito, jazz, funk, hip-hop, Latin and rock from African and diaspora artists, streamed from a Dutch hosting platform (coollective.nl). It is not connected to Ubuntu Radio, the South African government's DIRCO talk station.
