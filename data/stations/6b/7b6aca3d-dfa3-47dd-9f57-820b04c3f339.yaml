  audience: Adult French listeners interested in eclectic, curated music programming; available via FM in major French cities and globally via streaming
  format: Eclectic, non-stop curated music with minimal speech — jazz, world, rock, electronica, classical, chanson — selected by music programmers
  notes: Founded in 1971 as "France Inter Paris" to provide traffic and music to Paris commuters, FIP evolved into one of the most respected music-discovery stations in Europe, renowned for its near-uninterrupted music flow and brief, distinctive presenter voiceovers ("les fipettes"). It now broadcasts seven thematic webstreams (Rock, Jazz, Groove, World, Pop, Reggae, Electro). Funded by the French state through public-service contribution, FIP operates without commercial advertising under Radio France's editorial independence charter.
