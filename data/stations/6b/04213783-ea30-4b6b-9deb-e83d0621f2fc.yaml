  operator: Prasar Bharati — All India Radio (Akashvani), the autonomous public service broadcaster of the Government of India
  affiliations: Government of India (statutory autonomous corporation under the Prasar Bharati Act, 1990); no party-political or religious affiliation, though programming reflects national/cultural priorities
  audience: Marathi-speaking women in Maharashtra; "Asmita Vahini" literally means "Identity Channel" and was launched as a women-focused service
  format: Marathi-language women's programming — Marathi music, women's issues, health, education, lifestyle, and cultural content; the channel positions itself around women's self-identity and empowerment
  notes: Akashvani Asmita Vahini is a dedicated FM channel of All India Radio aimed at Marathi-speaking women in Maharashtra, broadcast principally from AIR Mumbai; it is part of AIR's larger network of language- and audience-specific public-service channels under the Prasar Bharati umbrella, funded by a combination of government grants and limited commercial advertising; in 2017 AIR's master brand was officially renamed "Akashvani" (its long-standing Sanskrit/Hindi name meaning "voice from the sky") by the Indian government.
