  affiliations: Statutory public broadcaster of France, funded by television licence fees (redevance audiovisuelle); editorially independent; no political or religious affiliation
  audience: General French and Francophone audiences; news, information, and culture-focused listeners aged 25+
  format: News, current affairs, interviews, debate, culture, literature, philosophy, and general information programming
  notes: France Inter is the flagship national public radio station of France, operated by Radio France, the public broadcasting authority founded in 1975 (formerly ORTF). Launched in its current form in 1987. France Inter is the most-listened-to radio station in France, known for highbrow journalism, cultural programming, and intellectual debate. Broadcasting continuously since 1945 as "Radiodiffusion Française" and predecessors. Covers national and international news, literary discussions, philosophical exchanges, and current affairs. Hosted by iconic personalities like Michaël Youn and others. Streams via Radio France's Icecast infrastructure. No political alignment despite occasional criticism of editorial choices. Major awards include numerous journalism prizes.
