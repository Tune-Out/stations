  notes: Radio 2 is Belgium's most-listened-to Dutch-language radio network and is split into five provincial sub-channels — Antwerpen, Limburg, Oost-Vlaanderen, Vlaams-Brabant, and West-Vlaanderen — this stream is the Limburg regional feed; programming combines national Radio 2 shows with locally produced "Limburg vandaag" regional news and dialect content; broadcasts on FM (Limburg 97.0 / 97.5 MHz cluster) and DAB+; the brand traces to BRT/BRTN Radio 2 and was rebranded under VRT in 1998; funded by Flemish-government dotation plus limited advertising
