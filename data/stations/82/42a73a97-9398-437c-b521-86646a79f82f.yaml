  nature: public broadcaster
  operator: Deutschlandradio, a national public-law institution (Körperschaft des öffentlichen Rechts) jointly held by ARD and ZDF; main editorial seat in Cologne with substantial production in Berlin
  affiliations: Funded by the German Rundfunkbeitrag household licence fee and governed under the Deutschlandradio-Staatsvertrag (interstate broadcasting treaty); editorially independent of party, religion and government per the German Basic Law (Art. 5)
  audience: German-speaking adults nationwide, with an educated, news-oriented profile; available on FM (limited), DAB+ nationwide, satellite and online
  format: '24-hour national news, current affairs and culture network: hourly newscasts, in-depth features, interviews, political analysis, science and arts coverage, plus speech-driven programmes such as "Informationen am Morgen," "Das war der Tag," and the long-running "Aus Kultur- und Sozialwissenschaften."'
  notes: Deutschlandfunk (DLF) was founded in 1962 as a federal-government broadcaster intended to address listeners in both Germanies and abroad. After German reunification, it merged in 1994 with RIAS 1 and Deutschlandsender Kultur to form Deutschlandradio under joint ARD/ZDF stewardship, becoming a politically independent public network alongside its sister channels Deutschlandfunk Kultur and Deutschlandfunk Nova. Headquartered at Funkhaus Köln in Raderberggürtel, Cologne, it is widely regarded as one of Europe's leading public-service speech-radio stations and an institutional reference for German political discourse.
  sources: internal knowledge only
