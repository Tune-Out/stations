  notes: Polskie Radio Program III (Trójka) is the music and culture channel of Polish public broadcaster Polskie Radio, on air since 1 April 1962 and long known for rock, alternative and jazz programming and its Lista Przebojów chart. In 2020 a chart-manipulation scandal triggered the resignation of almost all of its journalists, many of whom founded Radio 357 and Radio Nowy Świat, and Trójka's audience fell from around 8% to under 2%. The stream on this entry (stream3.polskieradio.pl:8954) no longer responds; the catalog's higher-voted Trojka entry covers the same channel.
