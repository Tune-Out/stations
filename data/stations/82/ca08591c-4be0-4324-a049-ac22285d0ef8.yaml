  nature: public broadcaster
  operator: Hessischer Rundfunk (HR), public-service broadcaster for the German state of Hesse
  affiliations: Member of ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten); funded by the German broadcasting fee (Rundfunkbeitrag); no religious or party-political affiliations
  audience: Adult listeners (roughly 30-59) in Hesse, particularly the Frankfurt Rhine-Main metropolitan region
  format: Adult contemporary pop with strong news, traffic, and service journalism; hr3 Rhein-Main is the regional opt-out stream for the Frankfurt area with extra traffic and local news
  notes: hr3 began broadcasting in 1964 as Hessischer Rundfunk's third radio service. Long positioned as Hesse's premier mainstream music station, it shifted from rock-oriented programming to AC pop in the 2000s. The Rhein-Main regional window provides intensified service journalism (traffic, weather, local events) for Germany's financial capital. HR itself was founded in 1948 under the public-service mandate established by the Allies after WWII, with editorial independence and supervision by a pluralistic broadcasting council.
  sources: internal knowledge only
