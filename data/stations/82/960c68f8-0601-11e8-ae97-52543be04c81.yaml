  notes: RFI Monde is the worldwide French-language service of Radio France Internationale, France's public international broadcaster founded in 1975 and now part of the state-owned France Médias Monde group. It is funded mainly by the audiovisual public levy and the Ministry for Europe and Foreign Affairs, and airs 24-hour news and current affairs from Paris with major morning, midday and evening news blocks plus culture, science, sport and world-music programmes. RFI reached about 59.5 million weekly listeners in 2022 across FM relays, shortwave, satellite and digital platforms in more than 150 countries, broadcasting in French and 16 other languages. Its African coverage has drawn suspensions from juntas in Mali, Burkina Faso, Niger and Togo between 2022 and 2025.
