  nature: public broadcaster
  operator: National Education Radio (國立教育廣播電臺 / NER), a public broadcaster under Taiwan's Ministry of Education
  affiliations: Ministry of Education, Republic of China (Taiwan); statutory educational broadcaster, no party-political or religious affiliation
  audience: Taiwanese students, teachers, parents, lifelong learners, and the general public — Mandarin-speaking; also serves international audiences and indigenous communities
  format: Educational programming, language learning, cultural, news, current affairs, children's content, and international perspectives
  notes: National Education Radio was established in 1960 as Taiwan's dedicated educational broadcaster; the Taipei main station FM channel (101.7 MHz) anchors a national network of regional stations covering Hsinchu, Taichung, Tainan, Kaohsiung, Yilan, Hualien, and Taitung; mission is to "provide a high-quality educational broadcasting service" supporting Taiwan's national education goals.
