  nature: public broadcaster
  operator: France Médias Monde (FMM), the French public external audiovisual group; specifically its Arabic-language radio service Monte Carlo Doualiya (MCD)
  affiliations: French Republic (state-owned external broadcaster, alongside RFI and France 24); editorially independent under FMM governance but funded from the French public budget
  audience: Arabic-speaking listeners across the Middle East and North Africa (MENA), with focus on the Levant (Lebanon, Syria, Iraq, the Gulf) and Arabic diaspora
  format: Arabic-language news, current affairs, talk, cultural programming and music — francophone-perspective international broadcasting in Arabic
  notes: Monte Carlo Doualiya descends from "Radio Monte-Carlo Moyen-Orient" (RMC-MO), launched in 1972 from a Monaco-based transmitter primarily to reach the Arab world; rebranded "Monte Carlo Doualiya" (دولية = "international") in 2007; now part of France Médias Monde alongside RFI (Radio France Internationale) and France 24; broadcasts on shortwave, AM, FM (including Beirut and other Arab capitals where licensed) and online; the "Lebanon" country tag here reflects MCD's Beirut bureau / regional studio rather than Lebanese ownership; this entry's homepage field oddly points directly at the Infomaniak-hosted 128kbps MP3 stream rather than a website (the proper homepage is mc-doualiya.com); the spelling "montcarlo" is a misspelling of Monte Carlo.
  sources: internal knowledge only
