  audience: Adult LSM 8-10 English-speaking listeners in Gauteng — Johannesburg, Pretoria and surrounds — interested in news, current affairs and talk
  format: News and talk radio — current affairs, business, politics, traffic, sport and listener call-ins
  notes: Founded in 1980 as Radio 702 by Hylton Appelbaum and Issie Kirsh, originally broadcasting from the Bophuthatswana homeland on AM to bypass apartheid-era SABC regulations restricting independent talk radio in 'white' South Africa; moved to 92.7 FM in Johannesburg in 1997 after democratisation; now owned by Primedia Broadcasting alongside CapeTalk and 947; flagship presenters have included John Robbie, Stephen Grootes, Bruce Whitfield, Eusebius McKaiser, Bongani Bingwa and Clement Manyathela; played a notable role in the anti-apartheid era as one of the few platforms for cross-racial political discussion; tightly integrated with Eyewitness News (EWN) for newsgathering
