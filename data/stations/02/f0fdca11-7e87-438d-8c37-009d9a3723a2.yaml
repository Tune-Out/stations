  notes: CFMS-FM 105.9, branded '105.9 The Region,' is a commercial station licensed to Markham, Ontario serving York Region. Daytime programming is English adult contemporary with local news, weather and traffic, while evenings shift to a multilingual ethnic format spanning Cantonese, Filipino, Hindi, Mandarin, Punjabi, Tamil and Urdu. It launched February 5, 2014 under owner Bhupinder Bola following 2012 CRTC approval.
