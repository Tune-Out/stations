  format: Mainstream music and entertainment network mixing Italian and international pop / rock / indie / songwriter music, comedy shows, satire, talk and live concerts.
  notes: Rai Radio 2 began as the "Secondo Programma" on 3 November 1951 and was rebranded RadioDue/Rai Radio 2 in 1976 when Rai restructured its three national networks. It is positioned as Rai's pop and entertainment channel (alongside Rai Radio 1 for news and Rai Radio 3 for culture) and is famous for irreverent comedy and satire shows such as "Il Ruggito del Coniglio", "610 - Sei uno Zero", "Caterpillar" with Massimo Cirri and Sara Zambotti, "Black Out", and music programmes including "Back2Back" and chart shows. It is also the official radio of the Sanremo Music Festival. RAI is funded primarily by the canone (licence fee) and advertising; the appointment of its board has historically been a subject of political contention in Italy.
