  notes: Del Sol 99.5 FM is one of Uruguay's flagship talk/news stations, based in Montevideo (Pablo de María 1015) and operated by Magnolio Media Group. Famous strand "No Toquen Nada" is a long-running morning current-affairs and political-analysis show; "La Mesa de los Galanes" is a marquee afternoon talk/comedy panel; football coverage and the iconic comedy slot "La Venganza Será Terrible" (originally Argentine, by Dolina) are also carried. Other programmes include "Quién Te Dice", "Aire Rico" and the sports show "13a0". Editorially the network is widely seen as liberal/centrist within Uruguay's media landscape but is privately owned and not party-affiliated. Distribution spans terrestrial FM, mobile apps (iOS/Android), podcasts and social platforms (YouTube, Twitch, TikTok).
