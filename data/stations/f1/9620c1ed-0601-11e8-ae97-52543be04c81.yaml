  affiliations: Politically right-leaning / libertarian-populist editorial line; sympathetic to conservative and sovereigntist viewpoints; no formal party tie
  audience: French-speaking adults in the Quebec City metropolitan area; male-skewing talk-radio listeners interested in politics, news, and sports
  format: French-language hot talk and sports — opinion, news commentary, call-ins, and rock/active-rock music elements; flagship of the "X" talk-radio network
  notes: CHOI 98.1 FM "Radio X" Quebec City is one of Canada's most notorious commercial talk stations, broadcasting from Quebec City on 98.1 MHz; founded as a rock station, it became the flagship outspoken talk station of Genex Communications under host André Arthur in the late 1990s–2000s, prompting a landmark CRTC licence-renewal denial in 2004 (later reversed after sale to RNC Media in 2006). Hosts including Jeff Fillion, Stéphane Gasse, Dominic Maurais and Stéphane Dupont have driven controversies over commentary about politicians, public figures and minorities. Now part of RNC Media's "Radio X" network (Quebec City, Saguenay, Gatineau) and operates merchandise and auction sidelines.
