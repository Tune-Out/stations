  notes: 'FM 100 Pakistan launched on 23 March 1995 as the country''s first commercial radio station and is owned by the Lahore Broadcasting Corporation, held by the Pirzada family. It broadcasts on 100 MHz in nine cities: Karachi, Lahore, Islamabad, Hyderabad, Rahim Yar Khan, Multan, Abbottabad, Gujrat and Jhelum. The Urdu-language schedule mixes Pakistani pop, folk and film music with Western tracks, news, youth shows and talk, and carries religious programming including the five daily prayers and Friday sermons. It uses the on-air greeting "Assalam-o-Alaikum Pakistan" and has announced further launches in Shikarpur, Jacobabad and Benazirabad.'
