  notes: Vikerraadio is the flagship Estonian-language general-interest station of ERR, the country's public broadcaster headquartered at F. R. Kreutzwaldi 14, Tallinn; founded in 1967 as the second programme of Estonian Radio (Eesti Raadio) and continuing through the Soviet era as a national channel, it became part of independent Estonian public broadcasting in 1991 and merged into ERR in 2007 alongside Raadio 2, Klassikaraadio and Raadio 4; flagship shows include "Reporteritund" current affairs, with editorial coverage of "sise- ja välispoliitikale, kaitseküsimustele, haridusele, ühiskonna- ja keskkonnateemadele" (domestic/foreign policy, defence, education, social and environmental issues).
