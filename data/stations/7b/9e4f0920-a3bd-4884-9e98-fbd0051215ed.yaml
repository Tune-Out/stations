  notes: Radio Record (Радио Рекорд) is Russia's largest dance-music radio network, registered in January 1995 and on air in Saint Petersburg since 22 August 1995 on 106.3 FM. It was founded by the family of composer Viktor Reznikov and is run by ZAO Radio Record, with Lyudmila Kolchugina as general director and Andrey Reznikov as general producer; it is privately owned rather than state media. The main channel is a continuous dance/EDM mix, and the brand operates over 110 themed internet channels (Russian Mix, Trancemission, Pirate Station, Superdiskoteka 90-x and others) plus festivals of the same names. It broadcasts in more than 200 Russian cities and returned to Moscow on 89.9 FM in April 2024. The catalog tag 'news' is wrong; this is a music station.
