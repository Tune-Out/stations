  nature: commercial
  operator: Radio Record (Радио Рекорд) — privately held Russian broadcasting group founded in Saint Petersburg in 1995
  affiliations: none political or religious; closely tied to the Russian electronic-dance-music industry and operates its own Record label, club booking and Pirate Station festival brand
  audience: Russian-speaking young adults (roughly 16-35) who follow electronic dance music; FM coverage across most major Russian cities plus a global online streaming audience
  format: Electronic dance music — the flagship Main Channel mixes house, techno, trance, drum'n'bass, hardstyle, trap and other club genres; the brand also runs 100+ themed sub-channels online (e.g. Russian Mix, Pirate Station, Trancemission, Supersonic)
  notes: Radio Record is Russia's largest and oldest electronic-music broadcaster, founded in Saint Petersburg in 1995 by Andrey Dmitriev, Mikhail Kozlov and Gennady Bachinsky; it grew into a network with FM affiliates across Russia plus an extensive web/app platform, and is the organiser of the long-running Pirate Station and Sensation-style EDM festivals; while operating under Russian regulatory regimes (Roskomnadzor licensing), it is a private commercial enterprise rather than state media.
  sources: https://www.radiorecord.ru/, internal knowledge of Russian electronic-music broadcasting
