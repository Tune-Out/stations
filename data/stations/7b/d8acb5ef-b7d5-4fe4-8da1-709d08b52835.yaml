  operator: Clouds Media Group (CMG), Dar es Salaam, Tanzania — co-founded by Joseph Kusaga and the late Ruge Mutahaba
  affiliations: none known (privately owned commercial broadcaster)
  audience: Swahili-speaking youth and young-adult listeners across Tanzania and the East African diaspora; primary language Swahili with English elements
  format: Tanzanian commercial youth radio — Bongo Flava, Hip-Hop, R&B and Afrobeats, plus entertainment news, talk and call-in shows
  notes: Clouds FM launched on 3 December 1999, evolving from the "Mawingu Disco" events brand into a full broadcaster, and is widely credited with championing the Bongo Flava genre and breaking many of Tanzania's biggest stars; by 2023 it reached more than 20 regions across Tanzania via FM transmitters and an online stream; signature personalities have included Meena Ally, Mamy Baby, Frida Amani and Millard Ayo; Clouds Media Group also operates sister stations Choice FM and Coconut FM, plus Clouds TV, making it one of Tanzania's most influential private media houses; co-founder Ruge Mutahaba died in 2020 and is regarded as a pioneer of modern Tanzanian broadcasting.
