  notes: Radio Disco Party specializes exclusively in Disco Polo, a distinctively Polish popular music genre that emerged in the 1980s, characterized by polka-influenced rhythms, electronic instrumentation, accordion samples and sing-along/call-and-response structures. Disco Polo has significant cultural resonance in Poland, particularly in rural and working-class communities, though it has also become fashionable among younger urban audiences in recent years. The station streams at modest bitrate (128 kbps) via Slotex Shoutcast CDN. The website at discoparty.pl presents a modern WordPress interface and maintains playlists and DJ schedules. The genre has sometimes attracted cultural criticism but remains mainstream in Poland and parts of Central Europe.
