  operator: PT Radio Elshinta (Elshinta Media Group)
  affiliations: none known; widely regarded as Indonesia's leading independent commercial news-talk station
  audience: Indonesian-speaking general adult audience across Jakarta and the Jabodetabek metropolitan area, with national reach via a network of affiliate stations and online streaming
  format: 24-hour all-news and talk format ("News and Talk") featuring rolling news, traffic updates, listener call-ins, talkshows, political and economic analysis, and live event coverage
  notes: Elshinta originally launched in 1968 as a music-format station, but was relaunched on 14 February 2000 as Indonesia's first 24-hour all-news radio station under the slogan "News and Talk"; broadcasts in Jakarta on 90.0 FM and operates a national network of affiliate stations across major Indonesian cities; the name "Elshinta" comes from the first names of the founder's daughters (Elsye and Shinta); Elshinta is owned by the Sugiono Suyitno family (PT Radio Elshinta), with the larger Elshinta Media Group also operating Elshinta TV; the station rose to national prominence covering the 2004 Indian Ocean tsunami, the 2002 Bali bombings, and ongoing live coverage of Jakarta traffic and breaking events with citizen-journalist call-ins, a format then unique in Indonesian radio; frequently cited as a benchmark Indonesian news-radio brand and a model later imitated by competitors.
