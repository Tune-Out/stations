  notes: 天籁之音 Hi-Fi Radio is one of the 天籁之音 ("Sounds of Heaven") digital music channels on 河南广播网, the online platform of Henan Radio and Television, the provincial state broadcaster. It is a web-only sub-channel rather than a terrestrial FM service, programming high-fidelity instrumental and easy-listening music with no news or talk content. Sister channels on the same platform include 天籁之音 - 经典正流行 and 天籁之音 - 国风, each a distinct stream.
