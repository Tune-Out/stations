  nature: public broadcaster
  operator: British Broadcasting Corporation (BBC), a UK statutory chartered corporation
  affiliations: Funded by the UK Foreign, Commonwealth & Development Office (FCDO) grant-in-aid until 2014, since then primarily by the BBC licence fee with continuing FCDO World 2020 funding for some language services; operationally independent under the BBC Royal Charter
  audience: Global English-speaking and international audience — over 320 million weekly users across all BBC News services; English service alone reaches roughly 60-70 million weekly
  format: 24/7 international English-language news, current affairs, analysis, documentaries, business, sport and feature programming
  notes: The BBC World Service launched on 19 December 1932 as the BBC Empire Service and is the world's largest international broadcaster, broadcasting in more than 40 languages from Broadcasting House in London; flagship English programmes include "Newshour", "World Update", "HARDtalk", "From Our Own Correspondent", "The Documentary", "Outlook" and "World Business Report"; the BBC operates under a Royal Charter that mandates editorial independence and impartiality, though funding has periodically prompted political debate (notably the 2010 transfer of funding from FCDO to the licence-fee payer and the 2022/23 cuts to several language services); widely regarded as a soft-power asset of the United Kingdom but legally and editorially separate from the British government.
  sources: https://www.bbc.co.uk/sounds/play/live:bbc_world_service, internal knowledge
