  nature: public broadcaster
  operator: Hrvatska radiotelevizija (HRT) — Croatian Radiotelevision, the national public-service broadcaster
  affiliations: European Broadcasting Union (EBU) member; funded primarily by a public broadcast fee plus limited advertising; established under the Hrvatska radiotelevizija Act
  audience: Croatian-speaking general adult audience nationwide, with HR 2 specifically targeting drivers, urban commuters and lighter-music / lifestyle listeners
  format: Hrvatski radio's "Drugi program" (Second Programme) — Croatian and international popular music, drive-time and traffic-focused programming, cultural magazine shows and entertainment
  notes: HR 2 is the second of the three nationwide HRT radio channels (HR 1 = news/talk flagship, HR 2 = music & traffic, HR 3 = culture/classical); it was a pioneer of traffic-information broadcasting in former Yugoslavia and continues to specialise in motorist services with the "Radio karta" traffic service; HRT itself traces its roots to Radio Zagreb's founding in 1926, making it among Europe's oldest broadcasters
