  notes: MDR Sputnik is the youth radio of Mitteldeutscher Rundfunk (MDR), the ARD public broadcaster for Saxony, Saxony-Anhalt and Thuringia, launched 1 May 1993 as successor to the East German DT64. Sputnik Club is one of its genre web channels, looping current episodes of the station's evening club-music shows (house, techno, electro, DJ mixes) in continuous rotation alongside sister streams for rock and electronic. It is licence-fee funded and ad-free; MDR plans to end Sputnik's FM transmission in 2026 while keeping DAB+ and online.
