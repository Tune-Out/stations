  notes: 'Horror Theatre is a hobbyist internet station billed as ''Scary Tales Radio over the internet, worldwide'' and ''Internet Radio Featuring: Ghost Stories, Weird Stories, and Murders, too!'', streaming classic horror, mystery and suspense old-time radio dramas around the clock. Its site, hosted on AWS S3 behind a frameset, wraps the stream in a ''Station Keeper'' ghost-story persona, links a Facebook page and asks listeners to help support the broadcast; the operator is not named. The 32 kbps MP3 stream on Yes Streaming suits spoken-word OTR content.'
