  operator: MFM Radio SA (Marocaine de Médias) — part of the privately held Maroc Soir / Caractères media group
  affiliations: Privately owned Moroccan media group; operates under licence from the HACA (Haute Autorité de la Communication Audiovisuelle); no direct political party or religious affiliation, but content is subject to Moroccan broadcasting regulations
  audience: Adult Moroccan listeners nationwide, primarily Arabic-speaking (Darija / Modern Standard Arabic), with some Amazigh and French content
  format: Generalist talk/news/entertainment station — news bulletins, talk shows, listener call-ins, sports, religious programming and music
  notes: Med Radio (also styled Med Radio / MED RADIO) launched in 2006 after Morocco's audiovisual liberalisation, when HACA granted licences to the first wave of private radio stations; broadcasts nationally on FM via more than a dozen transmitters across Morocco (Casablanca, Rabat, Marrakech, Tangier, etc.); part of the same broader media stable as MFM Radio and the daily Le Matin du Sahara; programming mixes general news, talk, sport and music aimed at a mass adult audience; ownership traces to the Sefrioui / Maroc Soir group, generally considered close to the Moroccan establishment ("Makhzen") in editorial orientation, though it is a private commercial outlet.
