  notes: Virgin Radio Romania is a commercial pop/CHR station broadcasting in Bucharest and other Romanian cities under license from Virgin Enterprises Limited (the brand-licensing arm of Sir Richard Branson's Virgin Group). It was relaunched under the Virgin Radio brand in 2014 after previously operating as Radio 21. The station targets a young urban demographic with a music mix of international and Romanian pop, dance, hip-hop, and R&B, complemented by the morning Breakfast show, midday talk show "Tic Talk cu Oana Tache", and the HOT 30 and DanceFloor charts.
