  notes: Founded in 1957 as the cultural programme of Czechoslovak Radio's Slovak service, Radio Devin is named after Devin Castle and has long been the cultural flagship of Slovak public radio; signature programmes include "Parnas" (literary readings), "Ars litera", "Operne Radio Devin" and the "Rozhlasove hry" radio-drama strand; following the 2024-2025 dissolution of RTVS by the Robert Fico government and its replacement by STVR, the station continues to broadcast with the slogan "naladime vas na to najlepsie z umenia a kultury".
