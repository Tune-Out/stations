  notes: Europa Plus (Европа Плюс) is Russia's first commercial FM station, launched on 30 April 1990 as a Soviet-French joint venture by French radio pioneer Georges Polinsky. Today it is the flagship station of Европейская медиагруппа (EMG), Russia's largest private radio holding (also operating Ретро FM, Радио Дача, Studio 21, Дорожное Радио, etc.). Europa Plus brands itself as "№1 в России" with the tagline "Больше хитов! Больше музыки!" Notable programs include "ЕвроХит Топ 40" (its long-running weekly chart), "Бригада У" morning show, and "Русский Хит-Парад". Broadcasts on more than 250 FM frequencies across Russia plus CIS affiliates.
