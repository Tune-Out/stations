  notes: DFM Vocal Trance is one of the automated online genre channels of DFM, a Moscow commercial dance/pop station (101.2 MHz) launched on 1 July 2000 in place of Radio 101. DFM belongs to Russian Media Group (Russkoye Radio, Hit FM, Monte Carlo, Radio Maximum, RU.TV), beneficially owned since 2016 by producer Vladimir Kiselyov after a failed 2015 takeover attempt by the state enterprise Goskontsert. The Vocal Trance stream is a non-stop playlist without hosts; the catalog entry also bundles a dozen unrelated DFM sub-channel streams (Club, Chill, Breakbeat, etc.) that are not vocal trance.
