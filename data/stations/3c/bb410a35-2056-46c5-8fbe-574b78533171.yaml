  audience: German-speaking adults in the city-state of Bremen and Bremerhaven plus the surrounding "Bremen-Vier-Land" in Lower Saxony
  format: Contemporary hit / mainstream pop music with regional Bremen news, traffic and entertainment magazines
  notes: Bremen Vier launched on 5 November 1986 as Radio Bremen's pop/youth-oriented service, complementing the more cultural Bremen Eins/Zwei. Programming is anchored by "Die Vier am Morgen" (weekday breakfast), "Die Bremen Vier Spätschicht" evening show, the weekend giveaway show "Frei Haus" and ARD network nighttime programming such as "ARD Popnacht"; the station promotes itself with the slogan "die beste Playlist" and runs an interactive song-voting system on its website. As a public-service ARD station it operates without commercial advertising on most output, governed by the Radio-Bremen-Gesetz and the broadcasting council. Editorially it partners with Radio Bremen's TV news brand "buten un binnen" and offers Leichte-Sprache (easy-language) accessibility content.
