  notes: Kommersant FM is the all-news radio arm of the Moscow business publishing house Kommersant, broadcasting on 93.6 FM in Moscow. Test transmissions began on 14 February 2010 and regular broadcasting on 15 March 2010, replacing NewTone FM on the frequency. The format is rolling news with headlines roughly every ten minutes and analysis, interviews and themed segments in between, covering politics, economics, markets, technology and culture; slogans have run from "News without censorship" through "News with character" to "Think differently". Its Nizhny Novgorod relay closed on 31 March 2021, and on 8 June 2022 hackers briefly took over the stream to play the Ukrainian anthem and anti-war songs. Kommersant has belonged to Alisher Usmanov's USM Holdings since 2006, which has fuelled long-running debate about its editorial independence.
