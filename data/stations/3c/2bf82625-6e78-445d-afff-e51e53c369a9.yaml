  notes: 'CCTV-13 (新闻频道) is China Central Television''s 24-hour Mandarin news channel, launched on 1 May 2003 and described as the largest news channel in mainland China. This entry is its audio simulcast (伴音), carrying hourly live news bulletins through the day and current-affairs programming in the evening. CCTV is owned by China Media Group, the state broadcasting conglomerate supervised by the Chinese Communist Party''s Publicity Department, so editorial line follows official government positions. The HLS stream is served from an Alibaba CDN and is live. Editorial flag: CCTV is the television arm of China Media Group, controlled by the Chinese Communist Party''s Publicity Department; CCTV-13 is the party-state''s flagship domestic news channel and its output follows official CCP editorial direction, so it functions as state messaging rather than independent journalism.'
