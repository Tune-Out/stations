  nature: state media
  operator: VGTRK (All-Russia State Television and Radio Broadcasting Company / Всероссийская государственная телевизионная и радиовещательная компания), a federal state unitary enterprise of the Russian Federation
  affiliations: Russian state broadcaster directly controlled by the government of the Russian Federation; subject to EU, UK, US, Canadian and Australian sanctions since 2022 over its role in pro-Kremlin propaganda following Russia's invasion of Ukraine
  audience: Russian-language adult audience focused on news/current-affairs listeners across Russia and Russian speakers abroad; broadcast on FM in Moscow (97.6) and 25+ Russian cities, plus DAB, satellite, online via Smotrim and the Vesti.ru portal
  format: 24-hour news/talk radio with bulletins, expert commentary, political analysis, sport and economic reporting
  notes: Launched 5 February 2008 as Russia's first round-the-clock news radio station, Vesti FM is part of the Vesti news brand that includes Rossiya 24 television and Vesti.ru; its schedule is built around hourly news, "Полный контакт" hosted by Vladimir Solovyov, "Железная логика" with Sergey Mikheyev, "Война и мир", and other talk strands; the station and its hosts (notably Solovyov) have been individually sanctioned by Western governments and the channel has been characterised in independent media monitoring (e.g. EU vs Disinfo, RSF) as a leading vehicle of Kremlin messaging
  sources: https://radiovesti.ru/, https://smotrim.ru/channel/199, internal knowledge
