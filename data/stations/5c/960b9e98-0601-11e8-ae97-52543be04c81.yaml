  notes: 'Vesti FM is Russia''s state-owned 24-hour news/talk radio station, launched on 5 February 2008 by VGTRK (the All-Russia State Television and Radio Broadcasting Company) under the Vesti news brand shared with Rossiya 24. It airs on 97.6 FM in Moscow and 89.3 FM in Saint Petersburg and in more than 60 Russian cities, with hourly bulletins and analytical talk shows including Polny Kontakt with Vladimir Solovyov and programmes by Dmitry Kulikov and Yevgeny Satanovsky; its slogan is Pervye o glavnom. VGTRK is subject to EU, UK and allied sanctions since 2022 for propaganda supporting Russia''s war against Ukraine, and Solovyov is individually sanctioned. The station''s website now lives on VGTRK''s Smotrim platform. Editorial flag: Vesti FM is owned by VGTRK, a Russian state broadcaster sanctioned by the EU, UK and others for spreading war propaganda and disinformation about the invasion of Ukraine; its flagship host Vladimir Solovyov is personally sanctioned by the EU and UK and named by the US State Department as a leading face of Kremlin propaganda. Editorial flag: Flagship Kremlin news/talk channel, explicitly named in the review brief. VGTRK is a federal state unitary enterprise; the channel and its hosts are under EU/UK/US/CA/AU sanctions for pro-war messaging.'
