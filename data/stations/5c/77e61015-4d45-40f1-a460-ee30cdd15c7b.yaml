  nature: non-commercial
  operator: Radio Nowy Świat sp. z o.o. (founded and led by former Radio Trójka journalists)
  affiliations: no party-political ownership but widely identified with journalists who left Polskie Radio Program III (Trójka) in 2020 in protest of editorial interference under the PiS-aligned management; funded primarily by listeners (Patronite, donations)
  audience: Polish-speaking adult audience (30+), domestic and diaspora, with strong intelligentsia / cultural-elite skew
  format: Polish adult-contemporary music with a strong rock, jazz, blues and singer-songwriter accent, plus cultural and current-affairs talk programming
  notes: Radio Nowy Świat was launched in July 2020 by a group of journalists — including Piotr Stelmach, Marcin Kydryński, Hanna Lis and Wojciech Mann — after a high-profile censorship row at Trójka over the song "Twój ból jest lepszy niż mój" by Kazik Staszewski (about PiS leader Jarosław Kaczyński). Several other prominent broadcasters (e.g. Marek Niedźwiecki) also joined or contributed. It operates online only (web stream + apps) and is financed almost entirely by listener patronage via Patronite, which made it one of the most successful crowdfunded media projects in Poland. Editorially it positions itself as independent, music-led and free of political pressure, and has become a flagship for the journalistic-independence movement in Polish radio.
  sources: https://nowyswiat.online/, internal knowledge of Polish radio
