  notes: Süper FM is a long-running national commercial pop station in Turkey. Originally part of the CanWest Turkish portfolio (with Metro FM, Joy FM, Joy Türk), then sold to Spectrum Medya in 2008, which was renamed Karnaval Media Group. Karnaval is the largest commercial radio broadcaster in Turkey, reaching 11+ million listeners. Süper FM focuses on Turkish-language pop hits. Karnaval was reported in 2024 to be in talks with Greece's Antenna Group regarding acquisition.
