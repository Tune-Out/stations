  operator: Cadena COPE (Cadena de Ondas Populares Españolas), owned by COPE Group; majority shareholder is the Conferencia Episcopal Española (Spanish Episcopal Conference) of the Catholic Church.
  affiliations: Roman Catholic Church (via Spanish Episcopal Conference, the majority owner); editorially center-right; aligned culturally with Spanish conservative and Christian-democratic perspectives.
  audience: Spanish-speaking adults in Granada province and Santa Fe (Andalucía), Spain; tilts older and traditionally Catholic.
  format: News-talk and entertainment with national COPE programming (Herrera en COPE, La Linterna, Tiempo de Juego) plus local Granada news, opinion and sports windows.
  notes: COPE was founded in 1959 as the Catholic Church's national radio network and is Spain's second-largest talk radio network after SER; the Granada-Santa Fe local station carries the chain's flagship news, opinion and sports shows alongside provincial inserts on Andalusian politics, Granada CF football and Holy Week / religious coverage.
