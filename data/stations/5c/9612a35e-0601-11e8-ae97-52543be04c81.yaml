  notes: FIP Groove (launched 5 January 2016 as "FIP autour du groove") is one of the themed webradios of FIP, Radio France's commercial-free eclectic music station founded in 1971. The channel focuses on funk, soul, R&B and groove, with selections chosen by FIP's human music programmers rather than an algorithm. This legacy direct.fipradio.fr URL now redirects to the current Radio France icecast stream; the catalog already holds the same channel as FIP Groove with more votes.
