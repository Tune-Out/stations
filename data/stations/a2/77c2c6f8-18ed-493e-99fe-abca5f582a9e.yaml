  notes: Sunshine Live was launched in 1997 from Mannheim and grew out of the early-90s German rave scene; it broadcasts on FM in the Rhein-Neckar metropolitan area, on national DAB+ and via streaming, and is widely considered Germany's leading electronic-music station; it hosts regular Mayday/Nature One/Time Warp broadcasts and partnered specials with leading dance promoters; licensed by the Landesanstalt für Kommunikation Baden-Württemberg (LFK).
