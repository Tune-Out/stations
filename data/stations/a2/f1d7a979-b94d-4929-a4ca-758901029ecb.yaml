  notes: 'Free FM World is an India-based independent internet radio brand running multiple genre/Top-100 themed streams. In India, FM terrestrial radio is restricted by law: only the public broadcaster All India Radio may broadcast news, while private FM licensees (since 1999/2005 Phase I–III auctions) are largely entertainment-only. As a result, many Indian "FM" brands operate online-only, sidestepping licensing barriers; Free FM World fits this pattern. The "Top 100 India" feed targets pop chart enthusiasts. Funded by advertising on the Zeno.fm streaming platform.'
