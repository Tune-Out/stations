  operator: Bayerischer Rundfunk (BR) — public-law broadcasting institution (Anstalt des oeffentlichen Rechts) of the Free State of Bavaria; member of ARD (Arbeitsgemeinschaft der oeffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland)
  affiliations: ARD federation; funded by German broadcasting fee (Rundfunkbeitrag); editorially independent under state media treaty (Rundfunkstaatsvertrag); no party-political or religious affiliation
  audience: German-speaking residents of Bavaria and across Germany; news-interested adult listeners; primary language German
  format: 24/7 news and information radio — hourly bulletins, in-depth news magazines, interviews, political analysis, weather, traffic; integrated with the BR24 digital news brand (TV, app, web)
  notes: BR24 (formerly B5 aktuell, rebranded in 2018) is one of the few full-time German-language news radio channels. Distributed on DAB+ across Bavaria and via the joint nationwide DAB+ multiplex; also streamed online. Part of BR's broader BR24 news service that integrates radio, TV (BR24 channel), and digital. Bayerischer Rundfunk is one of Germany's largest ARD member broadcasters, headquartered in Munich.
