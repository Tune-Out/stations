  notes: BR24 is the 24-hour news and information radio channel of Bayerischer Rundfunk, the ARD public broadcaster for Bavaria, headquartered in Munich. It launched on 6 May 1991 as B5 aktuell, the first all-news programme in German-language radio, and was renamed BR24 on 1 July 2021 to align with BR's cross-platform news brand. It reaches roughly 700,000 listeners a day via FM and DAB+ in Bavaria, satellite, cable and online, with hourly bulletins, news magazines, interviews and political analysis. The catalog's higher-voted B5 aktuell entry is the same channel.
