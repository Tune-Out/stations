  operator: Global (Global Media & Entertainment Ltd), the UK's largest commercial radio group, owned by Ashley Tabor-King
  affiliations: none known (private commercial company)
  audience: UK-wide adult audience for accessible classical music; reaches approximately 4-5 million weekly listeners (RAJAR), the largest classical audience of any UK station
  format: Mainstream popular classical music — film scores, opera highlights, choral, light classical and orchestral favourites, presenter-led with relaxing presentation. Notable shows include Classic FM Drive, Classic FM at the Movies, More Music Breakfast and Smooth Classics at Seven.
  notes: Classic FM launched on 7 September 1992 as the UK's first national commercial radio station, founded by GWR Group and then-owner Sir Peter Michael, ending the BBC's national-radio monopoly. It revolutionised classical broadcasting by adopting a chart-style, three-minute-attention-span format. Now owned by Global, alongside Heart, Capital, Smooth, LBC and Radio X. It broadcasts on FM (100-102 MHz), DAB, satellite, online and via the Global Player app. Famous presenters have included John Suchet, Aled Jones, Margherita Taylor, Alexander Armstrong, Myleene Klass, and Bill Turnbull. It is fully advertising-funded with no state or religious affiliation.
