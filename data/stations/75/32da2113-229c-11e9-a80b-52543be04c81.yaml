  format: Accessible mainstream classical music, plus film, television and video-game scores, presenter-led throughout the day
  notes: Classic FM launched on 7 September 1992 as the UK's first national commercial radio station, breaking the BBC's monopoly on national radio and pioneering a short-form, presenter-led approach to classical programming. It is owned by Global and broadcasts on FM between 99.9 and 101.9 MHz, on DAB+ since January 2024, on Freeview, Freesat, Sky and Virgin Media, and worldwide online; studios have been in Leicester Square, London, since 2006. RAJAR put it at about 4.7 million weekly listeners in May 2025. Its schedule mixes orchestral and choral favourites with film, TV and video-game scores, and its presenters include Alexander Armstrong, Aled Jones, Myleene Klass, John Humphrys, Jonathan Ross, Alan Titchmarsh and Dan Walker. Two spin-off streams, Classic FM Calm and Classic FM Movies, launched in September 2024.
