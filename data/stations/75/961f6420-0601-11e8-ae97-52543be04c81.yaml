  nature: public broadcaster
  operator: Český rozhlas (Czech Radio), the Czech Republic's statutory public broadcaster
  affiliations: Public-service broadcaster funded by a statutory licence fee and governed by the Czech Radio Council elected by the Chamber of Deputies; member of the European Broadcasting Union; editorially independent
  audience: Czech-speaking adults interested in news, current affairs, analysis and documentary content
  format: All-talk public-service speech network — news, analysis, debates, documentaries, science, history and culture; no music programming
  notes: ČRo Plus launched in 2013 as Český rozhlas's analytical news/talk station, succeeding ČRo 6 and absorbing portions of Český rozhlas Leonardo; broadcast on DAB+ nationally and online (also via medium-wave 639 kHz from Liblice until digital switchover) it carries flagship programmes such as "Pro a proti", "Den podle…", "Interview Plus" and extensive parliamentary, EU and foreign-affairs coverage.
