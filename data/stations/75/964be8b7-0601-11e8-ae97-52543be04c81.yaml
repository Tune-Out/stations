  notes: Dance Wave Retro! is the companion channel of Dance Wave!, an independent Hungarian internet radio started in September 2015 and modelled on international dance web stations. While the main channel plays dance and club music from 2000 onward, Retro! is dedicated to 1990s dance, eurodance, house and trance. The station streams in MP3, AAC+, Ogg, Opus and FLAC, is listed on Hungarian radio portals such as MyOnlineRadio.hu and Online-Radio.hu, and has a large following on community directories (its sister channel is among the most-voted stations on Radio Browser). The operator is not named publicly; the catalog homepage URL contains a typo (dacemwave) and the working site is dancewave.online.
