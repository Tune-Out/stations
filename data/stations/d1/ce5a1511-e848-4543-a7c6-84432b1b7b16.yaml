  audience: Arabic-speaking Sunni Muslim listeners globally, with strong followings across the Maghreb, the Levant, Egypt and the Gulf
  format: 24/7 continuous Quranic recitation by Sheikh Maher Al-Mu'aiqly, drawn from his recordings of the complete Mushaf in the Hafs an Asim narration ("Mushaf al-Murattal"); "classical" tag refers to classical Tilawah, not Western classical
  notes: Sheikh Maher Al-Mu'aiqly (born 1969, Medina, Saudi Arabia) has served as an imam and khateeb at the Grand Mosque of Mecca since 2007 and is one of the most widely streamed Quran reciters in the world, known for his measured Murattal style; this stream is delivered through qurango.net, a major Saudi-based aggregator (operated by the Mp3Quran.net / Quran Radio family) that provides per-reciter dedicated 24/7 streams across the Sunni reciter canon; the network is non-commercial and free to listen, funded by Saudi religious institutions and private donors; misattribution of country origin to Algeria appears to be a Radio Browser metadata artifact rather than a reflection of operator or content provenance.
