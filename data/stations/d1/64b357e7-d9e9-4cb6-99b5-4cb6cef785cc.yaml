  notes: WALM Old Time Radio is one of six channels run by WALM Radio, an internet-only streaming service with no broadcast licence behind its callsign-style name. The channel plays vintage American radio programming around the clock - drama, comedy, mystery and science fiction from the 1920s through the 1950s - and this entry carries it in the Opus codec at low bitrate. WALM's other streams are WALM1 contemporary Christian, WALM2 traditional Christian and classical, Christmas Vinyl, Classic Vinyl and Adroit Jazz Underground. The service markets itself on audio quality, offering HD streams with live track information, and is well regarded in old-time-radio hobbyist circles.
