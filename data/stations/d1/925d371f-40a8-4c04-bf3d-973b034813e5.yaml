  notes: Hot FM 87.7 is a commercial urban-formatted radio station broadcasting on 87.7 MHz from Lusaka, Zambia, founded in the 2000s during the liberalisation of Zambian broadcasting under the Independent Broadcasting Authority. The station positions itself as "more than a radio station — we are a cultural movement," with the tagline "Feel the Music. Feel Zambia." Programming highlights include "The Red Hot Breakfast," "The Urban Vibe," "The Drive Thru," "Club 6 to 9," and "Zed 6 to 6" (a Sunday Zambian-music marathon). The station mixes pan-African music with strong promotion of local Zambian artists, and reaches global audiences via online streaming.
