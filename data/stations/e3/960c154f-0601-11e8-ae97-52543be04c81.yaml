  notes: XHEXA-FM 104.9 MHz Mexico City is the originating flagship of the EXA FM network, MVS Radio's largest brand and one of Mexico's most influential CHR/Top-40 networks. Founded as Exa FM in 2002, the network spans dozens of stations across Mexican cities (Tijuana, Ciudad Juárez, Guadalajara, Monterrey, Puebla, etc.) plus Central American affiliates in Costa Rica, Guatemala, Honduras, and El Salvador. Notable hosts have included Jessie Cervantes ("Jessie en EXA") and Yordi Rosado. Parent MVS Comunicaciones is owned by the Vargas family (Joaquín Vargas Gómez and successors) and also operates MVS Noticias, La Mejor, FM Globo, and Estereorey.
