  format: Classic hits, oldies and adult contemporary pop/rock from the 1960s-1990s aimed at older listeners; live shows and themed programming celebrating Veronica's pirate-radio heritage
  notes: Radio Veronica's brand traces back to the legendary Dutch offshore pirate station Radio Veronica which broadcast from a ship in international waters off the Dutch coast from 1960 until it was outlawed in 1974, becoming a cultural icon of Dutch pop music; the name was later relaunched as a legal commercial station, eventually absorbed into John de Mol's Talpa Radio group, which is now part of Talpa Network; the contemporary station leans heavily on its heritage with classic-hits programming and continues to be one of the most-listened commercial radio stations in the Netherlands.
