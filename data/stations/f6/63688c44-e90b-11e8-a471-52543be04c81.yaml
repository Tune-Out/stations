  notes: Radio Vanya is a Saint Petersburg commercial pop station launched on 3 August 2007, broadcasting on 90.6 FM in the city and relayed in more than 130 Russian cities including Omsk, Murmansk, Saratov, Tomsk, Samara and Chelyabinsk. It is operated by OOO StarsMedia (originally founded within the M10Media holding) and is linked to entrepreneurs Sergey Yamshchikov and Andrey Danilov, who also own Radio dlya Dvoikh and Piter FM and founded Dorozhnoye Radio. The format is upbeat melodic pop, about 80% Russian hits from the 2000s onward and 20% Western songs; shows include the morning programme Batareyki and Odin za vsekh. Mediascope measured about 255,000 daily listeners in the Leningrad region in late 2025/early 2026; it won Radiostation Awards for best pop station (2014) and best dance station (2015).
