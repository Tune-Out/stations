  notes: AIR Satara is a Primary Channel relay/originating station of All India Radio serving Satara district in Maharashtra; AIR is one of the world's largest radio networks with over 470 stations covering nearly all of India in 23 languages and 179 dialects; it operates under the Prasar Bharati Corporation, India's statutory public-service broadcaster, with funding from a government grant and limited commercial revenue, and is editorially independent on paper but in practice closely aligned with the central government's information priorities.
