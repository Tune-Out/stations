  notes: Radio Babel is a music and culture station within Uruguay's public media system, operated by SECAN (Servicio de Comunicación Audiovisual Nacional) and listed on the Medios Públicos del Uruguay portal alongside the country's other state radio services. Its programming leans to jazz and adjacent instrumental and world repertoire, with named programmers including Ángel Atienza and Pablo Zerboni, and it carries live coverage of Uruguayan music events such as the Punta del Este Jazz Festival. It broadcasts in Spanish from Montevideo.
