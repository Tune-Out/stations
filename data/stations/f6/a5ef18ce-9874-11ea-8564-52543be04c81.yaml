  notes: KYKN 1430 AM is a commercial talk radio station licensed to Keizer, Oregon, serving the Salem area. Founded in 1951 as KGAE; changed to KYKN in 1986. Switched from country music to news/talk format in 1991. Operates at 5,000 watts with directional nighttime service. Studios on Cherry Avenue NE in Keizer.
