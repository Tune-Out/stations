  notes: ici Pays de Savoie, formerly France Bleu Pays de Savoie, is Radio France's local public station for the Savoie and Haute-Savoie departments, based in Chambéry and broadcasting on 103.9 FM (Chambéry/Aix-les-Bains), 95.2 (Annecy) and other Alpine frequencies. It launched on 31 May 1988 as Radio France Savoie, joined the France Bleu network in September 2000, and took the 'ici' name in January 2025 when Radio France and France 3 merged their local brands. Programming is a generalist local service of regional news, traffic, culture, listener call-ins and mainstream music, with national programmes from the ici network outside local hours. It is operated by Radio France, not France Télévisions as the earlier notes stated.
