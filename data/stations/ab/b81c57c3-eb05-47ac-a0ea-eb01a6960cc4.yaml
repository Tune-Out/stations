  notes: LOS40 (formerly Los 40 Principales) is Spain's leading commercial music radio network, headquartered in Madrid and operated by PRISA Radio, the radio arm of Grupo PRISA. It began on 18 July 1966 as a Top-40 chart programme on Cadena SER's Radio Madrid, became an independent network in 1979 and rebranded to LOS40 in 2016. The format is contemporary hit radio aimed at 12-30 year olds, with the countdown Del 40 al 1, the morning show Anda Ya, the LOS40 Music Awards and the LOS40 Summer Live tour; it had about 2.78 million daily listeners in 2022. The brand also operates in Mexico, Colombia, Chile, Argentina and other Spanish-speaking countries.
