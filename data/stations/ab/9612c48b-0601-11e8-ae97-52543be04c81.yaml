  notes: Ici Hérault (formerly France Bleu Hérault, renamed on 6 January 2025 with the rest of the France Bleu network) is Radio France's local public station for the Hérault department, based in Montpellier and also heard in parts of Gard, Aveyron, Tarn and Aude on FM and DAB+. Founded in 1927 as Montpellier-Languedoc, it offers local news, service information, regional culture and a mainstream French music mix. The stream still runs on Radio France's direct.francebleu.fr host.
