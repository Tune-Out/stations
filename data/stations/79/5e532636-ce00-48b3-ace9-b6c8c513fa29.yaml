  notes: Monte Carlo Nights ("MC Sweet") is one of several themed sub-channels of Radio Monte Carlo Russia, RMG's lounge/easy-listening brand operating under licence from the Monte Carlo trademark; the station.ru platform aggregates RMG's portfolio (Russkoye Radio, Hit FM, DFM, Maximum, Monte Carlo) as web-radio sub-stations; positions itself as "красивая музыка, которая служит прекрасным фоном и для отдыха, и для работы" ("beautiful music serving as an excellent backdrop for both leisure and work")
