  format: Adult-contemporary music and talk in Afrikaans, with country, golden oldies and listener-interaction shows
  notes: Bok Radio 98.9 FM is a commercial Afrikaans-language radio station broadcasting from Cape Town, licensed by ICASA and on air since 2011; it positions itself as "Kaapstad se jongste progressiewe Afrikaanse Radiostasie" (Cape Town's youngest progressive Afrikaans radio station) and "Die Beter Alternatief" (The Better Alternative); flagship shows include BE OKAY BREAKFAST, AFSKOP, Die HHH Show, UIT-KLOK and AANDSKOF; the station covers greater Cape Town on 98.9 FM and streams worldwide; name "Bok" alludes to the springbok / Afrikaans cultural identity but the station is secular and politically unaffiliated.
