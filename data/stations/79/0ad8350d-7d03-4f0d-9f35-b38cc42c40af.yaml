  notes: ASAN Radio is a government-run Azerbaijani station created by presidential directive and operated by the State Agency for Public Service and Social Innovations (ASAN xidmət), which reports directly to the President of Azerbaijan. It was licensed on 8 September 2015 and began broadcasting on 24 December 2015, describing itself as the first and only radio service specialising in public-service and e-government information. It is carried on 100 MHz in Baku and on 96.5, 95.6 and 92.7 MHz regionally, plus an online stream. Output mixes announcements and explainers about state services with domestic and international news, interviews, current-affairs discussion and music. As a state agency outlet its editorial line follows the government, though its remit is civic-service information rather than political messaging.
