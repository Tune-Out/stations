  notes: Bollywood Gaane Purane ('Old Bollywood Songs') is an independent internet-only station that streams hand-picked vintage Hindi film music from the 1960s through the 1990s around the clock without presenters. It is distributed through the free Zeno.FM hosting platform and its homepage sits on a free my-free.website page, pointing to a hobbyist operator rather than a licensed broadcaster. The stream states its aim as promoting classic Hindi music to a worldwide audience. A lower-voted catalog entry 'Radio Bollywood Gaane Purane' carries the same station on a different Zeno mirror. The high vote count against a modest click count may reflect voting campaigns.
