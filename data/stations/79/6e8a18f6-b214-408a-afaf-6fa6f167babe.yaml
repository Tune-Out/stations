  notes: 101 Smooth Jazz is an internet radio station dedicated to smooth jazz, a commercially-oriented jazz subgenre characterized by mellow, accessible instrumentation often featuring electric guitar, electric piano, synthesizers and light horn sections. The station is hosted on Radionomy (now part of Streamium), a free web radio hosting platform popular for hobbyist and independent broadcasters. Smooth jazz experienced significant mainstream popularity in the 1990s-2000s via FM radio and satellite in the US and has a dedicated listening community globally. The station streams via Shoutcast/Radionomy infrastructure at 128 kbps MP3. The website at 101smoothjazz.com is maintained minimally, typical of independent operator stations.
