  notes: Iran International is a Persian-language 24-hour news channel launched in London on 18 May 2017 and owned by Volant Media UK Ltd. It is strongly critical of the Islamic Republic and rose to prominence during the 2022 Mahsa Amini protests; Iran declared it a terrorist organisation in November 2022, and after police warnings of credible threats it temporarily moved operations to Washington, D.C. in 2023 before returning to a new London base. The Guardian and Wall Street Journal have reported substantial Saudi funding, which management denies, and critics accuse it of a pro-Saudi editorial line. Journalist Pouria Zeraati was stabbed outside his London home in March 2024, and Iranian-linked hackers leaked internal data in 2025. The radio stream simulcasts the channel's audio and is also carried on shortwave into Iran. This 'HTTPS stream' entry duplicates the higher-voted canonical Iran International entry.
