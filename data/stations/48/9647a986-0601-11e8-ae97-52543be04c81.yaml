  notes: Polskie Radio Chopin is the thematic classical-music channel of Polskie Radio, Poland's national public broadcaster, launched 11 November 2017 on DAB+ (MUX-R3) and online from Warsaw. It broadcasts classical music around the clock with a strong emphasis on Chopin, Polish composers and the International Chopin Competition, plus essays, discography features and podcasts. Editor-in-chief is Piotr Matwiejczuk (since 2024, succeeding Marcin Gmys). The catalog stream on port 8960 is dead; the live 192 kbps MP3 feed is on http://stream3.polskieradio.pl:8910/ (used by the sibling entry 964a72fd).
