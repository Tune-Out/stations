  nature: state media
  operator: China National Radio (CNR / 中央人民广播电台), the national state-run radio broadcaster of the People's Republic of China; CNR is part of China Media Group (中央广播电视总台, also known as Voice of China), formed in 2018 by merging CNR, CCTV, and China Radio International
  affiliations: directly administered by the Publicity Department of the Chinese Communist Party (CCP) Central Committee and supervised by the National Radio and Television Administration; functions as an official mouthpiece of the Chinese state
  audience: Mandarin-speaking music listeners across mainland China
  format: CNR-3 ("Music Radio" / 音乐之声) is China's flagship national music network, broadcasting Mandopop, international pop, charts, and DJ shows 24 hours a day
  notes: CNR-3 Music Radio launched 1 December 2002 as China National Radio's third channel, dedicated to popular music; it pioneered the "Music Radio" format in China and is the country's most-listened-to music radio brand, running flagship countdown shows such as "China Top Charts" (中国TOP排行榜); like all CNR channels it operates under the Party's editorial direction, but the channel itself is musically programmed and considered entertainment-focused
  sources: internal knowledge
