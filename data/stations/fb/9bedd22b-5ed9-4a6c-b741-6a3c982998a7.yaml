  notes: WDR 4 is one of the radio services of Westdeutscher Rundfunk (WDR), the public broadcaster for the German state of North Rhine-Westphalia and the largest member of the ARD federation. Launched on 1 January 1984 as a successor to WDR's earlier programming, WDR 4 evolved into a Schlager and oldies channel targeted at older adult listeners. It broadcasts on FM throughout NRW and on DAB+. Programming includes German Schlager hits, international oldies, German-language music news, and lifestyle features. As an ARD public broadcaster, WDR is constitutionally independent of government but funded by mandatory household contributions under the Rundfunkbeitrag system, governed by a Rundfunkrat (broadcasting council) representing societal groups. WDR's headquarters is in Cologne.
