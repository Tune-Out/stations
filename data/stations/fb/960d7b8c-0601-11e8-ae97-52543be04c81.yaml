  notes: Sky Radio is one of the Netherlands' major commercial radio brands, broadcasting on 101 FM in multiple Dutch cities (Amsterdam, Rotterdam, Utrecht, The Hague, Groningen area) and nationwide via online streaming. The station was acquired by Mediahuis Radio in 2024 as part of the broader acquisition of Talpa Network's radio assets. Mediahuis Radio also operates Sublime FM (soul/jazz), 538 (dance), Radio M (ethnic), Veronica (rock) and other brands. Sky Radio targets an adult contemporary audience with soft pop, familiar melodies and accessible music. The station has a long history in Dutch broadcasting (dating to the 1980s offshore radio era) and remains one of the most-listened-to stations in the Netherlands. Streams at 64 kbps AAC+ via StreamTheWorld CDN. No major controversies.
