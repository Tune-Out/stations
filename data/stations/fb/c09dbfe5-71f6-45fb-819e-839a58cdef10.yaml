  affiliations: French public service media; part of the "ici" regional network jointly developed by Radio France and France Télévisions
  audience: Residents of the Nord département and Lille metropolitan area; French-speaking
  format: Regional generalist station — local news, traffic, weather, sport (especially LOSC Lille football coverage), service journalism, cultural features and French popular music (chanson, variétés)
  notes: ICI Nord is the rebranded name (since January 2025) of France Bleu Nord, Radio France's local station based in Lille covering the Nord département; Radio France and France Télévisions merged the France Bleu and France 3 regional brands under the single "ici" identity to strengthen local public-service media; the station traces its origins to Radio France Lille Nord in 1980 and has long served as a primary public information source for the historic Nord-Pas-de-Calais region.
