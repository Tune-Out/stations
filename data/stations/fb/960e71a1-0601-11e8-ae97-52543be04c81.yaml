  notes: Radio România Actualități is the main general-interest channel of Romania's public broadcaster, Societatea Română de Radiodifuziune, tracing its origins to the first Romanian broadcast on 1 November 1928. It is the only Romanian radio station with near-total (over 99%) national coverage, via a network of AM (from 531 kHz) and FM transmitters, and it extended its satellite licence in November 2025. The schedule is built around the Radiojurnal news bulletins, plus talk, sport, traffic and weather, mixed with Romanian and international music from recent decades. It ranks among the top three stations nationally with about 1.7 million daily listeners (2023). The stream is an AAC+ feed from an SRR server.
