  format: '"Föhnfrisur" is a sub-stream of delta radio dedicated to hard rock and heavy metal (the name is a German tongue-in-cheek term for "wind-blown hair," evoking headbangers); curated continuous rock/metal music'
  notes: delta radio launched in 1994 as a private commercial station for northern Germany based in Kiel; the main station's tagline is "Neuer. Besser. delta" (Newer. Better. delta); "Föhnfrisur" is one of several genre side-channels (alongside Country, EDM Dancefloor, etc.) delivered via webstream, app, and DAB+; ownership has historically involved Regiocast (Kiel-based radio group co-owning multiple German regional commercial stations) with stakes from Bauer Media and other private investors.
