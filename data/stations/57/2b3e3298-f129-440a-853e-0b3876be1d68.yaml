  operator: Iberoamerican Radio Chile (IARC), part of Grupo Prisa's PRISA Radio division (Spain); since 2024 IARC has changed hands several times, with Prisa selling its Chilean radio assets — verify current owner via filings
  affiliations: Privately held commercial broadcaster historically tied to Spain's Grupo Prisa (publisher of El País); editorially independent though regarded as broadly centre/centre-left mainstream; no formal party or religious ties
  audience: Spanish-speaking adults across Chile (national network on FM 91.7 in Santiago plus ~30 affiliate frequencies in regional cities); diaspora and Latin American online listeners
  format: News, talk, current-affairs interviews, sports (football and tennis emphasis) and commentary — "radio hablada" (spoken-word) format with hourly news bulletins
  notes: ADN Radio Chile launched on 30 March 2009, replacing the legacy Radio La Clave on the FM 91.7 Santiago frequency, as Grupo Prisa's Chilean entry into the all-news/talk segment competing with Cooperativa and Bío-Bío; the name "ADN" stands for "Agencia de Noticias"; flagship programmes include "Ciudadano ADN" (afternoon current affairs), "Doble Click" (sports), and the morning news block; the station is widely cited as a credible mainstream source on the Chilean political spectrum
  sources: internal knowledge only
