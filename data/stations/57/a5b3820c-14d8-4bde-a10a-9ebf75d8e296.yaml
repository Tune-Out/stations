  operator: OZ Slobodný vysielač - občianske združenie (civic association), based in Banská Bystrica, Slovakia
  affiliations: politically independent but editorially associated with alternative-media, anti-establishment and conspiracy-leaning currents in Slovak public discourse; not affiliated with state RTVS or any party, religion or major media group
  audience: Slovak adult listeners interested in alternative perspectives on politics, geopolitics, health, spirituality and history; Slovak language
  format: Predominantly talk-radio - interviews, discussions, analysis, listener call-ins on social, geopolitical and societal themes, plus some music
  notes: "\"Slobodný vysielač\" (literally \"Free Broadcaster\") launched in 2013 in Banská Bystrica as Slovakia's first explicitly alternative internet/community talk-radio project, funded mainly through listener donations and member contributions. It has been a focus of public debate in Slovakia: supporters describe it as a platform for views excluded from mainstream media, while critics and fact-checking organisations have repeatedly flagged it for amplifying disinformation on topics such as COVID-19, vaccines, Russia/Ukraine and conspiracy theories. It operates without an FM licence and streams primarily online."
