  operator: Schweizer Radio und Fernsehen (SRF) — German-language unit of SRG SSR (Swiss Broadcasting Corporation)
  affiliations: SRG SSR public-service broadcaster (funded by household licence fees / Serafe and federal mandate); politically independent under federal media law
  audience: German-speaking Swiss residents in Eastern Switzerland (cantons St. Gallen, Thurgau, Appenzell Innerrhoden / Ausserrhoden, Glarus, Schaffhausen, and parts of Graubünden)
  format: Regional news magazine programme (Regionaljournal Ostschweiz) carried on the SRF 1 nationwide channel — local news, politics, culture, and weather updates
  notes: SRF 1's "Regionaljournal" streams are the seven regional news windows broadcast within the flagship Radio SRF 1 daytime schedule, each focusing on one part of German-speaking Switzerland; the Ostschweiz (Eastern Switzerland) edition is produced in St. Gallen and broadcasts twice-daily news magazines at 06:30, 07:30, 12:03, and 17:30; SRG SSR was founded in 1931 as a federal monopoly broadcaster and operates under a federal concession with editorial independence; funded primarily by the Swiss household media fee (Serafe AG); the 2018 "No Billag" referendum (rejected with ~71.6% no vote) reaffirmed Swiss public-broadcasting funding.
