  nature: community
  operator: Association loi 1901 student-run radio based at Université Lumière Lyon 2; affiliated with the Radio Campus France federation and the international IASTAR network of student radios
  affiliations: member of Radio Campus France and IASTAR (International Association of Student Television and Radio); links to the ICOM (Institut de la Communication) at Lyon 2; licensed in France under the "Category A" associative non-profit radio regime by the regulator ARCOM (formerly CSA)
  audience: students and young adults in the Lyon metropolitan area and wider Auvergne-Rhône-Alpes region; French language
  format: cultural, music-discovery and student-life programming covering indie/alternative music, cinema, theatre, festivals and current affairs, plus student magazines such as "L'Oeil du vendredi"
  notes: Lyon-based campus radio operating online and via DAB+; relies on student volunteers and donations rather than advertising; sister content brands include "tendances brume" (music), "campus brume" (student life) and "Pop United"; part of the broader French Radios Campus tradition that also includes Radio Campus Paris, Radio Campus Bruxelles and others; not to be confused with Brume, the ambient/experimental record label
  sources: https://www.radiobrume.fr/
