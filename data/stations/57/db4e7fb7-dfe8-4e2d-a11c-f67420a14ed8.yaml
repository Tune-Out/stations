  nature: public broadcaster
  operator: Vlaamse Radio- en Televisieomroeporganisatie (VRT) — Flemish public service broadcaster, autonomous public-law company of the Flemish Community of Belgium
  affiliations: VRT, governed by management contract with the Flemish Government; EBU member; editorially independent; funded by Flemish Community grant and limited advertising; no party/religious affiliation
  audience: Flemish/Dutch-speaking adults across Flanders and Brussels, generally aged 35+, interested in news, talk and quality music
  format: "Talk-led full-service public radio: news bulletins, current-affairs magazines, cultural and human-interest interviews, plus eclectic adult music (Belgian and international)"
  notes: VRT Radio 1 is one of five VRT public radio nets (alongside Radio 2, Klara, MNM and Studio Brussel); successor of the old BRT/BRTN "Radio 1" speech network; the station's mission per the VRT management contract is to inform, educate and entertain Flemish citizens with quality journalism and broad cultural content; flagship programmes have included De Ochtend (morning news), De Wereld Vandaag (evening news magazine), Hautekiet, Touché and Interne Keuken; broadcasts on FM, DAB+ and the radio1.be / VRT MAX streaming platform (radio1.be redirects to vrt.be/vrtmax/kanalen/radio-1)
