  nature: public broadcaster
  operator: Kringvarp Føroya (KVF), the Faroese national public service broadcaster
  affiliations: Government of the Faroe Islands; member of the European Broadcasting Union (EBU) and Nordvision
  audience: Faroese-speaking general public across the Faroe Islands (population ~54,000)
  format: Full-service public broadcasting — news ("Tíðindi"), sports ("Ítróttur"), culture ("List"), religion, music, parliamentary coverage and children's programming, tagline "Tíðindi, mentan og ítróttur"
  notes: Kringvarp Føroya was formed in 2005 by merging the long-standing radio broadcaster Útvarp Føroya (founded 1957) with the TV broadcaster Sjónvarp Føroya (founded 1984); operates one main radio channel (Útvarp) plus the TV channel Sjónvarpið; financed through a public broadcasting fee/state appropriation and is required by law to provide impartial public-service content in Faroese; the broadcaster covers both Faroese Parliament (Løgting) elections and Danish national affairs given the Faroes' status as a self-governing nation within the Kingdom of Denmark.
  sources: http://kvf.fo/, internal knowledge
