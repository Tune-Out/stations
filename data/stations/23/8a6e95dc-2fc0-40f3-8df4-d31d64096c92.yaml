  notes: Guliay Radio ("Гуляй Радіо", meaning roughly "Party Radio" or "Let's Walk Radio") is a Ukrainian-language internet radio station focused on disco and retro dance music; operated under the TAVR Media group, one of Ukraine's largest commercial radio operators which also runs Hit FM, Radio ROKS, Russkoe Radio Ukraine (now rebranded), and others; tagline "Будьмо!" ("Cheers!" / "Let's be!") is a traditional Ukrainian toast; broadcasts at 128 kbit/s MP3; appeared on Radio Browser as a streaming-only service; gained relevance amid the post-2022 Russian invasion shift of Ukrainian media to Ukrainian-language programming.
