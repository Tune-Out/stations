  notes: Fritz is the youth channel of Rundfunk Berlin-Brandenburg, part of the ARD federation and funded by the German licence fee. It launched in 1993 as the successor to the GDR youth station DT64 and broadcasts on FM across Berlin-Brandenburg (102.6 in Berlin) plus DAB+ and stream. Programming is alternative pop, hip-hop, indie and electronic music with talk and cultural strands, including the long-running late-night call-in Blue Moon and hip-hop show Trackback, and heavy coverage of the region's festival scene.
