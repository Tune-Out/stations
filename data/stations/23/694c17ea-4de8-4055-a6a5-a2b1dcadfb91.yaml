  operator: Taasta Raadio OÜ (Star FM) — part of Sky Media Group / formerly under the Bauer Media / SBS Discovery ownership structure that consolidated Estonian commercial radio
  affiliations: none known (no religious, governmental, or political affiliation)
  audience: Young adult Estonian-speaking listeners — pop / Top 40 audience, broadly 15–35
  format: Contemporary hit radio / CHR pop — international and Estonian Top 40 hits, with a popular morning show ("Hommikuprogramm") and interactive on-air games such as "Sünnipäevamäng" (Birthday Game), "Võimatu küsimus" (Impossible Question) and "Õige või vale?" (True or False?); slogan "Igavesti noor!" ("Forever young!")
  notes: One of Estonia's largest commercial pop radio networks; broadcasts on FM in Tallinn (96.6 MHz) and via a relay network across Estonia (Tartu, Pärnu, Narva, etc.); the Star FM brand was originally launched in the 1990s and has changed ownership several times during the consolidation of Baltic commercial radio (SBS Broadcasting, ProSiebenSat.1 / SBS Discovery, then local Estonian investors); headquartered at Peterburi tee 81, Tallinn; commercial advertising-funded; raadiod.com is a third-party Estonian web aggregator that re-streams the official Star FM signal — the canonical homepage of the station is starfm.ee.
