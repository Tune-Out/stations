  operator: Chada Communication, a Moroccan private media group headquartered in Casablanca; founded by Moroccan businessman and media entrepreneur (the station was originally launched under the Chada FM brand in 2006)
  affiliations: none political or religious; licensed by the Haute Autorité de la Communication Audiovisuelle (HACA), Morocco's broadcast regulator; commercial advertising-funded; like all Moroccan broadcasters operates under HACA's editorial guidelines
  audience: mainstream Moroccan audience, particularly Darija (Moroccan Arabic) speakers; broadcasts in Moroccan Arabic with some French
  format: hit-driven music station with strong emphasis on Moroccan, Arab and international pop, plus morning entertainment talk, sports analysis and football coverage; tagline "Enjoy Awesome Music"; sister brands include Chada TV, Chada Sport and Chada News
  notes: One of Morocco's leading private commercial radio stations following the 2006 liberalisation of the Moroccan audiovisual market; broadcasts on FM across multiple Moroccan cities (including Casablanca, Rabat, Marrakech, Tangier, Agadir, Fes and Oujda); flagship shows include "Chada Morning" and the football programme "L'BOTOLA"; has expanded into a multi-platform media brand
