  notes: Virgin Radio Türkiye is a national commercial music station that began broadcasting on 1 August 2008 when Doğuş Media Group licensed the Virgin Radio brand from Virgin Group; the Turkish licence passed to Karnaval Media Group in December 2013, which still operates it as part of its Karnaval portfolio (alongside Radyo D, Slow Türk, Kral FM and others). It is heard on FM across Turkey, including 106.2 in Istanbul, 93.8 in Ankara and 101.8 in Izmir, and online via karnaval.com. Since early 2019 the playlist has shifted from international rock/pop toward Turkish pop and Turkish rap, with presenter-led shows such as Günaydın A.Ş. (Emre Turhan), Kafana Göre (Yağız Kahraman) and Rabarba (Mesut Süre). The old virginradioturkiye.com domain now redirects to the Karnaval player page.
