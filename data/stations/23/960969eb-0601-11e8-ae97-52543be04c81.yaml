  nature: commercial
  operator: Karnaval Medya (Doğuş Yayın Grubu / Doğuş Media Group), operating the Virgin Radio brand under licence from Virgin Enterprises Ltd (UK).
  affiliations: Part of the Doğuş Group conglomerate; Virgin Group brand licensee; no religious or political alignment declared.
  audience: Turkish urban 18-44 demographic; rock, indie and international pop-rock listeners; nationwide FM coverage and online via Karnaval.
  format: Pop rock and modern rock — international and Turkish hits, alternative and indie tracks, DJ-led morning and drive-time shows.
  notes: Launched in Türkiye in 2008 after Doğuş Media Group acquired the licence to operate the Virgin Radio brand; broadcasts on FM in Istanbul (104.7) and other major Turkish cities and is one of the country's leading rock-oriented commercial stations; sister stations under Karnaval include Radyo D, Slow Türk, Kral FM and Power-related brands within the broader media holding; the station's homepage redirects to karnaval.com (Doğuş's streaming portal).
