  notes: Rebetiko Sealabs is the radio stream of rebetiko.sealabs.net, a volunteer Greek archive devoted to rebetiko and related traditional urban song. The site is explicitly non-commercial, releases its material under Creative Commons BY-NC-SA 4.0 and is built around the Rebetopedia wiki, member forums and user-contributed recordings. The stream draws on that archive, covering rebetiko alongside student songs, elafró, theatrical and regional Greek repertoire — a genuinely specialist body of music that is hard to find elsewhere.
