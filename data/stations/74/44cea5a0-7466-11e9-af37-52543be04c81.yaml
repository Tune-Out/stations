  format: 24/7 Mandarin-language business and financial news radio — market reports, macroeconomic commentary, policy briefings, industry analysis, and live coverage of A-share and bond markets
  notes: Yicai (literally "First Finance & Economics") is China's flagship business and financial media brand, launched in 2003 by Shanghai Media Group as China Business Network; the group operates a TV channel (CBN-TV, "第一财经频道"), the Yicai daily newspaper, Yicai Global (English), the Yicai Research Institute, and this radio service; it has cooperation agreements with international outlets and has hosted high-profile events such as the Yicai Global Conference; while operating commercially with advertising and subscription revenue, all major Chinese state media including SMG and Yicai operate under Communist Party publicity guidelines and self-censor on politically sensitive economic topics; the radio service originated as Shanghai's CBN Radio (第一财经广播, FM 97.7 in Shanghai).
