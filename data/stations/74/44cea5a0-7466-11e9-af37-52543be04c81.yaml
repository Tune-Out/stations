  operator: 第一财经 (Yicai Media Group / China Business Network, CBN) — a subsidiary of Shanghai Media Group (SMG)
  affiliations: Shanghai Media Group is owned by the Shanghai Municipal Government; ultimately operating under the supervision of the Publicity Department of the Chinese Communist Party and the National Radio and Television Administration (NRTA)
