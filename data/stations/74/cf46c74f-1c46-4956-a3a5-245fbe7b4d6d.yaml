  notes: 88 FM (Kan 88) is the music-and-culture-oriented public radio station of Kan, Israel's public broadcaster which replaced the Israel Broadcasting Authority (IBA) in 2017 following a contentious government restructuring; the station is known for jazz, alternative, world and Israeli music alongside cultural documentaries and interview programmes, and broadcasts on 88.0 MHz in Jerusalem with relays across the country; Kan as a whole is funded by direct government appropriation (vehicle-licence levy and budget) and is editorially independent by statute, though it has periodically faced political pressure from successive governments.
