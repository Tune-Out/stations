  notes: BBC Radio 2 launched on 30 September 1967 (replacing the BBC Light Programme), is the UK's most popular radio station, regularly reaching 13-15 million weekly listeners. As one of the BBC's flagship national radio networks, it is operated by the BBC under its Royal Charter and Public Purposes, funded primarily by the UK television licence fee, and is required to be politically impartial under the BBC's editorial guidelines and Ofcom Operating Licence. Notable presenters historically include Terry Wogan, Steve Wright, Ken Bruce, Jo Whiley, Sara Cox, Zoe Ball, Vernon Kay, and Scott Mills. Broadcasts on FM (88-91 MHz), DAB, digital TV, and online via BBC Sounds.
