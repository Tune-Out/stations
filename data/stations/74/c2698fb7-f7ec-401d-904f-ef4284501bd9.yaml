  notes: RFI Afrique is the Africa-targeted French-language service of Radio France Internationale, the public international broadcaster founded in 1975 and operated by the state-owned France Médias Monde. It shares RFI's Paris newsroom but carries ten Africa-specific daily news editions plus programmes on African politics, economy, culture and sport, and is relayed on FM in dozens of African cities. Africa accounts for around 60% of RFI's roughly 59.5 million weekly listeners; the service has been suspended by military governments in Mali (2022), Burkina Faso (2022), Niger (2023) and Togo (2025). Funding comes from the French audiovisual levy and the foreign ministry.
