  notes: Polskie Radio 24 (PR24) is the news and information channel of Polskie Radio S.A., Poland's public radio broadcaster founded in 1925. It began in December 2010 as an internet station produced by the Informacyjna Agencja Radiowa newsroom, joined DAB+ on 1 October 2013 and moved onto FM on 1 September 2016 using frequencies previously held by Czwórka, reaching roughly 15 million people. Under the 2015-2023 PiS government it was widely criticised as pro-government; after the December 2023 public-media crisis the new administration placed Polskie Radio into liquidation as a legal manoeuvre while it continued operating, Grzegorz Frątczak became acting director, and the schedule was broadened in 2024-2025 with new shows on the economy, climate, technology and culture. The catalog's legacy Shoutcast URL on stream3.polskieradio.pl is dead; the station now streams via HLS from stream15.polskieradio.pl.
