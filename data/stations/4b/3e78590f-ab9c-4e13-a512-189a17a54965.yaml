  notes: CIN Khabar is the news service of the Community Information Network (CIN), a Nepali non-profit network of community FM radio stations headquartered in Chakupat, Lalitpur (Patan). CIN produces the syndicated "Sajha Khabar" news bulletins several times a day and distributes them to partner community stations across all seven provinces (Radio Bhedetar, Radio Lumbini, Bheri FM and dozens more), alongside podcasts on peace-building and parliamentary affairs and a CIN TV video strand. The stream carries this Nepali-language news and talk output rather than a single Kathmandu FM station.
