  notes: '2B! Radio Sangam Shri Ram was one of a family of Hindi devotional channels published under the 2B! Radio India banner, each dedicated to a deity (Shri Ram, Krishna, Shiva, Devi Maa, Ganesha). The station''s homepage, 2bradioindia.com, no longer serves radio content at all: as of September 2026 it redirects to a Czech-language online-casino affiliate site (online-kasino.2bradioindia.com), so the domain has lapsed and been repurposed by a third party. The Airtime Pro stream at dard.out.airtime.pro is still reachable and serving audio, but it announces only the platform''s default metadata ("Airtime!", "Airtime Radio! Stream #1"), with no station name, so there is no way to confirm the channel is still curated or that it is still the Shri Ram feed. Treat this entry as unverified until an operator-controlled site reappears.'
