  audience: Urdu- and Punjabi-speaking listeners across Punjab province, with focus on Lahore metropolitan area; covers AM 1332 kHz medium-wave footprint
  format: News and current affairs in Urdu — hourly bulletins, talk and analysis, parliamentary and government coverage, public-service announcements
  notes: Radio Pakistan Lahore on AM 1332 kHz is part of the Pakistan Broadcasting Corporation, the country's official state broadcaster, which traces its origin to All India Radio's Lahore station (founded 1937) and was reconstituted as Radio Pakistan after partition in 1947. PBC operates a national network of medium-wave, short-wave and FM stations. Lahore is a major regional centre; this News & Current Affairs channel carries the corporation's flagship news bulletins, government messaging and current-affairs talk. As a state broadcaster PBC has historically been an instrument of official messaging and has at various times been subject to criticism over editorial independence.
