  format: eclectic alternative and underground music - electronic, indie rock, jazz, ambient, hip-hop, world, experimental - mixed with arts, culture, books, cinema and local news programming
  notes: NEU RADIO is a Bologna-based independent web-radio launched in 2017 by the Associazione Culturale Humus, dedicated to independent music and urban culture; the station collaborates with local venues, festivals and cultural organisations and produces a wide schedule of host-curated shows including "Dall'Alba al Tramonto" (cultural agenda), "Area Contaminata" (electronic/post-punk), "Class+" (hip-hop), "Solaris" (ambient), "Il Parnaso Ambulante" (books) and "Storyville - The District" (jazz); it has become a recognised voice in Italy's underground and DIY music scene.
