  notes: Galgalatz is Israel's most popular music station, operated since 31 October 1993 by Galei Tzahal, the Israel Defense Forces radio service, in partnership with the Ministry of Transport and Road Safety. It airs pop and rock in Hebrew and English, traffic reports and hourly news, and publishes the official Israeli music chart every Thursday; it transmits on 91.8 MHz in Tel Aviv and other frequencies nationwide. The earlier notes attributing it to the defunct IBA were wrong. The catalog already has a higher-voted canonical Glglz entry for the same stream.
