  nature: commercial
  operator: FM 100 Pakistan (privately licensed network, Karachi-based flagship)
  affiliations: none known; private commercial network licensed by Pakistan Electronic Media Regulatory Authority (PEMRA), no formal party or religious affiliation
  audience: Urban Pakistani adults across major cities; primary languages Urdu and English with some Sindhi content on the Karachi station
  format: 24/7 mainstream music and entertainment with morning shows, celebrity/showbiz talk, light news, sports, weather, and lifestyle features
  notes: FM 100 Pakistan is one of Pakistan's earliest and best-known private FM brands, launched in the mid-1990s after Pakistan opened its airwaves to private FM operators; the Karachi station broadcasts on 100 MHz from Sindh and is the flagship of a network with affiliated frequencies in Lahore, Islamabad, Hyderabad, Rahim Yar Khan, Gujrat, Jhelum, Abbottabad and Multan; the network features long-running morning programmes such as "Good Morning Pakistan" and emphasises Bollywood/Lollywood music, Pakistani pop, RJ-driven entertainment talk and call-in shows; it is regulated by PEMRA and, like all Pakistani FM broadcasters, is restricted from independent news bulletins on FM and must rely on PBC/state news feeds for hard news content.
  sources: http://fm100pakistan.com/, internal knowledge
