  nature: community
  operator: Pretoria FM (NPC), licensed as a community broadcaster by ICASA (Independent Communications Authority of South Africa)
  affiliations: Afrikaans-language cultural and community organisations in the Tshwane (Pretoria) region; no explicit party-political ties though it serves the Afrikaner cultural community
  audience: Afrikaans-speaking residents of Pretoria / Tshwane and surrounding Gauteng/North West areas (estimated 100,000+ weekly listeners)
  format: Afrikaans-language community radio with music (Afrikaans pop, classic hits), news, talk, religion, and community service programming
  notes: Pretoria FM broadcasts on 104.2 MHz from Pretoria (Tshwane) as one of South Africa's larger Afrikaans community stations, licensed under ICASA's community broadcasting framework which mandates non-profit, community-controlled operation; it serves the Afrikaans-speaking community of the capital with a mix of music, talk and devotional content, and is part of the wider network of Afrikaans community FMs (Radio Pretoria, OFM, Jacaranda) competing for that listenership; not to be confused with the politically conservative "Radio Pretoria" — Pretoria FM is a separate, ICASA-licensed community service.
  sources: internal knowledge only
