  notes: M'era Luna FM is the official year-round online radio station of Germany's M'era Luna Festival, an annual gothic/industrial music festival held since 2000 at the former airbase in Hildesheim, Lower Saxony; it is one of Europe's largest dark-scene events, drawing tens of thousands annually, with past headliners including Within Temptation, Lacrimosa, VNV Nation, Project Pitchfork and OMD; the stream serves as a community channel for the "Moonborn City" subculture between festival editions and is distributed via radio.de and the festival's own apps.
