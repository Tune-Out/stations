  notes: Latina Reggaeton is one of the themed webradio channels of Radio Latina, the French Latin-music network that launched in 1982 and broadcasts on 99.0 FM in Paris plus frequencies in Marseille, Nice and Cannes. The parent station has been owned since 2006 by Groupe 1981, an Orléans-based private radio group, and is a commercial Category B service. This channel narrows the parent's salsa, merengue, bachata and kompa mix down to reggaeton and Latin urban tracks in a continuous automated rotation. It is distributed only online, alongside sister streams such as Latina Salsa, Latina Bachata and Latina Kizomba.
