  notes: Teleradyo Serbisyo airs on DZRJ 810 kHz Manila (or 630 AM per the URL slug "radyo-630") and is the successor to ABS-CBN's flagship news radio brand DZMM Radyo Patrol/TeleRadyo, which went off the air on free TV in 2023 after the National Telecommunications Commission denied ABS-CBN's franchise renewal in 2020. The brand relaunched as a partnership between ABS-CBN and PCMC/Prime Media. PCMC is part of the Manny V. Pangilinan-affiliated media network (which also includes TV5, One News, and other outlets via MediaQuest Holdings). The station carries flagship ABS-CBN-produced programs including Pasada sa Teleradyo, Headline Pilipinas, Sakto, and SRO (Suhestiyon, Reklamo at Opinyon), continuing ABS-CBN's long-running public service journalism tradition.
