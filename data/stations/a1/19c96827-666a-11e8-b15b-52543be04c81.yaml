  notes: Fantastic TV (HKFTV) is one of Hong Kong's free-to-air television broadcasters licensed in 2016 after the controversial denial of an HKTV license; operates two channels, the Chinese channel (77) and an English channel; owned by Fantastic Television Limited, a subsidiary linked to i-Cable Communications via its parent Forever Top (Asia) Limited (Henderson Land/David Wong); launched broadcasting in 2017 as the first new free-to-air TV operator in decades; broadcasts terrestrial digital television across Hong Kong and streams online; entered the market amid criticism of the Hong Kong government's broadcast licensing decisions; programming includes Cantonese news, talk shows, drama, and lifestyle content.
