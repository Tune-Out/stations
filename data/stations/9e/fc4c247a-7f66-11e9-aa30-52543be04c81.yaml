  nature: public broadcaster
  operator: Munhwa Broadcasting Corporation (MBC), South Korea's largest commercial-public hybrid broadcaster; majority owned by the Foundation for Broadcast Culture (Bangmun-jin), with the remainder held by the Jung-Su Scholarship Foundation
  affiliations: Foundation for Broadcast Culture is regulated by the Korea Communications Commission; MBC has a quasi-public status although it earns nearly all its revenue from commercial advertising
  audience: Nationwide Korean-language audience across Seoul-metropolitan and regional MBC affiliates
  format: MBC FM (also known as MBC Standard FM / 95.9 MHz in Seoul) carries general talk, current-affairs, drama, sports and music programming targeted at adults
  notes: MBC was founded in 1961 and launched MBC Standard FM in 1971; the "MBC FM" branding in this stream points to the talk/general MBC Standard FM channel (distinct from MBC's music-focused FM4U at 91.9 MHz); long-running flagship shows include "Son Seok-hee's Newsroom" predecessors, "Bae Cheol-soo's Music Camp" (on FM4U), and the morning news-talk block; MBC has periodically been at the centre of political controversies in South Korea over executive appointments and labour disputes during both progressive and conservative administrations.
