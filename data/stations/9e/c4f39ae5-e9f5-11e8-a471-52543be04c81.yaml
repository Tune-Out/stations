  notes: Radio Mojahed is the official radio outlet of the People's Mojahedin Organization of Iran (Mojahedin-e Khalq / MEK / PMOI), an Iranian dissident group that opposes the Islamic Republic and is the principal component of the National Council of Resistance of Iran (NCRI); the MEK was founded in 1965, originally blended Islamic and Marxist ideology, broke with Khomeini after the 1979 revolution, was based at Camp Ashraf in Iraq until 2012-2016, and now operates primarily from Camp Ashraf 3 in Albania; the group was designated a terrorist organisation by the US (delisted 2012), EU (delisted 2009), and UK (delisted 2008), and remains highly controversial. The "Tehran" state metadata is symbolic — the broadcast originates from outside Iran. Despite the IR country code in the directory, the station is not based in nor sanctioned by the Iranian state; it is broadcast in opposition to it.
