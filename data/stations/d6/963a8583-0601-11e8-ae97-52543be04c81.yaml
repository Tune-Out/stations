  operator: Rádio LUMEN, spol. s r.o. — Catholic radio operator backed by the Slovak Catholic episcopate (Konferencia biskupov Slovenska / KBS)
  affiliations: Roman Catholic Church; Conference of Bishops of Slovakia (KBS); member of the international SIGNIS network of Catholic media
  audience: Slovak-speaking Catholic faithful and Christian listeners across Slovakia; broadcasts nationally via FM, DAB+, and online
  format: Catholic Christian radio — religious programming, daily Mass and rosary broadcasts, Christian music, religious news, talk, family and ethical issues, and cultural programming
  notes: Rádio Lumen began broadcasting on 28 September 1993 from Banská Bystrica as the first Christian radio station in Slovakia after the fall of communism; it is non-profit, financed by listener donations, sponsorships, and church support, and is licensed by the Slovak Council for Broadcasting and Retransmission as a multi-regional broadcaster; "Lumen" (Latin for "light") reflects its evangelical mission; programs include "Lupa," "Pohode," daily Holy Masses, Vatican Radio relays, and rosary prayers; it has been recognised as Slovakia's flagship Catholic broadcaster and partners closely with the Slovak Bishops' Conference.
  sources: internal knowledge only
