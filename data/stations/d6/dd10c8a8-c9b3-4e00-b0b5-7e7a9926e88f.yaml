  notes: 'Radio Aashiqanaa was an online-only Hindi/Bollywood music stream associated with Kanpur, Uttar Pradesh, distributed through the Radio Garden directory and a Sonic Panel hosting account. As of September 2026 the feed is dark: the stream endpoint returns an HTML page reading "Stream is Offline — There is no sound on the radio. Start AutoDJ or stream music to the radio," meaning the hosting account exists but nothing is being broadcast. The station''s own domain, radioaashiqanaa.com, no longer resolves (NXDOMAIN), and the catalogued homepage is only a radio.garden aggregator link rather than an operator page. There is no evidence of a successor service, and the earlier description of it as a community station was never substantiated. Recommend delisting unless the stream returns.'
