  operator: Südwestrundfunk (SWR), regional public broadcaster for Baden-Württemberg and Rhineland-Palatinate; member of the ARD federation of German public broadcasters
  affiliations: ARD network; funded by the Rundfunkbeitrag household licence fee; constitutionally independent of government, political parties, and religion; carries limited time-restricted advertising on weekdays as permitted under German public-broadcasting rules
  audience: adults primarily in south-west Germany (Baden-Württemberg and Rhineland-Palatinate), but with significant national reach via streaming; broad mainstream pop/rock listenership
  format: hot adult contemporary / contemporary hit pop and rock mixed with news, weather, traffic and satirical comedy segments (notably "SWR3 Comedy")
  notes: One of the most-listened-to radio stations in Germany. Successor to Südwestfunk's SWF3 (launched 1982); rebranded SWR3 after the 1998 merger of SWF and SDR into Südwestrundfunk. Known for its annual "SWR3 New Pop Festival" promoting emerging international pop artists. Headquartered in Baden-Baden.
