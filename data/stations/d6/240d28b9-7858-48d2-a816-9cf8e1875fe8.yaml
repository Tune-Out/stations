  notes: SWR3 is the pop station of Südwestrundfunk (SWR), the ARD public broadcaster for Baden-Württemberg and Rhineland-Palatinate, funded by the German household broadcasting fee. It went on air on 30 August 1998 as the successor to SWF3 (founded 1975) and SDR 3 after the SWF/SDR merger and is produced in Baden-Baden. Targeting listeners aged 14-49 with a hot-AC mix, hourly news and traffic, it is one of Germany's most-heard stations with about 3.3 million daily listeners (ma 2026 Audio II). It is known for the annual SWR3 New Pop Festival and for original comedy series such as Feinkost Zipp; recent cost-saving changes include closing the Mannheim studio (2024), ending the SWR3 Club (Dec 2024) and using speech synthesis for overnight weather and traffic (2026).
