  notes: Heart London is the London station of Global's Heart network, broadcasting on 106.2 FM across London and the Home Counties, on DAB and via Global Player. It launched as Heart 106.2 on 5 September 1995 under Chrysalis Radio, shifted from soft AC to a hot adult-contemporary playlist in 1996 and passed to Global Radio in 2007. Since the 2019 consolidation of the Heart network almost all programming, including Heart Breakfast with Jamie Theakston and Amanda Holden, is networked from Global's Leicester Square studios, with local news, travel and adverts for London. It targets a female-skewing 25-44 audience under an Ofcom commercial licence.
