  affiliations: Operates the Classic FM Hall of Fame, Classic FM Live concerts and Global's Make Some Noise charity; no religious or political affiliation
  audience: UK-wide adult audience for classical music and easy-listening, also targeted at international classical fans via streaming
  format: Classical music with accessible "most relaxing music" branding, news, movie soundtracks (Classic FM Movies) and calm/sleep-oriented spinoffs (Classic FM Calm), plus magazine and concert programming
  notes: Classic FM launched on 7 September 1992 as the UK's first national commercial radio station and the first national commercial classical broadcaster, originally owned by GWR and later by Global; the "HD" stream is the higher-bitrate version of the main FM/DAB/online service; the station has been credited with broadening the audience for classical music, runs the annual listener-voted Classic FM Hall of Fame (the world's largest classical music poll), and is regulated by Ofcom; Global also owns Heart, Capital, LBC and Smooth.
