  format: Adult contemporary music with cultural and political talk, news commentary, jazz, and authorial shows
  notes: Radio Nowy Świat launched on 11 July 2020 as an internet radio station founded by former presenters of Radio Trójka (Polskie Radio Program III) who left after the controversy around the censoring of Kazik Staszewski's song "Twój ból jest lepszy niż mój" in May 2020. The station is funded primarily by listener "Patronite" subscriptions and donations rather than advertising or state funding, presenting itself as an editorially independent alternative to public broadcaster Polskie Radio. Notable hosts and shows have included Wojciech Mann, Jerzy Sosnowski, "Nowy świt," "W środku dnia," "Bon ton," and "Jazz Po Polsku."
