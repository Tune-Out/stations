  notes: CNR-2 "经济之声" (Jingji Zhi Sheng / Voice of Economy) is the second national channel of China National Radio, launched in 1987 as China's first dedicated economics-and-finance radio service; CNR was merged in 2018 into China Media Group (CMG) together with China Central Television (CCTV) and China Radio International (CRI) under direct Communist Party oversight, making CNR-2 a state-controlled broadcaster; programming features daily market reports, macroeconomic policy coverage, business interviews and consumer-finance shows, and serves as an authoritative outlet for government economic messaging.
