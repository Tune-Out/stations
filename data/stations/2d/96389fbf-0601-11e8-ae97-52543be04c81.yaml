  notes: 181.FM - 80's Country is one channel of 181.FM, an independent American internet radio network run from Waynesboro, Virginia that has operated since the early 2000s and now carries well over a hundred genre streams. Despite the "FM" in the name it holds no terrestrial licence; the network is stream-only, ad-supported, and offers a paid commercial-free tier. This channel is a tight decade format built around the 1980s country canon, and it sits alongside sibling country streams such as 90's Country, Classic Country and Real Country. It is a competently programmed but automated playlist rather than a presenter-led station.
