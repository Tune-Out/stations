  notes: Triple M Sydney broadcasts on 104.9 FM with the callsign 2MMM (originally 2-Double-M from its 1980 launch by Hoyts Media as one of Sydney's first FM commercial stations, going to Triple M in the mid-80s); now part of the national Triple M Network alongside sister Hit Network stations under Southern Cross Austereo; major content drivers include AFL and NRL play-by-play, the Moonman in the Morning breakfast show, and Triple M Rock with personalities such as Mick Molloy; the legacy.scahw.com.au stream URL reflects SCA's pre-LiSTNR-era infrastructure (LiSTNR is SCA's audio-on-demand and live-radio digital platform launched in 2021).
