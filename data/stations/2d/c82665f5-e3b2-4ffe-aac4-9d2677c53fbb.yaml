research:
  reviewed_at: 2026-06-09
  nature: commercial
  operator: Broadcasting Corporation of China (BCC / 中國廣播公司, often Zhōngguǎng / 中廣); privatised in 2005-2007 with ownership traced to Jung Tai Investment / China Times Group founder Jeffrey Koo Jr. and businessman Jaw Shaw-kong (趙少康)
  affiliations: Historically the radio arm of the Kuomintang (KMT) party-state and the Republic of China government; since privatisation, controlling shareholder Jaw Shaw-kong is a prominent KMT-aligned political commentator; not formally affiliated with the KMT today but widely perceived as politically blue-leaning
  audience: Taiwan-wide adult and youth music listeners; Mandarin Chinese language
  format: Mandopop-focused music network (中廣音樂網 / i Radio) playing contemporary Mandarin and Asian pop, with DJ-hosted music shows and pop news
  notes: BCC traces its roots to the Central Broadcasting System founded 1928 in Nanjing by the KMT; relocated to Taiwan with the ROC government in 1949; was the dominant radio operator throughout the martial-law era; underwent transformation from quasi-state KMT broadcaster to private commercial broadcaster after the KMT divested its media holdings under the 2005 Political Party Act; 中廣音樂網 (also branded "i Radio") is BCC's music-format network, distinct from its news network (中廣新聞網) and Sweet (流行網) channel; ownership and frequency allocations have been the subject of long-running disputes with the National Communications Commission, including controversies over the use of legacy KMT-era frequencies for non-broadcast purposes.
  sources: internal knowledge only
