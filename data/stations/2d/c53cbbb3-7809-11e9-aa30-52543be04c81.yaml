  format: Local opt-out of the COPE national news/talk/sport network - regional news, sport (Real Betis, Sevilla FC), tertulias, religious programmes and music breakouts
  notes: COPE is one of Spain's "big three" national general-interest commercial radio networks alongside SER and Onda Cero; the network describes itself as "medio catolico, comercial y generalista" (Catholic, commercial, general-interest) and as a "cadena radiofonica surgida de Iglesias diocesanas y de dos ordenes religiosas en Espana"; sister brands include Cadena 100 (AC/pop), RockFM and MegastarFM, all under the Radio Popular S.A. group; flagship national shows include "Herrera en COPE" and "Tiempo de Juego", with Sevilla local opt-outs covering Andalusian and local politics, religion and football; broadcasts on FM (89.8 and 97.1) in Seville.
