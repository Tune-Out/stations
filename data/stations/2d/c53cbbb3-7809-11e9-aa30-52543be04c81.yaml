  operator: Radio Popular S.A. - COPE (Cadena de Ondas Populares Espanolas), owned by the Spanish Episcopal Conference (CEE) together with several diocesan and religious-order shareholders
  affiliations: Roman Catholic Church (Spanish Episcopal Conference and Catholic religious orders); editorially socially-conservative and right-of-centre
