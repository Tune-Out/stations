  notes: Estrellas de los 80s ("Stars of the 80s") is an online-only Spanish-language oldies/nostalgia radio station operated by Grupo Digital Radioland (also branded "Retroland Digital") from Monterrey, Nuevo León, Mexico; it is part of a small cluster of internet-only nostalgia channels run by the same operator (including stations specialising in 60s, 70s, romantic ballads and pop clásico). The format leans on Spanish-language pop hits of the 1980s and the wider Ibero-American pop and rock catalog of that decade. Distribution is via the panel.retrolandigital.com streaming server.
