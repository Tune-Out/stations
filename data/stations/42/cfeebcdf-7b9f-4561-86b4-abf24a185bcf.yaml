  operator: Asociación Madres de Plaza de Mayo (human-rights organisation), operating AM 530 Somos Radio as their official radio station
  affiliations: Madres de Plaza de Mayo human-rights movement; politically aligned with Argentine left-wing Peronism / Kirchnerismo / Unión por la Patria; strongly supportive of former president Cristina Fernández de Kirchner
  audience: Argentine Spanish-speaking progressive, Peronist, human-rights and labour-movement listeners, primarily in Buenos Aires
  format: News, talk and political commentary with cultural segments — leftist editorial line, social-movement coverage, human-rights advocacy
  notes: AM 530 "La Voz de las Madres" / Somos Radio is the radio station of the Asociación Madres de Plaza de Mayo, the iconic Argentine human-rights group founded by mothers of people "disappeared" during the 1976-1983 military dictatorship; the station was launched in the mid-2000s and broadcasts from the Madres' headquarters at Pte. Luis Sáenz Peña 210 in Buenos Aires on 530 kHz AM, with notable programmes including "La Tarde con Carlos Polimeni" and "La García"; its mission statement honours the Madres as "un ejemplo de amor y de lucha desde aquel 30 de abril de 1977 cuando iniciaron su larga marcha sin dar un paso atrás," positioning the station as an explicitly activist, militante outlet.
  sources: https://www.am530somosradio.com/, internal knowledge of Madres de Plaza de Mayo
