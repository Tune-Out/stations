  operator: All India Radio (AIR / Akashvani), Prasar Bharati — India's autonomous public service broadcaster under the Ministry of Information & Broadcasting, Government of India
  affiliations: Government of India (Prasar Bharati statutory autonomous body); no religious or partisan political affiliation, though carries official government news
  audience: Hindi-speaking listeners in the National Capital Region (Delhi NCR); nostalgia / classic Hindi film music fans, primarily 35+ demographic
  format: Classic Bollywood / vintage Hindi film songs (pre-1990s/2000s golden-era retro music) interspersed with AIR News Service Division news bulletins and current affairs
  notes: AIR FM Gold launched 1 September 2001 as a 24-hour entertainment channel; Delhi service broadcasts on 100.1 MHz. Tagline "Khara Sona" (pure gold) reflects classic-music focus. Part of AIR's metro FM network (also in Mumbai, Kolkata, Chennai). The liveradios.in homepage is a third-party aggregator, not an official AIR site.
