  notes: 'AIR FM Gold is All India Radio''s classic-entertainment FM service, launched on 1 September 2001 and broadcasting in Delhi on 100.1 MHz under the branding "Akashvani FM Gold — Khara Sona" (pure gold). It runs an adult contemporary format anchored on golden-era Hindi film music, punctuated by news bulletins from the AIR News Service Division, and operates in four metros: Delhi, Mumbai, Kolkata and Chennai, each mixing Hindi and English with the local language. The service is run by Prasar Bharati, the statutory autonomous body that has been India''s public service broadcaster since 1997; All India Radio has carried the on-air name Akashvani since 1956, and Prasar Bharati made that branding exclusive across its radio services in 2023. Note that the catalogued homepage, liveradios.in, is a third-party aggregator rather than an official Prasar Bharati page.'
