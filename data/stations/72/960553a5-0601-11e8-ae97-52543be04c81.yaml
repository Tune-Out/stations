  notes: radioeins is the adult cultural-music network of Rundfunk Berlin-Brandenburg (rbb), the ARD member broadcaster for Berlin and Brandenburg, and is funded by the German household broadcasting fee. It launched on 27 August 1997 from the merger of SFB's Radio B Zwei and ORB's Radio Brandenburg, and broadcasts on 95.8 MHz in Berlin and Potsdam plus regional FM frequencies and DAB+. It positions itself as "nur für Erwachsene", programming music deliberately beyond the commercial mainstream alongside heavy talk, culture, satire, film and current affairs. Signature output includes the award-winning morning show Der schöne Morgen, the Saturday science magazine Die Profis, listener-voted thematic Top 100 countdowns, and the Soundcheck album award run with the Tagesspiegel; Fest & Flauschig began here before moving to Spotify. It reported roughly 444,000 listeners in MA II/2026.
