  notes: 'Radio ItaloPower! is a small, listener-supported online niche radio station devoted exclusively to Italo Disco and related Euro-electronic genres. The site claims a library of 5,000+ tracks rotating both classic 1980s hits and obscure rarities alongside modern Italo revival productions, branding itself as "Italo Disco around the clock: the hits everyone knows and the rarities most stations forgot." Stream is hosted on the deevaradio.net infrastructure popular among European hobby webcasters. It is part of a tight-knit international Italo Disco web-radio scene that also includes stations such as Radio Stronzo, Italo Power and Eurodance Radio.'
