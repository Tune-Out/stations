  notes: WSM-AM 650 is one of the most historically significant radio stations in the United States; founded by National Life and Accident Insurance Company in 1925 (call letters from "We Shield Millions"), it launched the WSM Barn Dance which became the Grand Ole Opry in 1927; designated a U.S. clear-channel station, its 50,000-watt non-directional signal reaches across much of North America at night; the Country Music Hall of Fame credits WSM with helping create the Nashville music industry; ownership has passed through National Life, Gaylord Entertainment, Cumulus Media, with the Opry brand under Ryman Hospitality Properties.
