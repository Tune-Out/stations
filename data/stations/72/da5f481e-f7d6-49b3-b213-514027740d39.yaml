  nature: commercial
  operator: NextRadioTV, subsidiary of Altice France (controlled by Patrick Drahi); part of the RMC BFM media group alongside BFM TV and BFM Business
  affiliations: none formal (private commercial broadcaster); no religious or political party affiliation. Sister TV brand BFM TV has been criticised in French media debates over editorial neutrality, but RMC radio itself maintains a populist/talk-show identity rather than partisan branding.
  audience: adult French audience interested in news, sports debate, and lifestyle talk; French language; national broadcast region (Metropolitan France)
  format: news/talk radio — heavy emphasis on opinion shows, listener call-ins, sports debate (especially football via "Les Grandes Gueules" and "RMC Sport"), morning news, interviews
  notes: Founded 1943 as Radio Monte Carlo in Monaco. Acquired by NextRadioTV in 2000, transformed into talk-radio format around 2001-2002 with a Talk Sport / Talk News blend. Now part of Altice's media empire (Drahi). Sister to BFM TV (France's leading 24h news channel) and BFM Business. Known for its football coverage and call-in culture; long-running flagship show "Les Grandes Gueules" features panel debates.
