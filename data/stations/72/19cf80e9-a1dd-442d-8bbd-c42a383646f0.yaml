  notes: Tilos Rádió ("Forbidden Radio") is Hungary's first community radio station, founded in Budapest on 21 August 1991 as a pirate broadcaster to campaign for independent media law and licensed since 1995; it holds a community licence on 90.3 MHz (500 W) renewed in 2022 for ten years. It is a non-profit, listener- and donation-funded station run largely by volunteers, with Hungarian- and English-language programmes on social issues, minority communities, alternative and experimental music and spoken word. This entry uses the same 256 kbps stream as the higher-voted canonical Tilos Rádió entry.
