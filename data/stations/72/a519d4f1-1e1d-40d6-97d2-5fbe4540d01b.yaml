  notes: MY FM is one of Malaysia's leading Chinese-language commercial radio stations, launched in 2001 by Astro Radio, with FM frequencies including 101.8 in the Klang Valley; broadcasts from the All Asia Broadcast Centre at Technology Park Malaysia, Bukit Jalil, Kuala Lumpur; notable programmes include the breakfast show "MY FM 阳光灿烂" (6-10am weekdays), drive-time "MY FM 行路有风", and listener music chart "MY FM Music 20"; tagline emphasises "放工放学有我们陪你" (we accompany you after work/school); the station's streaming is delivered through Astro's SYOK app/website (my.syok.my).
