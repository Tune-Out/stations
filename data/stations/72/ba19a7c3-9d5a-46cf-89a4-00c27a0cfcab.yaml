  notes: Launched in 1987 as the first full-time French-language news radio station, France Info pioneered the continuous-news radio format in Europe. Since 2016 the brand was extended into a cross-media public-service news offer (TV channel franceinfo:, website and radio) jointly produced by Radio France, France Télévisions, INA and France Médias Monde. The radio service maintains editorial independence guaranteed by Radio France's statute and is funded by the French public-broadcasting allocation. France Info regularly ranks among the most-listened-to stations in France, especially during major news events.
