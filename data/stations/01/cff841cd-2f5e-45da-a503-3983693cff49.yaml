  notes: Idha'at Dar al-Hadith al-Salafiyya bil-Dhale'e is a religious radio service identifying itself with the slogan "صوت العلم والسنة" (Voice of Knowledge and the Sunnah); it is part of a network of affiliated Salafi Dar al-Hadith institutions in Yemeni governorates including Al-Mahrah, Shabwah, Marib, Al-Amad, Bani Hamad and Taiz; Yemen's Salafi tradition emerged largely from the school of Sheikh Muqbil bin Hadi al-Wadi'i (d. 2001) in Dammaj, and Dar al-Hadith institutes elsewhere in Yemen continue this scholarly current that is distinct from political Islamist movements like the Muslim Brotherhood / Islah.
