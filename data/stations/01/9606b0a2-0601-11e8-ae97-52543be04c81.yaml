  nature: public broadcaster
  operator: Mitteldeutscher Rundfunk (MDR), the regional public-service broadcaster for Saxony, Saxony-Anhalt and Thuringia; member of ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland)
  affiliations: ARD network; funded by the German Rundfunkbeitrag licence fee; independent of party politics by statute (overseen by the MDR Rundfunkrat with civil-society representation)
  audience: Young adults (roughly 14-29) across central Germany — Saxony, Saxony-Anhalt and Thuringia — plus listeners via web and DAB+
  format: Youth-oriented contemporary hit and electronic music, hip-hop, indie, club, and dance, mixed with youth culture features, lifestyle topics, and news targeted at younger listeners
  notes: Launched in 1993 as the youth-targeted radio service of the newly founded MDR (which itself began broadcasting on 1 January 1992 covering the former East German Länder). The station was rebranded several times — initially as "Jump", which split off as MDR Jump, while "Sputnik" became the more alternative/club-focused youth station. As of 2024 MDR announced restructuring of its youth offerings under public-broadcaster reform; the brand has historically been distributed via DAB+ and online (FM coverage limited).
