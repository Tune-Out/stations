  notes: AIR News 24x7 is the continuous news channel of Akashvani (All India Radio), India's state-owned national broadcaster run by Prasar Bharati under the Ministry of Information and Broadcasting. Launched as a digital and DTH service, it carries hourly bulletins, current-affairs programmes and live coverage of Parliament and government events in Hindi and English. The stream is Prasar Bharati's own HLS feed on the BitGravity CDN; the catalogue homepage is a third-party directory page.
