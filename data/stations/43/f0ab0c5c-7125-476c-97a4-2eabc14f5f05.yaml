  notes: Founded 11 December 1992 by John de Mol Jr. as Radio 538, taking its name from the AM frequency 1008 kHz used by predecessor Radio 10; became the dominant Dutch commercial Top-40/CHR station of the 1990s-2000s; major events include the annual "538 Koningsdag" (King's Day) outdoor festival in Breda; tagline "Jouw hits, jouw 538!" (Your hits, your 538!); operates spin-off streams 538 Non-Stop, 538 Greatest Hits, 538 90's, and 538 Tomorrowland One World Radio; notable presenters historically include Edwin Evers, Frank Dane, and Coen Swijnenberg; broadcasts via FM, DAB+, cable, and online across the Netherlands.
