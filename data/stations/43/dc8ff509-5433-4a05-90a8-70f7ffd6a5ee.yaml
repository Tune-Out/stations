  notes: 'Baladas del Recuerdo is a one-person hobby webcast of Spanish-language romantic ballads run from a Blogspot page (''Dj Corsan'') attributed to Morelos, Mexico. The blog still loads and embeds a player titled ''Baladas del Recuerdo'', but the Zeno.fm mount behind it is gone: the station page zeno.fm/radio/g7vk70rqr68uv returns 404 and the stream URL answers 401 both with and without its expired token. The catalog homepage (www.djcorsanmexico.blogspot.com) does not resolve; only the non-www form does. There is no independent coverage of the station. Editorial note: appears to be defunct as of 2026-09-02.'
