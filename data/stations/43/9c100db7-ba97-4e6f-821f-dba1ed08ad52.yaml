  format: Specialist underground dance music covering grime, UK garage, dubstep, jungle, drum & bass, house, techno, broken beat, bass, afrobeats and hip-hop, mostly DJ-mix shows by resident and guest selectors.
  notes: Rinse FM started as a pirate radio station in Bow, east London in 1994 and became one of the most influential incubators of grime, dubstep and UK funky, launching the careers of Wiley, Dizzee Rascal, Skepta, Katy B and many others. After roughly 16 years as an unlicensed broadcaster it was granted a community radio licence by Ofcom in 2010 and moved to 106.8 FM in London; in 2022 it relaunched as a global brand with regional channels (Rinse UK, Rinse France, Kool FM, SWU FM) and a Rinse Recordings label and event series. It is independent and self-funded through advertising, label / events revenue and Rinse Premium memberships, with no religious or governmental affiliation.
