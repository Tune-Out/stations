  notes: La Z 107.3 FM (call sign XEQR-FM) is Grupo Radio Centro's flagship regional-Mexican station in Mexico City, broadcasting at 107.3 MHz with a transmitter site serving the metropolitan area; signature tagline "Y tú…¿Escuchas radio o La Z?" positions the brand as a lifestyle choice; programming includes "Los Rezidentes" (morning drive), "Los Sobrevivientes de La Z," "Salsa con Z," "Clásicas Gruperas," "Los Adoloridos de La Z," and the "El Zetómetro" chart show, plus "Experimento Z" talent competition; Grupo Radio Centro also operates stations such as 97.7 FM, La Mexicana, Universal, and Alfa; the company has been publicly listed on the Bolsa Mexicana de Valores since the 1990s and is one of the longest-running family-built media groups in Mexico.
