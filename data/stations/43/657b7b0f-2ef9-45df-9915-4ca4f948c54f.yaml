  nature: public broadcaster
  operator: Österreichischer Rundfunk (ORF), Austria's national public-service broadcaster
  affiliations: Statutory Austrian public broadcaster funded by the ORF-Beitrag (household levy since 2024, previously the GIS licence fee); EBU member; no party-political or religious affiliation but subject to ORF-Gesetz public oversight via the Stiftungsrat and Publikumsrat
  audience: Austria-wide German-speaking adult listeners with a focus on culturally and intellectually engaged audiences; broadcast nationally on FM, DAB+, satellite and online
  format: "Highbrow cultural and information service: classical music, jazz, news, science, literature, religion, drama and arts features"
  notes: Launched 1 October 1967 as one of ORF's three flagship national networks (alongside Ö2/Regionalradios and Ö3), Ö1 is regularly cited as one of Europe's most highly regarded public cultural channels and partners closely with the Wiener Symphoniker, RSO Wien and the Salzburg Festival; flagship strands include "Morgenjournal", "Mittagsjournal", "Abendjournal", the "Ö1 Journale" news bloc, "Radiokolleg", "Dimensionen", "Diagonal", "Le week-end" and the "Ö1 Hörspiel" radio-drama tradition; the station also runs the "Ö1 Club" listener loyalty programme, the "Ö1 macht Schule" educational initiative and the "Ö1 Talentebörse" emerging-artists database
  sources: https://oe1.orf.at/, internal knowledge
