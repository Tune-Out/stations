  operator: Grupo MVS Radio (and previously iHeartMedia / formerly Clear Channel Mexico for the EXA brand) — EXA FM is a major Mexican commercial network. The Veracruz outlet historically broadcasts on XHPS-FM.
  affiliations: none known politically or religiously; commercial pop format.
  audience: Young adult Spanish-speaking Mexican listeners (15-34) plus general bilingual pop fans; this stream is targeted at Mexico's Veracruz region but the catalog incorrectly lists country=Angola.
  format: Top-40 / CHR pop in English and Spanish — current hits and recurrents; high-energy presenters; slogan "Lo Mejor de la Música" (and "Música pop em inglês e espanhol" as labeled here).
  notes: EXA FM is one of Mexico's largest national radio brands, with dozens of affiliates across the country. Originally launched by Grupo Radio Centro and Clear Channel Mexico in the late 1990s as a youth-pop format, it later passed through iHeartMedia Mexico and MVS Radio ownership during industry restructuring. The Veracruz feed (XHPSFM 101.3) carries the national EXA hits format with local breakouts; the catalog's country=Angola entry is almost certainly a metadata error since the homepage, callsign, and language all point to Mexico.
