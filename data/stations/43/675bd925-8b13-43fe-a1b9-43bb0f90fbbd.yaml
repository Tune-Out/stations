  affiliations: none known (no longer affiliated with the RTL Group / Bertelsmann despite the name; Lorenzo Suraci serves as vice president of Confindustria Radio Televisioni industry association)
  audience: Nationwide Italian-speaking adults; ~7 million daily listeners — Italy's leading national commercial radio
  format: Contemporary hit radio (CHR) — the first Italian station to adopt the all-hits format; news, talk, music, and "Hit Radio" branding
  notes: Originally founded as Radio Trasmissioni Lombarde (RTL) in Lombardy; relaunched in 1988 by Suraci to promote his Capriccio discothèque near Bergamo. Now broadcasts nationally on FM, DAB+, satellite, and via a visual radio TV channel (RTL 102.5 TV, formerly Hit Channel). Group also owns ad agency Openspace. Italy's largest commercial radio by audience.
