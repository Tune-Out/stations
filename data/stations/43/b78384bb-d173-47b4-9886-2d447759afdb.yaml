  notes: 'Радыё Сталіца (Radio Stolitsa) is a regional FM channel of Belteleradiocompany, the Belarusian state television and radio company, serving Minsk with local programming and a rock-leaning music mix. Belteleradiocompany was expelled from the European Broadcasting Union in June 2021 over its use as a government propaganda tool and the coerced televised confession of Roman Protasevich, and was placed on the EU, Canadian, Swiss and Ukrainian sanctions lists in 2022. The catalog entry''s homepage points at prfm.ru, a Russian aggregator, rather than the station''s own site at radiostalica.by. Editorial flag: Operated by Belteleradiocompany, a state broadcaster expelled from the EBU in 2021 as a government propaganda tool and sanctioned by the EU, Canada, Switzerland and Ukraine since 2022. The channel''s own output is music-led, but its operator is a sanctioned state propaganda entity.'
