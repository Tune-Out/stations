  format: 'Eclectic, hand-picked, ad-free music: jazz, world, classical, electronic, soul, chanson, rock, hip-hop, presented sparingly by soft-spoken announcers'
  notes: FIP is Radio France's commercial-free eclectic music station, founded on 5 January 1971 as France Inter Paris and now broadcast on FM in Paris (105.1), Bordeaux, Marseille, Toulouse, Montpellier, Nantes, Strasbourg and Rennes, nationwide on DAB+ and worldwide online. Its programmers hand-pick around 44,000 different tracks a year across jazz, world, classical, electronic, soul, chanson and rock, with no song repeated within 48 hours and about 85 percent of the music coming from independent labels. Speech is minimal and delivered by its trademark calm announcers. FIP is funded through Radio France's public-service budget and runs themed webradios (FIP Jazz, Rock, Groove, Electro, Reggae, Metal and others). It is regularly cited internationally as one of the best music stations in the world.
