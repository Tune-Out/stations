research:
  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: Radio France (French national public radio company, funded by the state)
  affiliations: Member of Radio France's network alongside France Inter, France Info, France Culture, France Musique, France Bleu, Mouv'; EBU member via Radio France; no religious, party or advocacy ties
  audience: French-speaking music lovers in France (Paris, Bordeaux, Nantes, Strasbourg and others via FM, nationwide via DAB+ and stream) plus a strong international online audience
  format: Highly eclectic music station — jazz, world, classical, electronic, soul, French chanson, rock, hip-hop — presented with minimal speech by signature female "FIPettes" announcers; no advertising
  notes: Founded 5 January 1971 as "France Inter Paris" under Roland Dhordain, FIP became a cult station famed for its unique programming style and soft-spoken female voices ("la voix de FIP"). Originally Paris-only, it expanded to several French cities. Webradio spin-offs include FIP Rock, FIP Jazz, FIP Groove, FIP Pop, FIP Electro, FIP Reggae, FIP Metal, FIP Hip-Hop, FIP Sacré Français, etc. Regularly cited internationally as one of the world's best music radio stations.
  sources: https://www.fip.fr/ (redirects to https://www.radiofrance.fr/fip), internal knowledge
