  affiliations: KBS (statutory public corporation under the Broadcasting Act of South Korea); funded by a combination of TV licence fees and advertising; ABU member
  audience: South Korean youth and young adults (teens to 30s); Korean-speaking
  format: Contemporary K-pop, mainstream pop hits, idol-driven music shows and call-in entertainment talk
  notes: Branded "KBS Cool FM" since 2000 (previously "KBS Radio 2FM" since 1980 when it succeeded TBC FM after the 1980 forced press merger); broadcasts on FM 89.1 MHz in Seoul with a national network of repeaters; flagship music station of KBS and a major launchpad for K-pop visibility, hosting long-running idol-fronted programmes such as "Kang Ta-yeon's Volume Up", "Park Myung-soo's Radio Show", "Choi Hwa-jung's Power Time" and the famed "Cultwo Show"; operated by KBS, a state-owned but editorially semi-independent broadcaster sometimes criticised for political bias swinging with administrations.
