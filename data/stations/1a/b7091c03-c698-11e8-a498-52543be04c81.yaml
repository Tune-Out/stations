  affiliations: none known (privately owned commercial broadcaster); co-founder Patrick Quarcoo (Radio Africa Group), co-founder William Pike (former New Vision editor)
  audience: English-speaking urban Ugandans, professionals and youth in Kampala and major towns
  format: English-language pop/contemporary hit radio with talk segments, news, music shows and entertainment
  notes: Launched on 31 December 1993 as one of Uganda's first private FM stations following media liberalisation; founded by William Pike and Patrick Quarcoo who later built the Radio Africa Group across East Africa; broadcasts on 91.3 MHz in Kampala with regional repeaters in Mbale (90.9), Mbarara (88.7), Fort Portal (89.4), Gulu (96.9) and Arua (92.7); long-running 30-year partnership with dfcu Bank; positioned as a leading English-language commercial brand in Uganda's competitive FM market.
