  notes: Capital FM broadcasts on 91.3 MHz in Kampala and brands itself "Fresh Hits for Kampala", with relays in Mbale, Mbarara, Fort Portal, Gulu and Arua. It launched on 31 December 1993 as one of Uganda's first private FM stations after the liberalisation of broadcasting, founded by William Pike and Patrick Quarcoo, who went on to build the Radio Africa Group across East Africa. The output is English-language chart pop wrapped around presenter-led drive and breakfast shows, entertainment news and sponsored features. The catalog homepage capitalradio-ug.com is now an empty parked page served from a Turkish host; the live official site is capitalradio.co.ug.
