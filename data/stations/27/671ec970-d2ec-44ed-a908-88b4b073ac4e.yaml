  notes: 'Founded 2006 as FM community radio in central Pécs; internet-only since 2011. Mission: "periferikus zenei formák képviselete" (representation of peripheral/experimental music forms). Collaborates with University of Pécs electronic music department. Features weekly archive and podcast programming including shows like Bouquet, EZM reggeli, hangtöredékek. Logo by Csató Csenge; web development by Kovács Balázs. Tematikus show curation by Ferenci Erazmus.'
