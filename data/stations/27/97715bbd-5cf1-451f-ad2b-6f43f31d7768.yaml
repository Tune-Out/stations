  operator: All India Radio / Akashvani, a service of Prasar Bharati under India's Ministry of Information & Broadcasting
  affiliations: Government of India (statutory public broadcaster); no party-political or religious affiliation, mandated to provide balanced public-service content
  audience: Bengali-speaking and Eastern Indian listeners; Kolkata and West Bengal region on FM 100.1 MHz, also via DTH and Prasar Bharati's online platforms
  format: FM Rainbow / Geetanjali music service offering classical, light classical, film music and curated Bengali and Hindi songs with announcer-led programming
  notes: AIR Kolkata Geetanjali is the Kolkata station of All India Radio's "Geetanjali" / FM Rainbow-style music service, broadcasting on 100.1 MHz FM; Prasar Bharati is described in its own materials as "an autonomous statutory body established by an Act of Parliament" with a mission to deliver "a fair and balanced flow of information on matters of public interest, free from opinion or bias"; All India Radio is one of the world's largest public broadcasting networks, founded 1936 (as the Indian State Broadcasting Service), and has been part of Prasar Bharati since 1997.
