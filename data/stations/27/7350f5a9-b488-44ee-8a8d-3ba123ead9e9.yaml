  nature: public broadcaster
  operator: Radio New Zealand (RNZ) — New Zealand's Crown entity public-service broadcaster; established under the Radio New Zealand Act 1995 and funded primarily by NZ on Air / Crown appropriations
  affiliations: New Zealand government-funded public broadcaster; member of the Asia-Pacific Broadcasting Union (ABU); editorially independent
  audience: Nationwide New Zealand adult audience; English-language listeners interested in news, current affairs, arts and ideas; significant Māori and Pacific audience for relevant programming
  format: Public-service speech radio — news, current affairs, documentaries, drama, arts, ideas, books and classical/alternative music features; flagship shows include Morning Report, Checkpoint, Nine to Noon, Saturday Morning and Sunday Morning
  notes: RNZ National is the flagship network of Radio New Zealand and a direct descendant of the National Programme of the New Zealand Broadcasting Service (founded 1925, restructured many times); it is widely regarded as the country's most authoritative news-and-talk broadcaster and operates ad-free with commercial-free programming; following a 2023 government merger proposal that would have combined RNZ with TVNZ (later abandoned), RNZ remains a standalone Crown entity with a charter to provide independent, balanced public-service broadcasting.
