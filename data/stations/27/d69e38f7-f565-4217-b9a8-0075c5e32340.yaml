  format: Full-service généraliste radio — roughly half news and current affairs, plus talk, humour, sport and adult contemporary music
  notes: RTL is France's leading commercial generalist radio station, on air since 15 March 1933 as Radio Luxembourg, broadcasting in French from the Grand Duchy to get around the French state broadcasting monopoly, and renamed RTL on 11 October 1966. It is owned by Groupe M6, which sits under RTL Group. About half its schedule is news and current affairs, built around RTL Matin, Le Journal Inattendu (anchored by Marie Drucker since 2011) and the long-running comedy panel Les Grosses Têtes, on air since 1977. It broadcasts on FM — 104.3 MHz in Paris, 101.4 in Marseille, 105.0 in Lyon — plus DAB+ and online; the historic 234 kHz longwave transmission was switched off on 2 January 2023 to cut energy use. As of late 2021 it was the second most-listened-to station in France, with roughly six million daily listeners, behind France Inter.
