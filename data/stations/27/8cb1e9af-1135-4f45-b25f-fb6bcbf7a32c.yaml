  operator: Elliniki Radiofonia Tileorasi (ΕΡΤ / ERT), Greece's national public-service broadcaster
  affiliations: European Broadcasting Union (EBU); governed under Greek Law 4173/2013 (as amended) and supervised by the Greek state; funded primarily via a household broadcasting fee included in electricity bills
  audience: Greek-speaking jazz enthusiasts; international online listeners; adult demographic with interest in jazz, world and improvised music
  format: 24/7 jazz web stream — mainstream, modern, fusion, world jazz and historic recordings — branded as part of the ERT "Kosmos" world-music family
  notes: ERT Kosmos jazz is one of several thematic web-only sub-channels of ERT's world-music radio service Kosmos 93.6 (which itself launched in 2003 as part of ERT3 / Thessaloniki and was relaunched as a Kosmos network); the jazz stream is part of ERT's expanded online radio portfolio at webradio.ert.gr, alongside sister streams such as Kosmos Latina, Kosmos World, Kosmos Greek, and others; ERT is the successor entity to the historic Greek state broadcaster, controversially shut down in June 2013 by the conservative Samaras government and replaced briefly by the slimmed-down NERIT, before being restored as ERT in 2015 by the SYRIZA government — a period that became emblematic of austerity-era media politics in Greece.
