  notes: 2000 FM - RnB & Hip-Hop is an internet-only channel of the Big R Radio Network, a Washington State operator that runs dozens of automated genre and decade streams under the 2000fm.net and bigrradio.com brands. The playlist is 2000s-era R&B and hip-hop — Beyoncé, Usher, Jay-Z, Nelly, Destiny's Child and similar — running unpresented around the clock. Sibling channels on the same platform include 2000 FM Country, Top 40, Alternative Rock, Hard Rock and Chillin. The "2000 FM" name is a branding device, not a broadcast frequency; there is no licensed transmitter. Revenue comes from inserted audio advertising, and the site lists ASCAP, BMI and SOCAN licensing.
