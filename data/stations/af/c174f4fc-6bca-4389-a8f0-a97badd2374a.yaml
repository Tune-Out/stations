  format: All-news/talk financial-information channel — real-time stock and Hang Seng coverage, market commentary, business interviews, property and economy programming ("Metro Finance" / 新城財經台)
  notes: Metro Radio (新城廣播) launched in 1991 as Hong Kong's third commercial radio licensee alongside RTHK and Commercial Radio; it operates three channels of which the Finance Channel (Metro Finance, 104.0 MHz) is the flagship since Hong Kong's repositioning as a financial hub; programmes include "财经一周" market-week wrap, morning trader shows, and English-language business news inserts; broadcasts on FM in Hong Kong and streams worldwide; controlled by interests of property magnate Lee Shau-kee.
