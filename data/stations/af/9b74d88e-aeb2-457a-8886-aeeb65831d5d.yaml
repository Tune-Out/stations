  nature: religious
  operator: Qurango Network (qurango.net) — a Saudi-based online Islamic audio platform; the station is a thematic stream from Qurango, not an Egyptian terrestrial broadcaster despite the catalog country tag
  affiliations: Sunni Islam, Salafi tradition; built around the recorded tafsir lessons of Sheikh Muhammad ibn Salih al-Uthaymin (1925-2001), a leading Saudi Salafi scholar associated with the Permanent Committee for Islamic Research
  audience: Arabic-speaking Muslims globally; students of Quranic exegesis and traditional Sunni religious instruction
  format: 24/7 recorded Quranic tafsir (exegesis) lectures by Sheikh Ibn Uthaymin
  notes: Title translates as "Ibn Uthaymin's Tafsir"; the late Sheikh Ibn Uthaymin was a prominent member of the Council of Senior Scholars of Saudi Arabia and a major reference for Salafi jurisprudence; his tafsir was compiled posthumously from lesson recordings and notably covers al-Fatiha through al-An'am, al-Kahf, surahs 24-43 and 49-57, plus Juz' Amma; the "classical" tag in the catalog appears to be a category mislabeling - this is a religious speech stream, not classical music; Qurango operates many similar themed streams (Quran recitations, lectures by various scholars).
  sources: https://tafsir.app/ibn-uthaymeen/, https://uthaimeen.com/, internal knowledge of Qurango.net and Sheikh Ibn Uthaymin's scholarship
