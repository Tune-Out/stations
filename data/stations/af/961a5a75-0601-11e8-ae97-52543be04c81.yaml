  notes: Radio Monte Carlo (RMC) is an Italian national commercial station that began on 6 March 1966 as the Italian-language service of the Monaco broadcaster, becoming known for airing songs censored by RAI. It has been owned by RadioMediaset, the radio arm of MFE-MediaForEurope (the Berlusconi family's Fininvest group), since 5 September 2018, alongside Radio 105, R101, Virgin Radio Italia and Radio Subasio. Based in Milan with studios in Monte Carlo, it broadcasts across Italy, Monaco and the Côte d'Azur on FM and DAB+, via Tivùsat and Sky, and online, with the positioning 'Musica di Gran Classe'. It reaches about 2.1 million daily listeners (2025) and runs spin-off web channels such as RMC 80, RMC Love Songs and RMC Buddha-Bar; its evening drive show Take It Easy is simulcast on Radio Monte Carlo TV.
