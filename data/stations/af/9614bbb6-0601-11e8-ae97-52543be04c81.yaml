  notes: LBC ('Leading Britain's Conversation', originally London Broadcasting Company) is the UK's first licensed commercial radio station, launched on 8 October 1973, and is now owned by Global Media & Entertainment. It broadcasts on 97.3 FM in London and nationally on DAB, TV platforms and online, with a phone-in and talk format built around news and current affairs. Presenters include Nick Ferrari, James O'Brien, Iain Dale, Vanessa Feltz and Andrew Marr; past hosts included Nigel Farage. RAJAR reported a record 3.6 million weekly listeners in Q1 2026, and a sister rolling-news service LBC News operates alongside it. This catalog stream is the low-bitrate 48 kbps feed.
