  notes: 'Ajyal (Arabic: "generations") is a non-commercial internet radio station operated by MADA (Media Development Association - Palestine), a Palestinian civil society organization focused on media development and free expression. MADA also runs the ARN.ps platform (Ajyal Radio Network). The station broadcasts from servers in Palestine (streamer.mada.ps) and supports both Arabic and Hebrew language listening. "Ajyal" means "generations" in Arabic, suggesting intergenerational cultural mission. Streams at 128 kbps. Programming highlights Palestinian and broader Arabic music. No known regulatory restrictions or controversies.'
