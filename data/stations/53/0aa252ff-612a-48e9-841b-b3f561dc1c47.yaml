  notes: Bremen Eins is the flagship Welle of Radio Bremen, the smallest ARD broadcaster (founded 1945 under British occupation); it focuses on coastal/Hanseatic culture, traffic reporting for Hanse-Wasser and northern news; programming is rounded out by ARD-shared evening shows and the "ARD-Schlagernacht"; the station is overseen by the Rundfunkrat representing socially relevant groups in Bremen.
