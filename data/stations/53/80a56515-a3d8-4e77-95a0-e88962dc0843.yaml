  nature: public broadcaster
  operator: Rádio Moçambique, EP (Empresa Pública) — state-owned public broadcasting corporation of Mozambique
  affiliations: Government of Mozambique (state media); broadcasts official government communications including Council of Ministers statements; historically the ruling FRELIMO party has influenced editorial direction
  audience: National general audience in Portuguese; Antena Nacional serves as the flagship Portuguese-language national network
  format: News, current affairs, sports, culture, politics, economy, science & technology, and international coverage; tagline "Hoje e Sempre" (Today and Always)
  notes: Rádio Moçambique was founded on 2 October 1975 (Mozambique's first anniversary post-independence) succeeding the colonial-era Rádio Clube de Moçambique; Antena Nacional is its primary Portuguese national service alongside provincial Emissor Provincial stations broadcasting in local languages (including Macua, Sena, Tsonga, Shona and others); headquartered in Maputo; remains the most widely heard radio service in Mozambique with national shortwave, FM and AM reach plus online streaming; runs the "Ngoma" cultural/music programme.
