  notes: Metro FM is one of Türkiye's leading national commercial FM networks, broadcasting since 1995 and historically positioned as the country's premier "foreign hits" station focused on Western chart pop, dance and rock. It was originally part of Doğan Yayın Holding's broadcasting portfolio (which also included Slow Türk, Radyo D, CNN Türk Radyo) and passed to Demirören Holding in 2018 along with the rest of the Doğan media assets after Demirören's acquisition of the group. The stream URL points at iHeartMedia's StreamTheWorld CDN (typical for international syndication). Programming includes Metro FM Top 40, drivetime DJ shows and remix specials; the brand has historically organised the "Metro FM Music Awards", one of Türkiye's better-known pop awards events.
