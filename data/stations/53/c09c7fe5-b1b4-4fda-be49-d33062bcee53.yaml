  notes: 'Freie Radios (Free Radios) Berlin Brandenburg is a non-commercial community radio network of "zugangsoffene, selbstverwalteten und werbefreien" (access-open, self-managed, ad-free) stations. Over 300 volunteer broadcasters across 120+ editorial departments. Operates on UKW 88.4 MHz (Berlin) and 90.7 MHz (Potsdam) historically; as of 2026, UKW frequencies lost to ByteFM and Jazz FM. Mission: "soziale Orte lokaler Kommunikation" (social spaces for local communication) essential to democratic media landscapes.'
