  operator: Schweizer Radio und Fernsehen (SRF), the German-language unit of SRG SSR (Swiss Broadcasting Corporation)
  affiliations: Swiss public-service broadcaster funded by household Serafe licence fees plus limited advertising; member of the European Broadcasting Union (EBU); no political/religious ties
  audience: Younger to middle-aged listeners in German-speaking Switzerland (Deutschschweiz), broadcast in Standard and Swiss German
  format: Pop/rock-oriented public-service music station with news bulletins, comedy/satire, music discovery and live-session programming
  notes: Launched 1 November 1983 as DRS 3 to introduce a youth-pop station to Swiss public radio (the third national radio channel after DRS 1 and DRS 2); renamed Radio SRF 3 in 2012 when SRG's German-language units merged; broadcasts nationally on DAB+ and FM from studios in Zürich and Basel; the station is best known for its "Best Talent" Swiss-artist monthly slot, the alt-music show "Sounds!", and the daily Input/Focus current-affairs strands; positions itself as "live-radio with news, current topics and much love for pop & rock".
