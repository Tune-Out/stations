  notes: Radio Tunisie Monastir is a regional public radio station in the city of Monastir (Sahel region, Tunisia), operated by ERTT (Établissement de la Radio Télévision Tunisienne), the state broadcasting corporation founded in 1966. Monastir is a major Mediterranean coastal city and cultural center. The station provides local news, weather, traffic, and cultural programming for the region. Streams at 128 kbps via ERTT's tanitweb.com infrastructure. As part of ERTT, the station is influenced by state broadcasting policies. Tunisia's media environment has evolved toward greater press freedom since 2014, though state broadcasting outlets retain government influence. Programming likely features Tunisian music and Arabic content.
