  nature: state media
  operator: Polskie Radio S.A., the Polish national public radio company; Jedynka is its First Programme (Program I)
  affiliations: Polish state public-media system; oversight body Rada Mediów Narodowych (Council of National Media) appoints management, leading to recurring political-influence controversies
  audience: Mainstream Polish-speaking adult audience nationwide
  format: "Generalist full-service network: news, current affairs, cultural programming, drama, sport, popular music and chat"
  notes: Polskie Radio Program I (Jedynka, "The One") began regular broadcasting in 1926 from Warsaw as the founding service of Polish Radio, making it one of the oldest continuously operating radio channels in Europe; it broadcasts on long wave 225 kHz (one of the few high-power LW transmitters still active in Europe) plus DAB+, FM and internet; Polskie Radio is funded by a license fee, state subsidy and advertising; the network has been the subject of political-pluralism debates, especially after the 2015 changes to public media governance and again after political transitions in 2023–2024.
  sources: internal knowledge
