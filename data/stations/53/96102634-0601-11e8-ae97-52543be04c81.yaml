  operator: Latina SAS, part of Les Indes Radios independent radio group; majority controlled by Espace Group / Cyril Linette / various private investors over its history.
  affiliations: Les Indes Radios (French independent radio trade body); no religious, governmental, or political ties.
  audience: French-speaking adult fans of Latin music (Salsa, Bachata, Reggaeton, Kizomba, Merengue) across France.
  format: Latin music station ("Le son latino") with themed sub-streams, DJ shows, charts and Latin cultural lifestyle content.
  notes: Launched in 1981 (originally as Tropic FM, later Radio Latina) on FM in Paris, the station became the leading French outlet for Latin music; it broadcasts on FM in Paris/Île-de-France, on DAB+ in major French cities, and online via web radios such as Latina Bachata, Latina Salsa, Latina Reggaeton, and Latina Kizomba; programming features such as Le Latino Show, Le Son Latino, La Casa Latina and La Noche Latina, and the brand markets itself as "Le son latino".
