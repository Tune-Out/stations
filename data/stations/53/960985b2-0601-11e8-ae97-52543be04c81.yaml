  nature: public broadcaster
  operator: New York Public Radio (legal name WNYC Radio), a non-profit 501(c)(3) corporation
  affiliations: NPR member station; also part of the Public Radio International (PRX) and APM distribution networks; sister properties include WQXR-FM 105.9 (classical), New Sounds, and the news site Gothamist
  audience: New York metropolitan area public-radio listeners; significant national audience via syndicated shows and podcasts
  format: News, talk, information, cultural and public-affairs programming - NPR programming, locally produced shows, and originating long-form journalism
  notes: WNYC began broadcasting on 8 July 1924 as a municipal station owned by the City of New York; the station became independent in 1997 when the WNYC Foundation purchased the broadcast licences from the city for USD 20 million, transitioning to a fully listener-supported non-profit model; current flagship programmes include The Brian Lehrer Show (nation's longest-running daily call-in show), All Of It with Alison Stewart, On the Media (with Brooke Gladstone), and the Peabody-winning podcast Radiolab (originated at WNYC); WNYC produces or co-produces many landmark public-radio shows including The Takeaway (ended 2023), Death, Sex & Money, More Perfect, and the New Yorker Radio Hour; broadcasts on 93.9 FM and AM 820, plus AAC streaming; the organisation describes itself as "home for independent journalism and courageous conversation" and frames "donations from listeners" as its largest funding source; the parent NYPR also owns WQXR 105.9 FM, the only full-time classical music station in NYC.
  sources: http://www.wnyc.org/, internal knowledge
