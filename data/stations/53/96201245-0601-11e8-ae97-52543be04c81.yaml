  notes: 'Retro Soul Radio has closed. Its homepage now carries only a farewell notice: ''After 16 incredible years on the air, it is with great sadness that we announce the closure of our radio station Retro Soul Radio,'' thanking presenters and listeners. The station was a London-based, commercial-free online soul, funk, disco and jazz service supported by listener contributions, with a weekend-led schedule of named presenter shows such as ''Friday Floor Fillers'' and ''The Soul Sessions''. Both catalogued streams are dead: the direct Icecast feed on 46.28.49.164 does not connect and the Galaxy Web Solutions mirror returns HTTP 502. Schedule and player pages have been removed from the site.'
