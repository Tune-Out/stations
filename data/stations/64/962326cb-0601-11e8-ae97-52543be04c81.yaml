  nature: state media
  operator: Israel Defense Forces (IDF / Tzva Hahagana le-Yisrael), operated directly by the IDF Spokesperson's Unit / Ministry of Defense
  affiliations: governmental and military - it is the radio service of the Israeli armed forces, supervised by the Knesset's Foreign Affairs and Defense Committee and (since 2017) jointly accountable to the Ministers of Defense and Communications; not part of the public Kan broadcaster but a parallel state-military operation
  audience: Hebrew-speaking general public in Israel, soldiers serving in the IDF, and the Israeli diaspora; broadcasts nationwide on FM, AM, DAB+, digital TV audio and online
  format: Full-service news/talk and music network, with hourly news bulletins, current affairs ("Ma Boer", "Yoman Hashavua"), military and security analysis, popular Hebrew and international music, sports, satire and youth programming; the sister channel Galgalatz (101-103 FM) is its all-music traffic-and-music spin-off run by the same unit.
  notes: Founded on 24 September 1950 by order of David Ben-Gurion, Galei Zahal ("IDF Waves") is the world's longest-running continuously operating military-run public radio station; uniquely it broadcasts independent journalism, music and entertainment to the general civilian public while being staffed largely by conscripted soldiers (often top Israeli journalists, musicians and broadcasters did their national service there - Ehud Manor, Yaron London, Razi Barkai, Keren Neubach and many others); it has periodically been at the centre of political controversy, with Israeli right-wing ministers repeatedly proposing to close it or move it to civilian hands, most notably under Defense Minister Avigdor Lieberman (2017) and again in 2023-2024 under Yoav Gallant; its editorial line is generally considered mainstream Israeli centrist with strong investigative journalism, and it produces flagship cultural programmes including the long-running music chart "Maslul Hofa'a"; broadcasts on 102.3 FM (national core), AM 1287 and online stream glz.co.il - the URL on file (bynetcdn.com) is a CDN edge for that stream.
