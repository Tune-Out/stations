  notes: Lux FM (Люкс FM) is a Ukrainian private Hot-AC radio network that began broadcasting in Lviv on 1 January 1994 and launched in Kyiv on 103.1 FM on 20 September 1995, where it was the city's first 24-hour station. It is operated by TRK Lux (Lux Media Group), controlled by Kateryna Kit-Sadova, wife of Lviv mayor Andriy Sadovyy, and airs in more than 20 Ukrainian cities. The playlist mixes contemporary international and Ukrainian hits with the morning show 'Zaryadka', a 'Good News' bulletin and lifestyle content, and the brand has a large YouTube/TikTok presence; it has occasionally been fined for missing Ukrainian-language song quotas.
