  nature: religious
  operator: RCF (Radios Chrétiennes Francophones), a federation of associative Catholic local radios
  affiliations: Roman Catholic Church (Conference of Bishops of France / Conférence des évêques de France); religiously affiliated, politically non-partisan
  audience: French-speaking Catholic and Christian-curious adult audience across France, Belgium, and francophone areas; French language
  format: Mixed format combining national religious news, spirituality, culture, classical/sacred music, and locally produced shows from member stations; daily Mass broadcasts and liturgy follow major Catholic events
  notes: Founded in 1982 in Lyon as "Radio Fourvière" then later expanded into a national network of approximately 60 affiliated local Catholic stations covering most French dioceses; one of France's largest "radios associatives" with category B authorization from Arcom; mission statement emphasizes the "values of the Gospel" and dialogue with society; funded through listener donations, parish appeals, and limited advertising; produces both shared national programming and decentralized local content; not a commercial broadcaster.
  sources: internal knowledge only
