  notes: 'Commercial rock radio broadcaster with national German coverage and regional feeds for NRW, Hessen, and Schleswig-Holstein. Available via FM, streaming, and myBOB app. Tagline: "Wenn Rock, dann BOB!" ("If rock, then BOB!"). Notable shows include "Hells Bells," "Musikwunsch" (music requests); original podcasts: "True Crime Tracklist," "Met & Moshpit" (medieval rock), "Die größten Rocksongs." Community engagement through "BOBs Backstagebereich" membership area, contests ("King of BOB," "Beichtstuhl"), user-generated content via "BOBs Rock-Reporter." Live events including BOBfest festival and concert presentations at Rockcamp during Kiel Week.'
