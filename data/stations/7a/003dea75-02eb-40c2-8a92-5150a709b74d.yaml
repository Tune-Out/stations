  notes: P4 Göteborg is the Gothenburg / west-coast regional channel of Sveriges Radio's P4 network, broadcasting on 102.7 MHz FM (plus DAB+ and online). The P4 network is Sweden's most-listened-to radio brand, made up of 25 local channels that share national P4 programming overnight and weekends. P4 Göteborg covers Gothenburg, Bohuslän and Halland with morning shows like "P4 Morgon Göteborg" and afternoon flagship "Eftermiddag i P4". It carries Göteborgs-Posten-style local journalism, regular Friday entertainment-music block "Melodikrysset", "Sommar/Vinter i P4" national strands, and live commentary of Allsvenskan football matches involving IFK Göteborg and BK Häcken plus SHL ice-hockey (Frölunda). Sveriges Radio operates under a public-service remit set by the Swedish parliament and is required to be impartial, factual and independent of commercial and political interests; it carries no advertising. The "sverigesradio/p4goteborg" homepage URL in this YAML is malformed — the correct site is https://sverigesradio.se/p4goteborg.
