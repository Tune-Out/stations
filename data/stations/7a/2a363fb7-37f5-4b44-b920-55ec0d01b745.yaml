  operator: British Broadcasting Corporation (BBC) - UK public service broadcaster, funded via the TV licence fee
  affiliations: Operates under Royal Charter; editorially independent of government; member of the European Broadcasting Union (EBU)
  audience: UK-wide adult speech audience interested in comedy, drama and entertainment from the BBC archive; English language; available globally via BBC Sounds (with rights-restricted exceptions)
  format: "Speech-based archive station: classic and contemporary comedy, drama, science fiction, readings and entertainment from the BBC's audio archive"
  notes: Launched on 15 December 2002 as BBC 7 (with "BBC Radio 7" branding from 2008) and re-branded as BBC Radio 4 Extra on 2 April 2011 to align with sister speech network Radio 4; available on DAB, Freeview, Sky, Freesat, Virgin Media and via BBC Sounds streaming; signature schedule includes classic Hancock's Half Hour, Round the Horne, I'm Sorry I Haven't a Clue, Dad's Army, Hitchhiker's Guide to the Galaxy and contemporary children's strand Big Toe (formerly); regularly tops digital-only radio audience figures in RAJAR; subject to wider BBC commissioning and budget reviews including a 2022 BBC plan to merge digital station outputs.
