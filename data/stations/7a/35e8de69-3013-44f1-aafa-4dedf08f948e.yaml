  notes: Kontrafunk launched in 2022 as a Swiss-based German-language internet radio station founded by journalist Burkhard Müller-Ullrich (former Deutschlandfunk editor), explicitly positioned as a counterweight to what its founders call "gleichgeschaltete" mainstream media; broadcasts daily news, the "Kontrafunk aktuell" magazine, interview formats, and programmes featuring contributors associated with conservative, libertarian or pandemic-critical viewpoints; financed via memberships, donations and limited advertising rather than public licence fees; has been the subject of significant German-language media debate over its editorial line.
