  notes: "\"80er Kulthits\" is one of several themed digital web/DAB+ side channels of Antenne Bayern, Bavaria's largest private commercial radio station. Antenne Bayern launched in 1988 as one of Germany's first private commercial stations following the 1980s liberalisation of broadcasting, and is owned by a consortium of Bavarian newspaper publishers including the Süddeutsche Zeitung publishing group, Müller Medien, and others. The flagship station broadcasts in Bavaria on FM with adult contemporary hits, news, and entertainment, regularly topping audience surveys in Germany. The \"80er Kulthits\" sub-channel curates 1980s pop and rock hits (Madonna, Michael Jackson, Depeche Mode, Modern Talking, etc.) targeting nostalgic adult listeners. As a private licensee it is regulated by the Bayerische Landeszentrale für neue Medien (BLM)."
