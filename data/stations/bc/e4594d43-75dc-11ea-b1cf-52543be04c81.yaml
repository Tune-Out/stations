  notes: 'BEAUTIFUL Instrumentals, also published as the Beautiful Music Station, is a one-person internet station run by R. Alan Campbell, a retired US easy-listening broadcaster and Broadcast Pioneers of Philadelphia member who operates it from San Pedro Garza García in Nuevo León, Mexico — hence the Mexican country code on an English-language station. It revives the classic American ''beautiful music'' format, largely extinct on terrestrial radio: lush orchestral and instrumental arrangements of Broadway and Hollywood songs, the great American standards and vintage instrumental hits from around the world. It is not a classical station, as the current tags suggest. The stream is carried on a Voscast SHOUTcast server and reaches listeners through TuneIn, GetMeRadio, Sonos and Alexa; the accompanying blog has seen little new posting since about February 2020, though the stream itself remains up.'
