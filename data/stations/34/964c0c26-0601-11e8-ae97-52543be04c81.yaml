  notes: Cool Radio is a Belgrade-based commercial music station broadcasting on FM in the Serbian capital and streaming nationally, branded as the number one station for current hits. Despite the "folk" tag carried in aggregator data, its playlist mixes mainstream international chart pop and dance with Serbian and Balkan estrada and pop-folk. It is run by Cool Radio d.o.o. and funded entirely by advertising, with a paid ad-free higher-bitrate mobile tier offered alongside the free 128k stream. Programming is largely music-driven with named daytime presenters, and the operator also maintains a separate Cool Radio Serbia stream. The station remained on air with a live website at the time of review.
