  nature: religious
  operator: Radio Mojdeh ministry (Persian-language Christian media organisation operating from outside Iran, despite the IR country code in the catalog)
  affiliations: Christian — Persian-language evangelical/Protestant Christian outreach, with content suggestive of Seventh-day Adventist roots (the "adventista" tag in the catalog supports this); not affiliated with the Iranian state, which restricts Christian broadcasting domestically
  audience: Persian (Farsi) speakers inside Iran, Afghanistan and the Iranian diaspora worldwide; targeted at non-believers, seekers and existing Christians
  format: Christian teaching, sermons, Bible studies, personal testimonies, prayers, Christian music in Persian, spiritual reflections and Q&A programming; distributed via satellite (Yahsat 52.5° East), online stream, podcasts and social media
  notes: '"Mojdeh" (مژده) is Persian for "good news" or "Gospel"; the station is part of the broader landscape of diaspora-run Persian-language Christian broadcasters (alongside SAT-7 PARS, Mohabat TV, Nejat TV and others) that target Iran via satellite and internet because evangelism and conversion from Islam are illegal under Iranian law; the operation is therefore based outside Iran (despite Tehran being listed in the catalog metadata) and is a non-commercial mission-supported ministry rather than a state or commercial broadcaster.'
  sources: http://www.radiomojdeh.com/, internal knowledge of Persian-language Christian satellite broadcasting and Iranian media restrictions
