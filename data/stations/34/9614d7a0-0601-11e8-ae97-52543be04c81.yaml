  notes: Radio Mojdeh ('Good News Radio') is a 24/7 Persian-language Christian internet radio station and website run by Voice of Christ Media Ministries, an evangelical mission based in Beaverton, Oregon, with a Canadian office in Surrey, British Columbia. It streams Bible teaching, Scripture readings, testimonies, discipleship material and Persian Christian music, and offers the full Persian Bible online plus Android and iOS apps. Although catalogued under Iran, it operates from the United States because Christian evangelism is restricted inside Iran; the earlier suggestion of Seventh-day Adventist roots is not supported by the ministry's own material.
