  nature: public broadcaster
  operator: All India Radio (Akashvani) — division of Prasar Bharati, India's autonomous public service broadcaster under the Ministry of Information and Broadcasting
  affiliations: Government of India (Prasar Bharati statutory corporation); no religious or party-political affiliation
  audience: Urban Hindi-speaking listeners in major metropolitan markets, especially Delhi, Mumbai, Kolkata, Chennai, and beyond via FM and online stream; targets younger, mass-market listeners
  format: Hindi film music (Bollywood) — predominantly Hindi film songs (old and new), with brief news, traffic, and presenter chat in a chatty Hinglish style
  notes: AIR FM Gold launched on 1 September 2001 in Delhi as a Hindi film music and entertainment service distinct from the older Vividh Bharati and FM Rainbow channels; it became one of AIR's most popular FM brands in the metros; "Akashvani" (literally "voice from the sky") is the official Hindi/Sanskrit name for All India Radio, formally adopted in 1957 and re-emphasised in branding under the BJP government's 2023 rebranding push that asked AIR to be called Akashvani on-air; broadcasts in Delhi on 106.4 FM (and other frequencies in other cities); offered via Prasar Bharati's official HLS streams.
