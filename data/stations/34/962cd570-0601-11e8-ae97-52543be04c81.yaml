  notes: Latvijas Radio 2 (LR2) is the second channel of Latvia's national public radio, launched in 1991 after Latvia's restoration of independence; programming centers on Latvian-language popular music (a deliberate cultural policy to support Latvian-language artists) alongside lighter talk, weather, and entertainment formats; the parent organization Latvijas Radio dates to 1925 when Latvian state radio first went on air from Riga; since 2020 LR2 has operated under the umbrella public-media entity Latvijas Sabiedriskais medijs (LSM) following a reorganization that merged Latvian Radio and Latvian Television under one supervisory council; funded by state appropriation with limited advertising allowed under Latvia's public-media law.
