  operator: Radio Television Tirol GmbH (Gesellschaft m.b.H.) based in Bozen / Bolzano, South Tyrol, Italy
  affiliations: none known; private station serving the German-speaking minority of South Tyrol, independent of RAI Südtirol public service
  audience: German-speaking residents of South Tyrol (Alto Adige), Italy — adult listeners interested in Schlager, evergreens and regional news
  format: "Mixed German-language full-service format: Schlager, evergreens and hits, regional news (\"G'sundes Südtirol\", \"Vereinszeit\"), weather, traffic and local community programming"
  notes: Despite the name, Radio Tirol broadcasts from Italian South Tyrol (not the Austrian Tirol), serving the German-speaking autonomous province of Bolzano-Bozen on multiple FM frequencies (92.5, 104.9, 106.9, 107.2 and 107.3 MHz) covering the Etsch, Eisack, Puster and Vinschgau valleys around Meran, Bozen and Brixen. It is one of several private German-language stations (alongside Südtirol 1, Antenne Südtirol and Tele Radio Vinschgau) that operate parallel to RAI's Sender Bozen public service in this trilingual Italian region. Programming emphasises local lifestyle, health and Vereinswesen (club life) content reflecting the strong local-identity character of South Tyrolean media.
  sources: https://www.radiotirol.it/, internal knowledge
