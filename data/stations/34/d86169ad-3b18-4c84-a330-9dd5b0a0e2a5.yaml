  operator: Noroc Media Group (Noroc TV / Radio Noroc) - a Moldovan private broadcaster operating Noroc TV (a popular national music television channel) and Radio Noroc; based in Chisinau
  affiliations: none political; commercial broadcaster
  audience: Moldovan listeners (Romanian-speaking) and the Romanian/Moldovan diaspora; broad family demographic with strong appeal to fans of Romanian-language pop and traditional music
  format: Romanian-language mainstream hits with a strong focus on muzica populara (Moldovan/Romanian folk-pop), manele, etno-pop, and Romanian estrada/pop; mix of national and international hits
  notes: Radio Noroc ("Noroc" = "Good Luck" in Romanian) is the radio arm of the Noroc media brand best known for Noroc TV, one of Moldova's most-watched music television channels devoted to Romanian and Moldovan popular music. The brand has been a fixture of the Moldovan media landscape since the 2000s and is associated with promoting Moldovan ethno-pop artists and the wider Romanian-language popular-music scene. The radio simulcasts via stream.noroc.tv on the Noroc Media CDN.
