  notes: ESKA Poznań is the local branch of Radio ESKA, the largest commercial CHR network in Poland with stations in 40+ cities. The network was founded in 1988 in Warsaw by Bogusław Brzezicki and consolidated under Grupa ZPR Media in the 1990s; the Poznań edition broadcasts on FM (and the player at hand streams via smcdn.pl, the CDN of Eurozet/RMF). ZPR Media also owns SuperEXPRESS daily and the Vox FM, Eska Rock, VIBE FM and Plus Radio brands. The station carries national network programming with local Poznań news, Lech Poznań football coverage and city event reporting.
