  notes: The Jazz Groove is a listener-supported, commercial-free internet jazz service run by The Jazz Groove, Inc. in Los Angeles and programmed by Steve Williams. It streams two staggered feeds, East and West, that draw on the same library of mainstream, vocal, post-bop and contemporary 'laid-back jazz' so US listeners on either coast hear fresh music at similar hours. Distribution is via direct AAC/MP3 streams (now served from Radio Mast), TuneIn, iHeart and its own iOS/Android apps; funding comes from donations and memberships. This West feed is the catalog's canonical entry for the service.
