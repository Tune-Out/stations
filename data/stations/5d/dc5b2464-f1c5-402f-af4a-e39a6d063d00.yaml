  nature: non-commercial
  operator: The Jazz Groove, Inc. — an internet-radio operation based in Los Angeles, California, founded and programmed by Steve Williams
  affiliations: none known (independent jazz broadcaster; takes listener donations and SoundExchange-licensed webcast under US DMCA rules)
  audience: Adult international audience of mainstream / smooth / contemporary jazz fans, listening primarily via web stream and the Jazz Groove mobile app; English-language
  format: '"Laid-back jazz" — a 24/7 commercial-free mix of mainstream, post-bop, vocal, contemporary and smooth jazz curated to be relaxing and easy-to-listen; East and West streams stagger the playlist'
  notes: Founded in 2000 by Los Angeles jazz programmer Steve Williams, The Jazz Groove operates two parallel feeds — East and West — that play the same library on different schedules so listeners on either US coast hear fresh music at a similar hour; the service is donation-supported and ad-free, distributed via direct HTTP/AAC streams, TuneIn, iHeart and dedicated iOS/Android apps; the station is regularly cited by jazz musicians as an important non-terrestrial outlet for mainstream jazz in an era of shrinking traditional jazz radio.
  sources: https://jazzgroove.org/, internal knowledge of US internet jazz radio
