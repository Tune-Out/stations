  notes: This stream broadcasts the renowned recitations of Sheikh Muhammad Siddiq al-Minshawi (1920-1969), one of Egypt's most celebrated Qur'an reciters and a major figure of the 20th-century Egyptian school of tajwid (Qur'anic recitation). Al-Minshawi was known for his emotionally moving recitations and is considered one of the four greatest reciters of the modern era alongside Abdul Basit Abdus Samad, Mahmoud Khalil Al-Hussary, and Mustafa Ismail. The stream is hosted by Qurango.net, an Arabic-language online platform aggregating Qur'an recitation streams from many famous reciters. The IR (Iran) country tag in the Radio Browser metadata appears to be incorrect, as the content is Egyptian/Sunni in origin and the service is pan-Arab/global Muslim in audience.
