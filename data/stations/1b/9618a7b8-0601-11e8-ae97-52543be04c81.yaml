  notes: Discover Trance Radio is an independent, UK-based internet station founded in February 2010 that bills itself as 'the uplifting trance radio broadcasting the finest music around the globe'. It runs a daily schedule of DJ-hosted shows such as Mile High Trance Sessions, Journeys Through Uplifting Trance and Classic Trance Euphoria, plus label showcases from Silent Shore, Defcon and Colorful Recordings, and streams at 128, 192 and 320 kbps from servers in Finland and the UK. It is free to listen and supported by listener donations and subscriptions, with community forums and a Discord. Despite the catalog's country field, the station is British, not Russian; the name in the catalog carries a bitrate suffix.
