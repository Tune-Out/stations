  notes: Kannadasan Radio (also branded as Kaviyarasar Radio) is a tribute online stream dedicated to the songs of Kannadasan (1927-1981), a celebrated Tamil poet, lyricist, philosopher, and writer who composed lyrics for over 5,000 Tamil film songs and earned the honorific Kaviarasar; the station is part of TamilRadios.com's network of genre/personality-themed Tamil streams (similar dedicated streams exist for Ilaiyaraaja, A.R. Rahman, M.S. Viswanathan, etc.) hosted on listenon.in infrastructure; it serves as a continuous showcase of classic Tamil cinema songwriting and is popular with older Tamil diaspora audiences.
