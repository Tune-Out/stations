  notes: '"Oldpop Cafe" (올드팝카페) is a long-running independent Korean internet-only station, active since 18 June 2009, that streams an automated playlist of classic Western pop oldies; the site states "올드팝카페는 1년 365일 24시간 정겨운 올드팝과 함께합니다" ("Old Pop Cafe is with you with friendly oldies pop 365 days a year, 24 hours a day"); occasional commentary broadcasts (멘트방송) were scheduled Wednesdays and Saturdays at 8 PM but are currently suspended; the site also publishes travel and lifestyle articles, giving it a hobbyist-magazine feel rather than a commercial radio operation; it forms part of the PAGE2.kr small-site web ring.'
