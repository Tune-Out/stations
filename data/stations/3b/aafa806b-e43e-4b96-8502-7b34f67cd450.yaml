  notes: Radio Kaya is a community radio station on Kenya's coast, founded in July 2007 and headquartered in Kwale, with transmitters on 93.1 FM in Mombasa, 99.7 FM in Malindi and 94.9 FM in Lunga Lunga and Kilifi. Under the tagline 'Kitovu Cha Umoja Wa Pwani' (unity centre of the coast) it aims to entertain, educate and inform listeners about coastal culture and to give local communities a forum for exchange, with a team of more than a dozen presenters broadcasting in Swahili and English. It has worked with DW Akademie's community-media programmes and streams online via Mixstream.
