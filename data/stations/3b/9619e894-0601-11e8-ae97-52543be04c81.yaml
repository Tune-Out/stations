  notes: 'The Music Machine is a UK alternative-music broadcaster run by Sammy Jacob, who founded the original XFM. It began as NME Radio on 24 June 2008, closed in 2013, relaunched under NME branding on 13 June 2018, and rebranded to The Music Machine in 2023 when the magazine licensing contract ended. Two channels run around the clock: TMM 1 covers classics from 1960s garage and 1970s punk through 1980s new wave and 1990s grunge, while TMM 2 concentrates on contemporary indie, electronic, urban and dance. Both go out on DAB+ in London and Norwich as well as online, and the streams still carry the legacy "nme" mount names on Sharp Stream.'
