  notes: Founded 18 November 1927 in Porto Alegre, one of Brazil's oldest broadcasters and the flagship radio station of Grupo RBS; broadcasts on AM 600 kHz and FM 93.7 MHz in Porto Alegre with a network of affiliated stations across Rio Grande do Sul; built its reputation on rapid news bulletins, the long-running "Gaúcha Repórter" and "Gaúcha Atualidade" news shows, and football play-by-play with renowned narrators such as Pedro Ernesto Denardin; the integrated portal gauchazh.clicrbs.com.br merges Zero Hora newspaper, Rádio Gaúcha and RBS TV content; considered one of the most politically influential media outlets in southern Brazil.
