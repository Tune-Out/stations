  notes: 'Mirchi (formerly Radio Mirchi) is India''s leading private FM brand, owned by Entertainment Network India Ltd, a subsidiary of The Times Group. It began in 1993 in Indore as Times FM, the country''s first privately owned station, and now runs a 76-station FM network across 63 cities plus online and international feeds in the UAE, Qatar, Bahrain and the United States, with a 2017 IRS reach of roughly 52% of Delhi and 44% of Mumbai listeners. Mirchi Top 20 is the group''s signature weekly Bollywood countdown, published alongside its Indie Pop 10 chart in The Times of India. One caveat on this entry: the stream is an uber.radio mount whose ICY name is "uber/bollywoodnow", a generic Bollywood feed rather than a chart show, so what plays is a continuous Hindi film-music rotation rather than the branded countdown.'
