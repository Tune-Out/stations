  notes: BFM Radio is a French private rolling-news radio station operated by RMC BFM, the group that also runs RMC, BFM Business and RMC Gold. It started as an online audio simulcast of BFM TV in November 2018, received Arcom authorisation in 2019 and launched on DAB+ (multiplex M2 along the Paris-Lyon-Marseille corridor) on 12 October 2021. Programming is mostly the BFM TV feed with dedicated radio content such as hourly Flashs info, La Question info and La Question éco. RMC BFM was owned by Altice Média until 2 July 2024, when CMA CGM's media arm CMA Média (Rodolphe Saadé) completed its 1.55 billion euro acquisition. The station set digital audience records of 1.5 million listeners in July 2024 and 1.8 million in March 2026.
