  nature: public broadcaster
  operator: All India Radio (Akashvani) / Prasar Bharati (statutory autonomous public broadcasting corporation of India)
  affiliations: Government of India via Prasar Bharati (Broadcasting Corporation of India Act, 1990); a regional station of the national AIR network
  audience: Madhya Pradesh and central Indian listeners; Hindi-, Urdu-, Malwi- and English-speaking audience in and around Indore
  format: Public-service mix of news, infotainment, talk and music including Indian classical, film songs, regional folk and devotional programming, plus relays of national AIR bulletins
  notes: AIR Indore is one of dozens of regional kendras that make up All India Radio, the national public broadcaster operating since 1936 (renamed Akashvani in 1957); Prasar Bharati became the autonomous statutory operator in 1997 but remains state-funded and government-influenced through board appointments; the Indore station serves as the principal AIR transmitter for the Malwa region of Madhya Pradesh; like other AIR stations it carries mandatory national news from Delhi and regional content produced locally.
