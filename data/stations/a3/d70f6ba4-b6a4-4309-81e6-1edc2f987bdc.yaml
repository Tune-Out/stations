research:
  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: British Broadcasting Corporation (BBC) — BBC Northern Ireland division
  affiliations: BBC, funded by UK TV licence fee; editorially independent under the BBC Royal Charter; no party/religious affiliation but mandated to reflect Northern Ireland's cultural and political diversity (unionist, nationalist and other communities) impartially
  audience: General adult listeners across Northern Ireland (and Irish-border counties); English-language with occasional Ulster-Scots and Irish-language content
  format: "Mixed-speech and music public service radio: news, current affairs, sport (especially GAA and football), arts, faith, traditional/folk and country music, plus regional magazine shows"
  notes: BBC Radio Ulster launched on 1 January 1975 as the dedicated BBC radio service for Northern Ireland, broadcasting from Broadcasting House in Belfast on 92-95 FM, MW 873/1341 kHz, DAB and online; flagship programmes include Good Morning Ulster (breakfast news), Talkback (lunchtime phone-in), Evening Extra, and traditional/country shows like Hugo Duncan's Afternoon Show and Ralph McLean's specialist music; sister opt-out BBC Radio Foyle serves the north-west from Derry/Londonderry; like all BBC radio it carries no advertising and is governed by the BBC Operating Licence which sets minimum hours of Northern Ireland-specific content; the 128 kbps stream is one of the official BBC Sounds live feeds
  sources: internal knowledge only
