  operator: Zimpapers Talk Radio (Pvt) Ltd, a subsidiary of Zimbabwe Newspapers (1980) Limited (Zimpapers)
  affiliations: Zimpapers is majority-owned by the Zimbabwe Mass Media Trust, in which the government of Zimbabwe holds a controlling stake, giving the station de facto ties to the ruling ZANU-PF establishment despite a commercial format
  audience: English-speaking adult listeners in Harare and surrounding Mashonaland; commuter and business-class demographic
  format: Commercial talk-and-music station with news, business updates, sports, current affairs and African contemporary music
  notes: Capitalk 100.4 FM is one of the urban commercial radio licences issued in Harare under Zimbabwe's controlled broadcasting liberalisation; launched in 2015 by Zimpapers under the Zimpapers Talk Radio banner, it is broadcast on 100.4 MHz in Harare and streamed online via iono.fm; programming includes flagship talk shows on politics, business and lifestyle alongside African music playlists
