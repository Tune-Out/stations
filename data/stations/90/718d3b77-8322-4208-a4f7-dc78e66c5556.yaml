  notes: Twice-weekly audio stream/podcast featuring hosts Adam Curry (former MTV) and John C. Dvorak (technology/tech commentator) deconstructing news, politics, and media narratives. Established listener-supported "value-for-value" funding model with no advertisements. Won Podcast Award for Best Podcast in News & Politics category (July 2016). Episodes recorded Thursdays and Sundays at 11am Pacific Time. Countercultural perspective from Curry balanced with more pragmatic analysis from Dvorak.
