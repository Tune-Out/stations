  notes: Radio Russkie Pesni (Russian Songs Radio, rusongs.ru) is a Moscow-based internet-only station that has streamed since 14 July 2014 and holds Russian mass-media registration FS77-58549. It plays contemporary Russian-language pop, rock and dance hits around the clock with no presenters, offering 64, 128 and 160 kbps streams, and is distributed through aggregators such as OnlineRadioBox, myTuner, TuneIn and Radiopotok. The operating company is not disclosed on the site beyond a contact email and Moscow phone number; the earlier description of Soviet estrada and romances is inaccurate, as the station positions itself as modern Russian popular music.
