  notes: FM 93 Rawalpindi is operated by Pakistan Broadcasting Corporation (PBC, also known as Radio Pakistan), the state-owned national public broadcaster originally founded as the Indian Broadcasting Company in 1932 and reorganized as PBC after Pakistan's independence in 1947; broadcasts on 93 MHz FM serving Rawalpindi-Islamabad twin cities; part of PBC's nationwide FM93 network which launched in the early 2000s as a youth-oriented modern FM service distinct from the more traditional Radio Pakistan AM/medium-wave programming; carries news bulletins from PBC's central newsroom; the .gov.pk domain and whmsonic.radio.gov.pk stream URL confirm direct government ownership.
