  notes: 90s90s is a German digital radio brand from private broadcaster Regiocast, launched on 29 November 2016 as a sister to 80s80s and produced from studios in Berlin. Its moderated main programme plays hits, stars and lifestyle of 1990-1999 and has been carried nationwide on DAB+ (second Bundesmux, channel 5D) since 2 January 2023, alongside a family of about 15 automated sub-channels (Eurodance, Hip-Hop & Rap, Techno, Grunge, Britpop, House and more). This entry is the flagship 'Hits' feed streamed at 192 kbps MP3. It is ad-financed and belongs to one of Germany's larger private radio groups.
