  notes: Underground 80s is a channel of SomaFM, the listener-supported, commercial-free internet radio network founded by Rusty Hodge in San Francisco in February 2000 after starting as a micropower station at Burning Man in 1999. Formerly called Nu Musik, the channel plays early-80s UK synthpop and a bit of new wave, from Human League, Depeche Mode and New Order to lesser-known acts such as New Musik and Lene Lovich. SomaFM is funded entirely by listener donations, carries no advertising and offers each channel in several bitrates and codecs, of which this entry is the 128 kbps MP3 feed. SomaFM's hand-curated channels are among the most respected in internet radio.
