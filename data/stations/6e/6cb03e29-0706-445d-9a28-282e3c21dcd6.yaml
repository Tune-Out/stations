  notes: Radio Sunshine launched in 1995 as a regional private radio station based in Rotkreuz, Canton Zug, holding one of the OUC (FM) concessions for Central Switzerland; the station has gone through several ownership changes, including being part of Radio Sunshine AG, then merged into the AZ Medien radio cluster which became CH Media's radio division in 2018 (alongside FM1, Radio 24, Radio Pilatus, Radio Argovia, Energy, and others); positioning emphasizes "Die schönsten Hits" with adult-contemporary playlists and personality-led morning programming targeting commuters in the Lucerne-Zug economic region; regulated under Swiss federal media law (BAKOM concession).
