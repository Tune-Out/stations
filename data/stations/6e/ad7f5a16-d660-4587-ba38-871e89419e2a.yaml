  nature: state media
  operator: Radio Sana'a (إذاعة صنعاء), operated by the Yemen Media Corporation (or successor state authority) based in Sana'a.
  affiliations: Historically aligned with successive Yemeni state governments; since 2014-2015 affiliated with the Houthis (Ansar Allah) who control Sana'a and northern Yemen; broadcasts in Arabic.
  audience: Arabic-speaking audiences in Yemen and the wider Arab diaspora; domestic listening in Sana'a and other Houthi-controlled areas.
  format: Full-service state radio with news bulletins, political programming, religious content, music and cultural features.
  notes: Sana'a Radio is Yemen's domestic state broadcaster based in the capital Sana'a; since the 2014-2015 Houthi takeover of Sana'a and the outbreak of the Yemeni civil war it has operated under Houthi control; like other state media in Yemen it carries government/movement messaging alongside news and entertainment; the homepage (sanaaradio.net) is intermittently accessible but provides limited modern web presence; streaming infrastructure suggests continuation of broadcast operations.
