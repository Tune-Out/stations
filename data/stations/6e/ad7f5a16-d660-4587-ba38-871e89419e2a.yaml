  notes: 'Sana''a Radio is Yemen''s oldest broadcaster, first on air in 1947 (briefly closed after the failed 1948 revolt and restored in 1955), and the flagship general-programme station of the state Yemen General Corporation for Radio and Television. It broadcasts around the clock on shortwave, medium wave and FM with five main news bulletins plus religious, cultural, children''s and music programmes. Since the Houthi takeover of the capital in 2014-15 it has been run by the Houthi-controlled authorities in Sana''a, and its content is reported to consist largely of pro-Houthi and anti-coalition messaging. The sanaaradio.net homepage now redirects to sanaaradio.ye, which does not currently respond, though the audio stream remains live. Editorial flag: Sana''a Radio has been under Houthi (Ansar Allah) control since the 2014-15 seizure of Sana''a; monitoring reports describe its output as pro-Houthi propaganda, military recruitment appeals and messages of support for Hezbollah and Iran. The Houthi movement is designated a terrorist organisation by the United States.'
