  notes: Venice Classic Radio is an internet station dedicated to classical music with a focus on live performances from the Venice region, particularly from the city's storied concert venues and historic churches. Venice has a rich classical music tradition dating back centuries, including the famous Vivaldi connection and ongoing performance traditions. The station streams live classical recordings, traditional concert hall broadcasts and orchestral works. Broadcasts in Italian and English to serve both local Venetian and international audiences. Streams via a direct IP server at 128 kbps MP3. GPS coordinates place the broadcast origin in central Venice (near latitude/longitude of the historic lagoon city). The website features an elegant player interface reflecting the classical music focus.
