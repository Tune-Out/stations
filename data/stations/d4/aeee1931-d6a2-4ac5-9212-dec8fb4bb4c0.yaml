  notes: 'Radio Courtoisie is a Paris associative (category A) station founded in November 1987 by Jean Ferré, broadcasting on 95.6 MHz in Île-de-France plus regional relays. It takes no advertising and runs on listener donations, and describes itself as open to the whole French right; its editorial line rests on right-wing politics, traditionalist Catholicism and French cultural heritage, framed around Charles Maurras''s "pays réel". Programming is built on "libres journaux" — long guest-hosted talk blocks — interspersed with classical music and chanson. Editorial flag: Far-right French talk station repeatedly sanctioned by the CSA (now Arcom) for racist, injurious and revisionist on-air statements, including the 2004 broadcast of antisemitic remarks by guest Alain Menargues; goes well beyond ordinary partisan talk radio and should not be surfaced editorially.'
