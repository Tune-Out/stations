  nature: public broadcaster
  operator: Bulgarian National Radio (Българско национално радио, BNR) — Bulgaria's statutory public-service radio organisation
  affiliations: Bulgarian state public broadcasting system, governed by the Council for Electronic Media (Съвет за електронни медии); EBU member through BNR
  audience: General adult audience across Bulgaria seeking news, current affairs, music and culture; broadcast in Bulgarian
  format: "Horizont is BNR's flagship full-service generalist programme: news bulletins on the hour, current-affairs talk, sport, cultural and entertainment programmes, plus a broad mix of Bulgarian and international music"
  notes: BNR Horizont is one of the two main national programmes of BNR (alongside Hristo Botev), reaching the entire country via FM, MW, DAB and online. Founded in its modern form in the 1990s out of earlier Radio Sofia structures dating back to 1935, it is funded through the state budget supplemented by limited advertising. As part of BNR it is editorially independent on paper but periodically faces public debate about political pressure, board appointments and budget cuts, especially during Bulgaria's frequent government changes. The radioplay.bg portal serves as one of several official streaming gateways aggregating BNR and private Bulgarian stations.
