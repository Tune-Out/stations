  notes: SWR1 Rheinland-Pfalz is the Rhineland-Palatinate regional edition of SWR1, one of the most-listened-to radio brands in southwestern Germany; SWR was formed in 1998 from the merger of Süddeutscher Rundfunk (SDR) and Südwestfunk (SWF) and is one of the largest ARD member broadcasters; SWR1 RP combines a mainstream pop/rock playlist spanning the 1970s to today with strong regional news output, the popular "SWR1 Hitparade" listener-voted countdown, and service-driven morning programming; companion edition SWR1 BW serves Baden-Württemberg.
