  notes: MIBL Radio is a Sydney-based web-only station created and curated by Mohsen Moussawi, streaming AI-generated original electronic and world music around the clock. It bills itself as 'the world's first radio station born of human artistry and AI', with a library of more than 500 original tracks and synthetic DJ voices named Kian and Rozhan. The Instrumental stream is the wordless counterpart to the station's vocal feed, and the multilingual catalogue includes Persian, Arabic, Turkish and a dozen other languages.
