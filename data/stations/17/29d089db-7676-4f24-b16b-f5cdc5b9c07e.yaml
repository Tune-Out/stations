  notes: Broadcasting on DWLL 94.7 MHz from Unit 908, Paragon Plaza Building, EDSA, Mandaluyong (Metro Manila), Mellow 94.7 is one of the longest-running soft-AC FM stations in the Philippines, on air for over five decades; the license is held by FBS Radio Network, while Prage Management Corporation took over operations on 3 October 2024; on 1 August 2024 the station briefly dropped the "Mellow" branding before restoring it a month later as "Mellow 94.7 BFM" — with "BFM" expanded as "Best Friend Mo" (Taglish for "Your Best Friend"); not affiliated with Brigada News FM despite the shared "BFM" abbreviation.
