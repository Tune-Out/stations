  notes: Founded 1990 by Andrzej Woyciechowski as one of the first private radio stations in post-communist Poland, going on air with regular programming from September 1990; long the country's leading commercial AC/news network competing with RMF FM, it was owned for years by France's Lagardère Active group before being sold to Czech Media Invest (CMI/Eurozet) in 2019 — a transaction completed after extensive Polish antitrust scrutiny when Agora SA's parallel bid was blocked. Known for the morning "Gość Radia ZET" political interview, a signature appointment for Polish politicians, and for hosts such as Beata Lubecka and (formerly) Monika Olejnik.
