  nature: state media
  operator: Voice of America (VOA), a service of the U.S. Agency for Global Media (USAGM), funded by an annual appropriation of the U.S. Congress
  affiliations: official external broadcaster of the U.S. federal government; operates under a statutory firewall meant to insulate editorial decisions from political interference (VOA Charter, signed into law 1976)
  audience: non-native English learners worldwide, particularly in regions with limited press freedom; students, teachers, and ESL self-learners
  format: simplified-English news, features and educational programming using a controlled vocabulary of ~1,500 words and slower delivery speed; segments include "Learning English Broadcast", "Let's Learn English", "American Stories", "Words and Their Stories", and grammar/vocabulary lessons
  notes: VOA Learning English (originally "Special English") was launched in 1959 to make American news and culture accessible to English learners; programs are distributed via shortwave, FM affiliates, satellite, podcasts and HLS streams hosted on Akamai; VOA in general has been the subject of repeated political controversies, including 2020 and 2025 disputes over USAGM leadership and editorial independence; the Learning English service remains one of VOA's most-used educational outputs globally.
