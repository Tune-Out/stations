  notes: Radio Shemroon is a Persian-language diaspora internet radio station billed as the first Iranian comedy radio, produced and hosted by Artin Partovian and streamed 24/7 with satire, talk, interviews and music. Its episodes (numbered in the thousands) mix humour with commentary on Iranian politics and Middle East events, including a 'War Room' series, and it describes itself as unaffiliated with any political or religious group. It is distributed via its Shoutcast stream, iOS/Android apps, Spotify, YouTube and Telegram, and is funded by listener donations and Patreon; directories list it as based in Ontario, Canada. It has no terrestrial licence.
