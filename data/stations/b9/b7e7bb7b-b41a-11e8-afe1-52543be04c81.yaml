  notes: '90s90s is a German decade-themed radio brand launched on 29 November 2016 by the private broadcaster Regiocast and funded by advertising. Its main service, 90er Hits, has been carried nationally on the private DAB+ multiplex since 2 January 2023 as well as by livestream, digital cable and locally on DAB+ in Leipzig. Around it sits a large family of channels: a few, such as 90s90s DanceRadio and 90s00s Millennium Radio, are presenter-moderated, while most — including this Eurodance mount — are unmoderated playlist streams covering hip-hop, techno, grunge, house and Britpop. This channel is an automated Eurodance rotation of 1990s club hits by acts such as Snap!, 2 Unlimited, Haddaway and Culture Beat. The 192 kbps MP3 stream is live and the catalogue entry has no homepage set.'
