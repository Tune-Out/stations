  nature: public broadcaster
  operator: RAI — Radiotelevisione italiana S.p.A. (Italian public-service broadcaster), via its regional headquarters Sede Regionale per la Provincia Autonoma di Bolzano
  affiliations: Italian state-owned public broadcaster; member of EBU; serves the German-speaking and Ladin-speaking minorities of South Tyrol under provisions of the Autonomy Statute and the Gruber–De Gasperi Agreement
  audience: German-speaking and Ladin-speaking population of the Autonomous Province of Bolzano/Bozen (South Tyrol); also reaches neighbouring Austrian and German border regions
  format: Full-service German-language public radio with news, culture, sport, regional affairs, and music; includes regular Ladin-language programming segments
  notes: Rai Südtirol is the German-language radio service of RAI in South Tyrol, founded in its modern form when RAI established a dedicated German-language Sender Bozen in the 1960s as part of obligations to the German-speaking minority; programming includes news bulletins (Nachrichten), the morning magazine Guten Morgen Südtirol, cultural and political talk such as Mittagsmagazin and Südtirol Heute, and dedicated Ladin segments produced by Rai Ladinia for the Gherdëina and Badia valleys; it is tagged "regional service" because it operates under RAI's regional Bolzano structure with editorial autonomy from the national Italian-language networks Rai Radio 1/2/3.
  sources: internal knowledge of RAI and the South Tyrolean autonomy regime
