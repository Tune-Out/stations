  operator: Yleisradio Oy (Yle), Finland's national public service broadcasting company
  affiliations: state-owned (owned by the Finnish state, with a parliamentary Yle Council / Hallintoneuvosto providing oversight); editorially independent under the Act on Yleisradio Oy; funded by the Yle tax (yleisradiovero) levied via personal/corporate income tax; EBU member
  audience: Finnish-speaking youth and young adults (target 15-29), nationwide
  format: Contemporary hit radio / alternative pop and rock with strong promotion of new Finnish music; talk, lifestyle and youth-culture programming, live music sessions and interviews
  notes: YleX launched 8 January 2003 as the rebrand and rebranding of Radiomafia (1990) into Yle's dedicated youth music network; mandated to support new Finnish music — features such as YleX Etusivu (front-page rotation playlist), YleX Pop and the YleX Tärkein (most-important song) franchise are formative for emerging Finnish pop and rap acts; broadcasts on FM nationwide plus DAB, internet and Yle Areena; periodic Finnish-language quota debates (YleX historically targets ~25% domestic music) and youth-targeting choices have drawn occasional public commentary; presenters have included Aki Linnanahde, Jenni Pääskysaari and many others; sits within Yle alongside Yle Radio 1, Yle Radio Suomi, Yle Puhe, Yle Vega and others.
