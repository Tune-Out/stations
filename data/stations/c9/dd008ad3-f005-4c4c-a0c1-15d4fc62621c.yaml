  notes: Radio Jamaica 94 FM (RJR 94 FM) traces its history to 1947 as Jamaica's first commercial radio station, originally operated by Radio Jamaica Rediffusion. Headquartered at 32 Lyndhurst Road, Kingston 5, it is the flagship station of Radio Jamaica Limited, which merged with The Gleaner Company in 2015 to form RJRGLEANER Communications Group — the largest media conglomerate in the English-speaking Caribbean. The group also owns Television Jamaica (TVJ), Power 106 FM, Music 99 FM, Hitz 92 FM, and The Gleaner newspaper. Notable shows include "Sunny Side Up" (6-9 AM) and "Hotline" (9 AM-1 PM call-in talk show), reflecting a strong news/talk/current affairs focus.
