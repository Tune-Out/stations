  notes: Capital FM London (95.8 FM) launched 1973 as Capital Radio, one of the UK's first commercial radio stations alongside LBC; acquired by Global Radio (now Global Media & Entertainment) in 2008 and rebranded as the flagship of the national Capital Network. Notable hosts have included Chris Tarrant, Roman Kemp, and many others. Global is also parent to Heart, Smooth, Classic FM, Capital XTRA, LBC, and Radio X — one of the dominant commercial radio operators in the UK.
