  notes: 'Hirschmilch Radio is a German independent electronic-music web radio operating since 2008 that runs eight genre channels: Chillout, Electronic, Hypnotic, Organic-House, Prog-House, Progressive, Psytrance and Techno. The Chillout channel plays smooth downtempo and ambient beats, and the station supplements its channels with presenter-curated shows such as Chill On! (Sundays), Nightcap (Saturdays), Tribuanic Session and Dispatched Minds, republished on SoundCloud and Mixcloud. It carries no advertising and publishes no funding details. The catalog name has a typo (''Chilllout'').'
