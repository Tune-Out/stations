  notes: Deutschlandfunk Kultur (DLF Kultur), based in Berlin's Funkhaus Hans-Rosenthal-Platz, is one of three nationwide programmes of Deutschlandradio alongside Deutschlandfunk (Cologne) and Deutschlandfunk Nova; created in 1994 by the merger of DeutschlandRadio Berlin (formerly RIAS 1 and parts of DS Kultur of the former GDR) and renamed Deutschlandradio Kultur in 2005 and Deutschlandfunk Kultur in 2017; broadcasts 24/7 via FM, DAB+, satellite and streaming, with signature programmes including Studio 9, Lesart, Zeitfragen, Tonart, Kakadu (children's), Religionen, and the long-running Hörspiel (radio drama) slot; operates under the Deutschlandradio-Staatsvertrag (interstate treaty) which obliges it to "umfassend informieren" (provide comprehensive information) free of commercial advertising.
