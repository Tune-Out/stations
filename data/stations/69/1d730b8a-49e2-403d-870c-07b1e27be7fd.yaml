  nature: public broadcaster
  operator: KNKX Public Radio (Pacific Public Media), licensed to Tacoma, Washington
  affiliations: NPR Music partner, member of the U.S. public-radio system; listener-supported
  audience: Global jazz enthusiasts; primarily English-speaking adults; secondary terrestrial signal on KPLU-HD2 88.5 in the Seattle/Tacoma area
  format: 24/7 jazz, blending classic, contemporary, vocal and instrumental jazz with curated playlists, artist interviews and live studio sessions
  notes: Jazz24 began in 2007 as a digital sub-channel of KPLU-FM (now KNKX) and grew into an internet-distributed jazz service with international reach; it survived the 2016 community campaign to keep KPLU independent from the University of Washington's KUOW after Pacific Lutheran University announced a sale - listeners raised over $7 million in 88 days, the largest public-radio fundraising campaign at the time, and the station relaunched as KNKX while preserving Jazz24; programming features the "Living Legends" interview series, KNKX Studio Sessions, NPR Music Tiny Desk content, and historic jazz programming; sustained by listener donations, underwriters and grants.
  sources: https://www.jazz24.org/, internal knowledge
