  notes: Zodiak Broadcasting Station is Malawi's leading private broadcaster, founded in 2005 by journalist Gospel Kazako and headquartered at ArtBridge House in Lilongwe. It is not a subsidiary of the state-owned Malawi Broadcasting Corporation, as the previous notes claimed. More than twenty-five transmitter sites give it national coverage, and roughly sixty percent of output is in Chichewa with further programming in Chitumbuka and English. Its reputation rests on news and current affairs, including the phone-in Tiuzeni Zoona and election reporting, alongside local music and sport, and it now runs television and online news services under the same brand with the slogan "Zikachitika, Mumvera Kwa Ife".
