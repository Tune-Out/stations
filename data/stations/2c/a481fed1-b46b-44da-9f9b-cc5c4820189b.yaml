  notes: Replay News is the catch-all news brand of Groupe Radio Public Santé, a French-language web-radio publisher that originally launched a francophone health/news channel and gradually fanned out into a network of automated rolling-news streams in many languages (Arabic, English, German, Spanish, etc.). The Arabic feed is one of these locale variants; it relies on syndicated wire copy and TTS-style automation rather than original studio reporting, and despite being indexed under Saudi Arabia on radio-browser the operator is based in/around France with primarily European weather and news framing.
