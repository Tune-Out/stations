  nature: commercial
  operator: Seoul Broadcasting System (SBS) - a privately-owned commercial broadcaster controlled by SBS Media Holdings (Taeyoung Group)
  affiliations: none political/religious; SBS is one of South Korea's "big three" terrestrial broadcasters alongside the public KBS and the semi-public MBC
  audience: Korean-speaking general listeners across the Seoul metropolitan area (107.7 MHz) and via networked affiliates and the SBS Gorilla / Mini app nationally and worldwide
  format: Top-40 / contemporary hit radio (K-pop, international pop) with celebrity-DJ talk shows
  notes: SBS Power FM 107.7 MHz launched on 14 March 1991 alongside SBS Love FM as part of the new Seoul Broadcasting System, which was Korea's first privately-owned national commercial broadcaster after the post-Park-Chung-hee opening of the airwaves; Power FM became famous for star-driven music-and-talk shows such as "Cultwo Show" (Cultwo, since 2006, one of the longest-running and highest-rated daytime radio programmes in Korea), "Choi Hwa-jung's Power Time," "Boom's Young Street," "Bae Sung-jae's Ten" and many idol-hosted slots; SBS Media Holdings is part of the Taeyoung Group construction-and-media conglomerate; programming is regulated by the Korea Communications Commission and is funded by advertising rather than the licence fee that supports KBS.
  sources: internal knowledge only
