  nature: public broadcaster
  operator: Radio France (French national public service broadcaster, a société nationale de programme funded primarily by state contribution and overseen by the Arcom regulator)
  affiliations: French Republic / Ministry of Culture (public service mission under the law of 30 September 1986); editorially independent; no religious or political affiliation
  audience: French- and music-loving listeners across France, all ages, with a reputation for sophisticated, eclectic taste; international audience via streaming
  format: Eclectic music station mixing chanson, jazz, world, soul, pop, rock, classical, electronic and film music with minimal speech and the "voix d'or" of female announcers reading short artist/track info between songs; commercial-free
  notes: FIP (originally "France Inter Paris") launched on 5 January 1971 under ORTF as a traffic-and-music service for the Paris region with the famous low-voiced "fipettes" announcers; after the 1974 dismantling of ORTF it became part of Radio France and gradually shed its traffic remit to focus on its signature eclectic, ad-free musical programming; FIP now broadcasts on FM in Paris, Bordeaux, Nantes, Strasbourg, Montpellier, Rennes and other French cities, and through eight thematic webradios (FIP Rock, FIP Jazz, FIP Groove, FIP Pop, FIP Electro, FIP Monde, FIP Reggae, FIP Nouveautés); historically faced threats of closure (notably during 2014 cost-cutting at Radio France) which were reversed after widespread public protest, underscoring its status as a cult French institution; mission consistent with Radio France's public-service charter to inform, educate and provide cultural programming.
