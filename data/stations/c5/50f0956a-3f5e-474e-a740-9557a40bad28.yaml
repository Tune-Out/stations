  notes: 'Radio UdeG (Radio Universidad de Guadalajara) is the public broadcast service of the University of Guadalajara, a major public university in Mexico. Operating from Guadalajara, Jalisco. Station description states: "Radio Universidad de Guadalajara es una propuesta que atiende a diversos segmentos culturales a través de una programación diversa con producciones creativas y originales" (Radio UdeG is a proposal that addresses diverse cultural segments through diverse programming with creative and original productions). Notable programming includes "El Expresso de las 10" show. Part of UDG TV network. Non-commercial educational radio serving university community and broader Jalisco region. Keywords include: el expresso de las 10, radio guadalajara, radio udg, radio universidad, radio universidad de guadalajara.'
