  nature: public broadcaster
  operator: BBC World Service (a division of the BBC, the United Kingdom's national public broadcaster), funded since 2014 primarily through the UK TV licence fee with supplementary UK Foreign, Commonwealth & Development Office (FCDO) grants for specific language services.
  affiliations: UK public-service broadcaster; editorially independent of the UK government per BBC Royal Charter; member of the EBU.
  audience: Nepali-speaking listeners in Nepal, India (Darjeeling, Sikkim, Assam, Bhutan border areas), and the Nepali diaspora worldwide; Nepali language (नेपाली).
  format: News and current-affairs in Nepali — flagship daily radio bulletins, online text/video/audio reporting, podcasts, and short documentaries on Nepali politics, society, regional affairs, and international news.
  notes: BBC Nepali Service was launched on 7 June 1969 by the BBC World Service to broadcast Nepali-language news on shortwave to Nepal, India, and other regions with Nepali speakers. The service produces daily radio bulletins ("Nepali Sewa") that have historically been distributed via shortwave and via partner FM relays in Nepal (such as those run by Kantipur, Image, Nepal FM and others); it also publishes online at bbc.com/nepali. The service has been valued during periods of restricted press freedom (e.g., Maoist insurgency, royal coup of 2005) for independent coverage. Operates under BBC editorial guidelines and a published Royal Charter mandate of impartiality.
  sources: https://www.bbc.com/nepali, internal knowledge only
