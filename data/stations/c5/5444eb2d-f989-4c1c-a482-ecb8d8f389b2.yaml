  notes: 'SWR Kultur, known as SWR2 until 15 April 2024, is the culture channel of Südwestrundfunk (SWR), the ARD public broadcaster for Baden-Württemberg and Rhineland-Palatinate, based in Baden-Baden. It alternates long-form word and music blocks: classical music dominates, joined by jazz, world and experimental music, features (Das Wissen), radio drama, the daily SWR Kultur Forum discussion and live broadcasts from festivals such as the Donaueschinger Musiktage and the SWR Symphonieorchester. It is licence-fee funded and available on FM, DAB+, satellite and online.'
