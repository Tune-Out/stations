  nature: public broadcaster
  operator: Sudwestrundfunk (SWR), a regional ARD public broadcaster serving Baden-Wurttemberg and Rhineland-Palatinate
  affiliations: ARD (Arbeitsgemeinschaft der offentlichen-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland); funded by Rundfunkbeitrag household licence fee; politically independent under German public-broadcasting law
  audience: German-speaking adult listeners interested in classical music, culture, arts, and current affairs in southwest Germany and nationally via DAB+/web
  format: Cultural and classical music network featuring symphonic works, opera, jazz, literature, radio drama, features, and in-depth cultural journalism
  notes: SWR2 is the cultural channel of Sudwestrundfunk, formed in 1998 from the merger of SDR and SWF; rebranded as SWR Kultur in 2024 though the SWR2 stream identity persists; home of long-form features ("Aula", "SWR2 Wissen"), Horspiel radio drama, and live concerts from the SWR Symphonieorchester and SWR Vokalensemble; broadcasts via FM, DAB+, satellite, and online; one of Germany's most respected cultural networks
