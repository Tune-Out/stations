  notes: Part of the Absolut Radio brand operated from Munich (the YAML "state" field "Bayern, Munchen, AAC 128" notes the origin city and stream format). The Absolut Radio family also includes Absolut Radio (the main mainstream pop channel), Absolut Hot, Absolut Top, Absolut Bel Air, Absolut Oldie Classics, Absolut Workout and others. The brand grew out of streaming-only and DAB+ commercial offerings in the 2010s and is one of several specialist webradio bouquets in Germany competing with similar bouquets such as Radio Bob's, Antenne Bayern's spin-offs and Klassik Radio's "Klassik Radio Select". Absolut Relax positions itself as a "lean-back" channel suited to home, spa, work-from-home and yoga contexts.
