  audience: New Zealand 18-39 contemporary-hits radio (CHR) audience; broadcast in English; nationwide on FM plus iHeartRadio and rova app
  format: Mainstream CHR/Top 40 — current chart pop, hip-hop and dance with high-energy presenter talk
  notes: The Edge launched in 1994 as Auckland's first FM CHR station (originally on 94.2) and has grown into one of New Zealand's biggest national networks, operated by MediaWorks (which also runs More FM, The Rock, The Sound, George FM and Mai FM). Its flagship show is "The Edge Breakfast" (Sharyn Casey, Dom Harvey and Randell — line-up has varied), historically the country's most-listened CHR breakfast. The Edge regularly fronts large promotional stunts ("Mission" challenges, weddings, big-money giveaways) and large-scale events such as The Edge Music Awards. MediaWorks is purely commercial (ad-funded) and has no political or religious affiliation; it was acquired by Australian PE firm Quadrant Private Equity in 2020 after several ownership changes (Ironbridge, Oaktree). The Edge TV channel was wound down in 2017 leaving the brand radio-only.
