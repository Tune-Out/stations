  notes: Cable News Network was founded by Ted Turner on 1 June 1980 in Atlanta, Georgia as the first 24-hour all-news television channel. Acquired by Time Warner in 1996, became part of AT&T (WarnerMedia) in 2018, then spun into Warner Bros. Discovery in April 2022 after the Discovery merger. Headquarters at the CNN Center in Atlanta and Hudson Yards in New York. Notable programs include "Anderson Cooper 360", "The Lead with Jake Tapper", "Amanpour", and the "CNN Newsroom" rolling-news block. CNN has faced criticism from across the political spectrum, including former US President Donald Trump's repeated "fake news" attacks; in 2022 a brief streaming venture CNN+ was launched and shut down within a month under new Warner Bros. Discovery leadership, and the network underwent staff cuts and an editorial repositioning under CEOs Chris Licht (2022-2023) and Mark Thompson (from 2023). The HTTP 451 response code observed when fetching cnn.com from this client suggests geographic legal blocking from the request region.
