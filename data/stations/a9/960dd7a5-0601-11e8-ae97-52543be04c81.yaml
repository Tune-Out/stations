  audience: Adult album-oriented music fans across the Greater Philadelphia/Delaware Valley region and worldwide via streaming
  format: Non-commercial Adult Album Alternative (AAA) public radio mixing rock, folk, blues, soul, and singer-songwriter music
  notes: Licensed to the University of Pennsylvania on 88.5 FM in Philadelphia, WXPN traces back to 1945 as a student station and is widely credited as the pioneer of the Adult Album Alternative format; it produces the nationally syndicated World Cafe (originated by Dave Marsh and David Dye in 1991), the Free At Noon live concert series at its World Cafe Live venue, the Kids Corner children's show (long hosted by Kathy O'Connell, a Peabody Award winner), and the annual 24-Hour Song Challenge; the station is listener-supported and has won multiple Marconi awards as Non-Commercial Station of the Year.
