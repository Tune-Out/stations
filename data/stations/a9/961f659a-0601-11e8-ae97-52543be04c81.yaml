  notes: Radio 80 is a Padova-based commercial station operated by O-SPHERA S.R.L., with advertising handled exclusively by Trend Comunicazione. Its entire output is devoted to the 1980s — it describes itself as a station for reliving "i successi musicali, le mode e le aspirazioni dei mitici anni 80" — mixing Italian and international pop, italo disco and dance. Beyond the rotation it produces named specialist programmes including Afro Tour, On The Road Again, Disco D.O.C., Funkytown and Balla 80, and it runs a companion webradio Radio 80 Afro and a television channel, 80 TV. It broadcasts on FM across parts of north-east Italy and streams online with iOS and Android apps. The distinctive, genuinely themed programming argues for a better score than the near-zero it previously carried.
