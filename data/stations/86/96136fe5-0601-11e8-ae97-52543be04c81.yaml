  notes: 'Jazz Radio is a French commercial jazz station based in Lyon, launched on 10 January 1996 as Fréquence Jazz by Christophe Mahé, the first French station to broadcast jazz around the clock. It is owned by Espace Group, an independent Lyon-based radio group founded in 1987 that also runs Générations, Virage Radio, Alpes 1 and M Radio. Jazz Radio broadcasts on roughly 45 FM frequencies across France and Monaco (97.3 MHz in Lyon, 92.8 in Marseille) and online, with a format of jazz and soul plus funk, blues, lounge, Latin jazz and gospel, complemented by dozens of themed web streams. Tagline: ''La radio de tous les jazz''.'
