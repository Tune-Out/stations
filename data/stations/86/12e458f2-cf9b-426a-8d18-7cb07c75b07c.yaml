  notes: Independent internet radio platform specializing in synthwave and adjacent electronic genres, operated under the Rekt.Network umbrella; offers eight distinct streams — Nightride FM (Synthwave/Retrowave/Outrun), Chillsynth FM (Chillwave/Instrumental), Datawave FM (Glitchy Synthwave/IDM), Spacesynth FM (Space Disco/Vocoder Italo), Darksynth (Cyberpunk/Synthmetal), Horrorsynth (Witch House), EBSM (Industrial/Clubbing) and Archives (recorded live shows); features live DJ sets, artist interviews and livestream concerts with a community-focused chat, Discord server and Android app; promotes itself with the tag "Tune in to high-quality, 320kbps electronic music" and provides "Stream Safe Music" licensing resources for streamers/creators; no advertising, governmental, religious or political affiliation; supported by listener donations and merchandise.
