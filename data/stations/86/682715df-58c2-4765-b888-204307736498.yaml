  format: Mixed music and talk; African music, Angolan rhythms (including older "flashback" repertoire), salsa, and "samba"; magazine-style "NO AR" news segments and live "Locutor Online" DJ shows
  notes: Self-described as "Nostalgia Atualizada" ("Updated Nostalgia"), blending Angolan musical heritage with contemporary news and cultural content; web-only streaming station with global internet reach; appears to be a small independent operation rather than a licensed FM broadcaster, fitting the Angolan context where the state-owned Rádio Nacional de Angola dominates terrestrial broadcasting and private stations such as Rádio Mais, Rádio Despertar and LAC operate alongside community web initiatives
