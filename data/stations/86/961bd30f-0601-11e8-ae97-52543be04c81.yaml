  notes: HR 3 (Treći program) is the culture and arts channel of Hrvatski radio, the radio arm of Croatian public broadcaster HRT, funded by the Croatian licence fee. It concentrates on classical music, contemporary art, radio drama (Radio drama, Radio roman), Croatian composers (Iz hrvatske glazbe), science and heritage programmes, and broadcasts festivals such as the Osor Musical Evenings. It is available on FM across Croatia and via HRT's online Slušaonica player.
