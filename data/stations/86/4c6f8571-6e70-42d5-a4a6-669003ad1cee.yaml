  nature: commercial
  operator: Radio Mediterranee Internationale (Medi 1), owned by Compagnie Internationale de Radio et Television (CIRT) - parent group Medi1 Group / SAPRESS
  affiliations: long-standing Moroccan-French bilateral broadcasting venture; close to the Moroccan state (Kingdom of Morocco) and historically part-owned by French interests (CIRTEF / SOFIRAD)
  audience: French- and Arabic-speaking listeners across the Maghreb (Morocco, Algeria, Tunisia, Mauritania, Libya) and southern Europe; webradio classique channel targets classical-music listeners worldwide
  format: Thematic web-only spin-off of Medi 1 dedicated to Western classical music (symphonies, opera, chamber and solo repertoire); non-stop curated classical programming without news/talk bulletins.
  notes: Medi 1 (Radio Mediterranee Internationale) was founded in 1980 in Tangier under a Franco-Moroccan agreement as a transnational Maghreb broadcaster; its powerful long- and medium-wave signals plus FM relays cover the entire Maghreb and parts of southern Europe, and it is one of the most influential private radio brands in North Africa; while editorially independent, ownership and licensing tie it closely to the Moroccan state and French public-broadcasting partners, and its bilingual French/Arabic news service has been a regional reference for decades; "Medi 1 Classique" is one of several thematic web-radio streams (alongside Sawa, Maghreb, Variety, Sport, etc.) operated from medi1.com, offering 24/7 commercial-free classical music as a sister brand to the main news/talk channel.
