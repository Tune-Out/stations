  notes: ラジオ石巻 (Radio Ishinomaki, 76.4 MHz, callsign JOZZ2AB-FM) is a community FM station serving the city of Ishinomaki in Miyagi Prefecture, northeast Japan; founded in 1999, it became internationally known after the 2011 Great East Japan Earthquake and tsunami, when it remained on air to provide critical disaster, shelter and missing-persons information to one of the worst-affected cities, and continued recovery-coverage programming for years afterward; it is one of roughly 300+ "コミュニティ放送" (community broadcasting) stations licensed under Japan's Radio Act and supported by the municipality as a disaster-prevention partner; the "4 / 76" tags in the data refer to the 76.4 MHz frequency, and "superradio.cc" hosts its streaming portal.
