  notes: The Big 80s Station is a US internet-only radio channel streaming 1980s hits 24/7, with the tagline 'Playing the Big Hits from the Big City' and the claim that it is 'programmed by the people who were on your radio back in the day'. The WordPress site gives no ownership, location or founding details; directories list it as New York-based. It streams at 128 kbps via an OVH-hosted server (158.69.114.190) and is carried on TuneIn, myTuner and Online Radio Box. It is a modest independent nostalgia stream with no terrestrial presence.
