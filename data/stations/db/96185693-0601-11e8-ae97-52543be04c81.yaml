  notes: Rai Radio 1 is the flagship news and talk channel of RAI, Italy's state-owned public broadcaster, and the direct descendant of the country's first radio service, which began transmitting from Rome on 6 October 1924 under URI and was nationalised as EIAR in 1927. It broadcasts nationally on FM, DAB+, satellite and RaiPlay Sound, carrying the GR1 news bulletins, current-affairs programmes, live sport such as 'Tutto il calcio minuto per minuto', and talk with some popular music. RAI is funded by the licence fee plus limited advertising under a public-service contract with the Italian state and is an EBU member. The station has carried the names Programma Nazionale and Radio Uno before its current branding.
