  notes: M Radio is a French commercial private music radio launched in 2010 (originally as MFM Radio, renamed M Radio in 2017) and operated by Espace Group, a Lyon-based independent broadcaster that also runs Génération FM, Virage Radio and Jazz Radio; it specializes in French-language popular music and is distributed on FM in cities including Paris, Lyon, Marseille, Nice/Côte d'Azur, Clermont-Ferrand and Aix-en-Provence, on DAB+ across France and via web/mobile apps with themed sub-streams (decade channels, artist channels like "M Radio Johnny", "M Radio Goldman", "M Radio Céline Dion", plus lifestyle webradios), and partners with TV talent shows such as Star Academy.
