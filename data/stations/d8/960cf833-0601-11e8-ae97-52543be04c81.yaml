  notes: Groove Salad is the flagship channel of SomaFM, the listener-supported, commercial-free internet radio broadcaster founded by Rusty Hodge in San Francisco in February 2000 after a micropower broadcast at Burning Man in 1999. Described as 'a nicely chilled plate of ambient/downtempo beats and grooves', it is programmed by Hodge himself and is SomaFM's most listened-to stream. SomaFM runs more than 30 hand-curated channels funded entirely by donations and merchandise, and was a prominent voice for small webcasters during the 2000s SoundExchange royalty disputes. This entry is the 128 kbps MP3 feed; AAC, 256 kbps and FLAC HLS variants also exist.
