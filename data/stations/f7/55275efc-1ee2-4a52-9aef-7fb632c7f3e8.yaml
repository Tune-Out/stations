  notes: Radio MAXIMUM is a Ukrainian national commercial music station operating under the slogan "Максимум життя". In its current form it launched on 10 March 2017 as a rebrand of Radio 24, and it belongs to the Lviv-based TRK Lux media holding, which also runs the 24 Kanal news channel and Lux FM. It broadcasts an adult contemporary format in Ukrainian across 14 regions on FM, including 94.2 MHz, plus online streaming and an on-demand portal with programme archives and playlists. Several transmitters have gone dark in cities under Russian occupation, among them Dniprorudne, Sevastopol and Tokmak.
