  nature: public broadcaster
  operator: Hessischer Rundfunk (HR) – the public-broadcasting institution of the German federal state of Hesse, based in Frankfurt am Main; member of the ARD federal network and funded by Germany's Rundfunkbeitrag household licence fee.
  affiliations: ARD member; constitutionally independent of government and political parties under Germany's public-broadcasting law; governed by HR's broadcasting council (Rundfunkrat) representing civil society.
  audience: German-speaking adults in the southern Hesse region (Südhessen) around Darmstadt and the Rhine-Main area; the wider hr1 service targets listeners aged roughly 40-60.
  format: Regional split of HR's flagship adult-contemporary network hr1 carrying tailored news, traffic and weather inserts for southern Hesse; mainstream AC mix of soft pop/rock hits from the 1970s-2000s alongside in-depth news, magazine features, talk and cultural programming.
  notes: hr1 traces its lineage to HR's first radio service launched in the late 1940s under the post-war Allied broadcasting reorganisation; the modern hr1 format was relaunched in 2004 as a "Hörfunk für aktive 40- bis 60-Jährige" with focus on quality journalism and adult contemporary music; the "Südhessen" feed is one of several regional opt-out streams (alongside Mittel- and Nordhessen) used to localise news, traffic and regional reporting; flagship shows include the "hr1 Sonntagsgespräch" interview and "Der Tag" current-affairs slot; broadcast via FM, DAB+ and online.
