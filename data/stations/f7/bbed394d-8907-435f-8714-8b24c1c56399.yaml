  notes: Café Romántico Radio is an online-only Spanish-language station that has been streaming since 2012 as part of Grupo Digital Retroland, a Monterrey, Nuevo León operator that runs several themed retro channels including Cumbias Inmortales. Its format is romantic Spanish-language ballads from the 1960s through the late 1990s mixed with classic instrumental hits. Listeners can request songs through the website, subject to rules limiting one request per 30 minutes and blocking repeats of the same artist within two hours. The service is free and funded by voluntary PayPal donations rather than advertising, and is distributed through its own Android app and the usual radio aggregators. The 96 kbps AAC stream on the Retroland panel is live.
