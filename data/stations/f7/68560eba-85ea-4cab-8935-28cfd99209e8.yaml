  notes: SWR1 Rheinland-Pfalz is the Rhineland-Palatinate regional version of SWR1, one of two adult-oriented hit-and-information channels of Südwestrundfunk (the other being SWR1 Baden-Württemberg); SWR itself was created in 1998 by the merger of Süddeutscher Rundfunk (SDR) and Südwestfunk (SWF) and is headquartered in Stuttgart, Baden-Baden, and Mainz, with the Mainz site producing the RP service; flagship programmes include the long-running annual "SWR1 Hitparade" voted by listeners and morning-magazine "Der Morgen"; as a public broadcaster it is mandated to provide balanced regional news and culture, financed by the household licence fee collected via the Beitragsservice (formerly GEZ).
