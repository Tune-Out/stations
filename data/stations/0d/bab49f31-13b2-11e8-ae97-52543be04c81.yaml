  nature: public broadcaster
  operator: Nederlandse Publieke Omroep (NPO) — Dutch public broadcasting umbrella, funded by the state budget; programming supplied by member broadcasters incl. KRO-NCRV, BNNVARA, NTR, AVROTROS
  affiliations: NPO is a public-law foundation accountable to the Dutch Media Act and the Commissariaat voor de Media; KRO-NCRV is rooted in Catholic and Protestant traditions but the 3FM service itself is non-denominational
  audience: Dutch youth and young adults (roughly 20-35), Dutch language, the Netherlands and Caribbean Netherlands
  format: Contemporary hit / alternative pop-rock youth network — current chart, indie, dance, "3FM Talent" emerging-artist showcase; slogan "We Want More"
  notes: NPO 3FM launched in 1985 as "Radio 3" (its lineage goes back to Hilversum 3, 1965), rebranded 3FM in 1995 and prefixed "NPO" in 2014; broadcasts on FM, DAB+ and online; signature events include the annual "3FM Serious Request — The Lifeline" charity marathon for the Red Cross (3FM DJs go on a fast in a glass studio), Radioloog, and the "3FM Awards"; like other NPO channels it has faced years of audience erosion to commercial youth-oriented stations and successive format relaunches; editorial independence from government is legally protected but funding is set by parliament.
  sources: https://www.npo3fm.nl/, internal knowledge
