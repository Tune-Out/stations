  notes: Rádio Patria (Pátria Rádió) is the national-minority channel of Slovakia's public broadcaster, now named STVR (Slovenská televízia a rozhlas, formerly RTVS). Launched in 2000, though minority broadcasts date to 1928, it airs Hungarian-language programming in the afternoons and Ukrainian/Ruthenian in the mornings, with rotating Romani, Czech, German and Polish slots, on FM, DAB+ and online from 06:00 to 18:00. Hungarian-language strands include the morning show 'Reggeli', 'Nappali', 'Napzárta' and cultural discussion programmes; its website moved to patria.stvr.sk after the 2024 rebrand.
