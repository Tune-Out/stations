  notes: 'En Lefko 87.7 ("In White" / "Off the Record" in Greek) is a long-running Athens alternative music station founded in 1995. Self-described as "Ο Νο. 1 εναλλακτικός ραδιοφωνικός σταθμός της Αθήνας" (The No. 1 alternative radio station of Athens). Operated by Frontstage SA, which also runs HiT 88.9, Melodia 99.2, and RED 96.3 in the Athens commercial radio market. Broadcasts on 87.7 FM in Attica with digital streaming. Site tagline: "Discover Great Music." Known for cultivating Greek indie/alternative scene and showcasing emerging artists.'
