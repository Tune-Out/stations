  notes: P8 Jazz is one of the main thematic channels operated by DR (Danmarks Radio), Denmark's national public broadcaster established in 1925. P8 Jazz dedicates itself entirely to jazz and related improvisational music, serving as a curator of Danish and international jazz traditions. DR operates under a public broadcasting mandate similar to other Nordic public broadcasters (SVT in Sweden, NRK in Norway, YLE in Finland) and is governed by a board appointed by the Danish Parliament. P8 Jazz streams at 128 kbps MP3 via DR's CDN infrastructure. The station has deep historical connections to Danish jazz culture and supports the Copenhagen Jazz Festival and other jazz initiatives.
