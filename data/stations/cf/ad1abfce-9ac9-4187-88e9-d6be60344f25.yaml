  nature: state media
  operator: All India Radio (AIR) / Akashvani, the national public broadcaster operated by Prasar Bharati, an autonomous public service broadcasting corporation set up by the Government of India under the Prasar Bharati Act 1990
  affiliations: Government of India (Ministry of Information & Broadcasting funds Prasar Bharati); statutory public broadcaster; no party, religious or commercial affiliation, though programming follows government public-information mandates
  audience: Kannada-speaking listeners in Bengaluru (Karnataka) and across India / diaspora online; broadcast in Kannada with national Vividh Bharati commercial-style entertainment content
  format: Vividh Bharati is AIR's national light-entertainment service, broadcasting film music (Hindi and regional, including Kannada film songs in this Bengaluru relay), request shows, sponsored programmes and light features
  notes: The Vividh Bharati Service was launched on 3 October 1957 to compete with Radio Ceylon's popular Hindi film music broadcasts that were drawing listeners away from AIR; the Bengaluru (Bangalore) Vividh Bharati station broadcasts on 102.9 MHz FM and is one of more than 40 Vividh Bharati Kendras across India; Vividh Bharati was India's first commercial radio service (introduced advertisements in 1967) and remains a major revenue earner for Prasar Bharati while still classified as part of the public broadcaster; the Bengaluru kendra carries the national Vividh Bharati feed with local Kannada-language inserts; stream URL is AIR's official HLS push from its national CDN
  sources: internal knowledge of All India Radio, Prasar Bharati and Vividh Bharati Service (no station homepage on file)
