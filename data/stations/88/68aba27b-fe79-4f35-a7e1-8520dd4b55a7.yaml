  notes: XEB-AM 'La B Grande de México' on 1220 kHz is Mexico's oldest surviving radio station, first signed on 14 September 1923 as CYB by the cigarette company El Buen Tono, and owned since 1983 by the Instituto Mexicano de la Radio (IMER), the federal public radio institute now under the Secretaría de Cultura. A 100 kW Class A station serving greater Mexico City, it also simulcasts on 94.5 FM HD2 (XHIMER-FM) and 89.1 HD2 (XHCAH-FM). Its commercial-free format, 'Con la Música de México', preserves boleros, rancheras, trios and Mexican popular music of the 1940s-70s alongside cultural programming.
