  operator: Instituto Mexicano de la Radio (IMER), a decentralised Mexican federal public broadcasting body
  affiliations: Mexican federal government (formerly under Secretaría de Gobernación, now under the Secretaría de Cultura); editorial obligations defined by Mexico's Ley Federal de Telecomunicaciones y Radiodifusión
  audience: Adult Mexican listeners in CDMX, Estado de México, Puebla, Morelos, Hidalgo, Guerrero and Veracruz; Spanish-speaking
  format: Mexican traditional music — romantic ballads, bolero, ranchera, son and música mexicana tradicional — with cultural news segments and orientation programming
  notes: XEB-AM (1220 kHz, simulcast on 94.5 FM HD2) is described by IMER as "la emisora de radio más antigua de México" — Mexico's oldest surviving radio station, first transmitting in September 1923 under the Compañía Cigarrera "El Buen Tono"; nicknamed "La B Grande de México" by broadcaster Alejandro Rodríguez Morán around 1960; nationalised and folded into IMER when the federal radio institute was created in 1983; mission is to preserve and promote traditional Mexican music heritage with the tagline "Con la Música de México"; 100% public-sector commercial-free format.
  sources: https://www.imer.mx/xeb/, internal knowledge of IMER
