  nature: public broadcaster
  operator: SRG SSR (Schweizerische Radio- und Fernsehgesellschaft) — Switzerland's national public broadcasting corporation; Radio Swiss Jazz sits in the SRG SSR portfolio alongside Radio Swiss Classic and Radio Swiss Pop
  affiliations: Public-service media; funded primarily by the Swiss household media licence fee (Serafe), supplemented by limited commercial revenue; no religious or political affiliation
  audience: Swiss jazz listeners and international online audience; multilingual interface (German, French, Italian, English) reflecting Switzerland's linguistic regions
  format: 24/7 non-stop jazz — classic and contemporary jazz with minimal voice tracking, song titles displayed on website / metadata
  notes: Radio Swiss Jazz launched in 2007 as part of SRG SSR's portfolio of specialized commercial-free music channels; it succeeded earlier SRG SSR jazz experiments and complements the longer-established Radio Swiss Classic (1996) and Radio Swiss Pop (1999); distributed primarily via DAB+, internet streaming and cable across Switzerland; the station is curated by SRG SSR jazz editors and is notable for its largely automated, presenter-light format that lets the music speak for itself; SRG SSR is a non-profit private-law association whose mandate is anchored in Swiss federal law and the Federal Constitution.
  sources: https://www.radioswissjazz.ch/de/
