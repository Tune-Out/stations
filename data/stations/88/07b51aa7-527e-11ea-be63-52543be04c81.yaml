  notes: Radio Studio Più is an Italian commercial dance station operated by Radio Studio Più S.r.l., branded "La Dance Station d'Italia". It broadcasts on FM across Lombardy and neighbouring northern Italian provinces and streams online with region-selectable feeds. The format is house, EDM and dance-pop with DJ-led shows, club tie-ins, live outside broadcasts and an on-demand podcast archive, and it is funded by advertising. The operator also runs the seasonal Studio Più Ibiza stream tied to the Balearic club scene and the oldies sister brand Radio 607080. The website was live and actively updated at review time, but the Shoutcast mount recorded for this entry (77.241.4.100:8020) did not serve audio, so the specific stream URL in the catalog appears stale even though the station itself is on air.
