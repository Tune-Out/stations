  format: Regional variant of VRT Radio 2 with local news, traffic, weather and lifestyle programming alongside the national Radio 2 schedule of mainstream Dutch and international pop/oldies
  notes: VRT Radio 2 is Belgium's most-listened-to radio station and the flagship adult-contemporary network of the Flemish public broadcaster; Vlaams-Brabant is one of five provincial editions (the others being Antwerpen, Limburg, Oost-Vlaanderen and West-Vlaanderen) that share the national programming for most of the day but break out for regional news and the daily "Start Je Dag" / "Radio 2 Regio" inserts; VRT is funded primarily by a Flemish Community government grant defined in a multi-year management contract.
