  operator: Primedia Broadcasting (Primedia Group), a major South African commercial media company; CapeTalk shares its newsroom with sister station 702 in Johannesburg
  affiliations: National Association of Broadcasters of South Africa; regulated by ICASA; no political or religious affiliation, though the station is widely regarded as centrist / liberal in editorial outlook
  audience: English-speaking adult LSM 8-10 audience in greater Cape Town and the Western Cape; affluent, urban, news-driven
  format: News, talk and adult-contemporary — current affairs interviews, business news, traffic, sport (Cape Town sport), drive-time talk shows and weekend lifestyle programming
  notes: CapeTalk broadcasts on 567 kHz AM from Cape Town and is the Cape sister to Johannesburg's 702; it carries simulcast national programming with Primedia stablemate 702 (notably John Maytham's afternoon drive in earlier years, and shared shows like The Money Show with Bruce Whitfield); Primedia Broadcasting also owns 947, Kfm 94.5 and Eyewitness News (EWN), which provides CapeTalk's news content; the station has been a notable platform for political commentary, business interviews and public-interest journalism in post-apartheid South Africa
