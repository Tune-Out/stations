  nature: public broadcaster
  operator: Radio France (the French national public radio company, established 1975, wholly state-owned)
  affiliations: French state (Radio France is a societe nationale de programme under French audiovisual law); funded historically by the redevance audiovisuelle (abolished 2022) and now by direct state budget allocation; editorially independent under the law but periodically criticised for perceived political leanings
  audience: French-speaking general adult audience nationwide and in francophone territories; among the largest radio audiences in France
  format: Generalist talk and music network with news, debate, political and cultural magazine programs, comedy, music sessions, and live cultural events
  notes: "France Inter traces back to the 1947 launch of Paris Inter and became France Inter in 1963; flagship Radio France station and frequently France's #1 radio station by audience share; iconic programs include the \"7/9\" morning show (long anchored by Patrick Cohen, Nicolas Demorand, then Leila Kaddour and Nicolas Demorand), \"La Bande Originale\", \"Le Masque et la Plume\", \"L'Heure Bleue\" with Laure Adler, and the nightly humorist slots; broadcasts on FM nationwide, DAB+, longwave (162 kHz, ceased 2017), satellite, and web; the station is sometimes accused by the right of being left-leaning, a recurring debate in French media politics"
