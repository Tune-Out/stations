  operator: Operated by Mahaka Radio Integra (MRI) / Mahaka Group, the same group that runs Jak FM, MOST Radio and other Indonesian commercial stations; in recent years Gen FM has been part of the Noice / Mahaka X digital-audio platform (stream host points to noice_genfm).
  affiliations: none known; no stated religious, governmental or political affiliations.
  audience: Young urban listeners (roughly 15-29) in the Jakarta metropolitan area; Indonesian-language; tagline "Radio No. 1 di Jakarta".
  format: 'Contemporary hit radio (CHR) skewed to Indonesian pop and current Top 40, with talk segments and entertainment news; daily shows include TULALIT - SIANG, DJ SORE, OTW MALAM, PAP - PAGI / PAP - SIANG and GEN ON TALK, plus the GANAS music chart, the "Salah Sambung" podcast and the #GENONTRACK live-performance video series.'
  notes: Gen FM was launched on 9 August 2007 by the Mahaka Media group and quickly became one of Jakarta's top-rated music stations on 98.7 MHz, frequently topping Nielsen Radio Audience Measurement (RAM) ratings in DKI Jakarta; a sister Gen FM Surabaya operates on 103.1 MHz; in 2021 Mahaka folded Gen FM's on-demand content into the Noice audio app; studios are at Menara Imperium in South Jakarta.
  sources: https://gen987fm.com/, internal knowledge of Indonesian commercial radio and Mahaka Radio Integra
