  nature: commercial
  operator: Classic.nl B.V. (independent Dutch private company); founded and led by entrepreneur Frans Eras after acquiring the Classic FM Nederland brand assets from the former Sky Radio Group portfolio
  affiliations: none — independent commercial classical brand; no religious, political or governmental ties
  audience: Dutch classical-music listeners nationwide, plus a Flemish and international diaspora audience via the web and app
  format: 24/7 classical, opera and film-soundtrack music across themed streams ("Premium", "Mind Radio", "Opera", "Soundtracks"), plus a podcast, concert agenda, children's section and editorial content — all positioned as "Non-stop de mooiste klassieke muziek voor iedereen"
  notes: Classic.nl is the successor brand to Classic FM Nederland, the Dutch classical FM station that lost its FM frequency in the 2003 zero-base licence allocation and migrated to internet/DAB+; relaunched and rebranded as Classic.nl in the late 2010s, it operates a freemium model with an ad-supported free tier and an ad-free "Premium" subscription marketed as "Klassieke muziek luisteren zonder reclame"; today it is one of the largest dedicated classical platforms in the Dutch-speaking world, distributing via web, smart-speaker, mobile app and DAB+ in parts of the Netherlands.
  sources: https://classic.nl/, internal knowledge
