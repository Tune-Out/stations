  notes: 'FluxFM 70s (Der 70er Channel) is a presenter-free web channel of FluxFM, a private commercial radio station based in Berlin (100.6 MHz) that grew out of Motor FM, founded in 2004, and was rebranded in 2011. The main station is an indie, electronic and pop-culture format run by Plattform für regionale Musikwirtschaft GmbH; its family of web channels includes decade streams such as 70s and 80s, and this one plays 1970s rock, pop, soul and disco hits around the clock. The earlier ''non-commercial, community-supported'' classification was wrong: FluxFM is ad-funded private radio.'
