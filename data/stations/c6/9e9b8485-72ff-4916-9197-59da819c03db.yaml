  operator: Olive Suno Radio Network (Qatar) — sister station of Radio Olive
  affiliations: none known (private commercial expatriate-targeted broadcaster licensed in Qatar)
  audience: Malayalam-speaking Keralite diaspora in Qatar (and online globally); listeners across the Gulf
  format: Malayalam-language entertainment, film music (Mappila / classical / contemporary), talk, devotional content, and community programming for the Kerala expatriate population
  notes: Despite being catalogued under India here, Radio Suno 91.7 is actually broadcast from Doha, Qatar, billed as the first Malayalam FM radio station aired from the State of Qatar and operating under the Olive Suno Radio Network alongside the Hindi/English-leaning Radio Olive; the network claims an audience of more than 1.6 million across the Gulf and uses the tagline "Kettu Kettu Kootu Koodam" (loosely "Listen and gather together"); programming is shaped around the large Kerala migrant workforce in Qatar.
