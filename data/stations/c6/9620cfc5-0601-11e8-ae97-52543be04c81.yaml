  operator: Radino GmbH / Mein Kinderradio, Vienna, Austria
  affiliations: none known; partnerships with Austrian child-safety initiatives such as HELMI (road-safety programmes)
  audience: Children (roughly 3–12) and their families in Vienna and Austria, with some reach into Germany; German-language
  format: Children's full-service radio — age-appropriate pop music, audio dramas, educational segments, safety and digital-literacy features, and interactive listener call-ins
  notes: Mein Kinderradio launched in Vienna with FM/DAB+ broadcasting (Wien 103.2 MHz, DAB+ in Mux Wien) and built a national footprint via DAB+ and streaming; signature programmes include "RADINOs Werkstatt" (crafts), "Aufgepasst mit HELMI und RADINO" (road-safety), "RADINOs bare Münze" (financial literacy), "RADINOs Internet ABC" (digital literacy) and the daily "Minidisco" (4–6 PM); the station emphasises listener participation ("Auf RADINOs Pinnwand können Kinder aus ganz Österreich nette Nachrichten hinterlassen") and is one of the few dedicated children's radio brands in the German-speaking market.
