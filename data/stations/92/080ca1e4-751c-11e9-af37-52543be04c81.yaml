  notes: Qingdao Economics Radio (青岛经济广播) broadcasts on FM 102.9 and AM 1251 in Qingdao, Shandong province, and went on air on 1 March 1993. It is one of several radio channels of Qingdao Radio and Television (青岛广播电视台), a public institution directly subordinate to the Qingdao municipal government. Output is business news, consumer and lifestyle programming in Mandarin. It is a routine local service channel rather than a news or propaganda outlet.
