  operator: Israel Defense Forces (IDF) — operated under Galei Tzahal / "Galatz"
  affiliations: Israel Defense Forces (the Israeli military); ultimately accountable to the Israeli Ministry of Defense
  audience: Mainstream Israeli adults and young adults, drivers and commuters (the name means "Army Radio Waves"); Hebrew-speaking
  format: Contemporary hits / adult contemporary music with frequent traffic, weather and news updates; among Israel's most-listened-to music stations
  notes: Galgalatz (גלגלצ) was launched in 1993 as the music sister-station to Galei Tzahal (the IDF's main news/talk station founded 1950); programmed for drivers — name combines "galgal" (wheel) and "Galatz" — with a heavy rotation of Israeli and international pop/rock and a strict editorial policy against playing songs by artists deemed to support boycotts of Israel; staffed by a mix of IDF soldiers serving their conscription and civilian broadcasters; despite military ownership it is independent in tone and has launched the careers of many leading Israeli musicians and broadcasters; periodic political debates have called for privatization or closure.
