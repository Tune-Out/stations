  nature: commercial
  operator: Médi1 (Radio Méditerranée Internationale), operated by parent company SOREAD (later Médi1 Group / Société d'Études et de Réalisations Audiovisuelles)
  affiliations: Historically a Franco-Moroccan joint venture (originally CFI/French interests with Moroccan state); ownership has been progressively Moroccanised, with FinanceCom (Othman Benjelloun's group) and Moroccan state investors as principal stakeholders
  audience: Arabic-speaking listeners across the Maghreb (Morocco, Algeria, Tunisia, Libya, Mauritania) and Arabic diaspora in Europe; this stream targets fans of classical/traditional Arabic music
  format: '"Tarab" thematic web stream — classical Arabic and Maghrebi music (tarab is the term for the emotional rapture induced by classical Arabic music; repertoire includes Egyptian, Levantine, and Maghrebi standards by Umm Kulthum, Abdel Halim Hafez, Farid al-Atrash, Fairuz, etc.)'
  notes: Médi1 was founded in 1980 in Tangier as a bilingual French-Arabic medium-wave/FM broadcaster, conceived as a French-Moroccan diplomatic project to project soft power across the Maghreb; the main station broadcasts news, current affairs, and music in Arabic and French and operates several themed webradios including Tarab; widely regarded as influential in shaping Maghreb media opinion; sister TV channel Médi1 TV (formerly Médi1 Sat) launched in 2006.
