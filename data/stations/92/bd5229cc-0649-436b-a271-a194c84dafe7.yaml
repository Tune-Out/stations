  notes: WTAM is a 50,000-watt clear-channel AM station on 1100 kHz in Cleveland, Ohio, on the air since 26 September 1923 and owned by iHeartMedia. It runs a news/talk and sports format branded Newsradio WTAM 1100, with a local Bill Wills morning show and syndicated Premiere programming, and simulcasts on FM translator W295DE 106.9. The station is the broadcast home of the Cleveland Guardians and Cleveland Cavaliers and serves as Northeast Ohio's primary entry point for the Emergency Alert System.
