  notes: Antenne Bayern began broadcasting in 1988 as Bavaria's first private statewide radio station and grew to become one of Germany's most-listened commercial radio stations; headquartered in Ismaning near Munich; shareholders historically include a consortium of Bavarian newspaper publishers (Verleger-Gemeinschaft) alongside Müller Medien, reflecting a model under Bavarian media law that mandates publisher participation in commercial radio; the station runs a portfolio of digital sub-brands (Rock Antenne, Antenne Bayern Oldies but Goldies, etc.) via the wider Antenne Bayern Group; programming is mainstream AC with star hosts and large promotional contests, with regular news bulletins from a substantial in-house newsroom.
