  notes: Rádio Regina Východ is the eastern regional branch of Slovakia's public radio Regina network (alongside Západ and Stred regional studios), broadcasting from Košice; in 2025 the parent organisation RTVS was reorganised by the Slovak government into STVR (Slovak Television and Radio), a politically controversial restructuring; programming celebrates eastern-Slovak heritage and includes signature shows like "Hudobné pozdravy" (Musical Greetings), regional folk competitions such as "Košický zlatý poklad," and coverage of the centenary "100 rokov košického rozhlasu."
