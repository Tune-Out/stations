  notes: RMC (Radio Monte-Carlo) is a French-Monégasque commercial talk radio founded on 1 July 1943 and a founding member of the EBU; its studios are in Paris and it airs on 103.1 FM in Paris and nationwide FM/DAB+. Repositioned in 2002 as an "info, talk, sport" station, it is known for opinion-driven shows such as Les Grandes Gueules and Apolline Matin and for extensive football coverage (After Foot). Formerly part of Patrick Drahi's Altice Media, the RMC BFM group was sold to the shipping company CMA CGM for about €1.55 billion in 2024 (Arcom approval June 2024). RMC posted a 4.8% audience share in the April-June 2026 Médiamétrie wave, ahead of Europe 1, and remains the group's most profitable asset. The catalog favicon points to a third-party blog image.
