  nature: state media
  operator: Radio Free Europe / Radio Liberty (RFE/RL), a US Congress-funded broadcaster supervised by the US Agency for Global Media (USAGM)
  affiliations: US federal government (USAGM); designated a "foreign agent" and later an "undesirable organization" by the Russian Federation
  audience: Russian-speaking audiences inside Russia and the diaspora, particularly those seeking uncensored news; channel 4 is the music/cultural stream
  format: News, talk, investigative journalism, cultural programming and music; this stream emphasises cultural and music content alongside the main news service
  notes: 'Radio Liberty (Радио Свобода) began broadcasting to the Soviet Union from Munich on 1 March 1953 as Radio Liberation and was later merged with Radio Free Europe; relocated its headquarters to Prague, Czech Republic in 1995 (hence the "Prague" tag and CZ country code), where it remains; historically funded covertly by the CIA until 1971 and openly by US Congress thereafter; expelled from Russia in 2022 after Roskomnadzor blocked svoboda.org following the full-scale invasion of Ukraine; staff continue broadcasting from Prague, Vilnius and Riga; the broader RFE/RL operates Russian, Ukrainian, Belarusian, Tatar/Bashkir, North Caucasus and Crimea services among others; mission per RFE/RL: "to promote democratic values and institutions and advance human rights by reporting the news in countries where a free press is banned by the government or not fully established."'
  sources: internal knowledge only
