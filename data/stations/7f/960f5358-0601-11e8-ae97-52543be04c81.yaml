  nature: public broadcaster
  operator: DR (Danmarks Radio), the Danish national public service broadcaster
  affiliations: DR is funded by the Danish state through the public service contribution collected via income tax (replacing the older licence fee in 2022); independent of government control by law but politically supervised via the Folketing's media agreements
  audience: Greater Copenhagen / Capital Region listeners (Hovedstaden), adult Danish-speaking audience
  format: regional public service radio for the Copenhagen area — local news, traffic, weather, regional culture and current affairs, with shared P4 national music programming (Danish and international adult contemporary hits) outside regional windows
  notes: DR P4 København is the Copenhagen-area regional station within DR's P4 network, which is the most-listened-to radio network in Denmark and consists of 11 regional editorial offices producing local news and programming that is interleaved with national P4 content; the Copenhagen edition serves the Hovedstaden region and was originally founded as DR Regionalen København when DR's regional radio structure was created; programming follows DR's public service obligations including a strong news and culture remit and adherence to the political-balance requirements in DR's public service contract with the Danish Ministry of Culture.
