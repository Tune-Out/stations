  notes: "HITZ (originally Hitz.FM, launched 1997) is one of Malaysia's leading English-language commercial hit music stations, broadcasting nationwide on FM and via the syok.my streaming platform. Operated by Astro Radio, the radio arm of Astro Malaysia Holdings (a major pay-TV and media conglomerate). The brand markets itself as \"Malaysia's #1 Hit Station\" and features flagship programmes including the Hitz Morning Crew (Anne, Ili & Prem) and Hitz Drive. Broadcasts from the All Asia Broadcast Centre, Technology Park Malaysia in Kuala Lumpur."
