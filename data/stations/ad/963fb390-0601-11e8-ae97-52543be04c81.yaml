  operator: Nova Editions / Nouvelles Editions Independantes (NEI), the media group founded by Jean-Francois Bizot and later co-led by Mathieu Pigasse
  affiliations: none known (independent French private media group); historically associated with the Actuel magazine countercultural heritage
  audience: French urban audience, especially Paris and major cities; cosmopolitan listeners interested in eclectic, world, hip-hop, electronic and alternative music
  format: Eclectic music-driven format mixing world music, hip-hop, soul/funk, jazz, electronic, reggae, African and Latin sounds; tagline historically associated with "le grand mix"
  notes: Launched 1981 by Jean-Francois Bizot as part of the Actuel media universe; widely credited with pioneering the "world music" concept on French radio. Broadcasts on FM in Paris and several French cities, plus DAB+ and online. Owned by Nouvelles Editions Independantes group which also owns Les Inrockuptibles and Le Monde diplomatique stakes (Pigasse holdings). Commercial ad-supported station with strong cultural and editorial identity.
