  operator: BFM Business, owned by NextRadioTV, a subsidiary of CMA CGM Group's media arm (acquired from Altice France/Patrick Drahi in 2024)
  affiliations: Private commercial broadcaster; part of the BFM brand family (BFMTV, BFM Business, RMC); no party or religious affiliation; pro-business editorial orientation
  audience: French-speaking business professionals, investors, executives, decision-makers in France
  format: 24/7 economic and financial news — markets, corporate news, macroeconomics, interviews with CEOs and policymakers
  notes: BFM Business launched in 2010 as a re-branding of BFM Radio (1992), the leading French business-news radio station broadcasting on DAB+ in Paris and major French cities and as a TV channel. Notable programmes include "Good Morning Business" (Christophe Jakubyszyn / Sandra Gandoin), "Intégrale Bourse", "Le Grand Journal de l'Économie", and "Les Experts". Owned for many years by Alain Weill's NextRadioTV (merged with SFR/Altice Media in 2016); in June 2024 the Drahi-owned RMC-BFM unit was sold to CMA CGM, the shipping giant controlled by the Saadé family, in a major French media-ownership shift. Regulated by Arcom (French audiovisual regulator). The on-air slogan is "La radio de l'économie".
  sources: internal knowledge only
