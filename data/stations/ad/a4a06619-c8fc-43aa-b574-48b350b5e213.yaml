  notes: Havin FM ('havîn' means summer in Kurdish) is a small Turkey-based internet radio station devoted to Kurdish folk music and culture, broadcasting nonstop Kurmanji-language songs to Kurdish listeners in Türkiye and the diaspora. Given the historical restrictions on Kurdish-language broadcasting in Türkiye, it fills a cultural niche. Its own domain havinfm.com is currently offline; the station maintains a Zeno.FM page and the stream runs on radyohizmeti.com hosting.
