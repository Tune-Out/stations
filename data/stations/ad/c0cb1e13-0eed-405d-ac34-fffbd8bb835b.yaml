  nature: public broadcaster
  operator: Norddeutscher Rundfunk (NDR), the public broadcasting authority for Hamburg, Lower Saxony, Schleswig-Holstein and Mecklenburg-Vorpommern, and a member of ARD
  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland); funded by the German broadcasting fee (Rundfunkbeitrag)
  audience: Adult listeners in the city-state of Hamburg and surrounding metropolitan area; German-language
  format: Hamburg city/regional service — pop/rock and AC music mixed with intensive local news, traffic, sports (especially HSV and FC St. Pauli) and Hamburg-focused magazine programming
  notes: NDR 90,3 is NDR's dedicated Landesprogramm for Hamburg, broadcasting on 90.3 MHz from the Heinrich-Hertz-Turm; programming combines Schlager-leaning pop/rock playlists with the flagship daily news magazine "Hamburg-Journal am Nachmittag," traffic and harbour reports, and live coverage of Hamburg events. As part of public-service NDR the station is editorially independent of government, governed by a broadcasting council (Rundfunkrat) representing societal groups; funded primarily by the household Rundfunkbeitrag rather than advertising.
