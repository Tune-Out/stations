  notes: Русский Рок (Radio Russkiy Rok) is an internet-only genre channel from Volna.top, a Moscow-based Russian online-radio platform that runs dozens of themed webstreams (Retro Hit, Radio Cafe, Radio Fresh, Kids Hit and others). It plays Russian-language rock around the clock, mixing the Soviet-era Leningrad Rock Club classics with 1990s-2000s bands and new releases, with no live presenters. The audio is served from the amgradio.ru infrastructure and the site offers hourly recordings and a playlist. It is not a licensed FM broadcaster and has no known political affiliation.
