  operator: RMC (Radio Monte Carlo), part of the BFM/RMC division of the CMA Media group (CMA CGM); acquired from Altice Media in 2024 by the CMA CGM group of Rodolphe Saadé
  affiliations: none formal — privately owned by a French shipping/industrial billionaire (Rodolphe Saadé / CMA CGM); editorially independent under French Arcom oversight, but criticised at times for closeness to its owner's interests
  audience: French-speaking adults nationwide; sports fans, news junkies and talk-radio listeners
  format: News, talk, debate and sports — flagship "Bourdin Direct" (until 2021), "Apolline Matin", "Les Grandes Gueules", "After Foot" (the country's leading late-evening football debate show); the stream "BFM avec RMC" denotes the joint BFM/RMC simulcast positioning
  notes: Founded in 1943 as Radio Monte Carlo in the Principality of Monaco, RMC moved its centre of gravity to Paris in the 2000s and was acquired by Patrick Drahi's Altice (then NextRadioTV) in 2015, becoming part of the RMC-BFM news/sports group with sister channel BFM TV. In 2024 CMA CGM (Rodolphe Saadé) purchased Altice Media, taking control of RMC, BFM TV and BFM Business; the deal sparked debate in France about media pluralism and shipping-industry ownership of news outlets. RMC remains the second-most-listened-to talk station in France and the country's premier football radio.
  sources: internal knowledge
