  notes: P1 is one of four national FM channels operated by Sveriges Radio, the Swedish public service radio company established in its current form in 1979 (with origins in Radiotjänst from 1925); historic programmes include the news bulletin Ekot, morning show Studio Ett, science programme Vetenskapsradion, and the long-running Sommar i P1 in which guests host their own one-hour summer programme; SR is owned by an independent foundation (Förvaltningsstiftelsen) together with SVT and UR to insulate it from political interference; available nationally on FM, DAB+ in limited areas, and online via sverigesradio.se and the Sveriges Radio Play app.
