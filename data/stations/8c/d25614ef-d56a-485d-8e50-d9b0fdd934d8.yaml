  nature: commercial
  operator: LM Radio Lda. (Mozambique) — privately-owned commercial radio company headquartered in Maputo
  affiliations: none known; the brand is a revival of the historic "Lourenço Marques Radio" (LM Radio) name and operates as a sister/affiliate brand to LM Radio in South Africa (run by Chris Turner) which has Mozambican-origin nostalgia roots
  audience: Adults 35+ across southern Mozambique (Maputo region) and northern KwaZulu-Natal / Mpumalanga in South Africa, plus the global Mozambican and South African diaspora online; English-and-Portuguese-language
  format: Adult-oriented "Greatest Hits of all time" — classic pop, rock, soul, R&B and "memory music" from the 1960s-1990s, with presenter-led shows, a Top 100 chart, lifestyle features and podcast interviews
  notes: The original Rádio Lourenço Marques (LM Radio) was launched in 1933 in Portuguese-colonial-era Lourenço Marques (today's Maputo), broadcasting English-language popular music to apartheid-era South Africa and becoming a cultural touchstone; it was closed in 1975 after Mozambican independence; the modern LM Radio was revived in 2005-2009 by South African broadcaster Chris Turner and re-introduced in Mozambique on 87.8 FM (Maputo, Ressano Garcia, Ponta do Ouro) and on DStv channel 891, presenting itself as an explicit tribute to the original station's classic-hits identity.
  sources: https://lmradio.co.mz/, internal knowledge
