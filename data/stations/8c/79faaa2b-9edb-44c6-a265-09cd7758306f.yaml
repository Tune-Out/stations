  notes: Radio Foorti is a Bangladeshi commercial FM station owned by MGH Group that went on air in Dhaka on 22 September 2006 and is credited with pioneering the radio-jockey presentation format in Bangladesh. It broadcasts on 88.0 MHz, having moved from its original 98.4 frequency in 2007, and now operates studios in ten cities including Chittagong, Sylhet, Rajshahi, Khulna, Barisal and Cox's Bazar. Programming is Bengali-language music and RJ-led entertainment, distributed on FM and through its own mobile apps.
