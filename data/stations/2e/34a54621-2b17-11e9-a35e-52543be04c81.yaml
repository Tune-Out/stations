  operator: Radio Hamrah, Inc. — Persian-language broadcaster headquartered in Los Angeles; copyright held by Dr. Farhang Holakouee
  affiliations: Diaspora-oriented Iranian-American media outlet; not affiliated with the Islamic Republic of Iran government; cultural mission to preserve Persian language and identity
  audience: Persian-speaking (Farsi) Iranian diaspora worldwide, with strongest base in Los Angeles ("Tehrangeles")
  format: Persian-language talk, culture, health, cinema and music programming
  notes: Radio Hamrah ("hamrah" means "companion" in Persian) broadcasts on the HD3 sub-channel of KTWV 94.7 FM in Los Angeles and worldwide via stream and mobile apps; flagship shows include Razha va Niazha (Secrets and Needs) with renowned psychologist Dr. Farhang Holakouee, Hamrah ba Alireza Meybodi (current affairs), Lalehzar – Ru-ye Khat-e Cinema with Zaven Hovassapian (cinema), and Dayereh Tandorosti (health) with Ladan Homayoonsefat; mission self-described as creating "connection and unity among compatriots and speakers of the language" while striving to "preserve and promote Persian culture and language"; operates call-in lines (310-441-0555 and international numbers); the broadcaster is part of the broader Los Angeles Iranian-American radio landscape that includes KIRN 670 AM and Radio Iran Hamrah-style brands.
