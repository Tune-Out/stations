  notes: Kalabhavan Mani (1971-2016) was a hugely popular Malayalam actor, comedian and Naadan Paattu folk singer from Chalakudy, Kerala, who rose to fame through the Kalabhavan troupe in Kochi and starred in films like Vasanthiyum Lakshmiyum Pinne Njaanum; this internet stream is one of several Zeno.FM-hosted tribute stations curated by fans to keep his folk-song repertoire and film hits in continuous rotation; no official station website exists
