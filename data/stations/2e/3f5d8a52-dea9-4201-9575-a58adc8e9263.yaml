  notes: This is a single-reciter Quran radio channel carrying Mahmoud Khalil Al-Hussary's complete recitation in the Warsh 'an Nafi' narration, which he recorded in 1964. Al-Hussary (1917-1980), born in Tanta and a winner of Egyptian Radio's recitation competition in 1944, was the first qari to record and broadcast the entire Quran in the measured murattal style, and his readings remain a standard reference for memorisation across the Muslim world. The stream is served from qurango.net, the streaming host behind the free Saudi Quran-audio service MP3Quran.net, which runs dozens of similar per-reciter and tafsir channels. The homepage recorded in the catalogue, phantomsw.com, is unrelated — it belongs to a trading-software company — and qurango.net has no website of its own at its root.
