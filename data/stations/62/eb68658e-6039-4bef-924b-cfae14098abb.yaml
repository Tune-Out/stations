  operator: Volant Media UK Ltd (parent of Iran International TV)
  affiliations: Persian-language opposition to the Islamic Republic of Iran; widely reported (by FT, Guardian, NYT) to have been funded via Saudi-linked investors; designated by Iran as a "terrorist" outlet (a designation rejected by the broadcaster and Western governments). Not state media; not religiously affiliated. Headquartered in London (relocated some operations to Washington DC after UK security threats in 2023).
  audience: Persian-speaking audiences in Iran and the diaspora; also broadcasts in Arabic and English
  format: 24/7 news, current affairs, politics, human rights and sports — simulcast TV/radio
  notes: Radio Iran International is the radio arm of Iran International TV, launched 2017. The outlet became a leading source of coverage during the 2022-2023 "Woman, Life, Freedom" protests after Mahsa Amini's death. UK authorities investigated Iranian state threats against its London staff, prompting a 2023 temporary move of TV production to Washington.
