  format: 100% French-language pop / variété — exclusively chanson française hits and album tracks, mostly from the 1980s, 1990s and 2000s, with some classic crooners
  notes: This is one of Radio France's "webradio thématique" digital-only streams, branded for France Bleu (rebranded to "ici" in 2025 as the merged France Bleu / France 3 régions network "ici"). Operated under Radio France's public-service mandate, the stream curates an unbroken flow of French chanson, showcasing artists such as Goldman, Cabrel, Sardou, Bruel, Zazie and Pagny. It is funded through the French public broadcasting allocation (formerly the redevance, now a state subsidy) and carries no advertising.
