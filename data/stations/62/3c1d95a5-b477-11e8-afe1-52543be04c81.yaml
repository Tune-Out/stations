  format: 24/7 Brazilian bossa nova and MPB classics from the genre's golden era (1950s–1970s) and contemporary artists.
  notes: Rádio Bossa Nova Brazil is one of dozens of themed internet-only stations on the VIP-Radios.fm platform (described as "The Best Radios on the Web"), an aggregator and operator network run by VIP-Connexion. The channel curates the bossa nova genre — the gentle samba-jazz style pioneered by Antônio Carlos Jobim, João Gilberto, Vinícius de Moraes and Stan Getz in the late 1950s in Rio de Janeiro — alongside related MPB (Música Popular Brasileira) artists such as Caetano Veloso, Gilberto Gil and Elis Regina. It is hosted on French/European streaming infrastructure (54.38.43.201) despite the Brazilian thematic branding.
