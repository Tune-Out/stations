  operator: Ahadu Broadcasting Service / Ahadu Media (private Ethiopian media group operating Ahadu FM 94.3 and Ahadu Television).
  affiliations: none formally declared; operates as independent private media in Ethiopia
  audience: Amharic-speaking Ethiopian audience nationally and in the diaspora; tagline "የኢትዮጵያውያን ድምጽ" ("Voice of Ethiopians").
  format: News-led talk format covering domestic politics, international affairs, sports, technology, health, and editorial analysis; notable program strands include "ነገረ ችሎት," "ስፖርት," and "ሳይቴክ" (SciTech).
  notes: Launched in the late 2010s as one of a wave of private FM broadcasters licensed in Ethiopia under the 1999 Broadcasting Proclamation; airs on FM 94.3 in Addis Ababa with online streaming via Zeno.fm and a parallel television channel; operates in a media environment regulated by the Ethiopian Media Authority where press freedom is constrained, particularly during the 2020–2022 Tigray conflict.
