  operator: PT Radio Suara Muslim Surabaya (Suara Muslim Radio Network)
  affiliations: Sunni Islamic religious station; generally aligned with mainstream Indonesian Islamic dakwah movements, not explicitly affiliated with Muhammadiyah or Nahdlatul Ulama
  audience: Adult, urban middle-class Indonesian Muslims in Surabaya and East Java (500,000+ listener base)
  format: Islamic talk and dakwah (preaching) with religious lectures, Quran study, family/parenting, business ethics, and nasheed/Islamic music
  notes: Suara Muslim Surabaya broadcasts on FM 93.8 MHz from Jl. Dinoyo 57, Surabaya (East Java, Indonesia). It positions itself as "The Best Religious Radio Network" with the tagline "Menyimak Ilmu di Suara Muslim" (Listening to Knowledge at Suara Muslim). Programming centers on Islamic education, dakwah lectures, family and economic guidance from Sharia perspectives, and contemporary issues from an Islamic viewpoint. The station has expanded across multiple platforms (streaming, YouTube, Spotify, mobile apps) and runs community events. Its tone is generally moderate-conservative mainstream Sunni Islam.
  sources: http://suaramuslim.net/, internal knowledge
