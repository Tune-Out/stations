  nature: public broadcaster
  operator: Corporació Catalana de Mitjans Audiovisuals (CCMA) — the public broadcasting corporation of the Generalitat de Catalunya (Government of Catalonia)
  affiliations: Catalan regional government (Generalitat de Catalunya); editorial line strongly identified with promotion of Catalan language and culture; widely seen as sympathetic to Catalan nationalism / independentism
  audience: Catalan-language general audience across Catalonia, the Balearic Islands, Valencia (Països Catalans) and Andorra; news/talk-oriented adults
  format: Flagship Catalan-language news, talk, current affairs, sports and culture station ("la ràdio pública dels catalans"); notable shows include the morning current-affairs strip "El matí de Catalunya Ràdio"
  notes: Catalunya Ràdio was launched on 20 June 1983 as the first public radio station broadcasting entirely in Catalan, established by the restored Generalitat de Catalunya after the end of Franco's dictatorship; flagship station of a network that also includes Catalunya Informació (24-hour news), Catalunya Música (classical) and iCat (culture); part of the CCMA which also runs TV3; funded by a mix of Generalitat budget and advertising; consistently the leading station in Catalonia in audience share; the broadcaster has frequently been at the centre of Spanish political controversy over alleged pro-independence bias, especially during and after the 2017 Catalan independence referendum.
  sources: internal knowledge only
