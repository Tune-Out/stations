  notes: Secret Agent is one of the longest-running channels of SomaFM, the San Francisco listener-supported, commercial-free internet radio network that Rusty Hodge launched full-time in February 2000. Billed as 'the soundtrack for your stylish, mysterious, dangerous life', it was SomaFM's third station and is still programmed by Hodge, blending spy-film scores, lounge, acid jazz, exotica and downtempo. SomaFM operates as a non-profit funded entirely by listener donations and offers the channel in several bitrates in MP3 and AAC. The catalog name carries a '(128k MP3)' quality suffix that is not part of the station name.
