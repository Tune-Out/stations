  format: Contemporary Hit Radio (CHR / Top 40) - mainstream pop, dance, hip hop and current hits, with personality breakfast and drive shows
  notes: Nova 106.9 launched 1 August 2002 as Brisbane's flagship station for the Nova FM network, broadcasting on FM 106.9 MHz from studios in Newstead/Fortitude Valley. It is part of Nova Entertainment, which also runs Nova 96.9 Sydney, Nova 100 Melbourne, Nova 91.9 Adelaide, Nova 93.7 Perth, Smooth FM and the Star network. Nova Entertainment was originally established by Daily Mail and General Trust (DMG); since 2009 it has been wholly owned by Illyria, Lachlan Murdoch's investment company. The Brisbane breakfast show ("Ash, Luttsy and Susie O'Neill") has historically been one of the city's highest-rated commercial programs and a regular Australian Commercial Radio Awards (ACRA) winner.
