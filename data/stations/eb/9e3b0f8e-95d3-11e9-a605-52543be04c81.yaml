  nature: public broadcaster
  operator: Norddeutscher Rundfunk (NDR), a regional public-service broadcaster within the ARD consortium
  affiliations: ARD (Arbeitsgemeinschaft der oeffentlich-rechtlichen Rundfunkanstalten); funded by the German Rundfunkbeitrag household licence fee; independent of government per the Rundfunkstaatsvertrag
  audience: Adults 25-59 across NDR's four-state region (Hamburg, Lower Saxony, Schleswig-Holstein, Mecklenburg-Vorpommern); German language
  format: Adult contemporary pop/rock with news bulletins, regional programming, traffic and service info; a hot-AC public-radio sound widely regarded as Germany's most-listened-to radio station
  notes: NDR 2 has historically been one of the highest-reach radio stations in Germany, regularly competing with WDR 2 and Bayern 3 for the national listenership crown. NDR itself was founded 1956 (split from NWDR) and is jointly funded and governed by its four member states; HQ in Hamburg. Like all ARD stations, NDR is constitutionally bound to editorial independence and a public-service remit ("Grundversorgung"); a Rundfunkrat (broadcasting council) including civil society representatives oversees programming. NDR 2 also produces regional opt-outs ("Regionalfenster") for the four NDR states. As public-service media NDR has occasionally been the focus of debate over the licence fee and political-balance criticisms but operates independently of party control.
  sources: internal knowledge only
