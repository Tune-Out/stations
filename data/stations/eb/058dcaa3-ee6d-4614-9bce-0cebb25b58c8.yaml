  nature: public broadcaster
  operator: All India Radio (Akashvani) — division of Prasar Bharati, India's autonomous public service broadcaster under the Ministry of Information and Broadcasting
  affiliations: Government of India (Prasar Bharati statutory corporation); no religious or political party affiliation
  audience: Mumbai metropolitan listeners — multilingual (Hindi/English/Marathi) urban audience; targeted at upmarket, English-speaking and Westernized listeners
  format: International and Indian Western/English pop, rock, retro, and contemporary hits with English-language presentation, plus some Hindi film music; positioned as the "international" FM service of AIR
  notes: FM Rainbow Mumbai broadcasts on 107.1 MHz from Prasar Bharati's Worli transmitter; FM Rainbow is AIR's English-medium metro FM brand launched in the mid-1990s (Delhi in 1993, expanded to Mumbai, Chennai, Kolkata, and Bengaluru) as a more cosmopolitan, music-led service distinguishing it from the Vividh Bharati (Hindi film classics) and FM Gold (Hindi pop/film) brands; known historically for English RJs, Western music programming, and a more international, urban-yuppie tone; Marathi-language tagging in this catalogue entry reflects the Mumbai/Maharashtra location rather than the predominant on-air language; the Prasar Bharati streams it via official HLS endpoints.
