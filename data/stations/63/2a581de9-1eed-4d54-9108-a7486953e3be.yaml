  operator: Nine Radio (a division of Nine Entertainment Co.); previously owned by Macquarie Media before Nine's full acquisition in 2019
  affiliations: Part of Nine Entertainment's national talk-radio network (alongside 2GB Sydney, 4BC Brisbane and 6PR Perth); editorially conservative-leaning but not formally party-aligned
  audience: Adults 40+ in Melbourne and regional Victoria; consistently the highest-rated AM talk station in the Melbourne market
  format: News, talkback, politics, sport, and current affairs on AM 693 kHz
  notes: Launched on 22 February 1932 by the Macpherson, Bailey & Allard partnership and originally owned by the Methodist and Presbyterian churches (hence the call sign 3AW, drawn from "Australian Wesleyan"); long synonymous with Melbourne talk radio and home to programs such as Ross & Russ in the Morning (formerly Ross & John), Mornings with Tom Elliott, Afternoons, Drive with Jacqui Felgate, and rights-holding broadcasts of AFL football; has dominated Melbourne radio ratings for much of the 21st century and is a key outlet in the Nine Radio talk network that emerged after the 2019 Nine–Fairfax merger and subsequent buy-out of Macquarie Media.
