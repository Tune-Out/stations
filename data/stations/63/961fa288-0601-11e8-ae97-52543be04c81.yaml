  notes: Ambient Sleeping Pill is an independent, ad-free internet radio station streaming since 2013, run by the Stereoscenic ambient label/radio project (Brian Mitchell) and hosted on radio.stereoscenic.com. It plays a hand-curated selection of tranquil, beat-free ambient music intended for sleep, naps, meditation and study, self-described as 'never too new-age or dark'. Stereoscenic also publishes a companion series of 'Ambient Sleeping Pill' compilation albums on Bandcamp and Spotify, and runs sister streams a.m. ambient and Ambient Modern. The station is listener-supported with no advertising.
