  notes: Radio Kniga (literally "Radio Book") launched in 2009 and broadcasts on 105.0 FM in Moscow. It is operated as part of GPM Radio, the radio division of Gazprom-Media Holding, which also owns Echo of Moscow's former frequencies, Comedy Radio, Avtoradio, Energy and others. The station is unusual in the Russian market for its all-spoken-word format and has positioned itself as an intelligent alternative to music radio.
