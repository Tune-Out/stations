  format: 'literary spoken-word: short stories, audiobook excerpts, essays, historical and literary anecdotes, interviews'
  notes: 'Radio Kniga (''Radio Book'') is Russia''s first literary FM station, begun in Volgograd in 2013 (106.4 FM) and on air in Moscow on 105.0 FM since 2015. Rather than full audiobooks it broadcasts more than 300 short pieces a day: stories, fragments, essays, feuilletons and anecdotes drawn partly from the Gosteleradiofond archive, plus interviews with writers, with the stated aim of drawing a new generation to reading. Management is attributed to the company Dom Muzyki, one of whose owners is Lyube frontman Nikolai Rastorguev. It is a rare all-spoken-word alternative to music radio in the Russian market.'
