  nature: non-commercial
  operator: Friends of KEXP (a Washington State 501(c)(3) non-profit), in partnership with the University of Washington which holds the FCC license
  affiliations: licensed via the University of Washington; long-standing partnership with the Experience Music Project / Paul G. Allen Family Foundation (which contributed major funding); no political, governmental or religious affiliation; member of NPR's Public Radio Music Day coalition though not an NPR member station
  audience: Adult eclectic / indie music listeners in Seattle, the Bay Area (92.7 KEXP-BA) and a global online audience
  format: DJ-curated eclectic non-commercial music radio spanning indie rock, electronic, hip-hop, world, jazz, soul and roots, with extensive live in-studio sessions; ad-free, listener-supported
  notes: KEXP-FM 90.3 Seattle is one of the most influential non-commercial / public music stations in the US; originated as student-run KCMU at the University of Washington in 1972, was rebranded and relaunched as KEXP in 2001 with major funding from Microsoft co-founder Paul Allen's Experience Music Project, and is now operated by the Friends of KEXP non-profit while the UW remains the license-holder; tagline "Where the Music Matters"; famous for its YouTube "KEXP Live" sessions (hundreds of millions of views), morning show The Morning Show, The Roadhouse, Variety Mix and Spanish-language podcast/show El Sonido; operates from a public-facing studio at Seattle Center (opened 2016) including the Gathering Space, La Sala and exhibition area; expanded onto 92.7 FM in the San Francisco Bay Area in 2024; funded almost entirely by listener donations, member contributions, foundation grants and merchandise; no on-air advertising.
  sources: https://www.kexp.org/, internal knowledge of US public radio
