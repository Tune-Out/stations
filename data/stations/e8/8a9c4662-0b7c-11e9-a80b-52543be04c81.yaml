  notes: 883Jia (88.3 Jia FM, formerly Y.E.S. 93.3FM's sister station Capital 95.8's contemporary, originally Yes 88.3FM / "Y.E.S. 883FM") launched in the 1990s under the former Radio Singapore International / RCS, and now part of Mediacorp's Chinese-language radio cluster alongside Capital 958, Yes 933, and Love 972; Mediacorp itself was corporatised from the former Singapore Broadcasting Corporation (SBC) in 1994, with full state ownership through Temasek; 883Jia targets middle-aged Mandarin listeners with familiar local and regional Chinese pop classics, hosting popular DJs and on-air contests; distributed via FM, the meLISTEN streaming app and online streams (incl. StreamtheWorld).
