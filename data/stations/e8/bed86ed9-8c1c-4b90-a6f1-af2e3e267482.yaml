  notes: Südtirol 1 is one of the most-listened-to private radio stations in South Tyrol, the German-speaking autonomous province of northern Italy bordering Austria; programming serves the bilingual region with content in German, reflecting the province's status under the Autonomy Statute that protects the German linguistic minority; the station broadcasts on multiple FM frequencies covering the Alpine province (Bozen, Meran, Brixen, Bruneck) and via DAB+ and online streaming; signature segments include "Südtiroler des Tages" (South Tyrolean of the Day), "Verein der Woche" (Club of the Week), and "G'sundes Südtirol" (Healthy South Tyrol) with the radio doctor; competes locally with Radio Tirol and the public ORF/RAI Südtirol services.
