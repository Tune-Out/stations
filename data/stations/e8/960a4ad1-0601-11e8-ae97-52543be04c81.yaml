  notes: 'WWOZ 90.7 FM is New Orleans'' listener-supported community radio station, founded in 1980 and operated by the nonprofit WWOZ New Orleans, Inc. with volunteer DJs. Its programming is devoted to New Orleans and Louisiana music: jazz, blues, R&B, funk, brass band, Cajun and zydeco, plus live broadcasts from the New Orleans Jazz & Heritage Festival, whose foundation owns the licence. It is one of the world''s best-known community music stations and a key institution in preserving the city''s musical heritage.'
