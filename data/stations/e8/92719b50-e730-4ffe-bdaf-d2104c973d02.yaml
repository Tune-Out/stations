  notes: Cadena SER (Sociedad Española de Radiodifusión) is Spain's oldest and most-listened-to commercial radio network, founded in 1924; the A Coruña local station (Radio Coruña) joined the network in 1934 and provides regional opt-outs covering Galicia's largest city and its province; PRISA's flagship national programs (Hoy por Hoy, La Ventana, Hora 25, Carrusel Deportivo, El Larguero) air alongside local desconexiones with regional news, weather and culture; Cadena SER is often described as the left-of-centre counterweight to COPE and OndaCero in Spain's broadcast landscape, though the company stresses editorial independence.
