  notes: DFM Russian Dance is an online-only web channel of DFM, the Moscow dance/CHR station on 101.2 FM owned by Russian Media Group. DFM launched on 1 July 2000 as Dinamit FM, rebranded in 2005-2006 and reaches roughly three million daily listeners across Russia. This stream is an automated 24-hour rotation of dance tracks by Russian artists, mixing mega-hits and new releases, one of a dozen DFM themed web channels hosted on hostingradio.ru. It has no presenters or original programming. No state affiliation is documented for the commercial Russian Media Group.
