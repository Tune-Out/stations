  notes: Launched in 1988 as one of Baden-Württemberg's first private commercial stations after broadcasting liberalisation; serves the broad regional market of Ulm and the Bodensee (Lake Constance) area on FM frequencies (101.7 MHz in Ulm and others) and via DAB+. Shareholders historically have included regional newspaper publishers from the area (including Schwäbische Verlag and Südwest Presse), making it a typical regional commercial AC station. Programming centres on chart and rock hits ("Die besten Hits" branding) plus regional news bulletins.
