  nature: public broadcaster
  operator: Hrvatska radiotelevizija (HRT) — Croatia's national public service broadcaster, funded by mandatory licence fees and supervised by the Croatian Parliament.
  affiliations: Active member of the European Broadcasting Union (EBU); copyright "Autorska prava - HRT © Hrvatska radiotelevizija. Sva prava pridržana."
  audience: General Croatian-speaking population across all of Croatia.
  format: Flagship national talk-and-music public-service program — Croatian and international news bulletins ("Vijesti", "Dnevnik"), current affairs ("Kronika dana"), cultural and educational programming, radio drama ("Fantastika u radio drami"), language and literature features.
  notes: HR 1 (Prvi program) is the oldest and most prestigious of Croatian Radio's three national networks; the predecessor service Radio Zagreb began broadcasting on 15 May 1926, making it among the oldest continuously operating broadcasters in Southeast Europe; HRT operates eight regional radio stations (Dubrovnik, Knin, Osijek, Pula, Rijeka, Sljeme, Split, Zadar) under its broader public-service mandate; HRT is governed by the HRT Act and the Programme Council, with editorial independence guaranteed by law though appointments are political; HR1 is the equivalent of BBC Radio 4 in role — Croatia's primary speech-and-information national channel.
