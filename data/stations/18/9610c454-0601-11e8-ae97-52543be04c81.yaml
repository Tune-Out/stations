  notes: Antenne Bayern Chillout is one of more than forty niche web channels run by Antenne Bayern, the private Bavarian broadcaster launched on 5 September 1988 and based in Ismaning. The parent station reaches about 3.84 million listeners a day (2024) across Bavaria via 43 FM transmitters plus cable, Astra satellite and streaming, playing a "current-based AC" mix for 14-59 year olds with news, weather and traffic. Its shareholders include the Bavarian daily-newspaper media company (24.9%), RTL Group, Axel Springer and Hubert Burda Media (16% each), and the group also runs Rock Antenne and Oldie Antenne on DAB+. The Chillout stream itself is an automated, presenter-free rotation of ambient, downtempo and easy-listening tracks at 128 kbps MP3.
