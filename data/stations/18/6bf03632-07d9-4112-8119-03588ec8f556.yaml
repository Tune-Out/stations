  operator: Grupa Radiowa Agory (Agora Radio Group) — Anty Radio is part of the Eurozet portfolio, owned since 2020 by Agora S.A.
  affiliations: Private commercial rock broadcaster; no formal party or religious affiliation; parent Agora S.A. publishes the centre-left daily Gazeta Wyborcza and is considered a liberal-opposition-leaning media group
  audience: Polish-speaking rock and alternative music fans, predominantly young-male skewing 18–49 demographic across major Polish cities
  format: Rock / hard rock / metal / alternative music format with rock-news features and specialist shows (heavy metal, classic rock, new releases)
  notes: 'Anty Radio (Antyradio) launched in 2007 as a youth-rock spin-off of Radio Eska Rock under the Eurozet group. Broadcasts on FM in Warsaw, Kraków, Katowice, Gdańsk and other major Polish cities plus nationwide via DAB+ and the internet stream (an.cdn.eurozet.pl). Eurozet was owned by Lagardère/Czech SFM Group until November 2020, when Agora S.A. completed acquisition after a long competition-authority battle (UOKiK initially blocked the deal in 2021 but the decision was later reversed). Notable shows include "Strefa Mocy", "Hardrockowy Drink Bar", and dedicated metal and Polish-rock programming. Slogan historically: "Rock zaczyna się tutaj" (Rock starts here).'
  sources: internal knowledge only
