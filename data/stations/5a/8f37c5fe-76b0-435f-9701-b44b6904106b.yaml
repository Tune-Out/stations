  format: 24/7 digital music channel devoted to German Schlager, evergreens, Volksmusik and contemporary German-language pop, including hits from artists such as Helene Fischer, Andrea Berg, Roland Kaiser, Wolfgang Petry and Howard Carpendale.
  notes: NDR Schlager is one of NDR's DAB+ / online-only music streams, launched in the 2010s to complement the main NDR 1 regional networks and NDR 2. As an ARD station it is funded by the German Rundfunkbeitrag (household licence fee, ~18.36 EUR/month) and is editorially independent from government, with programming overseen by the NDR Rundfunkrat representing civil society groups. It carries the NDR public service remit of information, education and culture though as a music channel it is largely music-only with brief presenter links and limited news on the hour.
