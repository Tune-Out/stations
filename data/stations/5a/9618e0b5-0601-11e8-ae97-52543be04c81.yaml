  notes: Digi FM is a Romanian commercial network launched on 11 November 2015 by Digi (RCS & RDS), the telecoms group that had acquired Pro FM and related radio assets earlier that year and put Digi FM on frequencies formerly used by the news station Info Pro. It runs a hot adult contemporary format built on music from the last two decades, with news bulletins every half hour on weekdays and hourly at weekends — a mix reflected in its current slogan 'Newsic Radio', after earlier lines 'Puterea Radioului' and 'Ca să știi'. The network covers 41 regional and local frequencies between 88.4 and 107.9 MHz, including Bucharest 97.9, Cluj-Napoca 104.5, Timișoara 91.3, Brașov 100.7 and Craiova 105.5. The stream on the RDS edge servers is live.
