  format: Musical documentaries, world music, jazz, folk, contemporary compositions and cultural programming
  audience: French-speaking Switzerland; music and culture enthusiasts
  notes: RTS Option Musique is one of the four radio networks operated by RTS, the French-language division of SRG SSR (Société Suisse de Radiodiffusion et Télévision). SRG SSR is Switzerland's state-owned public broadcaster, established in 1983 through a merger of the three language-community broadcasters. RTS operates under a unique Swiss federalist model where Italian-language RTSI and Romansh-language RTR are peers to RTS and the German-language SRF. The network is funded through mandatory licence fees collected nationally. Option Musique is specifically curated for sophisticated music programming rather than chart-driven hits, featuring documentaries, world music, jazz and cultural/musical analysis. Broadcast in French language for the Romandy (French-speaking) region of Switzerland.
