  notes: RTS Option Musique is the music channel of Radio Télévision Suisse, the French-language arm of the licence-fee-funded public broadcaster SRG SSR. Launched in 1994 as a medium-wave complement to La Première, it now broadcasts on DAB+, cable, satellite and online with a programme built mainly on francophone variety and pop hits from past decades to today, a strong emphasis on promoting Swiss artists since a 2021 refresh, and hourly RTS news bulletins. It adopted the RTS Option Musique name on 26 August 2024. The earlier catalog notes describing world music, jazz and musical documentaries were inaccurate.
