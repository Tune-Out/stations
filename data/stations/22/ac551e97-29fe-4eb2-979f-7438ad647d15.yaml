  nature: public broadcaster
  operator: Sveriges Radio AB (SR), Sweden's national public-service radio organisation, owned by the independent Förvaltningsstiftelsen för Sveriges Radio, SVT och UR (Public Service Foundation)
  affiliations: Sveriges Radio; EBU member; no party-political or religious affiliation, governed by the Swedish Radio and Television Act and statutory public-service charter
  audience: Adults in Stockholm County (Stockholms län), Swedish-language; regional opt-out of the P4 network
  format: P4 is Sweden's flagship public-service network combining adult-contemporary music, local and national news, sports, weather and talk; P4 Stockholm provides the Stockholm regional newsroom with local news, traffic and current affairs programming
  notes: Sveriges Radio P4 Stockholm is one of 25 regional P4 channels broadcast nationally on FM and digital, with origins going back to local radio launched in 1977 (then "Radio Stockholm"); rebranded P4 Stockholm in 1996 when SR reorganised its FM networks; financed since 2019 through a personal public-service fee collected by the Swedish Tax Agency (replacing the licence fee), and editorially required to be "saklig och opartisk" (factual and impartial); SR's editorial independence from the state is statutorily protected
