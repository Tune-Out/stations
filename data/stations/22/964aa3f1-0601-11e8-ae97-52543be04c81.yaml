  format: '"Program Trzeci" (Programme 3, "Trojka") - rock, alternative, jazz, indie music with cultural talk, literary programmes, and the iconic Lista Przebojow Programu Trzeciego (Programme 3 Hit List)'
  notes: Trojka launched 1 April 1962 and became one of the most influential and beloved Polish radio brands, known for cultivated music selection, independent rock/alt programming, and prestigious presenters; the LP3 Lista Przebojow chart, hosted by Marek Niedzwiecki for decades, was a Polish cultural institution; faced a major political crisis in 2020 when management led by Tomasz Kowalczewski (appointed under the PiS-aligned management of Polish Radio) censored a song critical of Jaroslaw Kaczynski ("Twoj bol jest lepszy niz moj" by Kazik) from the chart, triggering mass resignations of star presenters including Niedzwiecki, Piotr Stelmach, Hanna Kowalewska, and Anna Gacek - widely seen as the destruction of Trojka's editorial independence; following the 2023 change of government, efforts began to restore the station's heritage; broadcasts nationwide on FM (Warsaw 99.0) and via polskieradio.pl/trojka.
