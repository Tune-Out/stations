  format: Rock, alternative, jazz and singer-songwriter music with cultural talk, literary features and the long-running Lista Przebojów Programu Trzeciego chart
  notes: Trójka is Program III of Polskie Radio, on air since 1 April 1962 and long regarded as the most culturally influential of Poland's national networks for its rock and alternative programming and its weekly Lista Przebojów Programu Trzeciego chart. In May 2020 the station admitted rigging the chart to remove a Kazik song critical of Jarosław Kaczyński; the scandal triggered mass resignations of presenters including Marek Niedźwiecki and cut the station's audience share from around eight percent to under two. It has since rebuilt its team with journalists recruited from other outlets but still runs well below its former reach. The catalog homepage moje.polskieradio.pl returns 404 and the current site is trojka.polskieradio.pl; the recorded stream endpoint answers with a SHOUTcast administrator page rather than audio and then stops responding, so it needs replacing.
