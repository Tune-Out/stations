  notes: TMM 1 is the flagship of The Music Machine, a pair of British alternative-music stations owned and operated by Sammy Jacob, founder of the original XFM, through The Music Machine Ltd. The service began as NME Radio (2008-2013), relaunched as NME 1 and NME 2 in June 2018 and was rebranded TMM 1 / TMM 2 on 10 December 2023 when the licence deal with NME magazine ended. TMM 1 plays classic and current indie and alternative rock, from 60s garage and 70s punk to 80s new wave and 90s grunge, while TMM 2 carries newer indie, electronic and urban tracks. Both channels run largely automated 24/7 and are carried on DAB+ in London (9A/9C) and Norwich (9C) and online via the station website and TuneIn.
