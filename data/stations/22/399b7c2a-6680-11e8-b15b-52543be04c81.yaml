  operator: Grupa RMF (Radio Muzyka Fakty Sp. z o.o.), owned by Bauer Media Group (Germany) since 2006
  affiliations: none known - secular commercial broadcaster with no religious, governmental, or political affiliation; part of Bauer's Polish radio portfolio alongside RMF MAXXX, RMF Classic, and the news brand RMF24
  audience: Polish-language mass-market adult audience nationwide; Poland's most-listened-to radio station by audience share for over two decades
  format: Adult contemporary / hot AC music with news (the "RMF" name stands for "Radio, Muzyka, Fakty" - "Radio, Music, Facts"); strong news bulletins, sports, traffic, and morning show
  notes: Launched 15 February 1990 from Krakow as one of the first private radio stations in post-communist Poland (initially broadcasting from a hot-air balloon and then unlicensed FM); founded by Stanislaw Tyczynski; headquartered in Krakow; consistently leads Polish national radio ratings ahead of Radio Zet and the public Polskie Radio; tagline "RMF FM - Najlepsza muzyka" / "RMF zawsze z Wami"
  sources: https://www.rmf.fm/, internal knowledge
