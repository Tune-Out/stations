  operator: Kontrafunk AG (Swiss-registered stock corporation based in Zug, Switzerland) with German-language editorial team
  affiliations: Editorially aligned with right-of-centre, libertarian-conservative, and COVID-policy-critical / "alternative media" milieu; not formally tied to a party but frequently associated by mainstream German press with positions of the AfD, Werteunion, and similar conservative/contrarian movements (the station rejects party affiliation)
  audience: German-speaking conservative, libertarian and government-critical adults across Germany, Austria and Switzerland (DACH region)
  format: "24/7 talk and information radio: political analysis, interviews, cultural commentary, satire and classical/jazz music inserts; presents itself as an alternative to public-service broadcasters ARD/ZDF/ORF/SRG"
  notes: 'Launched 1 January 2023 by Burkhard Müller-Ullrich, a former Deutschlandfunk and SWR journalist, together with co-founders including journalist Marcel Joppa and Swiss entrepreneur and FDP-affiliated investor backers. Financed through donations, paid memberships and ads rather than public broadcasting fees; explicitly positions itself in opposition to what it calls the "Gleichschaltung" of German public broadcasting. Notable hosts have included Roger Köppel (Weltwoche), Andreas Thiel, Cora Stephan, Henryk M. Broder and Matthias Matussek. The station has drawn coverage in Der Spiegel, Süddeutsche Zeitung, taz and others as part of debates around so-called "Alternativmedien". Slogan/self-description: "Der freie Sender" / "Hier spricht das andere Deutschland".'
  sources: internal knowledge only
