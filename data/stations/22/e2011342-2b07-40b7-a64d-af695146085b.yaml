  notes: Al Jazeera Arabic is the Arabic-language flagship of the Al Jazeera Media Network, broadcasting round the clock from Doha since 1 November 1996. It is funded by the government of Qatar, which capitalised it with a loan from Emir Hamad bin Khalifa Al Thani, and it operates alongside Al Jazeera English, Al Jazeera Documentary and AJ+. Its output is breaking news, war and conflict reporting, investigations and combative debate programmes such as Al-Ittijah al-Mu'akis. The channel is a defining institution of modern Arab broadcasting and was central to the 2017-2021 Gulf blockade, when neighbouring states demanded its closure. This catalog entry carries the HLS feed of the television channel rather than a separate radio service.
