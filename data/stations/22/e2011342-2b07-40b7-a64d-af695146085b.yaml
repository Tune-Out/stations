  nature: state media
  operator: Al Jazeera Media Network, headquartered in Doha, Qatar
  affiliations: Funded by the government of Qatar (the ruling Al Thani family); editorially independent in principle but widely regarded as reflecting Qatari foreign-policy interests
  audience: Pan-Arab audience across the Middle East, North Africa, and the global Arabic-speaking diaspora
  format: 24/7 Arabic-language news, breaking coverage, investigative documentaries, political talk shows, sports, and opinion analysis
  notes: Al Jazeera Arabic (الجزيرة) launched 1 November 1996 as the Arab world's first independent 24-hour news channel, funded by an initial loan from Emir Hamad bin Khalifa Al Thani of Qatar; revolutionised Arab broadcast journalism by airing dissenting voices and uncensored war coverage, but has been repeatedly accused by Saudi Arabia, UAE, Egypt, Bahrain, and Israel of bias and supporting Islamist movements (notably the Muslim Brotherhood); was a central demand in the 2017-2021 Qatar diplomatic crisis when blockading states demanded its closure; banned or restricted in numerous countries; flagship presenters and shows include Al-Ittijah al-Mu'akis (The Opposite Direction) and Bila Hudud (Without Borders); the parent network operates Al Jazeera English, AJ+, Al Jazeera Documentary, and Al Jazeera Balkans; multiple Al Jazeera journalists have been killed or imprisoned including Tarek Ayyoub (Baghdad, 2003) and Shireen Abu Akleh (Jenin, 2022); the radio stream rebroadcasts the audio of Al Jazeera Arabic TV.
  sources: https://www.aljazeera.net/, internal knowledge
