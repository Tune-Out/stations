  operator: New York Public Radio (legally New York Public Radio, formerly the WNYC Foundation), a 501(c)(3) non-profit
  affiliations: NPR member station; PRX and APM distributor; PBS-aligned public-media ecosystem; non-partisan; funded by listener membership, foundation grants, corporate underwriting and a small share of public funding
  audience: English-speaking adult listeners in the New York City metropolitan area; college-educated, news-oriented demographic
  format: News-talk public radio carrying NPR programming (Morning Edition, All Things Considered, Fresh Air) plus local journalism, public-affairs talk and signature WNYC shows
  notes: WNYC 93.9 FM is the FM service of New York Public Radio, broadcast from the Empire State Building and reaching one of the largest public-radio audiences in the United States; the station was founded by the City of New York in 1924, became municipally operated, and was spun off into the independent non-profit WNYC Foundation in 1997; flagship local productions include "The Brian Lehrer Show," "On the Media," "Radiolab," "Death, Sex & Money" and "The Takeaway," and the organisation also owns WQXR-FM (classical) and Gothamist
