  notes: Olímpica Stéreo 104.5 FM Cali is the local station of the Organización Radial Olímpica chain, founded by the Char family on the Caribbean coast and now one of Colombia's largest privately-owned radio groups. The chain operates a national network of FM "Olímpica Stéreo" outlets in major cities plus sister brands such as Radio Tiempo and La Reina (vallenato), and has expanded internationally to Panama (La KY 92.5, Play 103.7). The Cali feed is tailored to the city's strong salsa culture and competes with Caracol and RCN-owned music stations in the local market.
