  notes: WPNN broadcasts on 790 kHz AM with FM translator W279CY on 103.7 in Pensacola, Florida, branding itself "Pensacola's Local Talk Radio". Licensed since 1956 as WPFA and renamed WPNN in 2002, it is owned by Miracle Radio and operated under the Gulf Coast Media Group banner. Programming mixes local talk with syndicated hosts such as Glenn Beck and Dana Loesch, plus Alabama football, Saints and Pelicans play-by-play. The station is on air, but this catalog entry's stream and homepage are both broken.
