  notes: FM 101 is the urban FM network of the Pakistan Broadcasting Corporation, the state public broadcaster founded in 1947 as Radio Pakistan from the colonial-era Indian Broadcasting Service; the Mithi station serves Tharparkar, a desert district in Sindh on the Indian border, broadcasting in Sindhi and Urdu with local cultural content; PBC is a statutory corporation under the federal Ministry of Information and Broadcasting and historically has carried government-aligned editorial content.
