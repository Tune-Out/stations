  notes: Petőfi Rádió is a national music channel of Hungary's public broadcaster, part of Duna Média. It began in 1932 as Budapest II and took its present name in 1949 in tribute to the poet Sándor Petőfi. It broadcasts on 94.8 MHz in Budapest through a network of 16 FM transmitters reaching across Central Europe. A 2007 overhaul turned it into a round-the-clock music service, production moved to the A38 venue in Budapest in 2021, and content production was outsourced to the Petőfi Média Group in 2022. Since September 2023 it has played Hungarian music exclusively under the slogan "Minden magyar", and its signature shows include the live session series Akusztik and the cultural strand Kultúrfitnesz.
