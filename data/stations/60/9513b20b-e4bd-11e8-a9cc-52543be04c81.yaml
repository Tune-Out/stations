  notes: Arrow Classic Rock is a Dutch national commercial rock station launched in autumn 1996 by Ad Ossendrijver and Willem van Kooten, and now owned by Media Management & Project BV, headed by Gerro Vonk. It broadcast on AM 675 kHz from 1998, moved to 828 kHz in 2003 and held FM frequencies from 2007, but lost its FM licence in 2009 over unpaid fees during the financial crisis; listener donations funded a restart on cable, internet and digital radio. Since 18 June 2021 it has carried nationwide on DAB+, with gaps over Texel, Vlieland, most of Terschelling and southern Zeeland. Specialist evening shows were dropped on 7 December 2020 on commercial grounds, leaving a rotation-driven classic and modern rock format.
