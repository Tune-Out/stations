  notes: 'American Family Radio (AFR) is a Christian radio network owned by the American Family Association, founded in 1991 by Rev. Donald Wildmon and headquartered in Tupelo, Mississippi, with over 180 stations in more than 30 states. This entry is the AFR Talk network stream, launched in 2009, carrying conservative Christian talk such as ''Today''s Issues'' with Tim Wildmon plus syndicated programmes. The catalog already holds a canonical ''AFR Talk'' entry on the same afa.net media server. Editorial flag: American Family Radio is the broadcasting arm of the American Family Association, which the Southern Poverty Law Center designates an anti-LGBTQ hate group; AFR Talk programming regularly features anti-LGBT and culture-war advocacy beyond ordinary partisan talk.'
