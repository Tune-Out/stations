  notes: DZMM Radyo Patrol 630 was the flagship AM news/talk station of ABS-CBN, broadcasting on 630 kHz from Quezon City and one of the Philippines' most influential news-radio brands; following the May 2020 shutdown of ABS-CBN's broadcast operations after the Philippine Congress denied renewal of its 25-year franchise, the brand was re-launched as TeleRadyo on cable and online; in 2023 ABS-CBN ended its TeleRadyo operations and the brand transitioned to Prime Media Holdings as "TeleRadyo Serbisyo", carrying many of the same hosts and public-service programmes (Failon Ngayon, Dos Por Dos, etc.); the franchise denial is widely viewed as politically motivated under the Duterte administration and remains a touchstone in Philippine press-freedom debate.
