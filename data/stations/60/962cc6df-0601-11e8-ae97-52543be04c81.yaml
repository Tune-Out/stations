  notes: Dance Wave! is an independent, ad-free internet radio from Hungary launched on 9 September 2015 and modelled on international dance web stations. The main channel plays contemporary dance, house and trance from 2000 onward with an emphasis on new releases rather than familiar hits, without ads or presenter talk; the Dance Wave Retro! channel covers 1990s and earlier dance. It is notable for its audio-quality focus, offering MP3, OGG Vorbis, AAC+, Opus and lossless FLAC streams. The catalog stream URL now redirects to stream1.dancewave.online:8082/dance.mp3.
