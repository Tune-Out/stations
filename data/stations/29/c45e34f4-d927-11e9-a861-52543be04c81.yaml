  nature: commercial
  operator: Rádio Impuls — operated by LONDA spol. s r.o.; part of the MAFRA media group, owned by Agrofert holding (controlled via trust funds by former Czech Prime Minister Andrej Babiš)
  affiliations: parent Agrofert / MAFRA also publishes MF Dnes and Lidové noviny; media-ownership concentration under Babiš has been a long-standing controversy in Czech media-pluralism debates
  audience: Czech-speaking adult mainstream audience (target 30–55) across the entire Czech Republic; one of the country's most-listened-to private national radio stations
  format: Adult contemporary / hit-radio with strong emphasis on Czech-language pop and rock alongside international hits; news bulletins, traffic and morning/drive-time talk shows; the playful name variation "Impuls Ráááádio" plays on the station's well-known elongated jingle
  notes: Launched 6 March 2000 as the first private national-coverage commercial radio in the Czech Republic; broadcasts on a nationwide network of FM frequencies plus DAB+ and online; consistently ranks among the top two Czech commercial radio stations alongside Frekvence 1; ownership transferred from German Eurocast/Lagardère to Czech entities and eventually under Agrofert/MAFRA after Babiš's acquisition of MAFRA in 2013, which has been criticised by press-freedom NGOs (Reporters Without Borders, IPI) as a politically problematic concentration
