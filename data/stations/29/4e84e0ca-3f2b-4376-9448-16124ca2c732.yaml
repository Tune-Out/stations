  nature: public broadcaster
  operator: NPO (Nederlandse Publieke Omroep) — the Dutch public broadcasting umbrella organisation; NPO Radio 2 is produced by a consortium of pillar broadcasters including AVROTROS, BNNVARA, EO, KRO-NCRV, MAX, NTR and VPRO
  affiliations: Statutory Dutch public broadcasting system funded primarily through the Dutch government media budget; contributing member broadcasters include EO (Evangelische Omroep, Protestant) and KRO-NCRV (Catholic/Protestant roots) but the channel itself is editorially independent and non-religious
  audience: General adult Dutch-speaking audience in the Netherlands (25-55+), nationally broadcast
  format: Adult contemporary / album-oriented pop and rock, soul, jazz, singer-songwriter; DJ-led music programming including live performances (Muziekcafé) and the annual Top 2000 listener-voted countdown
  notes: One of the most-listened-to public radio stations in the Netherlands. Available nationally via FM, DAB+, cable and online. Tagline "Er is maar één NPO Radio 2" ("There is only one NPO Radio 2"). The Top 2000, broadcast in the week before New Year, is a major national cultural event. Operates from Hilversum, the Dutch broadcasting hub.
  sources: https://www.nporadio2.nl/, internal knowledge
