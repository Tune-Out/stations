  notes: Générations R&B is one of roughly thirty thematic web streams of Générations, the French hip-hop and soul station authorised by the CSA on 15 June 1992 and owned by the Lyon-based Espace Group. The parent station broadcasts on 88.2 FM in Paris, 101.5 FM in Lyon and nationwide on DAB+ from studios in Paris's 20th arrondissement, describes itself as "hip-hop soul radio" and belongs to Les Indés Radios. Its web verticals split the catalogue into rap français, rap français gold, rap US, R&B, reggae, funk and soul; this channel (streamed as generationfm-slowjam) carries R&B and slow jams. The station is a category-B private broadcaster directed by Christophe Mahé.
