  notes: "Chilango Radio launched in 2023 as a 105.3 FM Mexico City project and digital station built around the Revista Chilango / Sopitas.com / Capital Digital media ecosystem. The \"Convoy Network\" branding reflects content partnerships with Olallo Rubio's Convoy FM. Self-described mission: \"Construimos marcas de contenidos con audiencias fieles\" (We build content brands with loyal audiences) and the tagline \"La Radio Que Viene, Viene\" suggests a \"new wave\" positioning. Notable programs include \"Somos Un Chingo\" (breakfast, branded as \"tu guía para sobrevivir a la Ciudad de México\"), \"SopitasFM,\" \"Alex Fernández en Chilango,\" \"Convoy FM con Olallo Rubio,\" and food show \"Glotones.\" Editorial line is mainstream urban entertainment with progressive/cosmopolitan CDMX bent."
