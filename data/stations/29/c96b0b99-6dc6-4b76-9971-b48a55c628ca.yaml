  nature: public broadcaster
  operator: Raidió Teilifís Éireann (RTÉ), Ireland's national public-service broadcaster
  affiliations: European Broadcasting Union (EBU); operates under the Broadcasting Act 2009 with oversight from Coimisiún na Meán (Ireland's media commission); funded by Ireland's TV licence fee and commercial revenue
  audience: Irish (and international) classical-music listeners; adult demographic with interest in classical, opera, jazz, world and arts/culture programming
  format: Classical music, opera, jazz, world music, arts and culture talk programming in English (with some Irish-language content)
  notes: RTÉ lyric fm launched on 1 May 1999 as RTÉ's third national radio station, replacing the earlier FM3 Music service and based in Limerick (a notable regional posting outside Dublin); it serves as Ireland's only national classical and arts-format station, broadcasting on FM (96–99 MHz), DAB, Saorview, Saorsat, satellite, and online; notable programming includes the long-running breakfast show, "Lyric Live" concert broadcasts (recordings from venues like the National Concert Hall), and partnerships with the RTÉ National Symphony Orchestra and RTÉ Concert Orchestra; faced funding-driven controversy in 2019 when RTÉ announced (and later partially walked back) plans to relocate the station from Limerick to Dublin amid the broadcaster's wider cost-cutting.
  sources: internal knowledge only
