  operator: Al Rasheed Media Group (Al Rasheed Satellite Channel / قناة الرشيد الفضائية)
  affiliations: Privately owned Iraqi media group; widely reported to have ties to Sunni Arab political figures and the Iraqi Awakening / National Dialogue Front circles, though officially presents as independent
  audience: Arabic-speaking Iraqi listeners (primarily Baghdad and central Iraq) and pan-Arab audiences via satellite/web
  format: Arabic-language news, talk, current affairs, sports, entertainment, music, and cultural programming with flagship live shows such as "الثامنة" (The Eighth)
  notes: Al Rasheed launched in 2007 as part of the post-2003 expansion of private Iraqi broadcasters; the FM radio service is the audio arm of Al Rasheed TV, headquartered in Baghdad with bureaus in Erbil and other Iraqi cities; positions itself with the tagline "معك اينما تكون" (With you wherever you are) and distributes across satellite, FM, YouTube, Facebook, Instagram, TikTok, Telegram, and mobile apps; like much Iraqi private media, its editorial line is widely associated with specific political and tribal patrons but ownership details are not publicly disclosed on the official site.
