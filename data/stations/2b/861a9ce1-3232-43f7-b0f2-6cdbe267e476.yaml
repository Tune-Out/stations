  operator: Nova Press / Nova group, founded and historically led by Jean-François Bizot
  affiliations: none formal; left-leaning, culturally progressive editorial sensibility; associated with the Nova magazine and Nova Records ecosystem
  audience: Urban, culturally curious adults in France interested in world music, alternative and underground scenes; broadcasts in Paris and other French cities on FM and worldwide via internet
  format: Eclectic "musique éclectique" mix of world music, hip-hop, reggae, dub, soul, electro, trip-hop, folk and alternative rock, with cultural magazines and city-life information ("Le Grand Mix")
  notes: Radio Nova was founded in 1981 by journalist and counterculture figure Jean-François Bizot together with Jean-Loup Hertzog as part of France's "radios libres" movement after the deregulation of FM; long famous for inventing the slogan "Le Grand Mix" and championing world music and hip-hop in France; the parent Nova Press group also published the iconic counterculture magazine "Actuel" and "Nova Magazine"; after Bizot's death in 2007 the station went through several ownership changes including the Perdriel group (Le Nouvel Observateur owner Claude Perdriel) and was later acquired in 2015 by the Tatone family / Nova Press group; remains a touchstone of independent, anti-mainstream French radio.
  sources: internal knowledge only
