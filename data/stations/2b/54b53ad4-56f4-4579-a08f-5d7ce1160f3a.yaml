  format: 24/7 contemporary dance, electronic, pop and urban music with local presenters, specialist mix shows, and community talk.
  notes: Fresh 92.7 is Adelaide's dance music community radio station, licensed under Australia's community broadcasting framework and operating on 92.7 MHz FM from a studio in the Adelaide CBD. It originally launched in the 1990s under the Three D Radio / SA-FM heritage of community licences, taking its current Fresh 92.7 identity in 2002. Programming features local breakfast and drive shows (e.g. "Brekkie with Tom & Callum", "The Drive Home"), the "Wavelength" specialist program, and "Fresh Off The Block" new-music showcase. Funding comes from sponsorship, subscriptions and donations rather than advertising. The station is staffed largely by volunteers and trains emerging announcers and producers under Australia's community radio sector.
