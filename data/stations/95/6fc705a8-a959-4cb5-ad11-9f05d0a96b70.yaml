  notes: Hit West is a French Category B regional commercial network covering Brittany and the Pays de la Loire, formed in 2001 from the merger of Fréquence Ille and Radio Nantes and headquartered in Nantes. It plays a top-40 hits format with regional news updates and runs local décrochages in more than sixteen cities; this entry is the Brest local edition. Ownership passed from SIPA / Ouest-France to Groupe 1981 in May 2026, and the network is carried on FM, DAB+ and streaming. The stored homepage is just the raw stream URL and should point at the network site instead.
