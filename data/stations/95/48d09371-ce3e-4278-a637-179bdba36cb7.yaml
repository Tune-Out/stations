  notes: radioeins launched in 1997 as the successor to SFB's Radio 4U and is one of rbb's flagship stations; known for ambitious cultural programming, regular live concerts and DJ sessions, and hosts such as Knut Elstermann (film), Volker Wieprecht and Robert Skuppin (Die schöne Woche); the "56 kbit/s" stream listed here is a low-bitrate mobile stream; rbb itself was formed in 2003 by the merger of SFB (West Berlin) and ORB (Brandenburg) and has been the subject of major governance scandals around former director-general Patricia Schlesinger in 2022.
