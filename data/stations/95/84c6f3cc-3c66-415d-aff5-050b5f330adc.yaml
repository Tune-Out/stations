  notes: Cadena Dial is a Spanish national commercial music network launched on 3 September 1990, evolving out of an earlier format called Radio Corazón. It is operated by Prisa Radio, the radio arm of Grupo Prisa, alongside Cadena SER and Los 40. Its defining editorial rule is that it plays only Spanish-language music, promoted with the tagline "Lo mejor de nuestra música", and it reaches roughly 1.66 million listeners on 2025 figures, making it Spain's third most-listened music station behind Los 40 and Cadena 100. It carries on 107 FM frequencies plus TDT, satellite and streaming, and since 1996 has staged the annual Premios Dial, held at the Auditorio de Tenerife since 2007.
