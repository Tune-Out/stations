  notes: RTÉ Radio 1 is Ireland's national public-service radio station and the most-listened-to station in the country, descended from Dublin's 2RN which began regular broadcasts on 1 January 1926. Operated by Raidió Teilifís Éireann and funded by the TV licence plus advertising, it offers a full-service mix of news, current affairs, talk, documentary, arts and music, anchored by 'Morning Ireland', 'Liveline' and 'Drivetime'. It broadcasts on FM 87.8-90.0 MHz across Ireland, on DAB/satellite and online; this is the catalog's most-voted RTÉ Radio 1 entry.
