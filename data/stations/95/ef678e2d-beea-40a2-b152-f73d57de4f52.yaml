  nature: state media
  operator: China Media Group (中央广播电视总台, CMG) — the central state broadcaster formed in 2018 by merging China Central Television (CCTV), China National Radio (CNR) and China Radio International (CRI); 环球资讯广播 (Huánqiú Zīxùn Guǎngbō, "Global Information Radio", branded "EZ FM 905" / "CRI News Radio") is run from CMG's News Center.
  affiliations: Chinese government / Chinese Communist Party (CCP); CMG reports to the Publicity Department of the CCP Central Committee and is subject to the same propaganda guidance as CCTV; the original CRI was directly state-owned and -operated.
  audience: Domestic Chinese-language listeners interested in international news and global affairs; broadcasts in Mandarin nationwide and online; FM 90.5 in Beijing (the "905fm" tag) with relays in other major cities.
  format: 24-hour rolling international news and information — politics, economy, business, lifestyle, culture and sport — with live news bulletins, analytical talk shows, foreign-correspondent reports and lifestyle segments; mission statements include "世界在你耳边" ("World at your ear") and "国际化生活，从环球资讯开始" ("International lifestyle, starting from Global Information Radio"); self-described as "China's only radio frequency primarily focused on international information and broadcasting nationally".
  notes: 'CRI News Radio (环球资讯广播 / "EZ FM 905") is a 24-hour Mandarin-language international news and current-affairs channel run by China Media Group''s News Center, successor to China Radio International''s domestic news service; broadcasts on Beijing FM 90.5 and online. Editorial flag: Operated by China Media Group (CMG), which reports to the CCP Central Committee''s Publicity Department and lacks editorial independence; CMG/CRI outlets have been designated foreign missions by the U.S. State Department (2020) and related CGTN licence was revoked by UK Ofcom (2021) for lack of impartiality. Editorial flag: CRI News Radio (环球资讯广播 / EZ FM 905) is China Media Group''s news-and-politics channel under CCP Publicity Department guidance — an in-scope CRI political channel.'
  sources: https://newsradio.cri.cn/; https://en.wikipedia.org/wiki/China_Radio_International
