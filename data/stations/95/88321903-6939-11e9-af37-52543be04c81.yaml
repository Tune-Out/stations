  format: Curated soul, funk, disco, rare groove, gospel, R&B, smooth jazz, slow jams, and soulful house - 150+ DJ-hosted themed shows alongside non-stop music programming
  notes: "London Soul Radio (also branded \"The Soul of London Radio\") is a community-driven online radio dedicated to classic and contemporary soul music. Its self-description: \"a group of guys and girls who are passionate about soul music\" committed to \"keep the music flowing every day, uninterrupted.\" The station leans into London's longstanding rare-groove, modern soul, and northern-soul scenes that have thrived in the city since the 1970s. Streams are delivered via Airtime Pro (Sourcefabric), a popular open-source community-radio cloud platform."
