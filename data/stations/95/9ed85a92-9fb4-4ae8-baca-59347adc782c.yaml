  nature: public broadcaster
  operator: Türkiye Radyo ve Televizyon Kurumu (TRT — Turkish Radio and Television Corporation), the Turkish state public-service broadcaster
  affiliations: Türkiye government / Turkish state (TRT is a state-owned public broadcaster funded by an electricity-bill levy and answerable to a board approved by parliament/president)
  audience: Turkish-speaking general public seeking news, particularly in Turkey but also via international shortwave/online
  format: 24/7 news radio with bulletins, news commentary, traffic, weather, health, sports recaps, and joint programming with TRT Haber TV
  notes: TRT was established in 1964 as Türkiye's public broadcaster; TRT Radyo Haber is its dedicated all-news network, broadcast on FM in major Turkish cities (Ankara 95.0, Istanbul 99.6, Izmir 94.1/100.2) and online; mission stated as "Halkın sağlıklı haber alması için doğru, tarafsız, hızlı habercilik" ("Correct, impartial, fast journalism so the public receives healthy news"); TRT has been frequently criticised by press-freedom organisations (RSF, CPJ) and opposition figures for pro-government bias under successive AKP administrations.
