  notes: 'Antena 1 is a commercial FM station in São Paulo broadcasting on 94.7 MHz (callsign ZYD 823) and serving Greater São Paulo and the Baixada Santista. Founded on 2 September 1975 (initially on 94.5 MHz, moving to 94.7 in 1982), it is owned by Orlando Negrão Júnior and heads the Antena 1 network of affiliates across Brazil. Its slogan is "A número 1 em música": an adult-contemporary format of mostly English-language soft pop and rock with 56 minutes of music per hour and brief news and commercial breaks, plus music-industry news on its website. The station promotes itself as "a rádio online mais ouvida do Brasil" and distributes via web, apps, smart speakers and smart TVs.'
