  nature: public broadcaster
  operator: Etablissement de la Radio Tunisienne (Tunisian Radio / al-Idha'a al-Tunisiya), state-owned national broadcaster of Tunisia
  affiliations: Tunisian state media, supervised by the Tunisian government and historically regulated by HAICA (Haute Autorite Independante de la Communication Audiovisuelle)
  audience: Tunisian Arabic-speaking listeners in the Sfax governorate (central-eastern coastal Tunisia) and the wider Sahel region
  format: Regional public radio - news, sport, cultural and religious programming, talk and music, mixing Tunisian Arabic and Modern Standard Arabic
  notes: Radio Sfax (Idha'at Sfax) is one of the regional stations of the Etablissement de la Radio Tunisienne (ERT), the public-service successor to the broadcaster originally set up as ERTT and split from television in 2007; it serves the Sfax region (Tunisia's second-largest city and main southern economic hub) with local newscasts, weather, sports (notably football coverage of Club Sportif Sfaxien and Sfax Railway Sports), magazine shows like "Ahla Sabah", "Fi Khidmatikom" and "Echo Sport", and cultural / heritage programmes; alongside national stations (Radio Tunis, Radio Jeunes, Radio Culturelle, RTCI) it is part of a network of about ten regional radios under the public broadcaster.
  sources: http://www.radiosfax.tn/, internal knowledge
