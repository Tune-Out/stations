  operator: Top Congo SARL, founded by Congolese journalist and senator Modeste Mutinga Mutuishayi
  affiliations: editorially independent private station; founder Modeste Mutinga is a former senator who has been politically active in opposition and government roles, but the station presents itself as independent news radio
  audience: French- and Lingala-speaking listeners in Kinshasa and the wider Democratic Republic of the Congo
  format: News / talk and African music — flagship news bulletins, debate shows, listener call-ins and Congolese rumba / soukous / urban music
  notes: Top Congo FM, broadcasting on 88.4 MHz in Kinshasa, is one of the DRC's most influential private radio stations, founded in 2001 by Modeste Mutinga (also founder of Le Potentiel newspaper); it is widely cited by international media (RFI, BBC, Reuters) as a source for Congolese politics and has been targeted at times of political tension — including being briefly taken off air during election crises — for its critical news coverage; it remains a primary news outlet for the Kinshasa political class.
  sources: internal knowledge of DRC media landscape (Top Congo FM, Modeste Mutinga, Le Potentiel)
