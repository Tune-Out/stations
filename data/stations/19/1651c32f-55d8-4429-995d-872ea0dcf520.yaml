  operator: "Brownswood Recordings Ltd / Gilles Peterson's Worldwide media company, London (founder: DJ and broadcaster Gilles Peterson)"
  affiliations: none political/religious; closely linked to Peterson's Brownswood label and the global underground/jazz/electronic scene
  audience: International music enthusiasts of jazz, electronic, soul, Afro, Latin, world and underground club music; cosmopolitan adult listeners
  format: Curated DJ-led global music platform spanning jazz, electronica, soul, funk, broken beat, Afro, Latin, ambient and experimental sounds with shows from London, Berlin, Barcelona, Tokyo, Manila, Accra and other cities
  notes: Launched in 2016 from London's Kings Cross as the successor to Peterson's earlier "Worldwide" brand on BBC Radio 1/6 Music; the station went on hiatus in 2023 and relaunched in 2024 via the Radiocult.fm platform on a membership-supported model (£6/month) after the original studio's closure. Programming includes Peterson's own shows, the "New Voices" discovery series, "Women Shaping Radio" and rotating curator slots ("Friday Curates"), plus genre programmes such as "Sol Infinito", "Mellow Madness" and "Space Grapes". Self-described as "a global music radio platform... connecting people through music that transcends borders and cultures."
