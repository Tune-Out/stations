  nature: public broadcaster
  operator: Radio Television Suisse (RTS), the French-language unit of SRG SSR (Swiss Broadcasting Corporation), the Swiss public service broadcaster.
  affiliations: SRG SSR is Switzerland's federally-mandated public broadcaster funded primarily by the Serafe household licence fee and supplementary advertising; politically independent under federal media law (Loi sur la radio et la television, LRTV).
  audience: "French-speaking Switzerland (Suisse romande): Geneva, Vaud, Neuchatel, Fribourg, Valais, Jura, plus French-speaking expats; French-language"
  format: 'Generalist talk-and-music public radio: news, current affairs, interviews, cultural magazines, entertainment, sport and music ("La radio generaliste de la Suisse romande").'
  notes: La 1ere (formerly La Premiere) is RTS's flagship generalist station, the successor to the historic RSR (Radio Suisse Romande) "Premier Programme" launched in 1922 making it among the oldest French-language radio services in the world. Renamed La 1ere in 2012 as part of RTS's brand consolidation when SSR-SRG merged Television Suisse Romande and RSR. Notable programmes include "Forum" (current-affairs debate), "On en parle" (consumer affairs), "La Matinale" (morning news) and live sports coverage. Broadcasts on FM and DAB+ across Romandy with the studios at the Maison de la Radio in Lausanne and Geneva.
  sources: http://programmesradio.rts.ch/la-1ere/, internal knowledge of SRG SSR
