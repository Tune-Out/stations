  nature: public broadcaster
  operator: Südwestrundfunk (SWR), the regional ARD public broadcaster for Baden-Württemberg and Rhineland-Palatinate.
  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten); public-service broadcaster funded by Germany's Rundfunkbeitrag (household licence fee) under the Medienstaatsvertrag.
  audience: Young listeners aged roughly 14–29 in south-western Germany; German-language.
  format: Youth-oriented contemporary hits radio — pop, rock, hip-hop, electronic and indie — with topical news, comedy and culture features aimed at Generation Z and millennials.
  notes: DASDING launched in 1997 from Baden-Baden as SWR's youth wave (initially as the joint youth project of SDR and SWF before their 1998 merger into SWR); broadcasts on FM in parts of BW and RP, on DAB+ across both states, and as a livestream/digital brand at dasding.de; sister to bigFM and Sputnik (MDR) in the German "junge Wellen" landscape; carries no commercial advertising as it is licence-fee funded; the brand also runs themed streams (DASDING Sprechstunde, Lyrix, Plattenbau, etc.) and hosts the Dasding Sprungbrett showcase for emerging German-language artists.
