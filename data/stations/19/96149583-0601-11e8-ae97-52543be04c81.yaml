  nature: commercial
  operator: Chante France SAS, part of Groupe HPI (Hubert Predhumeau Investissements / HPI Medias)
  affiliations: none known political/religious; member of independent French commercial radio sector (SIRTI / SNRL adjacent)
  audience: French-speaking adults 35+ nostalgic for francophone song; this 60's sub-stream targets older listeners and yeye/chanson-francaise fans worldwide
  format: 24/7 web-radio sub-channel of Chante France dedicated exclusively to French songs from the 1960s - the era of Johnny Hallyday, Sylvie Vartan, Francoise Hardy, Serge Gainsbourg, Jacques Dutronc, Claude Francois, France Gall and the yeye movement.
  notes: Chante France launched in 1996 in Paris as an FM station with a strict 100% French-language song format ("Actualite de la Chanson Francaise"), making it the first French chanson-only commercial radio; it lost its Paris FM frequency in 2008 after CSA reallocation and now operates as a national DAB+ and online network with multiple thematic sub-streams (Nouveautes, Emotion, Party, 60s, 70s, 80s, 90s/2000s) plus podcasts and acoustic sessions; the brand is owned by Groupe HPI alongside other French independent radio assets and finances itself through advertising and brand partnerships; no religious or political affiliations.
  sources: http://www.chantefrance.com/, internal knowledge
