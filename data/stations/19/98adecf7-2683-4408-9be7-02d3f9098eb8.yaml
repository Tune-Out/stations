  nature: public broadcaster
  operator: BBC (British Broadcasting Corporation), the UK public service broadcaster established by Royal Charter
  affiliations: UK public service broadcaster; editorial independence guaranteed by the BBC Royal Charter and overseen by Ofcom. BBC World Service was historically funded by a grant-in-aid from the UK Foreign and Commonwealth Office (now FCDO) and since 2014 primarily from the UK TV licence fee, supplemented by FCDO grants. No party-political, religious, or commercial advertising affiliations on the domestic-rules service.
  audience: Global English-speaking audience (and 40+ other language services on sister streams); aimed at international listeners seeking impartial news and analysis
  format: 24-hour international news, current affairs, analysis, documentaries, business and culture programming in English
  notes: Founded 1932 as the BBC Empire Service; renamed BBC World Service in 1965. Broadcasts to an estimated 300+ million weekly listeners worldwide across all languages, making it the largest international broadcaster. Distributed via shortwave (historically), FM relays, partner stations, satellite and online. Known for flagship programs such as "Newshour", "World Business Report" and "The Documentary".
