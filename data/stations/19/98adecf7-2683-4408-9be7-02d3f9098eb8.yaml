  affiliations: UK public service broadcaster under Royal Charter; funded by the TV licence fee plus FCDO grant-in-aid and limited commercial income
  audience: Global English-speaking audience seeking international news; 450 million weekly reach across all World Service languages
  format: 24-hour international news, current affairs, documentaries, business, science and sport in English
  notes: BBC World Service is the BBC's international broadcaster, launched on 19 December 1932 as the Empire Service and based at Broadcasting House in London since 2012. It broadcasts in English and 27 other languages, reaching around 450 million people weekly in 2024 across radio, TV and online, making it the world's largest international broadcaster. Funding moved from Foreign Office grant-in-aid to the licence fee in 2014, now supplemented by about £254 million a year from the FCDO; in 2025 the government agreed an 8% increase over three years after cut proposals. Flagship programmes include Newsday, Newshour, World Business Report and The Documentary. This entry is the English-language international stream.
