  notes: sunshine live launched 1 January 1997 in Mannheim and is Germany's leading electronic-dance-music broadcaster, transmitting on DAB+ nationally and on FM in parts of southwestern Germany (Mannheim/Rhein-Neckar region). It operates 40+ themed web sub-channels covering every EDM sub-genre (House, Trance, Techno, Hardstyle, Drum'n'Bass, Goa, Minimal, Melodic Techno, etc.) and is the official radio partner of major European electronic festivals such as Time Warp Mannheim, Nature One, Mayday, World Club Dome, Airbeat-One, Parookaville, and SonneMondSterne. The Melodic Techno channel reflects the rise of the melodic / progressive techno scene since the mid-2010s exemplified by labels like Afterlife.
