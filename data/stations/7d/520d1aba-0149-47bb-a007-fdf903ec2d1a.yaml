  notes: Dhaka FM 90.4 is a private commercial FM station based at Navana Tower, Gulshan, Dhaka, Bangladesh, launched in early 2016. The broadcaster self-describes as "the first Full HD Radio station in Bangladesh" and "the Largest FM Radio Network in Bangladesh." It operates in a market regulated by the Bangladesh Telecommunication Regulatory Commission (BTRC) under private commercial FM licences introduced from the mid-2000s. Programming targets young urban Bangla-speaking audiences with a mix of music, entertainment, RJ-led talk shows, and news bulletins.
