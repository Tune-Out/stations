  notes: Radio Shanson is a Russian national commercial station devoted to the chanson genre, launched in Moscow on 15 August 2000 by former Russkoye Radio executives and broadcasting on 103.0 FM in Moscow since April 2001. It reaches more than 1,700 towns in Russia, Belarus, Armenia and Transnistria with about 5.6 million daily listeners (2024), mixing chanson, pop, bard songs, urban romance and film music with news and entertainment. Since April 2015 it has belonged to structures of businessman Mikhail Gutseriev within the Krutoy Media holding; Gutseriev has been under EU and UK sanctions since 2021 over Belarus, though the station itself is not designated. The old radioshanson.fm domain has lapsed and now redirects to a spam survey page.
