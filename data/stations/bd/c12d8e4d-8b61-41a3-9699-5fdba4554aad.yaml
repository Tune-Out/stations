  notes: The name "Huna Aden" (هنا عدن — "This is Aden") echoes the historic call-sign of Aden Radio that broadcast from the British colony (and later the People's Democratic Republic of Yemen / South Yemen) from the 1950s through unification in 1990; the contemporary "Huna Aden FM" is a revival-style brand that emerged amid the post-2015 Yemeni civil war, when Aden again became the seat of the internationally recognised Yemeni government and the Southern Transitional Council (STC); streams via RadioBoss with social-media presence on Facebook (the catalog's homepage URL points to facebook.com/HunaAdenFM); specific ownership, license-holder, and political affiliation could not be confirmed from public sources.
