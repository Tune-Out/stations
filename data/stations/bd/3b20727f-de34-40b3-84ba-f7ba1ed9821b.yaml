  operator: Radio Ashams Ltd (راديو الشمس), based in Nazareth, Israel
  affiliations: Arabic-language community media serving Palestinian citizens of Israel; not formally affiliated with any party but editorially aligned with Arab-citizen civic and political concerns
  audience: Arabic-speaking Palestinian citizens of Israel (the "1948 Arabs"), with reach into the West Bank diaspora and Arab listeners worldwide via streaming
  format: News-talk and music in Arabic — breaking news, current affairs, local correspondents' reports from Galilee, Triangle, Naqab/Negev and mixed cities, plus Arabic pop and heritage music
  notes: Radio A-Shams ("The Sun") is one of the most prominent commercial Arabic-language stations licensed inside Israel, founded in the early 2000s to serve the country's roughly two-million-strong Arab Palestinian minority; broadcasts on FM (notably 101.7 MHz in northern Israel) and online; programming emphasizes local Arab community news from Nazareth, Galilee, the Triangle, the Negev and Jerusalem ("أخبار عاجلة" / breaking news), interspersed with talk shows, music and podcasts; sister to the ashams.com news portal.
