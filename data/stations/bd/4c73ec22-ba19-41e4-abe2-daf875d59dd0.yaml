  notes: ABC Radio Melbourne, still identified by its 774 kHz AM frequency and the historic call sign 3LO, is the Australian Broadcasting Corporation's metropolitan talk station for Melbourne. It first went to air on 13 October 1924 with an outside broadcast of La Bohème featuring Dame Nellie Melba and passed to the ABC on its formation in 1932. Programming is local news, talkback, current affairs and sport from the ABC Southbank Centre, and the station is Victoria's designated emergency broadcaster; the "774" branding was retired in the 2017 network rename.
