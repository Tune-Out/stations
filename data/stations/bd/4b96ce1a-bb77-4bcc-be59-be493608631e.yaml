  notes: BFM Radio is a French news/business radio brand under the BFM media group. BFM Business is the dedicated 24-hour business news channel (FM in Paris on 96.4 MHz and DAB+ nationally) launched in 1991 as Radio Classique-Business / BFM (Business FM). The broader BFM brand includes the BFMTV rolling news television channel (France's leading news network). The group was for many years controlled by NextRadioTV under Patrick Drahi's Altice Media, but was acquired by CMA CGM (the French shipping conglomerate owned by the Saadé family) in 2024, becoming CMA Media. The brand has occasionally faced criticism over editorial independence given ownership concentration in the hands of major industrialists, but does not have a declared political affiliation.
