  operator: Radio Canela (Ecuadorian commercial radio network with multiple regional concessions, headquartered in Quito)
  affiliations: none known
  audience: General Ecuadorian audience in Pichincha province (Quito metropolitan area) and nationally; popular with working-class and middle-class adult listeners
  format: Popular tropical and Latin music — chicha, cumbia, salsa, vallenato, Latin rock, folkloric Ecuadorian music — with humor-driven morning shows and accountability segments
  notes: Radio Canela is one of Ecuador's largest popular-music radio networks, operating in nineteen-plus provinces including Pichincha, Guayas, Manabí, Imbabura, El Oro, and Azuay; the Pichincha feed (typically 102.9 FM in Quito) serves the capital region; the network markets itself as "Original como tú" and "Humildemente los primeros" (positioning as the nation's audience leader); it features regional personality-driven programming with locally produced morning shows in each market; the brand emphasises Ecuadorian popular culture and music.
