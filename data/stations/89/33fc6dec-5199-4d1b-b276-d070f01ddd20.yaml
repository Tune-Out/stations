  audience: Pulaar/Fulani and Wolof-speaking population of the Matam region of north-eastern Senegal, with French as a secondary language
  format: Community radio with regional news, religious programming, talk and music drawn from local Senegalese and Pulaar traditions
  notes: Timtimol FM broadcasts on 91.9 MHz from Ourossogui in the Matam region of north-eastern Senegal, close to the Mauritanian border in the Fouta Toro/Haalpulaar cultural area; "timtimol" is a Pulaar word referring to a butterfly or to dawn/dusk and is a common name in Pulaar cultural projects; the station functions as a community broadcaster serving a predominantly rural, pastoralist audience, typical of Senegal's robust community radio sector regulated by the CNRA, and has no widely documented religious or political affiliation beyond standard local civic and Islamic community programming.
