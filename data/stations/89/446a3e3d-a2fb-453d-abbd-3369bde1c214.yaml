  format: Sports news, coverage, analysis and live play-by-play of major sporting events (football, basketball, athletics, etc.)
  notes: ERA Sport (ΕΡΑσπορ) is the dedicated sports channel of ERT, the Greek public broadcasting organization established in 1938. ERT operates three main radio networks (ERT First/Πρώτη, ERT Second/Δεύτερο, and ERT Third/Τρίτη) plus thematic services like ERA Sport. ERA Sport provides comprehensive coverage of Greek and international athletics, with special focus on Super League Greece (AEK Athens, Olympiacos, Panathinaikos) and Greek national teams. ERT is governed by the Hellenic Parliament and its board and is funded through a combination of licence fees (collected via electricity bills) and governmental subsidy. The broadcaster is subject to Greek and EU broadcasting regulations. Streams via ERT's CDN at 256 kbps MP3.
  sources: https://webradio.ert.gr/eraspor/, internal knowledge of Greek public broadcasting
