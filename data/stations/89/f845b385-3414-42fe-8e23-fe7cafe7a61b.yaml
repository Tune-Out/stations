  audience: South-Asian (primarily Indian/Hindi-Bollywood) expatriate community across the UAE, broadcasting in Hindi
  format: Hindi/Bollywood adult contemporary hit music with morning drive, weekly charts, request shows and live events ("we don't just play the hits; we own the conversation")
  notes: BIG FM 106.2 in the UAE is the Dubai-based affiliate of the wider Reliance BIG FM Indian radio brand, operated locally by FunAsia Radio under a licensing arrangement; serves the large South-Asian diaspora in the Emirates with Bollywood hits, RJ-led shows, and live community events; the station streams nationally on 106.2 FM across UAE; FunAsia is one of two major South-Asian-focused radio operators in the Gulf (alongside Radio Spice / City 101.6); like all UAE broadcasters it is subject to NMC content rules that prohibit criticism of UAE rulers, Islam, or "national values".
