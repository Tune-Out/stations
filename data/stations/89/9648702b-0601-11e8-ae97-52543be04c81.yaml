  nature: public broadcaster
  operator: Norddeutscher Rundfunk (NDR), an ARD-member public-law broadcaster (Anstalt des öffentlichen Rechts) serving Hamburg, Lower Saxony, Schleswig-Holstein and Mecklenburg-Vorpommern.
  affiliations: ARD (Arbeitsgemeinschaft der öffentlichen-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland); financed primarily by the German broadcasting contribution (Rundfunkbeitrag) collected via the Beitragsservice; independent of government per the NDR-Staatsvertrag and German constitutional jurisprudence.
  audience: News-oriented adult listeners in Hamburg and across northern Germany; German-language; this is the Hamburg regional opt-out feed of NDR Info.
  format: 'Information / spoken-word: rolling news, current affairs, business and politics, with cultural and background features, regional opt-outs and the iconic "NDR Info – Das Nachrichtenradio" branding.'
  notes: NDR was founded in 1955 (succeeding the British-occupation-era Nordwestdeutscher Rundfunk, NWDR, founded 1945); NDR Info launched in 1994 as NDR's dedicated info-radio service; landmark programmes include "Streitkräfte und Strategien", "Das Forum" and the long-running investigative magazine "Panorama"; NDR also co-produces investigative journalism with WDR and Süddeutsche Zeitung that has broken stories such as the Panama Papers and the Fußball-Leaks; the Hamburg variant carries Hamburg-specific news and traffic.
  sources: https://www.ndr.de/info/ (fetch blocked), internal knowledge of ARD/NDR structure and history
