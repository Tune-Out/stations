  notes: NTS Radio is an online music station founded in April 2011 by Femi Adeyemi in Hackney, London, which grew from a £5,000 start-up into a global platform with around six million monthly listeners and studios in London, Manchester, Los Angeles, Shanghai and elsewhere. It runs two ad-free live channels (this is Channel 2) of resident-hosted shows spanning underground electronic, jazz, experimental, hip-hop, global and archival music; roughly 40% of what it plays is not on Spotify. Universal Music Group took a minority stake in 2023 and over 700 residents hold share options; the station is widely regarded as one of the most influential curated music broadcasters online.
