  notes: WLVL broadcasts on 1340 AM from Lockport, New York, with an FM translator on 105.3 (W287CV), serving the Buffalo–Niagara Falls market under the "Hometown 1340" branding. It signed on in 1949 as WUSJ and took the WLVL calls — a nod to "Love Lockport" — in 1975; Bill Yuhnke's Kenmore Broadcasting Communications acquired it in January 2023. The schedule mixes local Lockport talk with Fox News Radio bulletins and syndicated programming, and it added NFL coverage through Compass Media Networks in 2025.
