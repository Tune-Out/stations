  notes: Vividh Bharati is the popular-entertainment service of All India Radio (Prasar Bharati, India's autonomous public broadcaster), launched 3 October 1957 and carried by around 40 regional stations; this entry is the AIR Hyderabad Vividh Bharati feed on 102.8 MHz FM. Programming is Hindi and Telugu film music, retro song shows such as Bhule Bisre Geet and Sangeet Sarita, radio plays, skits and interactive programmes for roughly 15-17 hours a day. The stream is AIR's official HLS feed on the Bitgravity CDN.
