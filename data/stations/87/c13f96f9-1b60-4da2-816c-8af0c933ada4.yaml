  notes: Vividh Bharati is one of All India Radio's (AIR) main national channels, delivering popular entertainment programming including Bollywood film music, Indian classical music, folk traditions and light entertainment. This particular listing is the 102.8 MHz FM transmission for Hyderabad, a major metro in Telangana state in southern India. AIR is India's national public broadcaster, established in 1936 and currently operated under the Ministry of Information and Broadcasting, Government of India. Vividh Bharati (meaning "Diverse India") launched nationally in 1957 and is one of AIR's most popular channels, reaching tens of millions of listeners across India. Streams via Akamai CDN (bitgravity.com) at HLS format (95 kbps AAC). AIR is funded through government budget and radio licence fees.
