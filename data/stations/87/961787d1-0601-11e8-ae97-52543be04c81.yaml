  notes: FRISKY (frisky.fm, formerly friskyradio.com) is an independent internet radio and DJ-mix service for underground electronic music, tracing its roots to 2001 and independently run since 2008. It streams 24/7 human-curated progressive house, deep house, techno and melodic electronica across several channels (Frisky, Deep, Chill, Classics), with resident DJ shows and an on-demand mix archive. The service is funded by a premium subscription (320 kbps, ad-free, offline listening) alongside a free 96 kbps tier; this catalog stream is the free main-channel feed. The old friskyradio.com domain now redirects to frisky.fm.
