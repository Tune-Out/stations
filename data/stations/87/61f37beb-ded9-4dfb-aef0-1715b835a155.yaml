  format: International news, current affairs, Japanese culture, language lessons; "RADIO 3" is one of three multilingual streams covering 17+ languages including English, Spanish, French, Arabic, Chinese, Korean, etc.
  notes: NHK World Radio Japan is the external service of Japan's public broadcaster NHK, founded in 1925 with international broadcasts beginning in 1935 as Radio Tokyo. It broadcasts via shortwave, satellite, and online streaming (delivered here through World Radio Network/Encompass Digital Media's shoutcast.wrn.org). The three "RADIO" streams rotate languages on a schedule; RADIO 3 typically carries the third rotation of the daily multilingual lineup. NHK operates under the Broadcast Act and is governed by a 12-member Board of Governors appointed by the Prime Minister with Diet consent; it is editorially independent but has periodically faced political pressure controversies (notably the 2014 chairman Momii remarks). Programming highlights include "NHK Newsline," "Radio Japan Focus," and Japanese language lessons.
