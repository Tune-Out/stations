  notes: Flashback FM is a small Brazilian web radio based in Serra Talhada in the interior of Pernambuco, streaming through the matutos.com.br hosting platform. It plays a continuous 'flashback' format of Brazilian and international hits from the 1970s through the 2000s, with blocks dedicated to romantic ballads and Saturday-night dance classics. Its website is a simple player page with links for Winamp, Windows Media and mobile apps, and no owner or licence details are disclosed; it does not appear to hold an FM licence despite the name.
