  notes: RTHK Radio 1 (香港電台第一台) is Hong Kong's flagship public-service news and information station, broadcasting on 92.6-94.4 MHz FM; established 1928 (originally GOW/ZBW). Following the 2020 National Security Law and editorial changes under the post-2021 leadership shift, RTHK's editorial independence and previously critical journalism have been significantly curtailed, with self-censorship and the removal of programmes documented by press-freedom groups including Reporters Without Borders and HKJA.
