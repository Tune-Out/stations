  notes: Skyrock is a French national commercial FM network founded in 1986 by Pierre Bellanger (Orbus SA) and repositioned in 1996 as France's first rap and R&B station ('Premier sur le Rap'). It broadcasts nationwide on FM and DAB+ and is the number-one radio in France among 13-34 year-olds, with around 3 million daily listeners in 2025 Médiamétrie surveys and the leading music station in Île-de-France. Flagship programmes include the morning show 'Difool' / 'Radio Libre' and the long-running 'Planète Rap' artist residency. The station has clashed with the regulator (CSA/Arcom) over content in the past but remains a mainstream, advertising-funded broadcaster; Skyrock also runs the Skyrock.com blog platform.
