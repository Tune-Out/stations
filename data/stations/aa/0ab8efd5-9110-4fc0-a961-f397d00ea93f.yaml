  operator: anonymous Zeno.fm user (Zeno Media LLC hosts the stream; the source material is performances by Deyun She / 德云社, but the station itself is not an official Deyun She channel)
  affiliations: content sourced from Deyun She (德云社), the major Chinese xiangsheng (crosstalk comedy) performance troupe founded in 1995 in Beijing by Guo Degang (郭德纲), Zhang Wenshun and Li Jing; the troupe itself is privately owned and not state-affiliated
  audience: Chinese-speaking listeners (Mandarin) interested in traditional comedic crosstalk performance; nominally targeted at mainland China though Zeno.fm is itself a U.S.-based platform often used for diaspora and overseas listeners
  format: 24/7 compilation playback of xiangsheng (相声) comedic dialogues — recorded performances by Guo Degang, Yu Qian (于谦), Yue Yunpeng (岳云鹏) and other Deyun She performers
  notes: Deyun She is the most commercially successful private xiangsheng troupe in modern China, credited with reviving the art form among younger urban audiences; it has been involved in occasional public controversies including censorship of some performers and disputes over apprentice-master relationships; this Zeno.fm stream simply loops publicly circulated audio of their performances and is described as "每天开心一下吧！" ("have some fun every day"); it is unlikely to be officially licensed by Deyun She or its members.
