  notes: Ibiza Global Radio is a commercial electronic-music station founded in August 2004 by Joan Tur Riera and broadcast from Ibiza on 97.6 FM, with an international online audience and a companion Ibiza Global TV channel. It positions itself as the voice of the island's club culture, airing DJ mixes, live sets from Ibiza venues, residencies and podcasts from name DJs, plus the retrospective Ibiza Global Classics channel and the Ibiza Global Festival. The station is widely regarded as a reference for the worldwide electronic scene and is operated by Ibiza Global TV S.L.
