  notes: Radyo 7 is a national Turkish commercial music station headquartered in Istanbul and operated within the Kanal 7 media group. Test broadcasts began on 7 September 1998 and regular transmission started on 1 February 1999; it is now carried by 53 transmitters across 41 provinces (Istanbul 104.6, Ankara 89.8 FM), plus satellite and internet. The format is "karma müzik" — a mix of Turkish pop, halk (folk), sanat, arabesk and nostalgia — with hourly news, under slogans such as "İyi Müzik Doğru Haber" and "Türkiye'nin Radyosu". Its parent group, which also runs Kanal 7 television, Ülke TV and Haber7, is a conservative Islamic-leaning media house, though the radio itself carries mainstream music rather than religious programming.
