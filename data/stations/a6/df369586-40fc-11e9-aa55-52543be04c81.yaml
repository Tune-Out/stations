  nature: commercial
  operator: Yeni Dünya İletişim A.Ş. / Hayat Görsel Yayıncılık (Kanal 7 media group)
  affiliations: Conservative Islamic-leaning media group. Kanal 7 (parent TV channel) was founded in 1993-1994 with backing from networks tied to Necmettin Erbakan's Islamist Welfare Party (Refah Partisi), and is widely regarded as Turkey's first nationwide Islamic-oriented broadcaster. The group has been associated with the Deniz Feneri (Lighthouse e.V.) charity corruption scandal. The radio itself focuses on Turkish music rather than overt religious content.
  audience: Turkey national, Turkish-speaking listeners; family-oriented; broadcast on FM in Istanbul, Ankara, İzmir, Bursa, Konya, Trabzon and elsewhere
  format: Turkish music radio - mix of Turkish pop, halk (folk), arabesk, sanat (classical Turkish art music), and nostalgia tracks; tagline "Hayata Müzik Katın Radyo 7" ("Add Music to Life with Radyo 7"); self-described "Türkiye'nin En İyi Türkçe Müzik Radyosu"
  notes: Sister radio of Kanal 7 TV (launched 1994) and Ülke TV. Part of a conservative media group that also includes Haber7.com news portal. The radio itself is a mainstream Turkish music station, but the parent group's ideological alignment is conservative/Islamic. Owner board historically included Zekeriya Karaman, Haşim Bayram, and others linked to the Milli Görüş (National Outlook) tradition.
  sources: http://www.radyo7.com/, https://turkey.mom-rsf.org/en/media/detail/outlet/kanal-7/, internal knowledge
