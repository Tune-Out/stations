  audience: Australian and international fans of the Triple j "Hottest 100" tradition; broadly Gen Z and Millennial alternative-music listeners
  format: Digital companion stream of triple j showcasing tracks from past Hottest 100 countdowns and listener-voted favourites across indie, rock, electronic and hip-hop
  notes: Triple j is the ABC's national youth music network, launched in 1975 as 2JJ in Sydney before going national as 2JJJ/Triple J on FM in 1989-90; the annual "Hottest 100" countdown, held each January, is one of the world's largest publicly voted music polls and a fixture of Australian summer culture (originally Australia Day, moved to the fourth weekend of January in 2018 after community debate over First Nations sensitivities); "Triple j Hottest" is the dedicated DAB+/digital stream playing songs from Hottest 100 lists year-round; programmed by triple j's Sydney-based music team.
