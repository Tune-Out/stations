  nature: commercial
  operator: COBRA SA / Radio Contact SA — part of RTL Belgium (now Audio Visual Group Belgium / DPG Media – Rossel joint venture after RTL Group divested its Belgian operations)
  affiliations: none political or religious; commercial broadcaster regulated by the CSA (Conseil Supérieur de l'Audiovisuel) in French-speaking Belgium
  audience: French-speaking adults (15–49) in Wallonia and Brussels; one of the top two commercial FM networks in francophone Belgium
  format: Hot adult contemporary / Top 40 — mainstream pop hits with morning shows, DJ-led drive-time and frequent national/local opt-outs across FM frequencies
  notes: Radio Contact began in 1980 as one of Belgium's first "free radio" stations in Brussels and grew into a national francophone commercial network; it has been a flagship of the RTL Belgium group for decades and was historically partnered with Bel RTL; after RTL Group sold its Belgian TV/radio operations to a joint venture of DPG Media and Rossel (completed in 2022), Radio Contact became part of the new Belgian audio-visual group; its Flemish counterpart is the separate Radio Contact NV in Flanders; the network broadcasts on multiple FM frequencies across Wallonia and Brussels and is one of the most-listened-to commercial radios in francophone Belgium.
  sources: internal knowledge only
