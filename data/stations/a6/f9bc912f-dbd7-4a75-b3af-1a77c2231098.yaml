  audience: General audience in the Austrian federal state of Carinthia (Kärnten), primarily German-speaking but with regular Slovenian-language programming for the autochthonous Carinthian Slovene minority
  format: "Regional full-service public radio: Austrian Schlager / oldies / popular music, hourly news, weather, traffic, regional reporting, sport, folk and minority-language programming"
  notes: ORF Radio Kärnten is one of nine ORF Bundesland regional stations, broadcast from the Landesstudio in Klagenfurt. It is notable for carrying Radio dva / Radio Agora content and other Slovenian-language slots ("Slovenski spored") under the public-service minority-language remit, reflecting Carinthia's bilingual heritage; it is also the area's lead source for severe-weather and civil-protection broadcasts. Like all ORF regional stations it is bound by the statutory obligations of objectivity, plurality, and federalism in the ORF-Gesetz.
