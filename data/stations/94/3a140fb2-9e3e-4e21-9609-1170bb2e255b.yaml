  operator: Guadeloupe la 1ère (Outre-mer 1ère network), a regional station of France Télévisions / France Médias Monde public service group
  affiliations: French state public broadcasting; part of the Réseau Outre-mer 1ère serving France's overseas departments and territories
  audience: Guadeloupe and the wider Antilles diaspora; bilingual French and Guadeloupean Creole
  format: Generalist regional public radio — news (info), local culture, traditional Antillean music plus zouk, kompa (compas) and Caribbean genres
  notes: Guadeloupe la 1ère is the Guadeloupe station of France Télévisions' overseas network (the former RFO, Réseau France Outre-mer, which was absorbed into France Télévisions in 2010 and rebranded "la 1ère" in 2018); it operates radio, television and digital services from Pointe-à-Pitre, providing public-service information, debate, sports, and a strong programming emphasis on Antillean musical heritage; this stream is the radio feed and the homepage points to a community blog re-listing of the official live link.
