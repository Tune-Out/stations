  nature: public broadcaster
  operator: Omroep Gelderland (Stichting Omroep Gelderland), the official regional public broadcaster for the province of Gelderland
  affiliations: Member of Stichting Regionale Publieke Omroep (RPO), the umbrella organisation for the 13 Dutch regional public broadcasters; funded primarily through the national Mediawet public-broadcasting allocation supplemented by limited advertising and provincial support; editorially independent under Dutch media law
  audience: Approximately 2 million residents of Gelderland province (Arnhem, Nijmegen, Apeldoorn, Ede, Tiel, Achterhoek, Veluwe, Rivierenland regions); Dutch-language with attention to local dialects
  format: Public-service regional radio — hourly Gelderland-focused news bulletins, traffic and weather, talk and call-in programming, mainstream music, sports (covering Vitesse Arnhem, NEC Nijmegen, De Graafschap, Go Ahead Eagles), and overnight automated music block "De nacht van Radio Gelderland"
  notes: Omroep Gelderland began television and radio broadcasts in 1989-1990 as part of the rollout of regional public broadcasters across the Netherlands; broadcasts on FM (103.5 MHz in much of the province plus local frequencies), DAB+, cable, and online; sister service TV Gelderland and the gld.nl news website; the broadcaster also produces podcasts and programmes such as "BuitenGewoon" and "Effe Buurten"; actively solicits citizen tips ("Tip de redactie"); operates from Arnhem.
  sources: https://www.gld.nl/radio/overzicht
