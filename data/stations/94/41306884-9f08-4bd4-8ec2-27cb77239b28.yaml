  notes: Hit FM is Ukraine's leading commercial CHR station, launched in 2003 and part of the TAVR Media holding (which also owns Kiss FM Ukraine, Radio ROKS, Russkoe Radio Ukraine, Melodiya FM, and others); its flagship morning show is "Хеппі Ранок" (Happy Morning) and the station runs the weekly listener-voted countdown "Хітова Дюжина". Following Russia's 2022 invasion, Ukraine's broadcast regulator required commercial stations to increase Ukrainian-language quotas and exclude Russian artists, which Hit FM complied with.
