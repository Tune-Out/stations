  notes: RMF FM is Poland's first and largest commercial radio station, launched in Kraków on 15 January 1990 and wholly owned by Germany's Bauer Media Group since 2006. It broadcasts nationwide on FM and DAB+ from its Kraków headquarters with an adult contemporary/CHR music mix and a strong hourly news operation (it created the Interia.pl portal in 2000 and runs the RMF24 news brand). Around 2017 it held roughly a quarter of Polish listening among 15-75 year olds, making it the country's market leader; sister stations include RMF Classic and RMF MAXX. Tadeusz Sołtys is the current director.
