  notes: Kiss 98 FM is the legacy brand of one of the Czech regional Kiss stations, which trace back to 1990 and were consolidated in May 2017 into a single national service, Radio Kiss, run by Radio United Broadcasting. The stream still carried in this entry now identifies itself as RADIO KISS and delivers the national adult contemporary format aimed at 25-40 year-olds, promoted as "To nejlepší od 90. let". The network transmits from Prague on 98.1 MHz at Strahov and from Brno on 88.3 MHz at Hády, with more than 60 further FM transmitters, and joined the nationwide DAB+ network on 4 February 2025. The old kiss98.cz domain no longer serves a website; the current official site is kiss.cz.
