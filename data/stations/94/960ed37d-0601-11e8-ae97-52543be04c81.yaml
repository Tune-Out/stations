  notes: Kiss 98 FM (often branded Kiss Hády after the Hády hill near Brno where its main transmitter is located) is a Czech regional commercial radio station broadcasting on 98 FM out of Brno, South Moravia. It is part of the Active Radio / Radio United-style commercial portfolio that historically grouped together regional "Kiss" franchises (Kiss Hády in Brno, Kiss Proton in West Bohemia, Kiss Jižní Čechy in South Bohemia, etc.) — these are not centrally networked but share branding and similar adult-contemporary pop formats targeting listeners 25–45.
