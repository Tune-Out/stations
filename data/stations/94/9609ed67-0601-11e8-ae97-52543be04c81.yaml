  notes: Cryosleep is one of three ambient streams of Echoes of Bluemars, a US hobbyist tribute project that preserves the music of Bluemars ("Music for the Space Traveler"), a cult internet station created by a user known as lone in late 2000 that went offline for good in July 2013. Run by a volunteer known as overridex, Echoes of Bluemars replays the complete archived Bluemars playlists on its own Icecast server, with Cryosleep dedicated to beatless, drone-like ambient and space music by artists such as Steve Roach, Biosphere, Jonn Serrie and Ian Boddy, marketed as "Zero Beat Guaranteed" for sleep. The service carries no advertising and has no terrestrial licence; sister streams are Bluemars and Voices from Within. The site is plain HTTP only.
