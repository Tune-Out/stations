  nature: commercial
  operator: Lagardère News (Europe 1 Télécompagnie), part of the Lagardère Group; since 2021 Lagardère is controlled by Vivendi / Bolloré Group (Vincent Bolloré)
  affiliations: editorially repositioned to the political right since the Bolloré takeover; widely covered in French press as moving toward the conservative line of CNews and Le Journal du Dimanche under the same ownership; no formal party or religious affiliation
  audience: French-speaking adults nationwide and Francophone Europe; one of the three historic "radios généralistes privées" alongside RTL and RMC
  format: Generalist talk-and-news radio ("généraliste") — news bulletins, political and current-affairs talk, magazines, sport (notably football) and a smaller music component
  notes: Launched on 1 January 1955 from Saarbrücken as Europe n°1, one of the original French "périphérique" stations broadcasting in French from outside French territory to escape the state monopoly on broadcasting; became a cultural institution under presenters such as Pierre Bellemare, Maurice Siegel and later Jean-Pierre Elkabbach; key role in covering May 1968 and decades of French political life; ownership passed through Hachette and then Lagardère Active; in 2021–2022 the Bolloré-controlled Vivendi acquired control of Lagardère, after which Europe 1 underwent a controversial editorial restructuring with mass departures of journalists who objected to the new line, and increased programme-sharing with sister channel CNews; broadcasts on FM, DAB+ and online across France from Paris headquarters on rue François 1er.
  sources: https://www.europe1.fr/ (HTTP 403 during fetch), internal knowledge
