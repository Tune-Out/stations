  nature: commercial
  operator: Yumor FM Belarus (Юмор FM, Belarusian franchise of the Russian comedy-radio brand owned by Gazprom-Media's Krutoy Media / GPM Radio group)
  affiliations: Belarusian broadcasters operate under Ministry of Information licensing in a heavily state-controlled media environment; the Yumor FM brand originates from Russia's GPM Radio holding
  audience: Russian- and Belarusian-speaking adults across Belarus, broadcasting on FM in Minsk (93.7), Grodno (89.9), Vitebsk (96.2), Mogilev (91.9), Brest (87.5) and Gomel (92.1)
  format: Comedy-led entertainment radio — humorous sketches, prank calls, satirical news ("Лента юмора"), interactive "Книга Жалоб" complaint segment and pop music; flagship morning show "Утро с Юмором" (07:00-10:00) with hosts Masha Neporyadkina and Yakov Nakhimovich
  notes: Yumor FM (literally "Humour FM") is a Russian comedy-radio format launched in Moscow in 2008 by GPM Radio (the radio arm of Gazprom-Media). The Belarusian operation re-broadcasts the brand across the country's six regional capitals; while the Belarus station is not directly state-owned, all Belarusian broadcasters require licensing from the Ministry of Information, which has shut down independent outlets since 2020. Programming is apolitical entertainment focused on humour and pop music, with the slogan promising things "легко и весело" (easy and fun).
  sources: http://humorfm.by/, internal knowledge
