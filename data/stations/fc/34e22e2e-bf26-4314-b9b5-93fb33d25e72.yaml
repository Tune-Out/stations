  operator: British Broadcasting Corporation (BBC) — UK public-service broadcaster established by Royal Charter
  affiliations: BBC (funded by UK TV licence fee and government grant for World Service); editorially independent under the BBC Charter; no party/religious affiliation
  audience: Young pop-music listeners aged roughly 15-29 in the United Kingdom and worldwide via BBC Sounds; this database entry is a Mexico-fronted relay of the UK feed
  format: Contemporary chart pop, dance and hip-hop, new music discovery, specialist DJ shows and the Official Chart
  notes: BBC Radio 1 launched on 30 September 1967 as the BBC's response to the 1960s pirate-radio boom (Radio Caroline, Radio London) and a UK government ban on offshore stations; its launch DJ Tony Blackburn played The Move's "Flowers in the Rain"; today the station's remit (per the BBC Operating Licence) is to "entertain and engage a broad range of young listeners with a distinctive mix of contemporary music and speech," featuring shows like the Radio 1 Breakfast Show, Future Sounds, the Official Chart, plus sister offshoots Radio 1 Dance, 1Xtra and Radio 1 Anthems; this catalogue entry is filed under Mexico (likely a Spanish-language curated relay) but the audio is the genuine UK BBC Radio 1 live stream
