  nature: state media
  operator: China Media Group (CMG) / Voice of China; CNR (China National Radio, 中央人民广播电台) channel 2
  affiliations: Chinese Communist Party (CCP) - directly supervised by the Publicity Department of the CCP Central Committee since 2018 CMG restructuring
  audience: Nationwide mainland Chinese audience interested in business, finance, and economic policy news; Mandarin Chinese language
  format: 24-hour economic, business and financial news channel ("Economic Voice" / Business Radio) - market news, macroeconomic commentary, consumer/finance shows, policy explainers
  notes: CNR-2 (Jingji Zhi Sheng, 经济之声 - "Voice of Economy") launched 1986 as China's first national economics-focused radio channel under China National Radio. In March 2018, CNR was merged with CCTV and China Radio International to form China Media Group (CMG, also called "Voice of China"), the world's largest broadcasting organisation by audience. As state media its editorial line aligns with CCP policy; programming amplifies official economic statistics, central bank announcements, and pro-market reform messaging consistent with party directives. Notable programmes include "天下财经" (Tianxia Caijing / World Finance) and "交易实况" (Trading Live). The channel broadcasts on AM, FM, shortwave and online nationwide.
  sources: internal knowledge only, http://www.cnr.cn/
