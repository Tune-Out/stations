  format: Islamic devotional music ("sholawat" - praise songs to the Prophet Muhammad), Qur'anic recitation, Islamic preaching (dakwah)
  notes: Radio Sholawat is a community-style internet radio service streaming sholawat (Islamic praise songs for the Prophet Muhammad) and Islamic dakwah content, with tagline "Berkat Sholawat Maksiat Minggat" ("By the blessings of sholawat, sin departs"). Programming features various Indonesian sholawat groups including Sholawat Langitan, Qudsiyyah, Madaniyah Pekalongan, and Duta Sholawat Jombang. The station is run via the Temborocity blog, linked to the Pondok Temboro Islamic boarding school community in Magetan, East Java, which has strong ties to the global Tablighi Jamaat movement. Streamed via Zeno.fm.
