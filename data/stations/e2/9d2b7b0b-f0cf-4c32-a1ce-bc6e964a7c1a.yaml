  notes: Радио Свобода ("Radio Liberty") is RFE/RL's Russian-language service founded in 1953 during the Cold War to broadcast behind the Iron Curtain; the broadcaster is headquartered in Prague (hence the Czechia country code) since 1995, was designated a foreign agent by Russia in 2017 and an "undesirable organisation" in 2024 forcing it to shut its Moscow bureau, and continues to publish on web, social and via shortwave/satellite/online streams.
