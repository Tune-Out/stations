  notes: Antena 1 is the flagship generalist channel of RTP, Portugal's public service broadcaster, and traces its lineage to Emissora Nacional, which began broadcasting on 4 August 1935. It carries national news and current affairs, live sport, cultural strands and a music policy weighted toward Portuguese and Lusophone artists, with signature programmes such as 'Alma Lusa' and 'Vozes da Lusofonia'. The service is carried on FM across the country, including 95.7 MHz in Lisbon, on medium wave in mainland Portugal and the Azores, and on 103.1 MHz in Timor-Leste. It is funded through RTP as a state-owned public broadcaster. The HLS stream from rtp.pt is live.
