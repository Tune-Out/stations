  nature: public broadcaster
  operator: Nederlandse Publieke Omroep (NPO) — the Dutch public broadcasting system; channel content produced by member broadcasters (notably BNNVARA, KRO-NCRV, AVROTROS) under NPO's coordination
  affiliations: Dutch state-licensed public service media; member of the European Broadcasting Union (EBU); funded primarily by general taxation
  audience: Dutch-speaking 20-49 demographic with interest in current pop, rock and alternative music; reaches the whole Netherlands on FM/DAB+ and worldwide online
  format: Contemporary pop-rock, top-40 and alternative music with live DJs, music news, podcasts, charity action ("3FM Serious Request") and emerging-artist showcases; tagline "We Want More"
  notes: NPO 3FM launched in 1965 (as "Hilversum 3") and became 3FM in 2003; historically a flagship Dutch pop station, it has shed audience to commercial competitors but remains culturally significant for its annual Serious Request glass-house charity broadcast (since 2004) raising funds for the Dutch Red Cross; programming is editorially independent of government but reviewed periodically by the Dutch Media Authority (Commissariaat voor de Media)
