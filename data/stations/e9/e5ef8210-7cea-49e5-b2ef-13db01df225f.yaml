  format: Rock-focused themed sub-stream "BOB's metalcore" delivering 24/7 metalcore, melodic hardcore and related heavy genres
  notes: Radio Bob! is one of Germany's largest private rock-format broadcasters, launched in 2008 by the FFH-Mediengruppe (Hit Radio FFH); it operates a national main station and many themed online sub-channels including BOB's Classic Rock, BOB's Hardrock, BOB's Punk Rock, BOB's Alternative and this BOB's Metalcore stream, "playing rock in all its facets" per the site. The metalcore channel is described on-site as combining "hard and aggressive verses with melodic refrains, clean vocals and hefty breakdowns," featuring bands such as Heaven Shall Burn, Killswitch Engage, Architects and Parkway Drive. Available terrestrially in parts of Hesse, NRW and Schleswig-Holstein via DAB+/FM and globally via web stream and apps.
