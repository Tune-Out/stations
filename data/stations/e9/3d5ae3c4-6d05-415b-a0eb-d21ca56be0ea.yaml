  notes: Radio Eska is Poland's largest private commercial radio network, founded in 1992 and now operating dozens of city-specific frequencies under a common format; the Warszawa edition is one of the network's flagship outlets serving the capital region; the parent ZPR Media is a major Polish private media group controlled by the Solorz-Konopka family (also linked to Polsat) and operates Supersport, Eska Rock, Eska TV, VOX FM and the SuperExpress tabloid; flagship programming includes the "Gorąca 20" hits countdown, the "Rap 20" chart and morning shows; the network competes with RMF FM and Radio ZET for the mainstream commercial audience.
