  nature: public broadcaster
  operator: Österreichischer Rundfunk (ORF) — Austrian Broadcasting Corporation
  affiliations: ORF is Austria's national public broadcaster established by federal law (ORF-Gesetz); funded primarily by a household media levy (replacing the former GIS licence fee in 2024); editorially independent under public-service mandate; supports charity initiatives Licht ins Dunkel and Team Österreich Tafel
  audience: Austrian mainstream adult audience (broadly 20-49); German language; broadcast nationwide via FM, DAB+, satellite and online streaming
  format: Mainstream contemporary hit radio / pop with news, weather, traffic, sports, and entertainment; Austria's most-listened-to radio station with very high market share
  notes: Launched 1967 as Ö3 (third ORF programme); rebranded as Hitradio Ö3; consistently the highest-rated radio station in Austria with daily reach historically around 30%+ of population; organises and broadcasts major events such as the Ö3 Disco, Nova Rock co-promotion, and Donauinselfest coverage; hybrid public broadcaster which does carry advertising under ORF's commercial mandate
