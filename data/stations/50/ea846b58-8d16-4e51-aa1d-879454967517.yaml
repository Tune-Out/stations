  notes: Deutschlandfunk Kultur (DLF Kultur, often abbreviated DKultur) is one of three national programmes of Deutschlandradio (alongside Deutschlandfunk and Deutschlandfunk Nova); it was created on 17 May 2017 from the former DeutschlandRadio Kultur which itself emerged from the 1994 merger of West Berlin's RIAS Berlin and East Berlin's Deutschlandsender Kultur; headquartered in Berlin; this OPUS 64 kbit/s stream is a low-bandwidth high-efficiency Opus-codec variant; broadcasts via DAB+ and FM nationwide; renowned for its Hörspiel (radio drama), Lange Nacht features and classical concerts.
