  notes: Trito Live ("Third" in Greek) is the third and final channel of the Cyprus Broadcasting Corporation (CyBC), the state-owned public broadcaster established in 1952; CyBC is fully funded by the state and operates multiple radio networks (First, Second, Third) and television services; Trito targets listeners seeking current affairs, cultural programming and information content and complements the other CyBC channels; the station streams online and broadcasts terrestrially across Cyprus; programming is in Greek and serves as a pillar of Cyprus's public media system.
