  notes: Radio Melody is a Swiss commercial schlager-format station operated by CH Media, distributed via DAB+ across German-speaking Switzerland (Deutschschweiz) and online livestream; CH Media is one of Switzerland's two dominant private media houses (alongside Tamedia/TX Group) and runs a large family of regional and themed radio brands; Radio Melody's signature shows include "Werners Schlagerwelt", "Rosmaries Öbetli" and the weekly listener-voted hitparade "Schlager der Woche"; it also operates web channels for Schlager Party, Schlager Kult, FLASHBACK FM, Goldies and the Alpine-folk Älplerchilbi, positioning itself as the country's leading schlager broadcaster.
