  operator: SIA "Radio SKONTO" — a private Latvian broadcasting company headquartered in Riga; long-standing independent owner-operator since the early 1990s
  affiliations: none known (commercial enterprise, not part of the public broadcaster Latvijas Radio)
  audience: Latvian-speaking adult mainstream audience, broadcasting nationally from Riga (107.0 MHz in the capital, with relays on other frequencies across Latvia)
  format: Adult-oriented pop / soft AC with Latvian and international hits, news bulletins and presenter-driven daytime shows
  notes: One of the earliest private commercial radio stations launched in independent Latvia (founded in 1992), Radio Skonto became a household-name network and one of the country's largest privately owned national stations; brand identity is built around the Latvian word "skonto" (cf. "discount/skonto") and the slogan family around accessible mainstream music; sits in the Latvian market alongside the public Latvijas Radio channels and other commercial networks such as Star FM and Latvijas Radio's competitors.
