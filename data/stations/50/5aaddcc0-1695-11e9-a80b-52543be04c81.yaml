  notes: Radio Faaz is a Persian-language internet radio station streaming 24/7 from Hamburg, Germany, online since 2010 and curated by DJ Majid. It describes itself as Germany's first Persian web radio and plays contemporary Persian pop hits, Iranian classics, 'ahang-e shad' dance tracks and club music for the Iranian diaspora in Germany, Europe and worldwide. It is an independent web-only operation, not an Iran-based broadcaster; the catalog's 'IR' country code is misleading (the station is German). The catalog name 'Faz' is a truncation of the official name Radio Faaz.
