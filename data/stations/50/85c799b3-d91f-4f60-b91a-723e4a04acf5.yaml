  notes: 90s90s HipHop & Rap is one of the roughly 15 automated sub-channels of 90s90s, the German 1990s radio brand launched by private broadcaster Regiocast on 29 November 2016. Unlike the moderated main 90s90s programme (nationwide on DAB+ since January 2023), the HipHop & Rap channel is an online-only, presenter-free playlist of golden-age rap and hip-hop, streamed at 192 kbps MP3 from streams.90s90s.de. It is ad-financed and part of one of Germany's larger private radio groups. The catalog notes' mention of regional stations and morning shows belongs to the main channel, not this feed.
