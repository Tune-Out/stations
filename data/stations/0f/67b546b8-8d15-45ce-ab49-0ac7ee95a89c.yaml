  nature: non-commercial
  operator: Radio Student, a Zagreb-based student / non-profit radio station historically associated with the University of Zagreb student community
  affiliations: Linked to the University of Zagreb student union / Studentski centar tradition; non-commercial, non-profit, no party-political or religious affiliation
  audience: University students, young adults and alternative-music listeners in Zagreb and central Croatia, Croatian-speaking, broadcasting on 100.5 MHz FM in Zagreb and online
  format: Alternative, indie, underground and independent music; cultural, social and youth-focused talk programming; student-produced editorial content
  notes: Croatia's Radio Student in Zagreb is part of the post-Yugoslav tradition of independent student radio (alongside Slovenia's Radio Študent Ljubljana and Serbia's Radio Studio B / Radio B92's youth slots) emphasising musical discovery, free expression and grassroots cultural coverage; broadcasts on 100.5 MHz FM in the Zagreb area and streams AAC+ at 128 kbps online; the station occupies the alternative-cultural niche distinct from the public Hrvatski Radio (HRT) and major commercial brands like Radio Antena Zagreb or Otvoreni Radio
