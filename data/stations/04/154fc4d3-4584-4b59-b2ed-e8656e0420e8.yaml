  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: Österreichischer Rundfunk (ORF), Austria's national public-service broadcaster
  affiliations: ORF is a public corporation established under the ORF-Gesetz (Federal Act on the Austrian Broadcasting Corporation), funded primarily by the household media fee (ORF-Beitrag, formerly GIS Gebühr) and supplemented by limited advertising; politically independent by law but its supervisory bodies (Stiftungsrat / Publikumsrat) are appointed via political proportionality, leading to recurring debate about political influence
  audience: General adult audience in Vienna (Wien) and the surrounding region; German-language
  format: Regional public-service radio for Vienna with news, traffic, service information, talk and adult-contemporary / oldies-leaning music ("Das Beste aus den 60ern, 70ern, 80ern, 90ern und das Beste von heute")
  notes: Radio Wien is one of nine ORF Landesstudios regional stations (one per Austrian Bundesland) that together form the Ö2 regional network; it is the most-listened-to regional station in Vienna and a key public-service voice for the capital; programming emphasises local news, weather, traffic and cultural events; the ORF Player offers livestreams and on-demand audio; the station has operated since the post-war reorganisation of Austrian broadcasting and inherited the Vienna regional service traditions of the pre-war Ravag.
  sources: https://wien.orf.at/player, internal knowledge
