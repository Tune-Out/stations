  notes: Bylgjan is Iceland's first and most popular private commercial radio station, launched in 1986 when the state monopoly on broadcasting ended; originally founded by Íslenska útvarpsfélagið, it passed through several owners including Norðurljós, 365 miðlar and is now part of Sýn hf., a publicly listed Icelandic telecom-and-media group that also operates Stöð 2 television, X977, FM957, FM Extra, and themed digital channels such as GullBylgjan and 80sBylgjan; the network is headquartered in Reykjavík and its flagship talk shows include "Reykjavík síðdegis", "Bítið", "Sprengisandur" and the news bulletins "Hádegisfréttir" and "Kvöldfréttir"; Bylgjan competes with public broadcaster RÚV's Rás 2 for the mainstream audience.
