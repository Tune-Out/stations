  notes: 1LIVE DIGGI is a digital-only sub-channel of 1LIVE, WDR's nationally popular youth-oriented station based in Cologne. Launched in 2008 as 1LIVE's urban/hip-hop offshoot, it streams via DAB+ and online, focusing on rap, R&B, and hip-hop with German and international tracks. WDR is one of Germany's largest public broadcasters serving North Rhine-Westphalia (NRW), and operates under the WDR-Gesetz; 1LIVE itself is among Germany's most-listened-to radio stations among younger demographics. Programming is non-commercial (no advertising on DAB+/online sub-channels in the same form as commercial radio) and editorially independent under the state media law.
