  nature: non-commercial
  operator: Association Radio Courtoisie, a French association loi 1901 (non-profit) operating under a Category A "radio associative" licence
  affiliations: Politically affiliated with the French traditionalist, conservative, monarchist and nationalist Right; culturally Catholic-traditionalist; explicitly self-described as a "radio libre du pays réel et de la francophonie" and an heir to Jean Ferré's "radio libre de toutes les droites nationales, européennes et chrétiennes"
  audience: French-speaking traditionalist, Catholic, conservative and nationalist listeners in France and the broader Francophonie
  format: All-talk station built around long-running "libres journaux" (open editorial slots) hosted by rotating tribunes covering politics, religion, history, literature, classical culture and current affairs, with classical music interludes
  notes: Founded in 1987 by literary critic Jean Ferré as a successor to Radio Solidarité, Radio Courtoisie broadcasts on 95.6 MHz FM in Paris (and via streaming) and is a flagship media outlet of the French traditionalist Right; after Ferré's death in 1999 the station was led by historian Henry de Lesquen until his ousting in 2017 amid an internal dispute, and is now run by Dr Henri Fouquereau; the CSA/Arcom has periodically sanctioned the station for racist or discriminatory remarks made by guests, including formal warnings and temporary licence renewal delays
  sources: internal knowledge only
