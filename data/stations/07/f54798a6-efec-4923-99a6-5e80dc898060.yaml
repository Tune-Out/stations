  notes: 4BH (1116 AM Brisbane) is one of Australia's longest-running commercial radio stations, on air since 1930; for many decades operated as an easy-listening / classic-hits station serving older Brisbane audiences. Owned by ARN, which is part of HT&E (Here, There & Everywhere Limited, ASX-listed); ARN operates the major KIIS Network and Pure Gold Network nationally. 4BH has historically been positioned as Brisbane's heritage "good music" station and is part of ARN's classic-hits / nostalgia network alongside stations like 2CH and Magic 1278.
