  notes: Taipei Broadcasting Station (臺北廣播電臺) is the municipal public radio station of the Taipei City Government, run by its Department of Information and Tourism from the Yuanshan complex in Zhongshan District; it began as a civil-defence broadcaster in 1959, went on air in July 1961 and took its current name in 1977. This entry is its AM 1134 channel, which since 2005 has been branded '喔!海洋' as Taiwan's dedicated indigenous-peoples channel with news, culture and music for Taiwan's Austronesian communities, distinct from the FM 93.1 general city-information service that the catalog lists separately. Coverage extends across Taipei, New Taipei, Keelung, Taoyuan, Hsinchu and Yilan.
