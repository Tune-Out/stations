  operator: Radio Bio-Bio Comunicaciones S.A. (Mosciatti family-owned media group), headquartered in Concepcion, Chile
  affiliations: none formal; widely viewed in Chile as editorially independent and centrist; not party-aligned
  audience: Spanish-speaking Chilean adults nationwide; one of Chile's largest news radio networks
  format: News/talk-driven Spanish-language programming - news bulletins, interviews, current affairs, sports and political commentary; flagship news show "El Diario de Cooperativa"'s competitor in the news space.
  notes: Founded in 1966 in Concepcion by Nibaldo Mosciatti Olivieri; family-owned through Radio Bio-Bio Comunicaciones S.A., now run by his sons (Tomas, Nibaldo Jr., Juan Carlos Mosciatti); grew from a regional Bio-Bio Region broadcaster into a national network of FM stations and the biobiochile.cl news portal, plus regional TV channel BioBioTV; site brands itself "La Red de Prensa Mas Grande de Chile" ("The Largest Press Network in Chile"); known for hard-hitting interviews (Tomas Mosciatti) and for sustained investigative journalism via "BBCL Investiga"; among the most-read news sites in Chile.
