  format: Adult contemporary / classic pop-rock hits; "RFM 100% Français" is a digital webradio sub-stream playing exclusively French-language songs
  notes: RFM is a French national commercial FM radio network founded in 1981 by Patrick Meyer as one of the first French free radios (radios libres) after the end of the state broadcasting monopoly; it was acquired by the Lagardère group in 2005 (via Sociétés des radios populaires) and integrated into Lagardère Active (now Lagardère News), which also owns Europe 1 and Virgin Radio France; in 2021 Vivendi (Vincent Bolloré) took majority control of Lagardère, so RFM is now part of that group; the main station is built around the slogan "Le Meilleur de la Musique" with adult contemporary hits, and "100% Français" is one of its many themed digital webradios (alongside 80s, 90s, Love Songs, etc.) playing only French-language tracks.
