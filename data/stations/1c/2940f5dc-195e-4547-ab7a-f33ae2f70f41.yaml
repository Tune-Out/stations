  operator: Manila Broadcasting Company (MBC); flagship AM station of the MBC Radio Network
  affiliations: "none formal political/religious; MBC is a publicly traded Philippine media conglomerate (PSE: MBC) historically associated with the Elizalde family"
  audience: Filipino mass-market AM listeners nationwide, particularly older adults and provincial households; Tagalog/Filipino language
  format: AM news, talk, public-affairs, drama and human-interest programming — hourly newscasts, magazine shows, commentaries, classic radio drama and call-in segments
  notes: DZRH (666 kHz AM, Manila) is the oldest continuously operating radio station in the Philippines, signing on 15 July 1939 as KZRH under Heinrich "Henry" Hermann; survived World War II (broadcasting until the Japanese occupation in 1942 and resuming after liberation), was renamed DZRH in 1946 to comply with ITU call-sign rules, and became the cornerstone of the Manila Broadcasting Company; pioneered Philippine radio drama (notably "Gulong ng Palad") and nationwide AM news; relays via a chain of provincial affiliates plus simulcast on cable TV (DZRH News Television) and online stream; based at the MBC Building, CCP Complex, Pasay City; long regarded as a "household name" in Philippine broadcasting.
  sources: https://www.dzrh.com.ph/, internal knowledge of Philippine radio history
