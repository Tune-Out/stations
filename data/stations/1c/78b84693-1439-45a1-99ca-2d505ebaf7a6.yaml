  nature: commercial
  operator: Nelonen Media (Sanoma Media Finland Oy) — radio division of Finnish media group Sanoma; streamed via the group's Supla audio platform
  affiliations: none known (no religious, governmental, or political affiliation)
  audience: Finnish adult male-skewing rock listeners, roughly 25–54; Finnish language
  format: Rock — classic rock, hard rock and modern rock with strong Finnish rock content (HIM, Nightwish, CMX, YUP, Apulanta, Eppu Normaali, etc.) alongside international acts; talk-driven daytime shows, irreverent humour and music-news features
  notes: Launched in 2007 by SBS Finland (then owner of The Voice / Iskelmä), Radio Rock became one of Finland's flagship commercial rock stations; passed to Sanoma / Nelonen Media when the latter acquired SBS's Finnish radio assets, integrating Radio Rock with sister brands Radio Suomipop, Radio Aalto, HitMix and Loop; broadcasts on FM across Finland and via DAB and the Supla streaming app; known for outspoken, comedy-led morning shows ("Korporaatio", Juuso Mäkilähde and others) that have occasionally drawn complaints to the Finnish Council for Mass Media; positioned commercially as "the only real rock station" against public broadcaster Yle's more conservative music offering.
  sources: internal knowledge only
