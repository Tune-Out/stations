  notes: AIR Urdu is the Urdu Service of All India Radio's External Services Division, run by Prasar Bharati, India's statutory public broadcaster. It is the longest daily broadcast among AIR's external services, running around the clock on DTH satellite and for about 12 hours a day on short- and medium-wave, and is aimed primarily at listeners in Pakistan and the wider Urdu-speaking world. Output mixes news, commentary and press reviews with ghazals, qawwali, film songs and drama; special Urdu broadcasts are beamed to Saudi Arabia during the Hajj season. The catalog carries Prasar Bharati's HLS stream.
