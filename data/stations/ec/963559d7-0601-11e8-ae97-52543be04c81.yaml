  notes: Energy is the Bulgarian franchise of the international NRJ network, which began in France in 1981 and licenses the Energy name outside its home market. The Bulgarian station started on 17 November 2005 on the frequencies previously used by Radio Sport and is owned in Bulgaria by Communicorp, whose local portfolio also includes Radio 1, Radio Nova, Radio Veronika, Radio 1 Rock, Avto Radio and BG Radio, all distributed through the RadioPlay app. Output is straightforward contemporary hit radio and dance-pop, with web-only spin-offs Energy 90's Only and Energy 00's Only. The station marked its twentieth anniversary in 2025 with an Enrique Iglesias visit and the Spice Music Festival in Burgas.
