  operator: Reflex Media (NRJ Group brand licensee in Bulgaria), part of a Bulgarian commercial radio group that also includes Nova, Radio 1 Rock, Avto Radio, Radio 1, Radio Nova News and Radio Veronika.
  affiliations: none known; brand licensed from France's NRJ Group (Groupe NRJ), founded 1981 in Paris.
  audience: Bulgarian youth and young-adult listeners (roughly 15-35) interested in current Top 40 hits, dance and pop, broadcasting nationally on FM and via online streams.
  format: Contemporary hit radio (CHR) / dance-pop with the tagline "Hit music only!"; spin-off web channels Energy 90's Only and Energy 00's Only.
  notes: Energy is the Bulgarian franchise of the international NRJ network (branded "Energy" outside France); it carries the same youth-pop CHR formula as NRJ stations in Germany, Switzerland, Austria, the Nordics and elsewhere; multi-platform with iOS, Android, Windows and Huawei apps and active social media.
