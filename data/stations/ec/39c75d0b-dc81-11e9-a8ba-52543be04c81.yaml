  notes: Hirschmilch Radio is a non-commercial internet radio project from Hamburg, Germany, online since around 2008 and focused on alternative electronic music. The Electronic channel covers ambient, dub, downtempo, techno, minimal and tech house, alongside sister streams for Chillout, Organic House, Prog House, Progressive Trance, Psytrance and Techno. It is funded by listener support rather than advertising, offers iOS and Android apps, and is well regarded in the psytrance and chillout scene.
