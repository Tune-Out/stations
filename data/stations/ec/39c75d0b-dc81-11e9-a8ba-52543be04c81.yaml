  operator: Hirschmilch Internet Radio, a small independent German operation run by founder Holger Mertin (based in Germany).
  affiliations: None known — independent, scene-funded electronic music project.
  audience: Global electronic-music listeners, psytrance / chillout / progressive fans; primarily online audience.
  format: Electronic music channel of Hirschmilch — progressive house, techno, electronica, deep/tech house, and related electronic genres broadcast 24/7 online.
  notes: Hirschmilch ("deer milk" in German) is a long-running internet radio project launched in the mid-2000s, well-known in the global psytrance/chillout scene; it operates multiple streams — Electronic, Chillout, Psytrance/Goa — each curated separately; the station has no FM presence and is funded by listener donations and small partnerships rather than ads; popular among the European trance/festival community and globally on internet radio directories; offers DJ submissions and showcases independent electronic artists.
