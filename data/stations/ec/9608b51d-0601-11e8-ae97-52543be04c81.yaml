  operator: Antenne Kaernten GmbH, part of the Antenne Austria private radio group (historically linked to the Antenne Steiermark / Styria Media Group sphere and Krone Multimedia / Kronehit shareholdings)
  affiliations: none known politically; Austria's largest private radio publishers Styria Media Group (publisher of Kleine Zeitung) and Krone Multimedia have historically held stakes in the Antenne network
  audience: Adult contemporary listeners aged roughly 20-49 across the Austrian federal state of Carinthia (Kaernten); German-speaking Carinthians around Klagenfurt and Villach
  format: Adult contemporary / hot AC mainstream pop music, regional news, weather, traffic and Carinthia-focused features
  notes: Antenne Kaernten is the Carinthia regional offshoot of the Antenne Austria private radio family which began with Antenne Steiermark in Styria after Austria's broadcasting liberalisation in the late 1990s; it provides the dominant private alternative to the ORF Landesstudio Kaernten public station; broadcasts on regional FM frequencies and streams online; programming combines current pop hits with strong regional emphasis on Carinthian news, events, weather, traffic and local promotions; partnered with the publisher of Kleine Zeitung Kaernten for cross-media content; available alongside sister stations Antenne Steiermark, Antenne Salzburg, Antenne Tirol and Antenne Vorarlberg.
  sources: https://www.antenne.at/kaernten (fetch blocked), internal knowledge
