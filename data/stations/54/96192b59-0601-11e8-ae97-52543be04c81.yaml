  operator: News Broadcasting Ltd (formerly Wireless Group plc / TalkSport Ltd), a UK subsidiary of News Corp UK & Ireland Ltd (Rupert Murdoch's News Corp)
  affiliations: none direct, but as part of News Corp UK & Ireland it sits within Rupert Murdoch's UK media empire (alongside The Sun and The Times); no religious or party-political affiliation
  audience: Predominantly male UK adult football and sports fans (heavily skewed 25-64); UK national plus international diaspora via DAB+, online and the talkSPORT app
  format: 24-hour speech / sports talk radio with live football commentary (Premier League, EFL, FA Cup, World Cup), boxing, cricket, NFL, racing, plus opinion-led debate phone-ins
  notes: talkSPORT launched on 17 January 2000, rebranded from Talk Radio UK (which had launched in 1995 as the UK's second commercial speech-radio licensee on AM 1053/1089 kHz); the Wireless Group, formerly owned by Kelvin MacKenzie's TLRC and then Communicorp, was acquired by News UK in 2016 for £220m, bringing talkSPORT (and later sister stations talkSPORT 2, Virgin Radio UK, talkRADIO and Times Radio) into News Corp; it broadcasts UK-wide on AM, DAB+ and digital TV (Freeview/Sky) and holds rights to live Premier League and EFL commentaries; long-running shows include the Alan Brazil Sports Breakfast, the Jim White & Simon Jordan show, Hawksbee & Jacobs, and the Drive show with Adrian Durham; presenters past and present include Mike Graham, Ally McCoist, Jim White, Andy Goldstein, Adrian Durham, Darren Bent, Trevor Sinclair, Mike Parry, and Stan Collymore; the station has faced multiple Ofcom rulings over the years on rule-breaking content and offensive remarks but no licence revocations.
