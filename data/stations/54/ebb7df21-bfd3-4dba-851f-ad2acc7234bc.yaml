  operator: Broadcast Operations Group / Super Radio Network (SRN), owned by Bill Caralis's family interests
  affiliations: Historically associated with the Catholic Archdiocese of Sydney (sold to commercial interests in 1990s); commercially licensed under ACMA; SRN flagship station
  audience: Older adult (50+) listeners in Sydney and across the Super Radio Network's regional Australian affiliate stations; news, talk and sport audience
  format: News, talk and talkback radio with sport (especially horse racing and NRL rugby league), classic music interludes and syndicated SRN talk programming
  notes: 2SM is one of Sydney's oldest commercial radio stations, founded in 1931 by the Catholic Broadcasting Company (Catholic Archdiocese of Sydney) - the "SM" initials derived from the Sacred Mind/Sodality of Mary brand; broadcasts on 1269 kHz AM from Sydney; transferred to commercial owner Bill Caralis and his Super Radio Network in the late 1990s after deregulation; now the network's flagship, originating SRN's nationwide talk and sport content distributed to dozens of regional Australian stations; programming has historically featured veteran broadcasters like John Laws (after his 2UE departure) and other Sydney talkback identities; covers NRL Continuous Call Team-style rugby league and horse racing; has been involved in industry controversies typical of Australian commercial talkback radio
