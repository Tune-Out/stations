  notes: YES 933 (Yes 93.3FM) is Singapore's leading Mandarin-language popular music station, operated by Mediacorp Radio. Launched in 1990 as the successor to Radio Heart 93.3, it serves as the Chinese-language counterpart to Mediacorp's English-language 987FM. Mediacorp is wholly owned by Temasek Holdings, Singapore's sovereign-wealth investment company, giving the station an indirect link to the Singapore government, though it operates commercially with advertising revenue. The station is streamed via meradio.sg (now melisten.sg). Known for popular DJs and the long-running YES 933 Music Awards / Hit Awards celebrating Mandopop. Its tagline historically includes "新加坡最红" ("Singapore's hottest").
