  nature: commercial
  operator: Groupe M6 (Métropole Télévision S.A.) — since 2017, when RTL Group sold its French radio assets to M6; RTL brand licensed
  affiliations: M6 Group is majority-owned by RTL Group (Bertelsmann subsidiary, Luxembourg); RTL Group itself is part of Bertelsmann SE & Co. KGaA (Germany)
  audience: French-speaking general adult audience nationwide and via DAB+ / online; consistently France's most-listened-to commercial radio station
  format: Generalist talk and entertainment — news, magazine shows, talk, humor, and music; flagship morning show "RTL Matin"
  notes: RTL began French-language broadcasts in 1933 from Luxembourg as Radio Luxembourg, and after WWII grew into Radio Télé-Luxembourg, becoming RTL in 1966; it has been a dominant force in French radio since the 1950s, known for personality-driven talk shows, sports coverage, comedy (e.g., the long-running "Les Grosses Têtes"), and major news programming; for decades it broadcast from Luxembourg on long-wave (now discontinued in 2023) but has long had Paris studios; in 2017 RTL France along with RTL2 and Fun Radio were sold by RTL Group to M6 (which itself is part of the same Bertelsmann ecosystem); regulated by France's audiovisual authority Arcom; consistently ranks number-one or number-two in French commercial radio audience ratings.
