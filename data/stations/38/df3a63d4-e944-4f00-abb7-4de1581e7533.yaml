  notes: 'This entry is a third-party CDN relay of Rai Radio 1, the flagship news and talk channel of Italy''s public broadcaster RAI, broadcasting from Rome''s Saxa Rubra centre since 1924. The ''+Calcio'' suffix is a directory user''s label, not a RAI brand: the stream identifies itself simply as ''Radio1'' and RAI operates no such channel, its football coverage being the historic ''Tutto il calcio minuto per minuto'' on Radio 1 itself and the separate Rai Radio 1 Sport. The catalog already has a canonical Rai Radio 1 entry with far more votes.'
