  notes: Český Rozhlas Dvojka (Czech Radio Channel 2) is a national public radio station emphasizing cultural and educational content. Notable programs include talk shows "Tobogan" and "Blízká setkání," audio dramas, crime documentaries "Historie českého zločinu," serialized fiction readings "Četba na pokračování," and chart countdown "Česká dvanáctka." Provides extensive archives and on-demand programming focused on Czech culture, history, and literary works.
