  notes: All India Radio (officially Akashvani since the corporation rebranded in 2023-24) is India's national public radio broadcaster operated by Prasar Bharati; the Thrissur station broadcasts on 630 kHz medium wave from the cultural capital of Kerala and is part of the AIR Kerala regional network alongside Thiruvananthapuram, Kozhikode and others; AIR has its origins in the Indian State Broadcasting Service of the 1930s and was renamed All India Radio in 1936, becoming Akashvani in 1957; programming follows AIR's public-service remit of "information, education and entertainment" and includes mandatory carriage of the national news bulletins from New Delhi.
