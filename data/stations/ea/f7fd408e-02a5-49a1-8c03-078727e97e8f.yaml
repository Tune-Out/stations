  nature: public broadcaster
  operator: BBC (British Broadcasting Corporation) — UK public service broadcaster, funded primarily by the television licence fee and operating under Royal Charter
  affiliations: none (BBC is editorially independent; not owned by government, religious or political organisations, though it is established by Royal Charter and partly accountable to Parliament via the BBC Charter framework and Ofcom regulation)
  audience: Young adult listeners in the UK (target demographic historically 15-29, broader on the day mix); English language; nationwide UK terrestrial coverage with international streaming via BBC Sounds (geo-restricted simulcast on some streams)
  format: Contemporary pop, dance, hip-hop, R&B and rock; flagship UK new-music station with specialist evening shows. Sister streams BBC Radio 1Xtra (Black music) and BBC Radio 1 Dance run alongside.
  notes: Launched 30 September 1967, originally to replace pirate stations such as Radio Caroline and Radio London after the Marine Broadcasting Offences Act 1967. First voice was DJ Tony Blackburn. Broadcasts on FM (97-99 MHz), DAB, digital TV, online via BBC Sounds, and through international syndication. Famous strands include the Official Chart, Live Lounge, and the Radio 1 Big Weekend festival. Studios at Broadcasting House, London. Operates under the BBC's public-service remit set out in the BBC Charter and the BBC Operating Licence issued by Ofcom; required to deliver "the most engaging mix of new music together with first class entertainment, news and social action campaigns for younger audiences" (BBC Operating Licence remit for Radio 1).
