  nature: public broadcaster
  operator: Norddeutscher Rundfunk (NDR) – the public broadcasting corporation for the German states of Schleswig-Holstein, Hamburg, Lower Saxony and Mecklenburg-Vorpommern; part of the federal ARD network and funded by Germany's Rundfunkbeitrag household licence fee.
  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland) member; governed by NDR's State Treaty (NDR-Staatsvertrag) and supervised by independent broadcasting council; politically independent under German public-broadcasting law.
  audience: General adult audience in the German state of Schleswig-Holstein; regional German-language programming with strong Plattdeutsch (Low German) and Friesian-language content.
  format: Full-service regional public radio – melodic adult-contemporary, oldies, German-language Schlager and rock alongside news, weather, traffic and extensive regional reporting from studios in Kiel, Flensburg, Heide, Lübeck and Norderstedt.
  notes: NDR 1 Welle Nord launched on 2 April 1990 as the Schleswig-Holstein regional offshoot of the older NDR 1 service; together with NDR 90,3 (Hamburg), NDR 1 Niedersachsen and NDR 1 Radio MV it forms the "NDR 1" family of state-by-state regional services; carries the daily Plattdeutsch news programme "Nachrichten op Platt" and the Friesian-language "Frasch for enarken"; transmits via FM, DAB+ and online icecast; financed via the broadcasting contribution paid by all German households, not advertising-funded for radio.
