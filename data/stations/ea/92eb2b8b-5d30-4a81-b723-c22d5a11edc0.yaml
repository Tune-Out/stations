  notes: ESPLENDIDA 91.9 FM ("La Que Te Mueve") is a regional commercial FM station serving the eastern Venezuelan coast, broadcasting from the Puerto La Cruz / Barcelona area in Anzoátegui state; programming centres on vallenato and tropical Latin music alongside local news and interactive shows; the station's stated mission is to "informar, entretener y conectar a las comunidades de la región oriental de Venezuela mediante una programación de calidad" reflecting regional identity; like most Venezuelan private FM stations it operates under CONATEL licensing in a tightly regulated media environment dominated by state-aligned outlets, but its public branding is non-political and entertainment-focused.
