  nature: public broadcaster
  operator: Kan – Israeli Public Broadcasting Corporation (Ta'agid HaShidur HaYisraeli, תאגיד השידור הישראלי), the statutory Israeli public broadcaster
  affiliations: independent statutory public broadcaster established by the 2014 Public Broadcasting Corporation Law; funded by direct government allocation rather than a licence fee; governed by an independent council, though successive Israeli governments (including the Netanyahu government) have repeatedly proposed restructuring or defunding it
  audience: general Israeli adult audience nationwide; Hebrew language
  format: news, current affairs and talk; the flagship news-and-talk network of Kan, comparable to BBC Radio 4 or France Inter in role
  notes: Reshet Bet ("Network B") dates back to 1960 and was originally part of the Israel Broadcasting Authority (IBA, רשות השידור); transferred to the new Kan corporation when Kan launched on 15 May 2017 and IBA was dissolved; long-running flagship shows include the morning programme "Seder Yom" and afternoon news magazine "Hakol Diburim"; among its most prominent presenters historically were Aryeh Golan, Esti Perez and Keren Neubach; the station has repeatedly been at the centre of political controversies over editorial independence
