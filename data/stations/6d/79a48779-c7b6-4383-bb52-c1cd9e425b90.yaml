  notes: Idha'at al-Qur'an al-Karim ("Holy Qur'an Radio", اذاعة القرآن الكريم) is the Egyptian state radio service dedicated to continuous Qur'an recitation by famous Egyptian and Arab qari'in (reciters), founded by Egyptian Radio on 29 March 1964 under President Gamal Abdel Nasser as the world's first dedicated Qur'an radio station; it is operated by the Egyptian Radio and Television Union (ERTU). It broadcasts traditional Sunni recitations (e.g. by Mahmoud Khalil al-Husary, Mohamed Siddiq al-Minshawi, Abdul Basit Abdul Samad, Mustafa Ismail) along with sermons, religious lectures, and Islamic legal commentary. The signal is widely re-broadcast across the Arab world and listened to by Muslims globally. The "classical" directory tag refers to classical Qur'anic recitation, not Western classical music.
