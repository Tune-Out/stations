  notes: Heart 80s is a national UK digital station owned by Global, launched on 14 March 2017 as a rolling 'feel good' 1980s music service and broadcast on DAB, Global Player and online from Leicester Square, London. It is a decade spin-off of the Heart brand alongside Heart 70s, 90s, 00s and Heart Dance, with mostly automated non-stop music and a few voice-tracked shows. Global is the UK's largest commercial radio group and also runs Heart, Capital, Smooth, Classic FM, LBC and Radio X. Despite the 'public-radio' tag in the source metadata, it is fully commercial.
