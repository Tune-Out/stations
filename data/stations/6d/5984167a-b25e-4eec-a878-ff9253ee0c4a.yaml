  format: Mainstream contemporary hit radio with a dance, R&B and hip-hop lean; weekday breakfast and drive shows plus specialist mix shows and chart programming.
  notes: KISS originated in 1985 as a London pirate station championing dance and black music, was legalised on FM in 1990 as Kiss 100 FM, and was acquired by Emap in 1992 before passing to Bauer when Bauer bought Emap's consumer assets in 2008. It is now a UK-wide brand on DAB, FM (Kiss 100 London) and online and sits within Bauer's "Hits Network" / Rayo platform alongside Magic, Absolute and Kerrang!. Sister brands KISSTORY, KISS Fresh, KISS Dance and KISS Xtra extend the franchise. Notable presenters have included Tyler West, Jordan Banjo, Charlie Hedges and historically Steve Jackson, Trevor Nelson and Rickie & Melvin.
