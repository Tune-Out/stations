  notes: Dark Wave Radomir (DWR) is a small Bulgarian internet station from the town of Radomir focused on dark electronic, post-punk and experimental subgenres rarely covered by mainstream broadcasters; it sits in the same scene-driven space as international stations such as DKR (Darker Than Wax), Radio Belarus' EBM blocks or Cologne's Tunnel FM, but is independently run; given its underground genre focus and small geographic origin it is unlikely to have commercial advertising or corporate ownership
