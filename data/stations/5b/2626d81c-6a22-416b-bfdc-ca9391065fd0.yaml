  notes: Radyjo Maryja (Радыё Марыя) is the Belarusian-language affiliate of the Radio Maria World Family, the international Catholic radio network founded in Erba, Italy in 1987 and funded by listener contributions rather than the Church. Registered 2 June 2016 and based in Minsk, it broadcasts daily from 8 AM to 10 PM with Holy Mass, morning and evening prayer, the rosary, catechesis, saints' lives, cultural programmes and the Belarusian service of Vatican Radio, distributed online and via iOS/Android apps. The catalog's "pop" tag is inaccurate; it is a religious broadcaster.
