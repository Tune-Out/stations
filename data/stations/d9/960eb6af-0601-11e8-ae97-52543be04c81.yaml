  operator: Vlaamse Radio- en Televisieomroeporganisatie (VRT), the Flemish public-service broadcaster of Belgium
  affiliations: Flemish Community of Belgium — VRT is a public-service company operating under a management contract (beheersovereenkomst) with the Flemish Government; editorially independent under public-broadcasting law; non-religious, non-partisan public mission
  audience: Dutch-speaking classical-music enthusiasts in Flanders and the Flemish diaspora; complements main Klara channel
  format: Continuous, non-stop classical music stream with minimal presentation — instrumental, vocal, opera, and chamber works across the classical canon, with limited spoken word
  notes: Klara Continuo is a digital sub-channel of Klara, VRT's main classical and cultural radio station; while Klara's main FM/DAB channel includes substantial spoken-word programming (cultural news, interviews, jazz, world music), Klara Continuo provides an uninterrupted music-only alternative for listeners who want pure classical without presenters; Klara itself launched in 2001 (rebranding the former Radio 3) and is part of VRT's portfolio alongside Radio 1, Radio 2, Studio Brussel, and MNM; VRT is financed primarily by a Flemish-government dotation and limited advertising and produces programming in Dutch as the public broadcaster for the Flemish Community.
  sources: internal knowledge only
