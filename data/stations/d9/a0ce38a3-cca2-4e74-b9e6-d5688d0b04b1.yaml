research:
  reviewed_at: 2026-06-09
  nature: commercial
  operator: Betriebsgesellschaft Antenne Unna mbH & Co. KG, with editorial production by Veranstaltergemeinschaft Lokalfunk Kreis Unna e.V.; part of the NRW Lokalfunk network (Radio NRW supplies overnight/national programming and ads)
  affiliations: licensed by the Landesanstalt für Medien NRW (LfM); editorially overseen by a non-profit Veranstaltergemeinschaft of civic groups as required by NRW media law; commercial backing via local publishers (Westfälischer Anzeiger / Hellweger Anzeiger group) typical of Kreis Unna media ownership
  audience: Listeners in Kreis Unna (district of Unna, North Rhine-Westphalia, ~390k population) including the towns of Unna, Kamen, Bergkamen, Lünen, Werne, Schwerte and surrounding communities
  format: Local hot AC / news radio - local news, traffic, weather and service information for Kreis Unna combined with current pop hits and oldies; "RADIO NRW" rahmenprogramm overnights and supplies national/world news
  notes: Antenne Unna launched in 1991 as one of the first Lokalradios in North Rhine-Westphalia, operating under the state's distinctive Zwei-Säulen-Modell (two-pillar model) which separates commercial operation from editorial responsibility held by a non-profit citizens' association; its license is granted by LfM and renewed periodically. The station broadcasts on 100.6 MHz from Unna and is part of the 44-station Radio NRW network, which is one of Germany's largest local-commercial radio systems.
  sources: internal knowledge only
