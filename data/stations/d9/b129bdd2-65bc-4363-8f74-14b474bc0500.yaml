  notes: 'Radio Marca is Spain''s national sports talk network, launched on 1 February 2001 and owned by Unidad Editorial, the publisher of the sports daily Marca and part of Italy''s RCS MediaGroup. Its slogan is "La radio que hace afición" and its output is almost entirely sport: football above all, plus basketball, handball, motorsport and tennis. Flagship programmes include Marcador, the rolling live-results show, the morning panel show A diario, Marcador Internacional and El Futbolín. The network runs more than 50 local stations across Spain with regional opt-outs in Barcelona (since 2004), Madrid, Valencia, Seville and elsewhere, and is carried on FM nationwide, on DAB in Madrid and Barcelona, on DTT and online. Earlier catalog metadata describing it as a classical-music station was wrong, and its homepage field was empty.'
