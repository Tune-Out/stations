  notes: Conyers Old Time Radio is a hobbyist internet station from Conyers, Georgia, founded 30 December 2003 and run by Robert D. Merritt (KA4BYP). It streams "the widest variety of programs from the 1930s, 40s and 50s" (detective, western, comedy, sci-fi, soap and drama serials), favouring shows tied to the current date, with Superman daily at 6 PM ET and holiday marathons. It is listener-supported (about $1,500 a year in donations), moved to a new Yesstreaming server in 2026, and is also carried on Alexa, TuneIn, myTuner and Radio Garden.
