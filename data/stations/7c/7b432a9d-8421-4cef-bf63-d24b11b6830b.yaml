  operator: Радио Тангра ЕАД (Radio Tangra Mega Group EAD), one of Bulgaria's largest private radio groups
  affiliations: none known (no religious or political party ties); part of Tangra Mega Radio Group portfolio that also includes Radio Nova, Radio 1 Rock, Avto Radio, Radio 1, Veselina, City, and others
  audience: Bulgarian-speaking adults who enjoy pop-folk (chalga) and ethno music; broad national audience
  format: pop-folk (chalga) and Bulgarian ethno music — contemporary Bulgarian popular folk hits with the tagline "Ритъмът на сърцето!" (The Rhythm of the Heart)
  notes: Radio Veronika is one of Bulgaria's leading pop-folk format stations, a genre that combines traditional Balkan folk melodies with modern pop and dance production; pop-folk/chalga remains commercially dominant but culturally contested in Bulgaria, with critics linking it to commercial mass culture and supporters defending it as authentic working-class popular music; the station distributes via FM in multiple Bulgarian cities and via apps on iOS, Android, Windows, and Huawei AppGallery.
