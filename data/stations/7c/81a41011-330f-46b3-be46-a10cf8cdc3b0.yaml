  nature: non-commercial
  operator: Association "Ici et Maintenant !" — independent associative radio founded by Didier de Plaige
  affiliations: no formal party / religious ties; strong editorial focus on New Age spirituality, parapsychology, ufology, esotericism, and alternative medicine — historically associated with the French free-radio movement
  audience: Paris-region (Île-de-France) and online listeners interested in spirituality, the paranormal, alternative culture, philosophy and counterculture talk
  format: Cultural talk and free-form speech radio; long-form interviews and call-in shows on consciousness, esotericism, UFOs, shamanism, holistic health, society and the arts
  notes: Radio Ici et Maintenant! (RIM) was founded in Paris in 1980 by journalist Didier de Plaige (1948-2022) as one of France's pioneering "radios libres" after Mitterrand's 1981 liberalisation of the airwaves; broadcast on 95.2 MHz FM in Paris for decades; renowned for late-night open-line shows on UFOs and the paranormal that helped popularise French ufology; the linked homepage didierdeplaige.com is an archive site maintained after the founder's death; the station continues online and has been one of France's longest-running independent talk stations.
