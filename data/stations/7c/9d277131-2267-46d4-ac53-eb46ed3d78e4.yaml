  notes: CCTV-15 (音乐频道) is the dedicated music channel of China Central Television, launched on 29 March 2004 and operated by state-owned China Media Group. This entry carries the channel's audio-only HLS feed (伴音) from CCTV's Alibaba CDN. Programming spans Western classical, Chinese traditional and ethnic-minority music, film scores and Mandopop, and the channel was positioned at launch as a domestic alternative to MTV China and Channel V. It remains on air via DTMB and cctv.com streaming.
