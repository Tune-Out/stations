  notes: KLIF is a news/talk station on 570 AM in Dallas, Texas, owned by Cumulus Media and serving the Dallas-Fort Worth metroplex with 5,000 watts by day. It carries the call sign of Gordon McLendon's legendary Top 40 outlet, whose live reporting from Dealey Plaza in November 1963 is a landmark of American radio; the current 570 facility dates from 1990. Programming pairs a local Dallas morning show with syndicated talk including Sean Hannity and Coast to Coast AM, plus Fox News Radio newscasts, and is simulcast on the KSCS HD2 subchannel.
