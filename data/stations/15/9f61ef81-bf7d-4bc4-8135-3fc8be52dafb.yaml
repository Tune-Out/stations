  notes: 'Soul Radio (soulradio.uk) is a Bristol-based independent station playing only classic soul from the 1950s to 1970s, occasionally into the 1980s: Motown, Chicago and Philadelphia soul, Southern and Memphis soul and British soul, from a library of around 350 artists. It is commercial-free, streams online and via Alexa and mobile apps, and directory listings report small-scale DAB carriage in several UK cities. Programming is a curated but largely automated music rotation.'
