  notes: Radio NV (Радіо NV, 'Novoye Vremya') is a private Ukrainian news and talk network that began broadcasting on 12 March 2018 on the frequencies of the former Radio Era after investment firm Dragon Capital bought that network in 2017 to complement its NV magazine and news site. It airs on 96.0 FM in Kyiv and in about 40 Ukrainian cities, carrying rolling news, interviews, expert discussion and public-affairs programming from an independent, pro-European liberal stance. Since the 2022 full-scale invasion it has been one of Ukraine's leading information radio outlets. It is commercially owned rather than state or listener funded.
