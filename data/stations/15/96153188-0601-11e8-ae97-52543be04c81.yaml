  notes: Operavore is WQXR's 24-hour all-opera internet stream, offering complete opera recordings around the clock plus a weekly interview show hosted by mezzo-soprano Marilyn Horne. WQXR (105.9 FM) is New York's classical music station and, since 2009, part of the member-supported New York Public Radio family alongside WNYC; it is not connected to the New York Public Library. Sister streams include New Sounds and WQXR's American Standards.
