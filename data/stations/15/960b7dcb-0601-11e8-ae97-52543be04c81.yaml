  operator: Multimedia Holding (Мультимедиа Холдинг) — the same Russian private radio group that operates Nashe Radio, Best FM and Rock FM; ultimately part of the holdings associated with businessman Vitaly Bogdanov / formerly the Gazprom-linked Prof-Media circle
  affiliations: none formal political/religious; Russian commercial media operating under Roskomnadzor regulation; sister station to Nashe Radio with which it shares the "Chart Dozen" and rock-music orientation
  audience: Russian-speaking adults 18-35 interested in alternative and indie rock
  format: Alternative-rock music station — international and Russian alternative, indie rock, post-punk and Britpop with rock-news inserts and signature shows like "Чартова дюжина" (Chartova dyuzhina)
  notes: Launched 2000 as Russia's first dedicated alternative-rock station; broadcasts on FM 100.5 in Moscow (and via streaming nationwide); operates under Multimedia Holding which has been under increased Russian state-media regulation since 2022; after the 2022 invasion of Ukraine Russian rock-radio brands including Ultra have been constrained by Roskomnadzor restrictions on foreign-artist content and "foreign agent" labelling rules, though Ultra itself has not been individually sanctioned.
