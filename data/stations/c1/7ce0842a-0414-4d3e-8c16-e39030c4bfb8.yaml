  notes: SomaFM is a San Francisco-based listener-supported internet radio network known for experimental and niche music channels. The Vaporwaves channel streams the vaporwave aesthetic genre (a post-modern, sample-based genre that appropriates and subverts 1990s/2000s consumer culture music). SomaFM operates entirely on listener donations and runs commercial-free. Founded in 1999, SomaFM is one of the oldest independent internet radio networks and is known for high-quality streams and eclectic curation.
