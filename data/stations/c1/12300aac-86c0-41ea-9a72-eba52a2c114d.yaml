  notes: Sud Radio is a French national private generalist radio station founded in 1958, originally as a peripheral station broadcasting from Andorra; it was acquired by accounting firm Fiducial (owned by Christian Latouche) in 2011 and relaunched as a Paris-based news-talk format. Since the 2010s it has been widely characterised by media observers as having a right-wing or conservative editorial line, hosting populist and right-leaning commentators (e.g. Andre Bercoff with "Bercoff dans tous ses Etats" and the program "Les Vraies Voix"); it became known for giving airtime to figures critical of mainstream consensus during the COVID-19 pandemic and the gilets jaunes movement. It broadcasts via FM, DAB+, and digital streaming.
