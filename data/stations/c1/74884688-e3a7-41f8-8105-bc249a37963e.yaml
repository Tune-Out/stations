  notes: Yumi Co. Radio is a small French-based internet radio dedicated to Japanese-tinged retro and modern dance music — Showa-era 80s city pop, future funk, nu-disco, vaporwave and chillwave/anime-groove. It is a community/hobby project rather than a commercial broadcaster, distributed only via its own website stream and social channels (Discord, Twitter); listener support tends to be via donations/merchandise rather than advertising. No corporate parent, religious or political affiliation. Sits alongside similar scene stations (Nightwave Plaza, Plaza One) catering to the post-Macintosh Plus vaporwave community.
