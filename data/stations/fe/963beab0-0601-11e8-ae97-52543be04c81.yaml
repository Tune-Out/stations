  format: Adult contemporary / oldies — pop, rock, and "Schlager-free" hits from the 1970s onward, with local news, traffic, and service content
  notes: Radio Arabella München is a Bavarian private commercial AC station founded in 1996 by Wolfgang Fischer (also founder of Radio Arabella Wien). It broadcasts on FM 105.2 MHz in Munich and via DAB+ and online. The station is licensed by Bayerische Landeszentrale für neue Medien (BLM) — Bavaria's regulatory authority for private broadcasters — but it is itself a fully commercial operator funded by advertising. Sister stations exist in Vienna, Salzburg, and elsewhere under the Arabella brand, but each is independently owned. The "public radio" tag in the source catalogue is inaccurate; the station is private commercial. Programming targets the 35–65 demographic with melodic adult hits and Bavarian regional news/lifestyle content.
