  nature: commercial
  operator: RIX FM, operated by I Like Radio AB (part of the FLX media group, ultimately owned by businessman Klas Lund and partners; previously owned by MTG / Modern Times Group)
  affiliations: none religious or political; private commercial broadcaster regulated by Sweden's Myndigheten foer press, radio och tv
  audience: Swedish-speaking adults aged roughly 25-44 across Sweden's metropolitan areas, especially Stockholm (106.7 MHz)
  format: Mainstream / hot adult contemporary pop hits with morning shows, music chart programming and event tie-ins
  notes: RIX FM launched in 1993 as one of the first commercial Swedish-language radio networks (originally a joint venture between Stenbeck's MTG group and Bonnier's SBS), and grew into Sweden's largest commercial radio chain by reach; the 106.7 frequency is the Stockholm transmitter; the network is best known for the long-running "RIX MorronZoo" morning show and the touring "RIX FM Festival" summer concert series; following MTG's divestment of its radio assets, the network is now run by I Like Radio AB / FLX alongside sister formats Lugna Favoriter, Bandit Rock, Power Hit Radio and Vinyl FM.
  sources: https://www.ilikeradio.se/rixfm, internal knowledge
