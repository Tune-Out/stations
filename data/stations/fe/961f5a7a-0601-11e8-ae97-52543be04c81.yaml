  notes: Blu Radio is a Colombian national news and talk network launched on 6 September 2012 by Valorem and Caracol Televisión, with its flagship on 89.9 FM in Bogotá and outlets including 97.9 FM Medellín, 100.1 FM Barranquilla and 91.5 FM Cali plus regional affiliates. Its schedule centres on the morning news programme Mañanas Blu, the midday Meridiano Blu, the sports show Blog Deportivo and the evening opinion programme Voz Populi, with live football coverage. It has become one of Colombia's leading news radio brands and one of the main competitors to Caracol Radio and RCN. The catalog name carries a long list of call signs and frequencies that should be trimmed to 'Blu Radio'.
