  notes: '台海之聲 (Taiwan Strait Voice) is operated by CNR, the official state broadcaster of mainland China, targeting Taiwan and diaspora. Editorial flag: 台海之聲 (Voice of the Taiwan Strait) is China Media Group/CNR''s dedicated Taiwan-facing channel, launched 2019 by merging the former 中華之聲/神州之聲 united-front services (stream path ''wxzhzs'' = 中华之声). Its remit is cross-strait political messaging aimed at Taiwan audiences, i.e. a CNR political channel rather than a music/culture service. Catalog also mis-tags it as a Taiwan station though it is Beijing-operated.'
