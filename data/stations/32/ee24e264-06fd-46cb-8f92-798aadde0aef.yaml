  notes: Le Bon Mix is an independent, ad-free French music station founded by Pierre Denjean and based in Toulouse. It broadcasts on 97.9 FM along the Basque coast (Anglet, Bayonne, Biarritz, Hendaye, Hossegor, Saint-Jean-de-Luz, San Sebastian) and on DAB+ in Bayonne and a dozen Spanish cities including Barcelona, Bilbao, Madrid, Seville and Valencia. Its eclectic playlist of jazz, rock, pop, electro and world music is presented without commercials, and the HiFi stream carried here is a lossless 16-bit FLAC feed at 1411 kbps, one of very few CD-quality radio streams in France, aimed at audiophile network players such as Roon, Cambridge Audio and Lumin.
