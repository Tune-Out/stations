  operator: Privately operated independent webcaster, distributed through the radio.co.ma Moroccan web-radio portal and hosted on the Zeno.FM streaming platform
  affiliations: Amazigh (Berber) cultural / linguistic community of southern Morocco; no party, governmental or religious affiliation disclosed
  audience: Tachelhit (Shilha) and French-speaking Amazigh listeners of the Souss-Massa region, Agadir and the southern-Moroccan diaspora
  format: Amazigh (Tachelhit) and French talk and music — traditional Souss music (Ahwash, Rways), modern Amazigh pop, cultural programming and community news
  notes: Radio Atbir presents itself as "La webradio amazigh du sud marocain" — much more than just a radio, the Amazigh web radio of southern Morocco — and is a francophone-Amazigh community internet station based around Agadir, in Morocco's Tachelhit-speaking Souss-Massa region. It broadcasts 24/7 via internet stream only (no Moroccan HACA terrestrial licence), promoting Amazigh language, music and culture; "Atbir" means "dove" in Tachelhit. Listed in the Moroccan web-radio aggregator radio.co.ma under the "World Talk" category.
