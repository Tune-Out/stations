  notes: Musiq3 is RTBF's cultural music station, on air since 1 October 1961 and broadcast on FM, DAB+, cable, satellite and online across French-speaking Belgium. Its programming centres on classical music but is deliberately open to jazz, world music and film scores under the slogan "Changez d'airs", with the Musiq3 Festival held annually since 2011. RTBF also runs the webradios Musiq3 Jazz, Musiq3 Baroque and Musiq3 Romantique; the station has been directed by Marina de Waha since 2023.
