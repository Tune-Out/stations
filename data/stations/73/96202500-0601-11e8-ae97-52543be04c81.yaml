  notes: 'Virgin Radio UK is a national commercial station launched on 30 March 2016 by Wireless Group, now News Broadcasting, a subsidiary of News Corp, under licence of the Virgin brand; the original Virgin Radio (1993-2008) became Absolute Radio. Its hot-AC format is fronted by The Chris Evans Breakfast Show, which moved from BBC Radio 2 in January 2019, and it reaches about 1.9 million weekly listeners (RAJAR, April 2026). It broadcasts on DAB+ via the Sound Digital multiplex, on Sky and Freesat, and online through the Virgin Radio app, with spin-offs Virgin Radio 80s, 90s (launched March 2026), Chilled and Legends. The live stream is geo-restricted: listeners outside the UK receive a barker message instead of programming, and the plain http stream URL in the catalog now returns 404.'
