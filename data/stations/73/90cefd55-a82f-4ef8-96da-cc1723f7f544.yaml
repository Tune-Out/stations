  operator: Guangdong Radio and Television (广东广播电视台, GRT), a provincial state-owned broadcasting group
  affiliations: Government of Guangdong Province; Chinese Communist Party (CCP) propaganda system; subject to oversight by the National Radio and Television Administration (NRTA)
  audience: Cantonese-speaking listeners in Guangdong Province (especially the Pearl River Delta), Hong Kong, Macau, and overseas Cantonese diaspora
  format: Business, financial news, economic commentary, talk and lifestyle programming in Cantonese, with music and entertainment segments
  notes: Pearl River Economic Radio (珠江经济台) launched on 15 December 1986 as China's first economy-focused radio station and a landmark of reform-era broadcasting; pioneered live-call-in programming and Cantonese-language commercial-style format that influenced PRC radio nationwide; originally under Radio Guangdong, now operated by Guangdong Radio and Television Station (GRT) following the 2014 merger of provincial radio and TV broadcasters; reaches across the Pearl River Delta on FM 97.4 and AM 1062 and historically served as a cross-border bridge to Hong Kong audiences.
