  notes: Tipik is the young-adult radio station of RTBF, the public broadcaster of Belgium's French Community, created in September 2020 when RTBF rebranded its youth radio Pure (formerly Pure FM, itself the successor of Radio 21 in 2004) and merged the brand with the TV channel La Deux. It broadcasts on FM, DAB+ and online across Wallonia and Brussels with a mix of alternative pop, indie, hip-hop and French-language music plus humour, lifestyle and cultural shows aimed at 18-35 year olds. RTBF is funded by a public grant with limited advertising; the stream still uses the legacy 'pure' mount name.
