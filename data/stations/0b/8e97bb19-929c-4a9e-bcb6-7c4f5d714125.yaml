  format: Contemporary hit radio with local Glasgow breakfast and drive shows, Scottish football coverage and networked Hits Radio programming
  notes: Clyde 1 is Glasgow's main commercial pop station, broadcasting on 97.0, 102.3, 102.5 and 103.3 FM plus DAB from studios in Clydebank. It descends from Radio Clyde, Scotland's first commercial station (1973), launching as Clyde FM in August 1988 and taking the Clyde 1 name on 3 January 1990. Now owned by Bauer Media Audio UK and part of the Hits Radio network, it retains locally originated shows and extensive Scottish football coverage alongside networked output.
