  notes: Launched 28 October 1989 as 98FM ("Dublin's Hot 98"), one of the first generation of independent commercial stations licensed under Ireland's 1988 Broadcasting Act; long owned by Communicorp Group (Denis O'Brien), then sold along with FM104, Spin 1038, Newstalk and Today FM to Bauer Media in 2021 as part of Bauer's acquisition of Communicorp's Irish radio portfolio; regulated by Coimisiún na Meán (successor to the BAI); flagship show "98FM's Big Breakfast with Rebecca and Brendan"; also operates DAB and online sub-brands (98FM Dance, 98FM Throwbacks, 98FM Chilled).
