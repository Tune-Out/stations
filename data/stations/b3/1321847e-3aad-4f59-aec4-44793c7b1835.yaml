  operator: Northwest Public Broadcasting (NWPB), licensed to Washington State University
  affiliations: NPR member station, PBS member station; no political or religious affiliations
  audience: English-speaking listeners across eastern Washington, northern Idaho, and parts of Oregon, with the news service targeting public-radio listeners interested in regional, national and international affairs
  format: NPR-based news/talk, including Morning Edition, All Things Considered, BBC World Service, Marketplace and local NWPB-produced news inserts and features
  notes: NWPB is the public broadcasting service of Washington State University in Pullman, formed when WSU's KWSU-TV/AM and Northwest Public Radio operations were unified; it operates a network of FM and AM transmitters across the Inland Northwest including KWSU-AM, KFAE, KZAZ and others, and produces local journalism such as "Northwest Extra," "Inland Stories" and "Solutions Journalism" coverage; funded by a mix of CPB grants, university support, listener memberships and underwriting.
