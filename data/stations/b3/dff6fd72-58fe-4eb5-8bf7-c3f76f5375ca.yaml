  notes: TRT Nağme launched in 2009 as part of TRT's themed-channel expansion, dedicated to Turkish classical (Ottoman / Türk Sanat) and folk music; it sits alongside TRT Müzik (TV) and other TRT Radio channels (Radyo 1, Radyo 3, TRT FM, Radyo Haber, Türkü, etc.); TRT is the country's sole public-service broadcaster, established by law in 1964 and operating under the principles of impartiality enshrined in its founding act, though critics (RSF, Freedom House) have repeatedly accused it of pro-government bias under the AKP era; the m3u8 URL listed here is the live stream of the affiliated TRT Müzik TV simulcast.
