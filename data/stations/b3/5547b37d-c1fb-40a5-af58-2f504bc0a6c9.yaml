  notes: Double J is the Australian Broadcasting Corporation's digital adult-alternative music station, launched in 2014 as the relaunched "JJJ" brand for an older demographic than the youth-focused triple j. It is a digital-only national service available on DAB+, online streaming, and the ABC Listen app; the "QLD" stream refers to Queensland's regional advertising/programming insert. The ABC is Australia's national public broadcaster, founded in 1932, funded by federal appropriation and operating independently of government and commercial interests. Notable Double J presenters have included Myf Warhurst, Caz Tran, Tim Shiel, Tim Rogers, and Henry Wagons. Programming highlights include the daily breakfast and drive shows, weekend specialty programs, and the "J Files" deep-dive on artists.
