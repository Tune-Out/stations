  notes: AIR FM Rainbow Mumbai (107.1 MHz) is part of Prasar Bharati's FM Rainbow network launched on 1 February 1993 with a "fast paced and informal" presentation style aimed at young listeners; the wider AIR FM footprint comprises 626 transmitters covering roughly 60.5% of India's area and 74.75% of its population, with AIR claiming to be the pioneer of FM in India after its 1977 Chennai experimental launch.
