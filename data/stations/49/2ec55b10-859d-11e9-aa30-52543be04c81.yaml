  notes: This entry is the 32 kbps mono feed of RFI Monde, the French-language international service of Radio France Internationale, Paris. RFI was created in 1975 and is a subsidiary of France Médias Monde, the state-owned external broadcasting company funded through the French public-broadcasting budget; it is a member of the EBU and operates with editorial-independence statutes. RFI broadcasts around the clock in French and 16 other languages to more than 150 countries via FM relays (especially in Africa), shortwave, satellite and online, with about 59.5 million weekly listeners (2022), 60% of them in Africa. Its signal has been suspended by military governments in Mali, Burkina Faso and Niger (2022-2023). The catalog entry lacks country, tags and a real homepage and is a lower-bitrate duplicate of the RFI Monde entry.
