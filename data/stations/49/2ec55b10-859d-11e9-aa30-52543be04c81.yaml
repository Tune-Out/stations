  operator: Radio France Internationale (RFI), a subsidiary of France Médias Monde, the French government's external audiovisual public-service holding
  affiliations: French Ministry of Culture / Ministry for Europe and Foreign Affairs (RFI receives a parliamentary appropriation as part of France's public-broadcasting budget); member of the European Broadcasting Union (EBU)
