  format: 24/7 international news, current affairs, magazines, debate and cultural programming broadcast in French and 15+ other languages
  notes: This stream is the "RFI Monde" 32 kbps mono service in French; RFI was founded in 1975 (with roots in earlier French shortwave services going back to the 1930s) and reaches a weekly audience widely reported in France Médias Monde annual reports as over 50 million via shortwave, FM relays in dozens of African and European cities, satellite, web and partner stations; like Deutsche Welle and BBC World Service, RFI operates under editorial independence statutes but is publicly funded; covered globally for its African affairs reporting and occasional diplomatic disputes (e.g., RFI's signal has been suspended in countries such as Mali, Burkina Faso and Niger following 2022-2023 political incidents).
