  notes: 100% Radio Hit is one of the themed web radios (alongside 80's, 90's, Love, Souvenirs and Summer Hits) of 100% Radio, a regional commercial FM network based in Occitanie, south-west France. The parent station, whose slogan is 'Les tubes et l'info', broadcasts local FM services in Albi, Auch, Cahors, Carcassonne, Castres, Foix, Millau, Montauban, Toulouse, Tarbes, Lozère and the Pyrénées-Orientales, and belongs to the Les Indés Radios grouping of independent French stations. The Hit stream is an automated current-hits playlist without local presenters or news, distinct from the FM programme; it is hosted on Infomaniak servers.
