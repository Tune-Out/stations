  notes: Fourtyfive Radio is the campus station of the Faculty of Social and Political Sciences at UPN Veteran Jakarta, founded in 2008 as a student study group (KSM) and now run under the faculty student senate. It broadcasts weekdays 10:00-12:00 and 13:00-15:00 on 107.8 FM and online, with ten regular programmes including Morning Coffee, Coolyeah, Gaspol, PlayHitz, Love O'Clock, Sumpit and ENews. The station exists to train students in broadcasting, and its 128 kbps AAC+ stream is live.
