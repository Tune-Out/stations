  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: Radio Television Hong Kong (RTHK / 香港電台) — statutory public broadcaster of the Hong Kong Special Administrative Region under the Communications and Creative Industries Branch (formerly Commerce and Economic Development Bureau)
  affiliations: Government of Hong Kong SAR (publicly funded); operates under the editorial charter of RTHK; since 2020-2021 the station has come under significantly tightened government oversight following the National Security Law
  audience: Cantonese-speaking Hong Kong general public; emphasis on youth, young adults and music lovers
  format: Cantonese popular music, entertainment, lifestyle and talk; notable programmes include "Music Lover," "Crazy and Happy," "Three a Crowd," and "Music in Action"; also carries community service content
  notes: RTHK is the oldest broadcaster in Hong Kong, tracing its origins to 1928 (GOW); Radio 2 (FM 94.8-96.9 MHz) is the youth-oriented entertainment and Cantopop channel; RTHK as a whole operates seven radio channels (Radio 1-5, Putonghua Channel, and Radio 6 carrying BBC World Service); historically RTHK has had an unusual position as a publicly funded yet editorially independent broadcaster modeled on the BBC, but since the 2019 protests and 2020 National Security Law, multiple senior journalists have resigned, programmes have been pulled, and the editorial line has shifted closer to the government's position; the previous Director of Broadcasting was replaced in 2021 with a civil servant from outside journalism.
  sources: https://www.rthk.hk/, internal knowledge
