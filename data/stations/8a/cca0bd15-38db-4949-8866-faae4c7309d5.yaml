  notes: 'Radio Panamericana is one of Bolivia''s most influential broadcasters, first on air on 17 July 1972 from La Paz and owned by Sociedad Mercantil de Radiodifusión Ltda., part of Grupo Dueri. It carries a generalist schedule dominated by national political news, current affairs, talk and football, and calls itself "la radio bandera de Bolivia" on the strength of its coverage: 96.1 MHz FM in La Paz, 106.3 MHz FM nationally, 580 kHz on AM and 6105 kHz on shortwave, plus satellite distribution and an online stream. It sits within the Red Panamericana group alongside Panamericana TV and offers official iOS and Android apps. Earlier notes dating the station to 1962 on AM 990 were wrong.'
