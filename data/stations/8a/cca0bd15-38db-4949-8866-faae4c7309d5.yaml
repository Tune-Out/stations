  operator: Red Panamericana, a private Bolivian broadcasting group headquartered in La Paz
  affiliations: Editorially independent commercial broadcaster; widely regarded as a major mainstream news outlet in Bolivia with no formal party alignment
  audience: Bolivian Spanish-speaking adults nationwide, with the strongest presence in La Paz, El Alto, Cochabamba, Santa Cruz, and other major cities
  format: News, sports, talk, cultural and variety programming — heavy emphasis on national political news, football coverage, and current affairs
  notes: Radio Panamericana is one of Bolivia's most historically influential AM/FM stations, founded in 1962 (originally on AM 990 kHz) and known for breaking national political stories; it carries Bolivia's national football matches and is part of the Red Panamericana group, which also operates Panamericana TV; reaches most Bolivian departments via owned-and-operated and affiliated stations and via online streaming through Zeno.fm
