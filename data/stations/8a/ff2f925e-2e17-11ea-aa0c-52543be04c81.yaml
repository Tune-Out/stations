  nature: public broadcaster
  operator: Mouv' is a national network of Radio France (France's public service radio group)
  affiliations: Radio France, part of the French public audiovisual system funded historically by the redevance audiovisuelle and now by general state budget
  audience: Young French listeners (roughly 15-30); urban music fans nationwide on FM and DAB+ in major cities
  format: Hip-hop, rap, R&B, urban culture and youth talk; the only national public-service station in France dedicated to rap and urban music
  notes: Founded in 1997 as "Le Mouv'" with a rock identity broadcast from Toulouse, the station moved its headquarters to Paris in 2011 and was repositioned in 2014-2015 under director Bruno Laforestrie around hip-hop and urban culture, becoming the public-service counterpart to commercial urban networks like Skyrock; rebranded simply as "Mouv'" in 2015; has periodically faced political criticism over its niche audience size and budget within Radio France.
  sources: internal knowledge only
