  nature: public broadcaster
  operator: Lembaga Penyiaran Publik Radio Republik Indonesia (LPP RRI), Indonesia's national public service radio broadcaster
  affiliations: Indonesian government - RRI is the statutory public broadcaster established under Law No. 32/2002 on Broadcasting, funded by the state budget (APBN) and license fees, headquartered at Jl. Medan Merdeka Barat 4-5, Jakarta
  audience: Nationwide Indonesian audience seeking news, current affairs and public-interest information in Bahasa Indonesia
  format: 24-hour all-news and current affairs network ("Jaringan Berita Nasional / Kantor Berita Radio Nasional - KBRN"); national and international news, politics, economics, parliamentary coverage, regional reporting
  notes: RRI Pro 3 (also branded "Pro 3 FM" or "KBRN") is the national news channel of RRI, the country's official public broadcaster founded 11 September 1945 just weeks after Indonesian independence with the famous slogan "Sekali di Udara Tetap di Udara" ("Once on air, always on air"); Pro 3 specifically functions as Indonesia's flagship news radio service relaying breaking news across the archipelago and feeding regional RRI stations; one of four core RRI national programmes (Pro 1 regional, Pro 2 youth, Pro 3 news, Pro 4 culture) plus Voice of Indonesia international service; broadcast on FM frequencies in dozens of cities and online via rri.co.id and apps; historically played a key role in announcing the 1945 Proclamation of Independence over the airwaves.
