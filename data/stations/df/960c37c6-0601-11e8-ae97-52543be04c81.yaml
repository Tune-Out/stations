  notes: Cadena 100 is a Spanish national commercial music network that began broadcasting on 1 May 1992 and belongs to Grupo COPE (Ábside Media), the radio group controlled by the Spanish Bishops' Conference, alongside COPE, Rock FM and MegaStar FM. Headquartered in Madrid, it programs adult-contemporary pop in Spanish and English under the tagline 'La mejor variedad musical' with no religious content on air. The morning show '¡Buenos días, Javi y Mar!' draws about 1.18 million listeners and the station recorded 1,785,000 daily listeners in the first EGM wave of 2026, making it Spain's second music radio. It is known for the annual Cadena 100 concert and the 'Por Ellas' breast-cancer benefit.
