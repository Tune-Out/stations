  notes: Heart 70s is a national digital spin-off of Global's Heart network, launched on 30 August 2019 alongside Heart Dance and Heart 80s, playing feel-good 1970s pop and disco hits. Owned and operated by Global Media & Entertainment from Leicester Square, London, it is carried on DAB+ via the Digital One multiplex and online through Global Player. Programming is mostly automated, with a presented weekday breakfast show (6-10am) and Saturday morning show hosted by Carlos since January 2021. It is an ad-funded commercial service, not public radio as the catalog tag suggests.
