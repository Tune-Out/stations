  affiliations: none political or religious; commercial broadcaster regulated by Ofcom; member of Radiocentre UK; charitable arm "Global's Make Some Noise"
  audience: UK adult classical music listeners (typically 35+); largest classical music audience in Europe with approximately 5+ million weekly listeners
  format: Mainstream/accessible classical music, film scores, opera highlights and crossover; "Essential Classical" is a digital sub-stream of curated relaxing classical pieces; tagline "The Most Relaxing Music"
  notes: Classic FM launched 7 September 1992 as the UK's first national commercial radio station, originally owned by GWR Group; acquired by Global in 2007 after a series of mergers; broadcasts on FM (around 100-102 MHz), DAB, online and via the Global Player app; presenters have included Aled Jones, Alexander Armstrong, Charlotte Hawkins, Dan Walker, Margherita Taylor, Myleene Klass and Ritula Shah; sister stations within Global include Heart, Capital, Smooth, LBC, Gold and Radio X; the station runs an annual "Hall of Fame" listener poll, charity work via "Make Some Noise" and the "Classic FM Live" concert series at the Royal Albert Hall.
