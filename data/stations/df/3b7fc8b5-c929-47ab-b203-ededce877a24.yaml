  format: News, current affairs, investigative reporting, talk, analysis, and cultural programming in Russian
  notes: '"Svoboda" (Свобода, meaning "Freedom") is the Russian-language service of Radio Liberty, founded in 1953 (originally as Radio Liberation) as part of U.S. Cold War-era broadcasting to the Soviet Union; today RFE/RL is headquartered in Prague, Czech Republic, which is why this entry is registered with country code CZ; funded through U.S. congressional appropriations via USAGM but operates under a journalistic firewall; Russia designated RFE/RL as a "foreign agent" in 2017 and an "undesirable organization" in 2024, forcing the closure of its Moscow bureau; its journalists have been jailed in Russia and Belarus (including Alsu Kurmasheva and Ihar Losik); the service continues to broadcast via shortwave, satellite, internet, and partner stations to Russian audiences inside and outside Russia, focusing on independent journalism critical of the Putin government.'
  sources: internal knowledge only
