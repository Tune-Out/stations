  nature: public broadcaster
  operator: Österreichischer Rundfunk (ORF), Austria's national public-service broadcaster, regional Landesstudio Oberösterreich
  affiliations: ORF (statutory public broadcaster established by the ORF-Gesetz, funded by the ORF-Beitrag household fee that replaced the GIS licence fee in 2024)
  audience: Adult listeners (broadly 40+) in the federal state of Upper Austria (Oberösterreich); German-speaking
  format: Regional public-service mix — schlager, oldies, adult contemporary music, news and weather, regional culture, traffic, sports and local-affairs talk
  notes: One of nine Landesstudios that together form ORF's "Radio Österreich 1 regional"/"Ö-Regional" network, branded "Radio Oberösterreich"; operates from the ORF Landesstudio in Linz on 95.2 MHz (Linz) and other regional frequencies; programming follows the standard ORF regional template (heavy local news bulletins, "Guten Morgen Oberösterreich", "Frühschoppen", regional culture features) with national news takeovers from Vienna; ORF is structured as a public foundation under Austrian federal law and has been the subject of recurring political debates about board composition and proximity to government parties.
  sources: internal knowledge only
