  operator: Associazione Culturale Jungle Planet Radio, legal seat in Bologna, Italy
  affiliations: Independent cultural association; previously affiliated with RadiolocalidItalia
  audience: International drum-and-bass, jungle and UK-garage listeners; based in Bologna with team members in England
  format: '"100% dnb and jungle music radio" - 24/7 drum and bass, jungle, UK garage, intelligent DnB, grime and bass-music subgenres'
  notes: Founded in 2020 by an Italian DJ/producer using the alias Jahpawa as a non-profit cultural association dedicated to underground UK bass-music culture; operates on the Italian "Associazione Culturale" legal model funded by member contributions (5 EUR membership) and donations rather than advertising; notable programmes include "Lucid Dreams," "Junglist Rotation," "KILLASOUND" and "Jungle Diva"; mission emphasises supporting an "independent community" of DJs and producers around drum-and-bass and jungle.
