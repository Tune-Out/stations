  notes: RMF Polskie Przeboje is one of roughly forty themed web channels on RMF ON, the streaming platform of Kraków-based RMF Group (Radio Muzyka Fakty Grupa RMF sp. z o.o. sp. k.), Poland's largest commercial radio operator. Its whole editorial premise is the tagline "gramy tylko po polsku" — it plays Polish-language pop and rock exclusively, from classic Polish hits to current chart material. The channel is automated rather than presenter-led and is distributed free with advertising or ad-free through RMF ON's premium subscription; it has no separate FM licence and exists only as a stream and in the RMF ON app.
