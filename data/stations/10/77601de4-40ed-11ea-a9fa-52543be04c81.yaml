  notes: Radio 105 Network launched in Milan on 105.0 MHz in 1976 and grew into one of Italy's first national private FM networks; it was acquired by Finelco and then absorbed into Mediaset/RadioMediaset in 2016, joining R101, Virgin Radio Italy and Radio Subasio; flagship shows include "Lo Zoo di 105," a long-running and sometimes controversial morning prank/comedy programme, and tentpole events such as the 105 Summer Festival, 105XMasters winter sports tour, and 105 Mi Casa Live concerts; broadcasts on FM, DAB+ and streaming from Milan headquarters.
