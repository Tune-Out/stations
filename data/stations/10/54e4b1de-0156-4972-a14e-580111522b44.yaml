  notes: SWR4 Baden-Württemberg is the regional service of Südwestrundfunk (SWR), the ARD public broadcaster for Baden-Württemberg and Rhineland-Palatinate, aimed at listeners over 50. It combines Schlager, oldies and German evergreens with hourly regional news, traffic, weather and local windows from SWR's regional studios (Stuttgart, Karlsruhe, Freiburg, Ulm, Tübingen and others). Funded by the German licence fee (Rundfunkbeitrag), it is one of the most-listened-to stations in the state.
