  operator: Originally ABS-CBN Corporation (Philippines' largest media conglomerate, owned by the Lopez family); after ABS-CBN's 2020 franchise denial it briefly went off-air and was revived under different arrangements.
  affiliations: Lopez Holdings / ABS-CBN media group; no religious or political party affiliation, though ABS-CBN itself has been at the center of major Philippine political controversies.
  audience: Filipino mass-market listeners — masa demographic, OPM (Original Pilipino Music) fans, Tagalog-speaking Metro Manila and provincial audiences.
  format: '"My Only Radio" — contemporary OPM (Original Pilipino Music) hits, love songs, ballads and Filipino pop with friendly Tagalog/Taglish DJ presentation.'
  notes: MOR (My Only Radio) launched 2004 as a rebrand of WRR 101.9 (formerly Radio Romance), broadcast on 101.9 MHz in Manila with sister stations across the Philippines; ABS-CBN's broadcast franchise was denied by the Philippine Congress in July 2020 under the Duterte administration, forcing the closure of its radio and TV operations including MOR; the brand was relaunched in some form on digital platforms and via partner stations; widely associated with popular Filipino DJ personalities and the annual "MOR Pinoy Music Awards"; historically one of the most-listened FM stations in the Philippines.
  sources: internal knowledge only
