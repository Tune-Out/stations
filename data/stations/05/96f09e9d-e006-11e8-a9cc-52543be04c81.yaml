  notes: Sirasa FM is one of Sri Lanka's most popular Sinhala-language commercial radio stations, owned and operated by the Maharaja Organisation (also known as the Capital Maharaja Group) through its subsidiary MBC Networks (Maharaja Broadcasting Corporation). The Maharaja group, founded by R. Rajamahendran, is a major Sri Lankan media conglomerate also operating Sirasa TV, Shakthi TV, TV1, MTV Sports, Yes FM (English), and Shakthi FM (Tamil). Sirasa FM has been on air since the late 1990s following Sri Lanka's deregulation of private broadcasting. Known for popular reality shows like "Sirasa Superstar" and "Lakshapathi" (the Sri Lankan adaptation of "Who Wants to Be a Millionaire?"), the station broadcasts island-wide on FM and reaches the Sri Lankan diaspora via internet stream.
