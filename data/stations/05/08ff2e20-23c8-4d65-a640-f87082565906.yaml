  operator: Asociación Radio María España, the Spanish affiliate of the World Family of Radio María (Famiglia di Radio Maria), headquartered in Erba, Italy
  affiliations: Roman Catholic Church; Marian devotion; member of the global World Family of Radio Maria network (>80 countries); funded by listener donations rather than advertising
  audience: Spanish-speaking Catholic faithful in Spain and online listeners across the Spanish-speaking world
  format: Catholic religious programming — daily Mass and Rosary, Liturgy of the Hours, catechesis, talk, sacred music, papal coverage and Marian devotional content
  notes: Founded in Spain in 1999 as part of the global Radio María movement that began in 1983 at the parish of Erba (Como, Italy); operates as a non-profit ecclesial association under the umbrella of the World Family of Radio María and is recognised within the Catholic Church as a lay-led apostolate of evangelisation; broadcasts via FM, DAB, satellite and internet streaming from studios in Madrid; the network's institutional mission is summarised in its motto "una voz cristiana en tu casa" — a Christian voice in the home — and it relies on listener donations ("amigos de Radio María") rather than commercial advertising; politically non-aligned but theologically and morally rooted in Catholic magisterial teaching.
