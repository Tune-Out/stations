  notes: 'Radio Komsomolskaya Pravda is the news-talk radio station of the Komsomolskaya Pravda publishing house, on air since 2009 in Moscow on 97.2 FM and relayed in dozens of Russian cities; this stream is the national ''KP Russia'' feed. It runs 24/7 news bulletins, political commentary, phone-ins and entertainment under the slogan ''radio for those with a head on their shoulders'', drawing on KP''s journalists. The parent newspaper is privately owned (largest shareholder Sergei Rudnov of Baltic Media Group) but is firmly pro-Kremlin, was led for 25 years by Vladimir Sungorkin until his death in 2022, and has deleted anti-war reporting; its output since 2022 amplifies official narratives on the war in Ukraine. Listeners should treat its news coverage as state-aligned. Editorial flag: Radio arm of Komsomolskaya Pravda, a pro-Kremlin tabloid described by the European Commission as Putin''s favourite newspaper; the outlet promotes state narratives and conspiracy theories and has suppressed anti-war reporting since the 2022 invasion of Ukraine.'
