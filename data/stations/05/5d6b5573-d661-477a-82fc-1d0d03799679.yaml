  operator: Corporación Radiotelevisión Española (RTVE) — Spain's state-owned public broadcaster, via its radio division Radio Nacional de España (RNE)
  affiliations: Spanish public-service media; politically independent by statute but governed by a board elected by the Spanish parliament; member of the EBU
  audience: Spanish-speaking news consumers nationwide and via shortwave/internet globally
  format: 24-hour rolling news and current-affairs talk in Spanish, with regional opt-outs and partner content from Radio Exterior
  notes: Radio 5 Todo Noticias launched on 1 October 1994 as Spain's first all-news radio service, modelled on France Info; it carries news bulletins on the hour, sports, weather and short documentary strips, with regional news windows from RNE's territorial centres; RTVE/RNE is funded by state allocation (advertising-free since 2010) and operates under the Ley de la Corporación RTVE; the broadcaster has been subject to recurring debates over the political independence of its governing council.
