  notes: DFM Diskach 90-kh is an online-only sub-channel of DFM, the Moscow dance/CHR station on 101.2 FM owned by Russian Media Group (Russkaya Mediagruppa). DFM went on air on 1 July 2000 as Dinamit FM, replacing Radio 101, rebranded to DFM in 2005-2006 and now reaches about three million daily listeners across dozens of Russian cities. This stream is an automated playlist of 1990s dance-floor hits, one of a family of DFM web channels (Russian Dance, Deep, Club, Vocal Trance, Trap, Insomnia and others) hosted on hostingradio.ru; it carries no presenters or original programming.
