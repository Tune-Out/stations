  notes: Hot FM 105 is one of Pakistan's largest private commercial FM networks, operating dozens of FM 105 frequency stations in cities including Karachi, Lahore, Islamabad, Faisalabad, Multan, Peshawar, Quetta, Gujranwala, Hyderabad, Sukkur and many more; launched in the early 2000s following the liberalisation of Pakistani FM broadcasting under the Musharraf-era PEMRA framework; programming blends entertainment, Urdu-language music, news bulletins, sports coverage and call-in talk shows; competes with FM 100, FM 89 City, Mast FM 103, and Radio Pakistan's FM services; like all PEMRA-licensed stations it operates under content rules that restrict political opinion and "anti-state" content, with PEMRA periodically suspending licences for non-compliant broadcasts.
