  notes: 'Kontrafunk is a German-language internet and DAB+ talk station incorporated in Switzerland at Steckborn, launched on 21 June 2022 by Burkhard Müller-Ullrich with 1.2 million euros from 36 investors. It carries news, interviews and political commentary from an explicitly right-conservative position and began DAB+ transmission in eastern Switzerland in 2024. This entry is the low-bitrate mobile mount of the same icecast.multhielemedia.de feed already catalogued as the canonical Kontrafunk stream. Editorial flag: German Wikipedia characterises Kontrafunk as right-conservative alternative media that has carried concrete disinformation and anti-vaccination rhetoric, with the taz describing it as reflecting the AfD''s tone; about a third of its founding staff came from the Russian state propaganda outlet RT DE. This is a disinformation concern rather than ordinary partisan talk.'
