  notes: 'Lithuanian commercial news radio station with tagline "Žinojimas keičia" (Knowledge changes). Operating across Lithuania on multiple FM frequencies (Vilnius 97.3 MHz, Kaunas 104.9 MHz, Klaipėda 102.2 MHz, and 11 other cities). Programming includes analytical shows: Aktualusis interviu (Current Interview), Pozicija (Position), Atviras pokalbis (Open Conversation), Ekonominiai pietūs (Economic Lunches), and Radijo lentyna (Radio Bookshelf). Active on social platforms including Facebook, LinkedIn, YouTube, TikTok; mobile apps and livestreaming available.'
