  operator: Padamyar FM Media Company Limited
  affiliations: none publicly disclosed; private broadcasters in Myanmar nonetheless operate under the licensing regime of the Ministry of Information and, since the 2021 coup, are subject to State Administration Council content controls
  audience: Burmese-speaking general audience across Myanmar — claimed 40 million people in coverage zone, urban and rural
  format: General-entertainment FM — Burmese pop and international music, news bulletins, lifestyle, education and entertainment talk
  notes: Founded in 2009 as one of Myanmar's earliest private FM brands; operates 17 relay transmitters spanning 10 states/regions across roughly 264,628 km² (frequencies between 88.2 and 93.7 MHz in Yangon, Mandalay, Sagaing, Myitkyina and other cities); notable programmes include Knowledge Bank, Relationship Goals, Beauty O'Clock, Healthy Life, Green Lover, Songs on Chart and Let's Do It; mission stated as "ကျွန်ုပ်တို့သည် နားဆင်သူများ၏ နေ့စဉ်ဘဝတွင် အဖော်မွန်ကောင်းဖြစ်ရန် အမြဲကြိုးစားနေပါသည်" ("We always strive to be a good companion in our listeners' daily lives"); like all Myanmar private media it has had to navigate the post-2021 junta's restrictions on news content.
