  notes: Kossuth Rádió is Hungary's main public news and talk radio channel, founded in 1925 as Rádió Budapest and named after Lajos Kossuth in 1949; the MR1 prefix was dropped in 2012. It broadcasts nationwide on 47 FM transmitters (107.8 MHz in Budapest) and on 540 kHz AM from Solt, Europe's most powerful medium-wave transmitter. After years of criticism that public media served as a government mouthpiece, the station suspended its schedule on 7 July 2026 with an on-air apology for having 'lied for so many years', and relaunched on 24 August 2026 under the slogan 'Újra mindenkié' (everyone's radio again) with a refreshed news and current-affairs programme.
