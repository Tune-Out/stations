  notes: Radio 105 Network was founded in Milan in 1976 by Alberto Hazan and grew into one of Italy's leading CHR/pop stations; it was acquired by Mediaset's RadioMediaset (then Finelco) in stages culminating in full control during the 2010s, making it a Berlusconi-family-owned commercial broadcaster alongside R101, Radio Monte Carlo, Virgin Radio Italia, and Radio Subasio; "Lo Zoo di 105" is the network's flagship long-running irreverent morning comedy show hosted by Marco Mazzoli since 1999, known for prank calls, satire, and a libertine sense of humor that has occasionally drawn AGCOM (Italian comms regulator) sanctions; the "Zoo Radio" stream rebroadcasts and extends Zoo di 105 content as a 24/7 webchannel.
