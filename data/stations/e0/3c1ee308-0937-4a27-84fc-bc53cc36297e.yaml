  operator: Mauritius Broadcasting Corporation (MBC), a statutory corporation established under the MBC Act 1982 and wholly owned by the Government of Mauritius
  affiliations: Government of Mauritius (Ministry of Information Technology, Communication and Innovation); critics including Reporters Without Borders and opposition parties have repeatedly accused MBC of pro-government bias under successive administrations
  audience: Mauritian general public, in particular younger listeners and dance/pop fans; broadcast nationally across Mauritius in English, French and (on other MBC channels) Creole, Bhojpuri and Hindi
  format: Top-40, dance and contemporary pop music targeting youth — one of MBC's commercial-style music channels alongside RM1, RM2, RM3, Radio Mauritius and Kool FM
  notes: MBC operates television channels including MBC1, MBC2, MBC3 and several radio stations under the tagline "Inform, Educate, Entertain"; "Best FM" is its English/French-language top-40 music network and one of several music-oriented sub-brands targeting Mauritius's multilingual population; MBC has long been the subject of political controversy with multiple national-assembly debates over its editorial independence and frequent allegations that news bulletins favour the ruling party; the corporation is funded through a licence fee collected with electricity bills, government grants and advertising revenue; the broadcaster also operates Rod FM serving Rodrigues island.
