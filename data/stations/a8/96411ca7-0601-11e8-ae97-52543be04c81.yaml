  notes: Radio Caprice (radcap.ru) is a long-running Russian internet radio project that runs hundreds of narrowly defined, automated genre channels from its own servers, and Dark Electro / Aggrotech is one of them, playing harsh EBM, aggrotech and dark electro around the clock with no presenters. The channels are ad-free and appear to be a hobby operation; there is no editorial programming, shows or public ownership information, and the earlier 'community-curated' and 'non-profit with listener support' claims are unverified.
