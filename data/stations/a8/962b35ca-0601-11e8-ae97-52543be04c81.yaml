  notes: Юмор FM (Yumor FM) Belarus is a Minsk-based commercial comedy-and-music station broadcasting on 93.7 FM in Minsk and on FM in Grodno (89.9), Vitebsk (96.2), Mogilev (91.9), Brest (87.5) and Gomel (92.1). It launched on 1 June 2014 as a locally licensed version of the Russian Yumor FM brand, which Gazprom-Media Radio created in Moscow in 2005; the Belarusian station is run by a separate local company with its own schedule and audio branding. Programming mixes jokes, sketches and stand-up clips with pop hits, anchored by the weekday morning show "Утро с Юмором". Belarusian broadcast media operate under close state regulation, but the station's content is entertainment rather than news or politics.
