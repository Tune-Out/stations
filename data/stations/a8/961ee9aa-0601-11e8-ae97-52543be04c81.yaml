  notes: Jawhara FM is a private commercial radio station based in Sousse, Tunisia, launched on 25 July 2005 and named after the city's nickname 'pearl of the Sahel'. It broadcasts on 102.5 FM in Sousse plus 89.4, 90.7, 103.2, 104.4 and 107.3 MHz across the Sahel region, in Tunisian Arabic and French, with a mix of Arabic and Western music, news bulletins, talk and sports. It was one of the first privately licensed stations in Tunisia and remains among the most listened regional broadcasters in the country.
