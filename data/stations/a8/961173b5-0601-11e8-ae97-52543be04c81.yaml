  notes: SomaFM Lush is one of the channels of SomaFM, the commercial-free, listener-supported independent internet radio service founded by Rusty Hodge in San Francisco in 2000. The channel is programmed as "sensuous and mellow female vocals, many with an electronic influence" — downtempo, dream-pop and mellow electronica, explicitly avoiding techno and EDM. SomaFM operates around 40 hand-curated, DJ-programmed channels and is funded entirely by listener donations and merchandise, carrying no advertising. Lush is offered at 128k MP3, 128k AAC and 64k AAC; the site's copyright reads ©2000-2026, confirming it is still operating. SomaFM is widely regarded as a benchmark for human-curated internet radio.
