research:
  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: DR (Danmarks Radio), Denmark's independent public-service broadcaster
  affiliations: state-funded public broadcaster (since 2022 financed from the general government budget after the licence fee — medielicensen — was abolished); editorially independent, governed by a DR Board; EBU member
  audience: Danish-speaking adults in the Sjælland (Zealand) region — Roskilde, Køge, Holbæk, Kalundborg, Slagelse, Næstved, Vordingborg and surrounding areas (excluding Greater Copenhagen, which is served by DR P4 København)
  format: Regional adult-contemporary public radio — Danish and international pop hits with strong regional news, traffic, weather, sport and listener service for Zealand
  notes: P4 is DR's most-listened-to radio network nationally, split into 11 regional channels of which DR P4 Sjælland is one, broadcasting from DR's regional studio in Næstved and Roskilde with daily regional windows (morning, midday, afternoon) opted out of the shared national P4 schedule; the channel's main FM frequencies cover Zealand outside the capital area; DR's overall public-service remit, codified in its public-service contract with the Ministry of Culture, requires impartial news, Danish cultural content and broad demographic reach; recent years have seen significant DR budget cuts (notably the 2018 media agreement reducing DR's funding ~20%) and a 2022 transition from licence fee to tax funding that has been politically contentious.
  sources: internal knowledge of DR and Danish public broadcasting
