  audience: Informed adult listeners across northern Germany; German language; Niedersachsen (Lower Saxony) regional opt-out
  format: Full-service news, current affairs, culture and background reporting ("Kulturradio"-adjacent info channel) with regional Niedersachsen windows
  notes: NDR Info is NDR's flagship rolling-news and current-affairs channel, launched 1994 as a 24/7 information station modelled on BBC-style "all-news/all-talk" public radio. It carries hourly news, in-depth political and economic features, parliamentary coverage, the well-regarded business programme "Wirtschaft kompakt", science magazine "Logo - Das Wissenschaftsmagazin", and the long-running maritime weather forecast "Seewetterbericht" (a public-service duty inherited from German radio history). The Niedersachsen variant carries Lower Saxony regional opt-outs for local news. NDR was founded 1956 with HQ in Hamburg; it is co-funded by Hamburg, Lower Saxony, Schleswig-Holstein and Mecklenburg-Vorpommern. As ARD public-service media, programming is supervised by a Rundfunkrat (broadcasting council) including civil-society representatives; the station is bound by a legal mandate for impartial, comprehensive information ("Grundversorgung").
  sources: internal knowledge only
