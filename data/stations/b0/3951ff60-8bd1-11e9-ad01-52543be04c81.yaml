  notes: Radio Antalya is an independent online-only station founded in 2019 by three friends, Umut, Can and Onur, and billed as Antalya's "most free and original digital radio". Onur curates the indie, rock and electronica playlists around the city's mood, while Can and Umut contribute special mixes; the project was largely dormant through the pandemic and was relaunched with new playlists and site in 2025. It has no FM licence and no link to Turkey's public broadcaster TRT, so the previous "public broadcaster" classification was wrong.
