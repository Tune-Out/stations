  operator: Radio Televisyen Malaysia (RTM), under the Ministry of Communications of the Government of Malaysia
  affiliations: Government-funded national broadcaster; no formal religious or party affiliation but editorial line aligned with Malaysian government policy
  audience: Malaysian Chinese community nationwide, broadcasting primarily in Mandarin (with some Cantonese and other dialect content) under the tagline 爱FM 越听越爱 ("the more you listen, the more you love it")
  format: "Full-service Mandarin-language radio: news, current affairs, talk, lifestyle, music and cultural programming"
  notes: Ai FM (爱FM, literally "Love FM") is one of RTM's national radio networks, launched in 2005 as a rebrand of the older RTM Chinese-language service (Radio Malaysia Saluran 5); it broadcasts on FM frequencies in major urban centres across Peninsular Malaysia, Sabah and Sarawak, and is one of RTM's six national networks alongside Nasional FM (Malay), TraXX FM (English), Minnal FM (Tamil), Asyik FM (Orang Asli/indigenous) and Klasik Nasional; the station shares RTM's mandate to "inform, educate and entertain" in line with national broadcasting policy.
