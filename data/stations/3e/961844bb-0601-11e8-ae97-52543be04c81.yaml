  operator: Radiópolis (Sistemas Radiópolis, S.A. de C.V.) — joint venture historically owned by Grupo Televisa and Grupo PRISA; Televisa's 50% stake was transferred to Corporativo Coral in 2020.
  affiliations: Affiliated with Spanish news/talk brand "W Radio" via Grupo PRISA (Cadena SER); no formal political affiliation, though widely considered mainstream/establishment Mexican media.
  audience: Mexico City and national audiences seeking Spanish-language news, talk, political analysis and sports.
  format: News/talk simulcast on AM 900 kHz and FM 96.9 MHz featuring journalism, opinion, interviews and live sports.
  notes: XEW-AM began broadcasting 18 September 1930 — founded by Emilio Azcárraga Vidaurreta with Mexico Music Corporation and NBC; nicknamed "La Voz de la América Latina desde México" and considered the birthplace of Mexican commercial radio. XEW-AM is a Class A clear-channel transmitting at 100 kW. Rebranded from a music station to news/talk "W Radio" in 2002 following PRISA's 2001 entry; flagship morning programme has historically been "Así las cosas" / "Hoy por Hoy".
