  notes: Guangdong Music Radio (广东广播电视台音乐之声) is the professional music channel of Guangdong Radio and Television (GRT), the provincial state broadcaster in Guangzhou. It traces its roots to China's first stereo radio station in 1979 and formally launched on 23 January 1991; it broadcasts in Cantonese and Mandarin on FM 99.3 and 93.9 covering Guangdong plus Hong Kong and Macau. Programming is mainstream Chinese and international pop with news, sport and lifestyle segments, and it streams via the Lizhi/Yueting apps and QingTing (qtfm.cn).
