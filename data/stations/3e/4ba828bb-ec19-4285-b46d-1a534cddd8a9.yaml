  nature: public broadcaster
  operator: Radiodiffusion Télévision Sénégalaise (RTS), the national public broadcaster of Senegal, headquartered in Dakar
  affiliations: Senegalese state broadcaster under the Ministry of Communication; reports to the government and operates as a public service entity
  audience: Senegalese national audience; primary language French with significant Wolof content
  format: RSI (Radio Sénégal Internationale) is RTS's international/cultural channel on 92.5 FM in Dakar, broadcasting news, cultural programming, music, and current affairs
  notes: RTS was established at independence in 1960 (originally as ORTS, the Office de Radiodiffusion Télévision Sénégalaise, formalized in 1973) and operates the national TV channels RTS 1-5 and multiple radio networks including Radio Sénégal Internationale (RSI), Chaîne Nationale, and regional FM stations; the broadcaster's stated mission is "Le public, notre raison d'être" (The public is our reason for existence); programs include the news bulletins "JT 20H" and "Xibaar Yi" (Wolof) and current affairs shows like "Kenkeliba"; like many African state broadcasters, RTS has historically been criticized for pro-government editorial bias, though it operates alongside a vibrant private radio sector in Senegal.
  sources: https://www.rts.sn/, internal knowledge
