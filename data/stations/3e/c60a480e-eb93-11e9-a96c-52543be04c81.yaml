  notes: Classique Plus is one of the thematic webradios of France Musique, Radio France's public classical channel founded in 1954. It streams complete classical works, from symphonies and concertos to opera and chamber music, as a continuous presenter-free flow drawn from Radio France's own concert recordings and its archives, sitting alongside sister webradios such as Classique Easy, Concerts Radio France, La Jazz, La Baroque, Ocora Musiques du Monde and Musiques de Films. Radio France is publicly funded (via an earmarked share of VAT since the 2022 abolition of the licence fee) and the stream is offered in high-quality 192 kbps AAC.
