  notes: Radio 3 is the alternative-music and culture channel of Radio Nacional de España, part of Spain's public broadcaster RTVE. It launched on 1 July 1979 and programmes indie, electronic, alternative rock, folk, flamenco, jazz, blues, reggae and world music alongside literature, cinema and visual-arts coverage under the slogan "Eres lo que escuchas". It was awarded Spain's Gold Medal for Merit in the Fine Arts in 2009 and carries the Radio 3 Extra online video strand; it broadcasts nationally on FM, DAB+, TDT, satellite and stream.
