  nature: public broadcaster
  operator: Bayerischer Rundfunk (BR), the Bavarian member of the ARD public broadcasting consortium
  affiliations: ARD; financed via the German Rundfunkbeitrag licence fee and chartered under the Bayerisches Rundfunkgesetz
  audience: Educated German-speaking adults across Bavaria with an interest in culture, politics, current affairs, science and literature; secondary national reach via DAB+ and streaming
  format: Public-service "Wort und Kultur" (word and culture) channel mixing in-depth news magazines, features, radio drama (Hörspiel), classical/jazz/world music and religious programming
  notes: Bayern 2 launched in 1950 as BR's second radio programme and was modernised in 2008 into a single nationwide stream after merging the previously separate Bayern 2 Nord and Süd opt-outs; flagship strands include the early-morning current-affairs magazine "radioWelt", the long-running cultural and literary magazine "Diwan", "IQ - Wissenschaft und Forschung" (science), "Zündfunk" (alternative/youth culture, broadcast since 1974), "kulturWelt", and "Bayerisches Feuilleton"; the channel carries the Catholic-church liturgical hour and Protestant services on Sundays as part of BR's statutory religious-broadcasting remit; widely regarded as one of the most ambitious cultural radio services in German-language Europe alongside Deutschlandfunk Kultur and Ö1.
