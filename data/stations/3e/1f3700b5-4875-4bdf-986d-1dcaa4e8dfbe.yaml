  format: Public-service "Wort und Kultur" (word and culture) channel mixing in-depth news magazines, features, radio drama (Hörspiel), classical/jazz/world music and religious programming
  notes: Bayern 2 is Bayerischer Rundfunk's culture and information channel, on air since 18 August 1950 and broadcast across Bavaria and South Tyrol on 41 FM frequencies, DAB+ and online. It is a word-and-culture service mixing in-depth news magazines such as 'radioWelt', the science strand 'IQ', the literary and cultural magazine 'Diwan', the youth-culture programme 'Zündfunk' (since 1974), radio drama and a broad music selection from classical to world music, plus statutory religious broadcasts. Licence-fee funded as part of ARD, it is regarded as one of the most ambitious cultural radio services in German-speaking Europe.
