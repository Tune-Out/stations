  operator: Radiodifusora del Centro S.A. (LV3), based in Córdoba, Argentina; group owned/run by the Remonda/Mansilla family for decades.
  affiliations: none known politically; member of the Cadena 3 network which extends nationally with affiliate stations.
  audience: National Argentine audience with a Córdoba-province stronghold; mainstream adult Spanish-speaking listeners.
  format: Full-service AM news/talk/music station — noticias, sports, folk, cuarteto, and popular music.
  notes: Cadena 3 originated as LV3 Radio Córdoba (founded 1929), historically Argentina's most-listened-to AM station outside Buenos Aires. The brand expanded into a national network ("Cadena 3 Argentina") with affiliates across the country, plus spin-offs Cadena Heat, La Popu, and Radio Cosquín Rock. Programming mixes news 24h, sports ("La Cadena del Gol"), and cuarteto/folk music; the station is closely identified with Córdoba's cultural identity.
