  nature: public broadcaster
  operator: All India Radio (Akashvani) — radio division of Prasar Bharati, India's statutory public service broadcaster established under the Prasar Bharati Act of 1990 (operational from 1997).
  affiliations: Government of India (autonomous public broadcaster under the Ministry of Information and Broadcasting); no religious or party-political affiliation but is part of state public-service infrastructure.
  audience: Punjabi-speaking listeners in Punjab and the wider Sikh/Punjabi diaspora; also accessible nationwide and globally via streaming.
  format: Punjabi-language news, agricultural information, devotional music (Gurbani, Sufi, folk), Punjabi film songs, talk and cultural programming.
  notes: All India Radio dates to 1936 and is one of the world's largest broadcasting networks with 470+ stations covering ~92% of India's area and ~99% of population. The AIR Punjabi service broadcasts from Jalandhar, Amritsar and Patiala among other Punjab stations. Prasar Bharati operates AIR alongside Doordarshan (TV). Programming includes Gurbani Kirtan from the Golden Temple and the daily Punjabi News bulletin.
  sources: https://prasarbharati.gov.in/homepage-air/, internal knowledge of All India Radio / Prasar Bharati
