  notes: Classical KUSC broadcasts on 91.5 FM from the University of Southern California and went on the air on 24 October 1946 as the first station in the United States owned by a privately endowed university. It moved to a full classical format in 1973 and is now the anchor of Classical California, the statewide service it shares with KDFC in San Francisco, reaching Los Angeles plus repeaters in Santa Barbara, Thousand Oaks, Palm Springs and San Luis Obispo. Its programming was integrated with KDFC's in February 2026.
