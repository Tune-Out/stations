  notes: Halk TV (literally "People's TV") is a national Turkish news channel founded in 2005; previously owned by the CHP for a period, then privatised in 2015, with Cafer Mahiroğlu's group acquiring control in 2018; under Mahiroğlu's ownership the channel positioned itself as an opposition voice to the AKP government, hosting commentators such as Ayşenur Arslan, Şirin Payzın and Suat Toktaş. Halk TV has been repeatedly fined and sanctioned by Turkey's broadcasting regulator RTÜK for content critical of the government, drawing concern from international press-freedom organisations.
