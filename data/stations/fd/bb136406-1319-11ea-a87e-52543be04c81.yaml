  notes: Hawaiian Rainbow is a dedicated internet radio station specializing in Hawaiian music and folklore. The station streams traditional Hawaiian music genres including slack-key guitar (kī hōalu), ukulele-driven compositions, chants (mele) and contemporary Hawaiian artists. Hawaiian music has deep cultural significance to native Hawaiian communities and is central to Hawaiian cultural preservation efforts. The station serves both local Hawaiian audiences in the islands and the global Hawaiian diaspora. Streams via stream1.hawaiianrainbow.com at standard bitrate (128 kbps MP3). The station appears to be independently operated and community-oriented toward Hawaiian cultural heritage and music traditions.
