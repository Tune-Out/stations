  audience: Young Australians, primarily aged 18-35; English-speaking; alternative and independent music fans nationwide
  format: Youth-oriented alternative/indie/electronic music station with news, current affairs, comedy and specialty music shows; champions Australian and unsigned artists
  notes: triple j launched 19 January 1975 as 2JJ on AM in Sydney before moving to FM and expanding nationally in the late 1980s/early 1990s; broadcasts via terrestrial FM, DAB+ and streaming across all states and territories; flagship programs include the breakfast show, Like A Version live covers, the Unearthed unsigned-artist platform, and the Hottest 100, the world's largest music poll which moved from Australia Day to the fourth Saturday in January 2018 amid debate about Indigenous reconciliation; this specific stream serves the eastern Australian timezone (NSW, VIC, ACT, TAS) via Media Hub Australia's CDN; sister services include triple j Unearthed and Double J; routinely a launchpad for Australian artists internationally (e.g., Tame Impala, Flume, Courtney Barnett).
