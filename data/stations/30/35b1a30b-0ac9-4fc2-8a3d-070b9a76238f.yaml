  notes: Ilayaraja Super Beats Radio is one of around a dozen artist- and genre-specific stations operated by the SouthRadios network, which runs dedicated streams for Tamil film personalities including Ajith, Vijay, Harris Jayaraj, Anirudh, and Ilaiyaraaja. The network distributes via web, iOS, and Android apps. Ilaiyaraaja, the namesake composer, is a Padma Bhushan recipient credited with over 1,000 Indian film soundtracks. No religious, governmental, or political affiliations evident.
