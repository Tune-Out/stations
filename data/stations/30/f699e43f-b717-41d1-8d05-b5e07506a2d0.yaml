  operator: Mediacorp Pte Ltd (Singapore's national public broadcaster, wholly owned by Temasek Holdings, the Singapore government's investment company)
  affiliations: Government of Singapore (via Temasek Holdings); part of Mediacorp's Malay Broadcast Division alongside Ria 89.7FM and Suria TV. Carries Islamic religious programming for Singapore's Muslim Malay community but not a religious station per se.
  audience: Malay-speaking Singaporeans (primarily 30+); Malay-language adult contemporary listeners; broadcasts within Singapore on 94.2 FM
  format: Malay-language adult contemporary music, news from Mediacorp's Berita (Malay news) newsroom, radio dramas, and Islamic religious programming
  notes: Lineage traces to Radio Singapura's Malay Service launched 4 January 1959. Began 94.2 FM relay 15 July 1967; rebranded Radio 2 on 1 January 1982, then Warna ("colour") on 23 November 1991. Consolidated into Mediacorp's Malay Broadcast Division in August 2013. Nielsen surveys rated it Singapore's most-listened-to Malay station in 2016 and 2020. Streams via melisten (Mediacorp's official audio platform).
