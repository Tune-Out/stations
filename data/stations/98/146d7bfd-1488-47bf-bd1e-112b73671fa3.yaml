  operator: GROOTfm 90.5 community-licence broadcaster (advertising handled via BDM Media); Pretoria/Gauteng-based
  affiliations: Christian (non-denominational evangelical/reformed Afrikaans culture); not aligned with a political party but rooted in the Afrikaans/Boer heritage community
  audience: Afrikaans-speaking Christian families in Gauteng (Pretoria and surrounds), also on DStv audio channel 820 nationally
  format: Afrikaans Christian community radio with music (gospel and Afrikaans hits), talk, news, faith content and rural-life programming
  notes: Operates under an ICASA community-broadcast licence on 90.5 MHz FM in Pretoria; states it is "op 'n missie om deur die verlossingskrag van Jesus Christus, Suid-Afrika en sy mense te inspireer, te mobiliseer, en 'n impak te maak" ("on a mission to inspire, mobilise and make an impact through the redemptive power of Jesus Christ") with the slogan "entertainment that makes a difference"; flagship shows include "Die GROOT Ontbyt" (breakfast), "GROOTplaas" (farm/rural lifestyle), "Gospel Top 10" and "Gister se Grotes" (oldies/requests); runs community projects such as "24uur GROOT Biddag" (24-hour prayer day), "Die GROOT Stap" (community walk) and school competitions.
  sources: https://www.grootfm.co.za/
