  operator: PT Radio Suara Giri (private Indonesian local broadcaster)
  affiliations: Local Gresik-area commercial broadcaster; the "Giri" name and station identity reference Sunan Giri, the 15th-century Wali Songo Islamic saint and founder of the Giri Kedaton sultanate in Gresik, giving the station a cultural connection to Gresik's strong Islamic heritage
  audience: General-interest Indonesian (Bahasa) and Javanese listeners in Gresik Regency and the broader Surabaya metropolitan area of East Java
  format: Pop music — Indonesian pop, dangdut, Javanese-language hits, and Top 40 alongside news, local talk, and community information
  notes: Suara Giri FM broadcasts on 98.4 MHz from Gresik, East Java, a coastal city north of Surabaya with deep historical ties to the spread of Islam in Java; the station serves the Gresik–Surabaya region with a mix of music and community programming; one of many private local FM stations licensed under Indonesia's KPI/Kominfo broadcasting regulations
  sources: internal knowledge only
