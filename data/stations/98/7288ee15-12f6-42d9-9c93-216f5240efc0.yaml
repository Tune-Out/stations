  notes: Raadio KUKU is Estonia's leading commercial talk and news radio station, founded in 1992 shortly after Estonian independence; long owned by Trio LSL, the country's biggest private radio group, it has gone through ownership changes reflecting Estonian media consolidation (Trio LSL/Polsat-era stake, Postimees Grupp dealings, and more recently Estonian Media Group); KUKU is the talk counterpart to its sister music stations Sky Plus, Sky Raadio and Power Hit Radio, and is widely regarded as the country's main commercial alternative to public broadcaster Eesti Rahvusringhääling's (ERR) Vikerraadio for serious news and political discussion; flagship programmes include "Keskpäevatund", "Vikerhommik"-style morning talk, and interview shows with leading Estonian politicians, businesspeople and cultural figures.
