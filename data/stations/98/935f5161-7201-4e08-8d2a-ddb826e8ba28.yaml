  operator: Société Diwan (Diwan FM) — a Tunisian private radio company
  affiliations: none formally declared; privately owned commercial broadcaster regulated by Tunisia's HAICA (Haute Autorité Indépendante de la Communication Audiovisuelle)
  audience: Tunisian Arabic-speaking listeners, especially in Sfax governorate and Greater Tunis; broad demographic
  format: Generalist mix of news, current affairs, talk, sports, and music in Tunisian Arabic; slogan "صوتكم" (your voice)
  notes: Launched after Tunisia's 2011 revolution as one of the many private regional FM stations licensed in the post-Ben Ali era; broadcasts on 91.2 FM in Sfax (its primary base) and 93.5 FM in Greater Tunis; signature programmes include "Hena Tunisia" (current affairs), "Nas Al-Diwan" with Samah Miftah, "Extra Time" (sports) and "Sahat Saeeda"; covers national and regional news, politics, economy, sport, culture, environment and agriculture; positions itself as a community-oriented voice for Tunisian listeners.
