  notes: PSB Radio is the streaming outlet of Public Speaking Bali, a training school and community forum at Jl. Terompong No. 10, Denpasar, Bali. The parent organisation teaches public speaking, confidence, personal branding, presentation and negotiation through two-month classes, private lessons, corporate in-house training and a PSB Teens programme for ages 8 to 15. The radio strand gives students an on-air practice platform and is promoted through the @psbradio Instagram account. It is a small volunteer- and student-driven operation rather than a licensed broadcaster.
