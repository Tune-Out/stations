  notes: Radio Nacional del Paraguay is the state radio of Paraguay, founded on 2 September 1942 and today run by the Ministry of Information and Communication Technologies (MITIC). Its flagship ZP1 transmits with 100 kW on 920 AM from Asunción, with a separate 95.1 FM service and regional outlets in Pilar (700 AM) and San Pedro (105.9 FM), broadcasting news, cultural programming and music in Spanish and Guaraní. It served as a propaganda organ during the Stroessner dictatorship but now operates as a conventional government public broadcaster.
