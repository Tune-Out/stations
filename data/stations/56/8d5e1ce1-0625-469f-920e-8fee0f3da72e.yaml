  notes: Radio ffn ("Funk und Fernsehen Nordwestdeutschland") launched on 31 December 1986 as Lower Saxony's first private commercial radio station, becoming one of the first private German broadcasters to break the public-broadcasting monopoly under the federal Bundesländer media liberalisation of the mid-1980s; broadcasts statewide on a network of FM transmitters with strong morning show "Guten Morgen Niedersachsen" and long-running comedy segment "Günther, der Treckerfahrer" (Günther the Tractor Driver, voiced by Matthias Brodowy); previously partly owned by Madsack Mediengruppe (publisher of the Hannoversche Allgemeine Zeitung) along with other regional publishers and currently operated by ffn-Mediengruppe GmbH & Co. KG; supervised by the Niedersächsische Landesmedienanstalt (NLM), the Lower Saxony state media authority that licenses private broadcasters; the station also operates spin-off web streams covering 80s, 90s, 2000s, dance, rock, and gold formats, and hosts the Sunday "Die barba radio show" with TV host Barbara Schöneberger.
