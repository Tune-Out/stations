  audience: Czech adult music enthusiasts of "black music" genres (funk, soul, R&B, hip-hop, reggae, Latin) - a niche urban/groove-music audience
  format: Specialised "black music" / urban groove playlist station ("The Best Music!") with funk, soul, R&B, reggae, Latin and hip-hop.
  notes: Founded 2005 as a niche music broadcaster filling a gap in Czech radio for groove/black-music programming. Broadcasts on FM in regional Czechia (Usti nad Labem 101.2, Tabor 88.7 and western/central Bohemia) plus DAB+ (COLORDAB+) and online streams. Notable shows include Romeo SHOW (morning drive), DJ Friky's FRIKOLORA, "Radionovely z Venezuely" (Venezuelan radio-novelas) and reggae/blues specials. The station emphasises live broadcasting and listener interaction via song requests.
