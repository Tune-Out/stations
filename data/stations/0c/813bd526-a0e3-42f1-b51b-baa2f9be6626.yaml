  notes: Truth Radio is WBCR 1470 AM, an East Tennessee station serving Blount County with a mix of faith-based and local civic talk. Programmes include Fuel for your Soul, Supernatural Overcomer, Public Square and True and Karen, and the station broadcasts Blount County Commission meetings and maintains an archive of commissioners' voting records. It also carries local sports and simulcasts video alongside the audio stream, presenting itself as a public service. This is a distinct station from the catalogued WBCR-LP in Massachusetts and WBCR 90.3.
