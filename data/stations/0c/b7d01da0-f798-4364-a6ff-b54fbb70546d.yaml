  notes: RRI Pro 4 Jakarta on 92.8 FM is the culture channel of Radio Republik Indonesia, one of Indonesia's two statutory public broadcasting institutions, founded in 1945 and operating around 90 local stations. Pro 4 is the network's dedicated cultural service, carrying local and pan-Indonesian traditional music, performing arts and heritage programming rather than news or pop. It is a distinct city service from the Pro 4 outlets already catalogued for Bandung, Palembang, Ambon, Tanjungpinang and Manado.
