research:
  reviewed_at: 2026-06-09
  nature: commercial
  operator: Zitouna FM SA, founded by Mohamed Sakher El Materi (son-in-law of former President Zine El Abidine Ben Ali); after the 2011 revolution the station was confiscated by the Tunisian state and is currently administered by the Caisse de Dépôt et Consignation (CDC) / state asset management as a public-interest religious broadcaster
  affiliations: Sunni Islam (Maliki school, mainstream Tunisian religious tradition); current state oversight via post-revolution asset confiscation
  audience: Tunisian Arabic-speaking Muslim audience nationally and across the Maghreb; appeals to religiously observant listeners
  format: Religious programming centred on Quranic recitation (coran), hadith (sonnah), Islamic talk and call-in shows, with limited Islamic-themed music
  notes: Launched in 2007 as Tunisia's first private Islamic radio station, broadcasting on 90.6 MHz in Tunis and other frequencies countrywide; after the Jasmine Revolution of 2011 it was seized by the state along with other Ben Ali family assets and continued operating under public administration; programming features prominent imams and theologians and is widely cited as a popular religious broadcaster in Tunisia.
  sources: internal knowledge of Tunisian media and post-2011 asset confiscations
