  nature: commercial
  operator: Ràdio Associació de Catalunya (RAC), held by Grup Godó (the Catalan media group that publishes La Vanguardia and Mundo Deportivo); broadcasts from Barcelona
  affiliations: none formally party-political, though Grup Godó has historically been associated with Catalan liberal-conservative perspectives and the Catalan-language broadcasting ecosystem; no religious affiliation
  audience: Catalan-speaking adult listeners (broadly 25-50) across Catalonia and parts of the Balearic Islands and Valencia who reach the signal
  format: Catalan-language commercial CHR/adult-contemporary station mixing current international and Catalan/Spanish pop hits with classics from the 1990s-2010s, plus DJ-led morning and afternoon shows.
  notes: RAC105 launched in 2000 as the music-format sister to news-and-talk station RAC1 (relaunched 2000) under Ràdio Associació de Catalunya, the Barcelona-based commercial-radio company owned by Grup Godó. It broadcasts on FM 105.0 MHz in Barcelona and on additional regional frequencies across Catalonia, the western Balearics and parts of Andorra, plus DAB and online via rac105.cat. The station is part of the renaissance of Catalan-language commercial radio that complemented the public-broadcaster Catalunya Ràdio after Spain's transition to democracy.
  sources: internal knowledge only
