  notes: R.SH (Radio Schleswig-Holstein) launched on 16 May 1986 as one of the first private commercial radio stations in Germany following the deregulation of German broadcasting. Based in Kiel-Wittland, it broadcasts on multiple FM frequencies across Schleswig-Holstein. R.SH is part of Regiocast, one of Germany's largest private radio holdings (which also owns 89.0 RTL, Radio NRW shareholdings, and others). Long the dominant private station in Schleswig-Holstein with strong morning-show ratings; pioneered the German "Dudelfunk" hit-radio format. Known programs include "Andreas und Conny am Morgen" and traffic-focused "Stau!" segment. Editorial line is mainstream/apolitical commercial entertainment.
