  notes: 'Radio 21 September (إذاعة الحادي والعشرين من سبتمبر) is named after the Houthi takeover of Sanaa on 21 September 2014 and identifies itself as ''the voice of the army and popular committees''. It is the broadcast arm of the Houthi (Ansar Allah) armed forces and their affiliated security bodies in northern Yemen. Output consists of military communiqués and operational claims, speeches by Abdul Malik al-Houthi, statements from allied bodies such as Iran''s Islamic Revolutionary Guard Corps, religious programming, and political commentary on Palestine and regional conflict, including material promoting Red Sea shipping attacks. It publishes online at 21sept.net alongside FM frequencies in Houthi-controlled territory. The Shoutcast stream is live at 112 kbps AAC+. Editorial flag: This is the official broadcast outlet of the Houthi (Ansar Allah) armed forces in Yemen, self-described as ''the voice of the army and popular committees''. Its output is military communiqués, speeches by Houthi leader Abdul Malik al-Houthi, and sectarian and militant political messaging, including coverage promoting attacks on Red Sea shipping. Ansar Allah is under international sanctions and has been designated a terrorist organisation by the United States, making this a sanctioned-entity propaganda outlet rather than a news service.'
