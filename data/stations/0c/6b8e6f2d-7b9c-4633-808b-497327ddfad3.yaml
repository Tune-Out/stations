  operator: Arabian Radio Network (ARN) / Dubai Media Incorporated (DMI) - the UAE's leading commercial broadcaster
  affiliations: ARN is part of the wider Dubai government-linked media ecosystem; commercial advertising-funded; operates under UAE National Media Council regulation
  audience: South Asian (Desi) expatriate community in the UAE, particularly Indian, Pakistani and Bangladeshi diaspora; Hindi/Punjabi/Urdu speakers
  format: Desi music station - Bollywood hits, Punjabi pop, Hindi film soundtracks, contemporary South Asian music with English-language presenter banter
  notes: Vibe FM 105.4 (sometimes branded "Vibe 105.4") is a Dubai-based commercial radio station serving the UAE's large South Asian expatriate population; self-described as "the No. 1 Desi Music Station in UAE"; broadcasts on 105.4 FM across the UAE and online via vibe1054.com; programming includes named shows MAD Morning (6-11 AM drive-time), Desi Express, Sounds Good, Fire and Spice, and Humsafar with regular RJs; serves the dominant Desi expat workforce demographic that comprises a major share of UAE residents; one of several Hindi/Desi-format competitors in the Gulf radio market alongside City 101.6, Hum FM and Spice Radio
