  notes: Guyane La 1ère is the public radio service of French Guiana, run by France Télévisions' Outre-mer La 1ère network (the former RFO). It began as Radio-Cayenne on 9 June 1951, became RFO Guyane in 1982, Guyane 1ère in 2010 and Guyane La Première in 2018, and broadcasts on FM via 27 TDF transmitters across the department. Generalist programming in French and Guianese Creole mixes local news, Carnaval coverage and Caribbean/Latin music with content from Radio France; it is the most-listened-to station in French Guiana (about 44% audience reach).
