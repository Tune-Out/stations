research:
  reviewed_at: 2026-06-09
  nature: state media
  operator: Al Jazeera Media Network, funded by the Government of Qatar via the ruling Al Thani family / Qatari state budget
  affiliations: state-funded Qatari broadcaster; founded by Emir Hamad bin Khalifa Al Thani in 1996; editorial line broadly pan-Arab, with frequent coverage of Palestinian, Iraqi, Syrian, and political-Islam topics; widely accused (by Saudi Arabia, UAE, Egypt, Bahrain) of being a tool of Qatari foreign policy; viewed favourably by Muslim Brotherhood-aligned audiences and critically by Gulf rivals
  audience: Pan-Arab, Arabic-speaking global audience of roughly 430 million people across the MENA region and worldwide diaspora; one of the most-watched/listened Arabic news brands
  format: 24-hour Arabic-language news, current affairs, talk, documentaries, and analysis simulcast of the Al Jazeera Arabic TV channel's audio feed
  notes: Al Jazeera Arabic launched 1 November 1996 as the first independent Arabic-language news channel, revolutionising Arab broadcasting by airing dissenting views, opposition voices, and Israeli officials in Arabic — historic firsts for the region; the network has been at the centre of multiple diplomatic crises including the 2017–2021 Qatar diplomatic blockade by Saudi Arabia/UAE/Egypt/Bahrain (which demanded Al Jazeera's closure as a precondition for restoring ties); offices have been bombed (Kabul 2001, Baghdad 2003 — killing journalist Tarek Ayoub), banned, or restricted in numerous countries; its journalists have been imprisoned in Egypt (the 2013–2015 Cairo trial of Peter Greste, Mohamed Fahmy, Baher Mohamed) and killed in Gaza (Shireen Abu Akleh, 2022; Samer Abudaqa, 2023; Hamza Dahdouh, 2024); the network's editorial guidelines state a mission to "give voice to the voiceless"
  sources: internal knowledge only
