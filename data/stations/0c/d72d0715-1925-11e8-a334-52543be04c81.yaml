  nature: online-only
  operator: Radio Schizoid — independent internet radio project founded and operated by Sumit Singh (DJ Schizoid) from Mumbai, India.
  affiliations: none known — independent operation aligned with the global psytrance / Goa trance scene; no religious, governmental, or political affiliations.
  audience: Global psychedelic-trance, Goa trance, and ambient/chillout community; significant audiences in India, Europe (especially Germany, Russia, Israel) and the Americas.
  format: Psychedelic trance — full-on, progressive, dark and forest psytrance from international labels (Iono Music, Nano Records, Spun Records, etc.), part of a multi-channel network that also includes Chillout/Ambient and Dark Psytrance streams.
  notes: Radio Schizoid is one of India's oldest and best-known internet radio stations, founded in the mid-2000s by Mumbai-based DJ and producer Sumit Singh under the alias "Schizoid"; it grew out of the Indian Goa-trance subculture (an offshoot of the 1990s Goa party scene) and now operates three parallel 24/7 streams — Psychedelic Trance, Dark Psy and Progressive/Chillout — with no DJs or advertising on the main streams; the project is supported by listener donations and partnerships with psytrance labels, and is repeatedly listed by aggregators such as SHOUTcast and TuneIn among the most-streamed independent electronic-music stations worldwide.
