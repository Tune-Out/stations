  notes: Radio ROKS is Ukraine's main rock station, on air since 24 March 1992 in Kyiv and owned since autumn 2008 by TAVR Media, the country's largest commercial radio group. The main service broadcasts on 103.6 FM in Kyiv through 27 transmitters covering 83 cities, with hourly news and shows including the long-running 'Камтугеза' breakfast programme with Serhiy Kuzin and Sonya Sotnik, plus 'Рок-вікенд' and 'Рок-концерт' at weekends. Hard'n'Heavy is one of its online-only spin-off streams, narrowing the playlist to hard rock, heavy metal and classic metal under the network slogan 'Рок. Тільки рок!'. The 320 kbps HD mount is live.
