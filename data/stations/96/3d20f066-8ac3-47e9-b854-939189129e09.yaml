  notes: "\"Die Sendung mit der Maus\" has aired on German television since 1971 and is one of the most celebrated educational programmes in Europe, winning numerous awards including the Grimme-Preis and the German Federal Cross of Merit awarded to the show itself in 1995. The \"zum Hören\" audio stream extends the brand to radio and podcast formats; the page actively invites child participation: \"Gibt es ein Lied, das du gerne in 'Die Maus zum Hören' hören möchtest?\" (Is there a song you'd like to hear?), with a dedicated children's hotline for requests and questions."
