  notes: Radio 24 is one of the most historically significant private radio stations in Switzerland - founded in 1979 by Italian publisher Roger Schawinski and broadcast illegally into Switzerland from Pizzo Groppera in Italy at the time, it became a national cause célèbre that helped break the Swiss state radio monopoly and led to the licensing of private broadcasters under federal law in 1983; it has been Zurich's leading private FM station ever since, eventually acquired through the Tamedia and AZ Medien transactions, and is now operated by CH Media; programming combines mainstream music (classic rock, pop, easy listening) with strong local Zurich news, traffic and personality talk such as the "Ufsteller" show with Nina Roost, Dominik Widmer and Maximilian Baumann, and themed web streams including Radio 24 Hot, FLASHBACK FM, 90er Hits, Virgin Radio, Shape and Goldies; its slogan "Die beste Musik" sums up its mainstream music positioning.
