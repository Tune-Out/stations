  operator: Radio Silesia (commercial regional broadcaster, privately held; not affiliated with the Catholic Church despite the inherited tag)
  affiliations: none known — the Radio-Browser "catholic" tag appears incorrect; the schedule includes only minor religious slots ("Pasma religijne") typical of regional Polish stations
  audience: Polish-speaking listeners across Upper Silesia (Górny Śląsk), including Zabrze, Katowice and the surrounding agglomeration; identity tied to Silesian regional culture
  format: Mainstream "szlagier"-flavoured pop and adult-contemporary hits ("Fajnie gramy! Na 96.2"), with morning drive "Nowy dzień Silesia", evening "Silesia Szlagier Party" and Friday "SzlagLista" chart show
  notes: Radio Silesia is a regional commercial FM station (96.2 MHz) based in Zabrze in the Upper Silesian metropolitan area. Programming centres on the regionally distinctive "szlagier śląski" genre — German/Polish schlager and disco-polo hybrids strongly identified with Silesian working-class identity — alongside contemporary pop hits and local news/events. The station hosts concerts and listener gatherings under the "Spotkajmy się na żywo!" banner. The inherited Radio-Browser "catholic" tag is not supported by the station's own self-description.
  sources: http://www.silesia.fm/, internal knowledge
