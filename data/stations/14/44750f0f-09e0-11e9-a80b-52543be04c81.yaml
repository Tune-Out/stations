  notes: Alpha Boys School was founded in Kingston in 1880 by the Sisters of Mercy as a vocational and music school for at-risk and orphaned boys, and its band programme produced foundational figures of Jamaican music including Don Drummond, Tommy McCook, Rico Rodriguez and many members of the Skatalites; the school's website describes itself as "A TOP 10 WORLD MUSIC STATION" and the station was praised by The New York Times Magazine as "WORTHY OF PAUSE AND ATTENTION"; the station functions as a fundraising and heritage-promotion vehicle for the school and its alumni network.
