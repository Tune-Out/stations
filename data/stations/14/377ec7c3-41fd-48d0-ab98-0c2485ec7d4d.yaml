  operator: MFM Radio (private Moroccan media group, linked with Challenge.ma and Tomobile360.ma sister publications)
  affiliations: none party-political; programming includes routine Islamic content (Qur'anic recitations, supplications) consistent with mainstream Moroccan Sunni Maliki religious culture but no formal religious affiliation
  audience: General Moroccan family audience speaking Darija (Moroccan Arabic) and Tamazight (Amazigh), with concentration in the Souss-Massa region (Agadir) and national online reach
  format: General-interest commercial talk and music station with traditional Moroccan, Andalusian, and African music; talk shows, sports, women's programming, comedy, religious segments, and agricultural features
  notes: MFM Radio is a private commercial Moroccan radio station licensed by the Haute Autorité de la Communication Audiovisuelle (HACA), Morocco's independent broadcasting regulator that licensed the first wave of private broadcasters in 2006; the station serves the Moroccan family across multiple regional FM frequencies with strong presence in the Souss-Massa region; tagline positions it as accompanying "الأسرة المغربية" (the Moroccan family) daily through rich and diverse programming; notable shows include "لالة فاطمة" (Lalla Fatema, women's issues), "الشوط الثالث" (The Third Half, sports), "المقاول" (The Contractor), and "سمير الليل" (Samir of the Night); operates a sister sports vertical, MFM Sport, and is part of the same group that publishes Challenge.ma (business news) and Tomobile360.ma (auto news).
  sources: https://www.mfmradio.ma/, internal knowledge
