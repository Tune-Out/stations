  notes: Catalunya Ràdio launched 20 June 1983 as Catalonia's first dedicated Catalan-language radio service, part of the CCMA group which also operates TV3, 3CatInfo, Catalunya Música, and iCat; consistently ranks among Catalonia's most-listened-to stations; notable programs include "El matí de Catalunya Ràdio," the true-crime hit "Crims" (Carles Porta), and the annual "La Marató" telethon for medical research; the tag "country" in the source data appears to be a mis-tag and does not reflect actual programming; the broadcaster has occasionally been at the center of political debate over editorial independence and Catalan independence coverage. The "ccma.cat" domain now redirects to "3cat.cat" following a 2024 rebrand.
