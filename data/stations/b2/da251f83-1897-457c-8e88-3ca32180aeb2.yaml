  nature: commercial
  operator: Libertad Digital, S.A., a Madrid-based private media company founded by Federico Jimenez Losantos and other partners; esRadio is operated through subsidiary EsRadio S.A.
  affiliations: Editorially aligned with the Spanish conservative and economically liberal right; closely linked to figures and ideas associated with the Partido Popular and Vox, though formally an independent commercial outlet; not a party broadcaster
  audience: Spanish-speaking adult listeners in Spain, particularly older conservative-leaning audiences interested in politics, religion (Catholic-friendly slant) and current affairs; also regional editions for Galicia, Castilla y Leon and Sevilla
  format: Talk radio with news bulletins, tertulias (panel discussions), sports talk and opinion programming
  notes: esRadio launched in 2009 after Federico Jimenez Losantos left COPE following internal disputes (he had hosted COPE's flagship La Manana); flagship shows include Es la Manana de Federico, En Casa de Herrero (with Luis Herrero, son of Falangist intellectual Luis Herrero Tejedor), La Noche de Cuesta and the football panel Futbol es Radio; the editorial line is openly critical of the PSOE-led government and of Catalan and Basque independence movements, and the station frames itself as a liberal-conservative alternative to mainstream Spanish broadcasters; group parent Libertad Digital also runs the libertaddigital.com news site and has been criticised by left-leaning Spanish press for its combative coverage
  sources: https://esradio.libertaddigital.com/, internal knowledge
