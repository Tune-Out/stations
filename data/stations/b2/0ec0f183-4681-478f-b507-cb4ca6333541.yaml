  operator: Ríkisútvarpið (RÚV), Iceland's national public-service broadcaster
  affiliations: Icelandic public broadcasting system, accountable to the Althingi (Icelandic parliament); EBU member
  audience: Icelandic-speaking adults, broadly younger and music-oriented than RÚV's flagship Rás 1, nationwide coverage
  format: Popular music (Icelandic and international), pop/rock, contemporary hits, light entertainment, news bulletins and live cultural and sports coverage
  notes: Rás 2 launched on 1 December 1983, ending RÚV's single-channel radio era as the second national service; it has played a defining role in promoting Icelandic popular music and hosts the long-running Eurovision Söngvakeppnin selection broadcasts; RÚV is funded primarily by a per-person broadcasting tax (útvarpsgjald) collected by the state plus some advertising; despite occasional political debate over RÚV's funding and competitive position versus private media, it remains one of the most-listened-to radio networks in Iceland.
