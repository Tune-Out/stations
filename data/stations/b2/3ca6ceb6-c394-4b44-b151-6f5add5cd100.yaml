  operator: PRISA Radio (Sociedad Española de Radiodifusión, S.L.), subsidiary of Grupo PRISA
  affiliations: Editorially associated with Grupo PRISA, owner of newspaper El País; widely characterised by media analysts as centre-left/social-democratic in editorial outlook
  audience: Spanish-speaking adults across Spain interested in news, debate and live sports
  format: Alternative digital stream of Cadena SER carrying additional news, debate and sports programming ("debates y deportes, noticias") alongside the main SER feed
  notes: Cadena SER is Spain's oldest and largest commercial radio network, founded in 1924 as Unión Radio and consistently the country's most-listened-to general-interest radio per EGM audience studies; flagship shows on the main service include "Hoy por Hoy" (mornings), "La Ventana" (afternoons), "Hora 25" (nightly news) and weekend sports juggernaut "Carrusel Deportivo" and "El Larguero"; the "Cadena Ser +" stream is a complementary online channel surfacing additional debates, news and live sports coverage when the main FM signal is carrying other programming; PRISA Radio also operates LOS40, Cadena Dial, M80 Radio and Radiolé in Spain and a major Latin American radio footprint.
