  notes: Radio BollyFM is an internet-only Bollywood music station launched in 2010 from West Bengal, India (registered address Kelomal, Tamluk), streaming 128 kbps Hindi film music around the clock from its own server at stream.radiobollyfm.in. It positions itself as reuniting the dispersed Indian diaspora and pairs the stream with a blog covering Bollywood, fashion and lifestyle news, plus a listener-participation slogan 'We promote your voice, we promote your skills'. There is no terrestrial licence or known corporate parent; it is a small independent web radio. The homepage returns HTTP 406 to automated clients but is live in browsers.
