  nature: public broadcaster
  operator: All India Radio (Akashvani), the radio division of Prasar Bharati — India's state-owned public broadcaster
  affiliations: Government of India / Ministry of Information and Broadcasting (Prasar Bharati is an autonomous statutory body but is funded by and answerable to the Indian government)
  audience: Pan-Indian Hindi/Hindustani-speaking audience; one of the most widely listened-to AIR channels nationwide
  format: National entertainment channel featuring Hindi film music (old and new), light music, request shows, and the famous Jaimala (soldiers' request programme) and Cibaca/Geetmala-style countdown programmes
  notes: Vividh Bharati ("various Indian") is one of All India Radio's flagship national services, launched on 3 October 1957 as a commercial film-music response to the popularity of Radio Ceylon's Hindi service which had attracted Indian listeners with Bollywood songs while AIR initially restricted such content; it became AIR's main commercial entertainment service from 1967 and is broadcast nationwide on MW, FM, and shortwave plus DTH/internet; iconic programmes include Jaimala (a request show for armed forces personnel running since 1962), Bhoole Bisre Geet, Sangeet Sarita, and Hawamahal; Prasar Bharati was established by the Prasar Bharati Act 1990 (operational from 1997) as the autonomous corporation overseeing AIR (Akashvani) and Doordarshan, though it remains funded primarily by the Indian government.
