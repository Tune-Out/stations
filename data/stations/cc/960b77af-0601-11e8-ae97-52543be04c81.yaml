  notes: rbb24 Inforadio is the rolling-news and current-affairs channel of Rundfunk Berlin-Brandenburg, launched on 28 August 1995 as a joint ORB/SFB service and renamed from Inforadio to rbb24 Inforadio on 28 March 2022 under the broadcaster's unified news brand, with the tagline "Wir lieben das Warum". It carries live news every 20 minutes with weather and traffic, plus interviews, background reports, commentary, Bundesliga coverage and the ARD-Infonacht overnight feed. Distinctive output includes the Polittalk aus der Hauptstadt discussion series co-produced with the Süddeutsche Zeitung and the Bertelsmann Stiftung, and a large podcast catalogue on the ARD Audiothek. It broadcasts on 93.1 MHz in Berlin and Havelland plus regional FM, DAB+, cable and online, and reported about 290,000 listeners in MA II/2026. It is licence-fee funded with constitutionally protected editorial independence.
