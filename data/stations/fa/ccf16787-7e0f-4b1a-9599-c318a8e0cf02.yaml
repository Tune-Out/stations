  operator: Skyrock SA (Société d'Exploitation Radio Chic), founded and led by Pierre Bellanger; Orbus Group / Vortex SA holding
  affiliations: none religious or party-political; regulated by the French Arcom (formerly CSA); historically associated with French hip-hop and urban youth culture advocacy
  audience: French-speaking hip-hop/rap fans, primarily 25+ revisiting the genre's classic era; web-only sub-channel of the Skyrock brand
  format: '"Klassics" stream dedicated to hip-hop and rap oldies / classics from the late 1980s, 90s and 2000s (US and French rap)'
  notes: Skyrock Klassics is one of Skyrock's themed web/DAB+ sub-brands sitting alongside Skyrock Rap US, Skyrock Rap FR, Skyrock Mix and others; the parent Skyrock (105.5 MHz in Paris) launched in 1986 as a pop station and pivoted in 1996 to become France's leading rap and R&B station under the slogan "Premier sur le Rap"; flagship shows on the parent network include "Difool – La Radio Libre" and "Planète Rap"; Skyrock has been the subject of repeated regulatory disputes with the CSA/Arcom, notably the 2011 attempted ouster of Pierre Bellanger by minority shareholder AXA Private Equity, which triggered a high-profile listener and artist mobilisation in defence of the station's independence.
