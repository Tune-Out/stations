  notes: The Rock is one of New Zealand's most successful commercial rock formats, launched in 1989 in Hamilton/Waikato before expanding nationally. It is operated by MediaWorks NZ, the country's second-largest commercial radio group alongside NZME, and broadcasts on 34+ FM frequencies including Auckland (90.2), Wellington (88.1) and Christchurch (101.1). MediaWorks NZ also runs More FM, The Edge, Mai FM, Magic, George FM and Today FM (now defunct). After MediaWorks sold its TV arm (Three / Newshub) to Discovery in 2020, the radio division continued under Quadrant. Flagship shows include "The Morning Rumble" (with Rog, Bryce, Mulls & Mel) and "The Rock Drive" (Jay & Dunc), known for irreverent, blokey humour; the station has also produced the long-running annual "Big Wakeup Call" charity event.
