  operator: Police Broadcasting Station (警察廣播電臺), under the National Police Agency (內政部警政署), Ministry of the Interior, Republic of China (Taiwan)
  affiliations: Taiwanese government / law enforcement; no religious or party-political affiliation
  audience: nationwide Taiwan audience, in Mandarin/Chinese, with emphasis on motorists, commuters, and the general public seeking public-safety information
  format: traffic, road and weather reports, crime and public-safety information, missing-persons appeals, government announcements, light music and call-in programs
  notes: Founded in 1954, the Police Broadcasting Station (PBS) is Taiwan's official police radio network with a national "Traffic and Public Safety Network" carried on FM 104.9 (Taipei) and 94.3/93.1 in other regions, plus eight regional studios in Taipei, Taichung, Kaohsiung, Yilan, Hualien, Taitung, Hsinchu and Tainan; it is the official channel for traffic alerts, Amber Alert-style missing-children broadcasts and emergency public information, and operates the free 0800-000-123 traffic hotline.
