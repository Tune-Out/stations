  notes: Broadcast on 88.8 MHz FM in Berlin; originated as SFB's "Berliner Rundfunk 88,8" and went through several rebrands ("Radio B Zwei", "Radio Eins 88,8", "88,8 Berlin") before becoming "88,8 — Das Berlin-Radio" of the merged Rundfunk Berlin-Brandenburg (RBB) in 2003; positions itself as the city-radio for Berlin with strong emphasis on traffic, weather, neighbourhood news, and Berlin-themed programming such as call-in shows and city features; sister stations include Antenne Brandenburg, radioBERLIN, radioeins, Inforadio, and Fritz; operates editorially independent of the state under RBB's public-service charter.
