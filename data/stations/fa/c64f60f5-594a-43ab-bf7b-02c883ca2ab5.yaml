  operator: Polskie Radio S.A. (Polish national public-service radio)
  affiliations: Polish state-owned public broadcaster; supervised by the Polish National Broadcasting Council (KRRiT) and historically the National Media Council (Rada Mediów Narodowych)
  audience: Polish-speaking national audience interested in rolling news, politics, business, and current affairs
  format: 24-hour all-news and information channel covering domestic and international news, politics, finance, sports, weather, history, science, and current affairs commentary
  notes: Polskie Radio 24 (PR24) launched in March 2014 as Polish Radio's dedicated news and information channel, succeeding the earlier Radio Parlament; broadcasts nationally on DAB+ and online (FM coverage is limited compared with Polskie Radio's other channels); during the rule of the Law and Justice (PiS) government (2015-2023) Polskie Radio was repeatedly criticised by the European Broadcasting Union, Reporters Without Borders, and Poland's Helsinki Foundation for editorial bias favouring the ruling party, and following the October 2023 election the Donald Tusk-led coalition government carried out a controversial restructuring of public media in December 2023 that placed Polskie Radio in liquidation pending reform.
