  operator: Radio Nacional de España (RNE), a division of Corporación RTVE — Spain's state-owned public broadcaster
  affiliations: Spanish government (parliamentary oversight), public service broadcasting
  audience: Spanish expatriates, diplomats, mariners, and Spanish/multilingual listeners worldwide; broadcasts in Spanish, English, French, Portuguese, Arabic, Russian, and Ladino
  format: International news, current affairs, Spanish culture, and music — Spain's external/world service
  notes: REE (Radio Exterior de España) was launched in 1942 as "La Voz de España" to reach overseas listeners; for decades it used shortwave (now largely discontinued after 2014 cutbacks), and today distributes via satellite, internet streams, and partner FM affiliates abroad; notable for keeping a regular Ladino (Judaeo-Spanish) language programme aimed at Sephardic communities — one of the few in the world.
