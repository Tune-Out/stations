  notes: Medina FM is a private Moroccan station broadcasting in Casablanca on 88.5 MHz and also in Rabat, Marrakech, Tangier and Fès. Its distinctive editorial line balances contemporary Moroccan and Arabic song with traditional repertoires including malhoun, andalou, chaabi, gnaoua and Amazigh music, positioned as an alternative to youth-oriented and institutional formats. Programming adds cultural magazines, society shows, news bulletins and interactive segments, with special spiritual programming before iftar during Ramadan.
