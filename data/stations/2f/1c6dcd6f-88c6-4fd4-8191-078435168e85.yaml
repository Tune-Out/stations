  notes: Launched 11 March 2002 as the BBC's first new national digital-only radio station; broadcasts on DAB, BBC Sounds, satellite and cable. Survived a 2010 closure proposal after a high-profile listener and artist campaign. Hosts the BBC 6 Music Festival annually. Notable presenters have included Steve Lamacq, Lauren Laverne, Mary Anne Hobbs, Iggy Pop, Craig Charles, and Cerys Matthews.
