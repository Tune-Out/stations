  notes: P1 is the flagship spoken-word channel of Sveriges Radio, on the air since 1925 (as the original Radiotjänst service) and bearing the P1 name since the introduction of P2 in 1955; it carries flagship programs such as Ekot (news), Studio Ett, P1 Morgon, Sommar i P1, Vetenskapsradion, Filosofiska rummet and Konflikt; Sveriges Radio is funded by a public-service tax administered via Skatteverket (replacing the older licence fee in 2019) and operates under a public-service remit set out in its broadcasting charter (sändningstillstånd) requiring impartiality, factual accuracy and broad cultural coverage.
