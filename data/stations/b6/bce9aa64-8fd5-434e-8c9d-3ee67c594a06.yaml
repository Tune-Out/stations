  nature: commercial
  operator: Red FM is operated by South Asia FM Limited (SAFL), a subsidiary of Sun TV Network Ltd. — part of the Sun Group controlled by the Maran family (Kalanithi Maran)
  affiliations: none known — privately owned commercial FM network; Sun TV Network has historical political ties to the DMK party in Tamil Nadu (the Marans are related to former DMK leadership) although Red FM operates as a commercial entertainment brand
  audience: Urban Indian listeners aged ~15-34; primarily Hindi-language in Delhi (station broadcasts in regional languages across other cities); Delhi NCR region on 93.5 MHz FM
  format: Contemporary Hindi film music (Bollywood) and pop, RJ-led entertainment talk, comedy, and city-focused content; brand tagline "Bajaate Raho!" (Keep playing it!)
  notes: Red FM 93.5 is one of India's largest private FM networks operating in 70+ cities; launched in 2002; known for RJ-driven shows including the long-running "Morning No. 1" with RJ Raunac in Delhi; competes with Radio Mirchi, Big FM and Fever FM; subject to standard Indian private FM content restrictions (no news/current affairs allowed except All India Radio relays per Indian regulations)
  sources: https://www.redfmindia.in/delhi (WebFetch, minimal content), internal knowledge
