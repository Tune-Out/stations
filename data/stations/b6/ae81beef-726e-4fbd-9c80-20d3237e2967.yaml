  nature: commercial
  operator: Grupul Media Camina (GMC) — the Romanian holding behind Europa FM; in past acquired by/operated under Lagardère Active Radio International (LARI / Lagardère group) then divested; later under Czech investor PPF/RMG and now part of the Trei Media (Antenna Group) portfolio after restructuring.
  affiliations: none known politically or religiously; mainstream commercial broadcaster.
  audience: Adult Romanian listeners nationwide (25-55), urban/professional skew; Romanian-language.
  format: News-and-talk with adult contemporary pop hits — flagship talk shows ("Deșteptarea" morning drive, "România în direct," "Judecata de Joi" with Cristian Tudor Popescu) plus pop music rotation.
  notes: Europa FM launched in Romania in 2000 as the local arm of Lagardère's pan-European Europa FM brand and rapidly became a top-tier national network alongside Kiss FM and Pro FM. The station is known for its strong talk-show lineup and is one of Romania's most-listened-to commercial stations; ownership has changed several times as the European radio market consolidated.
  sources: https://www.europafm.ro/, internal knowledge of Romanian radio landscape
