  format: Contemporary hit radio (CHR) playing Western pop, Pakistani pop, Bollywood and indie music, plus entertainment news, lifestyle and celebrity interviews
  notes: City FM 89 launched in July 2004 as Pakistan's first commercial English-language FM station, broadcasting on 89.0 MHz in Karachi, Lahore and Islamabad; it is part of Dawn Media Group, founded by Mohammad Ali Jinnah's family-linked publishing house; notable programs include the overnight "Insomnia" hit-music block and the weekday "89 Jukebox" request hour; the station has built a strong brand among urban English-speaking youth and frequently hosts live music sessions and interviews with regional artists; it streams live at cityfm89.com.
