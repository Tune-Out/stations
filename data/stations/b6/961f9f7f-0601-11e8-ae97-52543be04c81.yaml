  notes: Jazz London Radio is an independent London-based internet jazz station that marked ten years on air, placing its launch around 2015. It is not Ofcom-licensed for FM; it streams via the CanStream platform in 256k MP3 and 64k AAC and is also carried on TuneIn, OnlineRadioBox and YouTube. Programming is presenter-led rather than automated, with a roster including pianist Andrea Vicari, trumpeter Chris Hodgkins, Filomena Campus, Kevin Davy, Todd Gordon, Johnny Mooney and Liv Fernandes, covering straight-ahead, contemporary and Latin jazz plus interviews and live sessions. The station runs a jazz blog and asks listeners for PayPal donations rather than selling airtime, and remained active with fresh 2026 content at the time of review.
