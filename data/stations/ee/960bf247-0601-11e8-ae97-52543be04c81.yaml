  operator: Association Radio Espérance (loi 1901 non-profit), Saint-Étienne, France
  affiliations: Roman Catholic (traditional / Latin-rite leaning); not directly governed by a French diocese but theologically aligned with the Church Magisterium; member of the Catholic radio sphere alongside Radio Notre-Dame, Radio Maria France, RCF, etc.
  audience: French-speaking traditional Catholic faithful, lovers of sacred music; international diaspora via web stream
  format: 24/7 Gregorian chant (chant grégorien) sub-channel of the Radio Espérance network, broadcasting plainchant from monastic and abbey repertoires (Solesmes, Le Barroux, etc.)
  notes: 'Founded in 1987 in Saint-Étienne (Loire) by Catholic laypeople led by Father Pierre Goursat (Emmanuel Community) and lay collaborators, Radio Espérance operates FM/DAB+ frequencies in central/southeast France and eight thematic web streams; the Grégorien stream is one of its specialized webradios alongside Enseignement (teaching), Parole de Dieu (Scripture), Louange (praise), Musique Sacrée (sacred music), En Marie (Marian), and Byzantin (Eastern chant); funded entirely by listener donations: "Radio Espérance ne vit que des dons de ses auditeurs."'
