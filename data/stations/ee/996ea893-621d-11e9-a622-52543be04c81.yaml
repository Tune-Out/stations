  notes: Nashe Radio (Наше Радио) is Moscow's Russian-rock station, launched on 14 December 1998 by Mikhail Kozyrev as the first radio devoted to Russian-language rock, and is the flagship of privately held Multimedia Holding, whose owner Vitaly Bogdanov put the group up for sale in 2024 with no completed deal reported. It broadcasts on 101.7 FM in Moscow and in St Petersburg, Yekaterinburg and dozens of regional cities, and is known for the Nashestvie open-air festival and the Chartova Dyuzhina awards; its St Petersburg show Rayony-Kvartaly won a Radiomania award in 2025. It is a commercial music station rather than a state or news outlet. This entry duplicates the higher-voted 'Nashe Radio' record (960b1967), which uses the same nashe1.hostingradio.ru stream.
