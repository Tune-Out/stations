  affiliations: Fondation Hirondelle "Media for Peace and Human Dignity" mission; counter-misinformation and media literacy advocacy.
  audience: French and Sango speakers throughout Central African Republic; 71% of CAR population listen daily; primarily local, regional, and national audiences in underserved regions.
  format: 13 daily news programs in French and Sango; debates, educational content, entertainment, music, magazines; community journalism from 18 affiliated community radio stations across 12 FM transmitters nationwide.
  notes: Radio Ndeke Luka (RNL), established 2000 by Fondation Hirondelle, is the most-listened media outlet in CAR (71% daily listenership, 92% consider programs indispensable). Broadcasts 24/7 on 100.8-100.9 FM from Bangui serving remote regions. 100-person staff providing independent, professional news. Fights misinformation, counter-disinformation, and media literacy; plays public service role in crisis-affected country.
