  notes: "LS5 Radio Rivadavia is one of Argentina's oldest commercial radio stations, broadcasting on AM 630 in Buenos Aires since 1925. It has historically been a leading news/talk and sports broadcaster, famous for legendary football transmission teams (e.g., \"La Oral Deportiva\") and for hosts such as José María Muñoz, Magdalena Ruiz Guiñazú, Bernardo Neustadt and many others over its long history. Ownership has changed repeatedly: from the original founders through groups including Editorial Atlántida, Grupo Vila-Manzano, and others; the station has at times faced financial and labor disputes. It is not part of Argentina's public broadcaster (Radio Nacional) and is purely a private commercial broadcaster."
