  operator: LS5 Radio Rivadavia S.A.; ownership has historically passed through several Argentine media groups (most recently associated with the Vila-Manzano group and other private investors).
  affiliations: none known formally; it is a commercial AM news/talk station, not state-run nor party-affiliated, though its talk programming reflects a range of mainstream Argentine political viewpoints.
