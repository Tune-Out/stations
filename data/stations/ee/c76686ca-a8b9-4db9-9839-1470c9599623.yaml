  notes: 102.7 KIIS-FM is one of the most listened-to and highest-revenue Top 40 radio stations in the United States, broadcasting from Los Angeles. Owned and operated by iHeartMedia (formerly Clear Channel). Its flagship morning show "On Air with Ryan Seacrest" launched in 2004 and is syndicated to dozens of CHR stations nationwide. The station originally signed on as KIIS in 1948 and switched to the Top 40 format under that name in 1975, transitioning to its current call sign and CHR format under Rick Dees's morning show in 1981, which became one of the most successful in radio history. Known for hosting the annual "Wango Tango" and "Jingle Ball" concerts. Broadcasts on 102.7 MHz FM with a city-of-license of Los Angeles.
