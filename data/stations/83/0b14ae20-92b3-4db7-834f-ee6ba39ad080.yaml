  notes: 'This is a single-reciter Quran stream carrying the recitations of Mishary Rashid Alafasy, who is Kuwaiti rather than Egyptian as the previous notes stated: born in Kuwait City in 1976, he is a qari, imam and nasheed artist who studied at the Islamic University of Madinah and is among the most widely heard reciters online, with more than eleven million YouTube subscribers. The audio is delivered by Qurango, an Arabic network that runs one continuous stream per reciter alongside tafsir and sira channels, and several dozen Qurango feeds appear elsewhere in this catalog. The homepage recorded here, phantomsw.com, is unrelated: it now presents a trading-software and mobile-app company and carries no Quran radio content.'
