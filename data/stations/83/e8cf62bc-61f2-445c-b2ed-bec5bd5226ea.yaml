  nature: public broadcaster
  operator: DR (Danmarks Radio) - the Danish public service broadcaster, an independent public institution under the Danish Ministry of Culture
  affiliations: governed by Danish public service contract negotiated between the Danish Parliament (Folketinget) and the Ministry of Culture; EBU member; politically independent by statute; no religious affiliation
  audience: Younger Danish-speaking adults (roughly 15-39), nationwide in Denmark
  format: Youth-oriented public service network mixing contemporary pop/rock music, satire, comedy, talk, news ("P3 Nyheder"), documentaries and live events
  notes: DR P3 is the youth-oriented third radio channel of DR (Danmarks Radio), Denmark's national public-service broadcaster founded in 1925; the channel launched 1 January 1963 (initially as "Tredje Program") and was rebranded P3 in 1989 as DR moved to a numbered-channel structure (P1 news/talk, P2 culture/classical, P3 youth/music, P4 regional, P5 oldies, P6 Beat, P8 Jazz); flagship programs distributed via DR Lyd include Sara & Monopolet, Genstart, Djaevlen i detaljen, the satirical news show Den Korte Radioavis and Mads & Monopolet; broadcast nationally on FM and DAB+ across Denmark and streamed worldwide via dr.dk/lyd; funded since 2019 by general tax revenues (replacing the former media licence fee / medielicens), with editorial independence safeguarded by Denmark's Radio and Television Broadcasting Act; flagship shows have repeatedly won Danish Prix Radio awards.
  sources: https://www.dr.dk/lyd/programmer, internal knowledge of Danish public broadcasting
