  notes: AIR FM Rainbow Puducherry broadcasts on 102.8 MHz from the AIR Puducherry station; FM Rainbow is one of All India Radio's three main FM brands (alongside Vividh Bharati and FM Gold), launched in 1993 to offer a livelier urban entertainment-and-news format. AIR itself has operated since 1936 and has been administered by the autonomous Prasar Bharati corporation since 1997. Puducherry, a former French colony, is a culturally Tamil-majority Union Territory administered directly by the central Government of India.
