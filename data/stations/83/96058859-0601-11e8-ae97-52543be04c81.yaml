  format: Local news and current affairs plus Croatian pop, folk and traditional music
  notes: Radio Banovina is a local Croatian station based in Glina (Slatina Pokupska 80), serving the Banovina/Banija region of Sisak-Moslavina County. It began broadcasting in 1993 during the war, initially from Pokupsko, and now transmits 24 hours a day on 93.2 MHz (Kravarsko), 96.8 MHz (Petrova Gora) and 99.1 MHz (Glina) with studios in Slatina Pokupska and Velika Gorica. The schedule combines news and local-affairs programming with domestic entertainment and music — Croatian pop, folk and traditional repertoire — and the station also runs two extra music streams, Banovina Turbo and Banovina Light. In December 2011 it launched a companion television service, Televizija Radio Banovina.
