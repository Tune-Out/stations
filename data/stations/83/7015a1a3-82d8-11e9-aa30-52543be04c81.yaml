  format: Personality-hosted oldies / classic hits jukebox playing 1950s-1970s rock and roll, Motown, doo-wop and pop hits, hosted by Scott Shannon.
  notes: The True Oldies Channel is a U.S. syndicated oldies radio format created and hosted by veteran New York DJ Scott Shannon (co-founder of WHTZ "Z100" and a Radio Hall of Fame inductee). It launched in the mid-2000s under Citadel Media / Cumulus, and is now operated by Scott Shannon and his partners under the Local Radio Networks (LRN) banner. The channel is carried on terrestrial affiliates (notably WCBS-FM HD3 / 92.3-HD3 in New York and dozens of small/medium-market stations), as a stream on the trueoldieschannel.com site and via iHeartRadio and Audacy apps. The brand positions itself as "not your typical oldies station that plays the same 200 songs on repeat" with a deep library of "a thousand different songs" including the Beatles, Elvis, Chuck Berry, the Rolling Stones, Beach Boys and Motown. Editorially apolitical and music-focused.
