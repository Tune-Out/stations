  notes: Moskva FM broadcasts on 92.0 MHz in Moscow as a city news and talk service rather than the music station its old catalog notes described. Output is Moscow news bulletins, drive-time programmes such as Встань москвичом, economic and political discussion in Цена вопроса, traffic, weather and city-affairs interviews. It sits within Russia's state media system — launched under VGTRK and now part of the Moscow city government's Moskva Media holding — so it is not editorially independent.
