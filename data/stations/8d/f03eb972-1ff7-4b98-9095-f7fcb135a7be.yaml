  format: Soft adult-contemporary and soft-pop spin-off of Dimensione Suono Roma; mellow international and Italian classics, instrumentals and lounge tracks
  notes: Dimensione Suono Soft is the "soft" companion brand to the historic Lazio commercial station Dimensione Suono Roma (founded 1976 in Rome by Sandro Polchi as one of Italy's first private FM stations). The "Soft" stream targets a mature, melodic-pop audience and is carried on DAB+ in central Italy plus internet/app distribution. Programming is largely automated/curated with limited live presentation, leaning on a pop-standards library (Italian melodic pop, AC, easy-listening). Operated by Dimensione Suono Roma S.r.l., headquartered in Rome; advertising is sold by the group's commercial arm.
