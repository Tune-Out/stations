  notes: BBN 中文 is the Mandarin Chinese service of the Bible Broadcasting Network, a listener-supported evangelical Christian network founded by Lowell Davey on 2 October 1971 and headquartered in Charlotte, North Carolina; since Davey's death in 2017 it has been led by his daughter Barbara Redemann and her husband Carl. BBN operates 58 full-power US stations and 86 translators plus stations across the Americas, and streams in eight languages including Chinese, Spanish, Portuguese, Korean, Japanese, German and Russian. The Chinese stream carries Bible teaching, sermons, hymns and devotional programming with no commercials; the network is US-based, not Chinese, so the catalog's China country code is wrong.
