  operator: Bible Broadcasting Network (BBN), a U.S.-based evangelical Christian missionary radio network headquartered in Charlotte, North Carolina.
  affiliations: Evangelical Protestant Christian — non-denominational but theologically conservative/fundamentalist; founded by Lowell Lundstrom and currently led under the Vega family; listener-supported nonprofit.
  audience: Chinese-speaking (Mandarin) Christians and seekers worldwide, including diaspora and listeners inside the People's Republic of China where Christian broadcasting is restricted.
  format: 24/7 Mandarin-language Christian programming — Bible teaching, sermons, hymns, Christian music, and devotional content.
  notes: BBN was founded in 1971 by Lowell Lundstrom (later led by Lowell Davey) and operates dozens of full-power stations across the U.S. plus international shortwave and internet streams in multiple languages including English, Spanish, Russian, Arabic, and Chinese; the network's stated mission is "to glorify God by broadcasting the Gospel of Jesus Christ"; the Chinese service targets the world's largest unreached people group and is often accessed via VPN inside mainland China where unauthorized religious broadcasting is illegal; entirely listener-funded with no commercials.
  sources: internal knowledge only
