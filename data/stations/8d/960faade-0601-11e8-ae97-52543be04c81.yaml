  notes: Ретро FM 70-е is one of the themed online-only channels of Retro FM, the Russian commercial nostalgia network that launched on 14 February 1996 as Radio Retro and rebranded on 29 May 2003. Retro FM belongs to the European Media Group (EMG, founded 2006 around Europa Plus and Retro FM) and is among Russia's most-listened stations, with about 280 transmitters covering over 1,800 towns and a Gold Retro format aimed at 35-65 year-olds. The 70s channel plays an automated, presenter-free mix of Soviet and Western hits of the 1970s and is streamed from Moscow via hostingradio.ru alongside sister channels for the 80s, 90s and San Remo.
