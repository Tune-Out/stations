  notes: RMF Classic is a Polish national commercial station devoted to classical, film, jazz and sung-poetry music, part of Grupa RMF under Bauer Media Group. It began in 1998 as Opera FM and was rebranded RMF Classic on 27 October 2003. It broadcasts on FM in 21 Polish cities, from 87.8 MHz in Kraków to 107.6 MHz in Lublin, and is also carried on Canal+, Cyfrowy Polsat and online. Alongside music it airs interviews with cultural figures and coverage of exhibitions, theatre and film premieres, in long presenter blocks with thematic segments; long-running shows include 'Odeon' and 'Klasyka wchodzi w grę'. Its programming council has included the actress Anna Dymna and the director Jerzy Stuhr, and Radio Track data for 2022-23 put its share at about 1.6 percent, ninth nationally. The AAC+ stream is live.
