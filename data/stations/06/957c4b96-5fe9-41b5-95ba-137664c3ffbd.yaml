  notes: The original Danubius Rádió launched on 1 July 1986 within Magyar Rádió on 100.5 MHz from Kab-hegy, originally targeting East German tourists at Lake Balaton; it became Hungary's first commercial national network in 1997 alongside Sláger Rádió. The classic Danubius brand ceased broadcasting on 28 January 2010 after losing its frequency tender amid politically controversial Media Council decisions. The current online-only "Danubius Rádió" at danubiusradio.hu is a successor brand acquired by SoundPlus Kft. in 2021, which took the name and domain after operating previously as "Nonstop Rádió."
