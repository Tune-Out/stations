  notes: Alba Ciudad 96.3 FM is the radio station of Venezuela's Ministry of Popular Power for Culture, broadcasting from the Centro Simón Bolívar in central Caracas. Programming centres on Venezuelan cultural heritage — traditional and popular music, theatre, cinema, literature and arts education — alongside cultural news strands such as Cultura al Día. It is a government-run cultural service rather than a news or propaganda outlet. This entry duplicates the higher-voted catalogue record for the same station on the same envivo.albaciudad.org host, differing only in bitrate mount.
