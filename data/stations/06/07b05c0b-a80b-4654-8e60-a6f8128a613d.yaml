  affiliations: Private Brazilian radio network headquartered in Recife (Pernambuco); no overt religious or partisan affiliation, though local affiliates often air government and church-purchased blocks.
  audience: Young-adult Brazilian listeners, primarily 18-39, in Brasília (DF) and the Federal District metro area; Portuguese-language.
  format: Brazilian hit-music network with sertanejo, pop, funk and pagode plus high-energy DJ shows.
  notes: Clube FM is one of Brazil's largest commercial music networks, with the Brasília affiliate on 105.5 MHz; the Sistema Clube de Comunicação also owns regional affiliates throughout Northeast and Centre-West Brazil and stations such as Rádio Clube (AM) and TV Clube (Record affiliate); it is regulated by ANATEL and the Ministry of Communications.
