  notes: Sky News Arabia launched on 6 May 2012 from twofour54 in Abu Dhabi as a fifty-fifty joint venture between Abu Dhabi Media Investment Corporation, the investment vehicle of Sheikh Mansour bin Zayed Al Nahyan, and the UK's Sky Group. That partnership gives it access to Sky News content and editorial practice while its ownership ties it closely to Abu Dhabi, and its coverage of Gulf politics is generally read as reflecting a UAE perspective. It positions itself as a regional rival to Al Jazeera and Al Arabiya, with bureaux across the region and in Europe. This catalog entry is the audio of the television HLS feed rather than a separate radio service, and the catalog name is a garbled form of the channel's actual name.
