  notes: Raadio 2 is the youth and contemporary-music channel of Eesti Rahvusringhääling, Estonia's public broadcaster, on air since 1 May 1993 as part of the post-independence restructuring of Estonian Radio. It broadcasts entirely in Estonian with a contemporary hit and alternative music format aimed at younger listeners, and was an early adopter of internet streaming, going online on 18 June 1997. It sits alongside ERR's Vikerraadio, Klassikaraadio, Raadio 4 and Raadio Tallinn.
