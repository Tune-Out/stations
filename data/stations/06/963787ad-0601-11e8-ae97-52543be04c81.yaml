  notes: Mercy Rádió is a Hungarian-language internet broadcaster based in Slovakia and operating under Slovak copyright licensing (SOZA), founded by Hegedüs Erzsébet and Strein Miki. It runs more than thirty thematic Hungarian channels — a main service plus Mulatós, Rock, Retro, seasonal Christmas streams and this Kabaré comedy channel — under the slogan "100% magyar zene, a szeretet hullámhosszán" (100% Hungarian music, on love's wavelength). The Kabaré stream carries Hungarian cabaret and stand-up rather than music. The organisation also operates Mercy TV and is tied to the Mercy Együttes ensemble, and it funds itself through listener donation drives rather than advertising, which makes it non-commercial rather than a commercial broadcaster as previously recorded.
