  format: News-and-talk radio simulcasting Teletica's flagship television newscasts and entertainment programming alongside pop and pop-rock music.
  notes: Teletica is Costa Rica's oldest and largest private television broadcaster, founded 1960 as Canal 7 by Rene Picado Esquivel and now operating multiple TV channels, digital news (teletica.com), sports and entertainment brands. Teletica Radio is the group's radio extension carrying simulcasts of marquee programs including "Telenoticias" (the country's flagship evening newscast launched 1972) and the long-running reality/variety show "Calle 7", plus daytime news, magazine and music programming. The Picado family retains ownership control; in recent years the group has expanded into streaming and digital subscription services. As Costa Rica's dominant private broadcaster, Teletica is editorially independent of government and church but holds a powerful agenda-setting role in the national media landscape.
