  notes: 'Radio Kultura (Радио Культура) is the culture and arts radio channel of VGTRK, the Russian federal state broadcaster, transmitting on 91.6 FM in Moscow and the Moscow region and streaming via the Smotrim platform. Programming centres on classical music alongside jazz, blues, ethnic and rock selections, radio dramas performed by professional actors, hourly cultural news and interviews with cultural figures. The former cultradio.ru site now redirects to smotrim.ru/cultradio. As a VGTRK channel it belongs to a sanctioned state media group, although its own output is cultural rather than political. Editorial flag: Operated by VGTRK, the Russian federal state broadcasting company, which is subject to EU/UK/Canadian sanctions since 2022; the channel itself is largely cultural (classical music, radio drama, arts talk) but carries VGTRK''s hourly news bulletins.'
