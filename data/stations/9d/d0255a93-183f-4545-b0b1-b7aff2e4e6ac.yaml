  notes: Radio Monique 963 is legendary offshore pirate radio launched December 16, 1984 from the Ross Revenge ship. Founded by Dutch and Belgian businessmen with Canadian lottery funding; sold October 1987. Operated at 963 kHz, later 819 kHz, then 558 kHz. Content produced by Music Media International (Fred & Gerda Bolland). Now operates as streaming service offering multiple bitrates (64-320 kbps). Represents historic pirate radio era and Dutch offshore broadcasting culture.
