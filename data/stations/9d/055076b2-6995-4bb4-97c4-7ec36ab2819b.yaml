  nature: public broadcaster
  operator: All India Radio (Akashvani), the radio division of Prasar Bharati, India's autonomous public service broadcaster under the Ministry of Information and Broadcasting
  affiliations: Government of India / Prasar Bharati statutory corporation
  audience: Kolkata and West Bengal urban audience; Bangla-language with some English programming aimed at young and middle-aged listeners
  format: FM Rainbow's flagship "infotainment" mix — popular Bengali and English music, interviews, drive-time shows, lifestyle and city information
  notes: FM Rainbow Kolkata broadcasts on 107.0 MHz from AIR's Kolkata station; the Rainbow brand was rolled out by AIR in the late 1990s to provide a contemporary, listener-friendly counterpoint to its traditional Vividh Bharati and primary channel services; the Kolkata Rainbow service is one of the four original Rainbow stations (Delhi, Mumbai, Chennai, Kolkata) and is presented bilingually in Bangla and English.
