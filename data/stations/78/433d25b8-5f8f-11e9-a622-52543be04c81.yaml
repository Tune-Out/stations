  nature: religious
  operator: Radio Maria Burundi, the Burundian affiliate of the World Family of Radio Maria (Famiglia Mondiale Radio Maria), an Italian-founded international Catholic radio network
  affiliations: Roman Catholic Church (Latin rite); coordinated globally by the World Family of Radio Maria headquartered at Erba, Italy; locally connected to the Conférence des Évêques Catholiques du Burundi (CECAB)
  audience: Burundian Catholic faithful and general Christian listeners; broadcasts in Kirundi, French and Swahili
  format: Catholic religious programming - prayer, rosary, Mass, catechesis, Bible reflection, talk and family / health programmes, plus sacred music
  notes: Radio Maria Burundi is part of the World Family of Radio Maria, a worldwide network of more than 80 listener-supported Catholic stations whose stated four pillars are prayer, evangelisation, catechesis, and human promotion ("preghiera, evangelizzazione, catechesi, promozione umana"); the network was founded as a parish radio in Arcellasco d'Erba (Italy) in 1983 and went international in the 1990s; the Burundi affiliate broadcasts on FM across multiple provinces and operates as a non-profit funded by listener donations rather than advertising; like other Radio Maria stations it is editorially aligned with the Catholic magisterium and has, in some African countries, been criticised by governments for coverage of social and human-rights issues, though no specific sanction against the Burundian station is widely documented.
  sources: internal knowledge (http://www.radiomaria.bi/ returned HTTP 403)
