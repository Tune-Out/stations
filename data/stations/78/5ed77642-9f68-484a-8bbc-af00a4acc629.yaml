  audience: UK Baby Boomers (65+) — explicitly targeted at the post-war generation; English-language
  format: classic hits and easy listening — "Music For Our Generation!"; songs from the 60s, 70s, and beyond, with personality-driven presentation; sister streams include Boom Light and Boom Rock
  notes: Boom Radio launched on 14 February 2021 (Valentine's Day) on DAB+ across the UK, founded specifically to serve the Baby Boomer audience that founders Phil Riley and David Lloyd argued had been abandoned by BBC Radio 2's drift toward younger demographics; presenter line-up has included veteran DJs such as David Hamilton, Diana Luke, Paul Robey, Derek Webster, Andy Marriott, Nicky Horne, and Graham Dene; the station has grown rapidly per RAJAR figures and is widely cited in UK trade press as a successful niche commercial radio launch.
