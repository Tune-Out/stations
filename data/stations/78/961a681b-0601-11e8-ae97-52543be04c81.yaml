  notes: 'Radio Plus is a private commercial FM station in Mauritius, launched in 2002 and owned by Radio Plus Ltd, the broadcasting arm of Le Défi Media Group. It transmits on 87.7 MHz in the centre of the island, 88.6 MHz east and west, and 89.3 MHz north and south, and broadcasts in French, Mauritian Creole and Hindi. Programming is full-service rather than music-only: news strands such as Lunch Time News, Au Cœur de l''Info and Le Grand Journal sit alongside talk shows including Explik Ou Ka and Allô Maurice, plus Turf Plus horse racing and Bollywood, séga and international music shows. The group also runs three web-only spin-offs, Radio Plus Hits, Fever and Indiz.'
