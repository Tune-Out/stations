  notes: Newstalk ZB traces its lineage to 1ZB Auckland (launched 1937 by the New Zealand Broadcasting Service); the modern Newstalk ZB news-talk format was established in 1987 under Radio New Zealand Commercial, sold to The Radio Network (TRN) in 1996, and the network is now operated by NZME after a 2014 demerger from APN News & Media; the network's flagship hosts (notably Mike Hosking, Heather du Plessis-Allan and the late Sir Paul Holmes) are widely regarded as politically centre-right; the Christchurch local outlet broadcasts on 1098 AM and 100.9 FM with regional news inserts
