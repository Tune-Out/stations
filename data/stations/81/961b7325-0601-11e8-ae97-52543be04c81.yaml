  notes: '.977 The 80s is the flagship channel of the .977 Music internet radio network, which began as Club 977 in 1998, was built out by founder Jeff Bachmeier around 2000 and was among the first streams carried on iTunes Radio in 2002. The network is based in Daytona Beach, Florida, runs about eleven ad-supported automated genre channels (80s, Hitz, Country, Mix, Oldies, Smooth Jazz, Classic Rock and others) delivered via Triton''s StreamTheWorld, and has recently rebranded as Hitsradio: 977music.com now redirects to hitsradio.com. Programming is continuous 1980s pop and rock hits with no presenters and no terrestrial licence.'
