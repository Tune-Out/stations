  notes: Radio Yanosik is a Polish online station run by Radio Yanosik Sp. z o.o. in Poznan, built as a companion to the Yanosik in-car navigation and road-alert app from Neptis. It is aimed squarely at drivers, mixing Polish and international music with traffic-law advice, motoring safety tips, news, sport, culinary and travel segments. Alongside the main service it offers themed side channels including Rock, EDM, Love, Road, Classical, 80s, 90s and Disco-Polo, and the app integrates with Android Auto and Apple CarPlay.
