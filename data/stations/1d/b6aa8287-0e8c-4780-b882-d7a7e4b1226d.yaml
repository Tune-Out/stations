  notes: ICI Musique (formerly Espace musique, before that Chaîne culturelle) is the French-language music network of Radio-Canada, the French arm of Canada's national public broadcaster CBC/Radio-Canada; the Montreal station broadcasts at 100.7 FM (CBFX-FM), part of a nationwide FM network including Toronto 90.3, Vancouver 90.9, Quebec City 95.3, and many smaller markets; programming focuses on music discovery across genres including classical, jazz, world music, francophone song, and contemporary pop/rock; integrated into the OHdio digital audio platform offering radio, podcasts, and audiobooks; current programming includes shows like "Tellement Courteau" (Alexandre Courteau) and "Toute une musique" (Marie-Christine Trottier); operates under CBC/Radio-Canada's mandate as defined in the Broadcasting Act; Canada's public broadcaster is bilingual but legally and editorially independent of government per Crown corporation status.
