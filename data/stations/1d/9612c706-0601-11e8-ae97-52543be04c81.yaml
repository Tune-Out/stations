  format: Adult contemporary / classic hits in Lithuanian and English, programmed around 1970s-2000s music with morning, mid-day and drive-time talk strands; tagline "Muzika, kuria jauti" ("Music you feel")
  notes: M-1 Plius (Pliusas) is the adult-contemporary sister station of M-1, Lithuania's first private commercial FM station; both are owned and operated by UAB M-1, part of the 15min media group around the 15min.lt news portal, which also operates M-1 Dance and the soft-AC station Lietus; M-1 Plius broadcasts on FM frequencies in Vilnius, Kaunas, Klaipėda and other major Lithuanian cities and streams online from pliusas.fm (now redirected under pliusas.15min.lt); the schedule includes long-running weekday strands "Lengvas geras rytas" (07-10), "Diena su pliusu" (10-13), "Gyvenimo spalvos" (13-16) and "Pakeliui namo" (16-19); the station is funded by commercial advertising, regulated by Lithuania's LRTK media authority, and headquartered at A. Smetonos g. 7, Vilnius.
