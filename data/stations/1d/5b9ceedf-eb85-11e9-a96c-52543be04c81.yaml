  notes: 'FIP Jazz is one of the thematic webradios of FIP, the Radio France music service whose name stands for France Inter Paris. FIP launched on 5 January 1971 under Roland Dhordain, Jean Garetto and Pierre Codou, and built its reputation on human-programmed, near-uninterrupted music: its programmers assemble three-hour blocks, avoid repeats within 48 hours, and put roughly 44,000 tracks by 16,000 artists on air each year, around 85 percent of them from independent labels. The jazz stream applies that same curation to a single genre, running from classic standards through contemporary and European jazz with no advertising. It is funded as part of French public radio and streams worldwide from Radio France''s Icecast servers. The earlier note glossing FIP as "Fédération Internationale de la Presse" was wrong.'
