  notes: Radio Fórmula 104.1 FM (call sign XERFR-FM) is the flagship Mexico City FM outlet of Grupo Fórmula, one of Mexico's largest privately owned radio networks; founded in 1968 by Rogerio Azcárraga Madero, Grupo Fórmula operates a multi-cadena (multi-network) format with several parallel signals (Primera, Segunda, Tercera Cadena) carrying news, talk, and music. The 104.1 FM signal carries Radio Fórmula's "Segunda Cadena" and acoustic music branding, paired with high-profile talk and political programming such as Eduardo Ruiz-Healy, Ciro Gómez Leyva, López-Dóriga, and Joaquín López-Dóriga's morning news. The group has long been a fixture of Mexican political and business journalism.
