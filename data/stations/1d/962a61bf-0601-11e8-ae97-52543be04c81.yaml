  notes: 1.FM Amsterdam Trance Radio is one of several dozen genre channels operated by 1.FM, a long-running commercial internet radio network headquartered in Zug, Switzerland. The 'Amsterdam' branding evokes the Dutch trance scene but the channel is a largely automated, presenter-free playlist of uplifting and progressive trance served from 1.FM's own streaming infrastructure. The network is ad-supported with an optional ad-free premium subscription, and its channels are widely relayed by radio directories and apps. 1.FM's web presence now lives at radio.1cloud.fm.
