  operator: egoFM GmbH & Co. KG, based in Munich, Germany (privately held)
  affiliations: none known; positions itself as an "alternative radio station" (alternativer radiosender)
  audience: Young adult (roughly 20-39) German-speakers interested in indie, alternative and emerging music; Bavaria, Baden-Württemberg and parts of Saxony with national webstreams
  format: Alternative / indie / pop music with focus on music discovery — "Musikentdecker" (music discoverers); also covers culture, lifestyle and youth issues
  notes: egoFM launched in 2008 from Munich and broadcasts over FM and DAB+ in Bavaria, Baden-Württemberg and Saxony, with 14 web-only genre sub-channels (pop, hip-hop, soul, jazz, chillout, etc.) and egoFM plus subscription; describes itself as opening a "Schöne Neue Radiowelt" (Beautiful New Radio World) and emphasizes alternative music curation against mainstream commercial radio formats.
