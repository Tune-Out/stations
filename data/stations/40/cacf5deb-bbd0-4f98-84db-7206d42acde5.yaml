  operator: Radio Televisyen Malaysia (RTM) — Malaysia's national public broadcaster under the Ministry of Communications
  affiliations: Government of Malaysia (Ministry of Communications); no religious or party affiliation, but editorial line follows Malaysian state-media norms
  audience: Malaysian Chinese (Mandarin-speaking) listeners nationwide
  format: Mandarin-language general-interest radio — news, current affairs, lifestyle talk, public-service information, and Chinese pop / mando-pop music
  notes: Ai FM (爱FM, "Love FM") is the national Mandarin-language network of RTM, launched in April 2005 and broadcast nationwide on FM (89.3 MHz in Kuala Lumpur) and online; its mission is to serve Malaysia's roughly 6-million-strong Chinese community with Mandarin programming including news bulletins, talk shows, cultural programmes and contemporary Chinese music; it is one of six national RTM radio networks alongside Nasional FM (Malay), TraXX FM (English), Minnal FM (Tamil), Asyik FM (Orang Asli), and Radio Klasik; RTM operates under the Kementerian Komunikasi (Ministry of Communications) and is funded by the federal government, making Ai FM state media though formally non-partisan and serving public-service objectives.
