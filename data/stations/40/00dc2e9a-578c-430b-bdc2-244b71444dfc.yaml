  operator: DPG Media Group (Belgian-Dutch media conglomerate; Qmusic Belgium operated under DPG Media's radio division)
  affiliations: Part of the international Qmusic brand (sister stations in the Netherlands operated by DPG Media NL); no religious, governmental or political affiliations
  audience: Dutch-speaking Flemish audience in Belgium (Vlaanderen), targeting 20-44 year-olds; nationwide via DAB+ and FM, available online internationally
  format: Mainstream contemporary hit radio (CHR) / Hot AC — pop hits, dance and Dutch-language tracks, presenter-driven daytime shows with games and competitions
  notes: Launched 2001 originally as "4FM", rebranded to Qmusic in 2010 when De Persgroep (now DPG Media) acquired the brand from the Dutch Qmusic. Consistently among the top-rated commercial stations in Flanders, competing with MNM (VRT), Joe and Topradio. Known for high-profile morning shows ("Q-Morning"), the annual "Het Foute Uur" cheesy-hits feature, and stunt promotions like "Hét Geluid" guessing game. Headquartered in Vilvoorde near Brussels.
