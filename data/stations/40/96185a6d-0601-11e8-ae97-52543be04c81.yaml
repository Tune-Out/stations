  notes: Frisky Chill is the chillout channel of FRISKY (frisky.fm, originally friskyradio.com), a pioneering electronic-music internet radio service launched in San Francisco in 2001 and relaunched in 2013 as a subscription service from New York. The platform runs four channels — Main, Deep, Chill, and Classics — with curated DJ mix sets and live shows; it claims "the world's largest catalogue of exclusive curated DJ mix sets" and operates a freemium model (ad-supported free tier + premium ad-free subscription).
