  nature: public broadcaster
  operator: Polskie Radio S.A. (Polish Radio), Poland's national public-service radio broadcaster
  affiliations: state-owned public broadcaster overseen by Poland's National Broadcasting Council (KRRiT); funded by licence-fee/state subsidy; editorial line shifted markedly under PiS government 2016–2023 and has been undergoing reform since the Tusk government's December 2023 changes
  audience: Polish-speaking youth and young adults (target demographic 15–29) seeking alternative, indie, electronic, and non-mainstream music
  format: Alternative/indie music network with focus on Polish and international independent music, electronic, hip-hop, rock, and youth-oriented talk; broadcasts on DAB+ and digital satellite (analog FM coverage was sharply reduced when the network was reconfigured in 2013)
  notes: Czwórka ("The Fourth") is the youth-oriented fourth channel of Polskie Radio, with a long history dating to 1976 (originally as Program IV — an educational/cultural service); relaunched 16 May 2013 as a music-driven youth alternative network after Program 4's educational format was discontinued; available primarily via DAB+, internet streaming, and a limited number of FM transmitters; like other Polskie Radio channels it underwent management turmoil during the 2023–2024 transition when the new government placed public media in liquidation to bypass PiS-appointed boards
  sources: internal knowledge only
