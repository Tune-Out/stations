  operator: RADIO BOB! GmbH & Co. KG (Kassel, Germany); a subsidiary of Hit Radio FFH-Gruppe (Hessischer Rundfunk-Werbung GmbH / HitRadio FFH co-owners)
  affiliations: none political/religious; commercial sponsorship partner of major German rock festivals (Wacken Open Air, Rock am Ring, Hurricane, Southside) and operator of "BOBfest"
  audience: German-speaking rock and metal listeners 25-49, nationwide via DAB+, FM regional windows (Hessen, NRW, Schleswig-Holstein) and webstreams; the "Best of Rock" subchannel targets classic-rock fans worldwide via stream
  format: 24/7 classic-rock web channel within the RADIO BOB! station family, focused on the best-known hits from 1960s-2000s rock (Queen, AC/DC, Led Zeppelin, Bon Jovi, Foo Fighters, etc.) - the "best of" rotation across the BOB! catalogue.
  notes: RADIO BOB! launched in 2005 in Kassel as Germany's first nationwide dedicated rock format, operated by a joint venture rooted in the Hit Radio FFH group; it expanded from DAB+ and online to several regional FM licences and runs an extensive network of around two dozen rock sub-streams (Classic Rock, Metal, 80er Rock, Alternative Rock, Deutschrock, Mittelalter Rock and the flagship "BOBs Best of Rock"); the brand slogan is "Wenn Rock, dann BOB!" (if rock, then BOB!); RADIO BOB! is privately owned, commercial and editorially independent, with no governmental or religious ties.
