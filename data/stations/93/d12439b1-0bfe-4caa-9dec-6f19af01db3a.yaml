  notes: Kiss FM was originally launched on 102.1 MHz São Paulo in 1989 by the Saad family (Bandeirantes group). After a period dark and then several format changes, the rock format was relaunched in 2014 by businessman Roberto Avallone on 92.5 MHz São Paulo and has since expanded to a small network covering Rio de Janeiro 92.9, Campinas 107.9, Litoral Paulista 100.3, Ribeirão Preto 105.3 and Brasília 106.7. The brand styles itself "Não Deixe O Rock Sair De Você" (Don't let rock leave you) and is media partner of Monsters of Rock Brazil and major arena tours.
