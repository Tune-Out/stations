  operator: Občianske združenie Slobodný vysielač (Free Broadcaster civic association), Banská Bystrica
  affiliations: positioned as independent/alternative media; widely characterized in Slovak media research as a sympathetic platform for conspiratorial, pan-Slavic, anti-NATO, anti-EU and pro-Russian narratives, with no formal party tie
  audience: Slovak-speaking adults who distrust mainstream media; alternative-news, conspiracy and "patriotic" listenership across Slovakia and the diaspora
  format: alternative spoken-word talk radio mixed with music — political/economic commentary, geopolitics, "alternative" health, esoteric and historical programs; broadcasts live 24/7 online
  notes: '"Slobodný vysielač" (literally "Free Broadcaster") was launched in 2013 (some self-publicity dates roots to 1993) by Ivan Štubňa and associates and operates as a Banská Bystrica-based civic-association internet radio financed by listener donations and merchandise; multiple Slovak fact-checking organisations (e.g. Konšpirátori.sk) and academic studies on disinformation have included it among Slovak "alternative" outlets accused of spreading conspiracy theories and pro-Kremlin narratives, while the station presents itself as "najväčší a najkomplexnejší projekt slobodného a nezávislého média v dejinách Slovenska" (the largest and most comprehensive free and independent media project in Slovak history).'
