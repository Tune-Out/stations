  nature: public broadcaster
  operator: Polskie Radio S.A. (Polish national public radio broadcaster) — Program 3 / Trójka
  affiliations: state media — funded via Polish public broadcasting and licence-fee/subsidy system; oversight historically via the National Broadcasting Council (KRRiT)
  audience: Polish-speaking national audience; traditionally educated, culturally engaged adults
  format: Eclectic music (rock, jazz, alternative, ambitious popular music), cultural journalism, literary radio, current affairs and talk
  notes: Launched on 1 April 1962 as Program III of Polskie Radio, "Trójka" became one of Poland's most celebrated cultural stations, famous for the long-running "Lista Przebojów Programu Trzeciego" (Top 3 chart) and hosts such as Marek Niedźwiecki, Wojciech Mann and Piotr Kaczkowski; in 2020 it suffered a major editorial crisis after the chart's "Twój ból jest lepszy niż mój" Kazik Staszewski episode was censored, triggering mass resignations and accusations of political interference by the then PiS-aligned management. The brand was being repositioned again in 2024–2025 under Polskie Radio's restructuring/liquidation procedures.
  sources: https://trojka.polskieradio.pl/, internal knowledge
