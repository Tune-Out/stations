  notes: Polskie Radio Program III (Trójka) is Polish public radio's music-and-culture channel, launched 1 April 1962 in Warsaw and long famous for the 'Lista Przebojów Programu Trzeciego' chart and hosts such as Marek Niedźwiecki and Wojciech Mann. In May 2020 management admitted the chart result for Kazik's 'Twój ból jest lepszy niż mój' had been manipulated, triggering mass resignations and an audience collapse from about 8% to under 2% share; the station has been rebuilding under Polskie Radio's post-2024 restructuring. This entry's Shoutcast MP3 URL is dead, but its HLS alternative (stream13.polskieradio.pl/pr3) still works; the catalog's 'Trojka' entry with far more votes is the same broadcast.
