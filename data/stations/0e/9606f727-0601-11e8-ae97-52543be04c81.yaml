  operator: Westdeutscher Rundfunk Köln (WDR) — Anstalt des öffentlichen Rechts (statutory public-law broadcaster) of the state of North Rhine-Westphalia
  affiliations: ARD (the consortium of regional public broadcasters in Germany); financed via the German broadcasting contribution (Rundfunkbeitrag). No commercial advertising on the main stream. No party, religious, or governmental control — public broadcaster with statutory independence guaranteed by Rundfunkstaatsvertrag.
  audience: Young adults aged roughly 14-39 across North Rhine-Westphalia (and beyond via webstream); German-language
  format: Youth-oriented hot AC / CHR with pop, rock, hip-hop, dance, and Top-40 hits, plus news, magazines, podcasts, comedy, and youth-focused journalism
  notes: Launched 1 April 1995 (replacing Radio 5) as WDR's youth radio service. One of the most-listened-to young-target radio stations in Germany. Headquartered in Cologne. Streams confirmed via icecast.wdr.de domain in the URL. The station's mission per WDR-Gesetz is to provide public-service broadcasting for younger audiences with cultural, journalistic, and entertainment content. "1LIVE Krone" award is a notable annual German music/media prize the station gives out.
