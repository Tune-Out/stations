  notes: 1LIVE is the youth radio service of Westdeutscher Rundfunk (WDR), the ARD public broadcaster for North Rhine-Westphalia, based in Cologne. It launched on 1 April 1995 as the successor to WDR 1 and targets 14-39 year olds; as of 2023 more than 2.5 million people listen daily, making it one of Germany's most-listened young-audience stations. The daytime format is contemporary hits with presenter-led shows, news and comedy, while the alternative show Plan B and night-time radio plays, audiobooks and documentaries add public-service depth. It broadcasts on FM and DAB+ across NRW, on satellite and online, is financed by the Rundfunkbeitrag licence fee and awards the annual 1LIVE Krone music prize.
