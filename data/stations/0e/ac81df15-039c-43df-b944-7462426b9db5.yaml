  operator: South African Broadcasting Corporation (SABC) — the South African public broadcaster
  affiliations: South African government (state-owned public broadcaster, editorially independent under SABC charter); no religious or political-party affiliation
  audience: isiZulu-speaking South Africans (largest language group in SA, ~12 million native speakers); rural and urban KwaZulu-Natal, Gauteng, Mpumalanga, and Zulu diaspora globally
  format: Full-service isiZulu-language radio — news, talk, current affairs, drama, music (gospel, maskandi, kwaito, R&B, hip-hop), sport, religious and educational programming
  notes: Established 1960 as "Radio Zulu", renamed Ukhozi FM ("The Eagle FM") in 1996. Consistently ranked the largest radio station in Africa and among the largest in the world by audience, with weekly listenership historically of 6-8+ million. SABC describes it as "one of the biggest radio stations on the planet and the largest in Africa." Broadcasts on FM nationwide in South Africa and via stream. Sister stations include Umhlobo Wenene FM (isiXhosa), Lesedi FM (Sesotho), Motsweding FM (Setswana) and other SABC African-language services.
