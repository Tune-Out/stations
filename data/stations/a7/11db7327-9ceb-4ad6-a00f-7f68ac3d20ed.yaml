  notes: Ujyaalo 90 Network is one of Nepal's largest commercial FM satellite/syndication networks, operated by Communication Corner Pvt. Ltd. and headquartered in Kathmandu's Bagmati Province; the flagship Kathmandu station broadcasts on 90 MHz and the network reaches dozens of community and commercial FM affiliates across Nepal, distributing centrally produced news and feature programming alongside local content; the network rose to prominence after the 2006 Loktantra Andolan and especially during the 2015 Gorkha earthquake, when it served as an important emergency-information lifeline; programming spans news ("Ujyaalo Khabar"), talk, music, sports and rural development; it operates the ujyaaloonline.com web portal and a mobile app, and has been recognised in Nepali media-industry circles for its rural reach and emergency journalism.
