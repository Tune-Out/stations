  notes: American Top 40 (AT40) is a long-running US radio music countdown program created and originally hosted by Casey Kasem in 1970. After hiatuses and host changes (Shadoe Stevens 1988-1995, return of Kasem 1998-2004), the modern version has been hosted by Ryan Seacrest since 2004. The iHeart channel is a continuous stream replaying AT40 episodes and related top-40 content. Syndicated by Premiere Networks (an iHeartMedia subsidiary) to hundreds of US and international affiliates. iHeartMedia is one of the largest US commercial broadcasters, headquartered in San Antonio, Texas.
