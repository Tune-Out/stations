  notes: 希望之聲 粵語台 (Sound of Hope Cantonese Channel) is the Cantonese-language service of Sound of Hope International Broadcasting Network. Based in California's Silicon Valley with extensive FM/AM/shortwave broadcasts covering US and global Chinese populations. Part of America's largest Chinese-language broadcast network; operates as major shortwave broadcaster reaching mainland China (northeast, north, east, central, south regions and Inner Mongolia). Serves global Chinese diaspora with news, current affairs, and cultural content in Cantonese and Mandarin. Broadcasting languages include Cantonese and Mandarin. Content includes international news, US affairs, China-related news, automotive, home, investment, education, culture, history, travel, real estate, food, legal, and music programming. Mobile application SOH serves global Chinese audiences.
