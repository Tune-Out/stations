  notes: MDR Sachsen-Anhalt (full name "MDR Sachsen-Anhalt — Das Radio wie wir") is the regional public radio service of Mitteldeutscher Rundfunk for the German federal state of Saxony-Anhalt, broadcast from MDR's Magdeburg studios; it descends from the post-reunification reorganisation of East German broadcasting (Rundfunk der DDR) into the ARD system in 1991; programming is region-focused with daily news magazines, regional politics coverage, lifestyle features, and "Heimatgefühl" music popular with the local audience; transmitted on FM, DAB+, cable, satellite and online.
