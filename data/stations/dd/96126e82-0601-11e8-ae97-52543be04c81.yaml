  notes: NPO Radio 2 is the Dutch public broadcaster's national adult-music network, descended from Hilversum 1 (1947), renamed Radio 2 on 1 December 1985 and NPO Radio 2 on 19 August 2014. Programming is made by member associations of the Dutch public system — as of late 2025 BNNVARA, AVROTROS, PowNed, KRO-NCRV and MAX — under the NPO umbrella. It targets listeners aged roughly 35-55 with pop, rock and soul from about 1980 to the present plus new releases, live artist sessions and talk. Its signature event is the listener-voted Top 2000, broadcast between Christmas and New Year every year since 1999 and now a national cultural fixture. The station has held above a 10 percent listening share since 2007 and was Dutch market leader for several years between 2019 and 2024; it is carried on FM, DAB+, DVB-T, satellite and online.
