  operator: Boom Radio Ltd, an independent UK broadcaster co-founded by Phil Riley and David Lloyd
  affiliations: none known; partners with Save the Children (via Graham Dene's "Legacy Tracks"), Ambassador Cruise Line, and The Oldie magazine
  audience: British Baby Boomers (1946-1964 cohort) and adjacent older listeners across the UK
  format: Oldies / adult contemporary specifically targeting Boomers, branded "Music For Our Generation!" — a family of stations including Boom Radio, Boom Light ("Easy listening and all your '50s favourites"), and Boom Rock
  notes: Launched February 14, 2021, by Phil Riley and David Lloyd to fill the gap left when stations like Radio 2 increasingly courted younger audiences; broadcasts on DAB+ nationally, online and via app; on-air talent includes veteran UK presenters such as Graham Dene, David Hamilton, Diana Luke, and Derek Webster; has won several Audio & Radio Industry Awards (ARIAS) for its programming targeting older listeners
