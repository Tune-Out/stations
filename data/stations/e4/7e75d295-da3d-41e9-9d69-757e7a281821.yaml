  operator: Classic Hits Radio Ltd (rebrand from Bauer Media's Ireland operations / former 4FM); owner has changed over the years through Bauer, GoLoud/Wireless and consortia
  affiliations: licensed by the Broadcasting Authority of Ireland (now Coimisiún na Meán); commercial regulator-licensed station, no political/religious ties
  audience: 35+ Irish national audience interested in classic hits and 80s/90s pop and rock
  format: Adult contemporary / classic hits — pop, rock and chart hits from the 70s through 2000s, with news, sport and Irish-presenter shows
  notes: Originally launched 2 February 2009 as 4FM (the "four city" station serving Dublin, Cork, Galway and Limerick) under a quasi-national licence; rebranded to Classic Hits 4FM in 2014 and later to Classic Hits as additional FM frequencies were added; ownership has passed through entities including Bay Broadcasting/Choice Broadcasting and more recently the Bauer/Wireless group; presenters have included well-known Irish broadcasters such as Gareth O'Callaghan, Niall Boylan and Colm Hayes.
