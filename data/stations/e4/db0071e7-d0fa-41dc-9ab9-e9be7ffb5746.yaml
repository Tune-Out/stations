  nature: public broadcaster
  operator: Radio Bremen, the smallest member of the ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland) public-broadcasting consortium
  affiliations: ARD; funded by the German Rundfunkbeitrag household licence fee; editorially independent under the Radio Bremen state treaty (Landesgesetz)
  audience: Young adults roughly 15-29 in the city-state of Bremen and Bremerhaven, German-speaking, also streamed nationally
  format: Youth-oriented mix of German hip hop (Deutschrap), hip hop, electronic / electro, urban pop and indie, plus magazine programming and social-media features; the station's tagline emphasises "werbefrei" (ad-free) public-service character
  notes: Bremen Next launched on 23 November 2015 as Radio Bremen's youth radio brand, replacing the earlier "Funkhaus Europa" youth slots; broadcasts on DAB+ in Bremen and Bremerhaven and via stream nationwide; part of ARD's wider effort to retain younger audiences alongside Cosmo, 1Live, Bremen Next, MDR Sputnik, N-Joy and PULS
