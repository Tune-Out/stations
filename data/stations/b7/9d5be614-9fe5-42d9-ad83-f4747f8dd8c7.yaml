  nature: public broadcaster
  operator: Radio France (the French national public radio company), a state-owned société nationale de programme
  affiliations: French public-service broadcasting; member of the European Broadcasting Union (EBU); editorially independent under the Cahier des charges of Radio France and supervised by Arcom
  audience: Cultivated music-lovers in France and worldwide; strong reputation among musicians, students and a francophone diaspora
  format: Eclectic, virtually commercial-free, ad-light music programming — jazz, French and international pop/rock, classical, world music, soundtracks, electronica and reggae, with sparse, signature low-voice presentation between tracks
  notes: Founded in January 1971 as "France Inter Paris" (whence the acronym FIP) by Roland Dhordain, Jean Garretto and Pierre Codou as an experimental Parisian traffic-and-music service, FIP grew into one of Radio France's seven national networks and is celebrated for its hallmark eclecticism, its distinctive female announcers historically nicknamed "les fipettes" (whose intimate, breathy voices became part of the brand), and a near-absence of advertising; today it broadcasts on FM in a handful of French cities (Paris, Bordeaux, Strasbourg, Nantes, Toulouse and Rennes) and nationally via DAB+ and the radiofrance.fr platform, with seven webradio sub-channels (FIP Rock, FIP Jazz, FIP Groove, FIP Pop, FIP Electro, FIP Reggae, FIP Nouveautés); as part of Radio France it is funded by the public broadcasting allocation that replaced the redevance audiovisuelle in 2022 and bound by an obligation of pluralism and cultural mission.
  sources: https://www.radiofrance.fr/fip, internal knowledge
