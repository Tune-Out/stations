  nature: public broadcaster
  operator: Australian Broadcasting Corporation (ABC), Australia's national public-service broadcaster
  affiliations: Statutory authority funded by the Commonwealth Government via triennial appropriations; editorially independent under the Australian Broadcasting Corporation Act 1983; no commercial advertising; no religious or party affiliations
  audience: Adult Australian music fans (25-54) seeking alternative, indie, classic rock and Australian artists — older sibling demographic to Triple J's youth audience
  format: Alternative and indie rock, classic and contemporary; deep cuts, album tracks, Australian music, plus specialist shows (Lunch with Karen Leng, Loose Ends, Take 5 with Zan Rowe, etc.)
  notes: "Double J launched in 2014 on the ABC's Digital Audio Broadcasting and online platforms, named in homage to \"2JJ\" — the original Sydney youth station that became Triple J in 1980. Where Triple J targets listeners under 30, Double J caters to the same audience as they aged into adulthood, blending nostalgic alternative classics with new indie releases and Australian content. ABC Radio operates under the public-service principles in its charter: \"to provide innovative and comprehensive broadcasting services of a high standard\". The stream is available nationwide via streaming, DAB+ (Sydney, Melbourne, Brisbane, Adelaide, Perth, Hobart, Canberra, Darwin) and the ABC listen app."
