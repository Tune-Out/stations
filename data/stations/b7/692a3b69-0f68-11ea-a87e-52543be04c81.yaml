  operator: PRISA Radio / Sociedad Española de Radiodifusión, S.L. — division of Grupo PRISA (publicly listed Spanish media group, also owner of El País and Cinco Días)
  affiliations: Spain's largest commercial radio network; editorial line widely characterised as centre-left / progressive, aligned historically with PSOE-leaning readership; no religious, governmental or party affiliation but PRISA is a major centre-left media voice
  audience: Spanish-speaking adults across Spain (and globally via stream); generalist informative and entertainment audience
  format: News-talk generalist ("radio hablada generalista") — news bulletins, magazine shows, political analysis, live sports (especially football via "Carrusel Deportivo"), interviews and entertainment
  notes: "Founded 1924, making it one of Spain's oldest broadcasters; the SER (Sociedad Española de Radiodifusión) brand dates from 1940. Spain's #1 commercial radio by audience for decades according to EGM (Estudio General de Medios), competing with COPE and Onda Cero. Flagship programmes include \"Hoy por Hoy\" (morning magazine, historically presented by Iñaki Gabilondo, Carles Francino, Àngels Barceló), \"Hora 25\" (evening news), \"El Larguero\" and \"Carrusel Deportivo\" (sports). Operates regional stations under Cadena SER and sister music networks Los 40, Cadena Dial, M80, Máxima FM under PRISA Radio."
