  notes: Cadena SER is Spain's oldest and most-listened-to radio network, tracing its origins to EAJ-1 Radio Barcelona in November 1924 and operated by PRISA Radio, part of Grupo PRISA. It is a generalist news-talk network broadcasting nationwide on FM/AM via dozens of local stations, with programming in Spanish plus regional windows in Catalan, Galician and Basque. Flagship shows include the morning magazine Hoy por Hoy (Àngels Barceló), the evening news Hora 25, and the sports staples Carrusel Deportivo and El Larguero. According to the EGM it has led Spanish radio for 35 consecutive years, with about 4.4-4.6 million daily listeners in the 2026 waves, ahead of COPE and Onda Cero. This entry is the national feed streamed via StreamTheWorld; play.cadenaser.com now redirects to cadenaser.com.
