  notes: Launched on 27 May 1988 as one of Germany's first private commercial radio stations following the deregulation of broadcasting in Baden-Württemberg; broadcasts on FM in multiple BW frequencies (e.g. 102.8 MHz Mannheim), DAB+ and online; known for the annual "Radio Regenbogen Award" gala honouring media personalities; financed entirely by advertising
