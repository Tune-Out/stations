  notes: ERT News Radio (also branded as ERT Proto / "First Programme") is the dedicated news-talk channel within the ERT radio family; broadcasts on FM in Athens (91.6 / 105.8 MHz) plus regional repeaters; ERT was famously shut down by the Samaras government in June 2013 and reopened in 2015 under SYRIZA, an event widely seen as a landmark in European media policy; the corporation operates under Greek public broadcasting law and is overseen by the Greek state but maintains nominal editorial independence.
