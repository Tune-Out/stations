  notes: Sunshine Live is a major German commercial electronic music radio station based in Baden-Württemberg (southwestern Germany). "Classics" channel specializes in 2000s dance and electronic music, recapturing the nostalgia of Sunshine Live's peak era. Sunshine Live was historically one of Germany's premier dance/electronic radio stations during the 1990s-2000s, during the heyday of German Techno and Trance. The main station broadcasts FM and online; the "Classics" stream focuses on archival and classic tracks from the late 1990s through 2000s. Streams at 192 kbps MP3 via dedicated infrastructure. Part of larger German commercial radio ecosystem. No major regulatory sanctions. Strong listener base among German dance music enthusiasts.
