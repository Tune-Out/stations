  notes: Kiss FM Ukraine is a Kyiv-based commercial dance station that first aired on 25 October 2002 on 106.5 FM and is part of TAVR Media, one of Ukraine's largest radio holdings. It broadcasts house, progressive, techno and trance with DJ mixes, chart shows and live events, and as of 2022 operated 21 transmitters covering 71 Ukrainian cities. Notable programming includes 'Ukraine Dancing', a showcase of Ukrainian-language dance music launched in 2017, and the station runs online sub-streams Kiss FM Deep, Digital and Ukrainian. It positions itself as 'The Best Dance Radio' in Ukraine.
