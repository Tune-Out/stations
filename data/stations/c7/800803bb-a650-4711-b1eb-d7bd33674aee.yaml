  nature: public broadcaster
  operator: Slovenská televízia a rozhlas (STVR) — Slovakia's national public broadcaster, formed in July 2024 from the predecessor RTVS (Rozhlas a televízia Slovenska) following controversial Fico-government legislation
  affiliations: Slovak state (STVR is a public-service broadcaster financed by state budget and concession fees; its director-general is elected by the National Council of the Slovak Republic)
  audience: General Slovak adult audience nationwide; Slovak-language
  format: Flagship national public radio — news, current affairs, talk, sport, weather, culture and mainstream music; daily morning show "Dobré ráno" (Good Morning) and overnight "Nočná pyramída" (Night Pyramid) are among the most listened-to programmes
  notes: Rádio Slovensko (formerly Rádiožurnál / Slovenský rozhlas 1) traces back to the foundation of Slovak public radio (Slovenský rozhlas) in 1926; in 2011 Slovenský rozhlas was merged with Slovenská televízia to form RTVS; in 2024 the Slovak parliament dissolved RTVS and replaced it with STVR after months of protests by journalists and EU bodies (European Commission, RSF, EBU) who warned the reform threatened editorial independence; despite the restructuring Rádio Slovensko remains Slovakia's main public-service speech-and-news radio channel.
