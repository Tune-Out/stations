  notes: '"Cumbias Inmortales Corsan" is the personal web-radio project of DJ Corsan, a sonidero/grupero DJ from Morelos, Mexico. The cumbia genre, originally Colombian, evolved in Mexico into the distinctive "cumbia sonidera" scene with its dub-style sound-system culture; "grupero" is the related ballad-pop style that dominated working-class Mexican radio from the 1980s through the 2000s. The blog/blogspot homepage suggests a personal, non-commercial project; Zeno.fm hosting offers low-cost cloud streaming.'
