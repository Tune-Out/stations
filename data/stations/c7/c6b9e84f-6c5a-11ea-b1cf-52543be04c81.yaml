  notes: Radio 538 launched on 11 December 1992 and is one of the Netherlands' largest commercial radio brands, named for its original AM frequency (538 kHz); famous for high-profile events including "538Koningsdag" (King's Day) live broadcasts from Breda and the 538 Top 50 / Jaar van 538 year-end countdowns; owned by Talpa Radio (a division of media entrepreneur John de Mol's Talpa Network) following multiple ownership changes; the brand also operates sister stations such as Radio 538 Hitzone, Radio 538 Verstuurd, and themed event streams; broadcasts on FM, DAB+, online, and via international stream including stream URLs hosted by Triton Digital / StreamTheWorld.
