  notes: Frisky (often styled Frisky Radio / frisky.fm) is a long-running independent online electronic-music station launched in 2001 by Alisa Coral ("Miss Disk"). It broadcasts multiple themed channels (Main, Deep, Chill, Frisky+) and a continuous schedule of hosted DJ mix shows from established and emerging producers across progressive house, melodic / progressive trance, deep house, techno and ambient. Frisky won the International Dance Music Award for Best Internet Radio Station in several years through the 2000s/2010s and is widely cited among the longest-running EDM webcasters. It is privately held, headquartered in the United States (registered country US), funded by a freemium subscription model ("Frisky+") and advertising, and has no governmental, religious, or political affiliations.
