  notes: Alpha Boys School Radio is the online radio arm of the Alpha Institute (formerly Alpha Boys School), founded in Kingston, Jamaica in 1880 by Justina "Jessie" Ripoll and operated since 1890 by the Sisters of Mercy of Jamaica as a Catholic charitable home and trade school for at-risk boys; the school's renowned music programme produced many of Jamaica's most important musicians including members of the Skatalites (Tommy McCook, Don Drummond, Lester Sterling, Johnny "Dizzy" Moore), Yellowman and many ska, reggae and jazz pioneers; the station has been praised by the New York Times Magazine as "WORTHY OF PAUSE AND ATTENTION" and named a top-10 world music station by TechHive; this particular stream ("808 Live Reggaecast" on rastamusic.com) carries the same Alpha Boys output via a Rastamusic/Icecast relay.
