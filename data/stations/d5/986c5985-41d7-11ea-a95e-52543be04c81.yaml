  notes: Radio 24 is the Italian all-news and talk station of Gruppo 24 ORE, publisher of the financial daily Il Sole 24 Ore, and was founded on 4 October 1999 as the country's first private all-talk radio. It broadcasts nationally on FM and DAB+, via Sky channel 700 and online, with business news bulletins around the clock and programmes such as '24 Mattino', 'Effetto Giorno' and 'Focus Economia'. Its evening talk show 'La Zanzara' with Giuseppe Cruciani and David Parenzo, on air since 2006, is deliberately politically incorrect and known for prank calls and periodic controversy. Gruppo 24 ORE is listed on Borsa Italiana and was majority-owned by employers' federation Confindustria until 2017.
