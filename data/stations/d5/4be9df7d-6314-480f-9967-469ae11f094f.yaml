  notes: Radio Rodja (originally "Radio Dakwah Ahlussunnah wal Jamaah") is an Indonesian Islamic dawah station run by Yayasan Cahaya Sunnah in Cileungsi, Bogor Regency, West Java, founded by Abu Yahya Badrusalam in 2005 after his return from the Islamic University of Madinah. It broadcasts on 756 AM (since 2007) and 100.1 FM, and its programming is Qur'anic recitation and religious lectures in the Salafi tradition. Rodja has grown into a network of FM affiliates in more than 15 Indonesian cities including Bandung, Surabaya and Makassar. The catalog's "classical" tag is wrong.
