  operator: Pakistan Broadcasting Corporation (PBC / Radio Pakistan), a statutory body of the Government of Pakistan under the Ministry of Information and Broadcasting
  affiliations: Government of Pakistan (state public broadcaster)
  audience: Urban Pakistani youth and young-adult listeners in Islamabad/Rawalpindi capital region, Urdu and English speakers
  format: FM youth/entertainment channel — pop music, talk, infotainment, lifestyle, drive-time shows
  notes: FM 101 Islamabad is the flagship Islamabad station of Radio Pakistan's FM 101 network, launched in 1998 as the country's first government-run FM channel aimed at a younger, urban audience to compete with private FM stations; PBC traces its roots to the colonial-era All India Radio Lahore station (1937) and is among Pakistan's oldest state institutions; the FM 101 network has stations in Islamabad, Karachi, Lahore, Peshawar, Quetta, and other cities, broadcasting youth-oriented music and talk while retaining national news bulletins from the parent corporation; funded by government grants and limited advertising.
