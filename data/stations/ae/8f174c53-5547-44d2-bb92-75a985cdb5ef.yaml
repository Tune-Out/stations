  notes: Parapolitika 90.1 FM is an Athens-based news, talk and politics radio station, the broadcasting arm of the Parapolitika media group whose flagship outlet is the Sunday newspaper "Parapolitika." The station broadcasts on 90.1 MHz FM in the Athens area (using the Athina Radio frequency / studios on Live24.gr infrastructure). Programming features political talk shows, magazine programmes, and satirical content including "Ελληνοφρένεια" ("Hellenofrenia," a long-running Greek political satire show), "Εμείς οι Έλληνες," and "Κακά Κορίτσια." The Parapolitika group is generally considered to occupy the centre-right / pro-government segment of Greek media.
