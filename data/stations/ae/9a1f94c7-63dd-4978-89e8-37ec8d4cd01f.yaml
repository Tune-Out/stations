  operator: Établissement Public de Radiodiffusion Sonore Algérienne (EPRS / Radio Algérienne), the Algerian state radio body under the Ministry of Communication
  affiliations: Algerian government (state-owned); member of the Arab States Broadcasting Union (ASBU) and African Union of Broadcasting (AUB)
  audience: Arabic-speaking adult listeners across Algeria and the diaspora; national reach
  format: full-service Arabic-language general-interest channel — news bulletins, political and religious programming, talk, culture, classical Andalusi/Chaabi/Arabic music
  notes: Algeria's flagship Arabic-language national radio service; traces its lineage to RTF's Arabic service in colonial Algeria, nationalized after independence in 1962 and folded into Radiodiffusion Télévision Algérienne (RTA); after RTA's 1986 break-up, Radio Algérienne became a separate state-owned EPIC; broadcasts nationwide on AM/MW (mediumwave 153 kHz longwave historically), FM repeaters and shortwave 7295 kHz, plus online; serves alongside Chaîne 2 (Berber/Tamazight) and Chaîne 3 (French) as the three national networks; programming follows official state line
