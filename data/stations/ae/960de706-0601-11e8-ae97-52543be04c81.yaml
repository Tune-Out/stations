  notes: 'Radio Shanson (Радио Шансон) is a Russian national commercial music network launched on 15 August 2000, broadcasting in Moscow on 103.0 FM since 2001 and relayed to over 1,700 cities and towns in Russia, Belarus, Armenia and Transnistria. It has been owned by businessman Mikhail Gutseriev since April 2015 and operates within his Krutoy Media holding. The format is adult-contemporary built around Russian chanson: urban romance, bard songs, film music, popular ballads and some folk and rock. The station stages the annual ''Shanson of the Year'' awards (held for over 20 years at the State Kremlin Palace, since 2023 at Live Arena). The catalog homepage radioshanson.fm now redirects to a survey-spam page; the official site is radioshanson.ru.'
