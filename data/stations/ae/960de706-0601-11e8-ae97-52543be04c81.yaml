  nature: commercial
  operator: Radio Chanson (Радио Шансон), operated in Russia by Media Holding "Krutoy Media" / ZAO Radio Chanson / Multimedia Holding (the station has historically been controlled by Multimedia Holding, founded by businessman Vitaly Bogdanov and later associated with Russia's Multimedia Holding group); broadcasts on a national network of FM affiliates anchored in Moscow.
  affiliations: Operates within Russia's tightly regulated broadcast environment under Roskomnadzor; not state-owned but generally aligned with mainstream Russian cultural establishment; no overt political party ties but the genre and listenership skew patriotic / pro-establishment.
  audience: Russian-speaking adult listeners (typically 35-65), heavily working-class, ex-military, blue-collar and post-Soviet nostalgic demographics across Russia and the Russian-speaking diaspora.
  format: Russian "shanson" - a genre fusing chanson, urban romance, prison/criminal songs (blatnaya pesnya), bard music, soldier songs and adult-contemporary Russian pop ballads; non-stop music with some host segments.
  notes: One of Russia's most-listened-to radio brands, founded in 2000 and a flagship of the shanson genre's popularization; presents the Shanson Year (Шансон года) annual awards at the Kremlin; the genre is closely associated with Russian working-class identity and has, since 2014 and especially after the 2022 invasion of Ukraine, increasingly featured patriotic and pro-military themes (including songs from the Donbas conflict). The station has not been individually sanctioned, but its parent ecosystem operates inside Russia's wartime media regime.
  sources: internal knowledge only
