  affiliations: Government of Canada (funded by parliamentary appropriation under the Broadcasting Act 1991), operationally independent of government editorially; member of the Public Broadcasters International network
  audience: English-speaking Greater Vancouver and Lower Mainland of British Columbia; national CBC Radio 1 audience via live-streaming
  format: News, current affairs, talk, documentary and cultural programming; commercial-free public radio; Vancouver feed includes the BC-produced morning show "The Early Edition" and afternoon "On the Coast" plus national network programs such as "The Current," "As It Happens," "Q," and "Ideas"
  notes: CBC Radio 1 Vancouver broadcasts on CBU 690 AM (which moved to AM in 1928 and has been a CBC owned-and-operated station since 1944) and 88.1 FM; this stream is the Vancouver regional feed of CBC Radio 1, the English-language news-and-talk service of the CBC; CBC is funded primarily by an annual federal appropriation (~$1.4B CAD) with additional self-generated revenue; CBC Radio 1 itself has been commercial-free since 1974 and is governed by the CBC Board of Directors appointed by the federal government but operates editorially under the Journalistic Standards and Practices that mandate balance and accuracy; the network has periodically been the subject of political controversy over perceived bias from both the political left and right.
