  operator: Slovenská televízia a rozhlas (STVR), Slovakia's public service broadcaster (formerly RTVS, merged from STV and Slovak Radio)
  affiliations: Slovak public-service media (state-funded, government-appointed leadership), no religious or party affiliation
  audience: Slovak-speaking listeners with interest in literature, drama, and cultural programming
  format: Cultural and literary station featuring radio plays, dramatic productions, author readings (čítanie), essays, and weekly themed programming
  notes: One of eight national stations under STVR (Slovenská televízia a rozhlas); originally launched within Slovak Radio (Slovenský rozhlas) lineage as the eighth station ("SRo8"), focused on literature, drama and cultural criticism; functions as a venue for the "Zlatý fond Slovenského rozhlasu" (Golden Fund of Slovak Radio) archive of significant Slovak cultural programming; RTVS rebranded to STVR following 2024 government restructuring of Slovak public media under Robert Fico's government, a change criticized by press-freedom organisations
