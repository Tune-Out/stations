  notes: Antyradio is a Polish rock radio network that began broadcasting on 1 June 2005 and is operated by Eurozet, which Agora S.A. took over in full in June 2024 after a court overturned the competition regulator's 2021 block. It broadcasts on FM in Warsaw (106.8), Kraków (101.0), Wrocław (106.9), Gdańsk (92.0), Poznań (101.6), Łódź (89.6) and further cities including Opole since 2025, plus DAB+ and online. Programming mixes contemporary and classic rock with specialist shows from Jerzy Owsiak (Zaraz Będzie Ciemno), Wiesław Weiss (Teraz Rock w Antyradiu) and Leszek Gnoiński (Rockolekcje), and the station is a fixture of the Polish rock-festival scene. The primary redcdn.pl stream in this entry currently times out (HTTP 408) while the alternate an02.cdn.eurozet.pl/ant-web.mp3 stream plays fine.
