  nature: commercial
  operator: Grupa Eurozet Sp. z o.o., owned by Czech Media Invest (CMI) via its Polish vehicle Czech News Center; Eurozet is one of Poland's three largest commercial radio groups alongside RMF and Time
  affiliations: none known direct, but parent group CMI is controlled by Czech billionaire Daniel Křetínský; in 2020 Polish state-controlled Orlen attempted to acquire Eurozet through PKN Orlen / Agora and the deal was blocked by the antimonopoly regulator UOKiK after concerns about media pluralism
  audience: Polish-speaking adult rock and metal fans (roughly 18-44), with a male-leaning audience; nationwide via FM/DAB+/online
  format: Rock and metal music format covering classic rock, hard rock, alternative, metal, grunge and modern Polish rock, with specialist evening shows on subgenres (metal, indie, blues), rock news and concert coverage
  notes: Antyradio launched on 26 March 2007 in Warsaw on 94.0 MHz as a rock alternative to mainstream pop CHR stations; the brand was created by Eurozet (then Polish-French ownership) to fill a gap left after Radio Wawa's reformatting; the network has since expanded to FM transmitters in Warsaw, Kraków, Łódź, Poznań, Wrocław and other cities plus nationwide reach via DAB+, the antyradio.pl player and mobile apps; signature slogan "Antyradio. Tu jest rock"; in 2019 Eurozet (including Antyradio, Radio Zet, Radio Plus and Meloradio) was sold by Lagardère Active to Czech Media Invest; the network is known for irreverent, edgy on-air branding and for hosting Polish rock concerts and festivals.
