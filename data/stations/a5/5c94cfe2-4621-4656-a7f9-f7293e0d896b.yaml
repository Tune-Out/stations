  notes: 'Kanal Kultura is the cultural channel of Belarusian Radio, run by the state Belteleradiocompany. Launched 1 January 2002 as Belarus''s first specialised station, it broadcasts in Belarusian on 102.9 FM in Minsk and regional FM frequencies covering over 99.5% of the population. Programming centres on classical and jazz music, radio drama, literary readings, children''s tales and arts discussion under the motto ''we choose eternal values''. The datacenter.by stream currently returns a 502 error. Editorial flag: Operated by Belteleradiocompany (BTRC), the Belarusian state broadcaster placed on EU, Canadian, Swiss and Ukrainian sanctions lists in 2022 for its role in the Lukashenko regime''s propaganda; this particular channel is cultural rather than political.'
