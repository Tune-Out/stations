  operator: NRG Radio Uganda Ltd, the Ugandan arm of NRG Radio Group (originally a Kenyan media company founded in Nairobi)
  affiliations: Sister stations to NRG Radio Kenya and NRG Rwanda; no religious or political affiliation declared
  audience: Urban youth and Generation-Z listeners in Kampala and central Uganda; primarily English-speaking with Luganda and Swahili content
  format: Contemporary Hit Radio — hip hop, Afrobeats, R&B, dancehall, Ugandan and East African pop, plus celebrity/lifestyle talk
  notes: NRG Uganda broadcasts on 106.5 MHz FM from Nakasero, Kampala, positioning itself as "the number one name in music" and a hub for "the hottest music, real talk, and city vibes"; it is part of the regional NRG Radio brand launched in Kenya in 2017 by entrepreneur Mike Rabar that expanded into Uganda and Rwanda, known for high-energy youth programming, club nights, festival promotion (NRG Wave Festival), and a strong digital/Instagram presence; the station accepts independent artist music submissions and runs city event coverage in Kampala.
