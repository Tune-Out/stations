  notes: Europe 1 is one of France's historic national generalist stations, founded in 1955 as a 'périphérique' broadcaster transmitting from Saarland to bypass the French state radio monopoly. It is operated by Lagardère News; Vincent Bolloré took control of the Lagardère group in January 2022 and the radio assets now sit within Louis Hachette Group after Vivendi's late-2024 demerger. Under Bolloré the station has been aligned editorially with CNews, sharing shows such as L'Heure des Pros and hosts including Pascal Praud and Cyril Hanouna, which triggered a 2021 journalists' strike and Arcom warnings about over-representation of far-right guests. Broadcasting from Paris (104.7 FM) across France on FM and DAB+, its news-talk schedule also features Stéphane Bern and Nicolas Canteloup, and audiences have grown for several consecutive Médiamétrie waves to around 2.8 million daily listeners.
