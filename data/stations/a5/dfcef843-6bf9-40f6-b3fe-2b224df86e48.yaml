  nature: commercial
  operator: Lagardère News (Europe 1 Communication), part of Lagardère Group — controlled by Vivendi / Bolloré Group since 2023
  affiliations: no formal political/religious affiliation; private commercial broadcaster. Since the Bolloré takeover (Vivendi/Lagardère), critics have noted editorial alignment with other conservative/right-leaning Bolloré-owned media (CNews, JDD), drawing debate over editorial independence. No official party tie.
  audience: general adult French audience, with strong skew toward news/talk listeners; French language; national broadcast region
  format: full-service generalist with strong news/talk emphasis — morning news, political interviews, talk shows, cultural and sports programming
  notes: One of France's historic "périphérique" stations, founded in 1955, broadcasting initially from Saarland to bypass French state radio monopoly. Long competed with RTL and France Inter as a top-three generalist. Headquarters in Paris (rue François I). Audience has declined from historic peaks; recent editorial shifts since Bolloré control (synergies with CNews) have been a notable industry story.
  sources: internal knowledge only
