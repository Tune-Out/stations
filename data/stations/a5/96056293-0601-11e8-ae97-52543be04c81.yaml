  format: Alternative-leaning hot adult contemporary / rock-pop format slogan "Rock auf Sendung" / current "Neuer. Besser. delta", with music plus comedy bits, festival promotion and local news.
  notes: delta radio launched on 1 December 1996 from Kiel as Schleswig-Holstein's first private youth-oriented station and is broadcast on FM in Schleswig-Holstein, on DAB+ across northern Germany and via webstream. It is part of the Regiocast group (which also operates R.SH, 80s80s, NRJ Germany and others), funded entirely by advertising. The station is a long-standing presenting partner of the Hurricane and Deichbrand festivals and is closely associated with the Kieler Woche regatta. Notable shows include Melles Mixtape, Internetinspektion and the delta Backstage podcast.
