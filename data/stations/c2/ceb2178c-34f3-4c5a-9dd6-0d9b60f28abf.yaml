  nature: public broadcaster
  operator: Office de Radiodiffusion et Télévision du Bénin (ORTB) — Benin's public broadcasting authority
  affiliations: State-owned public broadcaster of the Republic of Benin; supervised by the Beninese government's communications ministry; member of the African Union of Broadcasting (AUB/URTNA tradition)
  audience: Residents of Borgou Department and the wider northern Benin region (around the city of Parakou); programmes in French and several northern Benin national languages (Bariba/Baatonu, Dendi, Fulfulde, Yom etc.)
  format: General-interest regional public-service radio combining national and local news, music, cultural and educational programmes, agricultural and health information, and live sports
  notes: Radio Parakou is one of the regional stations of ORTB, the public broadcaster created in 1953 (as Radiodiffusion du Dahomey) and reorganised after independence in 1960; ORTB additionally operates Radio Nationale, Chaîne 3 / Atlantic FM, and television channels. The Parakou outlet serves Benin's economically and culturally important second city and the country's northern regions, where it plays a major role in delivering information to rural communities in local languages. As a state broadcaster it falls under the editorial oversight of Benin's government and is funded chiefly through public budget and modest advertising.
