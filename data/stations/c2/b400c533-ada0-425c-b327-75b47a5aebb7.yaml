  notes: Anon.FM (Радио «Анонимус» / Радіо «Анонімус») is a Russian-language non-commercial internet radio project founded in 2009 as an open platform where any listener can host a show. The site describes itself as "некоммерческий проект радиостанции" built entirely on volunteer contributions — listeners produce the programmes, artwork and jingles, and the schedule mixes amateur talk shows, DJ sets and wide-ranging music. It is internet-only, with no terrestrial licence, and streams in Russian with some English and Ukrainian content to a diaspora and post-Soviet online audience. The main MP3 stream (radio.anonymous.delivery) is live and the frameset-era homepage is still served.
