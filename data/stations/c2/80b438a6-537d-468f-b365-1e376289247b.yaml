  notes: 'Prensa Latina is Cuba''s official state news agency, founded in Havana in March 1959. Its radio division at radio.prensa-latina.cu produces Spanish-language news bulletins, correspondent reports and podcasts about Cuba and Latin America, distributed to client stations rather than as a general music service; the ''classical'' tag is wrong. The catalogued onstream.audio live stream no longer responds and the radio site offers on-demand audio only. Editorial flag: Prensa Latina is the official news agency of the Cuban state, founded in 1959 at Che Guevara''s initiative; it operates as a government organ in a one-party system with no independent press, so its output reflects official positions.'
