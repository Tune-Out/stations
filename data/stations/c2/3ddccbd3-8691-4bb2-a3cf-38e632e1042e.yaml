  audience: Mass-market Filipino audience nationwide; primarily Tagalog/Filipino with some English; appeals to news-and-information listeners and OFW families
  format: News-and-information radio — breaking news, traffic and public-service "Radyo Patrol" reports, current affairs, talk shows and listener call-in programmes; trademark "Radyo Patrol" emergency-response brand
  notes: DZMM 630 kHz AM launched 1 January 1986 in Manila as the flagship news/talk station of ABS-CBN's radio division; it ran continuously until 5 May 2020 when the National Telecommunications Commission ordered ABS-CBN off the air after Congress denied its broadcast franchise renewal; DZMM relaunched as an online and TeleRadyo cable-only service, and following ABS-CBN's 2023 partnership with Prime Media and the 2025 sale of the 630 AM frequency to MediaQuest Holdings, the brand has continued in various forms; flagship programmes have included "TV Patrol Radyo," "Pasada sa Teleradyo" and Korina Sanchez and Ted Failon's morning shows.
