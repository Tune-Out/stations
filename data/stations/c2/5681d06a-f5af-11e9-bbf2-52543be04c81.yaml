  notes: Radio Paradise is a listener-supported, advertising-free internet radio service founded in 1997 by Bill and Rebecca Goldsmith and run from Paradise, California. The Rock Mix is one of its five hand-curated channels alongside Main Mix, Mellow Mix, Global Mix and Serenity, and leans to classic and modern rock while keeping the network's blended, DJ-sequenced style. Every track is selected by human curators rather than rotation software, and the service is funded entirely by listener donations. Streams are offered in lossless FLAC as well as AAC and MP3 at multiple bitrates; this entry is the 320 kbps AAC rock feed, which is live.
