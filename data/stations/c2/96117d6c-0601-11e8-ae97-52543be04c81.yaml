  notes: Dwójka (Program 2) is cultural/classical music channel of Poland's national public broadcaster. Warsaw-based. Part of Polskie Radio network including Jedynka (general), Trójka (contemporary/youth), Czwórka (lifestyle), Chopin (classical), and international services in English, Russian, Belarusian, Ukrainian, German. Notable shows include "Rozmowy po zmroku" (Late Night Conversations), "Książka do słuchania" (Audiobooks), and "Filharmonia Dwójki" (Philharmonic broadcasts). Religious programming through Catholic and Ecumenical editorial sections.
