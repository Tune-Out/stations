  notes: Dorozhnoye Radio (Road Radio) is a Russian commercial network launched in Saint Petersburg on 24 July 2003, on FM 87.5 there since 2005 and in Moscow on 96.0 FM since 30 September 2010. Founded by Sergey Yamshchikov and Andrey Danilov, it was sold in 2014 to European Media Group (EMG), which moved headquarters to Moscow in 2015-2016. The format is urban romance, popular chanson and Russian and Western pop hits of the 1980s-2000s at about 85% Russian content, aimed at drivers with regular traffic news; it broadcasts 24/7 in more than 600 cities in Russia, Finland and Transnistria and was ranked the most-listened FM station in Russia in 2015 and 2023. Since 2012 it presents the annual Stars of Dorozhnoye Radio award and runs themed web streams (Nostalgia, Dancefloor, Rock Club).
