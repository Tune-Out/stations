  format: Themed 24/7 online sub-channel of Klassik Radio dedicated exclusively to the works of Wolfgang Amadeus Mozart (symphonies, concertos, operas, chamber and sacred music).
  notes: Klassik Radio is Germany's leading nationwide commercial classical-music station, founded in 1990 in Hamburg by Ulrich Kubak and operated by Klassik Radio AG (now headquartered in Augsburg); the parent broadcasts via UKW/DAB+ across Germany and Austria with the tagline "Musik zum Wohlfuhlen und Entspannen" (music for well-being and relaxation) and produces a large family of "Pure" web-radio sub-channels (Pure Mozart, Pure Bach, Pure Beethoven, Pure Opera, Pure Klassik plus film-score and lounge offshoots) distributed free online and ad-free through the Klassik Radio Plus subscription (~EUR 3.75/month); the company also runs live concert tours ("Klassik Radio in Concert") and a Klassik Radio Pops Orchestra; no governmental or religious affiliations.
