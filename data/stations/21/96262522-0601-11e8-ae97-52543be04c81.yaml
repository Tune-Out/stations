  notes: RAI Radio 6 Techetè is one of the seven networks operated by RAI (Radiotelevisione Italiana), the Italian public broadcasting corporation established in 1944. "Techetè" (from Greek "techne" and "thi" — art and perception) is RAI's archives and heritage radio service, broadcasting classic recordings from RAI's rich broadcast history since the 1930s. The station serves as both a living archive and a cultural preserve, with programming spanning jazz, world music, folk traditions and historical broadcasts. RAI is funded through the mandatory television licence fee (canone RAI) paid by Italian households and is subject to governance by the Italian Parliament and independent regulatory oversight. The station streams via RAI's own CDN infrastructure (icestreaming.rai.it) at professional bitrate (256 kbps MP3).
