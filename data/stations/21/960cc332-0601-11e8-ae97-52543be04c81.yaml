  notes: Bassdrive is a long-running independent internet radio network devoted to drum & bass, launched in 2001 from the US Midwest (Illinois/Ohio) as one of the first dedicated D&B web stations. It runs a full weekly schedule of live, presenter-hosted shows from resident and guest DJs based in London and other UK cities, North America, Australia and Europe, alongside liquid funk, jump-up and jungle programming, and archives shows publicly (the Bassdrive Archives). It states that all music played is directly licensed by composers and rights holders and funds itself through merchandise rather than conventional advertising. It is widely regarded as a cornerstone of the global D&B scene.
