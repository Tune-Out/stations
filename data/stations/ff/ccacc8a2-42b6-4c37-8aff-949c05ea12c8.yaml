  format: Regional public-service mix of local news, community affairs, cultural programming and music for the Matam region; broadcast on 89.1 FM
  notes: RTS Matam 89.1 is one of the regional FM stations operated by RTS as part of its national network covering Senegal's 14 administrative regions; the Matam region in the Fouta Toro is predominantly Fulani-speaking (Pulaar), so the station broadcasts in Pulaar and French; RTS's stated mission is "Le public, notre raison d'être" (the public, our reason for existence); the broadcaster operates 5 TV channels (RTS 1-5) and a national radio network funded primarily by the Senegalese state.
