  format: audio simulcast of CCTV-2 财经频道 (CCTV Finance), the dedicated business/finance television channel — programming includes daily market reports, economic policy news, business documentaries and consumer affairs shows
  notes: CCTV-2 was originally launched in 1973, relaunched as the dedicated finance and economics channel in 2009 (replacing the previous economic channel format); the channel covers macroeconomic policy aligned with central government priorities including the Five-Year Plans, "Dual Circulation" strategy and SOE reform; flagship shows include "经济信息联播" (Economic News Joint Broadcast) and "第一时间" (First Time). As a CCTV channel under the CCP-supervised CMG, all editorial content adheres to state media guidelines and party messaging.
