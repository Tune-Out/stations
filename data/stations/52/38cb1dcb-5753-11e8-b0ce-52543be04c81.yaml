  notes: Fun Radio is a French national music station founded on 2 October 1985 in southern France and owned since 2002 by Groupe M6 (part of RTL Group), which also runs RTL and RTL2. It broadcasts on around 250 FM frequencies (101.9 in Paris, 93.3 Lyon, 99.7 Marseille) plus DAB+ and online, with a dance/electro-pop format aimed at young adults, the Bruno dans la radio morning show, weekend DJ mixes and the long-running Lovin'Fun late-night call-in. ACPM ranked it at a record 3.4 million active digital listening sessions in May 2026. The catalog note attributing it to NRJ Group is wrong. The legacy streaming.radio.funradio.fr URL in this entry now 404s; the icecast.funradio.fr alternate redirects to a working Audiomeans stream.
