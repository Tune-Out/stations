  nature: public broadcaster
  operator: Nederlandse Publieke Omroep (NPO), the Dutch public broadcasting organisation, with programming supplied by member broadcasters (NOS, VPRO, KRO-NCRV, BNNVARA, EO, AVROTROS, MAX, WNL, PowNed)
  affiliations: Dutch public service media system; some content provided by pillar-rooted broadcasters with historical religious/ideological backgrounds (EO=evangelical Protestant, KRO=Catholic, VPRO=liberal/progressive, BNNVARA=social-democratic), but NPO Radio 1 itself is editorially independent and pluralistic
  audience: Dutch-speaking general public, news and current-affairs listeners across the Netherlands
  format: News, current affairs, talk, sports, and live event coverage; tagline "Wie luistert, weet meer" ("Those who listen, know more")
  notes: One of the main national public radio stations in the Netherlands, broadcast on FM, DAB+ and online. Operates under the Dutch Media Act with public funding via the NPO. Successor to the historical Hilversum 1. Provides extensive coverage of national elections, parliamentary debate, and major sporting events.
