  notes: Radio Bianconera is run from Turin and bills itself as "la voce dei tifosi bianconeri" (the voice of Juventus supporters), delivering "Notizie, dirette, interviste e approfondimenti sul mondo bianconero, raccontati con passione e competenza" via a digital-only multi-platform footprint (web stream, TV component, mobile apps, social media). It is one of several team-affiliated fan broadcasters in the Italian football ecosystem (alongside Radio Bianconera's Inter, Milan and Roma equivalents) and is editorially independent of Juventus FC itself, operating as a partisan commercial sports-talk service.
