  notes: Geronimo FM is a private commercial radio station in Yogyakarta, Indonesia, broadcasting on 106.1 FM under the slogan 'Love Yogya and You'. Founded 31 May 1971 as PT Radio Geronimo (informal roots in 1968), it pioneered FM stereo broadcasting in Yogyakarta in 1990. Format is hit music for a young audience with local presenters. The catalog homepage points to a third-party streaming portal; the official site is geronimo.fm.
