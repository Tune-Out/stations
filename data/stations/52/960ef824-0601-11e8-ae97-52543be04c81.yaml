  notes: RTL Radio Lëtzebuerg is the flagship Luxembourgish-language radio service of RTL Group, the European broadcasting giant that traces its origins to Radio Luxembourg (founded 1933 by Compagnie Luxembourgeoise de Radiodiffusion/CLR, later CLT-UFA) and which gave the "RTL" brand to media outlets across Europe; the station holds a near-monopoly position in Luxembourgish-language broadcasting and is regulated under a special concession from the Luxembourg state granting it semi-public-service obligations including national news coverage, parliamentary affairs, and cultural content while operating commercially; RTL Group's parent Bertelsmann is one of Europe's largest privately-held media conglomerates.
