  operator: Radio Algérienne / Entreprise nationale de radiodiffusion sonore (ENRS), under the Algerian Ministry of Communication
  affiliations: Algerian government; member of the Arab States Broadcasting Union (ASBU) and the African Union of Broadcasting (AUB); historically linked to ORTF-trained francophone broadcasters
  audience: French-speaking Algerians (urban professionals, intellectuals, diaspora) and francophone listeners across the Maghreb and Europe
  format: General-interest French-language public service — news bulletins, cultural and society talk, music (Algerian, Arab, francophone, international), sports, and discussion programmes
  notes: Chaîne 3 is the French-language public service channel of Radio Algérienne, founded in 1926 as Radio PTT Alger during the French colonial era and nationalised after independence in 1962. It is one of three main national chains alongside Chaîne 1 (Arabic) and Chaîne 2 (Berber/Tamazight). Editorial line follows official state positions; the station has been a subject of debate over press freedom in Algeria but remains a major source of news for francophone Algerians and the diaspora. Distributed on FM nationally and via web stream.
