  notes: Hitradio antenne 1 is the commercial Hot AC station for central and north-eastern Baden-Württemberg, headquartered in the Stuttgart Pressehaus and broadcasting on 101.3 MHz Stuttgart plus DAB+. Founded 1989 (full programme since 1994), it is owned by Antenne Radio GmbH & Co. KG with Südwestdeutsche Medien Holding as main shareholder. Programming is current hits with the weekday morning show 'Die Wachmacher'. This stream (a1stg, ICY name 'antenne 1 Stuttgart') is the same main Stuttgart feed as the existing canonical entry.
