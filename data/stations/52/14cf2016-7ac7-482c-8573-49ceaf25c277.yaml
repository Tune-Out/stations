  affiliations: none formal; historically regarded as broadly pan-Blue/KMT-leaning in editorial tone, though privately owned and not party-controlled
  audience: Taiwanese (Mandarin-speaking) adults across Taiwan interested in news, politics, finance and call-in talk
  format: 24-hour Mandarin-language news/talk — hourly news bulletins, political commentary, financial markets, traffic, and current-affairs call-in shows
  notes: Taiwan's first 24-hour all-news radio network, founded in 1996 by media entrepreneur Chao Shao-kang (趙少康) alongside UFO Radio (飛碟電台); broadcasts on FM 98.1 MHz in Taipei with affiliate stations covering most of Taiwan; long associated with Chao's prominent role as a KMT politician-turned-broadcaster, though the station itself stresses news independence; notable hosts have included Chen Feng-hsin (陳鳳馨), Hsiao Hsu-tsen and other veteran political commentators; ownership shifted in the 2010s when the network was sold by Chao's group to Tina Records (滾石), and later changes have continued; widely cited as one of Taiwan's most influential talk-radio brands.
