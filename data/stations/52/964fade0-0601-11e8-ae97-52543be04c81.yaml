  notes: Retro FM is a national Russian commercial station owned by European Media Group (EMG), launched on 14 February 1996 as Radio Retro and rebranded on 29 May 2003. It broadcasts on 88.3 FM in Moscow and 88.0 FM in Saint Petersburg and through about 280 transmitters reaching more than 1,800 Russian localities plus relays in ten other countries. The gold format mixes 1970s-1990s hits at roughly 65% Western to 35% Russian for a 35-65 audience, with about 9 million daily and 20 million weekly listeners, ranking around fifth nationally. Signature shows include the morning Pervaya Smena, the request programme Felichita and Vecherinka Retro FM; the station stages the annual Legendy Retro FM arena festival.
