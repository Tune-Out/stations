  notes: Classic Vinyl HD is one of six internet-only channels run by WALM Radio ("We All Love Music"), a US online service geo-tagged to New York that also streams Contemporary Christian, Traditional Christian & Classical, Christmas Vinyl, Jazz and Old Time Radio. The channel plays digitised vinyl-era recordings from roughly the 1930s to 1960s — big band, swing, crooners and orchestral pop — and promotes crystal-clear 24/7 HD streaming with 320 kbps MP3 and Opus feeds. The site discloses no owner, licence or funding model; there is no terrestrial signal. Its very large RadioBrowser vote count is out of proportion to its modest click count.
