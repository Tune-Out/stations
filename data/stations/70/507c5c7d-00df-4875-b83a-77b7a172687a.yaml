  notes: 'Radio Patriot is a Russian state-operated news and talk radio station focusing on politics, current affairs, and nationalist commentary. Name "Patriot" (Патриот) reflects explicit patriotic/nationalist editorial positioning. Hosted on Mixto.ru, a Russian state media platform. Programming emphasizes Russian political narratives and news commentary from pro-government perspective. Editorial flag: Live Icecast status on radio.mixto.ru:8001 (2026-09-02) shows the /patriot talk stream playing News Front audio (''news-front__grazhdanskaja-vojna-na-ukraine-mozhet-nachatsja...''). News Front is a Crimea-based pro-Kremlin disinformation outlet sanctioned by the US Treasury (2021) and the EU (2022). Radio Patriot is effectively a relay of that content.'
