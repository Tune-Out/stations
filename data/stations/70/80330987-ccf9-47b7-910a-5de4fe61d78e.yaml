  nature: commercial
  operator: privately held Mozambican broadcaster reviving the LM Radio brand; principal figure Chris Turner (formerly of South African LM Radio)
  affiliations: none known; carries the heritage of the historic Lourenço Marques Radio Club
  format: easy-listening / classic pop and rock "great songs of all time" with English- and Portuguese-language presentation
  audience: adult easy-listening fans in southern Mozambique (Maputo, Ressano Garcia, Ponta do Ouro) plus South African listeners via DStv Audio 891 and online
  notes: the name LM Radio recalls the legendary Lourenço Marques Radio that broadcast English-language pop into apartheid-era South Africa from Portuguese Mozambique from 1933 until it was nationalised after Mozambican independence in 1975 and re-branded Radio Maputo; the modern LM Radio brand was relaunched on the Internet in 2007 and then on 87.8 FM in Maputo, with simulcasts in South Africa via DStv channel 891; programming includes presenter shows, the LM Top 100 countdown and interview podcasts
  sources: https://lmradio.co.mz/, internal knowledge
