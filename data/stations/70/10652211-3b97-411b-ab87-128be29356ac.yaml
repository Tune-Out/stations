  nature: public broadcaster
  operator: Radio France (national public radio company; sole shareholder is the French State)
  affiliations: Radio France group (alongside France Inter, France Info, France Bleu, France Musique, FIP, Mouv'); EBU; funded by the French state after the 2022 abolition of the redevance audiovisuelle
  audience: French-speaking adults nationwide and worldwide via DAB+/online; highly educated/cultural audience often described as CSP+ (cadres supérieurs)
  format: High-end cultural and intellectual talk radio — humanities, sciences, history, philosophy, literature, documentary, drama, fiction, debate; minimal music
  notes: France Culture traces its lineage to the post-war Programme National and the cultural channel "France III Nationale," taking its current name in 1963 as one of the three programmes of ORTF before being attached to Radio France at its 1975 creation. Flagship programmes include the morning news magazine "Les Matins de France Culture," the long-running history series "La Fabrique de l'Histoire" / "Le Cours de l'histoire," "La Méthode scientifique," philosophy programmes formerly hosted by Adèle Van Reeth ("Les Chemins de la philosophie"), and award-winning radio drama and documentaries from the Atelier de Création Radiophonique tradition. The station is editorially independent under French public-service law overseen by Arcom (formerly CSA) and is one of France's most-honoured cultural broadcasters, broadcasting from the Maison de la Radio in the 16th arrondissement of Paris.
  sources: internal knowledge only
