  nature: non-commercial
  operator: Radio Paradise, Inc. — founded and operated by Bill Goldsmith and Rebecca Goldsmith, based in Paradise, California
  affiliations: Independent; no parent corporation, no governmental, religious, or political affiliation. Funded by voluntary listener donations and merchandise; no advertising.
  audience: Adult international audience (English-language) who enjoy eclectic, hand-curated music; significant followings in North America and Europe (this stream serves the EU mirror)
  format: Self-described as "an eclectic musical adventure" / "DJ-mixed eclectic commercial-free Internet radio" — a hand-curated blend of rock, classic rock, indie, electronic, blues, jazz, world music and other genres mixed by the founders. Multiple themed mixes (Main, Mellow, Rock, Global, Serenity, Beyond) available.
  notes: One of the longest-running and most-respected listener-supported internet radio stations, on the air since 2000. Known for high-bitrate streams (up to FLAC lossless), no advertising, no algorithmic playlists, and strong community engagement. Operated from the small town of Paradise, CA (the streaming hub geo-tagged to Humboldt County reflects EU-mirror infrastructure). Survived the 2018 Camp Fire that destroyed much of Paradise.
  sources: https://radioparadise.com/
