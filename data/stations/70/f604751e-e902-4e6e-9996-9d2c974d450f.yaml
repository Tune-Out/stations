  notes: Q104.3 (legal callsign WAXQ-FM, 104.3 MHz from Empire State Building) is New York City's heritage classic-rock station, owned by iHeartMedia. The station traces back to the 1940s as WTFM, became Q104.3 in 1996, and has been classic-rock since 1998 after a period as smooth-jazz "CD104.3". Long-time on-air talent has included Jim Kerr (mornings, formerly of WPLJ), Maria Milito, Ken Dashow ("Get the Led Out"), Q Morning Show with Jim Kerr & Shelli Sonstein, and weekend specialty shows like "Breakfast With The Beatles" and "Off The Record". Famous for the annual "Top 1043 Classic Rock Countdown" Memorial Day weekend, the "Out of the Box" interview series featured in the WAXQ studios, and big-venue concert promotions at Madison Square Garden and PNC Bank Arts Center. iHeartMedia (rebranded from Clear Channel in 2014) is the largest US radio operator with 850+ stations; the network monetises Q104.3 through advertising, the iHeartRadio streaming platform and live-event sponsorship. The station has no political or religious affiliation and operates under FCC commercial broadcast licensing.
  sources: internal knowledge of WAXQ-FM and iHeartMedia
