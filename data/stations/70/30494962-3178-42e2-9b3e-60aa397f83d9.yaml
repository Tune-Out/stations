  operator: RAI - Radiotelevisione Italiana S.p.A. (Italian state-owned public service broadcaster)
  affiliations: Italian state (RAI is owned ~99.56% by the Italian Ministry of Economy and Finance, with board members appointed via parliamentary committee and government); EBU member; no religious or party-political affiliation, though RAI has historically been subject to political "lottizzazione" (party-aligned division of editorial influence) in Italy
  audience: Italian-language sports fans nationwide
  format: Live sports event coverage, sports talk, results, commentary and analysis — particularly football (Serie A), motorsports, cycling and major events (Olympics, World Cup, Giro d'Italia)
  notes: Webradio stream of Rai Radio 1 Sport (also branded "Radio 1 Sport" / "Rai Radio 1 Sport"), distributed via the RaiPlay Sound platform; operates as a sports-dedicated extension of Rai Radio 1 within RAI's nine-channel radio division and replaced the earlier Rai Radio Sport / Rai GR Parlamento sport carve-outs; provides live commentary ("radiocronache") of major football matches and other Italian sporting events including the historic Tutto il calcio minuto per minuto format; funded by Italy's "canone RAI" licence fee plus advertising; RAI was founded in 1924 as URI and has been a public-service broadcaster since 1954.
