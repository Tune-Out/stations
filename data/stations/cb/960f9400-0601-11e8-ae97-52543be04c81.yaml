  notes: Polskie Radio RDC (Radio dla Ciebie) is the regional public radio station for Warsaw and the Masovian Voivodeship, one of the 17 regional companies of Polish public radio, broadcasting on 101 MHz FM in Warsaw plus regional transmitters and DAB+. Its roots go back to 15 January 1935. Programming is a generalist regional service with hourly news from 6:00 to 23:00, current affairs, culture, sport and reporting from correspondents in five Mazovian cities. Like other Polish public media companies it was formally placed in liquidation on 29 December 2023 during the government's restructuring of public media, but it continues to broadcast under a liquidator who also serves as editor-in-chief. It is regional, not a national channel as the earlier notes stated.
