  audience: Adults 30+ in metropolitan São Paulo and across Brazil via the affiliate network and streaming, with strong appeal to listeners who grew up on Anglo-American pop/AOR of the 1970s-90s
  format: Adult Contemporary / flashback - Brazilian and international soft-rock, pop and ballad classics from the 70s, 80s, 90s and 2000s in Portuguese-language presentation
  notes: Rádio Antena 1 launched in São Paulo on 14 July 1989 on 94.7 MHz FM and pioneered the "lite" / soft-AC format in Brazil, building a national franchise via affiliates in cities such as Rio de Janeiro (103.7 FM), Belo Horizonte, Curitiba, Brasília and Florianópolis; the network promotes itself as "A rádio online mais ouvida do Brasil" (Brazil's most-listened-to online radio) and emphasises smooth Anglo-American AC and Brazilian flashback music with minimal talk between songs; the brand operates web streams, smart-speaker skills and the multi-platform Antena 1 app; not related to Portugal's RTP Antena 1 public station despite the similar name.
