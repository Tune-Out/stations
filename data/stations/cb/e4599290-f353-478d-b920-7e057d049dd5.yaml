  affiliations: Operates within the regulatory framework of mainland Chinese broadcasting (and a Hong Kong arm at asiafm.hk); no party, religious or state-broadcaster affiliation publicly disclosed but content is subject to PRC media oversight
  audience: Chinese-speaking music listeners across Greater China and Asian diaspora; aimed at urban, music-oriented audiences
  format: HD ("高清") music channel within the AsiaFM family; HiFi-quality 192 kbps streaming of mixed Chinese pop, international pop and contemporary music
  notes: AsiaFM 高清音乐台 (AsiaFM HD Music Station) is one of four channels in the AsiaFM network, alongside AsiaFM 亚洲音乐台 (mainstream pop), AsiaFM 亚洲天空台 (Western pop) and AsiaFM 亚洲经典台 (classics); the network markets itself as having "the highest online listening rates among music radio apps" in Chinese-speaking regions; it is a private commercial digital broadcaster rather than a state-run station like CRI or CNR, although all PRC-based broadcasters operate under SARFT/NRTA oversight.
