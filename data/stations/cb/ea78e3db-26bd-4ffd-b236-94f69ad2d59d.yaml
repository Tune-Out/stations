  operator: Société Mosaïque FM (private Tunisian company; founder Belhassen Trabelsi until 2011)
  affiliations: none known (post-revolution independent); previously linked to Trabelsi family of Ben Ali in-laws
  audience: Tunisian general public, primarily young and adult listeners in Tunisian Arabic and French
  format: General-interest commercial FM with news, talk, call-ins, sports and a wide music mix (Arabic pop, Western, classical and oriental). The "classical" tag in this record is misleading.
  notes: Mosaïque FM launched 7 November 2003 as Tunisia's first private commercial radio station, breaking the state monopoly held by Radio Tunisienne. It was originally owned by Belhassen Trabelsi, brother of former first lady Leïla Ben Ali. After the 2011 Tunisian Revolution the state seized Trabelsi's stake and the station was restructured; it has since become one of Tunisia's most-listened-to stations and a major news source during the Arab Spring period.
  sources: internal knowledge only
