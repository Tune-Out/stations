  nature: religious
  operator: Radio Maria India, the Indian affiliate of the World Family of Radio Maria (Associazione Mondiale Radio Maria), headquartered in Erba, Italy
  affiliations: Roman Catholic Church; lay-led Catholic broadcasting movement; financed entirely by listener donations, no commercial advertising
  audience: Indian Catholics (approx. 20 million in India, primarily concentrated in Kerala, Goa, Tamil Nadu, and the Northeast)
  format: Catholic religious programming including rosary, holy mass, catechesis, gospel reflections, music, and family/social topics in multiple Indian languages
  notes: Founded as part of the global Radio Maria network started in Arcellasco d'Erba, Italy in 1983 and now broadcasting in over 80 countries; Radio Maria India launched in the 2010s to serve Indian Catholic communities; non-profit and explicitly non-political, focused on evangelization and prayer; the global network's stated mission is "to communicate God's word to all peoples" and to be "a voice of Christian presence in society"; operates without state subsidy; in some countries Radio Maria has faced controversies over conservative Catholic social positions but the network is officially aligned with the Vatican.
