  notes: Rádio Beat is a nationwide Czech classic-rock commercial radio station broadcasting on 80+ FM frequencies including Prague 95.3, Brno 91.0 and Ostrava 90.4; launched in 2008 as part of the Lagardère Active / Radio United group portfolio and later transitioned into the Media Club s.r.o. operation that also runs Kiss Radio, Country Radio and the Frekvence 1 / Evropa 2 sales relationship; programming centers on Czech "bigbít" (a domestic 1960s rock movement that persisted under Communist censorship as a form of cultural resistance) and Anglo-American classic rock heritage, with shows like "Krásné nálezy" (Beautiful Finds) curating rock back-catalog deep cuts; the station also runs a "Beat shop" merchandise store, promotes concerts, and publishes the "Beatová rozhledna" weekly rock newsletter.
