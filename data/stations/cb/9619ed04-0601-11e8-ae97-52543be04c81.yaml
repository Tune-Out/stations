  notes: Virgin Radio Rock '80 is a themed web-radio channel of Virgin Radio Italia, operated by RadioMediaset, the radio division of Mediaset/MFE-MediaForEurope, under licence from Virgin Enterprises Limited. It runs an automated rotation of 1980s rock — U2, Bon Jovi, Guns N' Roses, Van Halen, Dire Straits and similar — with no presenters, alongside sibling decade and artist channels such as Rock '70, Rock '90, Rock Ballads and the Rockstar series. RadioMediaset also operates R101, Radio 105 and Radio Monte Carlo. The channel is advertising-funded and streams via unitedradio.it. The catalog's stored homepage path now returns HTTP 404; the channel is reachable through the Virgin Radio Italia web-radio index instead.
