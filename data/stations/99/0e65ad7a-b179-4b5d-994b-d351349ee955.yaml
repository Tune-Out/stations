  operator: Talpa Network B.V. (privately held Dutch media group founded by John de Mol Jr.); operated through Talpa Radio.
  affiliations: No religious, governmental or party-political affiliations; commercial broadcaster funded by advertising; regulated by the Dutch Commissariaat voor de Media (CvdM) and frequencies allocated by Agentschap Telecom.
  audience: Dutch-speaking adults across the Netherlands (target demographic broadly 40-65); fans of classic pop/rock from the 1960s, 70s and 80s and Dutch golden-oldies music.
  format: Classic hits / oldies music format featuring 1960s-1980s pop, rock and Nederpop, with personality-driven daytime presenter shows and themed retro programming.
  notes: Radio Veronica traces its origins to the pioneering pirate offshore broadcaster Radio Veronica (Vrije Radio Omroep Nederland), which broadcast from the ship "Borkum Riff" and later "Norderney" from 1960 until 31 August 1974, when new Dutch anti-pirate legislation forced it off the air. The Veronica name continued as a legal public broadcaster (VOO) within the Dutch public system from 1976 until it left for commercial television/radio in 1995. The current Radio Veronica re-emerged as a commercial FM station and was eventually acquired by John de Mol's Talpa group, which now operates a portfolio of national Dutch commercial radio brands (Radio 538, Sky Radio, Radio 10 and Veronica). The station broadcasts on FM, DAB+ and online, and is positioned as the "rock-and-pop" oldies brand in the Talpa Radio family. Notable past presenters and themes include the long-running "Top 1000 Allertijden" and tributes to the offshore pirate-radio heritage celebrated each summer.
