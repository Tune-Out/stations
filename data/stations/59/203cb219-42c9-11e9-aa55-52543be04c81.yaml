  notes: Launched in 1985 under the Reagan administration and named after Cuban independence hero José Martí, Radio Martí is broadcast from Miami via shortwave, medium wave and online to bypass the Cuban government's media monopoly; long criticized by Havana as U.S. propaganda and historically jammed by Cuba, the station has also faced U.S. congressional scrutiny over editorial standards and antisemitic content (notably a 2018 OCB scandal that led to staff dismissals); funded by U.S. taxpayers through annual congressional appropriations to USAGM.
