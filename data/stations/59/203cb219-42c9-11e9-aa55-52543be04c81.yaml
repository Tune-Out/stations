  notes: Radio Martí is a Spanish-language service of the U.S. Agency for Global Media, produced in Miami by the Office of Cuba Broadcasting and aimed at listeners in Cuba. It launched on 20 May 1985 under the Reagan administration, was joined by TV Martí in 1990, and broadcasts around the clock on shortwave from Greenville, North Carolina and medium wave from Marathon, Florida as well as online. Programming is news, current affairs and features intended to bypass the Cuban government's media monopoly; Cuban jamming keeps measured reach inside Cuba below a few percent. The service was briefly shut down in March 2025 when an executive order dismantled the Office of Cuba Broadcasting, but staff returned within two weeks and broadcasting resumed. It has drawn criticism for editorialising, and a 2018 incident over antisemitic content attacking George Soros led to staff being placed on leave.
