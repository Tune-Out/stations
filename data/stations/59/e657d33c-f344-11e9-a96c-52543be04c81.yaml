  notes: Los 40 (rebranded from "Los 40 Principales" in 2015) is Spain's largest top-40 commercial radio brand, launched in 1966 within Cadena SER; Los 40 Catalunya is the regional version broadcast on FM frequencies across Catalonia (notably 93.9 MHz in Barcelona) with local programming, news and shows in Catalan alongside the national chart programming; the network is owned and operated by Cadena SER under PRISA Radio, the radio division of multimedia group PRISA, which also owns El País and Cadena SER itself.
