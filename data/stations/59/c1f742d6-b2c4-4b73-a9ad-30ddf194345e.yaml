  nature: public broadcaster
  operator: Český rozhlas (ČRo), the Czech Republic's national public-service radio broadcaster, established by Act 484/1991 Coll.
  affiliations: Member of the European Broadcasting Union (EBU); funded by mandatory radio licence fees and supervised by the Council of Czech Radio elected by the Chamber of Deputies; no party, religious or commercial affiliation
  audience: Sports fans across the Czech Republic, Czech-language listeners
  format: 24-hour sports news, live commentary, sports talk and Radiožurnál news rebroadcasts (a side-channel/spin-off of the main ČRo Radiožurnál news station, activated for major sporting events such as Olympics, World Cups and Czech football/hockey leagues)
  notes: Radiožurnál Sport is a digital-only special station from Český rozhlas, the country's oldest broadcaster (founded 1923 as Radiojournal, making Czechoslovakia the second country in Europe with regular radio broadcasting); the sport stream serves as overflow coverage so that the main Radiožurnál news service can continue normal programming when multiple sporting events run simultaneously; available via DAB+, online and the iRadio app
