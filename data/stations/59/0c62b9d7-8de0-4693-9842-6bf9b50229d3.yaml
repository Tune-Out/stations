  nature: public broadcaster
  operator: NPO (Nederlandse Publieke Omroep), the Dutch national public broadcasting foundation; the channel is produced collaboratively by member broadcasters BNNVARA, KRO-NCRV and PowNed
  affiliations: Funded by the Dutch state via the Ministry of Education, Culture and Science under the Media Act 2008; member of the European Broadcasting Union (EBU); not party-political, though KRO-NCRV has historical Catholic/Protestant roots and BNNVARA has historical progressive/social-democratic roots
  audience: Dutch youth and young adult audience (broadly 20-39); Dutch-language presentation but heavily international pop, rock and dance repertoire
  format: Contemporary hit / alternative pop music network with live DJ shows, charity drives and emerging-artist promotion; slogan "We Want More"
  notes: Launched in 1965 as "Hilversum 3" and renamed Radio 3 (1985) then 3FM (1995); the station became famous for the annual "Serious Request" / "Glass House" charity broadcast for the Red Cross (2004-2017), which moved formats after a 2018 revamp; notable strands include "3voor12 Radio" (long-running alternative/indie show), "De Verlanglijst" and the "3FM Talent" / "3FM Megahit" rotations promoting Dutch artists; sister channels in the NPO Radio family include Radio 1 (news/sport), Radio 2 (AC/adult pop), Radio 4 (classical), Radio 5 (oldies/spoken) and FunX (urban/youth)
  sources: https://www.npo3fm.nl/, internal knowledge of NPO and the Dutch public broadcasting system
