  operator: Grupo O Dia / Rede FM O Dia, a Brazilian commercial radio network with affiliates in Rio de Janeiro, Macaé, Belém, Manaus, Resende, and Vitória.
  affiliations: none known; commercial Brazilian media group historically linked with the O Dia newspaper brand
  audience: General Brazilian listeners in Macaé and surrounding northern Rio de Janeiro state (oil-industry coastal region); Portuguese (Brazilian) language.
  format: Popular Brazilian music – samba, pagode, sertanejo, MPB, axé and pop hits – mixed with celebrity/entertainment news ("Holofote"), local community announcements ("Se liga na FM O Dia"), and music releases; tagline "Alegria que irradia" ("Joy that radiates").
  notes: Broadcasts on 99.7 MHz FM from Av. Rui Barbosa 749, Centro, Macaé/RJ, serving the petroleum-economy city of Macaé; part of the FM O Dia commercial network whose Rio flagship 100.5 FM is one of the city's leading popular-music stations; engages listeners via Instagram, Twitter, and TikTok and runs branded events such as "Festival da Alegria" and "Semana Maluca."
