  format: Flagship public-service general-interest station with news, talk, culture, drama and music.
  notes: Polskie Radio Program 1 ("Jedynka") is the oldest and flagship channel of Polish public radio, with origins tracing to 1925 when Polskie Radio first went on the air; broadcasts nationwide on FM, long wave (historically) and DAB+. Programming includes the morning news magazine "Sygnały Dnia," "Cztery Pory Roku," "Lektury Jedynki" and the Teatr Polskiego Radia (Polish Radio Theatre) drama tradition. Like other Polskie Radio channels it has been the subject of political controversy over editorial independence under successive governments, particularly after the 2015–2023 PiS government's media-law changes and the 2024 leadership replacements by the Tusk government.
