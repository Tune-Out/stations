  notes: ABC Classic 2 is the digital-only sister station of ABC Classic, run by the Australian Broadcasting Corporation, Australia's national public broadcaster. Launched on 1 June 2014, it plays popular classical repertoire performed exclusively by Australian orchestras, ensembles and soloists, favouring short movements and excerpts by day and complete longer works overnight (midnight to 6 am), a block also simulcast on ABC Classic. It is presenter-light, carries no advertising and is available through ABC listen and DAB+ in some markets.
