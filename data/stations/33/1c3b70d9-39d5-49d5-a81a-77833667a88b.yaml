  notes: I-Radio launched in Jakarta in 2001 on 89.6 FM (later 101.4 FM) as the flagship of an MRA Media network spanning Jakarta, Bandung, Yogyakarta, Semarang, Surabaya, Medan, Makassar and Banjarmasin; its slogan "100% Musik Indonesia" makes it one of the few commercial FMs to play exclusively domestic music, supporting the local industry; notable on-air properties include "Teror" (prank calls), "Klinik Keuangan" and "Indonesia 20"; the network was relaunched/refreshed under the iSWARA brand around 2023–2024.
