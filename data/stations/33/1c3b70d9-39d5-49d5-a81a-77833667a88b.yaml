  notes: This is the Jakarta station of MRA Media's Indonesian-music network, which rebranded from i-Radio to iSWARA FM in late February 2025 and now trades under the slogan "Suara Warga Indonesia". The Jakarta outlet broadcasts on 101.4 FM (call sign PM2FGE) from a frequency whose lineage runs Radio Suara Kejayaan (1971), MTV on Sky (2000), Trax FM (2005-2022) and i-Radio (2022-2025); the i-Radio brand itself began in 2001 at 89.6 FM. The network covers nine cities — Jakarta, Bandung 105.1, Yogyakarta 88.7, Semarang, Surabaya, Medan 98.3, Palembang, Makassar 96.0 and Banjarmasin 90.1 — and keeps its defining "100% musik Indonesia" policy, pairing domestic pop with talk, comedy and lifestyle segments. The old iradiofm.com address now redirects to iswaranetwork.com.
