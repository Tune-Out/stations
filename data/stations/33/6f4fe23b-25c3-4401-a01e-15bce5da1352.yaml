  notes: P7 Klem is a national commercial radio channel operated from Lillehammer by P4 Radio Hele Norge AS, one of Norway's two large commercial radio groups (alongside Bauer's Radio Norge family); P4 was historically owned by Sweden's MTG/Viaplay Group and in 2024 was acquired by Bauer Media Group as part of Bauer's expansion in Scandinavia; P7 Klem positions itself as a softer-music sister channel to flagship P4 with the slogan "Lyden av Norge" (The Sound of Norway) and is distributed via DAB+ nationally and online; the morning show "God morgen med Ellen og Kjetil" is among its anchor programmes.
