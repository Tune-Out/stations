  notes: ROCK FM is a Moscow commercial rock station on 95.2 FM, owned by ZAO Multimedia Holding alongside Nashe Radio, Radio Jazz and Radio Ultra. It launched on 27 April 2007 as Klassicheskoye Radio, became Radio 95.2 FM in 2008 and took the Rock FM name in March 2010. The playlist is almost exclusively Western rock from the 1960s to today, roughly 80-85% classic rock of the 1970s-1990s, with programmes such as Rock Calendar, Rock City and Boris Grebenshchikov's Aeronaut, plus Kvartirnik ROCK FM live sessions. It relays to a handful of other Russian cities and via Tricolor satellite, and runs themed online sub-streams (70s, 80s, 90s, 00s, heavy, progressive).
