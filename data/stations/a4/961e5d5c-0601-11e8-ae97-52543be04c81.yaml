  notes: KXLU 88.9 FM is the non-commercial student-run station of Loyola Marymount University in Los Angeles, on air since 1958 and staffed by volunteer DJs. It runs a freeform format with dedicated specialty blocks — underground rock, punk, hip-hop, jazz, Latin alternative and experimental music — and is one of the best-regarded college stations in Southern California for breaking independent artists and covering the local scene. It is funded by the university plus listener fund drives and carries no advertising.
