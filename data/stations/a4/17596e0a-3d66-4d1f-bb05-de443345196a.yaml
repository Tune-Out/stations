  notes: Love Radio 97.5 FM is an Athens-based commercial radio station owned by Love Radio S.A., broadcasting an 80s/90s nostalgia hits format on FM with notable shows like "Full in Love Breakfast." The station operates several web-only sub-channels including "Love Trap" (trap/hip-hop), "Love Lounge," and others to extend its brand to younger and more genre-specific online audiences. Greek trap exploded as a youth genre in the late 2010s, dominating Greek music charts and streaming; Love Trap targets that audience. The stream is delivered via Radiojar (a Greek-founded cloud-radio platform).
