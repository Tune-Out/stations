  notes: Europa Plus is a Russian commercial hit-music network launched in Moscow on 30 April 1990 as the first non-state commercial radio station in the USSR, conceived by French entrepreneur Georges Polinski with Europe 1. It broadcasts on 106.2 FM in Moscow and in hundreds of cities across Russia and former Soviet states and is owned by European Media Group (EMG), Russia's largest radio holding, which also runs Dorozhnoe Radio and Retro FM. The format is mainstream Western and Russian pop, dance and house with flagship charts EuroHit Top 40 and Top Club Chart and the annual Europa Plus Live festival. It is a purely music-oriented station with no news or political programming.
