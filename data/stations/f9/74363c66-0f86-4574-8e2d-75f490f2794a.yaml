  operator: RTBF (Radio-Télévision belge de la Communauté française) — the public-service broadcaster of the French Community of Belgium
  affiliations: Public-service broadcaster funded by a dotation from the Fédération Wallonie-Bruxelles; EBU member; editorial independence guaranteed by management contract with the French Community government
  audience: Adult French-speaking Belgians (Wallonia and Brussels); upmarket news, culture and current-affairs listener
  format: News, current affairs, culture, debate and societal "décryptage" — RTBF's flagship talk/info network
  notes: La Première is RTBF's main spoken-word/news radio channel, descendant of the RTB première chaîne created in 1960 and rebranded across the decades (Radio 1, Bruxelles Capitale, La Première in its current shape since the early 2000s); broadcasts via FM and DAB+ across Wallonia and Brussels and worldwide via stream; flagship programming includes Matin Première (morning news), Déclic, QR (Question-Réponse), Investigation, Inside and the Faky fact-checking unit; describes its mission as "Information, culture, magazine, décryptage et débat de société"; has been at the centre of periodic Belgian debates over the public broadcaster's licence-fee/dotation model and political balance.
