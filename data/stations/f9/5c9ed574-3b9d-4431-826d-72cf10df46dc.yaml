  notes: NPO Radio 1 is one of the principal national radio channels of the Dutch public broadcasting system, traceable to the post-war Hilversum 1 channel; its slogan "Wie luistert, weet meer" ("Those who listen know more") underscores its informational mission; carries flagship news programmes including NOS Radio 1 Journaal, Dit is de Dag, Nooit Meer Slapen, and Eredivisie football coverage; operates as a "net" shared between the pluralistic Dutch broadcasting associations, each producing content reflecting different cultural/political traditions while the channel itself remains editorially independent from any single party or religious group.
