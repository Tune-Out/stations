  notes: La Grosse Radio is a French non-profit association founded in 2003 that operates three webradios (Rock, Metal, Reggae) and three associated webzines, all free, independent and ad-light. The site declares itself "3 webradios et 3 webzines gratuits, militants et 100% indépendants" and says the association "milite pour la cause des artistes indés et autoproduits sur ses radios en ligne et ses webzines." It covers major French and European festivals (Hellfest, Wacken, etc.) and is run by volunteer journalists and music enthusiasts.
