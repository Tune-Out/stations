  notes: La Grosse Radio is a French loi-1901 non-profit association founded in 2003 that runs three free web radios — Rock, Métal and Reggae — alongside three matching webzines. The Métal channel is a 192 kbps stream devoted to metal in its many forms, programmed by volunteer journalists and music writers rather than by playlist software. The association describes itself as 'militant and 100% independent' and campaigns for independent and self-produced artists, giving unsigned bands airplay alongside established acts. Its editorial side covers album reviews, interviews and reporting from major French and European festivals including Hellfest and Wacken. The stream on hd.lagrosseradio.info is live.
