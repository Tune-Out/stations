  notes: Space Station Soma is one of the longest-running channels of SomaFM, the San Francisco-based, listener-supported, commercial-free internet radio network founded by Rusty Hodge in February 2000. SomaFM runs roughly 40 hand-curated channels funded entirely by donations and merchandise, with no advertising. Space Station Soma programs analog-inspired ambient and downtempo electronica from the 1990s to the present and is available in AAC and MP3 at several bitrates. SomaFM nearly closed in 2002 over webcast royalty rulings before the Small Webcaster Settlement Act allowed it to continue.
