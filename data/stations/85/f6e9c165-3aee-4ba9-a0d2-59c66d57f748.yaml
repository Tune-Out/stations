  nature: public broadcaster
  operator: Radio France (FIP - France Inter Paris)
  affiliations: French public service broadcasting (Radio France), funded historically by license fee (redevance audiovisuelle, abolished 2022) and now via state budget allocation.
  audience: French-speaking adults; eclectic music lovers; nationwide France via FM/DAB+ and worldwide via web stream.
  format: One of FIP's eight digital webradio sub-channels, dedicated to "tout nouveau" (brand-new) music releases across all genres - jazz, rock, world, electronic, classical, chanson.
  notes: FIP was founded in 1971 as "France Inter Paris" and is famous for its eclectic, commercial-free, mostly music-only format with minimal voice intervention from its iconic female-only presenters known as "les fipettes". "Tout Nouveau, Tout Fip" is one of FIP's themed webradio streams curated by the FIP music team to spotlight new releases; part of the seven thematic web-only sub-stations launched alongside the main FIP service.
  sources: internal knowledge only
