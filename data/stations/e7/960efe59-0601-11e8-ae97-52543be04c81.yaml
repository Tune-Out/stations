  notes: Fun rádio is Slovakia's oldest private commercial radio station, on air since 10 June 1990, months after the Velvet Revolution. It is licensed to Radio, a.s. and run within Radio Group, whose sole shareholder is the Slovak politician and businessman Boris Kollár; the group also owns Rádio Vlna, acquired in October 2021. The format is Contemporary Hit Radio with a Hot AC crossover aimed at 20-45 year olds, mixing current chart hits with recent decades, plus news and traffic. It reaches the whole country from 23 FM transmitters, including 94.3 MHz in Bratislava and 87.7 MHz in Košice, and ranked second nationally in 2025 listener surveys. Saturday evenings carry "Get Fun", an unpresented dance-music block, and the station also runs the Fun Radio Dance, 80-90 and Chill spin-off streams.
