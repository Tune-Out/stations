  operator: Radio Rozana (Rozana Association - French non-profit association based in Paris)
  affiliations: independent Syrian opposition-aligned media; historically funded by European/French donors (French government via CFI/MEAE, EU, and various democracy/press-freedom NGOs)
  audience: Syrians inside Syria and in the diaspora; Arabic language with focus on civic and human-rights content
  format: News, current affairs, civil-society talk shows, citizen journalism, women's and youth programmes, and music
  notes: Radio Rozana was founded in 2013 in Paris by Syrian journalists during the Syrian civil war as an independent Arabic-language broadcaster operating in exile, established as a French non-profit association (Association loi 1901); it broadcasts via internet and shortwave/FM relays into Syria and produces investigative, civil-society, and women's-rights programming as part of the Syrian independent media sector that emerged after 2011; positions itself as an independent, professional, non-partisan voice critical of the Assad government and serving Syrian audiences cut off from state media; has received funding and support from CFI (Canal France International), the European Union, IMS (International Media Support), and other press-freedom donors; recognised within the network of Syrian exile media alongside outlets such as SMART News Agency, Enab Baladi, and Syria Direct.
