  format: 24/7 instrumental dark techno — a sub-genre of techno characterised by minor-key, atmospheric, industrial-tinged tracks; one of many specialist Radio Caprice channels
  notes: Radio Caprice (Радио Каприз) is a Russian-based internet-radio project founded in the early 2000s that runs an extensive bouquet of single-genre 24/7 streams covering classical, jazz, electronic, metal, folk, and many niche sub-genres; the Dark Techno channel is one of its electronic-music streams alongside others such as Techno, Minimal Techno, Detroit Techno, and Dark Ambient; the network plays primarily uninterrupted music with no DJs or talk content and is funded through donations rather than advertising; it is widely catalogued on internet-radio directories such as Radio-Browser and SHOUTcast.
