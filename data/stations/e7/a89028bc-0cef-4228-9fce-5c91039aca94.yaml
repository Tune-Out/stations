  notes: Radio Capital is one of Italy's major commercial radio stations, established in 1976 in Milan. The station is known for its pop/rock music format and has maintained significant listener loyalty across Italy. Radio Capital is part of GEDI Gruppo Editoriale (formerly Gruppo Editoriale L'Espresso), a major Italian media group that also owns La Repubblica newspaper and several other radio and television properties. The station broadcasts on FM in major Italian cities and streams nationally via HLS format. Capital.it serves as the station's website with news, music information and streaming. The station maintains an active social media presence and runs regular on-air promotions and listener contests. No known significant controversies or regulatory issues beyond normal commercial radio operations.
