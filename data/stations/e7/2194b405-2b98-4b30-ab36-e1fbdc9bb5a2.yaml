  nature: public broadcaster
  operator: Mitteldeutscher Rundfunk (MDR) — public-law broadcaster for Saxony, Saxony-Anhalt and Thuringia, member of the ARD network
  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten); editorially independent under German public-broadcasting law; funded via the Rundfunkbeitrag household licence fee; supervised by a Rundfunkrat with representatives from civil society
  audience: Adult listeners aged ~50+ in the Free State of Saxony (Dresden, Leipzig, Chemnitz, Bautzen, Görlitz); primarily German-speaking with some Sorbian programming for the Lusatian Sorb minority
  format: Regional full-service public radio — local and regional news ("Sachsenspiegel"-style bulletins), service, weather, traffic, talk and oldies music (Schlager and 1960s–1980s hits — hence the "70er / 80er / Oldies" tagging); the slogan-bearing "Heimatsender" ("home / hometown station") positioning emphasises Saxon identity, dialect features and regional culture
  notes: MDR Sachsen — Das Sachsenradio is the Saxony-specific channel of MDR's regional radio family (alongside MDR Sachsen-Anhalt and MDR Thüringen), launched after German reunification when MDR was founded in 1991 as the successor broadcaster for the new eastern federal states; broadcasts on FM, DAB+ and online with localised opt-out studios in Dresden (HQ), Leipzig, Chemnitz, Bautzen and Görlitz; carries dedicated Sorbian-language programming for the Sorb community in eastern Saxony; one of the most-listened-to regional stations in Saxony; as an ARD member it is bound by statutory impartiality and a public-service remit and is not commercial or party-political, though, like all ARD outlets, its governance and editorial choices are periodically debated in German media policy.
  sources: internal knowledge only
