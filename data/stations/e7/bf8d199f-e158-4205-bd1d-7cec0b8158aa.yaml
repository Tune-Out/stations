  operator: Pearl Group (Pearl FM Uganda Ltd.), Kampala
  affiliations: Islamic (Sunni) religious broadcaster; no formal party-political affiliation but content aligned with the Muslim community in Uganda
  audience: Ugandan Muslim listeners and the wider Luganda/English-speaking audience in Kampala and central Uganda
  format: Muslim news, talk and edutainment broadcaster with Islamic teachings (Dawah), Quranic recitation, religious lectures, community talk shows, charity/halal-business segments, and some music; tagline "Ekkula Ly'omuntu W'abulijjo" (Luganda)
  notes: 107.9 Pearl FM (also styled "Pearl of Africa Radio") launched in 2010 in Kampala, broadcasting 24 hours daily from studios at Plot 6B Berkeley Road, Old Kampala; it is licensed by the Uganda Communications Commission (UCC) and operates as a private Islamic-oriented station owned by the Pearl Group; programming centres on news, "Islamic values" and "uplifting edutainment" along with dedicated sections for Dawah, Charity, Halal Business and community events, mixing Luganda and English; the station is part of Uganda's broader landscape of faith-based FM broadcasters and uses the station mission line "Pearl FM brings you news, Islamic values, and uplifting edutainment - follow us and be part of the journey"; the "rock" genre tag in some aggregator listings appears to be a mistag and does not reflect actual programming.
