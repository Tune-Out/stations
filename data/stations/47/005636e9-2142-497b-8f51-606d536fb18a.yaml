research:
  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: Nederlandse Publieke Omroep (NPO) — the Dutch public broadcasting umbrella; NPO Radio 2's programming is contributed by member broadcasters AVROTROS, BNNVARA, EO, KRO-NCRV, MAX, NTR and VPRO
  affiliations: Publicly funded national broadcaster regulated by the Dutch Media Act; member organisations include faith-based (EO — Evangelische Omroep; KRO-NCRV — Catholic/Protestant roots) and politically-rooted (BNNVARA — socialist origin, VPRO — liberal/progressive) societies as part of the Dutch pillarised public-broadcasting tradition
  audience: Dutch-speaking adults (broadly 35-65); the most-listened-to public radio station in the Netherlands
  format: Adult-contemporary pop, rock and Dutch-language music with strong live-music focus; tagline "Er is maar één NPO Radio 2" ("There is only one NPO Radio 2"); flagship annual event is the NPO Radio 2 Top 2000 (the Netherlands' largest pop song poll, broadcast over Christmas week)
  notes: Launched as Hilversum 2 / Radio 2 in the 1940s reorganisation of Dutch public radio, the station has carried public-service music programming for decades. It is the station behind the iconic NPO Radio 2 Top 2000 since 1999, broadcast from "Het Glazen Huis" since 2014 in support of Serious Request/Glazen Huis charity drives. Funded by general taxation via the Dutch Media Act, governed by the NPO board, and editorially independent from government.
  sources: https://www.nporadio2.nl/, internal knowledge
