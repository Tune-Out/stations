  nature: public broadcaster
  operator: Radio Television of Serbia (Radio-televizija Srbije, RTS) — Serbia's national public broadcasting service.
  affiliations: State-funded public broadcaster financed via a mandatory broadcasting fee (RTS tax) on electricity bills; member of the European Broadcasting Union (EBU).
  audience: Serbian-speaking listeners aged roughly 20-45, focused on Belgrade and Serbia; also reaches Serbian diaspora online.
  format: Urban-youth music station emphasizing alternative, indie, rock, electronic and Serbian/regional pop-rock, plus cultural and lifestyle talk programming.
  notes: Launched 1969 as the youth-oriented "Beograd 202" — name refers to its original 202 m medium-wave frequency; long associated with breaking new Yugoslav rock acts (EKV, Idoli, Električni Orgazam) in the 1980s and remains one of RTS Radio Belgrade's three main channels (alongside Radio Belgrade 1 and 2); after the 2000 fall of Milošević, RTS underwent a major reform from state broadcaster into public service broadcaster, though it has periodically faced criticism for political bias toward the governing party.
