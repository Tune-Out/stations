  notes: Radio Beograd 202 is the fourth channel of Radio Belgrade, part of Serbian public broadcaster RTS, and began broadcasting on 27 June 1969 as a city station for Belgrade with music and short news; it went to all-day nationwide coverage on 1 May 1987 and airs on 104.4 MHz in Belgrade. Historically a youth station that broke Yugoslav new-wave and rock acts in the 1980s, it still programmes rock, alternative and regional pop-rock with shows such as Top lista 202 and Hit 202 plus cultural and lifestyle talk. RTS is funded by a mandatory fee on electricity bills and is an EBU member, though it has faced recurring criticism of pro-government bias.
