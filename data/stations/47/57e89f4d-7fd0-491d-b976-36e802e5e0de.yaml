  notes: Launched in 2001 as Sublime FM by Quality Channels, the station has traded hands several times — passing through ID&T, 100% NL/Radio Media Groep, Talpa Network and most recently Mediahuis Radio. It is the only national Dutch radio brand dedicated to soul, jazz and R&B, and broadcasts via DAB+, online stream and (since 2017) regional FM coverage in parts of the Randstad. The station is media partner of the North Sea Jazz Festival and runs the annual listener-voted "Sublime Soul Top 1000" countdown.
