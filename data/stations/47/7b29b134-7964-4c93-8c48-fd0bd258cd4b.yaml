  nature: public broadcaster
  operator: All India Radio (Akashvani) under Prasar Bharati, India's statutory autonomous public broadcaster
  affiliations: Government of India / Ministry of Information & Broadcasting (parent statutory body Prasar Bharati)
  audience: Bengali-speaking listeners in Kolkata, West Bengal and the wider Bengali diaspora; also reaches Bangladesh
  format: Bengali-language general entertainment, music (modern and classical), news, cultural programmes and talk
  notes: Akashvani Maitree ("Friendship") is AIR's Bengali external/cross-border service from Kolkata, established in 1984 to broadcast to West Bengal and Bangladesh; carries Rabindra Sangeet, Nazrul Geeti, folk and contemporary Bengali music, news bulletins and cultural features; Prasar Bharati was constituted in 1997 to give AIR/Doordarshan operational autonomy from direct government control though it remains state-funded.
