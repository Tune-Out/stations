  notes: Despite being filed under Algeria, this entry carries the Saudi Quran Radio feed. Its stream is radiojar mount 0tpy1h0kxtzuv, the same mount served under the canonical catalog row "Saudi Quran", whose homepage is the Saudi Broadcasting Authority's Al Oula live page for Idha'at al-Qur'an al-Karim. That service, broadcast from Mecca and run by the Saudi state broadcaster, carries recitation of the Quran, tafsir and religious lectures and is among the most widely relayed religious stations in the Arab world. The Icecast metadata on this particular edge host is generic ("Mini2's Broadcast"), so this is an unbranded relay rather than an official endpoint. Algeria has its own separate Radio Coran under Radio Algérienne, which is not what plays here.
