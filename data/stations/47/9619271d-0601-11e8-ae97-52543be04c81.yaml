  operator: Kane FM CIC / Kane FM community broadcaster (Ofcom-licensed community radio station)
  affiliations: none known; secular community-led broadcaster with social-inclusion mission for Surrey youth and urban-music communities
  audience: Young adults and urban-music fans in Guildford and Surrey, UK; broadcasts on 103.7 FM and online
  format: Underground urban and dance music — drum & bass, jungle, house, garage, hip-hop, reggae, soul, funk, breaks, techno, trance, and live DJ sets from local and guest selectors
  notes: Kane FM began life in the 1990s as a pirate radio station in Guildford, Surrey, broadcasting underground dance and urban music; it gained a full Ofcom community radio licence in the late 2000s and now broadcasts legally on 103.7 FM as a not-for-profit community radio service serving the Guildford / Surrey area; its programming is built around volunteer DJs and live shows covering the full spectrum of UK underground dance and bass music, and it has acted as a launchpad and platform for emerging UK drum & bass, dubstep, and grime artists; its community remit emphasises providing training and a platform for young people in the area.
