  notes: Left Coast 70s is one of the genre channels of SomaFM, the commercial-free, listener-supported internet broadcaster founded in San Francisco in 2000 by Rusty Hodge and run by SomaFM.com LLC. The channel is programmed by Hodge himself and focuses on the mellow, folk-influenced rock made in Los Angeles and along the West Coast in the late 1970s and very early 1980s, played by studio session musicians in the yacht-rock tradition. SomaFM runs over 30 channels funded entirely by listener donations, with no advertising, and offers this channel in 320k and 128k MP3 and 128k AAC variants. The catalog name carries a bitrate suffix; the official channel name is simply Left Coast 70s.
