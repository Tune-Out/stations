  notes: MANGORADIO is an independent German internet radio based in Mainz, streamed through the laut.fm user-generated-radio platform under the slogan "Wir sind deine Musik!". Its Impressum describes it as a private hobby project of Max Noll; a volunteer team produces shows, an audio library, local Wiesbaden/Mainz news and projects such as the "Green Radio Week". Programming is pop, charts, electro, dance and EDM with listener song requests. It holds no broadcast licence and is not a commercial company; its exceptionally large RadioBrowser vote count is atypical and likely reflects voting campaigns rather than audience size.
