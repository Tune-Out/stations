  notes: Radio Suomipop launched on 4 October 1997 (originally as Kiss FM, rebranded Radio City in 1998 and finally Radio Suomipop in 2006), built around a format focused on Finnish-language pop and rock; acquired by SanomaWSOY (now Sanoma) in the early 2000s and consolidated into Nelonen Media's radio family alongside Radio Rock, Radio Aalto, Suomirock, Groove FM, HitMix and HitMix Originals; broadcasts nationally on FM (operating frequencies cover most major Finnish cities) plus DAB+ and the Supla audio platform; the flagship morning show "Aamulypsy" (with Jaajo Linnonmaa, Anni Hautala and Juha Perälä) is one of the most listened-to commercial-radio breakfast programmes in Finland and has won multiple Kultainen Aplodi (Finnish Radio) awards.
