  notes: esRadio launched in October 2009 as a talk-radio competitor to COPE and Onda Cero, founded by Federico Jimenez Losantos after his contentious departure from COPE (a Catholic-Church-owned network) in 2009; flagship program "Es la Manana de Federico" (hosted by founder Jimenez Losantos) is one of Spain's most influential right-wing morning talk shows; other key programs include "La Noche de Cuesta" (Luis Herrero) and "En Casa de Herrero"; the station is known for sharp criticism of the Spanish Socialist Party (PSOE) and left-wing governments; broadcasts on FM in Madrid and regionally in Galicia, Castilla y Leon, and Andalucia; parent Libertad Digital was co-founded by Jimenez Losantos and operates an associated news website
