  operator: Établissement de la Radio Tunisienne (ERT) / الإذاعة التونسية, the Tunisian state radio corporation under the Ministry of Communications.
  affiliations: Government of Tunisia; member of the ASBU (Arab States Broadcasting Union) and EBU (European Broadcasting Union) through ERT.
  audience: Residents of Tataouine Governorate in southeastern Tunisia, broadcasting primarily in Tunisian Arabic.
  format: Regional public-service mix of local news, governorate affairs, agriculture and development reporting, cultural programs, religious content (prayer times, Friday sermons), and Tunisian/Maghreb music; flagship shows include "Woroud Al-Sabah" (morning) and "Al-Khayl wa Al-Lail".
  notes: Radio Tataouine is one of about ten regional stations operated by Établissement de la Radio Tunisienne (the others include Tunis, Sfax, Monastir, Le Kef, Gafsa, Kasserine, Médenine and others), broadcasting on FM to the desert south of Tunisia; it carries content focused on the Tataouine Governorate (whose name is famously borrowed by Star Wars for the planet Tatooine), and its parent ERT was reorganised after the 2011 Tunisian Revolution to operate with greater editorial independence from the state, though it remains state-funded and state-appointed.
  sources: http://www.radiotataouine.tn/, internal knowledge
