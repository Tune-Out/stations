  notes: El Radio 9090 is a private Cairo station on 90.9 FM launched in 2013 and owned by Tarek Ismail's D Media for Media Production Company, which also owns the DMC television channels and the Mobtada news site (which hosts the stream). It runs a full-service schedule of morning and drive-time traffic shows such as 'Sabahak wa Matrahak' and 'Rayeh Wala Gay', football programming ('Kora fil 90'), news bulletins, religious content and Egyptian and Arab music. Media experts citing Ipsos data place it among the ten most-listened radio stations in Egypt.
