  notes: Magic FM is a Romanian commercial radio station launched in 2008 broadcasting on 90.8 MHz in Bucharest and other FM frequencies in major Romanian cities. The station was created by the team behind Radio Guerrilla after that station's commercial frequency change, and has positioned itself as a "soft rock and melodic pop" adult contemporary station with relatively minimal talk content and emphasis on a curated music library spanning several decades. It serves a similar niche to Radio Paradise or Smooth Radio in other markets, attracting a mature urban audience.
