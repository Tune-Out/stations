  notes: Venice Classic Radio (VCR) is an independent internet classical station broadcasting from Venice, Italy, describing itself as "la radio di musica classica in diretta da Venezia". It streams classical works from Baroque composers such as Vivaldi and Telemann through the 19th century, alongside sister channels VCR Auditorium and VCR Classica+, with a podcast archive. It carries no advertising and is sustained by PayPal donations from listeners, and is one of the most-followed Italian classical streams on radio directories.
