  notes: Inforádió, launched on 2 October 2000, was Hungary's first all-news radio and broadcasts on 88.1 MHz in Budapest and its surroundings plus online, carrying only news, reporting and interviews with no music or entertainment. It shares a newsroom with the Infostart.hu portal that supplies its stream. Ownership passed from Central European Media & Publishing (2008) to Módos Márton's 881 Média Invest (2017), and in December 2024 the Mathias Corvinus Collegium foundation acquired 75% with Módos retaining 25% - a shift toward an institution close to the governing establishment, though the station remains a mainstream commercial news service rather than a state outlet.
