  operator: Grup Flaix (Flaix FM, Radio Flaixbac, FlaixTV) - a Catalan private radio group based in Granollers, Catalonia.
  affiliations: Strongly Catalan-language and Catalan-cultural orientation; no party affiliation, but firmly aligned with the Catalan-language media ecosystem and historically supportive of Catalan cultural promotion (es radio en catala). No religious affiliation.
  audience: Adult contemporary listeners across Catalonia, Balearic Islands, Andorra and Catalan-speaking areas of Valencia and southern France; Catalan-language primary
  format: Hot adult contemporary pop/rock in Catalan, Spanish and English; "La radio en catala dels grans exits."
  notes: Radio Flaixbac launched in 1996 as the AC-format sister to the dance-format Flaix FM (founded 1991), both founded by Miquel Calcada ("Mikimoto") and the Codina family. It broadcasts on FM across Catalonia (Barcelona 106.8, Girona, Tarragona, Lleida) and online. Notable shows include the morning programme and weekend hit-list countdowns. Grup Flaix is one of the few large independent private radio groups in Spain operating primarily in Catalan, alongside the public Catalunya Radio (CCMA) and the smaller RAC1.
