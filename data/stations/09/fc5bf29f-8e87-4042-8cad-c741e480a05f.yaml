  notes: 'Rádio SBSR was a Lisbon/Porto (90.4/91.0 FM) alternative-music station launched in 2016 and associated with the Super Bock Super Rock festival. It went off the air permanently on 30 September 2024 after being bought by Medialivre, which replaced it with a new station, Correio da Manhã Rádio (CM Rádio). Editorial note: appears to be defunct as of 2026-09-02.'
