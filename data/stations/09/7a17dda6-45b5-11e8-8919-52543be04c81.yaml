  notes: Originally "Classic FM Denmark," this station rebranded to "Classic Pop" (classicpop.dk) and is part of the JFM family of regional Danish stations alongside Skala FM, Radio Viborg, VLR, Classic Rock and Grand Prix Kanalen; broadcasts on FM across multiple Danish regions (Østsjælland, Østjylland, Nordjylland, Fyn, Sønderjylland and major cities including Århus, Esbjerg, Horsens, Kolding, Viborg); programming includes "80'er Fredag," themed weekends and podcasts such as "Anholdt," "Okkult" and "Ude af Kurs"; promotes its app with the slogan "Tag Classic Pop med på farten."
