  notes: Ekho Moskvy 91.2 is the Yekaterinburg affiliate of the once-national Echo of Moscow talk/news brand; after Russian authorities forced the original Moscow station off air in March 2022, this regional Yekaterinburg station (91.4 FM, since 1998) continued broadcasting independently under the Echo name. The online.echoekb.ru stream domain no longer resolves, though the station's main echoekb.ru web presence is still live.
