  operator: Verein GDS.FM (independent non-profit association based in Zurich); streamed on Airtime Pro infrastructure
  affiliations: none political/religious; strong ties to Zurich electronic-music / club / DIY scene
  audience: Zurich-based and German-speaking electronic-music enthusiasts (DJs, club-goers, underground scene)
  format: DJ sets, mixes, live electronic performances and music-curated radio shows spanning acid house, experimental, hip-hop, indie rock, nu-jazz and trip-hop; recurring programs include "Helvetica", "Fresh Mess" and the "Kokon DJ Workshop".
  notes: Self-describes as "Zurichs Radio gegen den Strom" ("Zurich's radio against the current"); listener-funded with appeals such as "Damit wir auch in Zukunft den Radiobetrieb gewahrleisten konnen sind wir auf deine Unterstutzung angewiesen" ("To keep the station running in the future we depend on your support"); founded in the 2010s as part of the wave of Zurich-based underground/club-culture web radios; web-only, no FM license.
