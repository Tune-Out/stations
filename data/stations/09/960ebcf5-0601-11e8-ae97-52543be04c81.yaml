  notes: La Grosse Radio Reggae is the reggae channel of La Grosse Radio, a French non-profit association (loi 1901) founded on 10 October 2003 by Franck Milcent and now based in Nissan-lez-Enserune, Hérault. The association runs three web-only stations (Rock, Métal, Reggae) with matching webzines and campaigns for independent and self-produced artists under the banner "100% indépendants". The reggae stream plays roots, dub, ska and dancehall around the clock, mixing established names with grassroots acts, and is complemented by reviews, interviews and live reports. La Grosse Radio ranked among France's top ten webradio brands in 2013 and has no terrestrial licence.
