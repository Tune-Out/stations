  notes: Pro FM is one of Romania's largest commercial CHR networks, originally launched in 1993 as part of the Media Pro group founded by Adrian Sârbu and Ion Țiriac, later under Central European Media Enterprises (CME); the Brașov 89.9 FM frequency is a local relay of the national Pro FM network covering the Transylvanian city of Brașov (population ~250,000); programming centres on current Top 40 pop hits and short news bulletins, with national drive-time shows such as the "Pro FM Morning Show". The network is consistently among Romania's top three commercial music brands.
