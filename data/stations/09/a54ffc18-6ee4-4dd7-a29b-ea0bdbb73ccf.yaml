  operator: VRT (Vlaamse Radio- en Televisieomroeporganisatie), Flanders' public broadcaster
  affiliations: Flemish Community of Belgium (publicly funded via management contract); none religious or political
  audience: Flemish-speaking young adults (roughly 18-34) in Flanders and Brussels, Belgium
  format: Alternative and contemporary pop/rock, indie, dance and urban music with youth-oriented talk
  notes: Studio Brussel ("StuBru") launched in 1983 as VRT's youth-oriented music network focused on alternative and new music; broadcasts on FM across Flanders and via DAB+ and online; known for the annual "De Tijdloze" all-time-greats listener poll, "Music for Life" charity marathon (initially in support of the Red Cross, then partnering with various causes), and tastemaker DJ-driven music programming; in 2026 its standalone stubru.be was redirected into the consolidated VRT MAX platform.
