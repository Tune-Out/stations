  notes: "\"50首经典古典音乐\" (50 Classic Classical Music Pieces) is a thematic channel hosted on Qingting FM (qtfm.cn), one of China's three major commercial podcast/audio aggregators alongside Ximalaya and Lizhi FM; the channel functions as a curated background-music stream rather than a live broadcaster, drawing from a fixed catalogue of well-known classical works; Qingting FM itself was founded in 2011 and bills itself as \"蜻蜓FM网络收音机，囊括了国内外数千家网络广播\" (an internet radio aggregator covering thousands of domestic and international web stations) with over 30 content categories; stream served via Huawei Cloud (lhttp-hw.qtfm.cn)."
