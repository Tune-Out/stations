  operator: RTBF (Radio-Télévision Belge de la Communauté Française) — public broadcaster of the French Community of Belgium (Fédération Wallonie-Bruxelles)
  affiliations: Belgian public service media; editorially independent under public-service charter; funded by public subsidy and limited advertising
  audience: French-speaking Belgians, Wallonia and Brussels; this feed is the Brussels regional variant
  format: News, current affairs, debate, magazine and cultural programming — "Information, culture, magazine, décryptage et débat de société"
  notes: La Première is RTBF's flagship talk/information radio channel, comparable to France Inter or BBC Radio 4. It dates back to RTBF's founding broadcasts (RTBF was created in 1977 when the Belgian public broadcaster was split into French-speaking RTBF and Flemish VRT). This particular stream is the "Bruxelles" regional decrochage carrying Brussels-specific opt-outs alongside the main network feed. Flagship shows include Matin Première (morning news), Déclic, Entrez sans frapper, and the fact-checking project Faky. Operates under the editorial-independence statute of Belgian public broadcasting.
