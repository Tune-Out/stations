  nature: public broadcaster
  operator: Radio France (French national public service broadcasting company, a state-owned société nationale de programme)
  affiliations: part of Radio France, funded primarily by the French state (audiovisual public funding); editorially independent under regulation by ARCOM (formerly CSA); no party-political or religious affiliation
  audience: French-speaking listeners across France and worldwide; targets an educated, culturally engaged audience interested in humanities, ideas, literature, science, history, and current affairs
  format: cultural/talk public radio — documentaries, debates, literary readings, philosophy, history, science, drama, and in-depth news magazines; very little music programming
  notes: founded 1963 as France Culture (lineage traces to RTF's "Programme National"); broadcasts nationally on FM and DAB+; sister stations include France Inter, France Info, France Musique, France Bleu, and Mouv'; flagship intellectual broadcaster of the French public radio system; homepage redirects from franceculture.fr to radiofrance.fr/franceculture
  sources: https://www.franceculture.fr/ (redirects to https://www.radiofrance.fr/franceculture), internal knowledge
