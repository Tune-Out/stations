  notes: France Culture is Radio France's national spoken-word and cultural channel, tracing its lineage to the 1945 Programme National and taking its current name in 1963. It broadcasts nationwide on FM (93.5 MHz in Paris) and DAB+ from 507 transmitters and streams online, offering documentaries, debates, philosophy, history, science, literary readings and radio drama, with landmark series such as Atelier de création radiophonique (since 1969) and Une vie, une oeuvre, plus podcasts like Mécaniques du complotisme and Les Idées claires. Médiamétrie measured about 1.67 million daily listeners (3.0% audience share) in early 2023; Emelie De Jong has been director since April 2023. It is publicly funded and editorially independent under ARCOM regulation.
