  notes: Chante France 80's is one of the thematic web channels of Chante France, a French station devoted entirely to French-language song and now part of Groupe HPI. The parent service is carried on FM and is expanding on DAB+ across France, and it fans out into a family of web streams — Nouveautés, Emotion, Party, 90-2000's, 80's, 70's and 60's. This channel plays French variété and pop hits of the 1980s non-stop (Goldman, Balavoine, Berger, Cabrel, Sardou, France Gall and contemporaries), with no presenters or speech content. Alongside the streams the brand offers podcasts, interviews and acoustic sessions on its website and apps.
