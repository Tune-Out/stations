  format: Adult-contemporary "Oldie-based" pop/rock with strong regional news, traffic, magazines and call-in programming — slogan "SWR1 — Eins für alle"
  notes: SWR1 Baden-Württemberg is the Baden-Württemberg-specific stream of SWR1, created when Süddeutscher Rundfunk (SDR) and Südwestfunk (SWF) merged into SWR in 1998; the parallel SWR1 Rheinland-Pfalz serves the neighbouring state. It is consistently one of Germany's most-listened-to regional radio programmes, regularly competing with Bayern 1 and WDR 4 for top spots in the country's reichweite rankings. Notable formats include the annual "SWR1 Hitparade" rock listener-voted countdown, "Leute" long-form interviews and "SWR1 Pop & Poesie." As a public-service ARD member, the station is editorially independent of government and funded by the Rundfunkbeitrag household fee, governed by the SWR Broadcasting Council representing societal groups.
