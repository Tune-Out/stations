  notes: 潍坊新闻广播 (Weifang News Radio) is the news channel of the municipal broadcaster in Weifang, Shandong. Its portal wfcmw.cn (新派网) states it is run by the Weifang Media Convergence Centre under the supervision of the Weifang Municipal Party Committee Publicity Department, and carries WFTV and Weifang radio channels including 潍坊新闻联播. Like all Chinese municipal broadcasters it is party-state controlled, but its output is ordinary local news and service programming rather than an international propaganda operation. The stream is relayed at 64 kbps via QingTing FM (channel 20320).
