  nature: public broadcaster
  operator: All India Radio (Akashvani), the radio service of Prasar Bharati — India's statutory autonomous public service broadcaster, established by the Prasar Bharati Act, 1990 and operational from 1997
  affiliations: Government of India (public service broadcaster under Ministry of Information and Broadcasting); Akashvani is autonomous in law but state-funded
  audience: Hindi-speaking residents of Bhopal and Madhya Pradesh, plus regional language and dialect speakers in central India
  format: News bulletins (regional, national, international), Hindi film music, classical and folk music of Madhya Pradesh, agricultural programming for rural listeners, talks, educational features, sports
  notes: AIR Bhopal is the Madhya Pradesh state capital station of All India Radio, broadcasting on multiple frequencies (Primary Channel medium wave and Vividh Bharati / FM); it produces both originating regional programming and relays national network content; AIR has the largest radio network in the world with more than 470 stations covering nearly 100% of India's population.
