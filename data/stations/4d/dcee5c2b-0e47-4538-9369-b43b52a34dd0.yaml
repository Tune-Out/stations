  notes: Radio Paradise is a U.S. listener-supported internet radio station founded in 2000 by Bill and Rebecca Goldsmith and operated from Paradise, California (later relocated after the 2018 Camp Fire destroyed the town). The station is one of the longest-running and most respected independent internet radio operations, famous for its handcrafted DJ-curated programming, high-quality audio (offering FLAC and Ogg Vorbis streams with album-art metadata), and strict no-advertising policy supported entirely by listener donations. The Rock Mix channel is one of several themed streams (Main Mix, Mellow Mix, Rock Mix, Global Mix, Serenity, Beyond, Eclectic Mix). The FLAC+meta variant delivers lossless 1411 kbps audio with embedded track and album metadata for displays and tagging.
