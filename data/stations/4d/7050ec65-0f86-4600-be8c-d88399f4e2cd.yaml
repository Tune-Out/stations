  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: British Broadcasting Corporation (BBC), the UK's public service broadcaster, established by Royal Charter
  affiliations: editorially independent of government; funded by the UK television licence fee; EBU member; bound by BBC Editorial Guidelines requiring due impartiality
  audience: UK-wide English-speaking adults, traditionally skewing older and ABC1 — a flagship national speech network for an educated, news-and-current-affairs-oriented audience
  format: Speech radio — news, current affairs, drama, comedy, documentary, religion, science, history and arts; almost no music aside from interludes and specific programmes
  notes: Launched 30 September 1967 as the successor to the BBC Home Service (which itself dated to 1939), BBC Radio 4 is widely regarded as the cornerstone of British public-service speech broadcasting; home of long-running institutions including the "Today" programme, "PM", "The World at One", "The World Tonight", "Woman's Hour", "Front Row", "Desert Island Discs", "From Our Own Correspondent", "Just a Minute", "The News Quiz", "The Archers" (the world's longest-running radio drama, since 1951), and the "Shipping Forecast"; broadcasts on FM (92.4-94.6 MHz nationally), long wave 198 kHz (historically), DAB, digital TV and BBC Sounds streaming; charter renewal and licence-fee debates have been recurring policy controversies, and editorial impartiality complaints (especially on Brexit, Israel/Palestine and party politics) periodically reach Ofcom and the BBC's complaints unit.
  sources: internal knowledge of BBC Radio 4
