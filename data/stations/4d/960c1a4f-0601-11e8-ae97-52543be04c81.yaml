  notes: rbb 88.8 is Rundfunk Berlin-Brandenburg's Berlin city station, tracing back to SFB 1 (1954), relaunched as 'Radio Berlin 88,8' on 7 November 2005 and renamed rbb 88.8 on 4 February 2019. It runs a current-based adult-contemporary hits format under the slogan 'Deine Hits. Dein Berlin' with Berlin news, reaching about 335,000 listeners on 88.8 FM, DAB+, cable and online. The catalog's 'RBB 88.8 Radio Berlin' entry with more votes carries the same rndfnk feed, and this entry still uses the pre-2019 name and domain.
