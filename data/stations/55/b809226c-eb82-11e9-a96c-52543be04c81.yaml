  nature: public broadcaster
  operator: Radio France, France's national public radio broadcasting company
  affiliations: European Broadcasting Union (EBU); funded by French government (contribution à l'audiovisuel public, formerly the redevance audiovisuelle)
  audience: Electronic-music fans worldwide; French-language presentation but largely instrumental/non-vocal programming with international reach via the web
  format: 24/7 themed webradio dedicated to electronic music — house, techno, ambient, downtempo, IDM and electronica — curated from FIP's eclectic catalogue
  notes: FIP (originally "France Inter Paris") was launched in 1971 as a hyper-curated, minimal-talk music station distinguished by its female announcers ("les fipettes") and famously eclectic programming spanning jazz, world, rock, classical and electronic; the dedicated FIP Electro webradio is one of seven themed FIP web channels (alongside FIP Jazz, FIP Rock, FIP Groove, FIP Pop, FIP Reggae, FIP Monde) reflecting the parent's genre breadth; Radio France's mission charter mandates editorial independence from government, though as a state-funded broadcaster its budget is regularly debated in parliament.
