  affiliations: not formally affiliated with the official UK Radio Caroline (the historic offshore station that still broadcasts from the LV18 lightship and on DAB/AM); operates as a nostalgia/tribute network
  audience: Benelux 60s-90s classic-rock and offshore-radio nostalgia listeners; primarily Dutch-speaking with English music
  format: Continuous classic rock and album rock from the 1960s through 1990s; sister streams Radio Monique 963 Gold and Radio Caroline 319 Gold complete the offshore-tribute network
  notes: Radio Caroline 259 Gold is a Dutch internet station styled after the legendary 1960s offshore pirate Radio Caroline; the "259" recalls Caroline's 259-metre medium-wave frequency and "Gold" signals the oldies focus. The site contains an "extensive offshore radio links section" celebrating Radio Caroline, Radio Monique and Mi Amigo, and the stream is delivered at multiple bitrates from 64 to 320 kb/s for "de Benelux Landen."
