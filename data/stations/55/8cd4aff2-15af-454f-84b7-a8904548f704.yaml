  operator: Beur FM SAS, headquartered in Paris, France (founder Nacer Kettane)
  affiliations: editorially oriented toward the French Maghrebi (North African / "Beur") diaspora community; secular; no formal political party affiliation
  audience: French-speaking listeners of North African (Algerian, Moroccan, Tunisian) heritage in France, plus diaspora and listeners in Algeria/Maghreb; programming in French and Arabic with some Berber/Kabyle content
  format: news, talk and music station with a strong cultural identity focus — Raï, Chaâbi, rap, R&B, French pop, plus debates on immigration, integration, religion and Maghreb politics
  notes: Beur FM was founded in Paris in 1992 by Nacer Kettane to give a voice to second- and third-generation North African immigrants in France ("Beur" being a verlan slang term for "Arabe"); it broadcasts on FM in several French cities (Paris 106.7, Marseille, Lyon, etc.) and streams worldwide; despite the DZ country tag in this catalogue, the station's headquarters, licensing and primary FM footprint are in France, although it has strong content ties to Algeria; mission centers on intercultural dialogue and representation of French Muslims and Maghrebi culture in the media landscape.
