  notes: Chérie FM is one of France's major commercial radio networks, owned by NRJ Group (the listed media company also operating NRJ, Nostalgie and Rire & Chansons). Launched in 1987 by NRJ founder Jean-Paul Baudecroux, the station was originally positioned as a romantic / slow-music network ("Le bonheur est dans Chérie") and now uses the slogan "Pop Love Music". It broadcasts on FM in dozens of French cities, in Belgium (Chérie Belgique), Switzerland and other francophone markets, plus DAB+ and online with a family of themed webradios (Chérie Love, Chérie Pop, Chérie French, Chérie 80s/90s, etc.). The format targets women aged 25-49 with adult-contemporary hits, easy-listening ballads and light current pop. NRJ Group is a publicly traded French commercial broadcaster (Euronext Paris) with no governmental or religious affiliation.
