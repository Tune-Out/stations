  format: Catholic religious programming — Mass, rosary, catechesis, prayer, Marian devotions, faith talk and limited educational content (e.g., Lingala courses)
  notes: "Radio Maria RDC describes itself as \"Une voix chrétienne au Congo et dans le Monde\" (A Christian voice in Congo and the World) and is the Congolese national member of the World Family of Radio Maria, the global network of independent Catholic Marian radio stations originally founded in Erba, Italy in 1983; headquartered in Kinshasa (Boulevard Sendwe 6004, Commune de Kalamu) with regional stations in Matadi, Lubumbashi, Goma and Bukavu giving it broad coverage across the DRC; financed by listener donations through annual \"Mariathon\" fundraising campaigns (2026 theme: \"Dans l'Amour est la Victoire\" / \"In Love is Victory\") rather than commercial advertising; non-profit and devotional in nature with no political or partisan affiliation."
