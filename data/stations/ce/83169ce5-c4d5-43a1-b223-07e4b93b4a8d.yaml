  operator: Sing Tao Newspapers San Francisco Ltd., representing Sing Tao News Group (星島新聞集團有限公司), a Hong Kong-headquartered Chinese-language media conglomerate
  affiliations: Part of the Sing Tao News Group; FCC-licensed AM broadcaster (call sign KEST 1450 AM / KSFN 1510 AM / 1440 AM lease arrangement in the Bay Area, depending on era — Sing Tao has leased and operated multiple Bay Area Chinese-language stations); regulated by the US FCC
  audience: Cantonese-speaking Chinese-American community in the San Francisco Bay Area and Northern California
  format: Cantonese-language full-service — news, current affairs, community-issue talk shows, health and wellness, entertainment, and Chinese music
  notes: "星島中文電台 (Sing Tao Chinese Radio) is the broadcasting arm of Sing Tao News Group in the United States and has operated Cantonese-language radio in the Bay Area for roughly three decades, with a sister Mandarin service; Sing Tao News Group itself was founded in Hong Kong in 1938 by Aw Boon Haw and became controlled by Charles Ho's family before passing to Kwok Ying-shing's Kairong Investment in 2021, making it part of a media group with documented ties to Beijing-aligned editorial positions in Hong Kong; the US-based stations operate under a separate corporate vehicle and present themselves as community-service broadcasters — founding ethos quoted on site: \"相信聲音能為沉默的大多數發聲\" (believing sound can give voice to the silent majority)."
