  notes: Metro 95.1 (LRJ859) is one of the most iconic youth-oriented FM stations in Buenos Aires, on air since 1989; its identity was built on personality-driven morning shows, most famously "Cuál Es?" with Mario Pergolini in the 1990s-2000s and later programs hosted by Sebastián Wainraich, Andy Kusnetzoff and others; the station has been owned by Grupo Indalo (and previously linked to the Hadad family and Cristóbal López media holdings), is sister to other Buenos Aires outlets and broadcasts on 95.1 MHz from the city of Buenos Aires.
