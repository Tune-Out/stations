  nature: commercial
  operator: Bauer Media Audio UK (part of the German privately-held Bauer Media Group, owned by the Bauer family)
  affiliations: none known politically; operates under Ofcom UK regulation; member of the Radiocentre UK commercial trade body
  audience: UK-wide adult audience aged roughly 25-54 with a male skew, focused on rock and alternative music fans; "Real music matters" is the on-air tagline
  format: Adult-contemporary rock-oriented music with live presenters (e.g. Jay Lawrence, Ben Sheppard), specialist weekend shows, football coverage and a network of decade- and mood-themed sub-brands (Absolute 60s, 70s, 80s, 90s, 00s, 10s, Classic Rock, Country)
  notes: Launched in 1992 as Virgin Radio, the UK's first national commercial INR licence on AM 1215; rebranded to Absolute Radio in September 2008 after being sold by SMG / The Wireless Group to Times of India Group / Absolute Radio International, then acquired by Bauer Media in 2013. Now part of Bauer's Hellorayo / Rayo digital network of 128 stations and one of the UK's largest national commercial brands. Broadcasts on MW, DAB+, online, smart speakers and via the Rayo app, with a premium ad-free subscription tier at £3.99/month. Notable past and present talent includes Christian O'Connell, Frank Skinner, Dave Berry, Pete Donaldson and Iain Lee.
