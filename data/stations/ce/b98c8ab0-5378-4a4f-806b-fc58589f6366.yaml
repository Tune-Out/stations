  notes: 'Community online radio dedicated to preserving traditional Brazilian sertanejo raiz and caipira music. Mission: "preserve, divulgar e valorizar a música sertaneja raiz e a música caipira" (preserve, promote and value root sertanejo and caipira music). Describes itself as "a true cultural heritage of sertanejo music." Features Saturday morning live show (7am-12pm) with Pallaretti and duo "Os Meninos de Bonfim." Livestreamed on YouTube. Based in São Paulo state. WhatsApp contact: +55 (16) 99991-9466.'
