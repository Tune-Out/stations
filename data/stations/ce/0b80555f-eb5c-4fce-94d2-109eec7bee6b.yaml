  notes: Founded 1947 (under various names), France Inter is the flagship generalist station of Radio France and consistently the most-listened-to radio station in France since 2019, surpassing RTL. Carries flagship morning news show "Le 7/9", "La Marche de l'histoire", "Le Masque et la Plume" and many widely cited cultural programs. Considered center-left leaning by media analysts but operates under public-service impartiality mandate. Financed historically by the redevance audiovisuelle (abolished 2022) and now by state budget allocation.
