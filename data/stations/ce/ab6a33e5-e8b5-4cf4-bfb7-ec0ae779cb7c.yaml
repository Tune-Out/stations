  nature: public broadcaster
  operator: Radio France (French state-owned public radio service company, established 1975; funded since 2022 by a share of VAT after abolition of the redevance audiovisuelle/license fee)
  affiliations: Part of the French public service audiovisual sector; editorial independence guaranteed by law and regulated by ARCOM (Autorite de regulation de la communication audiovisuelle et numerique). Cooperates with France Televisions and INA for the "franceinfo:" multimedia brand. No religious or party-political affiliations.
  audience: French-speaking adults seeking news and current affairs; national coverage in France via FM, DAB+, satellite, cable, and online streaming; also widely listened to across the Francophone world
  format: Continuous news / all-news talk radio - rolling headlines every 15 minutes, longer features, expert interviews, business and sports updates, debates, and political analysis
  notes: "Launched 1 June 1987 as France's first 24-hour rolling-news station (modeled on the all-news format pioneered in North America). Sister stations under Radio France include France Inter, France Culture, France Musique, France Bleu (regional network), Mouv', and FIP. In 2016 the \"franceinfo:\" multimedia brand expanded to include a dedicated TV channel (channel 27) co-produced with France Televisions. One of the most-listened news radios in France with several million daily listeners. Mission: public-service information, independent and pluralist news coverage."
