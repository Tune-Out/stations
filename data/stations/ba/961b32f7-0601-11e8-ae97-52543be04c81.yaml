  nature: public broadcaster
  operator: Polskie Radio Regionalna Rozgłośnia w Katowicach "Radio Katowice" S.A. (Polish state-owned regional public radio company; corporate entity currently "w likwidacji" / in liquidation as part of 2024-2025 public-media restructuring)
  affiliations: Polish public-media system; supervised by the National Broadcasting Council (KRRiT) and funded through the licence fee and state appropriations
  audience: residents of the Silesian Voivodeship and adjacent regions in southern Poland; Polish-language listeners
  format: regional full-service public radio — news, weather, sport, cultural and historical reporting, talk, radio dramas and music; flagship programmes include "Rozmowa dnia"
  notes: Radio Katowice is one of 17 regional public radio companies that form the Polskie Radio network; founded on 4 December 1927 as one of Poland's oldest broadcasters; broadcasts on multiple FM frequencies including 101.2 and 102.2 in Katowice, 89.3 in Gliwice, 97.0 in Racibórz, 98.4 in Częstochowa, and 103.0 in Bielsko-Biała, plus DAB+ across Silesia; the station has had close partnerships with regional cultural institutions including the Polish National Radio Symphony Orchestra (NOSPR), the Institute of National Remembrance (IPN), and Silesia Film; in late 2023 / 2024 it (like other Polish public broadcasters) was placed in liquidation by the new government to enable restructuring after political control disputes during the 2015-2023 PiS era.
  sources: http://www.radio.katowice.pl/, internal knowledge
