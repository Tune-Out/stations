  operator: Sistema Radiópolis (Grupo Radiópolis) — joint venture historically between Grupo Televisa and Grupo Prisa Radio (Cadena SER); now majority-owned by Grupo Radiópolis under Prisa/local Mexican shareholders, operating the W Radio brand in Mexico
  affiliations: none known (commercial broadcaster; W Radio is the Mexican franchise of the international W Radio brand operated by Prisa Radio across Latin America)
  audience: Spanish-speaking Mexican adults 25-65, primarily in Mexico City and the Valle de México; news, talk, and opinion listeners
  format: News-talk radio — current affairs, political commentary, interviews, business news, sports, and opinion programming
  notes: W Radio Ciudad de México broadcasts on 96.9 FM (XEW-FM) and 900 AM (XEW-AM) from Mexico City; XEW-AM is one of the most historic radio stations in Latin America, founded on 18 September 1930 by Emilio Azcárraga Vidaurreta as "La Voz de la América Latina desde México" and considered the flagship of Mexican radio history; the W Radio brand was launched in 2000 as a Prisa/Televisa news-talk format on the XEW frequencies; flagship programs have included shows hosted by Carlos Loret de Mola, Carmen Aristegui (until 2008), and currently Luis Cárdenas's morning show "Así las Cosas" and other news-talk programming; the station is part of the Cadena W Radio Mexican network with affiliates nationwide.
  sources: internal knowledge only
