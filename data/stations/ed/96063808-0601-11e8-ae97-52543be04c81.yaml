  notes: Antenne Brandenburg is rbb's regional service for the state of Brandenburg, launched 6 May 1990 by Ostdeutscher Rundfunk Brandenburg (ORB) and run by Rundfunk Berlin-Brandenburg since the 2003 merger. It airs adult-contemporary music weighted to the 1970s-80s with hourly regional news and opt-outs from studios in Cottbus, Frankfurt (Oder), Perleberg and Prenzlau, reaching about 500,000 daily listeners on eight FM frequencies, DAB+ and online. Funded by the German Rundfunkbeitrag licence fee as part of ARD.
