  notes: Kiss FM Deep is one of the online sub-channels of Kiss FM Ukraine, the country's leading dance radio brand, operated by the Kyiv commercial group TAVR Media (which also runs Hit FM, Radio ROKS, Relax and others). The parent station brands itself "The Best Dance Radio", broadcasts on FM in cities across Ukraine and streams alongside Kiss FM Ukrainian and Kiss FM Digital. The Deep channel is a dedicated deep-house and melodic-electronic stream, complementing the network's podcast strands such as KISS.CLUB.MIX, Ukraine Dancing and DJ Mixes and its listener-voted Tendance chart. The catalogue entry has no homepage set; the brand's site is kissfm.ua.
