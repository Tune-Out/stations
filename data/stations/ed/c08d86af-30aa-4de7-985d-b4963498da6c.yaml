  notes: Kiss FM is one of Ukraine's largest dance music radio brands, broadcast nationally on FM and operated by TAVR Media (one of the country's biggest commercial radio groups, which also owns Hit FM, Radio ROKS, Russkoye Radio Ukraine, Relax, and others). Kiss FM Deep is one of several themed online-only sub-channels (alongside Deep, House, Pure Trance, Hard, Tech, etc.) focused on the deep house subgenre. The station was founded in 2003 and has been a leading dance music brand in Ukraine; under Ukraine's wartime conditions since the 2022 Russian invasion, Ukrainian commercial radio groups including TAVR have continued operating while complying with national content and language laws requiring majority Ukrainian-language speech content.
