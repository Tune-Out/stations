  operator: Radio y Televisión de Andalucía (RTVA) / Canal Sur Radio — autonomous public-service broadcaster of Andalusia, Spain
  affiliations: Junta de Andalucía (regional government of Andalusia); statutorily autonomous public broadcaster funded by regional budget allocation plus advertising
  audience: Young and adult Andalusian audience, especially festival-goers; Castilian Spanish and Andalusian language/dialect
  format: Latin pop, Spanish pop, dance, reggaeton, summer hits, and festival music — described by RTVA as "la música más divertida y bailable" (the most fun and danceable music)
  notes: Canal Fiesta Radio launched 25 May 1998 as RTVA's youth-oriented music network and quickly grew into Andalusia's leading FM music station; broadcasts on FM across all eight Andalusian provinces (Almería, Cádiz, Córdoba, Granada, Huelva, Jaén, Málaga, Sevilla); produces large live events including the Canal Fiesta Live tour; sister stations are Canal Sur Radio (news/talk), Radio Andalucía Información, and Flamenco Radio; mission per RTVA's mandate is to promote Andalusian culture and serve as a public-service alternative to private commercial radio
