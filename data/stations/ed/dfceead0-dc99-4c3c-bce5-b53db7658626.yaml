  nature: state media
  operator: Polskie Radio S.A. — the Polish national public-service radio broadcaster, wholly owned by the Polish State Treasury
  affiliations: "Public service broadcaster under Polish broadcasting law; oversight historically through the Krajowa Rada Radiofonii i Telewizji (KRRiT, National Broadcasting Council). Editorial direction has been highly contested politically: Trójka faced major staff resignations and chart-manipulation scandals in 2020 under management aligned with the PiS government, and was the subject of a high-profile reorganisation after the 2023 change of government."
  audience: Polish adult listeners with eclectic music tastes — historically a beloved "thinking adult's" radio brand
  format: Eclectic adult contemporary, rock, alternative, jazz, world music; intellectual journalism, literature, culture, science and political discussion
  notes: "Program Trzeci Polskiego Radia (Trójka / \"The Third Programme\") launched on 1 April 1962 and became Poland's most culturally influential music/talk radio of the late communist and post-1989 era, famous for its long-running listener chart \"Lista Przebojów Programu Trzeciego\" (LP3) which began in 1982. In May 2020 a scandal erupted when management cancelled Kazik Staszewski's hit \"Twój ból jest lepszy niż mój\" (a criticism of PiS politician Jarosław Kaczyński) from the LP3 chart, prompting mass on-air protests and the resignation of dozens of journalists including longtime DJ Marek Niedźwiecki. The station has since worked to rebuild its reputation. Programming mixes music shows (HCH, Ciężko na Sercu) with current-affairs talk (Bez Uników). Mission statement (verbatim from a Trójka show): \"We believe in intergenerational life. We believe in the universal language of music.\""
  sources: https://trojka.polskieradio.pl/, internal knowledge of Polskie Radio and the 2020 Trójka censorship scandal
