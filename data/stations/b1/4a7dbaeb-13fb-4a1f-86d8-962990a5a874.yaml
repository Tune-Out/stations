  notes: BLU Radio launched on August 6, 2012, as a news/talk competitor to Caracol Radio and W Radio; it is owned by RCN Radio, part of the Organización Ardila Lülle conglomerate (founded by the late Carlos Ardila Lülle), which also owns RCN Televisión and Postobón; flagship shows include "Mañanas BLU" hosted at various times by figures such as Néstor Morales and Camila Zuluaga, plus "Sala de Prensa BLU". The station broadcasts across major Colombian cities on FM (89.9 in Bogotá) and is one of the country's three leading news/talk networks.
