  nature: public broadcaster
  operator: Radio Bremen (member of ARD, the consortium of German regional public broadcasters)
  affiliations: ARD network; funded by the German public broadcasting licence fee (Rundfunkbeitrag); statutory mandate under German broadcasting law; no party-political or religious affiliation
  audience: Adult listeners in Bremen and Bremerhaven with an interest in culture, jazz, indie and in-depth journalism; broadcast in German across northern Germany via FM, DAB+ and stream
  format: Cultural and information-oriented public radio mixing jazz, soul, indie and singer-songwriter music with documentary features, interviews and arts coverage
  notes: Radio Bremen is Germany's smallest ARD broadcaster, founded 1945 in the post-war American occupation zone; the channel was relaunched as "Bremen Zwei" in 2017 (replacing "Nordwestradio", a joint venture with NDR Info Spezial) and uses the slogan "Neugier lohnt sich" ("Curiosity pays off"); flagship strands include the cultural conversation programme "Gesprächszeit" and music shows "Sounds" and "Late Nite Sounds - Jazzgrooves"; sister channels at Radio Bremen include Bremen Eins, Bremen Vier, Bremen NEXT and the multicultural service COSMO (co-produced with WDR and rbb)
