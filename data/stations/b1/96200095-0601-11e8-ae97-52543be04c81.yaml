  notes: Capital London is the London flagship of Global's national Capital network, broadcasting on 95.8 FM, DAB and Global Player from Leicester Square. It traces back to Capital Radio, launched on 16 October 1973 as one of Britain's first two commercial stations, which split into 95.8 Capital FM and Capital Gold in 1988, merged into GCap Media in 2005 and was bought by Global Radio in 2008. Since the 2011 network rebrand it carries a Top 40 pop format with largely networked celebrity-fronted breakfast and drive shows, chart countdowns and the Summertime Ball and Jingle Bell Ball events. Local content is limited to London news, travel and advertising.
