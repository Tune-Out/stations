  notes: Brands itself as "The UK's No.1 Hit Music Station". Capital London broadcasts on 95.8 FM in London and is the heritage station of the Capital Network (formed when Global rebranded its regional stations under one brand in 2011). Famous for the annual Capital's Summertime Ball and Jingle Bell Ball at Wembley Stadium / The O2. Global also operates Heart, Smooth, Classic FM, LBC, and Radio X. Capital itself traces back to Capital Radio, which launched 16 October 1973 as one of the UK's first two commercial radio stations (with LBC).
