  nature: community
  operator: The Voice of the Cape Community Radio Trust (Radio 786 is a service of the Islamic Unity Convention)
  affiliations: Islamic (Sunni Muslim community broadcaster); historically linked to the Islamic Unity Convention advocacy organisation
  audience: Cape Town Muslim community and broader Western Cape audience; English, Afrikaans and Arabic content
  format: community radio with news, current affairs, religious programming, social commentary, and music
  notes: Radio 786 launched in 1995 in Cape Town as a community broadcaster serving the Muslim community; it is licensed by ICASA as a community radio station and has been involved in landmark South African free-speech jurisprudence, most notably the 2002-2009 Constitutional Court case Islamic Unity Convention v Independent Broadcasting Authority over a 1998 broadcast about the Holocaust; the tagline is "Hear the Difference."
