  notes: 'Founded by radio professionals from terrestrial radio (106.7 KROQ Los Angeles, 1980s) who started INDIE X FM "because of the amount of garbage music on Terrestrial Radio and online Indie stations that play the same songs over and over." Emphasizes new indie artists and unsigned acts. Notable shows: Postcards From The Underground (Mondays 2-4pm PT), The FTP New Music Show (Thursdays 7-8pm PT), Modern Rock Mix Tape (Fridays 7-9pm PT), +THE UNHEARD MUSIC+ (Saturdays 7-8pm PT), The Abyss Radio Show (Saturdays 9-11pm PT, EDM), Revolt Into Sound (Sundays 7-8pm PT). Global streaming via TuneIn, Radio Garden, Alexa, Sonos.'
