  nature: public broadcaster
  operator: South African Broadcasting Corporation (SABC), the statutory South African public broadcaster
  affiliations: state-owned public broadcaster regulated by ICASA (Independent Communications Authority of South Africa); funded by a mix of TV licence fees, government grants and commercial advertising; no party or religious affiliation, but historically subject to political pressure under successive ANC-led governments
  audience: Xitsonga-speaking communities, primarily in Limpopo, Mpumalanga and Gauteng provinces, with spillover into Mozambique and Zimbabwe; predominantly broadcasts in Xitsonga
  format: full-service Xitsonga-language radio with talk, current affairs, music, sports, religion, education and entertainment; serves as one of SABC's eleven official-language African-language radio services
  notes: Founded 1 June 1965 as Radio Tsonga, part of the apartheid-era Radio Bantu network; restructured and renamed Munghana Lonene FM ("True Friend FM") in 1996 as part of SABC's post-apartheid transformation; flagship shows include the "Phaphama Breakfast Show", "Afrika Wa Vulavula" (talk), "Khoma Ndlela 326" (drive) and "Tidyondzo" (education); stated mission is to "promote and encourage people to practice their culture and religion without fear"
