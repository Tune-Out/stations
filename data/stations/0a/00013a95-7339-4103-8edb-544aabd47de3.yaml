  notes: Salam Watandar ('Hello Homeland') is a national Afghan radio news/culture service established in 2003 by Internews with USAID support, distributing programming via satellite to a network of over 50 Afghan-owned local stations and reaching over 10 million listeners across Afghanistan; it broadcasts on 98.9 FM in Kabul and nationally. Given the 2021 Taliban takeover and subsequent restrictions on independent Afghan media, its current editorial independence and content should be treated with some caution, though the station format itself (news/culture) is not overtly propagandistic.
