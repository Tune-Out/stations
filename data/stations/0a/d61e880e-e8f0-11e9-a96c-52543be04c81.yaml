  affiliations: none — no parent media group, no religious, governmental or political affiliation; listener-supported via voluntary donations
  audience: adult, music-curating listeners worldwide who favor eclectic, hand-picked album-rock and adjacent genres; tagline "An eclectic musical adventure"
  format: hand-curated DJ-mix of rock, alternative, world, electronic, jazz, blues and classical music with no advertising; multiple sibling streams (Mellow Mix, Rock Mix, Global Mix, Serenity); high-fidelity FLAC, AAC and MP3 streams plus a 4K visual experience
  notes: Radio Paradise was founded in 2000 by Bill Goldsmith (a former commercial-radio programmer) and Rebecca Goldsmith after their FM station KPIG-era project ended; based originally in Paradise, CA, the operation survived the 2018 Camp Fire that destroyed the town and rebuilt elsewhere; it is one of the longest-running listener-supported internet-only stations and is frequently cited as a model for ad-free, community-funded streaming; its 128 kbps AAC "Main Mix" is the flagship feed, complemented by lossless FLAC variants for high-end listeners; the project remains family-run with no corporate ownership.
