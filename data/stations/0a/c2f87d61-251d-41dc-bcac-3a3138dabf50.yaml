  notes: "\"Przeboje PRL\" (\"Hits of the People's Republic\") is one of MojePolskieRadio.pl's specialty 24/7 internet channels operated by Polskie Radio, the public national broadcaster founded 1925 and re-established as a joint-stock company under the 1992 Broadcasting Act; the channel curates Polish estrada, big-beat, pop and pop-rock from roughly 1956-1989 featuring artists like Czerwone Gitary, Maryla Rodowicz, Czeslaw Niemen, Anna Jantar, Skaldowie and Budka Suflera; funded by a licence fee (abonament RTV) and state subsidies plus limited advertising; the parent Jedynka (Program I) is Poland's flagship public radio service."
