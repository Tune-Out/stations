  nature: public broadcaster
  operator: Osterreichischer Rundfunk (ORF), Austria's federal public-service broadcaster, organised as a foundation under public law and funded by the ORF-Beitrag (household media levy) since 2024
  affiliations: ORF Landesstudio Steiermark in Graz; ORF is a member of the European Broadcasting Union (EBU); legally independent under the ORF-Gesetz
  audience: Adult listeners in the Austrian state of Styria (Steiermark) and listeners worldwide via stream, in German with regional dialect colour
  format: Full-service regional public radio with hourly Styrian news, weather, traffic, service journalism, schlager and Austropop, oldies and folk music
  notes: Radio Steiermark is the regional station of the ORF Landesstudio Steiermark, on air since 1967 from Graz; it is one of the nine ORF-Landesradios that together form the most-listened-to radio family in Austria, traditionally serving an older audience with strong regional identity, agricultural and tourism reporting, charity drives (Licht ins Dunkel), and live coverage of regional politics and culture; the broadcaster is governed by the ORF-Stiftungsrat and is constitutionally required to be politically independent though its supervisory bodies have historically been the subject of debate over party-political influence
  sources: https://steiermark.orf.at/player/, internal knowledge
