  nature: commercial
  operator: Distributed via TOP-Radio (top-radio.ru) Russian streaming aggregator; the stream itself is hosted on the MyRadio24 platform, suggesting an independent operator
  affiliations: No formal political, governmental, or party affiliation declared; the format is explicitly nostalgic toward the Soviet era as a cultural/musical theme
  audience: Russian-speaking listeners across the post-Soviet space (Russia, CIS) and Russian diaspora; older adults nostalgic for the USSR period
  format: Soviet-era retro — classic Soviet estrada, official Soviet hits, patriotic and folk songs of the 1950s–1980s; periodic vintage station idents such as "Говорит радиостанция Советского Союза"
  notes: "\"Радио СССР\" (Radio USSR) is a Russian internet-only nostalgia station dedicated to music and audio culture of the Soviet Union era, including estrada singers (Alla Pugacheva, Iosif Kobzon, Eduard Khil, Muslim Magomayev), VIAs (Pesnyary, Zemlyane), Soviet film music, and patriotic songs; the station is presented through the TOP-Radio aggregator with the framing \"Слушайте Радио СССР онлайн бесплатно... в прямом эфире, в хорошем качестве без регистрации\" and runs on the MyRadio24 hosting platform. While the branding evokes the USSR State Radio identity, it is a private retro project rather than a state broadcaster; the Russian government's actual all-news/talk radio successor to Soviet state broadcasting is the separate Vesti FM / Radio Rossii under VGTRK."
