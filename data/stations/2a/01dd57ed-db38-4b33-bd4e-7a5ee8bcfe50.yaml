  notes: Radio Sevilla is one of the oldest radio stations in Spain — it began broadcasting on 4 February 1925 (founded by the Asociación Radio Sevilla) as call-sign EAJ-5, making it among the country's pioneer commercial broadcasters; it was a founding affiliate of Unión Radio (1925), which evolved into Cadena SER, today Spain's largest private radio network; Cadena SER has been owned by Grupo PRISA since the mid-1980s, with international investments (Vivendi, Telefónica and others) at various times; Sevilla's main FM frequency is 103.2 MHz.
