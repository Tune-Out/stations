  notes: WRCN-FM broadcasts on 103.9 MHz licensed to Riverhead, New York, and brands itself "LI News Radio", serving eastern Long Island from studios at Long Island MacArthur Airport in Ronkonkoma. It is owned by JVC Broadcasting and adopted the news/talk format in December 2013 after decades as a music station. Programming combines local Long Island talk with network feeds from ABC News Radio, Fox News Radio and Westwood One, and the transmitter is at Manorville.
