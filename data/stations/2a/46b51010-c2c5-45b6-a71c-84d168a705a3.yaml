  notes: XEG-AM 1050, branded La Ranchera de Monterrey, is a heritage Mexican AM station in Monterrey, Nuevo León that first went on the air in 1944. The concession is held by La Voz de Norteamérica, S.A. de C.V. and the station is operated by Núcleo Radio Monterrey. Its format is classic ranchera and traditional regional Mexican music in Spanish, a specialist heritage format it has carried for decades. XEG is a high-power AM signal historically audible across much of northern Mexico and the southern United States at night, and the group also runs a sister FM outlet branded La Ranchera de Monterrey on XHCHL 90.1. It is advertising-funded.
