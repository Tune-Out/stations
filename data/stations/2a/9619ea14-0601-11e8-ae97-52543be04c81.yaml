  notes: Radio 105 is a national Italian commercial radio network founded in 1976 in Milan as Radio Studio 105 and headquartered in Milan. It was built into a national network by the Finelco group (Hazan family) and has been owned since 2016 by RadioMediaset, the radio arm of MFE-MediaForEurope (the Berlusconi family's Mediaset), alongside Virgin Radio Italia, Radio Monte Carlo and R101. The format is contemporary hit radio with pop and urban music, and the network is best known for the irreverent comedy show Lo Zoo di 105 with Marco Mazzoli. It broadcasts on FM across Italy and Monaco, DAB+, satellite and online; the 105.net site also hosts many themed web channels.
