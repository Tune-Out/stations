  format: News, talk, public service, religious, cultural, agricultural and entertainment programming on medium wave (AM)
  notes: Radio Pakistan Multan is a regional station of the Pakistan Broadcasting Corporation (PBC), the state broadcaster founded in 1947 from the assets of the All India Radio stations that fell within Pakistan at partition; the Multan station serves South Punjab including the Multan, Bahawalpur and Dera Ghazi Khan divisions, broadcasting in Urdu, Saraiki and Punjabi; PBC operates under the Ministry of Information and Broadcasting and carries the official news bulletins; medium-wave (AM) signal historically had wide rural coverage across the Punjab plains.
