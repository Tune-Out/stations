  operator: Diyanet İşleri Başkanlığı (Presidency of Religious Affairs of the Republic of Türkiye), a constitutionally established state institution under the Presidency of Türkiye
  affiliations: Sunni Hanafi Islam as administered by the Turkish state; directly tied to the Turkish government; no party affiliation but its leadership is appointed by the President of Türkiye
  audience: Turkish-speaking Muslims in Türkiye and the diaspora, with secondary content for the broader Muslim world
  format: Quranic recitation, calls to prayer, religious lectures, sermons, mevlid and ilahi (Islamic devotional music), interviews with imams and scholars, and Diyanet programming
  notes: Diyanet Radyo launched in 2009 as the official radio arm of the Diyanet; broadcasts on FM in several Turkish cities, DAB+ and online; programmes follow the Diyanet's mainstream Sunni Hanafi orientation and provide ezan times, weekly Friday khutbah and educational content; sometimes criticised by secular and minority-faith voices as an extension of state religious authority, though Diyanet positions itself as serving "national and spiritual values."
