  notes: Kiss FM is a Romanian commercial hit-radio network broadcasting on 96.1 MHz in Bucharest and 100.9 MHz in Chișinău, Moldova. The Bucharest operation dates to 1990 and took the Kiss FM name on 5 November 2003 when the former Radio Contact was rebranded; the Moldovan service started in 1998. Since 23 December 2013 it has been owned by ANT1 Group, the Greek Antenna Group, which also runs its Romanian sisters Magic FM and Rock FM. Its format is Top 40 built around dance, electronic and pop, and from February 2012 to November 2021 it compiled the Airplay 100, Romania's national singles chart. The previous note attributing it to "Kiss Media" was incorrect.
