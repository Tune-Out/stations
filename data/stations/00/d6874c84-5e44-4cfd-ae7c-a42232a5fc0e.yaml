  nature: public broadcaster
  operator: Norddeutscher Rundfunk (NDR), the regional public-service broadcaster for Hamburg, Lower Saxony, Schleswig-Holstein and Mecklenburg-Vorpommern; an ARD member institution under public law.
  affiliations: NDR is funded primarily by the German broadcasting licence fee (Rundfunkbeitrag), governed by inter-state treaty (NDR-Staatsvertrag) and politically independent under federal media law; member of ARD and EBU. No religious or party affiliation.
  audience: Schleswig-Holstein-specific public-radio listeners interested in news, current affairs and regional politics; German-language with Plattdeutsch (Low German) content
  format: All-news, current-affairs and information radio with Schleswig-Holstein-regional opt-out windows (state news, politics, weather, culture).
  notes: NDR Info Schleswig-Holstein is a regional sub-feed of NDR Info, the all-news channel founded in 1994. The Schleswig-Holstein opt-out feed carries dedicated Landespolitik (state-government) coverage from the Kiel Landeshaus, regional culture, North Sea/Baltic coastal news, and traffic/weather for the northernmost German state. It also broadcasts the only daily news in Plattdeutsch (Low German), the regional language, and NDR Info maintains a long-standing reputation for in-depth journalism (e.g. STRG_F investigative team and Panorama). Broadcasts on FM, DAB+ and online.
  sources: internal knowledge of NDR / ARD; homepage not provided
