  nature: commercial
  operator: RTL Group / M6 Group (Groupe M6). Fun Radio is part of the RTL/M6 French radio division; following the failed 2022 RTL-TF1 merger, RTL France's radio assets (RTL, RTL2, Fun Radio) were sold to and integrated under Groupe M6 (which itself is majority-owned by RTL Group/Bertelsmann).
  affiliations: Privately owned commercial broadcaster, advertising-funded. No governmental, religious, or political affiliations.
  audience: Young adults (typically 15-34 demographic) in France, French-speaking
  format: Dance, electronic, EDM and contemporary hit radio with DJ-led shows; tagline historically "Le Son Dancefloor"
  notes: Launched 1985 (initially as a free local radio); became a national network. Known for its long-running flagship dance/EDM programming and the morning show "Bruno dans la Radio". Was at the centre of a 2015 ratings scandal where Médiamétrie sanctioned Fun Radio for manipulating audience measurement. Major player on French DAB+ and FM.
