  notes: Smooth Radio is one of the UK's biggest commercial radio brands, owned by Global since 2012 (with three regional FM licences franchised to Communicorp UK) and reaching 7.4 million weekly listeners according to RAJAR Q2 2026, making it the UK's third-largest commercial brand after Heart and Capital. It grew out of Jazz FM and GMG's Smooth FM in the 2000s and now broadcasts nationally on DAB with regional FM/AM variants and localised news and ads. The relaxing adult-contemporary format features presenters such as Myleene Klass and Kate Garraway and the annual All Time Top 500 countdown. This entry's stream is the East Midlands regional feed (SmoothEastMids, 48 kbps AAC); the catalog's smooth-jazz tag is inaccurate for today's format.
