  notes: RMC 80 is one of roughly two dozen web channels spun off from Radio Monte Carlo, the Italian adult-contemporary station that trades on the slogan "Musica di Gran Classe" and is operated by RadioMediaset within MFE - MediaForEurope, the group formerly known as Mediaset. The channel plays a continuous automated 1980s playlist with no presenters. Its siblings on the same platform include RMC 90, RMC Jazz, RMC Italia, RMC Love Songs, RMC Disco Funk and RMC Buddha Bar. It is an ordinary themed spin-off rather than a station with its own editorial identity.
