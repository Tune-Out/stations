  operator: Privately owned regional commercial broadcaster based in Thessaloniki (Metropoleos 34); licensed under Greece's National Council for Radio and Television (ESR)
  affiliations: none known (no religious, political or state-broadcaster ties)
  audience: Greek-speaking adult listeners in Thessaloniki and Central Macedonia, with a focus on lovers of Greek art song / éntechno music
  format: Greek "éntechno" / art song format - established classical Greek-language repertoire and emerging Greek artists, branded as a curator of Greek art music
  notes: Melodia 98 (Μελωδία Θεσσαλονίκης 98) broadcasts on 98.0 FM in Thessaloniki and brands itself "το κορυφαίο ραδιόφωνο του έντεχνου ρεπερτορίου στην Ελλάδα" ("the leading station of art-music repertoire in Greece"); programming centres on two pillars - canonical Greek éntechno composers (Hadjidakis, Theodorakis, Markopoulos, Spanos, etc.) and a "Voices of Today" segment showcasing contemporary Greek songwriters; the live24.gr URL is its streaming aggregator host, not an ownership link.
