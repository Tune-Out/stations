  operator: Renascença - Comunicação Multimédia, Lda., the multimedia arm of the Rádio Renascença group owned by the Portuguese Catholic Church (Conferência Episcopal Portuguesa).
  affiliations: Catholic-owned media group (Rádio Renascença) but RFM itself operates as a non-confessional secular music station; no political party affiliation.
  audience: Portuguese mainstream 25-54 adult-contemporary audience; available nationwide on FM across Portugal and internationally via SAPO/streaming.
  format: Adult contemporary / hot AC — current Portuguese and international pop hits plus recent classics; signature shows include the "RFM Manhã" morning programme.
  notes: Launched on 6 December 1987 as the Rádio Renascença group's pop-music sister to its talk-oriented flagship; for decades has been among Portugal's top-rated commercial music stations, regularly leading Bareme Rádio audience surveys; runs major brand events such as the "RFM SOMNII — O Maior Sunset do Mundo" beach festival in Figueira da Foz and the "RFM Bola de Berlim" summer campaign; despite being part of a Catholic-Church-owned holding it carries mainstream advertising and pop programming rather than religious content, with the Catholic-focused output reserved for sister station Rádio Renascença; the group also operates Mega Hits and the news outlet Renascença.pt.
  sources: internal knowledge
