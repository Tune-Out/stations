  notes: Radio Złote Przeboje ("Golden Hits Radio") is one of the largest commercial radio networks in Poland, broadcasting on FM in over 30 cities and nationwide via internet and DAB+; founded in 2002 by Agora S.A. (a major Polish media company also publishing the daily Gazeta Wyborcza and operating Wyborcza.pl, TOK FM, and Radio Pogoda); the station's format focuses on adult-friendly mainstream hits from the 70s, 80s, 90s, and 2000s including Polish-language classics by artists such as Maryla Rodowicz, Czesław Niemen, and Budka Suflera alongside international pop; Agora's media holdings make it one of Poland's largest private media groups, often characterised as centrist/liberal-leaning through Gazeta Wyborcza, but Złote Przeboje itself is a music-format station without political programming.
