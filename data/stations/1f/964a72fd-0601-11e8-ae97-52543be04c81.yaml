  notes: Polskie Radio Chopin is the classical music channel of Polish public broadcaster Polskie Radio, launched on 11 November 2017 in place of Polskie Radio Rytm. It is distributed on DAB+ (MUX-R3) and online, focuses entirely on classical music with special attention to Chopin and Polish composers, and has been led by editor-in-chief Piotr Matwiejczuk since 2024. The old moje.polskieradio.pl homepage is gone; the catalog already has a higher-voted canonical entry for the same channel.
