  notes: 云梦音乐台 ("Yunmeng Music Station") appears to be a small independent or hobbyist music stream hosted on the Qingting FM platform (stream ID 20500187 at lhttp.qtfm.cn). The "homepage" field actually points to a QQ group invitation (QQ group 849566628), suggesting the station maintains a listener community on Tencent QQ rather than a conventional website. No NRTA broadcast licence or corporate registration could be identified; the name "云梦" may reference Yunmeng County in Hubei or be a poetic "dream-cloud" branding. In China, all licensed radio is operated by state entities (Central People's Broadcasting Station / CNR, China Media Group, or provincial/municipal radio-and-television groups under Communist Party oversight), so non-state online "stations" of this type are typically curated user channels rather than formally regulated broadcasters.
