research:
  reviewed_at: 2026-06-09
  nature: public broadcaster
  operator: All India Radio (Akashvani) / Prasar Bharati (statutory autonomous public broadcaster of the Government of India)
  affiliations: Government of India (Prasar Bharati Corporation under the Ministry of Information and Broadcasting); ABU (Asia-Pacific Broadcasting Union) member
  audience: Mass Indian audience nationwide, primarily Hindi-speaking listeners across all age groups; widely heard for film music
  format: Light entertainment service centered on Hindi film songs (Bollywood), classical and folk music, light comedy, drama, sponsored programs and brief news bulletins
  notes: Launched 3 October 1957 as the "Vividh Bharati Seva" specifically to counter the popularity of Radio Ceylon's Hindi film music broadcasts. Branded as the "Light Entertainment Channel" of All India Radio. Iconic programs include "Hawa Mahal" (radio drama), "Bhule Bisre Geet", "Jaimala" and "Sangeet Sarita". Carries commercial advertising (one of the first AIR services to do so, since 1967) while remaining a state-funded public service. Broadcasts on MW, SW, FM in select cities, and via Prasar Bharati's streaming/Akashvani app.
  sources: internal knowledge only
