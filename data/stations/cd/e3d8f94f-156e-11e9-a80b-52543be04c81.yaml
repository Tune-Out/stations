  operator: VGTRK / ВГТРК (All-Russia State Television and Radio Broadcasting Company), the Russian Federation's state-owned media holding; the radiovesti.ru domain now redirects to VGTRK's smotrim.ru media portal (channel 199)
  affiliations: Russian Federal Government; United Russia / Kremlin editorial line; subject to EU, UK, Canadian and US sanctions following the 2022 invasion of Ukraine
  audience: Russian-speaking adult news listeners across the Russian Federation and CIS, plus international Russian-language diaspora
  format: 24-hour news, current affairs, political talk and analysis with rolling bulletins, expert interviews, parliamentary coverage, and military/foreign-affairs programming
  notes: Vesti FM (Вести ФМ) launched 5 February 2008 as VGTRK's all-news/talk radio brand, broadcasting on FM in Moscow (97.6 MHz) and across the wider VGTRK network including Saint Petersburg, regional capitals, and DAB+/satellite; flagship hosts have included Vladimir Solovyov, Sergey Mardan, Yevgeny Satanovsky, Anna Shafran, and Anatoly Kuzichev — figures widely identified as pro-Kremlin commentators; the EU added Vesti FM personalities (notably Solovyov) to its sanctions lists for spreading "anti-Ukrainian propaganda" and "disinformation about Russia's military aggression"; VGTRK itself is sanctioned by the EU Council (April 2022) and the UK as a "tool of Russian state propaganda"; programming has frequently been cited by EU vs Disinfo, EUDR and independent monitors for spreading Kremlin narratives on Ukraine, NATO, Western leaders and domestic dissent.
