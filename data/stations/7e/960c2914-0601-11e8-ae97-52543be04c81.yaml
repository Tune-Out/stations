  notes: RFI Afrique is the Africa-targeted stream of Radio France Internationale, the French public international broadcaster created in 1975 and owned since 2013 by the state company France Médias Monde alongside France 24 and Monte Carlo Doualiya. RFI broadcasts in French and 17 other languages and reached 105 million people weekly in 2025, half of them in Francophone Africa where it ranks first among international radios (Africascope 2025). The Afrique feed carries RFI's African news bulletins, political debates, sport and music. RFI has been suspended by military governments in Mali (2022), Burkina Faso (2022) and Niger (2023). The rfi.fr homepage blocks automated requests (HTTP 403) but is live.
