  nature: public broadcaster
  operator: Radio France Internationale (RFI), part of France Medias Monde (a French public broadcasting holding company, funded by the French state)
  affiliations: French government (public-service external broadcaster, similar role to BBC World Service or Deutsche Welle); editorial independence guaranteed by law
  audience: French-speaking African listeners across Sub-Saharan Africa (West, Central, East Africa); also Francophone diaspora
  format: Africa-focused dedicated stream of RFI — news, current affairs, African politics, music, sport, magazines and reports about and for Africa, in French
  notes: RFI Afrique is RFI's flagship African service, one of the most listened-to international radio brands in Francophone Africa with tens of millions of weekly listeners. RFI also broadcasts in regional African languages (Hausa, Mandingo, Swahili, Fulfulde). Banned/suspended at various times by military juntas in Mali (2022), Burkina Faso (2023) and Niger (2023). Part of France Medias Monde alongside France 24 and Monte Carlo Doualiya.
