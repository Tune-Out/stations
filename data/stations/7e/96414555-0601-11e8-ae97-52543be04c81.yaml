  notes: Radio Aswat is a private Moroccan generalist station headquartered at the Ghandi Mall in Casablanca. It received its HACA licence in 2006 and put out its first programmes on 13 February 2007, operated by the company La Marocaine de Radio et de Broadcast. Broadcasting mainly in Moroccan Arabic with some French, it carries news, service, entertainment and educational programming rather than a single music format. With around 2.5 million listeners it ranks among Morocco's three largest generalist networks, and it distributes on FM, DAB+, satellite, IPTV, streaming and podcast under the RDS identifier ASWAT.
