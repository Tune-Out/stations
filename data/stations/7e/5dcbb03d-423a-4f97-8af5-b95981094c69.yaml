  notes: Saudade FM broadcasts on 99.7 MHz from Santos in the Baixada Santista region of São Paulo state and calls itself Brazil's biggest flashback station. It has run since around 2007 on a nostalgia format of Brazilian and international hits from the 1960s to the 1990s, with named presenters including Thiago Ferraz, Adriana Lima and David Rangel. Signature programmes are Conexão Saudade in afternoon drive, Embalos da Saudade on Saturday nights and the sertanejo spin-off Saudade Sertaneja. Beyond FM it distributes through its own apps, smart TVs, voice assistants and Claro Net TV channel 300.
