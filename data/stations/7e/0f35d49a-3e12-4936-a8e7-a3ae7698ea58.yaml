  notes: El Gouna Radio serves the coastal resort town of El Gouna, located on the Red Sea approximately 25 km north of Hurghada in Egypt. El Gouna is an upscale residential and tourism destination developed by the Samaha Group starting in 1989, known for water sports, diving, and luxury accommodations. The radio station serves the transient guest population and expat community with mixed-language programming. Streams via direct IP at 128 kbps MP3. The station website at elgounaradio.com is minimal, typical of local resort radio operations. GPS coordinates indicate broadcast origin near the resort.
