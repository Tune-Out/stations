  nature: community
  operator: '"DarkAmbient" — an independent hobbyist/community administrator running darkambientradio.de from Germany.'
  affiliations: none known; loose affinities with the underground dark-ambient and post-industrial scene; advocates artist co-ops (anti-Bandcamp-style commercial platforms).
  audience: Niche dark-ambient and deep-ambient music fans, primarily European; small dedicated listenership (~60-listener stream cap, ~900 registered forum members).
  format: 24/7 dark ambient and deep ambient — drones, soundscapes, ritual ambient; artists like Desiderii Marginis, raison d'être, Sabled Sun in rotation.
  notes: A long-running community webradio supporting independent dark-ambient artists; releases compilation series "Dark Ambient Radio Vol. 1-4" with proceeds going to contributing artists ("All money goes to the contributing artists (after taxes, of course)"). Operates as a passion project; site has noted ongoing technical/relocation work in 2025.
  sources: http://www.darkambientradio.de/news.php, internal knowledge of dark-ambient webradio scene
