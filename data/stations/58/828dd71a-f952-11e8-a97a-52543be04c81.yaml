  affiliations: none (independent; donations and merchandise only; commercial-free)
  audience: international electronic-music enthusiasts, particularly fans of progressive trance and classic house
  format: commercial-free 24/7 progressive house and trance, focused on "the purest form of Trance popularized by Paul Van Dyk and Hardfloor" along with contemporary progressive tracks; featured artists include Voyager, Deepsky, and G Pal
