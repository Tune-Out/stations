  operator: South African Broadcasting Corporation (SABC), the state-owned public broadcaster of South Africa
  affiliations: SABC (statutory public broadcaster, accountable to South African Parliament); no party-political or religious affiliation
  audience: Sesotho-speaking and -understanding population of South Africa (primarily Free State, Gauteng, and other Sesotho regions); national reach
  format: 'Full-service Sesotho-language public radio: music (including a Top 30 chart "Tse Ratwang"), news, current affairs, talk, drama (e.g. soap opera "Monyaka"), and lifestyle programming'
  notes: Originally launched 1 June 1960 as "Radio Sesotho", later renamed Lesedi FM ("Lesedi" means "Light" in Sesotho). One of the SABC's 11 official-language African radio stations and consistently among South Africa's most-listened-to radio stations (cited as ranking ~4th nationally). The station describes itself as "broadcasting in Sesotho for Sesotho speaking and understanding people of South Africa." Funded by a mix of TV licence fees, advertising, and government grants typical of SABC stations.
