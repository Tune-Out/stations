  format: 'Full-service Sesotho-language public radio: music (including a Top 30 chart "Tse Ratwang"), news, current affairs, talk, drama (e.g. soap opera "Monyaka"), and lifestyle programming'
  notes: Lesedi FM is the SABC's Sesotho-language public service station, launched 1 June 1960 as Radio Sesotho and broadcasting from Bloemfontein on 87.7-106.6 FM across seven provinces. It is the largest Sesotho station and roughly the fourth-largest radio station in South Africa, with about 3.5 million listeners and a 62% audience share in the Free State. The full-service schedule mixes music (including the Tse Ratwang Top 30), news, current affairs, talk and drama; SABC is funded by TV licences, advertising and government grants.
