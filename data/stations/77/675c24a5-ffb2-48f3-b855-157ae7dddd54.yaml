  nature: public broadcaster
  operator: Nederlandse Publieke Omroep (NPO), the umbrella organisation of the Dutch public broadcasting system; programming produced principally by NTR (and historically AVRO/AVROTROS, VARA/BNNVARA, VPRO)
  affiliations: Funded by the Dutch government via the Ministerie van Onderwijs, Cultuur en Wetenschap and the NPO licence framework; no party-political or religious affiliation
  audience: Dutch-speaking adult listeners with a taste for jazz, soul, blues, funk, gospel and Latin music
  format: Specialty public-radio music network devoted to soul and jazz (broadly defined to include blues, funk, world, Latin and related Black music traditions), with presenter-led shows and live concert recordings.
  notes: NPO Radio 6 Soul & Jazz launched in 2007 as a dedicated jazz/soul channel within the Dutch national public-radio family (the renumbered successor of niche music streams that previously aired on Radio 5/Radio 6). It lost its national FM allocation in 2014 and its DAB slot in 2016, surviving since as an online and DAB+ stream produced primarily by NTR with contributions from BNNVARA and VPRO. Hosts have included Co de Kloet, Jan Douwe Kroeske, Frank Jochemsen and the late Han Reiziger; the brand has long been associated with the North Sea Jazz Festival broadcasts.
