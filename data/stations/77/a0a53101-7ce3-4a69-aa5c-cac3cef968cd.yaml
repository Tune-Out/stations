  operator: Antena Zagreb d.o.o. (a private Croatian commercial radio company holding the local FM concession for Zagreb)
  affiliations: none known religious or political; commercial pop/rock format with conventional advertising and promotional partnerships
  audience: Greater Zagreb metropolitan area; Croatian-speaking general adult/young-adult audience
  format: Adult contemporary / pop & rock mix with strong Croatian content; emphasises local Croatian artists alongside international hits; talk segments primarily in entertainment/lifestyle morning and drive shows
  notes: Antena Zagreb is a long-running Zagreb-area commercial FM station broadcasting on 89.7 MHz; its programming includes shows such as the "Jutarnji Show" (morning), "Prijepodne", "Poslijepodne" and "Afterwork", and the station leans on the slogan "Ti slušaš nas, a mi slušamo tebe" ("You listen to us, and we listen to you"); it is regulated by Croatia's Agency for Electronic Media (AEM/HAKOM) and operates as a private licensee distinct from public broadcaster HRT.
