  notes: 'Tes3enat FM is the Egyptian online station that brands itself 90s FM: its Icecast metadata reports the mount as "90sFM Stream" in the "90s" genre with the station URL news.ninetiesfm.com. The name is the colloquial Egyptian transliteration of تسعينات, "the nineties", and the format is a continuous run of Arabic and Egyptian pop from that decade. It is web-only with no terrestrial licence, distributed through TuneIn and other aggregators, and the catalog entry carries no homepage of its own. The "classical" tag in the catalog is a misclassification. Two lower-vote "90s FM" rows in this catalog are the same broadcaster on a different host.'
