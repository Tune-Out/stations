  operator: Radio Record (ООО "Радио Рекорд") — major Russian commercial dance-radio network headquartered in St. Petersburg, founded by Andrey Eleshin (Andrey Lavrov), Michail Kozlov and Andrey Matveev in 1995.
  affiliations: none known politically or religiously; private commercial broadcaster; widely heard across the Russian Federation.
  audience: Young Russian-speaking adults (18-34) who follow electronic dance music; this sub-stream targets the deep-house segment.
  format: 24/7 deep house and house — atmospheric, lounge-leaning electronic music; minimal speech; part of Radio Record's large family of genre sub-stations.
  notes: Radio Record is one of Russia's most influential dance-music brands and operates over 80 themed online sub-channels (Deep, Trance, Techno, Russian Mix, Pirate Station, etc.) alongside its FM network in many Russian cities. The flagship FM frequency in St. Petersburg is 106.3 MHz. The "Deep" stream offers continuous deep house with rotation from international names like Lane 8, Yotto, Tinlicker and Russian deep-house producers; it is one of the most-listened sub-streams in the Record family.
  sources: https://www.radiorecord.ru/station/deep, internal knowledge of Radio Record Russia
