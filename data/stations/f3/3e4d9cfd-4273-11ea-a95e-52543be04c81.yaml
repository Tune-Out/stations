  format: General-interest news/talk with national COPE network programs, sports, opinion and Catholic religious content plus local Albacete windows.
  notes: COPE Albacete is the local affiliate in Albacete (Castilla-La Mancha) of Cadena COPE, Spain's second-largest commercial radio network. COPE (Cadena de Ondas Populares Españolas) was founded in 1959 by the Spanish Episcopal Conference and is owned by Radio Popular S.A., whose principal shareholders are the Conferencia Episcopal Española (over 50%) and Spanish Catholic religious orders (Dominicans, Jesuits and others). The network's "ideario" expressly commits it to serving the common good of Spanish society "desde su vocación de medio católico, comercial y generalista" and the chain is generally seen as centre-right / conservative in editorial line. Flagship national programs include "Herrera en COPE" (mornings, Carlos Herrera), "La Linterna" (evenings, Ángel Expósito), "Tiempo de Juego" (sports) and "La Mañana Fin de Semana". COPE Albacete broadcasts on local FM with regional opt-outs ("Mediodía COPE en Albacete") and Albacete Balompié football coverage.
