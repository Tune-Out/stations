  notes: DYFM Bombo Radyo Iloilo, broadcasting on 720 kHz AM from Iloilo City, is the flagship Visayan station of the Bombo Radyo Philippines network, which describes itself as "the No1 Radio Network in the Philippines" with "50 years of painstaking hard work, dedication, determination and perseverance"; the network operates from "24 key cities and provinces nationwide" with a hard-news and current-affairs focus, sister to other Iloilo-based outlets like Star FM; in 2020 Bombo Radyo Philippines faced equipment seizures in Iloilo and elsewhere during a tax-and-permits dispute that the network characterized as press-freedom concerns.
