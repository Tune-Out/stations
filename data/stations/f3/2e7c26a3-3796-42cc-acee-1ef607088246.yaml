  nature: state media
  operator: Établissement de la Radio Tunisienne / مؤسسة الإذاعة التونسية (Tunisian Radio Establishment) — the Tunisian state public-service radio corporation
  affiliations: Tunisian government / state public broadcaster; member of the Arab States Broadcasting Union (ASBU); historically aligned with national-language Arabic public service
  audience: Tunisian national audience; primarily Arabic-speaking (Tunisian Arabic / Modern Standard Arabic), with some French content via sister stations
  format: General-interest national public radio — news bulletins, talk and cultural programming, religious content, classical Arabic music, and entertainment
  notes: Flagship national channel of Tunisia's public broadcaster, descended from the pre-independence Radio Tunis (founded 1938 under the French Protectorate) and reorganised after independence (1956) as the Tunisian state radio; sister channels under the same Établissement include Radio Tunis Chaîne Internationale (RTCI, French/multilingual), Radio Jeunes (youth), Radio Culturelle, Radio Coran (Quran), and a network of regional stations (Sfax, Monastir, Le Kef, Gafsa, Tataouine, Kasserine); broadcasts in Arabic with notable cultural programming such as "حديث القصور" (Palace Discourse) and "صباح التوانسة" (Tunisian Morning); the broadcaster has been a focus of post-2011 debates about editorial independence from the Tunisian government following the Jasmine Revolution.
  sources: http://www.radionationale.tn/, internal knowledge of the Tunisian public broadcasting system
