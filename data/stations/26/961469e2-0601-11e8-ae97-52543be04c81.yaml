  operator: France Maghreb 2 SAS — part of the "Les Indés Radios" independent French radio grouping
  affiliations: Editorial focus on Franco-Maghrebi cultural and Islamic affairs; not formally tied to any party, government, or religious institution but features dedicated Islamic programming ("Parler Islam")
  audience: French and Maghrebi diaspora listeners (Algerian, Moroccan, Tunisian descent) in metropolitan France; Muslim and culturally Franco-Arab adult audience
  format: French-language news, talk, debate and music — current affairs from France, the Maghreb and the Arab-Muslim world, plus cultural, religious, women's, and lifestyle programming
  notes: France Maghreb 2 launched in 2007 broadcasting on 99.5 MHz FM in Île-de-France (Paris region); the "Province" stream extends national coverage online and on DAB+. Notable programming includes "La matinale", "Le Grand Forum", "Parler Islam" and "Parler Femmes". The station positions itself as the principal bridge media for the Franco-Maghrebi community in France, covering integration, identity, news from the Maghreb, and debates on issues affecting French Muslims. Distributed via Les Indés Radios, a commercial cooperative of ~130 independent French stations that pools national ad sales.
