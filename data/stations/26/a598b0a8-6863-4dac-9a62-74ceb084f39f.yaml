  nature: public broadcaster
  operator: Radio Taiwan International (中央廣播電臺 / Central Broadcasting System), a public foundation under the Republic of China (Taiwan)
  affiliations: government of the Republic of China (Taiwan); funded primarily through the Ministry of Culture; politically aligned with Taiwan's official national positions; no religious or party affiliation
  audience: Global overseas audiences plus listeners in mainland China, Hong Kong, Macau and overseas Chinese diaspora; programs in Mandarin, Cantonese, English, Japanese, Korean, French, Spanish, German, Russian, Thai, Vietnamese, Indonesian and other languages
  format: International public-service broadcasting — news, current affairs, Taiwanese culture, language lessons, cross-strait analysis and music; "RTI3" channel typically carries music / lifestyle programming
  notes: Radio Taiwan International (RTI), branded in Chinese as 中央廣播電臺 ("Central Broadcasting System") and 臺灣之音 ("Voice of Taiwan"), traces its history to 1928 when it was founded in Nanjing by the Kuomintang government as the Central Broadcasting Station, relocating to Taiwan after 1949; it was reorganised in 1998 as a non-departmental public foundation funded by the Taiwanese government and is Taiwan's primary international broadcaster, historically used during the Cold War for shortwave propaganda toward mainland China and now positioned as a soft-power outlet promoting Taiwan's democracy, culture and views on cross-strait relations.
  sources: https://www.rti.org.tw/, internal knowledge of Radio Taiwan International / Central Broadcasting System
