  operator: Arabeskin Merkezi FM (privately owned Istanbul-based broadcaster; specific ownership not publicly disclosed)
  affiliations: none publicly stated (no party, religious denomination or government tie); operates under RTÜK (Türkiye's Radio and Television Supreme Council) licence as a private broadcaster
  audience: Turkish-speaking listeners with an affinity for arabesk and arabesk-fantazi music; primarily working-class and traditionalist audience in Istanbul and surrounding provinces, plus diaspora online listeners
  format: 24-hour arabesk and arabesk-fantazi music with DJ-presented show blocks ("Kaanla Arabesk Rüzgarı", "Mehmet'le Damardan Kalbe", "İstek Saati" request hours, "Sabah Şekeri" breakfast show, "Geceye Dair En Baba Şarkılar" overnight)
  notes: Broadcasts on 102.1 MHz FM in the Istanbul region with simulcast online; arabesk is a Turkish urban genre originating in the 1960s-70s, associated with rural-to-urban migrant audiences and singers such as Orhan Gencebay, Müslüm Gürses, Ferdi Tayfur and İbrahim Tatlıses, and has historically been treated by Turkish governments and the public broadcaster TRT with cultural ambivalence (it was largely banned from state radio/TV until the late 1980s); the station's slogan "TIKLA İNDİR VE BİZİ KESİNTİSİZ DİNLE" ("Click, download and listen to us without interruption") emphasises its mobile-app distribution strategy
  sources: https://www.arabeskinmerkezi.com/, internal knowledge of Turkish arabesk music and RTÜK-licensed FM broadcasting
