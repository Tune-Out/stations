  operator: Unity 101 Community Radio (voluntary organisation, not commercial)
  affiliations: holds a UK Ofcom community radio licence; serves South Asian and ethnic minority communities; no religious or political party affiliation
  audience: Asian and ethnic minority communities in Southampton, UK (broadcast in Hindi, Gujarati, Punjabi, English and other community languages); catalog country tag "India" reflects language not location
  format: South Asian music, ethnic and community programming including a daily Community Hour, plus weekend Chinese, Afghan, Polish and Black-music shows
  notes: Originally known as Unity 24 (a short-term restricted service licensee), the station was awarded a five-year community radio licence and began permanent broadcasting on 8 December 2005 on 101.1 FM in Southampton; its mission is to "promote and broadcast music and culture of the Asian & ethnic communities of Southampton, and to provide the training and skills required so volunteers and listeners are better able to participate more fully in a cohesive society."
