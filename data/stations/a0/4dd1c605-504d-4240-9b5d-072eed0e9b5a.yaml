  operator: PT Radio Wijaya FM (Indonesian commercial radio license-holder); broadcasting from Jl. Perak Timur 20, Surabaya 60164
  affiliations: includes Islamic religious programming (e.g. "Surya Kebenaran," Ramadan content) but no declared political party or formal religious-organisational affiliation
  audience: Adult Indonesian-speaking and Javanese listeners in Surabaya and East Java (Jawa Timur); strong skew toward middle-aged and older audiences for dangdut, keroncong, and langgam Jawa
  format: Mixed Indonesian popular and traditional music — dangdut, keroncong, langgam Jawa, pop Indonesia, plus nostalgia and Islamic-themed segments
  notes: Long-running East Java FM station licensed at 103.5 MHz Surabaya; programming centres on dangdut (popular Indonesian dance-folk music) and traditional Javanese keroncong / langgam, supplemented by Indonesian pop ("Indo POP"), nostalgia shows ("Bingkai Nostalgia"), and Islamic-religious content (especially during Ramadan); maintains a content hub website with news, lifestyle, and event sections; operates under Indonesian commercial broadcasting regulations enforced by KPI (Komisi Penyiaran Indonesia) and the Ministry of Communication.
