  operator: Qurango.net — an online Qur'anic broadcasting platform that aggregates dedicated reciter streams; the listed "homepage" phantomsw.com appears to be a stream-aggregator placeholder
  affiliations: Sunni Islam; centred on classical Egyptian Qur'an recitation tradition
  audience: Arabic-speaking Muslims worldwide who seek continuous recitation of one of the 20th century's most celebrated reciters
  format: 24/7 audio loop of Qur'an recitations (tilawat) by Sheikh Mustafa Ismail in the classical mujawwad style
  notes: Sheikh Mustafa Ismail (1905-1978) was a legendary Egyptian Qur'an reciter, often called the "Sheikh of Reciters" and one of the favorites of King Farouk and President Nasser; this stream is one of many single-reciter feeds offered by Qurango.net (the popular Saudi-hosted Qur'an radio portal), not an FM/AM broadcaster, and its "Egypt" country code reflects the reciter's nationality rather than a studio location.
