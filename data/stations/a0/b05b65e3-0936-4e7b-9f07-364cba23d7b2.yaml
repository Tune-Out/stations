  notes: 美国之音 is the Mandarin Chinese-language service of the Voice of America, founded in 1942 and broadcasting in Mandarin since 1941; funded by the U.S. Congress through USAGM (formerly the Broadcasting Board of Governors); long blocked and jammed in mainland China where its website and apps are firewalled; coverage focuses on Chinese politics, human rights, Tibet, Xinjiang, Hong Kong, Taiwan and US-China relations; the VOA Charter (PL 94-350) requires it to be "consistently reliable and authoritative" and to "present a balanced and comprehensive projection of significant American thought and institutions"; experienced significant turmoil under the second Trump administration in 2025 with USAGM funding cuts and staff furloughs.
