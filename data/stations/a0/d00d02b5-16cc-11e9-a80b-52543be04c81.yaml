  notes: 'Chocolate FM is an independent Spanish commercial music station based in Málaga, Andalusia, streaming worldwide alongside its local FM signal. The format is Latin-leaning CHR: reggaeton, Latin pop and trap, dembow, dance and international chart hits aimed at a young audience, under the slogan "¡Y dime que te gusta!". Streaming is delivered through Elite Comunicación at several bitrates — a 320k and 192k MP3 feed plus this 32k AAC+ mobile/low-bandwidth variant — and it is funded by advertising. This catalog entry is the canonical record for the Chocolate FM cluster, which also carries HD and standard-quality duplicate entries. The station''s website was live at the time of review.'
