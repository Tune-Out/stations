  notes: Globo Vintage broadcasts on 100.7 FM in Rome and across Italy on DAB+, positioning itself with the slogan "Questa è la storia!" ("This is the story!") around nostalgic curation of vintage charts, box-office data and music-video rankings. It sits in a crowded Italian vintage/oldies market alongside Radio Capital, m2o Cult, and Radio Zeta, but is locally focused on the Rome metropolitan area with a heritage-themed playlist and on-air branding centred on the 80s and 90s.
