  notes: WOSU-FM (89.7 FM, Columbus) is the NPR news and information station of WOSU Public Media, licensed to The Ohio State University, which received one of the first experimental radio licences in the country in 1920. Branded '89.7 NPR News', it is the only all-day NPR station in central Ohio, carrying Morning Edition, All Things Considered and the local call-in programme All Sides, with repeaters across Ohio; a sister service, Classical 101, runs on WOSA. Funded by listener contributions, underwriting and university support.
