  notes: Radio Bolivariana is the cultural radio service of the Universidad Pontificia Bolivariana, a Catholic university in Medellín. The AM station (1110 kHz) was inaugurated on 11 August 1948 and the FM service (HJA94, 92.4 MHz, 15 kW) launched on 1 December 1992, covering the Aburrá Valley metropolitan area. Programming is mainly classical, world, Colombian and popular music alongside specialised talk programmes on history, literature, geopolitics, architecture, philosophy and art, streamed 24 hours online.
