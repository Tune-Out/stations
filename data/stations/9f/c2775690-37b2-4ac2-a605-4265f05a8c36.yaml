  operator: Bayerischer Rundfunk (BR) — Bavarian Broadcasting, a member of the German ARD public-broadcasting consortium
  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland); public-law institution funded by the Rundfunkbeitrag licence fee
  audience: Classical music listeners across Bavaria, Germany and German-speaking Europe; available nationwide via DAB+, satellite and stream
  format: BR-Klassik — full-service classical music station with symphonic works, opera, chamber music, jazz crossover, plus magazine shows, concerts, news, and features on composers and performers
  notes: Bayerischer Rundfunk's classical channel was renamed from "Bayern 4 Klassik" to "BR-Klassik" in 2010 (the station's stream still carries the legacy "bayern-4" label); BR is one of nine regional ARD broadcasters, headquartered in Munich, founded in 1949 as a successor to the post-war Radio München and producing two house orchestras (Symphonieorchester des Bayerischen Rundfunks and Münchner Rundfunkorchester) plus the BR Chor; the station co-produces the BR-Klassik Label record imprint; controversies have centred on cost-driven cuts to FM coverage of classical programming around 2018, partially reversed after listener protests.
