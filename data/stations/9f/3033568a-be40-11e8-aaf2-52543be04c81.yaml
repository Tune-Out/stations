  notes: Weifang Music Radio is the FM 88.1 music channel (音乐之声) of Weifang Radio and Television in Shandong province, one of the broadcaster's four radio frequencies alongside News, Economics/Private Car and Traffic. The parent is a municipal state-owned media institution established on 17 April 2009 by merging the Weifang People's Broadcasting Station with Weifang Television under the Weifang Radio and Film Group. Programming is Mandarin popular music with local presentation, delivered here as an HLS stream via Qingting FM. Two other Weifang music-related rows exist in the catalog on different stream ids and none has more votes than this entry.
