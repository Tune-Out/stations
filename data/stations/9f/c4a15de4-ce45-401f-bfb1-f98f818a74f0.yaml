  nature: public broadcaster
  operator: Österreichischer Rundfunk (ORF) — Austria's national public-service broadcaster; regional studio Landesstudio Niederösterreich in St. Pölten
  affiliations: state-affiliated public broadcaster; funded via the Austrian ORF-Beitrag (formerly GIS licence fee); editorial independence safeguarded by the ORF-Gesetz, though political proportionality (Proporz) of the Stiftungsrat has been a recurring controversy
  audience: German-speaking listeners in the federal state of Lower Austria (Niederösterreich); skews 40+ regional audience
  format: Regional public-service full-service station — Austropop and Schlager music, regional news, traffic, weather, agriculture, culture and community service programming
  notes: ORF Radio Niederösterreich is the Lower Austrian regional channel of ORF, broadcast from the Landesstudio in St. Pölten on multiple FM frequencies covering the state (e.g. 95.5, 97.9, 102.1 MHz) as well as DAB+ and online streaming. The "HQ" stream refers to the high-quality (192 kbps) version. It is part of ORF's "Bundesland heute"/"Radio Bundesland" network of nine regional stations and is frequently the most-listened-to local station in Lower Austria.
