  notes: KNOW-FM 91.1 in Saint Paul is the flagship of the MPR News network, Minnesota Public Radio's news and talk service for Minneapolis-St. Paul. It signed on 1 July 1967 as KSJN-FM under Saint John's University and took the KNOW call letters in 1989. The station carries NPR staples (Morning Edition, All Things Considered, Fresh Air), MPR's own local news and talk programming, weekend shows such as This American Life and Radiolab, and BBC World Service overnight; it is non-commercial and listener-supported, affiliated with NPR, APM and the BBC.
