  notes: "Vuurland is a thematic online sub-stream of Studio Brussel (\"StuBru\"), VRT's alternative pop/rock youth radio brand; the channel originated as the radio extension of Linde Merckpoel and Otto-Jan Ham's TV programme \"Vuurland\" on Canvas/VRT, which spotlighted intimate, melancholic music; programmed as a 24/7 commercial-free digital stream alongside other StuBru side channels such as Hooray, De Tijdloze, Bruut, and #ikluisterbelgisch; part of VRT's public-service remit to provide diverse non-mainstream programming for Flemish audiences."
