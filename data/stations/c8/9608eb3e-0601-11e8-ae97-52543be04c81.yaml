  notes: Rai Radio 3 is RAI's national cultural channel, launched on 1 October 1950 as the 'Terzo Programma' on the model of the BBC Third Programme and renamed in 1975. It broadcasts classical music and opera, literature, history, philosophy, art, cinema and science, with signature programmes including Fahrenheit, Ad alta voce, Radio3 Scienza, Uomini e profeti and Wikiradio. Simona Sala became director in 2025, succeeding Andrea Montanari. It reached about 1.2 million listeners in Q3 2025 and is carried on FM, DAB+ and RaiPlay Sound, to which the old radio3.rai.it URL now redirects.
