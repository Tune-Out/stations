  affiliations: Statutory Israeli public-service broadcaster established by the Public Broadcasting Corporation Law 5774-2014; funded by the state budget after the abolition of the TV licence fee; EBU member; politically independent by law though periodically subject to government political pressure
  audience: Arabic-speaking citizens of Israel (primarily Israeli Arabs / Palestinian citizens of Israel) and Arabic speakers in the wider region; secondary audience of Arabic-speaking Jewish Israelis and Hebrew-speakers studying Arabic; broadcast on FM across Israel and online worldwide
  format: General-interest Arabic-language public radio combining news, current affairs, talk, cultural programming, music (Arab classical, Mizrahi, regional pop) and religious content for Muslim, Christian and Druze listeners
  notes: Makan ("Place"/"كان") was launched on 15 May 2017 as the Arabic-language arm of the newly created Kan corporation, replacing the previous Israel Broadcasting Authority's Arabic service "Reshet Dalet" (Network D, founded 1948); the brand encompasses Makan 33 television (since 2017), the Makan radio station and digital outlets, all produced in Arabic with editorial independence from Kan's Hebrew services; programming is aimed at Arab citizens of Israel and at projecting Israel's perspective to Arabic-speakers across the Middle East; the radio service operates from Jerusalem with additional studios in Nazareth and Haifa
