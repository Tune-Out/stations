  notes: DR P4 Østjylland (originally branded DR P4 Aarhus) is one of DR's 11 regional P4 stations and serves the East Jutland region from its studios in Aarhus; the P4 network is Denmark's most listened-to radio brand, mixing rolling regional content with shared national programmes; like all DR services it operates under a public-service charter and is editorially independent of government, with funding controlled by the Danish parliament; DR has, like other Nordic public broadcasters, periodically faced political pressure and budget cuts from successive governments.
