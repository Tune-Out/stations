  notes: "BritCom 3 is one of four \"BritCom\" channels (BritCom 1–4) under the British Comedy Radio brand operated by Pumpkin FM as part of its OTRN (Old Time Radio Network). Pumpkin FM is a long-running British internet radio operation specialising in nostalgic and heritage programming. Mission: \"For over 75 years, British radio comedy has made us laugh, think, and sometimes gasp at its wit... we bring you the very best classic sketches, sitcoms, and panel shows—timeless humour from the golden age of radio.\" Notable archived shows include Hancock's Half Hour, On the Buses, Beyond Our Ken, The Clitheroe Kid, and Steptoe and Son. Stream is hosted on AsuraHosting."
