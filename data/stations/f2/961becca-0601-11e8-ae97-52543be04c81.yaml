  nature: public broadcaster
  operator: Vlaamse Radio- en Televisieomroeporganisatie (VRT), Flanders' Dutch-language public broadcaster, owned by the Flemish Community of Belgium
  affiliations: Member of the European Broadcasting Union (EBU); funded primarily by a Flemish government management contract (beheersovereenkomst) plus limited advertising; politically independent under its public-service charter, governed by a board appointed proportionally by the Flemish Parliament
  audience: Dutch-speaking adults in Flemish Brabant province (capital Leuven and surrounding municipalities, plus the periphery around Brussels); broader Radio 2 reaches all of Flanders with regional split programming
  format: Adult contemporary mainstream pop, Flemish/Dutch-language hits ("Nederlandstalige muziek"), regional news, traffic, weather and community information — Belgium's most-listened-to radio network
  notes: Radio 2 is VRT's largest service by audience share (roughly 25–30% of Flemish radio listening) and operates five regional sub-channels (Antwerpen, Limburg, Oost-Vlaanderen, Vlaams-Brabant and West-Vlaanderen) that share a common national schedule but split for hyper-local news, weather and community segments; established in its current form in 1998 following VRT's reorganisation of the historic BRT/BRTN regional networks; programming flagships include "De Madammen", "Spits" and the annual fundraising marathon "De Warmste Week"
  sources: internal knowledge only
