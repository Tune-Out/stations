  notes: Iran International is a Persian-language satellite news channel launched in London on 18 May 2017 and owned by Volant Media UK Ltd; this entry is its radio/audio feed, which also goes out on shortwave into Iran. It is an opposition outlet strongly critical of the Islamic Republic and gained prominence covering the 2022 Mahsa Amini protests; Iran designated it a terrorist organisation in November 2022, staff were temporarily relocated to Washington in 2023 after police warnings, and a journalist was stabbed in London in 2024. Reporting by The Guardian and Wall Street Journal has tied its launch funding to Saudi Arabia, which management denies. Despite the IR country code it is based in the UK, not Iran.
