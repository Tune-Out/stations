  nature: public broadcaster
  operator: Österreichischer Rundfunk (ORF) — Austria's national public service broadcaster, established by the ORF-Gesetz (Broadcasting Act)
  affiliations: Statutorily independent; funded historically via the GIS licence fee and, since 2024, the ORF-Beitrag household contribution; supervised by the ORF Stiftungsrat (foundation council) with political influence over board composition having historically been a recurrent point of public debate
  audience: German-speaking adults across Austria with strong appeal to a cultured, well-educated, higher-income demographic; significant audience in Germany and Switzerland via stream
  format: Cultural and information radio — classical and contemporary music, in-depth news, science, literature, philosophy, religion, current affairs, radio drama, features and documentaries
  notes: Ö1 (Österreich 1) is ORF's flagship culture and information channel and one of the most respected cultural radio brands in the German-speaking world; on air since 1967 (succeeding earlier ORF/RAVAG programmes); flagship programmes include the morning journal "Morgenjournal", midday and evening "Journale" news bulletins, "Im Journal zu Gast", "Diagonal", "Radiokolleg", "Im Gespräch", "Ö1 Kunstsonntag" and extensive live classical concerts (including from the Vienna State Opera and Musikverein); ORF as a whole is subject to political-balance and impartiality requirements under Austrian law and has frequently been at the centre of debate over governmental influence on its supervisory bodies.
  sources: internal knowledge only
