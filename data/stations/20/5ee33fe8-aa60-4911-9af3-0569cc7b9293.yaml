  operator: Radio Rumbos C.A.; presidency Lic. Elsa Siciliano; operated together with the "Centro Nacional e Internacional de Información de NotiRumbos" news brand
  affiliations: independent of the Venezuelan state broadcaster; hosts a long-running Catholic show by Padre Marcos Linares; no formal party affiliation but has been a platform for critical commentary on Venezuelan politics, labour and judiciary
