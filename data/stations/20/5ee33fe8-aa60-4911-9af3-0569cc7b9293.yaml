  notes: One of the oldest Venezuelan AM stations, founded in 1947 on 670 kHz from Caracas, historically known for its sports and political coverage; in recent years its AM signal has been intermittent and it has shifted heavily to streaming and Zeno.fm; the homepage carries the strapline often heard on-air ("ardió Rumbos 670"), reflected in the tag; site claims well over a million visitors and significant interactive listener engagement.
