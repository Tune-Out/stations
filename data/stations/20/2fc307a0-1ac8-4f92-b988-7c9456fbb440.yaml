  nature: commercial
  operator: Infonet media d.d. / Svet24 media group (Slovenia); previously part of Salomon Group; the radio is closely linked to the Svet24 daily newspaper.
  affiliations: Associated charity "Fundacija preprosto blizu" (Simply Close Foundation); no formal political/religious affiliation.
  audience: Mass-market Slovenian-speaking audience nationwide; targets adults 18–49 with mainstream pop/rock.
  format: Hot adult-contemporary music with morning talk/comedy, news headlines, contests and charity drives. Multi-stream brand spans Radio 1 80-a, 90-a, ROCK, COUNTRY and Radio 1 SLO sub-channels.
  notes: Self-described as "Najbolj poslušan radio v Sloveniji" (most-listened radio in Slovenia). Founded 2008 through the consolidation of regional commercial stations into a national network; today reaches most of Slovenia via dozens of FM frequencies. Flagship morning programme is "Denis Avdić Show," a long-running comedy/entertainment show. Also runs "Šou domov" (afternoon drive) and morning news "Zjutranja kronika".
  sources: https://radio1.svet24.si/, internal knowledge of Slovenian commercial radio
