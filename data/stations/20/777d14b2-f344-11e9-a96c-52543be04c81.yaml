  notes: LOS40 Dance is a thematic sister station of LOS40, the Spanish top-40 network that began as the programme "Los 40 Principales" on Radio Madrid in 1966 and is owned by PRISA Radio, part of Grupo PRISA. The parent network reaches around 2.8 million daily listeners and targets a 12-30 audience with pop, dance, electropop and reggaeton across FM, DTT, streaming and apps; it dropped "Principales" from its name in 2016 and has franchised versions in ten countries. Dance is one of the network's digital-only spin-offs alongside LOS40 Classic and LOS40 Urban, delivering a non-stop automated rotation of dance, EDM, electro and house with no presenters. It is distributed through Triton Digital's StreamTheWorld.
