  notes: Classic 21 Route 66 is a presenter-free thematic webradio of Classic 21, the rock and pop station of RTBF, the public broadcaster of Belgium's French Community. Classic 21 launched on 1 April 2004 as the successor to Radio 21 and plays 1960s-90s anglophone rock; its Route 66 web channel spins country, Americana, blues, folk and rock'n'roll evoking the American road trip. RTBF is funded by a public grant plus limited advertising, and the webradio is available through RTBF Auvio and the rtbf.be radio player.
