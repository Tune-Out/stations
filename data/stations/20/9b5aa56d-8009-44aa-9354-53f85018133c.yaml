  notes: Radio Rai 2 is one of Italy's three national public radio stations operated by Rai (Radiotelevisione Italiana), the Italian public broadcasting corporation founded in 1944. Rai 2 historically served as the contemporary/pop music station of the three Rai networks (Rai 1 being general/news, Rai 3 being cultural). Programming focuses on Italian and international contemporary hits, entertainment, and light talk. Streams via Rai's dedicated streaming infrastructure at 256 kbps MP3. No political alignment despite periodic criticism from various Italian political factions. Rai operates under license from the Italian communications authority (AGCOM) and is funded by mandatory television licence fees. Strong audience reach across all Italian demographics.
