  audience: Older Dutch-speaking listeners (50-plus) in the city of Antwerp and surrounding municipalities; Flemish/Dutch-language
  format: Oldies and Flemish/Dutch-language popular music, including Schlager, French chanson and 1950s-70s pop, with listener-voted hit lists
  notes: Radio Minerva is a long-running local community radio in Antwerp broadcasting on 98.0 FM, established in 1981 as one of the first "vrije radios" (free radios) following Belgium's 1981 liberalisation of the airwaves; operated by a non-profit vzw with a membership model ("Word lid"), volunteer presenters, listener Top-1000 votes and community events such as bingo evenings and cafe meetups; features mascots Doris and Ray and a cooking segment by local personality Carl Wijckmans; the station has been a touchstone for the Antwerp Schlager and golden-oldies scene for over four decades.
