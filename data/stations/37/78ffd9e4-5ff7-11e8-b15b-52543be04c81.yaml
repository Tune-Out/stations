  notes: Couleur 3 is the alternative-music third channel of Radio Télévision Suisse (RTS), the French-language arm of public broadcaster SRG SSR, launched 24 February 1982 and produced in Lausanne. It programmes indie, electronic and urban music with irreverent humour for a young adult audience, and on 27 April 2023 made headlines by airing 13 hours of programming with AI-cloned presenter voices and ChatGPT-written scripts. RTS switched off FM at the end of 2024, so Couleur 3 is now DAB+, satellite and internet only. The catalog's 'RTS Couleur 3' entry with more votes is the same SRG SSR stream.
