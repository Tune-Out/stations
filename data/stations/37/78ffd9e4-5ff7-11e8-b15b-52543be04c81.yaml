  nature: public broadcaster
  operator: Radio Télévision Suisse (RTS), the French-language subsidiary of Swiss public broadcaster SRG SSR
  affiliations: state-affiliated/public — funded primarily by the Swiss federal radio/TV licence fee (Serafe) and limited advertising; politically independent under Swiss public-service mandate
  audience: French-speaking Switzerland (Romandie); skews youth, alternative, urban and student listeners
  format: Alternative / indie / pop / rock, electronic music, urban culture, humour and youth talk; one of Switzerland's most adventurous music stations
  notes: Launched on 27 September 1982 as the third programme of the French-language Swiss public radio (then RSR La Première / Espace 2 / Couleur 3), Couleur 3 is broadcast nationally on DAB+, FM (selectively) and online from Lausanne. The station is known for daring, sometimes provocative humour and music programming, and has occasionally been at the centre of Swiss media debates (e.g. controversies over satirical sketches such as the 2023 "K-Pop" skit which led to a public apology and internal disciplinary action).
