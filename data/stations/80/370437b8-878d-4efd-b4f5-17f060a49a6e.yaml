  notes: Originally launched in 1924 as URI/EIAR, Rai Radio 1 (formerly Programma Nazionale) is the oldest and most established Italian public radio network. Part of RAI Radio (alongside Radio 2, Radio 3, and other thematic channels). Funded by license fees (canone RAI) and advertising. Often broadcasts parliamentary sessions, Papal audiences, and major national events. RAI is supervised by a parliamentary commission and its board partly appointed by parliament, leading to recurring political-balance debates.
