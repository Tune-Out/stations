  nature: commercial
  operator: TAVR Media (ТАВР Медіа), one of Ukraine's largest private radio groups, headquartered in Kyiv
  affiliations: none known; private commercial broadcaster licensed by the National Council of Television and Radio Broadcasting of Ukraine; no party-political, governmental or religious ties (TAVR Media's ownership has historically been linked to Ukrainian businessmen and at times to investors connected with the Yanukovych-era political environment, though the group operates as a commercial enterprise)
  audience: Ukrainian mainstream pop-music listeners aged roughly 14–35; broadcast on FM in dozens of Ukrainian cities (Kyiv 96.4 etc.), plus online, mobile apps and RadioPlayer
  format: Contemporary hit radio (CHR) — current Ukrainian and international pop, dance, rock and hip-hop hits with the slogan "Тільки хіти!" ("Only hits!")
  notes: Launched on 6 October 2003 by the TAVR Media holding (which also operates Russkoye Radio Ukraine — later rebranded Radio Bayraktar after 2022 — Radio ROKS, Kiss FM, Radio Relax, Melodia FM, Nashe Radio and others), Hit FM became one of the country's leading mainstream music brands; flagship shows include the morning programme "Хеппі Ранок", the audience-voted countdown "Хітова Дюжина" and various artist-fronted strands; since Russia's full-scale invasion in February 2022 the station, in line with Ukraine's 2022 quota and language laws, has substantially increased the share of Ukrainian-language music and ceased airing Russian-language content from Russian artists, and has participated in joint nationwide news broadcasts ("Єдині новини") with other Ukrainian radio groups
  sources: https://www.hitfm.ua/, internal knowledge
