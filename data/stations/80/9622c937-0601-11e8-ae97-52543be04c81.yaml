  notes: ABC Radio Brisbane (callsign 4QR, 612 kHz AM) is the Australian Broadcasting Corporation's local radio station for Brisbane and Ipswich and the base for much of the ABC's Queensland programming. The ABC launched 4QR on 7 January 1938 (its predecessor 4QG dates to 1925, Queensland's first station); it moved to 612 kHz in 1978 and was rebranded from 612 ABC Brisbane to ABC Radio Brisbane in 2017. It broadcasts at 50 kW with local news, talkback, current affairs and emergency information, and is funded by the Australian government.
