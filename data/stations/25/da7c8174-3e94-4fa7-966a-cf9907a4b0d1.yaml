  notes: Dance FM is one of the flagship stations operated by RCS & RDS (Radiocom), Romania's major independent commercial radio broadcaster headquartered in Bucharest. RCS & RDS runs a portfolio of thematic and geographic stations including ProFM (pop/rock flagship), Varadero, Kiss FM Romania, Digi FM and others. Dance FM targets young adults (18-34) with contemporary electronic dance music and club culture. The station streams via RCS-RDS's own CDN (edge126.rcs-rds.ro) at professional bitrate. RCS & RDS was founded in 1996 and went public on the Bucharest Stock Exchange in 2002; it is currently owned by Mid Europa Partners (private equity). The group operates ~50+ stations across Romania and neighboring markets.
