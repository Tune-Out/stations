  notes: Radio Monte Carlo (RMC) was originally founded in 1966 in the Principality of Monaco and brought to Italy as RMC Italia; since 2016 it has been part of RadioMediaset within Mediaset (now MFE - MediaForEurope), the media group founded by Silvio Berlusconi; "Nights Story" is one of several themed digital sub-channels alongside others like Buddha Bar, Marine, Hits, 80s and 90s, programmed for relaxed late-evening listening with a "Musica di Gran Classe" brand promise; advertising-supported and distributed via FM, DAB+, web and the RMC app.
