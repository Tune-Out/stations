  operator: El Destape (Grupo El Destape) — Argentine media outlet founded by journalist Roberto Navarro
  affiliations: Politically aligned with Argentine Kirchnerist / Peronist movement (Frente de Todos / Unión por la Patria); critical of right-wing and Macrist politics; not a state outlet but ideologically progressive/left-Peronist
