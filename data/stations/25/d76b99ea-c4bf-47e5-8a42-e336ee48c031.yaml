  format: News, talk, political debate, economic analysis, and current affairs ("actualidad, debate, economía, noticias, política")
  notes: El Destape Radio launched as the radio extension of the eldestapeweb.com news portal founded by journalist Roberto Navarro in 2013; the brand is openly aligned with the Kirchnerist (Cristina Fernández de Kirchner) wing of Peronism and is regularly described as one of Argentina's most prominent progressive/left-leaning media outlets; flagship programming includes Roberto Navarro's daily political show "El Destape con Roberto Navarro"; the outlet has been involved in high-profile clashes with the Argentine judiciary, the Macri and Milei administrations, and other media groups (notably Clarín); it operates on FM 107.3 MHz in Buenos Aires (formerly the frequency of Radio América) and via online streaming.
