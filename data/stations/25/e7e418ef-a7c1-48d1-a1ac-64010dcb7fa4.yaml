  notes: Seba FM (راديو صبا اف ام) is an Arabic-language Palestinian local radio station in the northern West Bank, run by the Seba Media Network with a companion Seba TV video service; directories list it under Jenin and Ramallah. Its output is a general mix of news reports, interviews, cultural, sports and economic segments, university and community news and popular music, not the classical music the catalog tag suggests. The Icecast source identifies itself simply as SEBAFM at 128 kbps.
