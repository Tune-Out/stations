  operator: Global (Global Media & Entertainment Ltd), headquartered at 30 Leicester Square, London
  affiliations: privately owned media group (controlled by Ashley Tabor-King and the Levy family); no formal political party affiliation, though presenters span the political spectrum and the station is often characterized as right-leaning in commentary
  audience: UK adults interested in news, opinion and phone-in talk; primarily English-language; UK-wide via DAB+, FM (London 97.3), and online
  format: 24/7 news and talk radio with high-profile presenter-led phone-ins (Nick Ferrari, James O'Brien, Iain Dale, Andrew Marr, Shelagh Fogarty, etc.)
  notes: Originally launched 1973 as London Broadcasting Company, the UK's first legal commercial radio station and first commercial news/talk station. Acquired by Global in 2014; went UK-wide on DAB in 2014. Sister station LBC News runs rolling news. Known for major political interviews and breaking news. Tagline historically "Leading Britain's Conversation".
