  notes: Radio JKKNIU is the student-run campus station of Jatiya Kabi Kazi Nazrul Islam University at Trishal in the Mymensingh division of Bangladesh. It is operated entirely by students as a platform for campus talent and discussion, carrying youth talk shows alongside pop, rock and classical music blocks. The station brands itself "the heartbeat" of the university under the tagline "Once a Nazrulian, Always a Nazrulian" and streams via a Zeno.fm feed.
