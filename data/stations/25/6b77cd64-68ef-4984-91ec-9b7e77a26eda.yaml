  operator: Operated in association with the Lebanese Forces (القوات اللبنانية) — a Maronite Christian political party founded by Bachir Gemayel and led by Samir Geagea; the homepage links to the LF official site.
  affiliations: Lebanese Forces political party; Christian Maronite religious/cultural orientation; programs commemorate "resistance martyrs" of the Lebanese Civil War.
  audience: Lebanese listeners domestically and in the Lebanese diaspora, primarily Christian and LF-aligned audiences; Arabic-speaking.
  format: Talk/news/music mix in Arabic — news bulletins, political commentary, free-dialogue talk shows ("حوار حر"), religious programming ("Credo"), Arabic music and cultural content.
  notes: Broadcasts on FM 102.3 / 102.5 / 102.7 MHz in Lebanon plus internet streaming via Mixlr. Name "Radio Liban Libre" (Free Lebanon Radio) echoes the LF's historic "Voice of Lebanon" / "Voice of Free Lebanon" stations dating to the civil-war era. Notable program "إرتفعوا كالأرز" (Rise Like the Cedar) commemorates Lebanese resistance martyrs.
