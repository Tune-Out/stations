  notes: "ROKit Radio (Vintage ROKiT Radio Network) is one of 16 themed online channels operated by a UK-based volunteer-run not-for-profit streaming platform dedicated to preserving Old Time Radio (OTR) heritage; mission statement: \"we will give a new generation of listeners the chance to experience imagination theatre for the mind!\"; the British Comedy 1 channel focuses on classic British radio comedy such as The Goon Show, Hancock's Half Hour, Round the Horne, I'm Sorry I Haven't a Clue, Just a Minute, and Dad's Army radio adaptations; sister channels include British Comedy 2, American Comedy, Drama, Mystery, Sci-Fi, Saturn X Radio, Nostalgia Lane, and Jazz/Classical streams; accessible via web and iOS/Android apps; not affiliated with the BBC despite featuring archival BBC content."
