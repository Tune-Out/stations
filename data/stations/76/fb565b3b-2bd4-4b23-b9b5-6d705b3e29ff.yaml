  notes: Or FM 89.6 broadcasts from Orkadiéré, a rural commune in Matam Region near the Senegal-Mauritania border in the Fouta region. Community radio in Senegal is regulated by the CNRA (Conseil National de Régulation de l'Audiovisuel) and stations of this type typically serve the Haalpulaar (Pulaar/Fulani) population with local-language programming, agricultural information, health education, and cultural content. Streams via Zeno.fm at the orfmsenegal channel. Limited public documentation on ownership or programming.
