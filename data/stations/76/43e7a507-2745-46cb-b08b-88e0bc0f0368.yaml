  audience: French adults nationwide, primarily 35+ ("nostalgie chanson française" demographic)
  format: French-language adult-contemporary music focused on classic chanson française, with multiple themed web sub-stations (decades, artists, moods).
  notes: M Radio (originally launched as "MFM Radio" in 2000) is a French commercial music network branded as "Numéro 1 sur la chanson française," targeting older adult listeners with a French-music-heavy playlist (Johnny Hallyday, Céline Dion, Goldman, Aznavour, Bruel, etc.). It broadcasts on FM in several French cities (Paris, Lyon, Marseille, Nice, Aix-en-Provence, Clermont-Ferrand and others) and via DAB+ in expanding French metros, plus its mradio.fr webstream and themed sub-channels (60s through 2000s decades, artist streams, fitness/relax/urban). Rebranded from MFM to M Radio in 2013. It belongs to France's independent commercial-music-radio category alongside peers like Nostalgie and Chérie FM, but is operated independently of the major national groups (Lagardère, NRJ, RTL, NextRadioTV).
  sources: https://mradio.fr/, internal knowledge
