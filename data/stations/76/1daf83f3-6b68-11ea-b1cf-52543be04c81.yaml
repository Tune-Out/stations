  operator: Gazprom-Media Holding (Газпром-медиа) via subsidiary Vyacheslav Soloviev Group / Gazprom-Media Radio (formerly Газпром-Медиа Развлекательное Телевидение)
  affiliations: Ultimately owned through Gazprom-Media by Gazprombank / state-controlled Gazprom; broadly aligned with the Russian state media ecosystem; no formal religious or party ties
  audience: Russian motorists and broad adult audience (25-55); flagship on 90.3 FM in Moscow, networked nationwide and in CIS countries
  format: Adult contemporary hit radio for drivers; mix of Russian and international pop/rock from the 1980s-2000s with traffic, news and entertainment shows
  notes: Avtoradio ("Auto Radio") launched on 5 April 1993 as Russia's first radio station specifically targeted at drivers; programming centres on traffic reports, road safety and motoring topics combined with broad-appeal popular music; founder of the "Discoteka 80-h" ("80s Disco") brand and large-scale concerts that became one of the biggest pop-music franchises in Russia; part of the Gazprom-Media Radio division (alongside Energy, Humor FM, Like FM, Comedy Radio and others), which in turn is part of Gazprom-Media, the largest Russian media holding, controlled through Gazprombank — a financial institution majority-owned by state-controlled gas giant Gazprom; networked across Russia, broadcasting on Moscow's 90.3 FM and in hundreds of cities including across the post-Soviet space.
  sources: internal knowledge only
