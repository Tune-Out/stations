  notes: Avtoradio (Авторадио) is a Russian national commercial music network launched on 5 April 1993, broadcasting in Moscow on 90.3 FM and relayed to more than 1,300 cities in Russia and neighbouring countries. It belongs to GPM Radio, the radio division of Gazprom-Media Holding, which acquired it with ProfMedia in 2014; Gazprom-Media is ultimately controlled via Gazprombank by state-owned Gazprom. The format is about 70% Russian and 30% foreign hits from the 1980s to today with drive-time traffic and news; its signature brand is the annual 'Diskoteka 80-kh' retro festival. It has ranked first in Moscow by weekly reach for many years. The catalog stream ic4.101.ru returns 404; a working feed is https://pub0101.101.ru:8443/stream/air/aac/64/100 (resolves to gpm.hostingradio.ru/gpm-avtoradio495.aacp).
