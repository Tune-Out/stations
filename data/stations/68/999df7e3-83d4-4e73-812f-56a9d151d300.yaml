  nature: community
  operator: Association loi 1901 running Radio Méga (radio associative), supported by the Centre pour le Développement de la Communication Populaire; based at 40 rue Bouffier, 26000 Valence.
  affiliations: Member of France's associative/community radio sector regulated by Arcom and supported by the FSER (Fonds de soutien à l'expression radiophonique); part of the Ferarock network (federation of French rock-oriented associative radios).
  audience: French-speaking residents of Valence and the Drôme/Ardèche departments in the Auvergne-Rhône-Alpes region; cultural and community-minded listeners.
  format: Generalist community radio mixing chansons françaises, jazz, folk, electronic, rap and rock with local news, talk shows, citizen-produced programming and educational/media-literacy projects; programs include "Échanges & Regards" and "13/14".
  notes: Broadcasts on FM 99.2 MHz, DAB+ and web; non-commercial association funded by donations, FSER subsidies and partnerships; emphasizes grassroots communication, neighborhood storytelling and inviting community members to "créer votre propre émission" (create your own broadcast); also produces specialty projects like cycling documentaries and radio fiction.
  sources: https://www.radio-mega.com/
