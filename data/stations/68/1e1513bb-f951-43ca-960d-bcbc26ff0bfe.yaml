  nature: public broadcaster
  operator: Österreichischer Rundfunk (ORF) - Austrian public broadcaster - regional studio Landesstudio Oberösterreich in Linz
  affiliations: ORF is the Austrian public broadcaster established by the ORF-Gesetz, funded primarily by the ORF-Beitrag (mandatory household contribution that replaced the GIS licence fee on 1 January 2024) plus advertising revenue; member of the European Broadcasting Union (EBU); editorially independent of government but supervised by the Stiftungsrat appointed in part by the federal government
  audience: German-speaking adults in the Austrian federal state of Upper Austria (Oberösterreich, capital Linz); skews adult/older demographic typical of regional ORF Radio
  format: "Regional public service full-service station: Austropop and adult contemporary music, regional news, weather, traffic, sport and local culture programming with hourly nationwide news from ORF"
  notes: ORF Radio Oberösterreich (often branded "Radio Oberösterreich" with the slogan "Mein Sender" / "Mein Radio") is one of nine ORF regional radio channels (collectively the "Bundesländerradios" / ORF Regionalradios) - sister stations include Radio Wien, Radio Niederösterreich, Radio Salzburg, etc.; broadcasts on regional FM frequencies across Upper Austria and on DAB+; the Linz Landesstudio also produces ORF television opt-outs ("Oberösterreich heute"); part of ORF's nationwide network alongside Hitradio Ö3, FM4 and Ö1; ORF was subject to a major financing reform in 2023-2024 replacing the broadcasting licence fee with a household-based contribution.
  sources: internal knowledge only
