  notes: Sunshine Live - Die 90er is the 1990s Eurodance and electronic sub-channel of sunshine live, Germany's national electronic dance music station, which went on air in 1997 from Mannheim as part of the Regiocast group and now also produces from Berlin. The parent station brands itself 'Home of the DJs', broadcasts nationwide on DAB+ and online, and hosts the annual 'Die 90er - Live on Stage' concert at Mannheim's Maimarkthalle, from which this channel draws its identity. The 90er feed is an unmoderated 192 kbps MP3 playlist of Eurodance-era hits; sunshine live is ad-financed and commercial. The catalog's Baden-Württemberg location is correct.
