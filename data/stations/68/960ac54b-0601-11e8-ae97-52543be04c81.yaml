  notes: YourClassical Relax is one of about fifteen curated online streams from YourClassical, the classical music service of Minnesota Public Radio (part of American Public Media), a non-profit public radio organisation based in Saint Paul, Minnesota. The Relax stream plays continuous soothing classical music with minimal hosting, alongside sister streams such as Peaceful Piano, Sleep, Choral, Chamber Music, Guitar, Holiday and the flagship Classical MPR broadcast (KSJN 99.5 FM). YourClassical is listener- and underwriting-supported under MPR's public-service charter and its streams are free and ad-light.
