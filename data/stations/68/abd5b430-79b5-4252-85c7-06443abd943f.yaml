  operator: Radio Nationale Malagasy (Radio Madagasikara) — the public radio service of the Republic of Madagascar, under the Ministry of Communication and Culture
  affiliations: Government-controlled public broadcaster; sister service to Televiziona Malagasy (TVM)
  audience: National audience across Madagascar in Malagasy and French
  format: Generalist national radio — news, public service information, music (Malagasy and international), cultural programs and political coverage
  notes: Radio Nationale Malagasy traces its origins to colonial-era Radio Tananarive (founded 1931) and was nationalised after independence in 1960; serves as Madagascar's main public radio service with FM and AM coverage across the country; like many African state broadcasters, RNM has at times faced criticism for pro-government tilt during political crises (notably the 2002 and 2009 political crises), with periods of editorial control by ruling administrations.
