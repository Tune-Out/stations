  notes: Radio Nasionaly Malagasy (RNM, Radio Madagasikara) is Madagascar's national state radio, founded in 1931 as Radio Tananarive, the first radio station in a French African colony. It broadcasts from Antananarivo on 99.2 FM with national coverage in Malagasy and French, carrying news, government information, music and cultural programmes, and held a broadcasting monopoly until private stations were licensed in 1992. It is run with Televiziona Malagasy under the state broadcaster ORTM and is answerable to the government, with a pro-government editorial line during past political crises.
