  operator: Easy 96 / RBC Radio, founded by Rohit Jagessar (Indo-Guyanese-American entrepreneur)
  affiliations: none known — independent South Asian-American media venture; no party-political or religious ties
  audience: South Asian / Indian-American diaspora in the New York tri-state area (New York City, Northern New Jersey, Connecticut, parts of New York State); programming in Hindi, Urdu, Punjabi, Gujarati and Bengali
  format: Bollywood / Hindi-film soundtracks, Top 40 South Asian pop, news, talk and educational programming aimed at the Indian-American community
  notes: Although radio-browser tags this station as "India," Easy 96 is in fact a US-based diaspora broadcaster. It began as RBC Radio on 15 March 1989, claimed as the first Asian-Indian radio station in the United States, originally delivered via satellite and then carried on the 92 kHz SCA subcarrier of WQXR-FM (then the New York Times' classical-music station) at an effective 50,000 watts. The station has played a notable role in introducing Bollywood music to North American audiences, debuting Indian-film soundtracks and hosting artists such as A.R. Rahman, Daler Mehndi and Sonu Nigam, and continues today as an internet stream (easy96.com).
