  notes: ON Sport FM is an Egyptian sports radio station that went on air on 21 September 2018 at 10pm on 93.7 MHz, billed as the country's first specialist sports radio service. It is owned jointly by the state National Media Authority and United Media Services, the dominant Egyptian media group, and shares talent and branding with the ON Sport television channel. It replaced an entertainment station called DRN on the same frequency, with the editorial line rebuilt entirely around sport. Its launch line-up featured commentators Magdy Kamel and Seif Zaher, with coverage from ON Sport's Ahmed Shoubier.
