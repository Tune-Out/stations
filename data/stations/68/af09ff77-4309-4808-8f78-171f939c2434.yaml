  operator: Radio Echo GmbH (Germany-based successor company to the former Echo of Moscow team); editor-in-chief Maxim Kurnikov; founded by former staff of Echo of Moscow
  affiliations: Independent, pro-democracy, anti-Kremlin editorial line; designated a "foreign agent" by the Russian Ministry of Justice and blocked inside Russia
  audience: Russian-speaking listeners worldwide, especially the Russian diaspora and opposition-minded audience inside Russia accessing via VPN
  format: Russian-language news, political talk, interviews, commentary, investigative journalism and cultural programming with prominent independent journalists and exiled hosts
  notes: '"Эхо" (Ekho / Echo) is the in-exile successor of the legendary Moscow station "Эхо Москвы" (Echo of Moscow), founded 1990 and forcibly shut down by Russian authorities in March 2022 after refusing to follow Kremlin censorship of the Ukraine war. The station relaunched as echofm.online in 2022 from outside Russia (initially Berlin/Tbilisi-based), led by former Echo of Moscow journalists including Maxim Kurnikov and with continuing involvement of long-time figures around former editor-in-chief Alexei Venediktov. Russian authorities have labelled the project a "foreign agent" and its main websites are blocked on Russian ISPs, with the station distributing primarily via web stream, podcasts, YouTube, Telegram and TikTok. It is fully blocked inside the Russian Federation but widely listened to by diaspora and dissenting domestic audiences.'
