  notes: Radio Corazón ("Heart Radio") is a popular Chilean FM commercial network broadcasting from Santiago and across Chile, specialising in romantic and pop ballads in Spanish; it has long been one of Chile's most-listened-to FM stations targeting an adult audience that enjoys love-themed music and personality-driven daytime shows. The station was historically operated by Iberoamerican Radio Chile (the local arm of Spanish media group Prisa Radio); in 2024 Prisa Radio sold its Chilean operations to Grupo Bío-Bío. Stream delivered via TritonDigital StreamTheWorld.
