  notes: esRadio is a Spanish national news-and-talk network launched on 7 September 2009 by the Libertad Digital media group, founded by Federico Jiménez Losantos, César Vidal and Luis Herrero after their departure from COPE. It reaches listeners through more than 106 FM transmitters plus digital terrestrial television and Hispasat satellite, and in the first EGM wave of 2025 it was the fifth most-listened generalist national station in Spain with about 816,000 listeners. The schedule is built on long-form opinion and interview programmes — Es la Mañana de Federico, En casa de Herrero, Déjate de historias — covering politics, economics, culture and sport, with regional editions but no service in Catalonia, the Basque Country, Ceuta or Melilla. Its editorial line is openly right-of-centre and combative toward the Spanish left.
