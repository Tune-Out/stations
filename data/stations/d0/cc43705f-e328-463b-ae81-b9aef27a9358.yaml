  nature: commercial
  operator: MSG Afrika Media (Pty) Ltd, founded by Given Mkhari and Simphiwe Mdlalose; licensed by ICASA (Independent Communications Authority of South Africa)
  affiliations: none known — privately owned, no religious or party-political ties; member of South Africa's commercial broadcasting industry body NAB
  audience: Adults 25-49 across Limpopo Province; multilingual programming in English, Sepedi, Tshivenda, and Xitsonga reflecting the province's three main African-language groups
  format: Regional commercial music & talk — adult contemporary music, news, sport, lifestyle, and community-affairs programming
  notes: Launched on 26 November 2007 from studios in Bendor Park, Polokwane, broadcasting on 89.9-105.5 FM across Limpopo. Capricorn FM is historically notable as "the first 100% black-owned, 100% black-managed commercial radio station in Limpopo and in the country" (South Africa) and reached 1.5 million listeners within its first ten months on air. The founders — Mkhari and Mdlalose — first ran Radio Turf at the University of Limpopo as students. MSG Afrika Media's broader portfolio also includes Power FM (Gauteng).
