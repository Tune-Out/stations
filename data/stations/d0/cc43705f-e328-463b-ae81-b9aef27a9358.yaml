  notes: Capricorn FM is a commercial regional station for Limpopo Province, South Africa, launched on 26 November 2007 from Bendor Park, Polokwane, and owned by MSG Afrika Media, founded by Given Mkhari and Simphiwe Mdlalose. It broadcasts across Limpopo on 89.9-105.5 FM in English, Sepedi, Tshivenda and Xitsonga, with adult contemporary music, news, sport and lifestyle programming aimed at adults 25-49. It was described as the first 100% black-owned and black-managed commercial radio station in the province and drew 1.5 million listeners within its first ten months.
