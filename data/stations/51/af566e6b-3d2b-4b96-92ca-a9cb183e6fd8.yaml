  notes: '"Free FM Tokyo" is one of many country-branded clones of the Spanish-run Free FM / Free FM World online network, which lists near-identical streams as Free FM Rock Bombay, Free FM 80s Mexico, Free FM Classics and so on. The Shoutcast server behind this entry (rocafmadrid.radioca.st) identifies itself as "Free FM World", genre 80s/90s, with a freefmworld.com server URL, and was playing Desireless "Voyage Voyage" when checked; there is no Tokyo studio or Japanese programming. The freefmradio.net homepage returns 403. Directory descriptions of Tokyo news, weather and traffic are boilerplate.'
