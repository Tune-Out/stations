  affiliations: none religious, governmental or political; privately operated webcaster funded by donations, sponsorships and a Patreon
  audience: International English-speaking jazz and vintage-music enthusiasts (and Japan-based expatriates); not a Japanese-language service
  format: 24/7 classic big band and swing music from the 1930s and 1940s (Glenn Miller, Benny Goodman, Tommy Dorsey, Artie Shaw, Count Basie, etc.) with occasional vintage vocal jazz
  notes: J-Club Club Bandstand is one of multiple themed channels within the Asia DREAM Radio network of niche online stations (others include J-Pop Powerplay, J1 HITS, Radio Nikkei, Sakura J-Pop and J-Club specialty streams); Asia DREAM Radio has operated since the mid-2000s out of the Tokyo area, streaming via Toronto Cast and its own infrastructure, with the explicit goal of curating Japanese pop and Asian-related music genres for a worldwide audience while Club Bandstand serves as the network's vintage American big-band offering; the station has no advertising and is presenter-less.
