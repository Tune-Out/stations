  format: 24/7 speech radio — news, current affairs, political interviews, analysis, debate; daily live coverage from The Times and Sunday Times journalists
  notes: "Times Radio launched 29 June 2020 as a digital-only national speech station on DAB+, online and via smart speakers, positioned as a more measured rival to BBC Radio 4 and LBC. Operated by Wireless Group (acquired by News Corp from Communicorp/Bauer-era owners in 2016) and integrated with The Times and The Sunday Times newsroom. Notable presenters have included Aasmah Mir, Stig Abell, Matt Chorley, Cathy Newman, Andrew Neil, Calum Macdonald, Hugo Rifkind, Phil Williams, Mariella Frostrup, Ayesha Hazarika, John Pienaar and Kate McCann. Slogan: \"Always interesting\". News Corp's stated aim at launch was to provide \"intelligent, considered\" speech radio leveraging The Times's journalism; the station has built a sizable audience competing with Radio 4 and LBC."
