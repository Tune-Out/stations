  nature: public broadcaster
  operator: Radio France (French national public radio broadcaster)
  affiliations: French state-funded public service broadcasting; member of the European Broadcasting Union (EBU); supervised by ARCOM regulator; no religious or partisan political affiliation.
  audience: French-speaking listeners across France and worldwide via streaming; targets classical music, jazz, and cultural-music enthusiasts of all ages.
  format: Classical music, jazz, world music, opera, contemporary composition, with concerts, documentaries and music-focused magazine programming.
  notes: Founded in 1954 as "France IV Haute-Fidelite" and renamed France Musique in 1963 (becoming France Musique permanently in 2005 after the "France Musiques" rebrand was reversed); one of seven Radio France networks alongside France Inter, France Culture, France Bleu, FIP, Mouv' and franceinfo. Operates the Orchestre National de France, Orchestre Philharmonique de Radio France, Choeur de Radio France and Maitrise de Radio France. Broadcast on FM nationwide, DAB+, satellite and at 128 kbps MP3 online. Funded historically by the redevance audiovisuelle (TV licence fee), since abolished in 2022 and replaced by a share of VAT receipts. Long-running notable programmes include "Le Matin des musiciens", "Carrefour de Lodeon" and "Open jazz". Direction is appointed by Radio France's PDG with ARCOM oversight to ensure editorial independence.
  sources: internal knowledge only
