  notes: France Musique is Radio France's national classical and jazz station, begun in 1954 as an experimental FM music programme and named France Musique in 1963. It broadcasts the concerts of the Orchestre National de France, Orchestre Philharmonique de Radio France and Radio France choirs, alongside programmes such as Samedi à l'opéra, Carrefour de la création and La Tribune des critiques de disques, the network's oldest show (1946). Stéphane Grant became director in 2026 after Marc Voinchet (2015-2026). In 2026 Radio France cut France Musique's FM coverage from about 93% to 70% of French territory, transferring high-power transmitters to franceinfo in July 2026 and pushing listeners toward DAB+ and streaming; it also runs nine themed web radios such as Classique Easy and La Baroque.
