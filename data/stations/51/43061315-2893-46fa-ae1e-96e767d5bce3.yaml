  nature: commercial
  operator: Power Group (Power Medya ve İletişim Hizmetleri A.Ş.), the Turkish commercial-radio group founded by Cem Hakko that also operates Power FM, Power Pop, Power Love, Power XL, Power Dance and Power Smooth Jazz, and runs the PowerApp streaming platform (powerapp.com.tr).
  affiliations: none known; privately held commercial broadcaster regulated by RTÜK (Radyo ve Televizyon Üst Kurulu); no stated religious or political alignment.
  audience: Turkish-speaking adults nationwide who prefer Turkish-language popular music; broadcasts on FM across Türkiye (Istanbul 103.0 / 103.4 MHz historically, with relays in Ankara, Izmir, Antalya, Bursa and other cities) and via the PowerApp/PowerTürk web and mobile streams.
  format: Türkçe Pop / Turkish CHR — current and recent Turkish pop, rock and dance hits with the long-running tagline "Türkiye'nin Pop Müzik İstasyonu" ("Turkey's Pop Music Station"); flagship programmes have included the Power Türk Müzik Ödülleri awards show and chart programmes such as "Türkçe Top 20" and "Power Türk Hit Listesi".
  notes: Launched in November 2000 as the Turkish-language sister of Power FM (which had launched in 1993 as one of Turkey's first private FM stations after the 1993 deregulation); Power Türk's annual Power Türk Müzik Ödülleri ("Power Türk Music Awards") became one of the most prominent ceremonies for Turkish-language pop in the 2000s and 2010s; the group has also expanded to TV with Power Türk TV; the stream URL points to PowerApp's HLS infrastructure on powerapp.com.tr.
  sources: https://live.powerapp.com.tr/ (TLS cert mismatch), internal knowledge of the Power Group and Turkish commercial radio
