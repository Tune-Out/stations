  notes: Génération 88.2 (now Generations FM) is a long-established French commercial radio station founded in 1992 by Bruno Lecluse on the Paris frequency 88.2 MHz; it is one of France's pioneering hip-hop and urban-music stations and is recognised as a category-B (independent music) radio under the CSA/Arcom regulatory framework; the broadcaster operates multiple FM frequencies (88.2 Paris, 101.5 Lyon, etc.) plus a large bouquet of digital streams including Generations Rap FR, Rap US Classics, R&B, Drill & Trap, Afrobeat, and artist-dedicated channels (Booba, Jul, Ninho); programming combines specialist DJ shows, "Animateurs"-led talk segments, and cultural/sports/lifestyle news focused on hip-hop and urban culture.
