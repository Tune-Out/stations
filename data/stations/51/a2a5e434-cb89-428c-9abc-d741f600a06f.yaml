  operator: Türkiye Radyo ve Televizyon Kurumu (TRT, Turkish Radio and Television Corporation), the official Turkish public broadcaster headquartered in Ankara
  affiliations: Turkish state broadcaster established by Law No. 2954 (1983); governed by an upper board appointed largely on the recommendation of the ruling government; funded by a share of electricity bills, government subsidies and limited advertising; widely regarded by external observers (RSF, Freedom House) as editorially aligned with the AKP government
  audience: lovers of Turkish classical and art music in Turkey and the Turkish-speaking diaspora; broadcast in Turkish; "Türkiye'nin her yerinde, uydudan ve internet üzerinden bütün dünyada" (throughout Turkey via satellite and internet worldwide)
  format: 24/7 thematic radio dedicated to Türk Sanat Müziği (Turkish Art / classical music), featuring archival recordings, new productions, choral works and listener-request programmes
  notes: One of TRT's network of thematic radio channels alongside TRT Radyo 1, TRT FM, TRT Türkü, TRT Nağme's sister Klasik (Western classical) and others; preserves and disseminates the Ottoman-rooted Turkish classical repertoire; notable programmes include "Klasik Türk Müziği Saati", "Akşamın Sesi", "Her Dem Nefes" and "Musiki Sandığımız"; available on FM, DAB, satellite (Türksat) and online stream
