  notes: Europa Plus (Европа Плюс) is Russia's first non-state commercial radio station, on air since 30 April 1990, broadcasting in Moscow on 106.2 FM and across hundreds of cities in Russia and neighbouring countries. It is the flagship of European Media Group (EMG), the largest Russian radio holding, and runs a CHR pop/dance format aimed at listeners under 35 with programmes such as the EuroHit Top 40 chart and the 'Brigada U' morning show. It consistently ranks first in Russia by daily reach and was named VK Music's 'Radio Station of the Year' for 2025. This entry's stream (ep128server.streamr.ru/ep128) is the network's national 128 kbps feed on EMG's streamr.ru CDN, not a regional relay, and the catalog homepage points to a radiomap.eu aggregator page rather than europaplus.ru; the higher-voted 'Europa Plus' entry carries the same broadcast.
