  notes: Echoes of Bluemars ("Music for the Space Traveler") is a long-running independent ambient internet station whose three channels — Bluemars (deep space ambient), Cryosleep (rhythmic/drone) and Voices From Within (choral and vocal ambient) — stream uninterrupted, DJ-free music framed by a fiction of a terraformed Mars. It plays independent and label ambient artists, carries no advertising and is supported by listener donations; the site (http only) remains online and the streams are live. It is widely referenced in ambient-music communities alongside SomaFM's Drone Zone.
