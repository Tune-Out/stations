  notes: Echoes of Bluemars is a long-running independent internet radio project dating to the mid-2000s, conceived as the "music of an imaginary terraformed Mars colony"; its three channels (Bluemars, the rhythmic Cryosleep, and the choral Voices from Within) play uninterrupted ambient works from independent and label artists with no DJ chatter or advertising, funded entirely by listener donations and curated by ambient composer Cousin Silas alongside other contributors; the station is widely cited in ambient-music communities and remains a touchstone of the SomaFM/Drone Zone era of online radio.
