  notes: Rádio Comercial (often styled Radio Comercial) is one of Portugal's top-rated commercial music stations, broadcasting nationwide on FM and online. Launched in its current music-driven form in 2001 after a relaunch by Media Capital, it became famous for the highly successful and frequently controversial morning show "Manhãs da Comercial" hosted by Nuno Markl, Vasco Palmeirim and Pedro Ribeiro, known for satire, prank calls and "musiquinhas" parody songs. In 2020 Bauer Media Group acquired the Portuguese commercial radio assets of Grupo Media Capital (including Rádio Comercial, Cidade FM, M80, Smooth FM and Vodafone FM) for an enterprise value around €40 million, making Bauer the leading commercial radio operator in Portugal; the stream is served from bauermedia.pt infrastructure.
