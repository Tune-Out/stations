  operator: "Mosaïque FM (parent: SARL Mosaïque FM); since 2011 administered by the Tunisian state's confiscation/management body following sequestration of assets linked to the Ben Ali / Trabelsi clan"
  affiliations: Originally owned by Belhassen Trabelsi (brother-in-law of former president Zine El Abidine Ben Ali) before the 2011 Jasmine Revolution; post-revolution placed under state sequestration and managed by the Tunisian government, regulated by HAICA
  audience: Tunisian Arabic-speaking listeners nationwide and in the Maghreb diaspora; this "Tarab" web stream targets fans of classical Arabic music
  format: Mosaïque FM Tarab is a themed web sub-channel of the main Mosaïque FM offering — classical Arabic and Maghrebi "tarab" music (Egyptian, Levantine, Tunisian malouf and Andalusi repertoire); the parent station is a generalist news/talk/music FM
  notes: Mosaïque FM launched 7 November 2003 as Tunisia's first legal private FM station (under Ben Ali's media monopoly the licence went to his in-laws); after the January 2011 revolution it was sequestered along with other Trabelsi-linked media assets; despite the controversial origin it remains one of Tunisia's most listened-to radio stations and is consistently among the top in Maghreb audience surveys; broadcasts on multiple Tunisian FM frequencies and operates several themed web streams (Tarab, Mezwed, etc.).
  sources: http://mosaiquefm.net/, internal knowledge
