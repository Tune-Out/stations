  notes: Antena 1 Rio de Janeiro (ZYD 463) broadcasts on 103.7 FM as the Rio affiliate of Rede Antena 1, the Brazilian adult-contemporary network founded in 1974 by businessman Orlando Negrão Júnior and inaugurated in 1975 under Antena Um Radiodifusão Ltda. The network was the first in Brazil to broadcast nationally on FM only and an early adopter of satellite automation; it now has around 24 affiliates and uses the slogan "A número 1 em música". Programming is soft adult contemporary — blocks of international pop, soft rock and easy listening interleaved with news bulletins. Since September 2025 the Rio station has been more fully integrated commercially and relays the network's national feed, keeping only limited local windows and a locally adjusted playlist.
