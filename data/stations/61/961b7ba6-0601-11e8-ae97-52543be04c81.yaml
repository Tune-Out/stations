  operator: NPO法人 (nonprofit organization) operating as a licensed community FM (コミュニティ放送) broadcaster in Kahoku City
  affiliations: none known (secular, non-political community broadcaster); JASRAC and NexTone music-rights licensees; participates in Japan's local-government emergency broadcasting framework
  audience: Residents of Kahoku City and adjacent Ishikawa Prefecture communities, plus Japanese diaspora and Japan-music fans worldwide via web stream
  format: Japanese-language community programming with J-pop, enka, kayokyoku, talk shows, weather/disaster information, and locally-produced "personality" segments
  notes: FM Kahoku (FMかほく, callsign JOZZ5AM-FM) broadcasts on 78.7 MHz from Kahoku City in Ishikawa Prefecture, central Japan; operates as a community FM station ("コミュニティ放送局") under Japan's local low-power FM framework with the mission tagline "あなたの夢をあなたの声で" (Your dreams in your own voice); part of the nationwide tradition of NPO-run hyperlocal community FM stations that provide disaster information, local news, and citizen-produced programming; the wider Hokuriku region was severely affected by the 1 January 2024 Noto Peninsula earthquake, and Ishikawa community FMs played important emergency-information roles.
  sources: http://fm.kahoku.net/, internal knowledge
