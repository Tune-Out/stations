  format: Electronic dance music (EDM), house, techno, trance and club mixes - "The Best Dance Radio."
  notes: "Kiss FM Ukraine launched in 2004 on 100.0 FM in Kyiv and expanded to multiple Ukrainian cities; the 106.5 frequency cited here is a regional broadcast. Flagship shows include KISS.CLUB.MIX (daily DJ mixes), \"Ukraine Dancing\" and various DJ mix sessions. The station also operates sub-streams (KISS FM Ukrainian, KISS FM Deep, KISS FM Digital) and the TOP40 / 10DANCE charts. Slogan: \"Формуй танцювальну культуру!\" (\"Shape dance culture!\"). Following the 2022 Russian invasion, the station has continued operating under wartime conditions and increased Ukrainian-language programming alignment with Ukraine's 2021 national-language broadcast quota law."
