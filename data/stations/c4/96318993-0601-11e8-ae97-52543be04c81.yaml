  notes: La Kalle is a Colombian commercial music network launched on 29 October 2016 by Caracol Televisión, whose parent is the Santo Domingo family investment vehicle Valórem. It broadcasts on 96.9 FM in Bogotá with further frequencies nationwide and shares technical and editorial infrastructure with Caracol's news brand Blu Radio. The playlist mixes vallenato, rancheras, reggaeton, bachata and Latin urban music with entertainment and celebrity content. It was simulcast on ETB television channel 607 until July 2023, and in January 2025 it took a new logo and schedule pushing further towards urban music.
