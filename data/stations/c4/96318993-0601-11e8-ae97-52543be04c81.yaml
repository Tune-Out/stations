  notes: La Kalle is a Colombian commercial radio network operating on 96.9 FM in Bogotá and on multiple frequencies across the country. It was launched by Caracol Televisión as the popular-music sister station to its news/talk brand Blu Radio, and shares technical and editorial infrastructure with Blu (lakalle.bluradio.com). Caracol Televisión is owned by Valorem, the investment arm of the Santo Domingo family (Grupo Santo Domingo), one of Colombia's largest business groups. The station is a member of the industry bodies Asomedios and IAB Colombia and focuses on entertainment, celebrity news and música popular (ranchera, vallenato, despecho) alongside reggaeton.
