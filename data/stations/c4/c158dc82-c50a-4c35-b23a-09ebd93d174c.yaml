  notes: SomaFM is a pioneering non-commercial, listener-supported internet radio station based in San Francisco, founded in 1999. Black Rock FM is one of SomaFM's signature streams, themed around Burning Man culture and featuring a carefully curated mix of electronic, experimental, and world music. The stream is named after Black Rock City, the temporary city built for Burning Man festival in Nevada's Black Rock Desert. SomaFM operates ad-free and has built a loyal audience of listeners valuing high-quality, independent programming.
