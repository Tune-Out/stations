  notes: Radio Bío-Bío was founded in 1966 in Concepción by Nibaldo Mosciatti Olivieri and remains family-owned by the Mosciatti family. Headquartered in Concepción, it operates 8 stations covering Chile from Santiago (99.7 FM) to Puerto Montt (94.9), Valparaíso, Los Ángeles, Temuco, Valdivia, Osorno, and Concepción itself (98.1). Bio-Bio is widely regarded as one of Chile's most influential and most listened-to news radios, particularly noted for its strong investigative unit ("BBCL Investiga"), critical commentary by Tomás Mosciatti, and reputation for editorial independence from both the political left and right. Its tagline "La Red de Prensa Más Grande de Chile" reflects its self-positioning as Chile's largest press network. Companion website biobiochile.cl is a major digital news destination.
