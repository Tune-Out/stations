  operator: Auckland Student Radio Limited, owned by the Auckland University Students' Association (AUSA); part of the bNet student-radio network alongside RDU, Radio One, RadioActive and Radio Control
  affiliations: University of Auckland student community; member of New Zealand's bNet alternative-music network
  format: alternative/independent music, local NZ music, talk and current affairs from a student/community perspective; this stream is a FLAC lossless feed of the main 95bFM signal
  audience: students, alternative-music listeners and local-music supporters in Auckland; broadcast on 95.0 FM across greater Auckland
  notes: 95bFM dates to 1969 as a closed-circuit student station, going on air as Radio Bosom for the 1969 Auckland Capping Week and becoming a full-time FM station as 95bFM in 1985; long known for breaking New Zealand artists (e.g., shows like the Wammo Show, Drive, The Breakfast Show, Freak the Sheep, 95bFM Top Ten); a registered NZ On Air-supported broadcaster of local music with a strong tradition of activist and student-affairs programming
