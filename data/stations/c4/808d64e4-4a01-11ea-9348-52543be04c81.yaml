  notes: 'Radio Okapi is the national public-interest broadcaster of the Democratic Republic of the Congo, created jointly by the UN peacekeeping mission (MONUC, now MONUSCO) and the Swiss media NGO Fondation Hirondelle, and on air since 25 February 2002. It runs on an annual budget of about USD 4.5 million with roughly 200 staff, broadcasting from more than 30 FM transmitters between 88.0 and 106.5 MHz plus shortwave, in French and four national languages — Lingala, Kituba/Kikongo, Swahili and Tshiluba. Output is round-the-clock news, civic education and dialogue programming, including L''invité du jour, Dialogue entre Congolais and Okapi Service, and The Economist called it "one of Africa''s most admirably independent radio services". Its journalists have paid a price for that role: editor Serge Maheshe was murdered in Bukavu in 2007 and Didace Namujimbo in 2008.'
