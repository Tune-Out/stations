  operator: Joint project of Fondation Hirondelle (Swiss media NGO) and MONUSCO (United Nations peacekeeping mission)
  affiliations: United Nations, MONUSCO (UN Stabilization Mission in DR Congo), Fondation Hirondelle
  audience: General DR Congo population in French, Lingala, Swahili, Kikongo, Tshiluba; humanitarian/peacebuilding focus
  format: News, civic education, dialogue, youth and development programming including "L'invité du jour", "Dialogue entre Congolais", "Okapi service", and "100% Jeunes"
  notes: Launched 25 February 2002 as part of MONUC (later MONUSCO) peacekeeping mandate; widely regarded as the most listened-to radio station in DRC, with FM relays in Kinshasa (103.5), Goma (95.5), Bukavu (95.3), Lubumbashi (95.8) and others; named after the okapi, DRC's national animal; multiple journalists have been killed in the line of duty, notably Serge Maheshe (2007) and Didace Namujimbo (2008); functions as an independent news source balancing development journalism with peace-building.
  sources: http://www.radiookapi.net/, internal knowledge
