  notes: 'Radio Mayak (''Lighthouse'') is a Russian national state radio station that first aired on 1 August 1964 as the All-Union Radio news-and-light-music service, modelled loosely on the BBC Light Programme. It is owned and run by VGTRK, the All-Russia State Television and Radio Broadcasting Company, and broadcasts from Moscow on 103.4 FM and across Russia through regional VGTRK affiliates, having dropped long- and medium-wave transmission in 2013. The format mixes news, talk shows and pop music, and its ''Moscow Nights'' tuning signal still plays every 30 minutes. VGTRK is a designated strategic state enterprise and has been sanctioned by the EU, UK, US, Canada and others since 2022 for spreading war propaganda; the station''s web presence now lives on VGTRK''s smotrim.ru platform. Editorial flag: Owned by VGTRK, the Russian state broadcasting holding sanctioned by the EU, UK, US, Canada, Switzerland, Australia, New Zealand and Japan for its role in disseminating Kremlin propaganda supporting the war against Ukraine. Editorial flag: Radio Mayak is named in the brief as a Kremlin news channel. Mixed music/talk format tempers the score relative to Vesti FM, but the news and current-affairs output follows the state line.'
