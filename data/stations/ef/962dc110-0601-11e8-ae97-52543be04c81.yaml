  notes: 80s80s is a German commercial radio brand dedicated entirely to the music, stars and lifestyle of 1980 to 1989, launched on 17 June 2015 and operated by Antenne Mecklenburg-Vorpommern GmbH & Co. KG within the REGIOCAST group (also R.SH, delta radio, 90s90s). It has been carried on the national DAB+ multiplex since 1 December 2020, on cable via Vodafone and online, and its Mecklenburg-Vorpommern FM outlet switched off on 1 April 2026 leaving DAB+ and internet only. The main stream plays an oldie-based adult-contemporary rotation of artists such as Depeche Mode, The Cure and Michael Jackson with news, event tips, Starnews and "Let's talk about Music" interviews, and it is surrounded by dozens of themed web channels (NDW, Italo Disco, Depeche Mode, Bowie, Prince, regional variants). Streams are delivered through REGIOCAST's streamabc ad-insertion platform.
