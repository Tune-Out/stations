  notes: FM Radio Manele is an online-only Romanian station devoted to manele, the Romani-influenced Balkan pop genre, distinguishing between manele noi (new) and manele vechi (old) alongside general party music. It runs two streams, Radio Manele and Radio Petrecere, at 128 kbps, and its playlist centres on the genre's best-known artists including Nicolae Guță, Denisa and Florin Salam. The operators identify themselves only collectively, saying they built the station "din pasiune pentru toţi românii de pretutindeni" — out of passion for Romanians everywhere. The service is active, with copyright notices running to 2025, apps on Google Play, the App Store and Huawei AppGallery, and current Facebook and TikTok activity. Manele is popular but culturally contested in Romania; the content itself is ordinary commercial pop music.
