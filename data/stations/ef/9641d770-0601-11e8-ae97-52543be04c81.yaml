  notes: Radio Čas Rock is a commercial Czech rock station, a sister of Radio Čas operated by the JUKE BOX/Čas Media group based in Ostrava. It broadcasts on multiple regional FM frequencies (e.g. 87.9, 106.7, 88.9, 89.5/99.9, 89.7, 91.6 MHz) primarily across northern Moravia and Silesia. Programs include "Natvrdo!", "Rockové Křeslo", "Rock Cast", "Pod Povrchem", "Ostrý Budíček", and the annual "Holba Rock na Grilu" festival.
