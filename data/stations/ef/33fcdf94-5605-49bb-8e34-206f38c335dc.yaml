  notes: GOLDY Evergreen is an Indian internet-only station on the Zeno.FM platform, run by the small Goldy FM Network from Sangasar village near Dholera in Gujarat's Ahmedabad district. It plays non-stop evergreen Hindi film music from the golden era of Lata Mangeshkar, Mohammed Rafi, Kishore Kumar and Mukesh, with some 1990s hits and old Gujarati songs, and has no talk programming. The Zeno listing (zeno.fm/radio/goldy-fm) is live and carries PayPal donation links; the catalog's homepage path zeno.fm/goldy-fm/ returns 404. The Zeno stream URL returned HTTP 401 to automated checks, which may reflect Zeno's token requirements rather than a dead station. The very high vote count is out of proportion to a small hobby stream.
