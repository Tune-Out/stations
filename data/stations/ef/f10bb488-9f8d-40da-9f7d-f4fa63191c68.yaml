  operator: American Forces Network (AFN) Pacific, operated by the Defense Media Activity (DMA), a US Department of Defense field activity
  affiliations: Direct arm of the US Department of Defense; AFN content is governed by DoD Instruction 5120.20 ensuring it serves US service members and is shielded from commercial advertising and editorial interference
  audience: US military personnel, civilian employees, and dependents stationed in the Kanto Plain (Yokota Air Base, Camp Zama, Yokosuka Naval Base, NAF Atsugi, Hardy Barracks); also picked up by English-speaking expatriates and English-language learners in Tokyo
  format: '"AFN Power Network"-style adult contemporary / pop hits mixed with US news (AP, NPR, network feeds), sports (NFL, MLB, NBA, NCAA), DoD command information spots, and emergency broadcasting; English-language only'
  notes: AFN traces its lineage to Armed Forces Radio Service (1942) and has broadcast in Japan since 1945 as WVTR / FEN (Far East Network), renamed AFN in 1997; AFN Tokyo (formerly Eagle 810 AM) is one of the longest-running English-language stations in Japan and is famously listened to by Japanese audiences for English practice and US sports; in lieu of commercials AFN airs DoD public-service announcements on topics such as suicide prevention, sexual-assault prevention, and OPSEC; AFN GO is the official streaming/mobile portal that geo-restricts certain entertainment content per copyright agreements but provides the news/talk feed worldwide.
