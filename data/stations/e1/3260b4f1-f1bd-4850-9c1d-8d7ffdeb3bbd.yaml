  operator: Tube Tamil network — Sri Lankan Tamil-diaspora online media brand operating tubetamil.fm and the associated Tube Tamil YouTube channels; specific corporate ownership not publicly disclosed.
  affiliations: none known (no government broadcaster ties; not part of Sri Lanka Broadcasting Corporation; serves the Tamil community of northern Sri Lanka and the global Sri Lankan Tamil diaspora).
  audience: Sri Lankan Tamil speakers, particularly listeners in the Jaffna/Northern Province region and Eelam-Tamil diaspora communities in India, Canada, the UK, Australia, France, and Malaysia.
  format: Tamil music station — South Indian (Kollywood) film songs, Tamil pop, devotional, and Eelam Tamil cultural music, mixed with diaspora-oriented talk and community content.
  notes: Tube Tamil FM is an internet-only Tamil radio station targeting the Jaffna-based and diaspora Tamil community of Sri Lanka, voiced as part of the broader Tube Tamil online media network; it is one of several diaspora-aimed Tamil internet stations (alongside IBC Tamil, Geo Tamil, Tamil FM and others) that proliferated after the 2009 end of the Sri Lankan civil war, providing Tamil-language cultural programming outside the state Sri Lanka Broadcasting Corporation services; programming is heavily music-driven with Tamil film and devotional content, streamed via Voscast / Shoutcast servers.
