  operator: Radio Free Dom (owned by Margie Sudre), Saint-Denis, La Réunion
  affiliations: Founders Camille and Margie Sudre were also behind the Free Dom political movement in Réunion; the station itself is a private commercial broadcaster
  audience: General public of Réunion (French overseas department), Creole and French speakers; also diaspora online
  format: 'Generalist local radio: news, phone-in and listener-participation shows, legal advice (Droit de parole), local music, games'
  notes: Radio Free Dom (usually written Freedom) is the leading radio station of the French Indian Ocean island of La Réunion, founded on 14 July 1981 by Camille and Margie Sudre during France's free-radio boom and now owned by Margie Sudre. It broadcasts on 17 FM frequencies (88.2-107.1 MHz) across the island from Saint-Denis, with a generalist format built on live phone-ins, local news, legal-advice and community-help shows and Creole music. Médiamétrie (Sept-Nov 2025) gives it about 33.5% audience share, far ahead of Exo and Réunion la 1ère. A second channel, Freedom 2, launched in 2011 with a music-based schedule. This entry is the main 'Free Dom 1' stream; the catalog country should be France / Réunion rather than blank.
