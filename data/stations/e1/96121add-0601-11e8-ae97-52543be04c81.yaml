  format: Oldies adult contemporary — hits from the 1960s through the 1990s, with news and traffic bulletins
  notes: Rádio Vlna began broadcasting from Bratislava on 13 January 2015 and is operated by the Slovak commercial group Radio Group. Its flagship transmitter is 101.8 MHz Bratislava at 100 kW, part of a national network of 28 FM transmitters; DAB+ transmission was discontinued in 2021, so it now reaches listeners terrestrially on FM and online. The format is oldies adult contemporary, spanning the 1960s to the 1990s and interleaved with news and traffic reporting, and it holds a 6.65% listening share, making it the seventh most-listened-to station in Slovakia. Alongside the main service it runs six themed internet streams, including Golden Hits, Classic Rock, 60-70 and Oldies Party. The previous 'unknown' classification and the claim that little was known about it were both out of date.
