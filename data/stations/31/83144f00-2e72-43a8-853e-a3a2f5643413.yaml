  notes: Caboradio serves the island nation of Cabo Verde (formerly Cape Verde), an Atlantic archipelago off the coast of West Africa with approximately 560,000 residents. The station streams via RadioKing, a European free streaming hosting platform, at 128 kbps MP3. The homepage is hosted on Wix, a user-friendly website builder, suggesting a small/independent operation. Cabo Verde has a rich musical tradition including Morna (slow melancholic style) and Funaná (faster dance-oriented style) which likely feature in the station's programming. Portuguese and Crioulo (Cape Verdean Creole) are the primary languages. The station appears to serve both local Cabo Verdean listeners and the significant diaspora communities in Boston, Rhode Island and elsewhere in North America and Europe.
