  notes: WS-FM (originally "Western Suburbs") began commercial broadcasting in 1978 on 99.3 MHz, moved to 101.7 MHz on the Gore Hill transmitter, and was acquired by ARN. It has consistently ranked at or near the top of Sydney FM ratings for decades, particularly with the Jonesy & Amanda breakfast program (on air at WSFM since 2005). ARN is an Australian commercial radio company that emerged from the demerger of Australian Radio Network from APN News & Media, and is now publicly listed.
