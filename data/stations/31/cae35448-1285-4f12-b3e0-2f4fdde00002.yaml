  nature: public broadcaster
  operator: British Broadcasting Corporation (BBC), funded by the UK television licence fee and operated under Royal Charter
  affiliations: BBC, accountable to Ofcom and the UK Parliament; required by Charter to be editorially impartial and independent of government
  audience: UK-wide adults seeking 24-hour news, sport, and live talk in English; significant overseas audience via online streaming
  format: rolling news and live sports talk — the BBC's flagship speech network combining breaking news bulletins, phone-ins, live commentary of football (incl. Premier League and FA Cup), cricket (Test Match Special crossover), Formula 1, rugby and Olympic coverage
  notes: Launched 28 March 1994, replacing BBC Radio 5 (an education/sport service that ran 1990-1994), as the BBC's first dedicated rolling-news/sport network; broadcast on AM (909/693 kHz) for decades and from 2002 also on DAB, Freeview and online; sister station 5 Sports Extra (1Xtra-style sport overspill) launched 2002; notable presenters have included Nicky Campbell, Rachel Burden, Stephen Nolan, Peter Allen, Victoria Derbyshire, Kermode & Mayo (originally), Eleanor Oldroyd, Mark Chapman and Colin Murray; the station has been at the centre of repeated debates about BBC impartiality, regional balance (the main hub moved from London to MediaCityUK in Salford in 2011 as part of the BBC North relocation) and the future of AM broadcasting; mission per the BBC's public purposes is "to provide impartial news and information to help people understand and engage with the world around them."
