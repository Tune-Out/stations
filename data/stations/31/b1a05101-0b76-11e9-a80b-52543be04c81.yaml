  operator: Mediacorp Pte Ltd (radio division), the national media network of Singapore; Mediacorp is wholly owned by Temasek Holdings, the Singapore government's investment company
  affiliations: Indirectly Singapore-government-linked through Temasek ownership of Mediacorp; not formally a state broadcaster but operates within Singapore's regulated media environment; no religious or party-political affiliation
  audience: English-speaking adult Singaporeans (broadly the 30-55 demographic) across the city-state on 95.0 MHz FM and via the meListen / Mediacorp digital platform
  format: Adult contemporary / hot AC music station, "The Biggest Hits, Best Variety" — pop, R&B and AC hits with morning- and drive-time talk-driven shows; long-running flagship "The Morning Express" and other personality-led programmes
  notes: Class 95FM launched on 1 January 1991 as Singapore's first English-language music FM service, originally branded as Class 95FM (then-Mediacorp predecessor SBC); it has consistently ranked among the most-listened-to English stations in Singapore in Nielsen radio surveys; Mediacorp's radio brands (Class 95, Gold 905, 987, Money FM 89.3, etc.) are streamed via meListen (formerly meRadio at meradio.sg); Mediacorp itself was corporatised from the Singapore Broadcasting Corporation in 1994 and is fully owned by Temasek Holdings.
