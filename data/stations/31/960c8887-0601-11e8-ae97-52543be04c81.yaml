  nature: public broadcaster
  operator: Norddeutscher Rundfunk (NDR), a public-service broadcaster within the ARD consortium serving Lower Saxony, Hamburg, Schleswig-Holstein and Mecklenburg-Vorpommern
  affiliations: ARD (Arbeitsgemeinschaft der öffentlich-rechtlichen Rundfunkanstalten der Bundesrepublik Deutschland); funded by Germany's public broadcasting fee (Rundfunkbeitrag)
  audience: German-speaking adult listeners in Schleswig-Holstein (Kiel, Lübeck, Flensburg) plus the broader NDR catchment
  format: 24/7 news, current affairs, background reporting, business and culture, with the Schleswig-Holstein opt-out carrying regional bulletins ("Schleswig-Holstein Nachrichten") and local stories
  notes: NDR Info is NDR's information channel, comparable to BBC Radio 4 / WDR 5; it broadcasts hourly news plus magazine programmes such as "Echo des Tages", "Streitkräfte und Strategien" and "Hintergrund". The Schleswig-Holstein stream is a regional opt-out carrying state-specific news from NDR's Kiel studio. As a public broadcaster NDR is governed by the inter-state treaty between the four northern German states and supervised by an independent Rundfunkrat; editorial independence from government is statutorily protected. NDR has occasionally been at the centre of debates about regional bias and budget allocation within the ARD system.
