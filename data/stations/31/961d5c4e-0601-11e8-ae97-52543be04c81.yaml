  notes: .977 Hitz (Today's Hits) is the contemporary-hits channel of the .977 Music internet radio network, which began as Club 977 in 1998, was formalised by founder Jeff Bachmeier around 2000 and is based in Daytona Beach, Florida. The ad-supported network runs about eleven automated genre channels via Triton's StreamTheWorld and has rebranded as Hitsradio, with 977music.com now redirecting to hitsradio.com. This stream is a tight, presenter-free rotation of current pop and dance chart hits with no terrestrial licence.
