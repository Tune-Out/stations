  nature: commercial
  operator: Private LLC "Govorit Moskva" (ООО "Говорит Москва"); revived in 2013 by journalist Sergei Dorenko and businessman Vladimir Pozhidayev under owners including Yury Fedutinov
  affiliations: politically aligned with the Russian establishment / pro-Kremlin patriotic discourse; not formally state-owned but content is closely aligned with state messaging on domestic and foreign policy; operates under Roskomnadzor licensing
  audience: Moscow-area and national Russian-speaking adults interested in political talk, news and current affairs
  format: News-talk radio — hourly bulletins, phone-ins, political and social commentary, expert interviews, with flagship shows historically associated with Sergei Dorenko ("Подъём", "Доренко") and Roman Babayan
  notes: The name revives the historic Soviet-era radio call sign "Говорит Москва" first used in 1922 by Moscow's Sokolniki station; the current commercial station relaunched on FM 94.8 MHz in Moscow on 2 September 2013 under chief editor Sergei Dorenko (1959-2019), the prominent "TV killer" of the 1990s; after Dorenko's death the station continued under editors Roman Babayan and Sergei Doroganev with a strongly pro-government, anti-Western editorial line that intensified after Russia's 2022 invasion of Ukraine; presenters including Babayan have been sanctioned by the EU, UK and Ukraine for propaganda activities.
  sources: internal knowledge only
