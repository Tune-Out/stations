  notes: 'Govorit Moskva is a Moscow news-and-talk station launched on 10 February 2014 on 94.8 FM, replacing RU.FM, and owned by businessman Mikhail Gutseriev''s media holdings. Its name revives the historic Soviet call sign first used by Moscow radio in the 1920s. Sergei Dorenko, the combative television presenter of the 1990s, was founding editor-in-chief until his death in 2019; since 24 June 2019 the post has been held by Roman Babayan, with Aleksey Gudoshnikov among the regular presenters. Output is rolling news, phone-ins, political and social commentary and expert interviews under the slogan "listen, think, know", aimed particularly at Moscow drivers. The station''s editorial line is firmly pro-government and hardened further after Russia''s 2022 invasion of Ukraine; Babayan has been designated by the EU and Ukraine over his propaganda work. Editorial flag: Pro-Kremlin political talk station whose editor-in-chief, Roman Babayan, has been sanctioned by the EU and Ukraine for propaganda activity; its wartime commentary tracks Russian state messaging on Ukraine and the West.'
