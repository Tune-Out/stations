  nature: commercial
  operator: Nation Media Group (Uganda), the Ugandan subsidiary of Nairobi-listed Nation Media Group Ltd (NMG), whose largest shareholder is the Aga Khan Fund for Economic Development
  affiliations: Part of NMG's Ugandan stable alongside the Daily Monitor newspaper, Dembe FM and NTV Uganda; no party or religious affiliation declared, though the Aga Khan Development Network connection ties the parent group culturally to the Ismaili community without religious editorial control
  audience: English-speaking urban adults in Kampala and central Uganda, skewing upmarket and professional
  format: Talk-driven hot-AC commercial radio with news, sports, business, entertainment and live discussion shows
  notes: KFM launched on 93.3 MHz in Kampala in 2003 as the English-language sister station to Dembe FM, both operated by Monitor Publications Ltd within Nation Media Group; the station built its reputation on talk and current-affairs programming including the long-running D'Mighty Breakfast, D'Hook, K-Drive and KFM Sports, and on coverage of Ugandan politics and Premier League football; as part of NMG, KFM has periodically been caught up in regulatory friction with the Ugandan government (notably the 2013 raid on Monitor offices over reporting on a leaked army memo)
