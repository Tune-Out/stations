  notes: Colombia Salsa Dura is one of several themed channels operated by Sistema Colombia Crossover, an internet-radio network based in Colombia (geo-tagged Manizales, though the station's webpage references Medellín). The station's stated mission is to bring listeners "el sonido original y sin filtros de la salsa dura" (the original, unfiltered sound of hard salsa) and to maintain "la esencia de la salsa en su máxima expresión." Featured artists include Hector Lavoe, Willie Colon, Ruben Blades, El Gran Combo, and other Fania All-Stars. The station explicitly excludes commercial and modern fusion formats, positioning itself as a purist's outlet for the genre's golden age. Contact via WhatsApp +57 305 403 8388 and mercadeo@colombiacrossover.com.
