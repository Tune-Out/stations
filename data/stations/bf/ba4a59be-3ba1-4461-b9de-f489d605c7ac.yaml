  nature: public broadcaster
  operator: Rádio e Televisão de Portugal (RTP), Portugal's state-owned public-service broadcaster.
  affiliations: European Broadcasting Union (EBU); owned by the Portuguese state and funded through the Contribuição Audiovisual (audiovisual contribution) and government appropriations.
  audience: Younger, culturally engaged Portuguese-speaking listeners interested in alternative, independent, and Portuguese-language music; national reach with extensions to Madeira and the Azores.
  format: Alternative and independent music station with a focus on new Portuguese acts, indie rock/pop, hip-hop, and electronic, complemented by science, comedy, and cultural talk shows.
  notes: Launched in 1994 as RTP's third national radio network alongside Antena 1 (news/talk) and Antena 2 (classical), Antena 3 is regarded as a key promoter of new Portuguese music and stages the annual "Prémios Play – Prémios da Música Portuguesa" and "Festival F" partnerships; signature programmes include "Fricção Científica," "Vocês Sabem Lá," "Aleixo FM," and live session strand "Ao Vivo na Antena 3"; broadcasts on FM, DAB+, and streaming via RTP Play.
  sources: https://antena3.rtp.pt/, internal knowledge
