  nature: commercial
  operator: Grupa Eurozet — major Polish private radio group; Eurozet is jointly controlled by Agora SA (Polish media holding) and Czech-based investors (historically SFS Ventures / Lagardère Active).
  affiliations: No religious or political party affiliation; Agora SA has been associated with the liberal/independent Polish press (Gazeta Wyborcza) and has historically been in conflict with the right-wing Law and Justice (PiS) government over media policy.
  audience: Polish adult listeners 25-49, urban audience in Warsaw and major cities; Polish-language.
  format: Adult-contemporary dance/pop format — "100% radosnej muzyki" ("100% happy music"); contemporary pop, dance, and pop dance hits with upbeat presenter-led shows.
  notes: "Meloradio was launched in 2014 as a rebrand of Eurozet's earlier \"Radio Eska Rock\"/legacy frequencies into a feel-good melodic pop format; broadcasts in multiple Polish cities on FM (e.g., 99.4 MHz Warsaw, 95.5 MHz Kraków); Eurozet group also operates Radio ZET (Poland's #2 commercial network), Antyradio and Chillizet; in 2019 Agora SA acquired a controlling stake in Eurozet, a deal that faced regulatory and political scrutiny from the PiS-era Polish competition authority before being approved; Meloradio targets the lighter-end adult-contemporary segment of the Polish market."
  sources: internal knowledge only
