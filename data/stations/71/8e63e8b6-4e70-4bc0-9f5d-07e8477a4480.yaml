  nature: state media
  operator: Egyptian Radio and Television Union (ERTU / اتحاد الإذاعة والتلفزيون المصري) — Egypt's state broadcaster; programming associated with Al-Azhar Al-Sharif religious establishment
  affiliations: Sunni Islam (mainstream / Al-Azhar tradition); Egyptian government via ERTU; operates with religious oversight from Al-Azhar scholars
  audience: Arabic-speaking Muslim listeners across Egypt and the wider Arab world / global Muslim diaspora
  format: 24-hour Qur'anic recitation (Tilawah) by famous reciters (Sheikh Mahmoud Khalil Al-Hussary, Abdel-Basit Abdel-Samad, Mohamed Siddiq El-Minshawi, Mishary Al-Afasy and others), Islamic religious lectures (durus), tafsir, hadith, fiqh programming, and call-to-prayer (adhan)
  notes: Idha'at al-Qur'an al-Karim min al-Qahira ("Holy Qur'an Radio from Cairo") launched 29 March 1964 under President Gamal Abdel Nasser, the first dedicated Qur'anic radio station in the world. Became a model for similar stations across the Muslim world (Saudi Arabia, Sudan, UAE, etc.). Broadcasts on AM/MW, FM and satellite, and is one of the most widely listened Islamic stations globally. Programming is curated by Al-Azhar scholars; recitations are of the Hafs an Asim qira'ah common in the Arab world.
