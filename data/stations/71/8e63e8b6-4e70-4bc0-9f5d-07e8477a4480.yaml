  notes: Idha'at al-Qur'an al-Karim min al-Qahira (Holy Qur'an Radio from Cairo) is the world's first radio station dedicated to Qur'anic recitation, launched on 25 March 1964 by Egyptian state radio, opening with a recitation by Sheikh Mahmoud Khalil al-Husary. It is operated by the Egyptian Radio and Television Union under the National Media Authority and broadcasts on 98.2 FM in Greater Cairo, on FM in Alexandria, Port Said and other cities, on medium wave and via Nilesat. Programming is continuous recitation by more than 80 reciters including Abdul Basit Abdul Samad, Mustafa Ismail, Muhammad Rifaat and al-Minshawi, plus Islamic lectures, tafsir and adhan. It is one of the most widely heard religious stations in the Arab world; the catalog homepage is just a Radiojar stream URL, while the official site is misrquran.gov.eg.
