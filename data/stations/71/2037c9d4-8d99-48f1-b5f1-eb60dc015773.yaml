  affiliations: SRG SSR, the Swiss public-service broadcaster, funded primarily by the Serafe household licence fee with limited advertising and operating under federal mandate
  audience: Swiss adult listeners across all language regions (German, French, Italian, Romansh) plus international jazz fans; multilingual presentation
  format: Continuous jazz music in all styles — classic, modern, vocal, fusion, swing, blues-jazz — with minimal presenter intervention and announcements in all four Swiss national languages
  notes: One of three SRG SSR digital-only "Radio Swiss" stations (alongside Radio Swiss Classic and Radio Swiss Pop), launched in the 2000s to provide ad-free, themed music streams; available on DAB+ and online; SRG SSR is required by Swiss federal law to serve all four national language communities and to remain politically neutral; Radio Swiss Jazz is non-commercial and curated by professional music programmers rather than live DJs.
