  operator: Radio Televisyen Malaysia (RTM) under the Malaysian Ministry of Communications (Kementerian Komunikasi)
  affiliations: Government of Malaysia; broadcasts in line with state media policy and serves as an official information channel
  audience: Malay-language Malaysian listeners nationwide; targets a general adult audience with emphasis on national identity, civic affairs, and Malay culture
  format: Malay-language full-service public radio — news, current affairs, talk, religious (Islamic) programmes, Malay music, and cultural content
  notes: Nasional FM (originally "Radio 1" and earlier "Radio Malaysia") is the flagship national Malay-language radio service of RTM, with origins dating to 1946 broadcasting under British colonial rule. RTM was formed in 1969 by merging Radio Malaysia and Televisyen Malaysia. As the state broadcaster, Nasional FM carries official announcements, Friday sermon broadcasts, the Quran recitation programmes, and major national addresses. It broadcasts on FM nationwide (88.5 MHz in the Klang Valley) and via DAB, satellite, and online via myKlik.
