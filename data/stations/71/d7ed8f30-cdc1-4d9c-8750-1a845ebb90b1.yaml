  notes: Nasional FM is the flagship Malay-language national radio service of Radio Televisyen Malaysia (RTM), a department of the Malaysian government. It launched on 20 June 1975 as Malaysia's first FM stereo station, was known as Radio Muzik, Radio 1 and Radio 2, and took its current name on 1 January 2012 after the demerger of Klasik Nasional FM. It broadcasts nationwide on FM (88.5 MHz in the Klang Valley), via Astro/MYTV and online, with a full-service mix of news, talk, Islamic religious programmes and Malay music under the motto "Sentiasa di Hati".
