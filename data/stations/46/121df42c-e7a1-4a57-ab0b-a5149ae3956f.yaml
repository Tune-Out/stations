  audience: Residents and visitors of Zushi, Hayama and the broader Shonan coast (Kanagawa Prefecture); broadcasts in Japanese
  format: Jazz-led community FM with local news, weather, town information, lifestyle and disaster-preparedness blocks
  notes: Launched in 1995 as Japan's pioneering community FM along the Shonan coast on 78.9 MHz; one of the early Japanese community stations to adopt a strong music-genre identity (jazz/AOR) rather than generic talk. Daily strands include AFTERNOON JAZZ, JAZZY BREAK, LIGHTS OUT and MIDNIGHT JAZZ; produces the SHONAN JAZZ BY THE SEA live-event series and a print magazine. Carries mayoral/prefectural interviews ("市町長県議インタビュー") and Good Love防災 disaster-prep segments as part of its community licence obligations. Operates a 24時間 Zetta visualisation/YouTube simulcast for the station.
