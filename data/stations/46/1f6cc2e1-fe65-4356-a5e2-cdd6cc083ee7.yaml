  audience: Dutch-speaking listeners in the eastern Netherlands (notably Twente, Achterhoek, Drenthe, Gelderland) who enjoy "piratenhits" — Dutch-language schlager, levenslied, and Tukker/Twents dialect songs
  format: 24/7 Dutch dialect and "piratenhits" music — self-described as "de beste piratenplaten en dialectmuziek" (the best pirate records and dialect music)
  notes: Tukker FM is a regional Dutch radio station named after the Tukker (Twents) regional identity in Overijssel's Twente area; the format celebrates Dutch "piratenmuziek" — a uniquely Dutch genre tied historically to unlicensed land-based pirate stations in the rural north and east that broadcast schlager, polka, levenslied, and Twents-dialect songs from the 1970s onward; Tukker FM has since legitimised onto licensed DAB+ (rolled out March 2026) and Ziggo cable channel 866, and operates regional sub-streams for Drenthe, Friesland, Gelderland, Groningen, Noord-Holland, Twente, and Zwolle; the station organises the large "Donders Dikke Tent Party" festival events and a mobile "Tukker FM On Toer" drive-in service, and runs a Tukker TV livestream alongside the audio service.
  sources: https://www.tukker.fm/, internal knowledge
