  notes: 1.FM is a Switzerland-based internet radio operator that runs more than 60 streaming channels across genres. "Rock Classics Radio" is one of its long-running channels devoted to canonical classic rock acts (Led Zeppelin, The Rolling Stones, Pink Floyd, Eagles, Aerosmith, etc.). Founded in 1999, 1.FM was one of the earliest commercial internet radio brands; it serves a global audience via its web player, mobile apps, smart speakers, and aggregator directories. Funded through advertising and premium ad-free subscriptions; the parent operates under the 1cloud.fm platform.
