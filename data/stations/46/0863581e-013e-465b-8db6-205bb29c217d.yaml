  notes: CCTV-13 (China Central Television News Channel) launched 1 May 2003 as the PRC's dedicated 24-hour news channel; carries the flagship 7 p.m. 新闻联播 (Xinwen Lianbo) bulletin watched by hundreds of millions, plus 朝闻天下, 东方时空, 焦点访谈, and 新闻1+1. CCTV is administered by China Media Group (中央广播电视总台), formed in 2018 by merging CCTV, CNR and CRI under direct CCP Publicity Department leadership; its editorial line strictly follows Party direction. The "伴音" (sound-only) feed here is an audio-only stream of the TV channel relayed via SuperRadio.cc, an aggregator portal rather than an official CCTV property.
