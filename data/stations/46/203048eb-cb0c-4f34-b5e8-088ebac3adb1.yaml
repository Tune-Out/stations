  notes: TRT Radyo 3 is the music and culture channel of Turkey's public broadcaster TRT, launched on 9 September 1974 and produced in Ankara. It carries classical, jazz, pop, rock and world music under the tagline "müzikte kalitenin adı" (the name of quality in music), with news bulletins at 07:00, 12:00, 17:00 and 22:00. It relays the EBU's Euroclassic Notturno overnight and was the second Turkish station to broadcast in FM stereo.
