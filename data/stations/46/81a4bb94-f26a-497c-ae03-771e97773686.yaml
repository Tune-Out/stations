  nature: public broadcaster
  operator: Nederlandse Publieke Omroep (NPO) — Dutch public service broadcasting umbrella, with content produced by participating member broadcasters (notably BNNVARA, KRO-NCRV, AVROTROS, PowNed and others)
  affiliations: Dutch public media system, funded via state-allocated public broadcasting budget administered by NPO; no commercial owner; no religious or political party affiliation
  audience: Dutch-speaking young-adult audience (roughly 20–39) across the Netherlands
  format: Mainstream alternative-leaning pop and rock with live DJ shows, charts, talent showcasing and news bulletins; tagline "We Want More"
  notes: Launched 1 December 1965 as Hilversum 3 and rebranded Radio 3 then 3FM (1995); one of the three flagship national NPO radio networks (alongside NPO Radio 1 and NPO Radio 2); originally known as the home of Dutch top-40 pop, the network repositioned in the 2010s toward an alternative-pop identity to fight ratings declines; home of the annual "Serious Request" / "Glazen Huis" charity campaign in cooperation with the Red Cross which has raised tens of millions of euros for humanitarian causes; broadcasts FM nationwide via the public transmitter network plus DAB+ and Icecast streams operated by NPO.
