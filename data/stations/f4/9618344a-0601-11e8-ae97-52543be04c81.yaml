  audience: English-speaking eclectic music enthusiasts, college students, and freeform-radio purists across eastern United States; global via streaming
  format: Freeform FM — music, spoken word, educational programming, and community content; volunteer DJs with complete autonomy over playlists; genres span indie rock, experimental, world music, jazz, comedy, and archive material
  notes: WFMU 91.1 FM is a listener-supported freeform station licensed to East Orange, New Jersey, founded in April 1958 as the Upsala College station and owned since 1994 by the non-profit Auricle Communications; it now operates from Jersey City with a Hudson Valley repeater. Volunteer DJs have full control over their shows, producing an eclectic, experimental and often comic mix of music, spoken word and archive material. Rolling Stone named it the best radio station in the country four years running (1991-94); it raises roughly 70% of its budget online and was the first station to stream live to the iPhone in 2007. Runs sister web streams such as Give the Drummer Radio, Rock 'n' Soul Radio and Sheena's Jungle Room.
