  audience: Persian speakers inside Iran and in the diaspora
  format: 24/7 Persian-language news, current affairs, culture and music
  notes: Radio Farda ("Radio Tomorrow") is RFE/RL's Persian-language service, launched in December 2002 as a joint RFE/RL–Voice of America project and run solely by RFE/RL from its Prague headquarters since 2008. Funded by the US Agency for Global Media, it broadcasts 24 hours a day into Iran via satellite, shortwave and online with news, analysis and cultural programming, and is routinely jammed and blocked by Iranian authorities. After the March 2025 executive order to dismantle USAGM it lost most freelancers and furloughed about a quarter of staff, but continues operating with reduced capacity under the FY2026 appropriation and EU emergency support; audiences surged during the 2025 Israel–Iran conflict. The catalog's Akamai stream URL now redirects to the station's Radiojar stream (cp13r2cpn3quv).
  sources: https://en.wikipedia.org/wiki/Radio_Farda; https://about.rferl.org/service/radio-farda/; https://www.publicmediaalliance.org/filling-the-gap-left-by-rfe-rl/; https://www.radiofarda.com/
