  notes: Rádio Regina Stred is the central-Slovakia edition of Rádio Regina, the regional network of Slovakia's public broadcaster, produced from the Banská Bystrica studio alongside sister editions in Bratislava (Západ) and Košice (Východ). It carries regional news, magazine programmes, folk and popular music for the Banská Bystrica and Žilina regions. On 1 July 2024 RTVS was replaced by the new public entity Slovenská televízia a rozhlas (STVR), and the station's homepage has moved to reginastred.stvr.sk. The catalog's "regional-mexican" tag is wrong.
