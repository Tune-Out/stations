  notes: .977 Country is the country-music channel of the .977 Music internet radio network, an ad-supported online operation that started as Club 977 in 1998, was built out by founder Jeff Bachmeier around 2000 and is based in Daytona Beach, Florida. The network streams about eleven automated genre channels through Triton's StreamTheWorld and has rebranded as Hitsradio (977music.com now redirects to hitsradio.com). This channel plays continuous mainstream contemporary country hits without presenters and holds no terrestrial licence.
