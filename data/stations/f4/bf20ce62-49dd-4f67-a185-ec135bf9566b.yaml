  operator: Radio Freedom / Free Dom (founded and owned by Camille Sudre and family; later owned by his children)
  affiliations: historically left-leaning / pro-autonomy editorial line; no formal political party affiliation
  audience: Reunion Island French-speaking residents; the island's most-listened-to private radio
  format: General-interest talk and music with strong emphasis on listener call-in shows, local news, and Reunion cultural content
  notes: Launched in 1981 as a pirate FM station by physician Camille Sudre, becoming the first "free radio" on Reunion and a cornerstone of the island's media landscape; central to the 1991 "Chaudron" social unrest after its broadcasting authorisation was withdrawn (the conflict spawned the short-lived Mouvement Indépendantiste Réunionnais and "Téléfree-Dom" TV); ownership remained with the Sudre family for decades; now broadcasts on multiple FM frequencies across Reunion and on the web; renowned for the long-running call-in show that gave voice to islanders during cyclones and social crises.
  sources: internal knowledge only
