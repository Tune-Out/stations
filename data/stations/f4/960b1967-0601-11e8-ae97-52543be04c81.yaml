  notes: Nashe Radio (Наше Радио, 'Our Radio') is a Russian commercial rock network launched on 14 December 1998 with a then-novel all-Russian-rock format that helped define the post-Soviet 'russkiy rock' canon (DDT, Kino, Aquarium, Splean, Bi-2, Mumiy Troll). It is part of Multimedia Holding alongside Rock FM, Radio Jazz and Radio Ultra, and broadcasts in most major Russian cities; in Moscow it moved from 101.7 to 101.8 FM on 9 July 2024. Signature programming includes the weekly 'Chartova Dyuzhina' chart and awards, and the station founded the Nashestvie open-air festival held from 1999 to 2019, which drew criticism over Ministry of Defence sponsorship in its later years. The format remains conservative, centred on established acts from the 1980s-2000s.
