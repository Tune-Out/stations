  affiliations: none formal; cultural identity tied to championing Russian-language rock music; no party or religious affiliation
  audience: Russian-speaking adult rock fans (typically 25-45); nationwide on FM in most major Russian cities (101.7 FM in Moscow) and online globally
  format: '"Наше Радио" ("Our Radio") — Russian-language rock format featuring classic and contemporary Russian rock (русский рок) from artists such as DDT, Aquarium, Kino, Splean, Bi-2, Mumiy Troll, Leningrad and others'
  notes: Nashe Radio launched on 14 December 1998 with a then-revolutionary all-Russian-rock format that helped revive and define the russkij rock canon; producer of the annual "Чартова Дюжина" ("Chart Dozen") awards and the long-running open-air festival "Нашествие" ("Nashestvie"), one of the biggest rock festivals in Russia; part of the privately owned Multimedia Holding which also operates Best FM, Rock FM, Radio Jazz and Ultra; remained independent of Gazprom-Media and the European Media Group through the 2000s-2010s; the festival "Nashestvie" was historically sponsored in part by the Russian Ministry of Defence and from 2014 onwards faced controversy over military sponsorship and the cancellation of certain artists' sets.
  sources: internal knowledge only
