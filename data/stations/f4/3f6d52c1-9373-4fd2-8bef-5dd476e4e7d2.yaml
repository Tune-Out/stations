  nature: public broadcaster
  operator: Radio France Internationale (RFI), part of France Médias Monde, a French public audiovisual company
  affiliations: French state (sole shareholder via France Médias Monde); editorially independent under French public broadcasting law; no party/religious ties
  audience: Global Mandarin Chinese-speaking audience — diaspora plus listeners inside mainland China (where RFI's site is blocked) and Taiwan, Hong Kong, Southeast Asia
  format: 24/7 Mandarin-language news, current affairs, France/Europe/world coverage, China-focused reporting, talk and feature programmes
  notes: Stream URL (rfienchinois-64.mp3) and homepage (rfi.fr/cn) confirm this is RFI's Chinese-language service (法广 / RFI华语), not the CCTV bulletin "新闻联播" whose name was applied as a label. RFI launched in 1975, succeeding earlier ORTF/RTF overseas services; its Chinese service has roots going back decades and is a key non-CCP-controlled Mandarin news source. France Médias Monde is funded by a French public-broadcasting budget allocation (formerly the redevance audiovisuelle). RFI is blocked in mainland China and emphasises press freedom; together with BBC Chinese, VOA Chinese, and DW Chinese it is one of the major foreign Mandarin news services.
  sources: internal knowledge only
