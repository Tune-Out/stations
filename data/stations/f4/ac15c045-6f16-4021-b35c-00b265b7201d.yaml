  nature: commercial
  operator: Mediamax Network Limited (Kenyan media group; also operates People Daily newspaper, Milele FM, Pilipili FM and K24 TV)
  affiliations: Mediamax has historically been linked to interests associated with the family of former Kenyan President Mwai Kibaki and other political/business figures; the station itself does not openly declare a party affiliation, but Mediamax titles have been seen as broadly aligned with establishment/centrist Kikuyu political opinion
  audience: Kikuyu-speaking listeners in Kenya, primarily in Central Kenya, Nairobi and the Mt. Kenya region, plus the Kikuyu diaspora
  format: Kikuyu-language general-interest radio — talk, news, music (Gikuyu pop and gospel), call-in shows, current affairs and entertainment
  notes: Kameme FM was launched in the early 2000s and is one of Kenya's pioneering vernacular (Kikuyu-language) commercial FM stations; it broadcasts across multiple frequencies covering Central Kenya, Nairobi and surrounding Kikuyu-speaking regions; sister stations under Mediamax include K24 TV (English news TV), Milele FM (Swahili), Pilipili FM (Kamba), and the People Daily newspaper; the wider Mediamax group has experienced significant labour disputes and downsizing in the late 2010s, with publicly reported staff layoffs and salary delays.
