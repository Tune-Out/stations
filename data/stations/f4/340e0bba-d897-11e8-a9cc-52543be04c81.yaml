  operator: Radio Popular S.A. (COPE - Cadena de Ondas Populares Espanolas)
  affiliations: COPE group is majority-owned by the Spanish Episcopal Conference (Conferencia Episcopal Espanola, Roman Catholic Church) together with Cope-Jesuit and other Catholic-affiliated investors; RockFM itself is a secular music brand within that group
  audience: Spanish-speaking adult rock and classic-rock fans (25-55), nationwide via FM (101.7 in Madrid), DAB, online and the COPE app
  format: Classic rock and hard rock focus with talk inserts; flagship breakfast show "El Pirata y su banda" (06:00-10:00) with Carlos Marin "El Pirata", plus "RockFM Motel" with Rodrigo Contreras, "El Decalogo de Mariskal" and licensed weekly show "Little Steven's Underground Garage".
  notes: Launched on 26 October 2009 by COPE to replace the previous Cadena 100 FM Rock format, RockFM is a national commercial network with dozens of FM frequencies across Spain (Madrid 101.7, plus relays in most major cities); it is part of the COPE group which also owns COPE (news/talk), Cadena 100 (adult contemporary) and MegaStar FM (CHR); the network is positioned as the leading rock-format radio in Spain, regularly tops the EGM rock-listenership rankings, and runs the "RockFM Motel" live-music sessions and rock-festival sponsorships (Azkena Rock, Resurrection Fest etc.); editorially the station avoids religious or political programming despite its Catholic-affiliated parent group.
  sources: http://www.rockfm.fm/, internal knowledge
