  notes: Eco 99FM (אקו 99) is one of Israel's most popular commercial regional radio stations, broadcasting on 99 MHz FM primarily to the Tel Aviv metropolitan area; it shares facilities and ownership history with 103FM, both relocated to Ramat HaSharon studios in 2021 in a complex previously used by Bezeq; the station has long been associated with Maariv-affiliated media interests and runs popular morning, drive-time and evening music programs.
