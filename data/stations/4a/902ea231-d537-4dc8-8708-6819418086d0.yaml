  nature: state media
  operator: All India Radio (AIR / Akashvani), the radio division of Prasar Bharati, the autonomous public broadcasting corporation of India under the Government of India's Ministry of Information and Broadcasting
  affiliations: Government of India (statutory public broadcaster under the Prasar Bharati Act, 1990); no religious or political party affiliations
  audience: Pan-Indian general audience; Hindi-language primary with some regional content; one of India's most-listened-to national networks
  format: Entertainment-focused commercial service of AIR featuring Hindi film music (Bollywood), light music, talk segments, sponsored programmes and radio plays; the network's slogan historically "Bahujan Hitaya Bahujan Sukhaya" ("for the welfare and happiness of the many")
  notes: Launched 3 October 1957 specifically to counter the popularity of Radio Ceylon (which was broadcasting Hindi film music to Indian audiences). Vividh Bharati ("Various Indian") is the only commercial/advertisement-carrying service of All India Radio. Broadcasts on MW, FM, shortwave, and the Prasar Bharati / NewsOnAir streaming platforms. Iconic programmes include "Hawa Mahal", "Jaimala", and "Sangeet Sarita".
