  notes: SR 1 Europawelle is the flagship music-and-service channel of Saarländischer Rundfunk (SR), the ARD public broadcaster for Saarland, launched 2 January 1964 as Europawelle Saar. It runs an adult-contemporary format aimed at 30- to 49-year-olds with half-hourly news, weather and traffic, regional reporting and a Sunday-morning family programme in German and French, reaching roughly 263,000 regular listeners. It is licence-fee funded and available on FM, DAB+, cable, satellite and online.
