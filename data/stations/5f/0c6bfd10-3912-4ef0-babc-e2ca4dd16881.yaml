  operator: Organización Radial Olímpica S.A. (ORO) — the radio division of Grupo Char's Olímpica family conglomerate based in Barranquilla.
  affiliations: ASOMEDIOS (Colombian Media Association) and IAB Colombia; sister to Olímpica Stereo, Radio Tiempo, La Reina del Vallenato and related ORO brands; no religious, governmental, or political affiliations.
  audience: Spanish-speaking urban young adults across Medellín and broader Antioquia department, with the Mix brand carried in multiple Colombian cities.
  format: Tropical / urban Latin music — reggaeton, urbano, merengue, bachata, salsa and Latin pop — with chart shows ("El Ranking Mix") and entertainment/lifestyle segments.
  notes: Mix is a national network of stations operated by Organización Radial Olímpica, the broadcasting arm of the Char family-controlled Olímpica retail group (Grupo Char); the Medellín 89.9 FM frequency targets the Aburrá Valley with a youth-skewed reggaeton/urbano playlist; the Mix brand operates with city-by-city localisation through the "Elegir Ciudad" selector, with affiliates in Bogotá, Cali, Barranquilla, Cartagena and Panama; the parent ORO is one of Colombia's three large commercial radio networks alongside Caracol and RCN.
