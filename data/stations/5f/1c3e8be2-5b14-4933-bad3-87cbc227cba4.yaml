  notes: Deutschlandfunk is Germany's national spoken-word news and information channel, one of three services run by Deutschlandradio alongside Deutschlandfunk Kultur and Deutschlandfunk Nova. It began broadcasting from Cologne in 1962 and was folded into Deutschlandradio in 1994 when the West and East German national broadcasters were merged after reunification; it is headquartered in Cologne with a major studio in Berlin. Funding comes from the Rundfunkbeitrag household levy rather than advertising, and the Deutschlandradio state treaty guarantees editorial independence from government and parties. Its schedule of hourly news, Informationen am Morgen, Interviews der Woche, science strands such as Forschung aktuell and cultural features makes it one of the reference news services of the German-speaking world. The catalog name carries codec junk that should be trimmed.
