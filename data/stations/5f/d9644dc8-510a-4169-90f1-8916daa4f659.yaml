  notes: GOLD 104.3 (callsign 3TTT) is a Melbourne FM commercial radio station broadcasting on 104.3 MHz, originally launched in 1980 as 3TT. Owned and operated by the Australian Radio Network (ARN Media, formerly HT&E), one of Australia's largest commercial radio groups (also operating KIIS Network and iHeartRadio Australia). GOLD 104.3 has consistently been one of Melbourne's highest-rated stations, particularly in the 40+ demographic. Flagship breakfast program "Christian O'Connell Breakfast Show" (since 2018, headlining UK import Christian O'Connell) has won multiple ACRA awards including Best On-Air Team. Other personalities have included Jo Stanley and Brigitte Duclos. The station's classic-hits/adult-contemporary positioning targets the "Greatest Hits of All Time" branding.
