  notes: HR 2 (Drugi program / "Second Programme") is one of three nationwide HRT public radio channels alongside HR 1 (general/news) and HR 3 (classical/highbrow culture); HRT traces roots to Radio Zagreb founded in 1926, the first public radio station in Southeast Europe; HR 2 is known as the most listened-to of the HRT radio channels and historically serves as the broadcaster of choice for drivers thanks to extensive traffic reporting (Hrvatski autoklub partnership). HRT is constitutionally mandated as an independent public broadcaster but its governance and editorial independence have periodically been subject to political controversy in Croatia.
