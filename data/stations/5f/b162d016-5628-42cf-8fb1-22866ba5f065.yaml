  notes: 'Play 90''s is the 1990s channel of Play Radio, a Romanian broadcaster based in Constanța that runs a family of streams: the main Play Radio service plus Play 90''s, Play Café and Play Urban, with a separate FM outlet on 91.6 MHz. The 90''s channel plays Eurodance, dance and hip-hop from the decade, and the site backs it with a searchable song database, a listener request system and a TOP REQUEST chart of the most-asked-for tracks. It is free to listen to on the web, via M3U playlist and through iOS and Android apps, and streams at an unusually high 192 kbps AAC for a station of this size. The operator does not publish details of its ownership or staff.'
