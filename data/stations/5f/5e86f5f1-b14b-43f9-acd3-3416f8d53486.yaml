  nature: commercial
  operator: Lagardère News (Lagardère Group), with the Lagardère media division acquired by Vivendi/Bolloré group from 2021 onward
  affiliations: part of the Lagardère Radio cluster (with Virgin Radio and RFM); generally centre-right editorial line under Bolloré ownership
  audience: French national general-interest adult audience (talk radio listeners)
  format: generalist talk and news radio (news, debates, talk shows, interviews, sports and entertainment), French-language
  notes: Europe 1 is one of France's three major historic "généralistes" (alongside RTL and France Inter); founded in 1955 as Europe n°1 broadcasting from the Saarland on long-wave to circumvent the French state broadcasting monopoly; pioneered modern French radio formats and launched many careers (Coluche, Jean-Luc Lagardère's media empire grew around it); since the Vivendi/Bolloré takeover of Lagardère it has shifted toward a more conservative editorial line and has shared programming and personalities with the CNews TV channel, drawing criticism from journalism unions about editorial independence.
  sources: internal knowledge only
