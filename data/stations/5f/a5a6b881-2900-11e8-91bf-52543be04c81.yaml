  notes: RTL2 is a French national commercial music station created on 6 January 1992 from the merger of Maxximum and Radio Métropolys, and is owned by Groupe M6 (part of RTL Group) alongside RTL and Fun Radio. Branded 'Le Son Pop-Rock', it broadcasts from Paris on 105.9 FM and nationwide on FM and DAB+, with about 2 million daily listeners in 2026 and a positioning as the leading music station for 25-49 year-olds. Programming mixes contemporary pop-rock with 1980s-2000s classics, plus live acoustic sessions and a morning show. The station's primary catalog stream URL is dead; the icecast.rtl2.fr feed now redirects to an Audiomeans server that works.
