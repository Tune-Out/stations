  notes: Classic Perlen ("classic pearls") is one of the thematic web channels of ROCK ANTENNE, the Bavarian rock network launched in 2000 from Ismaning near Munich and owned jointly by Studio Gong and the Antenne Bayern group. Where the main service plays the familiar rock canon, Classic Perlen is programmed for listeners who want album tracks and overlooked catalogue from the same era. It sits in a family of around twenty ROCK ANTENNE sub-channels including Heavy Metal, Alternative, Hair Metal, Punk Rock and 80er Rock. The channel is stream-only and ad-supported; the parent station holds a Bavarian terrestrial licence and carries nationally on DAB+.
