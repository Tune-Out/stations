  notes: LOS40 México is the Mexican arm of PRISA Radio's LOS40 pop brand, operated locally by Radiópolis and broadcasting from Mexico City on XEX-FM 101.7 MHz. The network launched in its current form in August 2002 and now covers 34 frequencies across Mexico, part of a LOS40 franchise present in about a dozen countries. Programming is contemporary hit radio in Spanish and English built around chart countdowns, and the station leans on live events, festivals and acoustic sessions under its 'La Radio de los Conciertos' positioning. The StreamTheWorld feed is live.
