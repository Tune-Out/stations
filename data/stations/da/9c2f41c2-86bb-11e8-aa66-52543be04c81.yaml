  notes: NPO Radio 4 is the Netherlands' national public classical music station, broadcasting on FM, DAB+ and online; in late 2023 it was rebranded "NPO Klassiek" with the radio4.nl domain redirecting to npoklassiek.nl, hence the redirect observed during research; landmark programming includes the AVROTROS Vrijdagconcert (Friday Concert) from TivoliVredenburg and overnight "De Nacht van" classical streams; as part of NPO it operates under the editorial independence guarantees of the Mediawet.
