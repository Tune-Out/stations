  operator: P4 Radio Hele Norge AS (headquartered in Lillehammer), a subsidiary of MTG (Modern Times Group) since 2012; part of the Nordic Entertainment Group / Viaplay Group commercial-radio family
  affiliations: none known (no political, religious or governmental ties); advertising- and sponsorship-funded
  audience: Norwegian adult listeners (30+) with a taste for soft, melodic pop from the 1960s through 2000s and seasonal Christmas music
  format: Adult-contemporary "soft hits" / oldies channel ("Klem" means "hug" in Norwegian) emphasising mellow, sing-along pop classics and an extended Christmas-music format during the holiday season.
  notes: P7 Klem is one of the multi-channel commercial-radio offerings run by P4-gruppen (P4 Group) from its Lillehammer studios, alongside flagship P4 and Radio Vinyl. It is distributed nationwide on the Norwegian Riksblokk DAB+ multiplex (which replaced FM nationally from 2017) and online via P4's player. The station is positioned as a "feel-good" companion brand to P4 and gained particular visibility during the Christmas season, when it switches to wall-to-wall holiday programming. Bauer Media acquired MTG's Nordic radio assets including P4 Group in 2019.
  sources: internal knowledge only
