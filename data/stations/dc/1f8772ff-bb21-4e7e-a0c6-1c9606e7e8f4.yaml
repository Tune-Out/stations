  nature: state media
  operator: Radio Free Europe/Radio Liberty (RFE/RL), a non-profit news organisation funded by an annual grant from the United States Congress via the U.S. Agency for Global Media (USAGM)
  affiliations: U.S. government-funded international broadcaster; editorially firewalled from USAGM but ultimately a U.S. public-diplomacy outlet
  audience: Ukrainian- and Russian-speaking audiences in Ukraine and across the post-Soviet space; svoboda.org is the Russian-language RFE/RL site, but this entry is tagged as the Ukrainian "Radio Svoboda" service (Радіо Свобода)
  format: 24/7 news, current-affairs talk, investigative reporting and political analysis focused on Ukraine, Russia, and the broader region
  notes: Radio Svoboda traces its lineage to the Cold War-era Radio Liberty, founded in 1953 to broadcast into the Soviet Union; the Ukrainian Service was established in 1954 and reopened in Kyiv after Ukrainian independence; following Russia's 2022 full-scale invasion of Ukraine, Russian authorities designated RFE/RL as a "foreign agent" and later an "undesirable organisation", while Ukrainian Radio Svoboda continued operating from Kyiv, Prague and abroad with a strong investigative wing (Schemes / "Схеми"); regarded inside Ukraine as a leading independent investigative newsroom even though its funding is governmental.
  sources: internal knowledge only
