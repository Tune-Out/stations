  nature: commercial
  operator: Fiducial Médias (subsidiary of Fiducial SA, owned by Christian Latouche); acquired 2013 for ~€7 million, approved by CSA
  affiliations: Politically the station is widely described as right-leaning / conservative-libertarian since the Fiducial takeover, hosting many figures from the French right and populist commentariat under a "free speech" editorial banner; commissions IFOP-Fiducial political polls. No religious affiliation. No formal party affiliation.
  audience: French-speaking general audience across France, with a strong reach in the south-west (historical heartland in Toulouse / Pyrenees) and an increasingly national news/talk audience
  format: News, talk, opinion, interviews, sports (notably rugby — Top 14 and Pro D2), politics, economics, lifestyle; "toute l'actualité nationale et internationale"
  notes: Founded 1958 as Andorradio / Radio des Vallées d'Andorre, later Sud Radio; one of France's historic "périphérique" (peripheral) stations alongside RTL, Europe 1, RMC. Pivoted to a national news/talk format under Fiducial ownership; known for its tagline "la parole libre" / free-speech editorial positioning, which critics associate with platforming heterodox and right-wing voices. Broadcasts on FM nationwide plus DAB+ and online.
  sources: https://www.sudradio.fr/, https://en.wikipedia.org/wiki/Sud_Radio, https://fr.wikipedia.org/wiki/Sud_Radio_(France), https://www.linforme.com/medias-culture/article/comment-sud-radio-profite-de-sa-parole-libre_2830.html, internal knowledge
