  affiliations: No party affiliation; editorially right-leaning 'parole libre' positioning, commissions IFOP-Fiducial polls; has been in legal disputes with Médiamétrie over audience measurement
  audience: French general audience with historic strength in the south-west (Toulouse, Occitanie) and a growing national news/talk audience
  format: 'Generalist news-talk: news, debates, opinion, politics, economics, rugby (Top 14/Pro D2), lifestyle'
  notes: Sud Radio is a historic French 'périphérique' station founded on 18 September 1958 as Andorradio, broadcasting from Andorra to south-west France, and since September 2013 owned by Fiducial Médias, part of Christian Latouche's Fiducial group. Under Fiducial it pivoted from a regional music-and-rugby station to a national news-talk network on FM in 29 departments, in Île-de-France and on DAB+, branded around 'la parole libre'. That free-speech positioning has drawn criticism for platforming right-wing and heterodox commentators, and the station has feuded publicly with Médiamétrie over its audience ratings. Rugby remains a signature, alongside political interviews and debates. Ordinary partisan talk rather than propaganda.
