  nature: state media
  operator: Pakistan Broadcasting Corporation (PBC / Radio Pakistan), an autonomous statutory corporation under the Ministry of Information and Broadcasting of the Government of Pakistan
  affiliations: Government of Pakistan; established under the Pakistan Broadcasting Corporation Act 1973
  audience: Sindhi-speaking residents of upper Sindh province around Khairpur, Sukkur and surrounding districts; rural agricultural communities
  format: Sindhi-language regional public service - news bulletins from Radio Pakistan, folk and classical Sindhi music, agricultural programmes, religious content during Ramadan, talk shows and government announcements
  notes: FM 101 Khairpur is part of Radio Pakistan's nationwide FM 101 network of regional stations operated by PBC; broadcasts on 101 MHz from a transmitter in Khairpur Mir's, Sindh; PBC traces its origins to All-India Radio's Lahore station (1937) and was reorganised after Partition in 1947 and again under PBC Act 1973; as a state broadcaster its editorial line generally reflects the government's policy, and during the 2024-2025 period Reporters Without Borders and other press-freedom monitors have continued to highlight restrictions on Pakistan's media; programming is mandated to include news from the central Radio Pakistan news service and to give significant airtime to nation-building, public-health and religious (Islamic) content as part of PBC's public-service mandate.
