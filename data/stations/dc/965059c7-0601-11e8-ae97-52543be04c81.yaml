  notes: Berlin-based independent community broadcaster offering "next level radio" focused on music discovery and cultural events. Channels include FluxFM Finest, ElektroFlux, Techno Underground, Sound of Berlin, ChillHop. Notable shows include "Was für ein Leben" (lifestyle interviews), "Kiez und Kids" (family), "FluxFM Cosmorama" (cultural). Heavy emphasis on community engagement ("Werdet Teil der Flux-Community!") and live events/festivals through FluxMusic app.
