  notes: Looktung Network operates a dedicated internet stream of Luk Thung music, a genre of Thai country/folk music originating from rural northeast and central Thailand. The name translates as "ลูกทุ่ง" (child of the fields). The station broadcasts at 256 kbps MP3 and maintains a very simple website at looktung.net. Luk Thung has experienced a cultural revival in Thailand in recent years, particularly among younger audiences. The station streams via the login.in.th media server infrastructure.
