  notes: 'Radio Mojdeh ("Radio Good News") is a Persian-language Christian broadcaster serving Iranians inside Iran and in the diaspora. Output is evangelical: live programming, worship music, sermons and Bible teaching, prayer segments, listener testimonies and podcasts, all in Farsi, plus media resources such as the animated film King of Glory. Alongside the internet stream it broadcasts by satellite on Yahsat 52.5° East, transponder 13, frequency 11958, which is how it reaches listeners inside Iran where Christian broadcasting is not licensed. The site carries a 2024 copyright and no disclosed parent ministry, leadership or funding detail. This entry duplicates a higher-voted canonical record for the same station on the same homepage and stream host.'
