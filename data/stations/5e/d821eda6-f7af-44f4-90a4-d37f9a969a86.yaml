  nature: non-commercial
  operator: Dar al-Hadith al-Salafiyya bi-Dammaj (دار الحديث السلفية بدماج) — Salafi Islamic teaching institute originally based in Dammaj, Saada Governorate, Yemen
  affiliations: Sunni Islam, Salafi (Athari) movement; historically associated with the legacy of Sheikh Muqbil bin Hadi al-Wadi'i (d. 2001) and later students including Sheikh Yahya al-Hajuri and reportedly Sheikh Bassam al-Imam; self-described "إذاعة سلفية" (Salafi radio) and "منبر العلم والسنة" (platform of knowledge and the Sunnah)
  audience: Arabic-speaking Salafi Muslims in Yemen and the wider Arab world; classical Arabic
  format: Religious broadcasting — Quranic recitation, hadith study, Salafi scholarly lectures (durus), fatwas, fiqh and aqeedah lessons
  notes: Dar al-Hadith was founded in the 1980s by Yemeni Salafi scholar Muqbil al-Wadi'i in the village of Dammaj and became one of the most prominent Salafi madrasas in the Arabian Peninsula, attracting thousands of students from around the world; the institute and its surrounding community were besieged by Houthi forces in 2011–2014 during Yemen's civil conflict and most students and scholars were displaced — operations dispersed to other governorates (Hadhramaut, Mahweet, Hudaydah, Marib, Taiz) and online; the radio extends the institute's da'wa (Islamic propagation) mission via the internet from the Wordpress-hosted radiodaralhdeth.wordpress.com and radio2.daralhdeth.com domains; the Salafi-Madkhali current associated with this network is generally apolitical and rejects revolutionary Islamism, though theologically conservative; broadcasts via raw IP stream (45.76.80.46), a hosting choice that reflects limited Yemeni broadcasting infrastructure during the ongoing war
  sources: https://radio2.daralhdeth.com/, internal knowledge
