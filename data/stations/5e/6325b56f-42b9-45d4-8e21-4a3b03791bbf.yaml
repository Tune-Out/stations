  notes: WEOW is a Top 40 station on 92.7 MHz licensed to Key West, Florida, branded on air as "92.7 WEOW" and pronounced "wow". It signed on as WFYN-FM on 20 February 1967 and took the WEOW calls in the mid-1980s. Its 100,000-watt signal reaches from Key Largo to within range of Havana, which makes it the southernmost CHR station in the continental United States. Fiorini Keys Media bought the station in July 2024 and kept the existing line-up; it is distributed on iHeartRadio but has no ownership connection to iHeartMedia. The previous catalog notes described it as a rock station, which is wrong.
