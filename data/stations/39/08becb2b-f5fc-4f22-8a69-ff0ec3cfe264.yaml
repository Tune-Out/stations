  audience: Finnish-speaking mainstream pop listeners nationwide, broadly adults 25–54
  format: Mainstream pop music — current and recent hits with a focus on contemporary chart pop
  notes: POPfm is a national Finnish commercial radio station that launched on 16 April 2025 after Mad Men Media Oy won a national FM licence in late 2024 in competitive bidding against domestic and international media groups. The station broadcasts on the FM network frequencies previously used by Yle's talk channel Yle Puhe (which closed in January 2024), giving POPfm roughly 98.7% population coverage. Leadership is drawn from Swedish parent Mad Men Media AB (CEO Mattias Gustavsson, chairman Robert Persson) with former Bauer Media Finland customer-care director Cia Heritty as COO; the parent company has operated multiple commercial FM stations across Sweden since 2013. The stream itself is served from Mad Men Media's Swedish infrastructure at stream.madmenmedia.se.
