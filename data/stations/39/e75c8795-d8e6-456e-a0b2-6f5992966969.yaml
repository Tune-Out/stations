  operator: Tavr Media (ТАВР МЕДІА), Kyiv — Ukraine's largest private radio holding
  affiliations: none known (privately owned commercial broadcaster operating under Ukrainian National Council on TV and Radio Broadcasting licences); since 2022 broadcasts the United News telethon hourly news in line with national wartime media policy
  audience: Mass-market Ukrainian-speaking adult/young-adult listeners nationally and via online stream worldwide
  format: 'Contemporary hit radio (CHR) — Ukrainian and international pop hits, branded "Тільки хіти! №1 в Україні" (Only hits! #1 in Ukraine)'
  notes: Hit FM launched in 2002 and is one of Tavr Media's flagship music brands alongside Radio ROKS, Kiss FM, Melodiya FM, Radio Relax, Russkoye Radio Ukraine (rebranded after 2022) and Radio Bayraktar; signature programmes include the morning show "Хеппі Ранок" (Happy Morning), the listener-voted countdown "Хітова Дюжина" (Hit Dozen) and the artist-feature "Фан-зона"; broadcasts on FM across Ukrainian cities (Kyiv 96.4 MHz among others) and streams online at 320 kbps; like other Ukrainian commercial radios it shifted to majority Ukrainian-language music after the 2019/2022 quota laws.
  sources: https://www.hitfm.ua/, internal knowledge of Tavr Media and Ukrainian radio market
