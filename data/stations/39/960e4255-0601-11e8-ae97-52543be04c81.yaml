  notes: NDR Blue is a digital-only music channel of Norddeutscher Rundfunk, the ARD public broadcaster for northern Germany, launched on 2 May 2008 as NDR Musik Plus and distributed on DAB+, cable, satellite and online. It plays largely unhosted blocks of pop, rock, jazz, hip-hop and alternative music (NDR Blue Morning, NDR Blue After Work) together with repeats of NDR shows such as Nachtclub and ESC Update. In June 2025 NDR announced that the channel will be discontinued on 1 January 2027 as a cost-saving measure.
