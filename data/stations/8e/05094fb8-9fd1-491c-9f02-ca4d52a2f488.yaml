  operator: Polskie Radio S.A. (Polish Radio), the national public radio broadcaster of Poland
  affiliations: Owned by the Polish State Treasury; governed under Poland's public-broadcasting law; member of the European Broadcasting Union (EBU)
  audience: Polish-speaking general national audience; mature and family-oriented listeners across Poland
  format: Flagship general-interest public radio channel — news, current affairs, culture, drama, classical and Polish music, folk culture, documentary and educational programming
  notes: Program 1 Polskiego Radia (Jedynka, "The First") is the oldest and flagship channel of Polskie Radio, with origins tracing to the first Polish Radio broadcast on 18 April 1926; broadcasts nationally on long wave, FM and DAB+; flagship news show "Sygnały Dnia" (Signals of the Day) is one of Poland's most-listened-to morning programmes; the station has been at the centre of political controversies over public-media independence, especially during the 2016-2023 PiS government's reorganisation of public media under the National Media Council (Rada Mediów Narodowych) and again during the December 2023 forced restructuring by the new Tusk-led government; hosts the Radio Centre for Folk Culture (RCKL), the Polish Radio Theatre, the Polish Radio Symphony Orchestra and educational academy programming.
