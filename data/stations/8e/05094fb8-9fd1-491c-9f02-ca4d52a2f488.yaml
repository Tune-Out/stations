  notes: Program 1 Polskiego Radia (Jedynka) is the flagship general-interest channel of Polskie Radio S.A., Poland's national public broadcaster, tracing its origins to the first Polish Radio broadcast on 18 April 1926 and heard nationally on long wave, FM and DAB+. It carries news (flagship morning show Sygnały Dnia), current affairs, culture, radio drama and Polish music, and had a 4.3% national share in 2025. Polskie Radio has been formally 'in liquidation' since December 2023 amid the public-media restructuring but continues to operate normally. This catalogue stream URL is dead; the higher-voted Polskie Radio Jedynka entry is the canonical one.
