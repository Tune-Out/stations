  nature: public broadcaster
  operator: Vlaamse Radio- en Televisieomroeporganisatie (VRT), the public broadcaster of the Flemish Community of Belgium
  affiliations: EBU; established under the Flemish Media Decree and funded primarily by a management-contract grant from the Flemish Government plus limited advertising revenue
  audience: Dutch-speaking adults in Flanders and Brussels, broadly mid-30s and older, with a more news- and culture-oriented profile than sister station Studio Brussel
  format: Full-service public-radio mix of in-depth news, current affairs, culture, talk and adult-contemporary / classic-leaning pop and rock music
  notes: Radio 1 is one of VRT's five national radio networks (alongside Radio 2, Klara, Studio Brussel and MNM) and traces its roots back to the BRT/BRTN Eerste Net of Belgian public radio. The website radio1.be was migrated in 2024–2025 to a redirect into the VRT MAX platform (vrt.be/vrtmax/kanalen/radio-1/) as VRT consolidated its on-demand audio under VRT MAX. Notable programming includes the morning news magazine "De Ochtend," current-affairs/talk show "De Wereld Vandaag," interview formats and cultural shows such as "Touché" and "Interne Keuken," and political debate via "De zevende dag" radio counterparts. As a public broadcaster, VRT operates under a multi-year management contract ("beheersovereenkomst") with the Flemish Government and is editorially independent under Flemish media law.
  sources: internal knowledge only, https://radio1.be/
