  notes: Rádio Buteco Sertanejo is a small Brazilian internet-only station whose name evokes the "buteco" (neighbourhood bar/tavern) culture where traditional sertanejo music is a staple; programming focuses on traditional roots sertanejo (sertanejo raiz) rather than the modern sertanejo universitário that dominates Brazilian commercial radio, plus moda de viola (a regional viola-caipira ballad form) and romantic country; the schedule features named presenter shows such as "Sertanejo Bom Demais" with Kauan Kubaski; the site offers song dedications and listener requests and is distributed through Zeno.fm and an Amazon-published app.
