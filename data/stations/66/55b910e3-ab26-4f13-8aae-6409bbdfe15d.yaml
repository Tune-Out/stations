  notes: Mega 98.3 (LRJ457) is a Buenos Aires FM station that adopted its all-Argentine-rock identity in the early 2000s and is widely considered the flagship "rock nacional" station in Argentina; it has aired notable programmes such as "La Mega Banda" and morning/drive rock shows hosted by figures from the Argentine rock scene; over its history it has been owned by various commercial groups and was acquired by Grupo Octubre in the 2010s, broadcasting on 98.3 MHz with strong digital streaming reach.
