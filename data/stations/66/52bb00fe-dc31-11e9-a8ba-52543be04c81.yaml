  notes: Heart 90s is a decade-themed spin-off of Heart, the UK commercial network owned by Global Media & Entertainment, and is distributed on DAB+, the Global Player app, smart speakers and online rather than on FM. Output is a near-continuous automated rotation of 1990s pop and dance hits with minimal presentation, sitting alongside Global's Heart 70s, 80s, 00s, 10s, Dance, Musicals and Love streams. Global, controlled by Ashley Tabor-King and based at Leicester Square in London, also owns Capital, Classic FM, LBC, Smooth, Gold and Radio X. It is funded entirely by advertising; the "public-radio" tag carried in aggregator data is incorrect, as Heart is a purely commercial brand with no public-service remit.
