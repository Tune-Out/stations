  operator: RCN Radio (Radio Cadena Nacional S.A.S.), part of Organización Ardila Lülle — one of Colombia's two dominant private media conglomerates
  affiliations: none known (politically the Ardila Lülle group has historically been associated with center-right business interests but La Mega itself is youth entertainment, not news/politics)
  audience: Young Colombian listeners (roughly 15–35) in the Medellín / Aburrá Valley metropolitan area, with national resonance via the wider La Mega network
  format: Contemporary hits radio (CHR) — reggaetón, urbano, Latin pop, dance, and entertainment talk; high-energy morning shows with comedy bits and listener call-ins
  notes: La Mega is RCN Radio's flagship youth/urban music network launched in 1993; broadcasts in dozens of Colombian cities under one brand, with the Medellín signal on 92.9 FM serving Antioquia department; the national morning show "El Mañanero de La Mega" (originally hosted by Camilo Pardo "Tatán Mejía" / Lokillo Florez and various others) and afternoon urban-music programs anchor the schedule; format competes head-to-head with Caracol Radio's "Los 40" and "Tropicana" in the Colombian youth-radio segment; the parent Organización Ardila Lülle (founded by the late Carlos Ardila Lülle) also owns RCN Televisión, Postobón, and Atlético Nacional.
  sources: internal knowledge only
