  notes: SLAM (formerly Slam!FM) is a major Dutch commercial radio station owned by Talpa Network, the media empire of John de Mol; it broadcasts nationally on DAB+, cable, satellite, and online, with FM coverage in selected markets, and is part of Talpa's radio cluster alongside Radio 538, Radio 10, Sky Radio, and Radio Veronica; SLAM is one of the Netherlands' leading dance and youth music brands and has hosted notable Dutch DJs and presenters, with strong ties to Dutch EDM scene events such as ADE (Amsterdam Dance Event).
