  operator: Media Prima Audio (a division of Media Prima Berhad), Malaysia's largest commercial broadcaster
  affiliations: Part of the Media Prima radio family alongside Hot FM, Buletin FM, Kool FM and Molek FM; Media Prima Berhad's largest shareholder is the Malaysian government-linked Pelaburan MARA / political-aligned entities historically tied to UMNO
  audience: English-speaking urban Malaysians aged roughly 18–34, particularly in the Klang Valley
  format: Hot adult contemporary English-language CHR/HAC playing current and recent pop hits
  notes: Fly FM was launched in 2005 as Media Prima's English-language CHR station, broadcasting on 95.8 MHz Klang Valley and several other Malaysian frequencies; it is positioned as a youth-oriented top-40 brand and has hosted breakfast pairings such as Phat Fabes & Ben Ibrahim and Pietro & Nadia; on-air activity in recent years has shifted toward streaming via the Media Prima "Audio Visual" portal (flyfm.audio) and the CJ Wow Shop / Audio digital platforms; in 2018 Media Prima briefly closed several radio brands during a restructuring but Fly FM was retained as a key English brand.
