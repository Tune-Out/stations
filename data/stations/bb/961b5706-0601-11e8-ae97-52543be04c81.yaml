  affiliations: Slovenian public broadcasting system, EBU member; no religious or party-political affiliation
  audience: Slovenian-speaking adults nationwide, skewing younger and more urban than Radio Slovenija's flagship Prvi programme
  format: Adult contemporary music and lifestyle/news talk with a strong focus on Slovenian artists, sports coverage, and youth-oriented culture programming
  notes: Val 202 is the second radio programme of the public broadcaster RTV Slovenija, launched in 1972 as a more contemporary, music-driven counterpart to Radio Slovenija's First Programme; it is funded by the national licence fee (RTV prispevek) supplemented by limited advertising, and is regulated under the Radiotelevizija Slovenija Act; notable long-running strands include sports show "Naval na šport," music programmes "Glasba 202" and "Notice," and cultural strands "Kulturnice" and "Zgodbe," and it broadcasts FM nationwide as well as via DAB+ and online; the broadcaster has at times been subject to political controversy over editorial independence and government appointments to its supervisory bodies.
