  operator: Galei Tzahal ("גלי צה"ל", lit. "IDF Waves"), the official radio network of the Israel Defense Forces (IDF), operating under the Israeli Ministry of Defense
  affiliations: Israeli government / IDF; chief editor and station commander is an IDF officer; programming is produced by a mix of soldiers on national service and civilian journalists; subject to military censorship rules
  audience: general Israeli public, both civilian and military; Hebrew language; national coverage
  format: full-service news, current affairs, talk and music station; one of the two flagship news-and-talk networks in Israel alongside Kan Reshet Bet; sister music channel Galgalatz handles pop/traffic
  notes: Founded 24 September 1950 by order of then-Prime Minister David Ben-Gurion; despite its IDF status it has long been considered editorially independent and a leading source of political journalism in Israel; notable past hosts and contributors include Yaron Dekel, Razi Barkai, Ilana Dayan and Niv Raskin; the station's continued military operation has been politically contested, with periodic proposals to transfer or close it (notably by minister Yoav Galant in 2023 and ongoing debates under defence ministers in subsequent governments)
