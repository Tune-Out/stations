  notes: FluxFM is a privately licensed Berlin-based broadcaster that grew out of the former MotorFM (founded 2005) and rebranded to FluxFM in 2009; it holds a full radio license in Berlin (97.7 FM) plus regional FM in Stuttgart and Bremen, and operates over 30 thematic web-only sub-streams under the FluxMusic app umbrella - the "Techno Underground" channel is one of these, alongside "Sound of Berlin," "Berlin Beach House," and many genre-specific streams; the network positions itself with the slogan "next level radio" and describes itself as a "Flux Community"; programming spans electronic, indie, hip-hop, jazz, metal, ambient and retro formats reflecting Berlin's diverse music culture; the station is closely tied to the Berlin club / electronic music scene and often partners with festivals and labels.
