  notes: 'Intense Radio (''We Love Dance'') is an independent Dutch online dance station launched in March 2012 and run by a team of eight volunteer DJs from The Hague and Westland, with streaming servers hosted by Live-streams.nl in Amsterdam. It streams 24/7 without talk or filler: ''Just Dance'' (06:00-20:00 CET) plays dance and house classics from the 1990s to today with hourly Dutch news, and ''Night Sessions'' (20:00-06:00) plays newer tech-house, melodic techno and trance. Streams are offered in MP3, AAC+ and lossless FLAC; this entry is the 256/320 kbps MP3 feed.'
