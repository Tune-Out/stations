  notes: Nightride FM is a Berlin-based internet radio station dedicated to darksynth and related electronic genres. Darksynth (also called darkwave/darkpop) is a subgenre combining synthesizer-driven 1980s aesthetics with darker, cinematic and sometimes horror-themed elements, popular in gaming, film and cyberpunk communities. The genre has gained significant following in recent years through indie game soundtracks and streaming culture. Nightride FM serves as the primary curator for darksynth listening globally, with high-quality streams at 320 kbps MP3. The station's visual branding evokes cyberpunk and horror aesthetics consistent with the genre. Streams via stream.nightride.fm infrastructure. The community is notably international and engaged through Discord and social media.
