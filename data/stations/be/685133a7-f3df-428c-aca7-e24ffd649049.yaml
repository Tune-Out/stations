  nature: commercial
  operator: Darik Radio AD (currently part of a privately held Bulgarian media group; historically owned by founder Nedyalko Nedyalkov and later acquired by businessman Ognyan Donev's Investbank-linked interests)
  affiliations: editorially independent commercial news/talk broadcaster; no formal religious or party-political affiliations though it covers Bulgarian political life closely; publishes an "Етичен кодекс" (ethics code)
  audience: Bulgarian-speaking adults nationwide and online diaspora, news- and politics-oriented listeners
  format: news, talk, current affairs, sport and analysis with hourly bulletins and personality talk shows
  notes: Darik Radio is Bulgaria's first and most influential private news-talk radio, founded in Sofia in 1993 as one of the earliest private broadcasters in post-communist Bulgaria; broadcasts on FM nationally and operates the darik.bg digital platform "Дарик Диджитъл" featuring news, analysis and commentary; the station has been central to Bulgarian political journalism through hosts such as Nikolay (Niki) Kanchev and shows including "Денят на Дарик", "Дарик Кафе" and "Спортното шоу на Дарик"; ownership has changed several times - founder Nedyalko Nedyalkov sold a controlling stake in the late 2000s/early 2010s, and the group has since been linked to Bulgarian business interests around Investbank and the Donev family, raising occasional debate in local media about political pressure typical of the Bulgarian media landscape, though Darik continues to position itself on its ethics code and editorial independence.
  sources: https://darik.bg/, internal knowledge
