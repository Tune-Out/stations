  operator: Latvijas Radio (VSIA "Latvijas Radio"), Latvia's state-owned public service radio, under the joint Latvijas Sabiedriskais medijs (LSM) public-media umbrella
  affiliations: Member of the European Broadcasting Union (EBU); editorially independent of government but state-funded; portal hosted on lsm.lv
  audience: Latvian-speaking general adult audience nationwide; flagship news/talk channel of public radio
  format: News, current affairs, talk, analysis, cultural programmes and discussion in Latvian; the network's main news/information channel.
  notes: Latvijas Radio traces its history back to 1925, making it one of the oldest broadcasters in Europe; LR1 is the flagship news-and-talk channel of the five-station Latvijas Radio family (LR1 news/talk, LR2 popular music, LR3 Klasika classical/culture, LR4 Domas laukums Russian-language, LR5 Pieci.lv youth); since 2020 oversight has shifted to the Public Electronic Media Council (SEPLP) and content is published jointly with Latvijas Televizija via the LSM portal; widely seen as a key Latvian-language public-service news outlet, especially during regional security debates following Russia's invasion of Ukraine.
