  notes: Founded in 1991 just after the Velvet Revolution, Country Radio (originally branded "Country Rádio") is the Czech Republic's leading country-music broadcaster; it transmits via FM in Prague and other major cities and reaches roughly 83.4% population coverage via the Czech DAB+ digital network; its tagline is "klidné rádio do neklidné doby" (a calm radio for turbulent times); the station maintains close ties with Czech "tramping" subculture — a uniquely Czech back-to-nature, campfire-singing tradition rooted in the early 20th century — and stages an annual country/tramping festival; will mark its 35th anniversary in September 2026.
