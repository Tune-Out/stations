  operator: Mediengruppe RTL Deutschland (now part of RTL Group / Bertelsmann); 89.0 RTL is operated within RTL Radio Deutschland (the radio arm of Bertelsmann's RTL Group).
  affiliations: Part of Bertelsmann SE & Co. KGaA, Europe's largest media conglomerate (owned by the Mohn family); no political or religious affiliation, though Bertelsmann's broader media holdings include significant publishing and broadcasting influence in Germany.
  audience: Young adults 14-29 in eastern Germany — primarily Saxony, Saxony-Anhalt, Thuringia; German-speaking, "die jüngsten Hits" (newest hits) audience.
  format: Top-40 / contemporary hit radio (CHR) — current pop, dance, hip-hop and rock hits targeting the youth demographic; "89.0 RTL — Sachsens beste Morningshow" branding.
  notes: 89.0 RTL launched in 1992 in Halle (Saale) as one of the first private FM stations in the newly-reunified eastern German states (the "neue Bundesländer"); broadcasts on 89.0 MHz Halle plus a network of frequencies across Saxony-Anhalt, Saxony, and Thuringia; known for its long-running morning show and youth-focused promotions, club nights and music events; operates as part of RTL Group's German radio portfolio alongside stations like Antenne Bayern (formerly) and others; competes primarily with MDR Sputnik (public-broadcaster youth) and Radio PSR in the eastern German market.
  sources: internal knowledge only
