  format: Rock music format spanning classic rock, hard rock, rock ballads, blues and 80s/90s rock, supplemented with news, podcasts and morning talk; tagline "It Rocks!"
  notes: Rock FM is a Romanian national commercial rock-format radio launched in 2007 and operated by Grupul Media Camina alongside Magic FM and Dance FM; flagship shows include "Morning Glory" with Răzvan Exarhu, "Rockaholic" with Ciprian Muntele, "Rock Driver" with Cristian Hrubaru and "Puls Rock" with Doru Ionescu, plus the news podcast "Punctul pe Știri" with Magda Grădinaru; the station also runs community campaigns such as the "România are sânge de rocker" blood-donation drive; broadcasts on FM in Bucharest and major Romanian cities and streams online (including a Kiss FM Chișinău Moldovan partner listed on the site).
