  notes: 1.FM is a long-running Swiss-licensed internet radio network operating dozens of themed streams (Top 40, classical, dance, country, jazz, oldies, world) from Zug, Switzerland; it was one of the earliest pure-play internet radio brands, with origins in the early 2000s, and is distributed via TuneIn, iHeartRadio, vTuner, Sonos and direct streams from the strm*.1.fm CDN; the Bay Smooth Jazz channel is one of its flagship streams, programmed in the West Coast/Bay Area smooth-jazz tradition popularised by stations like KKSF and KIFM, mixing artists such as Boney James, Norman Brown and Brian Culbertson; the company is funded by advertising, listener donations and premium ad-free subscriptions, and its parent legal entity has reorganised under the 1cloud.fm brand for streaming infrastructure.
