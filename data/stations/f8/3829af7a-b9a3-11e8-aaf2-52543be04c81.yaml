  operator: Radio Mayak (Радиостанция «Маяк»), a federal radio channel operated by VGTRK (All-Russia State Television and Radio Broadcasting Company / ВГТРК), the Russian state media holding
  affiliations: Russian government; VGTRK is wholly state-owned and directly accountable to the federal government; aligned with official Kremlin editorial policy
  audience: Nationwide Russian-speaking audience, traditionally older and middle-aged listeners; broadcast across all of Russia and into post-Soviet states
  format: News, talk, music, sports, and social/lifestyle programming; mixed-format informational-entertainment station with hourly news and current affairs interspersed with popular Russian and international music
  notes: Mayak ("Lighthouse" / "Beacon") was launched on 1 August 1964 as the second main programme of Soviet All-Union Radio, designed to provide news every half hour interspersed with music as a more dynamic alternative to the staid First Programme; became a flagship Soviet news brand throughout the Cold War; after the USSR's dissolution it was transferred to VGTRK in the 1990s and reformatted multiple times; broadcasts via FM (Moscow 103.4 FM), AM, and online streams including the 128kbps MP3 stream catalogued here (icecast.vgtrk.cdnvideo.ru); after 2014 and especially after the 2022 invasion of Ukraine, VGTRK and Mayak have been sanctioned by the EU, UK, US, and other Western governments as a Russian state propaganda outlet; VGTRK head Oleg Dobrodeev is personally sanctioned by the EU; Mayak's editorial line strictly follows the Kremlin's narrative on the war in Ukraine, characterizing it as a "special military operation."
  sources: https://radiomayak.ru/ (timeout), internal knowledge
