  nature: public broadcaster
  operator: Nederlandse Publieke Omroep (NPO), with content commissioned from member broadcasters AVROTROS, BNNVARA, KRO-NCRV, MAX, EO and NTR
  affiliations: Dutch public broadcasting system; no commercial or party ownership
  audience: Older Dutch adults (50+), nostalgia listeners; Dutch language nationwide
  format: Evergreens, golden oldies and nostalgia hits from the 1950s–1980s mixed with talk, news bulletins from NOS, and personal-interest features
  notes: NPO Radio 5 is one of the national public radio channels of the Netherlands; launched in 1983 as Radio 5 (originally an information and minorities channel), it was rebranded in 2014 as Radio 5 Nostalgia and then renamed NPO Radio 5 with an evergreens-and-talk profile; broadcast on AM/MW historically, now distributed via DAB+, cable and internet streams; funded by Dutch public-media levy and limited advertising via Ster.
