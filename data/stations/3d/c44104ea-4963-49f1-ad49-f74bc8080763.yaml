  notes: Melodia FM (Мелодія FM) is a nationwide Ukrainian commercial music station owned by the TAVR Media holding, whose ultimate beneficial owner is founder Mykola Bagraev (Viktor Pinchuk exited the group's ownership in 2024). It traces its roots to the Kharkiv station Onyx (1994), took the Melodia name in 2000, launched in Kyiv on 95.2 FM on 2 January 2002 and, after a 2011 shutdown over unpaid frequency fees, resumed on 9 April 2012. It broadcasts from Kyiv via 38 transmitters covering some 64 cities, although transmitters in occupied Donetsk, Mariupol and Crimea have gone silent since 2022. The playlist centres on domestic and international hits of the 1990s and 2000s with modern Ukrainian music, and features shows such as Vivsianka-Show and Book in Bed; sister web streams include Melodia FM Romantic and Melodia Int.
