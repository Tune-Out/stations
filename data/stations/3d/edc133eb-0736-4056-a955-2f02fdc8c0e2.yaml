  notes: 'الجزيرة صوت is the audio-only HLS feed ("VOICE-AJA") of Al Jazeera Arabic, the flagship Arabic-language news channel of the Al Jazeera Media Network based in Doha, Qatar. The channel launched on 1 November 1996 with funding from the Emir of Qatar and remains state-funded while asserting editorial independence; it broadcasts 24-hour news, current affairs and debate shows such as The Opposite Direction to Arabic speakers across the Middle East and worldwide. Al Jazeera Arabic is influential but contested: it has been banned in Egypt since 2013 and in Israel since April 2024, was dropped by major Swiss providers in January 2026 over alleged Hamas propaganda, and is often described as more partisan than its English sister channel. The stream lets listeners follow the TV channel as radio.'
