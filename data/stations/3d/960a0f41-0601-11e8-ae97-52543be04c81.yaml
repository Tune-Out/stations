  format: 'Eclectic groove: funk, soul, disco, electronic, reggae and world music, DJ mixes and vinyl shows'
  notes: Radio Meuh is a French web-only music station created in 2007 in the Alpine ski village of La Clusaz, Haute-Savoie, by Philippe Thévenet and run as a loi 1901 association. It broadcasts 24 hours a day of hand-picked groove-oriented music spanning funk, soul, disco, electronic, reggae and world sounds, with shows such as Le Champ des Platines (vinyl) and DJ sessions, and supports itself through the Club AOP membership scheme and, since 2021, brief pre-roll ads. Despite its mountain origin it has large audiences in Paris, Lyon and Nantes, ranked 12th among France's 500 digital radios in early 2020 and won the Grand Prix Webradio in 2018. It is available via the website, iOS/Android apps and IPTV.
