  notes: WHYY-FM 90.9 MHz is Philadelphia's primary NPR member station, operated by the non-profit WHYY, Inc., which also runs WHYY-TV (PBS) and the digital newsroom WHYY News; the station famously produces and originates "Fresh Air with Terry Gross," one of NPR's flagship interview programmes, on the air since 1975 and nationally distributed since 1987; WHYY also produces "The Pulse" (a health-and-science magazine) and a range of regional civic-affairs programming; founded in 1954 as a public-television operation, the FM service launched in 1972; the station's main transmitter sits at the Roxborough antenna farm in Philadelphia and serves an estimated 6+ million people across PA, NJ and DE; "WHYY" originated as a nod to the question "Why Y? - Whyy not?" but is now a non-acronym call sign.
