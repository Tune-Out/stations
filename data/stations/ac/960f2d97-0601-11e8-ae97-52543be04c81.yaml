  notes: 1.FM is a pioneering Swiss-based internet radio network founded in 1998 and headquartered in Zug, Switzerland, operating a large family of genre-themed channels (Absolute Top 40, Bombay Beats, Jamz, Magic Soul Classics, etc.). ReggaeTrade Radio is its dedicated reggae channel, focused on roots reggae, dancehall, lovers rock, dub, and ska, programmed for a worldwide reggae audience. As a Swiss commercial pure-play internet broadcaster, the network is funded primarily through advertising and listener donations, and is not affiliated with any government, religious, or political body. 1.FM's infrastructure has more recently migrated to the 1cloud.fm platform.
