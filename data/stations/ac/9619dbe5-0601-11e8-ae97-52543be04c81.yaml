  audience: Adult Dutch-speaking listeners in the East Flanders (Oost-Vlaanderen) province; regional opt-out window of national Radio 2
  format: Adult contemporary/Dutch-language pop music station with regional news, weather, traffic and community programming from the Ghent-based East Flanders studios
  notes: Radio 2 is VRT's most-listened-to radio network and Flanders' top regional station, with five provincial windows (Antwerpen, Limburg, Oost-Vlaanderen, Vlaams-Brabant, West-Vlaanderen) inserting local news and shows into a shared national music stream; funded by Flemish government grants plus limited advertising under VRT's beheersovereenkomst (management contract); the Oost-Vlaanderen edition broadcasts from VRT's regional studios in Gent and has run flagship regional shows such as "Start Je Dag", "De Weekwatchers" and "Het Eiland".
