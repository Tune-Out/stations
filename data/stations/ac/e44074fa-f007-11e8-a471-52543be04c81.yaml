  nature: public broadcaster
  operator: Omrop Fryslân — the regional public broadcaster of the province of Friesland (Fryslân) in the Netherlands
  affiliations: Part of the Dutch regional public broadcasting system (RPO — Regionale Publieke Omroep); funded via the Dutch national/provincial public-media framework; no religious or political affiliation
  audience: Province of Friesland (~650,000 residents); Frisian and Dutch speakers, plus the Frisian diaspora online
  format: Frisian-language regional news, talk, and music — morning news ("Fryslân fan 'e moarn"), midday talk ("Goeiemiddei"), music shows ("Noardewyn," "De Jûn fan Fryslân"), and overnight "Fryslân nonstop"
  notes: Omrop Fryslân has roots going back to 1945 (radio) and became an autonomous regional broadcaster in 1988; it is unique among Dutch regional broadcasters in that it has a statutory obligation to broadcast primarily in the Frisian language (Frysk), an official minority language of the Netherlands recognized by the European Charter for Regional or Minority Languages; it operates radio, television (Omrop Fryslân Tsjil), and online services, and plays a central role in preserving and promoting Frisian language and culture; programming explicitly described as "it muzikale doarpsplein fan Fryslân" — the musical village square of Friesland.
  sources: https://www.omropfryslan.nl/radio
