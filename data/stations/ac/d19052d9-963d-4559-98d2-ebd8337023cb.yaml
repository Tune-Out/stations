  operator: Association Radio Meuh, an independent French associative radio organisation based in La Clusaz (Haute-Savoie)
  affiliations: none political; associative (loi 1901) French non-profit; member of independent music radio community
  audience: Electronic music, funk, soul, world music and DJ culture enthusiasts; primarily French and European listeners, with a mountain-resort lifestyle/skier audience
  format: Eclectic DJ-curated music - electronic, funk, soul, hip-hop, world music, jazz with live DJ sets and artist sessions
  notes: Radio Meuh launched in 2005 in La Clusaz ski resort in the French Alps and grew from a local FM station to an internationally streamed taste-making platform; broadcasts on 88.8 FM in the Aravis valley and online globally; known for the Radio Meuh Circus Festival, an annual electronic and circus arts festival held in La Clusaz; signature programmes include "Le Champ des Platines" (curated DJ series), "On Your Feat" (guest DJ showcase), and "La Maison de la Radio Meuh" (artist sessions); operates a Bandcamp/Spotify presence and a shop, sustained by membership subscriptions and partnerships; technical streaming hosted by Swiss provider Infomaniak
