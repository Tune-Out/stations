  notes: Cosmoradio (also styled Kosmoradio) operates on 95.1 MHz FM as a regional commercial station based in Thessaloniki, Greece's second-largest city. The station targets a broad mainstream audience with contemporary pop, rock and Greek music programming. Cosmoradio is one of several independent regional commercial broadcasters in Greece operating outside the major national networks. The station streams via onestreaming.com CDN at standard bitrate (128 kbps MP3). Website at cosmoradio.gr provides basic station information and scheduling. As a regional Thessaloniki broadcaster, the station focuses on local news, city events and northern Greek cultural programming.
