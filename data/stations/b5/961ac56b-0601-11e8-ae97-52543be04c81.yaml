  notes: Radio Swiss Jazz is an advertising-free music channel of Swiss public broadcaster SRG SSR, launched on 1 September 1998 in Bern alongside Radio Swiss Pop and Radio Swiss Classic. It plays a curated, uninterrupted mix of about 70% jazz with soul and blues, giving roughly half its airtime to Swiss musicians, and reaches around 62,000 daily listeners in Switzerland with worldwide reach online, on DAB+ and via satellite. Under its Enavant cost-cutting programme SRG offered the three Swiss Satellite Radio channels for sale in late 2025, with binding bids due by March 2026 and a change of ownership planned for 2027; Bespoke Media Group (James FM) has expressed interest, so the public-service status may change. The stream is served from SRG's srg-ssr.ch infrastructure.
