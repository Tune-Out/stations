  format: Public-service flagship news/talk and information channel — hourly news bulletins, current affairs, talk shows, sports, weather, and limited music
  notes: Rádio Slovensko (Radio Slovakia, also designated SRo1) is the flagship news-and-information channel of Slovakia's public broadcaster, operating since the dissolution of Czechoslovakia in 1993; historically run by Slovenský rozhlas (Slovak Radio) and then by Rozhlas a televízia Slovenska (RTVS) from 2011-2024, it was placed under the new STVR (Slovenská televízia a rozhlas) entity after a controversial 2024 reform passed by Robert Fico's government that abolished RTVS and was widely criticised by journalists, EU institutions, and press-freedom watchdogs as compromising the broadcaster's editorial independence; the channel carries flagship programmes including the morning show "Z prvej ruky," interviews, parliamentary coverage, and Slovak Radio Symphony Orchestra broadcasts.
