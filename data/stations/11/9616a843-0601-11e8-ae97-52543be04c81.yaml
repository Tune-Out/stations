  affiliations: Privately owned; Belhassen Trabelsi (Ben Ali's brother-in-law) held 13% before 2011 and the state seized that stake; management under legal pressure from the Saied government since 2023
  audience: Tunisian general public, mainly 20-39; Arabic/Tunisian dialect with some French
  format: 'General talk and music: news, morning shows, call-ins on social issues, sport and Tunisian and Arabic music'
  notes: Mosaïque FM is Tunisia's first private radio station, on air since 7 November 2003 from Montplaisir, Tunis, and consistently among the country's most-listened-to stations. It broadcasts on 94.9 MHz in Greater Tunis and on regional FM frequencies across the north, with programming in Tunisian Arabic and French mixing news, popular morning shows, call-in programmes on social issues, sport and music. Belhassen Trabelsi's 13% stake was confiscated after the 2011 revolution; the station is run by director general Noureddine Boutar, who was arrested in February 2023 in President Saied's crackdown on critics, released on bail in May 2023 and named in the 2025 "conspiracy case". It also runs themed web streams (Tarab, Gold, Tounsi, DJ).
