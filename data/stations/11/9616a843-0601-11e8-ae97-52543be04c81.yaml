  operator: Mosaique FM (private Tunisian media company), founded by Belhassen Trabelsi
  affiliations: none known officially; historically linked via ownership to the family of former president Ben Ali (Trabelsi family). After the 2011 revolution the station was placed under state receivership/management by the Tunisian government.
  audience: Tunisian general public, Arabic-speaking (Tunisian dialect / Maghrebi Arabic), nationwide
  format: General/talk radio with news, current affairs, sports, music, and call-in programs
  notes: Launched in 2003 as the first private commercial FM radio in Tunisia. One of the most listened-to radio stations in the country. After the 2011 Tunisian revolution, the station was confiscated by the state due to its ownership ties to the deposed regime, then continued operating under government-appointed administration. Known for popular morning shows and call-in programs covering social and political issues.
