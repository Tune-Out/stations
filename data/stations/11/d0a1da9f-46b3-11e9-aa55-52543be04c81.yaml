  notes: Today FM launched on 17 March 1997 as Radio Ireland and was renamed Today FM in early 1998; it became Ireland's second national commercial radio station and was acquired by Communicorp (founded by Denis O'Brien) in 2000-2001 along with several other Irish stations; in 2016 Communicorp sold Today FM and Newstalk-adjacent assets, and in 2021 Bauer Media completed acquisition of Communicorp's Irish stations (including Today FM); notable shows include "The Last Word with Matt Cooper," weekday programmes with Dave Moore and Dara Quilty, and "Weekend Breakfast with Alison Curtis"; broadcasts on FM nationwide and via the Go Loud Player app.
