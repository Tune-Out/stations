  notes: 92.9 Kiss FM is a major Athens commercial radio station broadcasting on 92.9 MHz, operated by KISS ΑΝΩΝΥΜΗ ΕΤΑΙΡΕΙΑ ΜΕΣΩΝ ΜΑΖΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ from Vassilissis Sofias 85, Marousi, Athens. It is part of the larger Kiss Group, which also operates KISS TV. Programming centres on pop and dance hits from the 1990s onward, with notable dayparts including the morning Breakfast Show (07:00–10:00), Drive Time (17:00–19:00), and the trademarked "Kiss at Work" feature offering "92 λεπτά μουσικής χωρίς διαφημίσεις" (92 minutes of music without advertisements). The station competes with other Athens-based mainstream music broadcasters such as Sfera, Easy and Rythmos in the youth-pop and adult-contemporary segments.
