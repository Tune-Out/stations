  operator: RNC MEDIA Inc. (private Quebec-based broadcasting group)
  affiliations: no formal political party tie, but the station is widely identified with right-wing, populist, libertarian-leaning, and Quebec-nationalist commentary; vocally critical of mainstream media, federal Liberal politics, the CRTC, and government regulation
  audience: French-speaking adults in greater Quebec City and the Capitale-Nationale region; demographic skews male and politically conservative/populist for Quebec
  format: Hot/conservative talk radio, news, sports commentary, and entertainment in French; signature shows include Le Retour de Radio X, Maurais Live (Dominic Maurais), Good Morning Quebec, and Suspect X (Jean-Francois Baril)
  notes: CHOI-FM has been broadcasting at 98.1 MHz since 1969 and rebranded as "Radio X" in 1997; the station became internationally known in 2004 when the CRTC revoked its license over complaints about hosts Jeff Fillion and Andre Arthur including defamatory and disparaging on-air comments, triggering an unprecedented 50,000-strong "Liberte de Parole" rally in Quebec City and a federal court appeal that ultimately allowed the station to continue operating under new ownership (Genex/RNC Media); the case is a landmark in Canadian broadcasting regulation and free-speech debate; the station has continued to court controversy with hosts including Dominic Maurais; flagship Quebec City station within a small Radio X network that has expanded to Saguenay and other markets
  sources: https://radiox.com/, internal knowledge of CHOI-FM history and the 2004 CRTC license revocation case
