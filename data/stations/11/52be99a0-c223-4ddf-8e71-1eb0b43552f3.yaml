  operator: Suspilne Movlennya (Ukrainian Public Broadcasting Company, UA:PBC / NSTU) / cross-channel pool of Ukrainian broadcasters
  affiliations: backed by the Ukrainian government during martial law; broadcast in cooperation with national TV groups (1+1 Media, StarLightMedia, Inter Media, Media Group Ukraine, My-Ukraina, Suspilne, Rada TV)
  audience: Ukrainian-speaking nationwide population during the Russian invasion; informational lifeline format
  format: "24/7 Ukrainian-language joint information telethon: war news, official statements, expert analysis, frontline updates"
  notes: "\"Єдині новини\" (\"United News\", also \"Єдиний марафон\" / #UAразом) is the audio feed of Ukraine's wartime joint news telethon launched 24 February 2022 immediately after Russia's full-scale invasion; initially aired on Rada TV and then merged channels from 1+1, ICTV, Inter, Ukraina, My-Ukraina, Suspilne (NSTU) and Rada into a single rolling news pool, with the radio simulcast distributed via the radioplayer.ua platform (the Ukrainian arm of the international Radioplayer consortium operated jointly by major Ukrainian broadcasters); seen domestically as a defensive information instrument under martial law but criticised by some media-freedom observers for narrowing pluralism; remained on air through 2025-2026 as the war continued."
  sources: https://en.wikipedia.org/wiki/United_News_(telethon), https://corp.suspilne.media/newsdetails/9664, https://radioplayer.ua/
