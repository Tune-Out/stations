  # Body paragraph for per-station localization. Wrap inline code (e.g. `localized:`) in backticks — the renderer escapes other HTML.
  # English: Every station's YAML file accepts an optional `localized:` block keyed by language code. Per locale, you can override the station name and supply a description, a one-line summary, and extra search keywords. Anything you leave out falls back to the canonical English data.
  faq.station_text.body: ملف YAML الخاص بكل محطة يقبل كتلة اختيارية باسم `localized:` مرتبطة برمز اللغة. لكل لغة، يمكنك توفير اسم بديل ووصف وموجز سطر واحد وكلمات مفتاحية إضافية. أي حقل غير معبأ يرجع إلى البيانات الإنجليزية الأصلية.
  # Heading: how to get in touch.
  # English: Where to ask
  faq.contact.title: أين تسأل
  # Body paragraph; the `{repo}` placeholder is replaced with the repo URL.
  # English: Issues and proposals live on GitHub at {repo}. The repository's README has the maintainer roster.
  faq.contact.body: الطلبات والمقترحات تُسجّل على GitHub في {repo}. ملف README في المستودع يحتوي على قائمة المسؤولين.
  # About section heading — invite to improve this locale.
  # English: Improve this language
  about.improve_translation.title: تحسين هذه اللغة
  # About paragraph explaining where translations live.
  # English: Translations are stored in a single YAML file per locale. Open the current language file on GitHub, edit the values under the `strings` section, and submit a pull request.
  about.improve_translation.body: تُخزَّن الترجمات في ملف YAML واحد لكل لغة. افتح ملف اللغة الحالية على GitHub، وعدّل القيم تحت قسم `strings`، ثم أرسِل طلب سحب.
  # Label inside the GitHub-edit CTA button on About (file path is appended in code).
  # English: Edit on GitHub
  about.improve_translation.edit: تعديل على GitHub
  # Anchor label for the GitHub PR-walkthrough docs link.
  # English: GitHub: proposing changes with pull requests
  about.improve_translation.pr_docs: "GitHub: اقتراح تغييرات عبر طلب سحب"
  # About view: sub-heading for the "Adding a new language" blurb.
  # English: Adding a new language
  about.add_language.title: إضافة لغة جديدة
  # About view: paragraph explaining the copy-and-rename flow for a brand-new locale. Wrap inline code (filenames, YAML keys, placeholders) in `backticks` — the renderer escapes all other HTML.
  # English: To add a new language, open a pull request that copies `src/spa/i18n/en.yaml` to a file named with the BCP-47 code of your target language — for example, rename it to `uk.yaml` to add Ukrainian — then translate the values under `strings:`. Keep the keys, comments, and any `{placeholders}` exactly as they appear. The catalog picks up the new locale automatically once the file is merged.
  about.add_language.body: لإضافة لغة جديدة، افتح طلب سحب ينسخ `src/spa/i18n/en.yaml` إلى ملف باسم رمز BCP-47 للغة المستهدفة — مثلاً سمِّه `uk.yaml` لإضافة الأوكرانية — ثم ترجم القيم تحت `strings:`. حافظ على المفاتيح والتعليقات و`{placeholders}` كما هي. سيتعرّف الكتالوج على اللغة الجديدة تلقائياً بمجرد دمج الملف.
