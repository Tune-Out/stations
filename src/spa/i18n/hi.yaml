  # Heading: per-station localized text.
  # English: Localizing individual stations
  faq.station_text.title: व्यक्तिगत स्टेशनों का स्थानीयकरण
  # Body paragraph for per-station localization.
  # English: Every station's YAML file accepts an optional <code>localized:</code> block keyed by language code. Per locale, you can override the station name and supply a description, a one-line summary, and extra search keywords. Anything you leave out falls back to the canonical English data.
  faq.station_text.body: प्रत्येक स्टेशन की YAML फ़ाइल भाषा कोड द्वारा अनुक्रमित एक वैकल्पिक <code>localized:</code> ब्लॉक स्वीकार करती है। प्रति लोकेल आप स्टेशन का नाम बदल सकते हैं और विवरण, एक-पंक्ति सारांश और अतिरिक्त खोज कीवर्ड दे सकते हैं। जो छोड़ देंगे वह सिद्धांत रूप में अंग्रेज़ी डेटा पर वापस आ जाएगा।
  # Heading: how to get in touch.
  # English: Where to ask
  faq.contact.title: कहाँ पूछें
  # Body paragraph; the `{repo}` placeholder is replaced with the repo URL.
  # English: Issues and proposals live on GitHub at {repo}. The repository's README has the maintainer roster.
  faq.contact.body: मुद्दे और प्रस्ताव GitHub पर {repo} में रहते हैं। रिपॉजिटरी का README अनुरक्षकों की सूची देता है।
  # About section heading — invite to improve this locale.
  # English: Improve this language
  about.improve_translation.title: इस भाषा को बेहतर बनाएँ
  # About paragraph explaining where translations live.
  # English: Translations are stored in a single YAML file per locale. Open the current language file on GitHub, edit the values under the `strings` section, and submit a pull request.
  about.improve_translation.body: अनुवाद हर लोकेल के लिए एक ही YAML फ़ाइल में रहते हैं। मौजूदा भाषा की फ़ाइल GitHub पर खोलें, `strings` सेक्शन के तहत मानों को संपादित करें, और एक पुल रिक्वेस्ट सबमिट करें।
  # Label inside the GitHub-edit CTA button on About (file path is appended in code).
  # English: Edit on GitHub
  about.improve_translation.edit: GitHub पर संपादित करें
  # Anchor label for the GitHub PR-walkthrough docs link.
  # English: GitHub: proposing changes with pull requests
  about.improve_translation.pr_docs: "GitHub: पुल रिक्वेस्ट से बदलाव सुझाएँ"
  # About view: sub-heading for the "Adding a new language" blurb.
  # English: Adding a new language
  about.add_language.title: नई भाषा जोड़ें
  # About view: HTML-allowed paragraph explaining the copy-and-rename flow for a brand-new locale.
  # English: To add a new language, open a pull request that copies <code>src/spa/i18n/en.yaml</code> to a file named with the BCP-47 code of your target language &mdash; for example, rename it to <code>uk.yaml</code> to add Ukrainian &mdash; then translate the values under <code>strings:</code>. Keep the keys, comments, and any <code>{placeholders}</code> exactly as they appear. The catalog picks up the new locale automatically once the file is merged.
  about.add_language.body: नई भाषा जोड़ने के लिए एक पुल रिक्वेस्ट खोलें जो <code>src/spa/i18n/en.yaml</code> को आपकी लक्ष्य भाषा के BCP-47 कोड वाली फ़ाइल में कॉपी करे &mdash; उदाहरण के लिए, यूक्रेनी जोड़ने के लिए उसे <code>uk.yaml</code> नाम दें &mdash; और फिर <code>strings:</code> के तहत मानों का अनुवाद करें। कुंजियाँ, टिप्पणियाँ और <code>{placeholders}</code> ज्यों के त्यों रखें। फ़ाइल मर्ज होते ही कैटलॉग नई लोकेल को अपने आप पहचान लेगा।
