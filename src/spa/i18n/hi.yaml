  # About section heading — privacy.
  # English: Privacy
  about.privacy.title: गोपनीयता
  # About body — privacy.
  # English: No accounts, no tracking from us. Recents, favorites, and collections live in your browser. Album-art lookups query Apple's public iTunes Search API with only the song title — no identifiers are sent. The site is served as static files from GitHub Pages, so GitHub's CDN sees your IP address and the page you requested like any other web host would. When you open a station's homepage or play its stream, your browser connects directly to that broadcaster's servers; they may log your IP address, user agent, listening duration, and other request metadata — Tune Out has no visibility into or control over what happens once your browser is talking to a third-party station.
  about.privacy.body: हम कोई खाता या ट्रैकिंग नहीं रखते। हाल के, पसंदीदा और संग्रह आपके ब्राउज़र में ही रहते हैं। एल्बम-आर्ट खोज Apple की सार्वजनिक iTunes Search API से केवल गाने का शीर्षक भेजकर की जाती है — कोई पहचानकर्ता नहीं भेजा जाता। साइट GitHub Pages से स्थिर फ़ाइलों के रूप में दी जाती है, इसलिए GitHub का CDN आपके IP पते और मांगी गई पेज को देख सकता है, जैसा कोई भी वेब होस्ट देखता है। जब आप किसी स्टेशन का होमपेज खोलते हैं या उसका स्ट्रीम चलाते हैं, तो आपका ब्राउज़र सीधे उस प्रसारक के सर्वर से जुड़ता है; वे आपके IP, user-agent, सुनने की अवधि और अन्य अनुरोध मेटाडेटा को लॉग कर सकते हैं — एक बार आपका ब्राउज़र किसी तृतीय-पक्ष स्टेशन से जुड़ जाए, उसके बाद क्या होता है, इस पर Tune Out का न तो कोई दृश्य है और न ही नियंत्रण।
  # About section heading — contributing.
  # English: Contributing translations
  about.contributing.title: अनुवादों में योगदान दें
  # About body — contributing.
  # English: Every station page has an "Edit on GitHub" link. Add per-language description, summary, or keywords in the YAML's `localized:` block — your translation goes live on the next build.
  about.contributing.body: हर स्टेशन पृष्ठ पर "GitHub पर संपादित करें" लिंक है। YAML के `localized:` ब्लॉक में प्रति-भाषा विवरण, सारांश या कीवर्ड जोड़ें — आपका अनुवाद अगले बिल्ड में लाइव हो जाएगा।
