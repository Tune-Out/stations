  # About view: page title (also reused as kicker).
  about.title: About
  # About view: lead paragraph.
  about.lede: Tune Out is a small, non-commercial, open-source community project. It makes the world's internet radio stations easy to browse, search, and share — and publishes that catalog as fully open data.
  # About section heading — where the data comes from.
  about.data.title: Where the data comes from
  # About body — where the data comes from.
  about.data.body: Station metadata comes from a variety of public domain and free data sources, such as wikipedia.org and radio-browser.info.
  # About section heading — license.
  about.license.title: License
  # About body — license.
  about.license.body: Code and data are dedicated to the public domain under CC0 1.0 — the most permissive Creative Commons option.
  # About section heading — privacy.
  about.privacy.title: Privacy
  # About body — privacy.
  about.privacy.body: No accounts, no tracking from us. Recents, favorites, and collections live in your browser. Album-art lookups query Apple's public iTunes Search API with only the song title — no identifiers are sent. The site is served as static files from GitHub Pages, so GitHub's CDN sees your IP address and the page you requested like any other web host would. When you open a station's homepage or play its stream, your browser connects directly to that broadcaster's servers; they may log your IP address, user agent, listening duration, and other request metadata — Tune Out has no visibility into or control over what happens once your browser is talking to a third-party station.
  # About section heading — contributing.
  about.contributing.title: Contributing translations
  # About body — contributing.
  about.contributing.body: Every station page has an "Edit on GitHub" link. Add per-language description, summary, or keywords in the YAML's `localized:` block — your translation goes live on the next build.
  # Loading screen heading shown during first SQLite download.
  loading.title: Loading catalog…
  # Loading screen subtitle / one-time-download note.
  loading.subtitle: Downloading the database — this only happens once.
  # Loading screen text on the warm path (DB from OPFS cache).
  loading.cached: Loading from cache…
  # Generic error heading when a view fails to render.
  error.title: Something went wrong.
  # Generic Retry button label on error states.
  error.retry: Reload
  # Error panel button: wipe the cached database + redownload the latest from /data/stations.sqlite. Recovery path for schema-mismatch errors that plain reload can't fix.
  error.force_reload: Refresh database
  # Error panel: short explanation under the Refresh-database button so the user knows when to use it.
  error.force_reload_help: Clears the local cache and downloads the latest catalog. Use this if the app keeps showing errors after a normal reload.
  # Footer: non-commercial / no-tracking statement.
