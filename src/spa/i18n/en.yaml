  # Heading: per-station localized text.
  faq.station_text.title: Localizing individual stations
  # Body paragraph for per-station localization.
  faq.station_text.body: Every station's YAML file accepts an optional <code>localized:</code> block keyed by language code. Per locale, you can override the station name and supply a description, a one-line summary, and extra search keywords. Anything you leave out falls back to the canonical English data.
  # Heading: how to get in touch.
  faq.contact.title: Where to ask
  # Body paragraph; the `{repo}` placeholder is replaced with the repo URL.
  faq.contact.body: Issues and proposals live on GitHub at {repo}. The repository's README has the maintainer roster.
  # About section heading — invite to improve this locale.
  about.improve_translation.title: Improve this language
  # About paragraph explaining where translations live.
  about.improve_translation.body: Translations are stored in a single YAML file per locale. Open the current language file on GitHub, edit the values under the `strings` section, and submit a pull request.
  # Label inside the GitHub-edit CTA button on About (file path is appended in code).
  about.improve_translation.edit: Edit on GitHub
  # Anchor label for the GitHub PR-walkthrough docs link.
  about.improve_translation.pr_docs: "GitHub: proposing changes with pull requests"
  # About view: sub-heading for the "Adding a new language" blurb.
  about.add_language.title: Adding a new language
  # About view: HTML-allowed paragraph explaining the copy-and-rename flow for a brand-new locale.
  about.add_language.body: To add a new language, open a pull request that copies <code>src/spa/i18n/en.yaml</code> to a file named with the BCP-47 code of your target language &mdash; for example, rename it to <code>uk.yaml</code> to add Ukrainian &mdash; then translate the values under <code>strings:</code>. Keep the keys, comments, and any <code>{placeholders}</code> exactly as they appear. The catalog picks up the new locale automatically once the file is merged.
  # Settings page: kicker label above the title.
  settings.kicker: Settings
  # Settings page: H1 title; also used as the topbar settings-cog aria-label.
  settings.title: Settings
  # Settings page: lead paragraph.
  settings.lede: Adjust appearance, manage your recently played list, and export your stations.
  # Settings page: heading for the appearance card (theme + skin).
  settings.appearance.title: Appearance
  # Settings page: body for the appearance card.
  settings.appearance.body: Pick a theme (light, dark, or follow your system) and a visual skin.
  # Settings page: heading for the recently-played card.
  settings.recents.title: Recently played
  # Settings page: body for the recently-played card.
  settings.recents.body: Stations you tune in to are remembered locally. Nothing leaves your device.
  # Settings page: label for the number input that caps the recents list.
  settings.recents.max_label: Maximum entries to keep
  # Settings page: live count of stored recents. Uses `{n}` for the number.
  settings.recents.count: "{n} stored"
  # Settings page: clear-recents button label.
  settings.recents.clear: Clear recently played
  # Settings page: confirm() prompt before wiping the recents list.
  settings.recents.clear_confirm: Remove every entry from your recently-played list?
  # Settings page: heading for the export card.
  settings.export.title: Export playlists
  # Settings page: body for the export card.
  settings.export.body: Download your station lists as standard .pls files — open them in VLC, Foobar2000, Winamp, or any other player.
  # Settings page: button label for the recents → .pls export.
  settings.export.recents: Export recents (.pls)
  # Settings page: button label for the favorites → .pls export.
  settings.export.favorites: Export favorites (.pls)
  # Topbar mobile-only button: tooltip + aria-label for the Add-to-Home-Screen affordance.
  install.button.label: Add to Home Screen
  # Install modal: heading.
  install.title: Add Tune Out to your Home Screen
  # Install modal: explanatory body (no placeholders).
  install.body: Install the catalog as an app for full-screen playback and one-tap access from your Home Screen. No App Store account needed.
  # Install modal — iOS step 1. `{shareIcon}` is replaced with an inline share-icon SVG.
  install.ios.step1: Tap the Share button {shareIcon} in Safari's toolbar.
  # Install modal — iOS step 2 (HTML allowed; uses <strong> for the menu item name).
  install.ios.step2: Scroll down and choose <strong>Add to Home Screen</strong>.
  # Install modal — iOS step 3 (HTML allowed).
  install.ios.step3: Tap <strong>Add</strong> in the top-right corner. Tune Out will appear on your Home Screen.
  # Install modal — Android-non-Chromium step 1. `{shareIcon}` becomes the browser menu icon.
  install.android.step1: Open your browser's menu {shareIcon}.
  # Install modal — Android-non-Chromium step 2 (HTML allowed).
  install.android.step2: Tap <strong>Install app</strong> (or <strong>Add to Home screen</strong>).
  # Install modal — Android-non-Chromium step 3 (HTML allowed).
  install.android.step3: Confirm; Tune Out will appear in your app drawer.
  # Install modal: Close / Done button label (also the close-icon aria-label).
  install.close: Close
