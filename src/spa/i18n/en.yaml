  # Footer: public-domain license notice.
  footer.public_domain: All metadata in this catalog is in the public domain.
  # Footer: anchor label pointing at the source repo.
  footer.source: Source on GitHub
  # Footer: credit to radio-browser.info upstream.
  footer.upstream: "Data: radio-browser.info"
