  about.data.body: Sender-Metadaten stammen aus verschiedenen gemeinfreien und freien Datenquellen, etwa wikipedia.org und radio-browser.info.
  # About section heading — license.
  # English: License
  about.license.title: Lizenz
  # About body — license.
  # English: Code and data are dedicated to the public domain under CC0 1.0 — the most permissive Creative Commons option.
  about.license.body: Code und Daten sind gemeinfrei unter CC0 1.0 — der freizügigsten Creative-Commons-Option.
  # About section heading — privacy.
  # English: Privacy
  about.privacy.title: Datenschutz
  # About body — privacy.
  # English: No accounts, no tracking from us. Recents, favorites, and collections live in your browser. Album-art lookups query Apple's public iTunes Search API with only the song title — no identifiers are sent. The site is served as static files from GitHub Pages, so GitHub's CDN sees your IP address and the page you requested like any other web host would. When you open a station's homepage or play its stream, your browser connects directly to that broadcaster's servers; they may log your IP address, user agent, listening duration, and other request metadata — Tune Out has no visibility into or control over what happens once your browser is talking to a third-party station.
  about.privacy.body: Keine Konten, kein Tracking von uns. Verlauf, Favoriten und Sammlungen bleiben in deinem Browser. Cover-Art-Lookups fragen Apples öffentliche iTunes-Search-API nur mit dem Songtitel ab — keine Identifikatoren werden gesendet. Die Seite wird als statische Dateien über GitHub Pages ausgeliefert; das CDN von GitHub sieht also wie jeder andere Webhost deine IP-Adresse und die angeforderte Seite. Sobald du die Homepage eines Senders öffnest oder seinen Stream startest, verbindet sich dein Browser direkt mit den Servern dieses Senders; dort können IP-Adresse, User-Agent, Hördauer und weitere Anfrage-Metadaten geloggt werden — Tune Out hat keinen Einblick und keine Kontrolle darüber, was passiert, sobald dein Browser mit einer Drittanbieter-Station spricht.
  # About section heading — contributing.
  # English: Contributing translations
  about.contributing.title: Übersetzungen beitragen
  # About body — contributing.
  # English: Every station page has an "Edit on GitHub" link. Add per-language description, summary, or keywords in the YAML's `localized:` block — your translation goes live on the next build.
  about.contributing.body: Jede Senderseite hat einen „Auf GitHub bearbeiten“-Link. Füge sprachspezifische Beschreibung, Zusammenfassung oder Schlüsselwörter im YAML-Block `localized:` hinzu — deine Übersetzung erscheint beim nächsten Build.
