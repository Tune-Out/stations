  # About view: page title (also reused as kicker).
  # English: About
  about.title: Sobre
  # About view: lead paragraph.
  # English: Tune Out is a small, non-commercial, open-source community project. It makes the world's internet radio stations easy to browse, search, and share — and publishes that catalog as fully open data.
  about.lede: Tune Out é um pequeno projeto comunitário, sem fins lucrativos e open source. Torna as rádios da Internet pelo mundo fáceis de explorar, buscar e compartilhar — e publica esse catálogo como dados totalmente abertos.
  # About section heading — where the data comes from.
  # English: Where the data comes from
  about.data.title: De onde vêm os dados
  # About body — where the data comes from. Supports markdown links `[label](https://…)` and backtick code spans; other HTML is escaped.
  # English: Station metadata comes from a variety of public domain and free data sources, such as [wikipedia.org](https://wikipedia.org), [radio-browser.info](https://www.radio-browser.info), and [IPRD - International Public Radio Directory](https://iprd-org.github.io/iprd/).
  about.data.body: Os metadados das estações vêm de diversas fontes de domínio público e livres, como [wikipedia.org](https://wikipedia.org), [radio-browser.info](https://www.radio-browser.info) e [IPRD - International Public Radio Directory](https://iprd-org.github.io/iprd/).
  # About section heading — license.
  # English: License
  about.license.title: Licença
  # About body — license.
  # English: Code and data are dedicated to the public domain under CC0 1.0 — the most permissive Creative Commons option.
  about.license.body: Código e dados são dedicados ao domínio público sob CC0 1.0 — a opção mais permissiva da Creative Commons.
  # About section heading — privacy.
  # English: Privacy
  about.privacy.title: Privacidade
  # About body — privacy.
  # English: No accounts, no tracking from us. Recents, favorites, and collections live in your browser. Album-art lookups query Apple's public iTunes Search API with only the song title — no identifiers are sent. The site is served as static files from GitHub Pages, so GitHub's CDN sees your IP address and the page you requested like any other web host would. When you open a station's homepage or play its stream, your browser connects directly to that broadcaster's servers; they may log your IP address, user agent, listening duration, and other request metadata — Tune Out has no visibility into or control over what happens once your browser is talking to a third-party station.
  about.privacy.body: Sem contas, sem rastreamento da nossa parte. Recentes, favoritas e coleções ficam no seu navegador. As buscas de capa consultam a API pública iTunes Search da Apple apenas com o título da música — nenhum identificador é enviado. O site é servido como arquivos estáticos pelo GitHub Pages, então o CDN do GitHub vê o seu endereço IP e a página solicitada, como qualquer outro host. Ao abrir a página de uma estação ou tocar o seu stream, o navegador conecta-se diretamente aos servidores daquela emissora; ela pode registrar IP, user-agent, duração de escuta e outros metadados da requisição — o Tune Out não tem visibilidade nem controle sobre o que acontece assim que o seu navegador conversa diretamente com uma estação de terceiros.
  # About section heading — contributing.
  # English: Contributing translations
  about.contributing.title: Contribuir com traduções
  # About body — contributing.
  # English: Every station page has an "Edit on GitHub" link. Add per-language description, summary, or keywords in the YAML's `localized:` block — your translation goes live on the next build.
  about.contributing.body: Toda página de rádio tem um link "Editar no GitHub". Adicione descrição, resumo ou palavras-chave por idioma no bloco YAML `localized:` — sua tradução entra no próximo build.
