  # About paragraph explaining where translations live.
  # English: Translations are stored in a single YAML file per locale. Open the current language file on GitHub, edit the values under the `strings` section, and submit a pull request.
  about.improve_translation.body: Переводы хранятся в одном YAML-файле для каждой локали. Откройте файл текущего языка на GitHub, отредактируйте значения в секции `strings` и отправьте pull request.
  # Label inside the GitHub-edit CTA button on About (file path is appended in code).
  # English: Edit on GitHub
  about.improve_translation.edit: Редактировать на GitHub
  # Anchor label for the GitHub PR-walkthrough docs link.
  # English: GitHub: proposing changes with pull requests
  about.improve_translation.pr_docs: "GitHub: предложение изменений через pull request"
  # About view: sub-heading for the "Adding a new language" blurb.
  # English: Adding a new language
  about.add_language.title: Добавление нового языка
  # About view: paragraph explaining the copy-and-rename flow for a brand-new locale. Wrap inline code (filenames, YAML keys, placeholders) in `backticks` — the renderer escapes all other HTML.
  # English: To add a new language, open a pull request that copies `src/spa/i18n/en.yaml` to a file named with the BCP-47 code of your target language — for example, rename it to `uk.yaml` to add Ukrainian — then translate the values under `strings:`. Keep the keys, comments, and any `{placeholders}` exactly as they appear. The catalog picks up the new locale automatically once the file is merged.
  about.add_language.body: Чтобы добавить новый язык, откройте pull request, который скопирует `src/spa/i18n/en.yaml` в файл с именем, соответствующим коду BCP-47 целевого языка — например, переименуйте его в `uk.yaml`, чтобы добавить украинский — и переведите значения в секции `strings:`. Сохраните ключи, комментарии и `{placeholders}` в неизменном виде. После того как файл будет влит, каталог автоматически подхватит новую локаль.
  # Settings page: kicker label above the title.
  # English: Settings
  settings.kicker: Настройки
  # Settings page: H1 title; also used as the topbar settings-cog aria-label.
  # English: Settings
  settings.title: Настройки
  # Settings page: lead paragraph.
  # English: Adjust appearance, manage your recently played list, and export your stations.
  settings.lede: Настройте внешний вид, управляйте списком недавно прослушанного и экспортируйте станции.
  # Settings page: heading for the appearance card (theme + skin).
  # English: Appearance
  settings.appearance.title: Внешний вид
  # Settings page: body for the appearance card.
  # English: Pick a theme (light, dark, or follow your system) and a visual skin.
  settings.appearance.body: Выберите тему (светлая, тёмная или как в системе) и визуальный скин.
  # Settings page: heading for the recently-played card.
  # English: Recently played
  settings.recents.title: Недавно прослушанное
  # Settings page: body for the recently-played card.
  # English: Stations you tune in to are remembered locally. Nothing leaves your device.
  settings.recents.body: Прослушанные станции сохраняются локально. Ничего не покидает ваше устройство.
  # Settings page: label for the number input that caps the recents list.
  # English: Maximum entries to keep
  settings.recents.max_label: Максимум сохраняемых записей
  # Settings page: live count of stored recents. Uses `{n}` for the number.
  # English: {n} stored
  settings.recents.count: "Сохранено: {n}"
  # Settings page: clear-recents button label.
  # English: Clear recently played
  settings.recents.clear: Очистить недавно прослушанное
  # Settings page: confirm() prompt before wiping the recents list.
  # English: Remove every entry from your recently-played list?
  settings.recents.clear_confirm: Удалить все записи из списка недавно прослушанного?
  # Settings page: heading for the export card.
  # English: Export playlists
  settings.export.title: Экспорт плейлистов
  # Settings page: body for the export card.
  # English: Download your station lists as standard .pls files — open them in VLC, Foobar2000, Winamp, or any other player.
  settings.export.body: Скачайте списки станций как .pls — открывайте их в VLC, Foobar2000, Winamp и других плеерах.
  # Settings page: button label for the recents → .pls export.
  # English: Export recents (.pls)
  settings.export.recents: Экспорт недавнего (.pls)
  # Settings page: button label for the favorites → .pls export.
  # English: Export favorites (.pls)
  settings.export.favorites: Экспорт избранного (.pls)
  # Topbar mobile-only button: tooltip + aria-label for the Add-to-Home-Screen affordance.
  # English: Add to Home Screen
  install.button.label: Добавить на главный экран
  # Install modal: heading.
  # English: Add Tune Out to your Home Screen
  install.title: Добавьте Tune Out на главный экран
  # Install modal: explanatory body (no placeholders).
  # English: Install the catalog as an app for full-screen playback and one-tap access from your Home Screen. No App Store account needed.
  install.body: Установите каталог как приложение — полноэкранное воспроизведение и запуск в одно касание с главного экрана. Учётная запись App Store не требуется.
  # Install modal — iOS step 1. `{shareIcon}` is replaced with an inline share-icon SVG.
  # English: Tap the Share button {shareIcon} in Safari's toolbar.
  install.ios.step1: Нажмите кнопку «Поделиться» {shareIcon} на панели Safari.
  # Install modal — iOS step 2 (HTML allowed; uses <strong> for the menu item name).
  # English: Scroll down and choose <strong>Add to Home Screen</strong>.
  install.ios.step2: Прокрутите вниз и выберите <strong>На экран «Домой»</strong>.
  # Install modal — iOS step 3 (HTML allowed).
  # English: Tap <strong>Add</strong> in the top-right corner. Tune Out will appear on your Home Screen.
  install.ios.step3: Нажмите <strong>Добавить</strong> в правом верхнем углу. Tune Out появится на главном экране.
  # Install modal — Android-non-Chromium step 1. `{shareIcon}` becomes the browser menu icon.
  # English: Open your browser's menu {shareIcon}.
  install.android.step1: Откройте меню браузера {shareIcon}.
  # Install modal — Android-non-Chromium step 2 (HTML allowed).
  # English: Tap <strong>Install app</strong> (or <strong>Add to Home screen</strong>).
  install.android.step2: Нажмите <strong>Установить приложение</strong> (или <strong>Добавить на главный экран</strong>).
  # Install modal — Android-non-Chromium step 3 (HTML allowed).
  # English: Confirm; Tune Out will appear in your app drawer.
  install.android.step3: Подтвердите; Tune Out появится в списке приложений.
  # Install modal: Close / Done button label (also the close-icon aria-label).
  # English: Close
  install.close: Закрыть
