  # About body — where the data comes from. Supports markdown links `[label](https://…)` and backtick code spans; other HTML is escaped.
  # English: Station metadata comes from a variety of public domain and free data sources, such as [wikipedia.org](https://wikipedia.org), [radio-browser.info](https://www.radio-browser.info), and [IPRD - International Public Radio Directory](https://iprd-org.github.io/iprd/).
  about.data.body: Метаданные станций берутся из различных источников в общественном достоянии и свободных источников, таких как [wikipedia.org](https://wikipedia.org), [radio-browser.info](https://www.radio-browser.info) и [IPRD - International Public Radio Directory](https://iprd-org.github.io/iprd/).
  # About section heading — license.
  # English: License
  about.license.title: Лицензия
  # About body — license.
  # English: Code and data are dedicated to the public domain under CC0 1.0 — the most permissive Creative Commons option.
  about.license.body: Код и данные посвящены общественному достоянию по CC0 1.0 — самой свободной из опций Creative Commons.
  # About section heading — privacy.
  # English: Privacy
  about.privacy.title: Конфиденциальность
  # About body — privacy.
  # English: No accounts, no tracking from us. Recents, favorites, and collections live in your browser. Album-art lookups query Apple's public iTunes Search API with only the song title — no identifiers are sent. The site is served as static files from GitHub Pages, so GitHub's CDN sees your IP address and the page you requested like any other web host would. When you open a station's homepage or play its stream, your browser connects directly to that broadcaster's servers; they may log your IP address, user agent, listening duration, and other request metadata — Tune Out has no visibility into or control over what happens once your browser is talking to a third-party station.
  about.privacy.body: Никаких аккаунтов и никакой слежки с нашей стороны. История, избранное и подборки хранятся только в вашем браузере. Поиск обложек отправляет в открытый API iTunes Search от Apple только название трека — никакие идентификаторы не передаются. Сайт раздаётся как статические файлы из GitHub Pages, поэтому CDN GitHub видит ваш IP-адрес и запрошенную страницу так же, как любой другой веб-хост. Когда вы открываете домашнюю страницу станции или включаете её поток, браузер подключается напрямую к серверам этого вещателя; они могут записывать IP, user-agent, длительность прослушивания и другие метаданные запроса — Tune Out не имеет ни видимости, ни контроля над тем, что происходит после того, как ваш браузер начал общаться со сторонней станцией.
