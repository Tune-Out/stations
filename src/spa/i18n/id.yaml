  # English: Where the data comes from
  about.data.title: Dari mana datanya
  # About body — where the data comes from.
  # English: Station metadata comes from a variety of public domain and free data sources, such as wikipedia.org and radio-browser.info.
  about.data.body: Metadata stasiun berasal dari beragam sumber data domain publik dan bebas, seperti wikipedia.org dan radio-browser.info.
  # About section heading — license.
  # English: License
  about.license.title: Lisensi
  # About body — license.
  # English: Code and data are dedicated to the public domain under CC0 1.0 — the most permissive Creative Commons option.
  about.license.body: Kode dan data didedikasikan ke domain publik di bawah CC0 1.0 — opsi paling permisif dari Creative Commons.
  # About section heading — privacy.
  # English: Privacy
  about.privacy.title: Privasi
  # About body — privacy.
  # English: No accounts, no tracking from us. Recents, favorites, and collections live in your browser. Album-art lookups query Apple's public iTunes Search API with only the song title — no identifiers are sent. The site is served as static files from GitHub Pages, so GitHub's CDN sees your IP address and the page you requested like any other web host would. When you open a station's homepage or play its stream, your browser connects directly to that broadcaster's servers; they may log your IP address, user agent, listening duration, and other request metadata — Tune Out has no visibility into or control over what happens once your browser is talking to a third-party station.
  about.privacy.body: Tanpa akun, tanpa pelacakan dari kami. Daftar terakhir diputar, favorit, dan koleksi tetap berada di peramban Anda. Pencarian sampul album mengirim hanya judul lagu ke API publik iTunes Search milik Apple — tidak ada pengenal yang dikirim. Situs ini disajikan sebagai berkas statis dari GitHub Pages, sehingga CDN GitHub melihat alamat IP dan halaman yang Anda minta seperti host web lainnya. Ketika Anda membuka halaman muka sebuah stasiun atau memutar streaming-nya, peramban menyambung langsung ke server stasiun tersebut; mereka dapat mencatat IP, user-agent, durasi mendengarkan, dan metadata permintaan lain — Tune Out tidak dapat melihat maupun mengendalikan apa yang terjadi setelah peramban Anda berinteraksi dengan stasiun pihak ketiga.
  # About section heading — contributing.
  # English: Contributing translations
  about.contributing.title: Berkontribusi menerjemahkan
  # About body — contributing.
  # English: Every station page has an "Edit on GitHub" link. Add per-language description, summary, or keywords in the YAML's `localized:` block — your translation goes live on the next build.
  about.contributing.body: Setiap halaman stasiun punya tautan "Sunting di GitHub". Tambahkan deskripsi, ringkasan, atau kata kunci per bahasa pada blok YAML `localized:` — terjemahanmu tayang di build berikutnya.
