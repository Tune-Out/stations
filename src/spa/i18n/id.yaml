  # About view: HTML-allowed paragraph explaining the copy-and-rename flow for a brand-new locale.
  # English: To add a new language, open a pull request that copies <code>src/spa/i18n/en.yaml</code> to a file named with the BCP-47 code of your target language &mdash; for example, rename it to <code>uk.yaml</code> to add Ukrainian &mdash; then translate the values under <code>strings:</code>. Keep the keys, comments, and any <code>{placeholders}</code> exactly as they appear. The catalog picks up the new locale automatically once the file is merged.
  about.add_language.body: Untuk menambahkan bahasa baru, buka pull request yang menyalin <code>src/spa/i18n/en.yaml</code> ke berkas yang diberi nama kode BCP-47 bahasa target &mdash; misalnya, ganti namanya menjadi <code>uk.yaml</code> untuk menambahkan bahasa Ukraina &mdash; lalu terjemahkan nilai di bawah <code>strings:</code>. Biarkan kunci, komentar, dan <code>{placeholders}</code> apa adanya. Katalog akan mengenali lokal baru secara otomatis setelah berkas digabungkan.
