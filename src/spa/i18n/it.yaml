  # About view: lead paragraph.
  # English: Tune Out is a small, non-commercial, open-source community project. It makes the world's internet radio stations easy to browse, search, and share — and publishes that catalog as fully open data.
  about.lede: Tune Out è un piccolo progetto open-source non commerciale della comunità. Rende le radio Internet del mondo facili da sfogliare, cercare e condividere — e pubblica questo catalogo come dati completamente aperti.
  # About section heading — where the data comes from.
  # English: Where the data comes from
  about.data.title: Da dove vengono i dati
  # About body — where the data comes from.
  # English: Station metadata comes from a variety of public domain and free data sources, such as wikipedia.org and radio-browser.info.
  about.data.body: I metadati delle stazioni provengono da varie fonti di pubblico dominio e libere, come wikipedia.org e radio-browser.info.
  # About section heading — license.
  # English: License
  about.license.title: Licenza
  # About body — license.
  # English: Code and data are dedicated to the public domain under CC0 1.0 — the most permissive Creative Commons option.
  about.license.body: Codice e dati sono nel pubblico dominio sotto CC0 1.0 — l'opzione Creative Commons più permissiva.
  # About section heading — privacy.
  # English: Privacy
  about.privacy.title: Privacy
  # About body — privacy.
  # English: No accounts, no tracking from us. Recents, favorites, and collections live in your browser. Album-art lookups query Apple's public iTunes Search API with only the song title — no identifiers are sent. The site is served as static files from GitHub Pages, so GitHub's CDN sees your IP address and the page you requested like any other web host would. When you open a station's homepage or play its stream, your browser connects directly to that broadcaster's servers; they may log your IP address, user agent, listening duration, and other request metadata — Tune Out has no visibility into or control over what happens once your browser is talking to a third-party station.
  about.privacy.body: "Niente account, niente tracciamento da parte nostra. Recenti, preferiti e raccolte restano nel tuo browser. Le ricerche di copertina interrogano l'API pubblica iTunes Search di Apple con il solo titolo del brano — nessun identificatore viene inviato. Il sito è servito come file statici da GitHub Pages: il CDN di GitHub vede quindi il tuo indirizzo IP e la pagina richiesta, come qualsiasi altro host. Quando apri la pagina di una stazione o avvii il suo stream, il browser si connette direttamente ai server di quell'emittente; questi possono registrare il tuo IP, lo user-agent, la durata di ascolto e altri metadati della richiesta — Tune Out non ha visibilità né controllo su ciò che accade una volta che il tuo browser sta dialogando con una stazione di terze parti."
  # About section heading — contributing.
  # English: Contributing translations
  about.contributing.title: Contribuire alle traduzioni
  # About body — contributing.
  # English: Every station page has an "Edit on GitHub" link. Add per-language description, summary, or keywords in the YAML's `localized:` block — your translation goes live on the next build.
  about.contributing.body: Ogni scheda emittente ha un link «Modifica su GitHub». Aggiungi descrizione, sintesi o parole chiave per lingua nel blocco YAML `localized:` — la tua traduzione va online al prossimo build.
