<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tune Out">
  <title>Tune Out</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1"    stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- Notched tuning ring (large counter-clockwise arc, gap at 12 o'clock).
       Stroke is hand-tuned for crisp pixel snapping at 16 / 32 / 64 px. -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M 29 13 A 19 19 0 1 0 35 13"/>
  </g>
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
</svg>
